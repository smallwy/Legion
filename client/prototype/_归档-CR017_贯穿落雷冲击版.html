// ============ 1. 配置（照搬 BattleConfig.ts，改这里即可调平衡） ============

const CAMERA = { followLerp: 8 };

const PLAYER = { hp: 6, speed: 190, radius: 12, invincibleAfterHit: 0.8 };

// 三个槽位 = 三种技能形态，取消"全队发同一种子弹"
// 周期 = telegraph + cast + recovery，刻意不同（0.72 / 1.05 / 0.62）→ 施法自然错落
const ABILITY = {
  beam: { damage: 12, range: 320, halfWidth: 11, maxTargets: 4,

// 群体伤害递减：不加这条技能就是"一键清屏"（实测一局从 166s → 88.7s）
// 0.6 让一发 AOE 打满上限时的总伤害 ≈ 单体 × 2.3
const AOE_FALLOFF = 0.6;

const ENEMIES = {

const WAVE = {

const SATIETY = {

  //    0.7 只掉 63 点，结束时还剩 37 —— 掉不到"该喂"的区间。0.9 收在 19，需要喂 2 次。
  max: 100, start: 100, decayPerSec: 0.9,

  feedStun: 0.4, feedStunSpeedMul: 0.35, feedCd: 0.8,

const MEAT = { dropChance: 0.12, bossDrop: 6, orbSpeed: 0.6 };
const ENEMY_AI = { roamRadius: 220 };

const BOSS = {
  name: '腐甲巨虫', hp: 620, speed: 54, radius: 40, displaySize: 128,

const PROJECTILE = { petSpeed: 420, petRadius: 5, petLife: 1.2, enemyRadius: 7, enemyLife: 3 };

const FX = {
  maxParticles: 200, maxTexts: 12, maxRings: 8,
  damageText: 'kill',

const PALETTE = {

};

const UPGRADES = [
  { id:'damage',   name:'尖牙', desc:'英雄伤害 +18%',        max:5, weight:1.2,  color:PALETTE.danger },
  { id:'rate',     name:'急食', desc:'出招间隔 -9%',         max:5, weight:1.1,  color:PALETTE.excite },
  { id:'speed',    name:'轻步', desc:'移动速度 +8%',         max:3, weight:1.0,  color:PALETTE.safe },
  { id:'range',    name:'嗅探', desc:'索敌范围 +14%',        max:3, weight:0.9,  color:PALETTE.gold },
  { id:'feed',     name:'狼吞', desc:'喂食回复量 +25%',      max:3, weight:1.0,  color:PALETTE.excite },
  { id:'resist',   name:'慢饿', desc:'饱食度消耗 -16%',      max:3, weight:1.0,  color:PALETTE.safe },

  { id:'grit',     name:'皮实', desc:'全饿门槛 -12',         max:2, weight:0.8,  color:PALETTE.wood },

];

// ============ 2. 工具 ============
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rnd = (a, b) => a + Math.random() * (b - a);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);

// ============ 3. 画布与缩放 ============
const W = 960, H = 540;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = Math.round(W * s) + 'px';
  cv.style.height = Math.round(H * s) + 'px';
}
addEventListener('resize', resize);
resize();

// ============ 4. 精灵加载 ============
const IMG = {};
let assetsReady = false;
let assetsLeft = 0;
for (const k in SPRITE_SRC) {
  assetsLeft++;
  const im = new Image();
  im.onload = im.onerror = () => { if (--assetsLeft === 0) assetsReady = true; };
  im.src = SPRITE_SRC[k];
  IMG[k] = im;
}

// ============ 5. 输入 ============
const keys = new Set();
const edge = [];        // 本帧按下的键（边沿）
const KEYLIST = ['KeyW','KeyA','KeyS','KeyD','KeyF','KeyE','KeyQ','Space',
  'ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Digit1','Digit2','Digit3'];

addEventListener('keydown', (e) => {
  if (!e.repeat) edge.push(e.code);
  keys.add(e.code);
  if (KEYLIST.includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// 鼠标：选卡 + 重开
let mouse = { x: -1, y: -1, clicked: false };
function toGame(ev) {
  const r = cv.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * W, y: (ev.clientY - r.top) / r.height * H };
}
cv.addEventListener('mousemove', (ev) => { const p = toGame(ev); mouse.x = p.x; mouse.y = p.y; });
cv.addEventListener('mousedown', (ev) => { const p = toGame(ev); mouse.x = p.x; mouse.y = p.y; mouse.clicked = true; });

// ============ 6. 游戏状态 ============
const G = {
  phase: 'battle',        // battle | settlement
  paused: false,          // 升级选卡时冻结世界
  t: 0,
  hitStopT: 0,
  timeScale: 1,
  cam: { x: 0, y: 0 },
  shake: 0, shakeX: 0, shakeY: 0,
  endReason: '',
  stats: { kills: 0, orbs: 0, meat: 0, feeds: 0, bossKilled: false, timeMs: 0 },
  bossSpawned: false,
};

const player = {
  x: 0, y: 0, vx: 0, vy: 0, hp: PLAYER.hp,
  radius: PLAYER.radius, invT: 0, speedMul: 1, blinkT: 0,
};

const formation = { angle: 0, ax: 0, ay: 0 };
const _slot = { x: 0, y: 0 };

const squad = {
  heroes: [], satiety: SATIETY.start, feedCd: 0, stunT: 0, exciteT: 0, feeds: 0,
};

// 这三个数组改成 const + 原地压缩：每帧 filter 会新建数组，
// 既产生 GC 压力，也会让外部持有的引用（调试接口/测试）与游戏内部脱钩。
const enemies = [];
const projectiles = [];
const orbs = [];
// 技能表现实例（beam / bolt / nova）—— 判定即时或延迟，渲染只读它
const abilities = [];
let boss = null;

/** 原地压缩：保留 keep(x) 为真的元素，不新建数组 */
function compact(arr, keep) {
  let n = 0;
  for (let i = 0; i < arr.length; i++) {
    if (keep(arr[i])) arr[n++] = arr[i];
  }
  arr.length = n;
}

const wave = { idx: 0, toSpawn: 0, timer: WAVE.firstDelay, cleared: 0 };

const upg = {
  level: 1, exp: 0, expNeed: LEVEL.baseExp,
  pending: 0, choices: [], stacks: {}, stats: null,
};

const fx = { parts: [], texts: [], rings: [] };

// ============ 7. 队列 / 初始化 ============
function newStats() {
  return { damageMul:1, castMul:1, speedMul:1, rangeMul:1, feedMul:1,
           decayMul:1, multishot:0, critChance:0, gritBonus:0, leech:0 };
}

function recompute() {
  const n = upg.stacks, s = newStats();
  s.damageMul   = Math.pow(1.18, n.damage || 0);
  s.castMul     = Math.pow(0.91, n.rate || 0);
  s.speedMul    = Math.pow(1.08, n.speed || 0);
  s.rangeMul    = Math.pow(1.14, n.range || 0);
  s.feedMul     = Math.pow(1.25, n.feed || 0);
  s.decayMul    = Math.pow(0.84, n.resist || 0);
  s.multishot   = n.multishot || 0;
  s.critChance  = 0.10 * (n.crit || 0);
  s.gritBonus   = 12 * (n.grit || 0);
  s.leech       = 0.09 * (n.leech || 0);
  upg.stats = s;
}

function castCycle(kind) {
  const k = upg.stats.castMul;
  const a = ABILITY[kind];
  return { telegraph: a.telegraph*k, cast: a.cast*k, recovery: a.recovery*k };
}

/**
 * 索敌半径按技能取，否则会"抬手了但什么都没打到"：
 *  - 冲击波有效半径 96，沿用 340 会对着远怪放空气
 *  - 贯穿射程 320 < 340，目标落在 325 处必空，留 10px 余量
 */
function acquireRangeOf(h) {
  const base = HERO.acquireRange * upg.stats.rangeMul;
  if (h.kind === 'nova') return Math.min(base, ABILITY.nova.radius + 40);
  if (h.kind === 'beam') return Math.min(base, ABILITY.beam.range * upg.stats.rangeMul - 10);
  return base;
}

function starvingLine() {
  return Math.max(8, SATIETY.hungryLine - upg.stats.gritBonus);
}

function satietyTier() {
  if (squad.satiety >= SATIETY.fullLine) return 'full';
  if (squad.satiety >= starvingLine()) return 'hungry';
  return 'starving';
}

function powerMul() {
  switch (satietyTier()) {
    case 'full': return SATIETY.mulFull;
    case 'hungry': return SATIETY.mulHungry;
    default: return SATIETY.mulStarving;
  }
}

function resetGame() {
  G.phase = 'battle'; G.paused = false; G.t = 0;
  G.hitStopT = 0; G.timeScale = 1; G.shake = 0; G.shakeX = G.shakeY = 0;
  G.endReason = ''; G.bossSpawned = false;
  G.stats = { kills: 0, orbs: 0, meat: 0, feeds: 0, bossKilled: false, timeMs: 0 };

  player.x = 0; player.y = 0; player.vx = player.vy = 0;
  player.hp = PLAYER.hp; player.invT = 0; player.speedMul = 1; player.blinkT = 0;

  formation.angle = 0; formation.ax = 0; formation.ay = 0;

  squad.satiety = SATIETY.start; squad.feedCd = 0; squad.stunT = 0;
  squad.exciteT = 0; squad.feeds = 0;

  squad.heroes = [];
  for (let i = 0; i < HERO.count; i++) {
    slotTarget(i, _slot);
    squad.heroes.push({
      x: _slot.x, y: _slot.y, vx: 0, vy: 0,
      state: 'idle', stateT: 0, target: null,
      aimX: 1, aimY: 0, powerMul: 1,
      slot: i, kind: HERO_ABILITIES[i % HERO_ABILITIES.length],
    });
  }

  enemies.length = 0; projectiles.length = 0; orbs.length = 0; abilities.length = 0; boss = null;
  wave.idx = 0; wave.toSpawn = 0; wave.timer = WAVE.firstDelay; wave.cleared = 0;

  upg.level = 1; upg.exp = 0; upg.expNeed = LEVEL.baseExp;
  upg.pending = 0; upg.choices = []; upg.stacks = {}; upg.stats = newStats();

  fx.parts.length = 0; fx.texts.length = 0; fx.rings.length = 0;

  G.cam.x = player.x; G.cam.y = player.y;
}

// ============ 8. 表现层 ============
function hitStop(sec) {
  if (sec > G.hitStopT) G.hitStopT = sec;
}
function addShake(v) {
  if (v > G.shake) G.shake = v;
}

function fxHit(x, y, dx, dy, color) {
  const len = Math.hypot(dx, dy) || 1;
  const bx = dx / len, by = dy / len;
  const ang = Math.atan2(by, bx);
  for (let i = 0; i < 3; i++) {
    if (fx.parts.length >= FX.maxParticles) break;
    const a = ang + rnd(-0.6, 0.6);
    const sp = rnd(60, 160);
    fx.parts.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
      life: rnd(0.11, 0.2), max: 0.2, size: rnd(1.5, 2.6), color, drag: 6, grav: 0 });
  }
}

function fxBurst(x, y, color, n, mul) {
  mul = mul || 1;
  for (let i = 0; i < n; i++) {
    if (fx.parts.length >= FX.maxParticles) break;
    const a = rnd(0, TAU), sp = rnd(50, 230) * mul;
    fx.parts.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp + 40,
      life: rnd(0.3, 0.62) * mul, max: 0.62 * mul,
      size: rnd(1.8, 3.6) * mul, color, drag: 3.2, grav: 320 });
  }
}

function fxText(x, y, str, color, size) {
  if (fx.texts.length >= FX.maxTexts) return;
  fx.texts.push({ x, y, str, color: color || '#fff', size: size || 13,
                  life: 0.72, max: 0.72, vy: 34 });
}

function fxRing(x, y, color, r1, dur, width) {
  if (fx.rings.length >= FX.maxRings) return;
  fx.rings.push({ x, y, color, r1, t: 0, dur, width: width || 3 });
}

function fxTick(dt) {
  for (let i = 0; i < fx.parts.length; i++) {
    const p = fx.parts[i];
    if (p.life <= 0) continue;
    p.life -= dt;
    p.vx -= p.vx * p.drag * dt;
    p.vy -= p.vy * p.drag * dt;
    p.vy -= p.grav * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for (let i = 0; i < fx.texts.length; i++) {
    const t = fx.texts[i];
    if (t.life > 0) { t.life -= dt; t.y += t.vy * dt; }
  }
  for (let i = 0; i < fx.rings.length; i++) {
    const r = fx.rings[i];
    if (r.t < r.dur) r.t += dt;
  }
  // 每 0.5s 清一次死项（不是每帧 filter）
  if (!fx._gc || fx._gc <= 0) {
    fx._gc = 0.5;
    fx.parts = fx.parts.filter(p => p.life > 0);
    fx.texts = fx.texts.filter(t => t.life > 0);
    fx.rings = fx.rings.filter(r => r.t < r.dur);
  } else {
    fx._gc -= dt;
  }
}

// ============ 9. 玩家 ============
function updatePlayer(dt) {
  if (player.invT > 0) player.invT -= dt;
  if (player.blinkT > 0) player.blinkT -= dt;

  let dx = 0, dy = 0;
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  dx -= 1;
  if (keys.has('KeyD') || keys.has('ArrowRight')) dx += 1;
  if (keys.has('KeyS') || keys.has('ArrowDown'))  dy -= 1;
  if (keys.has('KeyW') || keys.has('ArrowUp'))    dy += 1;

  if (dx || dy) {
    const len = Math.hypot(dx, dy);
    // 斜向归一化：不然斜着走会快 41%
    player.vx = (dx / len) * PLAYER.speed * player.speedMul;
    player.vy = (dy / len) * PLAYER.speed * player.speedMul;
  } else {
    player.vx = 0; player.vy = 0;
  }
  player.x += player.vx * dt;
  player.y += player.vy * dt;

  const hw = FIELD.width / 2 - player.radius;
  const hh = FIELD.height / 2 - player.radius;
  player.x = clamp(player.x, -hw, hw);
  player.y = clamp(player.y, -hh, hh);
}

function damagePlayer(n) {
  if (player.invT > 0 || player.hp <= 0) return false;
  player.hp -= n;
  player.invT = PLAYER.invincibleAfterHit;
  player.blinkT = PLAYER.invincibleAfterHit;
  fxRing(player.x, player.y, PALETTE.danger, 70, 0.35, 3);
  fxBurst(player.x, player.y, PALETTE.danger, 6, 0.7);
  addShake(FX.shake.playerHit);
  hitStop(FX.hitStop.playerHit);
  if (player.hp <= 0) {
    player.hp = 0;
    endBattle('hp0');
  }
  return true;
}

// ============ 10. 队形与英雄 ============
function updateFormation(dt) {
  formation.ax = player.x;
  formation.ay = player.y;
  const sp = Math.hypot(player.vx, player.vy);
  if (sp < HERO.turnDeadzone) return;      // 静止不更新朝向，防抖动

  const target = Math.atan2(player.vy, player.vx);
  let d = target - formation.angle;
  while (d > Math.PI) d -= TAU;
  while (d <= -Math.PI) d += TAU;

  const maxTurn = HERO.turnRate * dt;
  if (d > maxTurn) d = maxTurn;
  else if (d < -maxTurn) d = -maxTurn;
  formation.angle += d;
}

function slotTarget(i, out) {
  const s = HERO_SLOTS[i % HERO_SLOTS.length];
  const c = Math.cos(formation.angle), sn = Math.sin(formation.angle);
  out.x = formation.ax + c * s[0] + sn * s[1];
  out.y = formation.ay + sn * s[0] - c * s[1];
  return out;
}

function updateSquad(dt) {
  // ---- 饱食度（全队共享一条）----
  squad.satiety = Math.max(0, squad.satiety - SATIETY.decayPerSec * upg.stats.decayMul * dt);
  if (squad.feedCd > 0) squad.feedCd -= dt;
  if (squad.stunT > 0) squad.stunT -= dt;
  if (squad.exciteT > 0) squad.exciteT -= dt;

  // 移速倍率唯一写入点：升级 × 喂食硬直
  player.speedMul = upg.stats.speedMul * (squad.stunT > 0 ? SATIETY.feedStunSpeedMul : 1);

  const pm = powerMul();

  updateFormation(dt);

  for (let i = 0; i < squad.heroes.length; i++) {
    const h = squad.heroes[i];
    h.powerMul = pm;
    const cycle = castCycle(h.kind);

    // 弹簧-阻尼跟随
    slotTarget(i, _slot);
    h.vx += (_slot.x - h.x) * HERO.followStiffness * dt;
    h.vy += (_slot.y - h.y) * HERO.followStiffness * dt;
    const damp = Math.max(0, 1 - HERO.followDamping * dt);
    h.vx *= damp; h.vy *= damp;
    h.x += h.vx * dt;
    h.y += h.vy * dt;

    updateCast(dt, h, cycle);
  }
}

function acquire(x, y, range) {
  let best = null, bd = range;
  for (const e of enemies) {
    if (!e.active || e.dying > 0) continue;
    const d = dist(x, y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  if (boss && boss.active && boss.dying <= 0) {
    const db = dist(x, y, boss.x, boss.y);
    if (db <= range && (!best || db < bd)) return boss;
  }
  return best;
}

function updateCast(dt, h, cycle) {
  h.stateT -= dt;
  if (h.state === 'idle') {
    if (h.stateT <= 0) {
      const t = acquire(h.x, h.y, acquireRangeOf(h));
      if (t) { h.target = t; h.state = 'telegraph'; h.stateT = cycle.telegraph; }
    }
  } else if (h.state === 'telegraph') {
    if (h.target && h.target.active && h.target.dying <= 0) {
      h.aimX = h.target.x - h.x;
      h.aimY = h.target.y - h.y;
    }
    if (h.stateT <= 0) {
      fireHero(h);
      h.state = 'cast'; h.stateT = cycle.cast;
    }
  } else if (h.state === 'cast') {
    if (h.stateT <= 0) { h.state = 'recovery'; h.stateT = cycle.recovery; }
  } else if (h.state === 'recovery') {
    if (h.stateT <= 0) { h.state = 'idle'; h.stateT = 0; h.target = null; }
  }
}

// ============ 10.5 英雄技能（CR-017）：贯穿 / 落雷 / 冲击 ============
// 我方不再产生任何投射物；敌方施法弹仍走 projectiles。

function fireHero(h) {
  const len = Math.hypot(h.aimX, h.aimY) || 1;
  const dx = h.aimX / len, dy = h.aimY / len;

  const crit = Math.random() < upg.stats.critChance;
  let dmg = ABILITY[h.kind].damage * h.powerMul * upg.stats.damageMul;
  if (crit) dmg *= 2;
  const extra = upg.stats.multishot;

  if (h.kind === 'beam') {
    castBeam(h.x, h.y, dx, dy, ABILITY.beam.range * upg.stats.rangeMul, dmg, crit, extra);
  } else if (h.kind === 'bolt') {
    // 落点取施法瞬间的目标位置，不是抬手时缓存的坐标（0.3s 内怪会走）
    const t = h.target;
    castBolt(h.x, h.y, t ? t.x : h.x + dx * 200, t ? t.y : h.y + dy * 200, dmg, crit, extra);
  } else {
    castNova(h.x, h.y, dmg, crit, extra);
  }
}

/** 贯穿：瞬发直线，立即结算。每层「连锁」追加一条平行光束（法线偏移 24px） */
function castBeam(x, y, dx, dy, range, dmg, crit, extra) {
  const a = ABILITY.beam;
  const nx = -dy, ny = dx;
  for (let i = 0; i <= extra; i++) {
    const off = extra === 0 ? 0 : (i - extra / 2) * 24;
    const sx = x + nx * off, sy = y + ny * off;
    const ex = sx + dx * range, ey = sy + dy * range;
    damageInSegment(sx, sy, ex, ey, a.halfWidth, dmg, a.maxTargets, crit);
    abilities.push({ kind: 'beam', x: sx, y: sy, ex, ey,
                     halfWidth: a.halfWidth, t: 0, life: a.fxLife, crit });
  }
}

/** 落雷：目标点预警 0.32s → 半径 54 爆发。伤害存在实例上（可能两发同时在场） */
function castBolt(x, y, tx, ty, dmg, crit, extra) {
  const a = ABILITY.bolt;
  for (let i = 0; i <= extra; i++) {
    let px = tx, py = ty;
    if (i > 0) {
      const ang = Math.random() * TAU, r = 55;
      px += Math.cos(ang) * r;
      py += Math.sin(ang) * r;
    }
    abilities.push({ kind: 'bolt', x: px, y: py, radius: a.radius,
                     t: 0, life: a.warn + a.fxLife, warn: a.warn,
                     fired: false, dmg, crit });
  }
}

/** 冲击：脚下炸开（立即结算）+ 击退，扩散环是余波 */
function castNova(x, y, dmg, crit, extra) {
  const a = ABILITY.nova;
  for (let i = 0; i <= extra; i++) {
    const radius = a.radius * Math.pow(1.4, i);
    const d = i === 0 ? dmg : dmg * 0.6;
    damageInRadius(x, y, radius, d, a.maxTargets, crit, a.knockback);
    abilities.push({ kind: 'nova', x, y, radius, t: 0, life: a.fxLife, crit });
  }
}

/** 圆范围伤害：BOSS + 杂兵。maxTargets 是平衡阀（不限上限时一发能清半屏） */
function damageInRadius(x, y, r, dmg, maxTargets, crit, kb) {
  let hits = 0;
  let bossHit = false;
  if (boss && boss.active && boss.dying <= 0 && dist(x, y, boss.x, boss.y) <= r + BOSS.radius) {
    damageBoss(dmg, 0, 0, crit);
    hits++;
    bossHit = true;
  }
  for (const e of enemies) {
    if (!e.active || e.dying > 0) continue;
    if (hits >= maxTargets) break;
    if (dist(x, y, e.x, e.y) > r + e.def.radius) continue;
    let kx = e.x - x, ky = e.y - y;
    if (kx === 0 && ky === 0) { kx = 0; ky = 1; }
    // 第 1 个满伤，之后按 AOE_FALLOFF 递减（BOSS 占了名额杂兵就从第二档起）
    const scale = Math.pow(AOE_FALLOFF, hits);
    damageEnemy(e, dmg * scale, kx * kb, ky * kb, crit);
    hits++;
  }
  return hits;
}

/** 线段扫掠伤害：点到线段距离 ≤ 半宽 + 敌人半径 */
function damageInSegment(x0, y0, x1, y1, halfWidth, dmg, maxTargets, crit) {
  const sx = x1 - x0, sy = y1 - y0;
  const len2 = sx * sx + sy * sy;
  const invLen = len2 > 0 ? 1 / Math.sqrt(len2) : 0;
  let hits = 0;
  if (boss && boss.active && boss.dying <= 0) {
    let t = len2 > 0 ? ((boss.x - x0) * sx + (boss.y - y0) * sy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = x0 + sx * t - boss.x, py = y0 + sy * t - boss.y;
    const rr = halfWidth + BOSS.radius;
    if (px * px + py * py <= rr * rr) { damageBoss(dmg, sx, sy, crit); hits++; }
  }
  for (const e of enemies) {
    if (!e.active || e.dying > 0) continue;
    if (hits >= maxTargets) break;
    let t = len2 > 0 ? ((e.x - x0) * sx + (e.y - y0) * sy) / len2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = x0 + sx * t - e.x, py = y0 + sy * t - e.y;
    const rr = halfWidth + e.def.radius;
    if (px * px + py * py > rr * rr) continue;
    const scale = Math.pow(AOE_FALLOFF, hits);
    damageEnemy(e, dmg * scale, sx * invLen, sy * invLen, crit);
    hits++;
  }
  return hits;
}

/** 推进技能实例：落雷到点结算，过期剔除 */
function updateAbilities(dt) {
  for (const fx of abilities) {
    fx.t += dt;
    if (fx.kind === 'bolt' && !fx.fired && fx.t >= fx.warn) {
      fx.fired = true;
      damageInRadius(fx.x, fx.y, fx.radius, fx.dmg, ABILITY.bolt.maxTargets, fx.crit, 0);
    }
  }
  compact(abilities, fx => fx.t < fx.life);
}

function tryFeed() {
  if (G.phase === 'settlement' || G.paused) return;
  if (squad.feedCd > 0) return;
  if (squad.satiety >= SATIETY.max) return;
  if (G.stats.meat < SATIETY.feedMeatCost) return;

  const before = squad.satiety;
  squad.satiety = Math.min(SATIETY.max, squad.satiety + SATIETY.feedAmount * upg.stats.feedMul);
  squad.feedCd = SATIETY.feedCd;
  squad.stunT = SATIETY.feedStun;
  squad.exciteT = 1.2;
  squad.feeds++;
  G.stats.feeds++;
  G.stats.meat -= SATIETY.feedMeatCost;

  const gain = Math.max(0, Math.round(squad.satiety - before));
  fxRing(player.x, player.y, PALETTE.gold, 110, 0.45, 3);
  fxText(player.x, player.y + 30, '+' + gain, PALETTE.safe, 13);
  for (const h of squad.heroes) fxBurst(h.x, h.y, PALETTE.gold, 3, 0.6);
  addShake(FX.shake.feed);
}

// ============ 11. 敌人 ============
function pickType() {
  const r = Math.random();
  let acc = 0;
  for (const k in ENEMIES) { acc += ENEMIES[k].weight; if (r <= acc) return k; }
  return 'walker';
}

function spawnEnemy(type, hunter, atX, atY) {
  const def = ENEMIES[type];
  let x, y;
  if (atX !== undefined && atY !== undefined) {
    // 测试/定点生成：不抖动、不钳制（判定测试必须拿到精确坐标）
    x = atX; y = atY;
  } else {
    const a = rnd(0, TAU);
    const r = WAVE.spawnRadius + rnd(-WAVE.spawnJitter, WAVE.spawnJitter);
    x = clamp(player.x + Math.cos(a) * r, -FIELD.width/2, FIELD.width/2);
    y = clamp(player.y + Math.sin(a) * r, -FIELD.height/2, FIELD.height/2);
  }
  enemies.push({
    type, def, x, y, vx: 0, vy: 0, hp: def.hp,
    state: hunter ? 'chase' : 'roam', stateT: 0, cd: rnd(0.5, 1.3),
    hunter: !!hunter, anchorX: x, anchorY: y,
    wanderX: x, wanderY: y, wanderT: 0,
    t: 0, phase: rnd(0, TAU), hitPunch: 0, dying: 0,
    active: true, flash: 0,
  });
}

function retargetWander(e) {
  const a = rnd(0, TAU), r = rnd(0, ENEMY_AI.roamRadius);
  e.wanderX = e.anchorX + Math.cos(a) * r;
  e.wanderY = e.anchorY + Math.sin(a) * r;
  e.wanderT = rnd(1.5, 3.5);
}

function moveToward(e, tx, ty, speed, dt, weave) {
  let dx = tx - e.x, dy = ty - e.y;
  const len = Math.hypot(dx, dy) || 1;
  dx /= len; dy /= len;
  if (weave) {
    const w = Math.sin(e.t * 4 + e.phase) * 0.45;
    const nx = dx * Math.cos(w) - dy * Math.sin(w);
    const ny = dx * Math.sin(w) + dy * Math.cos(w);
    dx = nx; dy = ny;
  }
  e.x += dx * speed * dt;
  e.y += dy * speed * dt;
}

function updateEnemies(dt) {
  const px = player.x, py = player.y;
  const hw = FIELD.width / 2, hh = FIELD.height / 2;

  for (const e of enemies) {
    if (!e.active) continue;

    if (e.dying > 0) {
      e.dying -= dt;
      if (e.dying <= 0) e.active = false;
      continue;
    }

    if (e.vx || e.vy) {
      const d = Math.max(0, 1 - 10 * dt);
      e.vx *= d; e.vy *= d;
      e.x += e.vx * dt; e.y += e.vy * dt;
    }

    e.t += dt; e.cd -= dt; e.wanderT -= dt;
    if (e.hitPunch > 0) e.hitPunch = Math.max(0, e.hitPunch - dt * 5);

    const distP = dist(px, py, e.x, e.y);
    updateEnemyAI(e, dt, distP, px, py);

    e.x = clamp(e.x, -hw + e.def.radius, hw - e.def.radius);
    e.y = clamp(e.y, -hh + e.def.radius, hh - e.def.radius);
  }

  separate();
  compact(enemies, e => e.active);
}

function updateEnemyAI(e, dt, distP, px, py) {
  const def = e.def;
  e.stateT -= dt;

  switch (e.state) {
    case 'roam':
      if (e.hunter || distP < def.aggroRange) { e.state = 'chase'; break; }
      moveToward(e, e.wanderX, e.wanderY, def.speed * 0.55, dt, false);
      if (dist(e.x, e.y, e.anchorX, e.anchorY) > ENEMY_AI.roamRadius) {
        e.wanderT = 0; e.wanderX = e.anchorX; e.wanderY = e.anchorY;
      }
      if (e.wanderT <= 0 || dist(e.x, e.y, e.wanderX, e.wanderY) < 12) retargetWander(e);
      break;

    case 'chase': {
      if (!e.hunter && distP > def.aggroRange * 1.2) {
        e.state = 'roam'; retargetWander(e); break;
      }
      if (def.projectileSpeed > 0) {
        if (distP > def.castRange * 0.75) {
          moveToward(e, px, py, def.speed, dt, true);
        } else {
          // 飞虫：绕圈保持距离（蛇形逼近）
          const ang = Math.atan2(e.y - py, e.x - px) + 0.9 * dt;
          const r = Math.max(60, distP);
          e.x = px + Math.cos(ang) * r;
          e.y = py + Math.sin(ang) * r;
        }
        if (distP < def.castRange && e.cd <= 0) { e.state = 'castwindup'; e.stateT = def.windup; }
      } else {
        if (distP > def.attackRange * 0.85) {
          moveToward(e, px, py, def.speed, dt, false);
        } else if (e.cd <= 0) {
          e.state = 'windup'; e.stateT = def.windup;
        }
      }
      break;
    }

    case 'windup':
      if (e.stateT <= 0) {
        if (dist(px, py, e.x, e.y) <= def.attackRange * 1.15) damagePlayer(def.damage);
        e.state = 'strike'; e.stateT = 0.15;
      }
      break;

    case 'strike':
      if (e.stateT <= 0) { e.state = 'recover'; e.stateT = 0.35; e.cd = def.attackCd; }
      break;

    case 'castwindup':
      if (e.stateT <= 0) {
        const dx = px - e.x, dy = py - e.y;
        const len = Math.hypot(dx, dy) || 1;
        projectiles.push({
          x: e.x, y: e.y,
          vx: dx / len * def.projectileSpeed, vy: dy / len * def.projectileSpeed,
          r: PROJECTILE.enemyRadius, dmg: def.damage, life: PROJECTILE.enemyLife,
          fromPet: false, crit: false,
        });
        e.state = 'cast'; e.stateT = 0.1;
      }
      break;

    case 'cast':
      if (e.stateT <= 0) { e.state = 'recover'; e.stateT = 0.4; e.cd = def.attackCd; }
      break;

    case 'recover':
      if (e.stateT <= 0) {
        e.state = (e.hunter || distP < def.aggroRange) ? 'chase' : 'roam';
      }
      break;
  }
}

/** 简易分离：O(n²)，32 只时 1024 次/帧，可接受 */
function separate() {
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i];
    if (!a.active || a.dying > 0) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j];
      if (!b.active || b.dying > 0) continue;
      const dx = b.x - a.x, dy = b.y - a.y;
      const min = a.def.radius + b.def.radius;
      const d2 = dx * dx + dy * dy;
      if (d2 > 0 && d2 < min * min) {
        const d = Math.sqrt(d2);
        const push = (min - d) * 0.5;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * push; a.y -= ny * push;
        b.x += nx * push; b.y += ny * push;
      }
    }
  }
}

function damageEnemy(e, dmg, dirX, dirY, crit) {
  if (!e.active || e.dying > 0) return;
  if (e.dying > 0) return;
  e.hp -= dmg;
  e.hitPunch = 1;
  const len = Math.hypot(dirX, dirY) || 1;
  const kb = e.type === 'tank' ? 20 : 90;
  e.vx += (dirX / len) * kb;
  e.vy += (dirY / len) * kb;

  const killed = e.hp <= 0;
  fxHit(e.x, e.y, dirX, dirY, crit ? PALETTE.gold : '#ffffff');
  if (killed) {
    e.dying = 0.28;
    onEnemyKilled(e);
    fxBurst(e.x, e.y, e.type === 'tank' ? '#5a6b7d' : (e.type === 'flyer' ? '#c0392b' : '#6b8e23'),
      e.type === 'tank' ? 14 : 10);
    hitStop(FX.hitStop.kill);
  }
  if (FX.damageText === 'all' || (FX.damageText === 'kill' && killed) || crit) {
    fxText(e.x, e.y + 14, String(Math.round(dmg)), crit ? PALETTE.gold : '#ffffff', crit ? 15 : 12);
  }
}

function onEnemyKilled(e) {
  G.stats.kills++;
  // 经验珠（30% 双珠）
  const n = Math.random() < 0.3 ? 2 : 1;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), sp = rnd(40, 130);
    orbs.push({ kind: 'exp', x: e.x, y: e.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
                r: 5, active: true, bob: rnd(0, TAU) });
  }
  if (Math.random() < MEAT.dropChance) {
    orbs.push({ kind: 'meat', x: e.x, y: e.y, vx: rnd(-40,40), vy: rnd(-40,40),
                r: 7, active: true, bob: rnd(0, TAU) });
  }
  // 啃噬：击杀回血
  if (upg.stats.leech > 0 && Math.random() < upg.stats.leech) {
    if (player.hp < PLAYER.hp) {
      player.hp++;
      fxText(player.x, player.y + 26, '+1', PALETTE.safe, 13);
    }
  }
}

// ============ 12. 弹道 ============
function updateProjectiles(dt) {
  for (const p of projectiles) {
    if (p.life <= 0) continue;
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    if (p.fromPet) {
      // 打杂兵
      let hit = false;
      for (const e of enemies) {
        if (!e.active || e.dying > 0) continue;
        if (dist(p.x, p.y, e.x, e.y) <= e.def.radius + p.r) {
          damageEnemy(e, p.dmg, p.vx, p.vy, p.crit);
          hit = true;
          break;
        }
      }
      // 打 BOSS
      if (!hit && boss && boss.active && boss.dying <= 0) {
        if (dist(p.x, p.y, boss.x, boss.y) <= BOSS.radius + p.r) {
          damageBoss(p.dmg, p.vx, p.vy, p.crit);
          hit = true;
        }
      }
      if (hit) p.life = 0;
    } else {
      // 敌弹打玩家
      if (player.invT <= 0 && dist(p.x, p.y, player.x, player.y) <= player.radius + p.r) {
        damagePlayer(p.dmg);
        p.life = 0;
      }
    }
  }
  compact(projectiles, p => p.life > 0);
}

// ============ 13. 战利品 ============
function updateOrbs(dt) {
  for (const o of orbs) {
    if (!o.active) continue;
    const d = dist(o.x, o.y, player.x, player.y);
    if (d < ORB.magnetRange) {
      const pull = 1 - d / ORB.magnetRange;
      const sp = ORB.maxSpeed * pull * pull;
      const dx = (player.x - o.x) / (d || 1), dy = (player.y - o.y) / (d || 1);
      o.x += dx * sp * dt;
      o.y += dy * sp * dt;
    } else {
      o.x += o.vx * dt; o.y += o.vy * dt;
      o.vx *= Math.max(0, 1 - 4 * dt);
      o.vy *= Math.max(0, 1 - 4 * dt);
    }
    if (dist(o.x, o.y, player.x, player.y) < ORB.collectRange) {
      o.active = false;
      if (o.kind === 'exp') {
        G.stats.orbs++;
        addExp(1);
      } else {
        G.stats.meat++;
        const b = fxText(player.x, player.y + 18, '+肉', '#e8a95c', 12);
      }
    }
  }
  compact(orbs, o => o.active);
}

// ============ 14. 升级 ============
function addExp(n) {
  if (upg.level >= LEVEL.maxLevel) return;
  upg.exp += n;
  let leveled = false;
  while (upg.exp >= upg.expNeed && upg.level < LEVEL.maxLevel) {
    upg.exp -= upg.expNeed;
    upg.level++;
    upg.expNeed = Math.round(LEVEL.baseExp * Math.pow(LEVEL.expGrowth, upg.level - 1));
    upg.pending++;
    leveled = true;
  }
  if (upg.level >= LEVEL.maxLevel) { upg.exp = 0; upg.expNeed = 0; }
  if (leveled && !upg.choices.length) openUpgrade();
}

function pickWeighted(pool) {
  let total = 0;
  for (const u of pool) total += u.weight;
  if (total <= 0) return null;
  let r = Math.random() * total;
  for (const u of pool) { r -= u.weight; if (r <= 0) return u; }
  return pool[pool.length - 1] || null;
}

function openUpgrade() {
  const pool = UPGRADES.filter(u => (upg.stacks[u.id] || 0) < u.max);
  const out = [];
  const n = Math.min(3, pool.length);
  for (let i = 0; i < n; i++) {
    const p = pickWeighted(pool);
    if (!p) break;
    out.push(p);
    pool.splice(pool.indexOf(p), 1);
  }
  upg.choices = out;
  if (!out.length) { upg.pending = Math.max(0, upg.pending - 1); return; }
  fxRing(player.x, player.y, PALETTE.gold, 200, 0.7, 4);
  fxText(player.x, player.y + 44, 'LV' + upg.level, PALETTE.gold, 16);
  G.paused = true;
}

function chooseUpgrade(id) {
  const def = UPGRADES.find(u => u.id === id);
  if (!def) return;
  if ((upg.stacks[id] || 0) >= def.max) return;
  upg.stacks[id] = (upg.stacks[id] || 0) + 1;
  recompute();
  upg.choices = [];
  upg.pending = Math.max(0, upg.pending - 1);
  G.paused = false;
  // 还有待处理的升级就继续弹
  if (upg.pending > 0) openUpgrade();
}

// ============ 15. 波次 ============
function waveCount(i) {
  return Math.round(WAVE.baseCount + WAVE.countPerWave * (i - 1));
}

function updateWave(dt) {
  if (G.phase !== 'battle') return;

  const alive = enemies.filter(e => e.active && e.dying <= 0).length;

  if (wave.toSpawn > 0) {
    if (alive < WAVE.maxAlive) {
      const type = pickType();
      spawnEnemy(type, true);
      wave.toSpawn--;
    }
    return;
  }

  // 本波已全部生成完，等清空
  if (wave.idx > 0 && alive === 0 && wave.timer <= 0) {
    if (wave.idx >= WAVE.total) return;
    wave.timer = WAVE.interval;
  }

  if (wave.timer > 0) {
    wave.timer -= dt;
    if (wave.timer > 0) return;
  }

  // 开下一波
  if (wave.idx >= WAVE.total) return;
  wave.idx++;

  if (wave.idx === WAVE.bossWave) {
    spawnBoss();
    return;
  }
  wave.toSpawn = waveCount(wave.idx);
}

// ============ 16. BOSS ============
function spawnBoss() {
  const a = rnd(0, TAU);
  const x = clamp(player.x + Math.cos(a) * 420, -FIELD.width/2 + 100, FIELD.width/2 - 100);
  const y = clamp(player.y + Math.sin(a) * 420, -FIELD.height/2 + 100, FIELD.height/2 - 100);
  boss = {
    x, y, vx: 0, vy: 0, hp: BOSS.hp, maxHp: BOSS.hp,
    state: 'dormant', stateT: BOSS.triggerDelay, cd: 1.5,
    dying: 0, hitPunch: 0, active: true, aoeT: 0, aoeX: 0, aoeY: 0,
    touchCd: 0, t: 0,
  };
  G.bossSpawned = true;
  addShake(9);
  fxRing(x, y, PALETTE.danger, 260, 1.0, 5);
  fxText(x, y + 70, '腐甲巨虫', PALETTE.danger, 20);
}

function updateBoss(dt) {
  if (!boss || !boss.active) return;
  const b = boss;
  b.t += dt;

  if (b.dying > 0) {
    b.dying -= dt;
    if (b.dying <= 0) {
      b.active = false;
      G.stats.bossKilled = true;
      endBattle('victory');
    }
    return;
  }

  if (b.hitPunch > 0) b.hitPunch = Math.max(0, b.hitPunch - dt * 5);
  if (b.cd > 0) b.cd -= dt;
  if (b.touchCd > 0) b.touchCd -= dt;

  const dP = dist(b.x, b.y, player.x, player.y);

  if (b.state === 'dormant') {
    b.stateT -= dt;
    if (b.stateT <= 0) b.state = 'chase';
    return;
  }

  if (b.state === 'chase') {
    if (dP > 120) {
      const dx = player.x - b.x, dy = player.y - b.y;
      const len = Math.hypot(dx, dy) || 1;
      b.x += dx / len * BOSS.speed * dt;
      b.y += dy / len * BOSS.speed * dt;
    }
    if (b.cd <= 0) {
      b.state = 'aoeWindup';
      b.stateT = BOSS.aoeWindup;
      b.aoeX = b.x; b.aoeY = b.y; b.aoeT = 0;
      b.cd = BOSS.aoeCd;
    }
  } else if (b.state === 'aoeWindup') {
    b.stateT -= dt;
    b.aoeT = 1 - Math.max(0, b.stateT) / BOSS.aoeWindup;
    if (b.stateT <= 0) {
      // 圈心伤害
      if (dist(player.x, player.y, b.aoeX, b.aoeY) <= BOSS.aoeRadius) {
        damagePlayer(BOSS.aoeDamage);
      }
      addShake(FX.shake.playerHit);
      fxRing(b.aoeX, b.aoeY, PALETTE.danger, BOSS.aoeRadius, 0.4, 4);
      fxBurst(b.aoeX, b.aoeY, PALETTE.danger, 16, 1.0);
      b.state = 'recover'; b.stateT = 0.7;
    }
  } else if (b.state === 'recover') {
    b.stateT -= dt;
    if (b.stateT <= 0) b.state = 'chase';
  }

  // 贴身推挤
  if (dP < BOSS.touchRange && b.touchCd <= 0) {
    damagePlayer(BOSS.touchDamage);
    b.touchCd = BOSS.touchCd;
  }

  const hw = FIELD.width / 2 - BOSS.radius;
  const hh = FIELD.height / 2 - BOSS.radius;
  b.x = clamp(b.x, -hw, hw);
  b.y = clamp(b.y, -hh, hh);
}

function damageBoss(dmg, dirX, dirY, crit) {
  const b = boss;
  if (!b || !b.active || b.dying > 0) return;
  b.hp -= dmg;
  b.hitPunch = 1;
  const len = Math.hypot(dirX, dirY) || 1;
  b.vx += (dirX / len) * 12;
  b.vy += (dirY / len) * 12;

  fxHit(b.x, b.y, dirX, dirY, crit ? PALETTE.gold : '#ffffff');
  if (FX.damageText !== 'off') {
    fxText(b.x + rnd(-20, 20), b.y + 40, String(Math.round(dmg)),
      crit ? PALETTE.gold : '#ffffff', crit ? 15 : 12);
  }

  if (b.hp <= 0) {
    b.hp = 0;
    b.dying = BOSS.deathTime;
    b.state = 'dead';
    // 最重的一次反馈
    fxBurst(b.x, b.y, PALETTE.gold, 30, 1.6);
    fxRing(b.x, b.y, PALETTE.gold, 260, 0.9, 5);
    fxRing(b.x, b.y, PALETTE.danger, 180, 0.6, 3);
    hitStop(FX.hitStop.bossDie);
    addShake(FX.shake.bossDie);
    for (let i = 0; i < MEAT.bossDrop; i++) {
      const a = rnd(0, TAU), sp = rnd(60, 180);
      orbs.push({ kind: 'meat', x: b.x, y: b.y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp,
                  r: 7, active: true, bob: rnd(0, TAU) });
    }
  } else if (crit) {
    hitStop(FX.hitStop.bossHit);
    addShake(FX.shake.bossHit);
  }
}

// ============ 17. 结束 ============
function endBattle(reason) {
  if (G.phase === 'settlement') return;
  G.phase = 'settlement';
  G.endReason = reason;
  G.stats.timeMs = Math.round(G.t * 1000);
  G.paused = false;
  upg.choices = [];
}

// ============ 18. 相机 ============
function updateCamera(dt) {
  const lerp = 1 - Math.exp(-CAMERA.followLerp * dt);
  G.cam.x += (player.x - G.cam.x) * lerp;
  G.cam.y += (player.y - G.cam.y) * lerp;

  const hw = W / 2, hh = H / 2;
  G.cam.x = clamp(G.cam.x, -FIELD.width/2 + hw, FIELD.width/2 - hw);
  G.cam.y = clamp(G.cam.y, -FIELD.height/2 + hh, FIELD.height/2 - hh);

  // 震屏必须在钳制之后，否则贴边时抖动会被吃掉
  if (G.shake > FX.shake.min) {
    G.shake *= Math.max(0, 1 - FX.shake.decay * dt);
    G.shakeX = rnd(-G.shake, G.shake);
    G.shakeY = rnd(-G.shake, G.shake);
  } else {
    G.shake = 0; G.shakeX = 0; G.shakeY = 0;
  }
}

// ============ 19. 逻辑步 ============
const FIXED = 1 / 60;

function step(dtReal) {
  // 顿帧计时吃真实 dt
  if (G.hitStopT > 0) {
    G.hitStopT -= dtReal;
    if (G.hitStopT <= 0) { G.hitStopT = 0; G.timeScale = 1; }
    else G.timeScale = FX.hitStop.timeScale;
  } else {
    G.timeScale = 1;
  }

  // 特效永远吃真实 dt（世界冻住、碎屑还在飞，冲击感就来自这个错位）
  fxTick(dtReal);

  if (G.phase === 'settlement') { updateCamera(dtReal); return; }
  if (G.paused) return;

  const dt = dtReal * G.timeScale;
  G.t += dt;
  G.stats.timeMs = Math.round(G.t * 1000);

  updatePlayer(dt);
  updateSquad(dt);
  // 技能在英雄之后推进：本帧刚 cast 的落雷立刻进入预警计时
  updateAbilities(dt);
  updateEnemies(dt);
  updateBoss(dt);
  updateProjectiles(dt);
  updateOrbs(dt);
  updateWave(dt);
  updateCamera(dt);
}

// ============ 20. 渲染 ============
let grassTile = null;

function makeGrassTile() {
  const s = 256;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const g = c.getContext('2d');
  g.fillStyle = '#3d6440';
  g.fillRect(0, 0, s, s);
  // 用确定性伪随机铺草，避免每帧变化
  let seed = 20261020;
  const r = () => { seed = (seed * 1664525 + 1013904223) & 0x7fffffff; return seed / 0x7fffffff; };
  for (let i = 0; i < 220; i++) {
    const x = r() * s, y = r() * s;
    const t = r();
    if (t < 0.55) {
      g.fillStyle = 'rgba(74,112,72,.75)';
      g.fillRect(x | 0, y | 0, 2, 2);
    } else if (t < 0.85) {
      g.fillStyle = 'rgba(56,92,58,.8)';
      g.fillRect(x | 0, y | 0, 3, 3);
    } else {
      g.fillStyle = 'rgba(118,152,96,.5)';
      g.fillRect(x | 0, y | 0, 1, 3);
    }
  }
  grassTile = c;
}

const SX = (x) => W / 2 + (x - G.cam.x) + G.shakeX;
const SY = (y) => H / 2 - (y - G.cam.y) + G.shakeY;

function drawSprite(key, x, y, size, scale, alpha) {
  const im = IMG[key];
  if (!im || !im.width) return;
  const w = size * (scale || 1), h = size * (im.height / im.width) * (scale || 1);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(im, Math.round(SX(x) - w / 2), Math.round(SY(y) - h / 2),
                Math.round(w), Math.round(h));
  if (alpha !== undefined) ctx.globalAlpha = 1;
}

function drawBackground() {
  if (!grassTile) makeGrassTile();
  const ts = 256;
  const left = G.cam.x - W / 2 - 8, right = G.cam.x + W / 2 + 8;
  const top = G.cam.y - H / 2 - 8, bot = G.cam.y + H / 2 + 8;
  const x0 = Math.floor(left / ts) * ts, x1 = Math.ceil(right / ts) * ts;
  const y0 = Math.floor(top / ts) * ts, y1 = Math.ceil(bot / ts) * ts;

  for (let wy = y0; wy <= y1; wy += ts) {
    for (let wx = x0; wx <= x1; wx += ts) {
      const sx = SX(wx), sy = SY(wy + ts);
      ctx.drawImage(grassTile, Math.round(sx), Math.round(sy), ts, ts);
    }
  }

  // 场地边界（让玩家知道不能出界）
  const hw = FIELD.width / 2, hh = FIELD.height / 2;
  ctx.strokeStyle = 'rgba(24,32,24,.55)';
  ctx.lineWidth = 6;
  ctx.strokeRect(SX(-hw), SY(hh), FIELD.width, FIELD.height);
}

function drawRings() {
  for (const r of fx.rings) {
    const k = Math.min(1, r.t / r.dur);
    const rad = r.r1 * k;
    ctx.strokeStyle = r.color;
    ctx.globalAlpha = 1 - k;
    ctx.lineWidth = r.width;
    ctx.beginPath();
    ctx.arc(SX(r.x), SY(r.y), rad, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of fx.parts) {
    if (p.life <= 0) continue;
    const a = Math.min(1, p.life / (p.max * 0.6));
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    const s = Math.max(1, p.size);
    ctx.fillRect(Math.round(SX(p.x) - s / 2), Math.round(SY(p.y) - s / 2),
                 Math.round(s), Math.round(s));
  }
  ctx.globalAlpha = 1;
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of fx.texts) {
    if (t.life <= 0) continue;
    const k = t.life / t.max;
    ctx.globalAlpha = Math.min(1, k * 1.8);
    ctx.font = 'bold ' + t.size + 'px "Segoe UI",system-ui,sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(16,12,20,.85)';
    ctx.strokeText(t.str, SX(t.x), SY(t.y));
    ctx.fillStyle = t.color;
    ctx.fillText(t.str, SX(t.x), SY(t.y));
  }
  ctx.globalAlpha = 1;
}

function drawTelegraphs() {
  // 敌人前摇圈（红=近战，橙=施法）
  for (const e of enemies) {
    if (!e.active || e.dying > 0) continue;
    const def = e.def;
    if (e.state === 'windup') {
      const k = 1 - Math.max(0, e.stateT) / def.windup;
      ctx.strokeStyle = PALETTE.danger;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(SX(e.x), SY(e.y), def.attackRange, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.28;
      ctx.fillStyle = PALETTE.danger;
      ctx.beginPath();
      ctx.arc(SX(e.x), SY(e.y), def.attackRange * k, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (e.state === 'castwindup') {
      const k = 1 - Math.max(0, e.stateT) / def.windup;
      ctx.strokeStyle = PALETTE.excite;
      ctx.globalAlpha = 0.85;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(SX(e.x), SY(e.y), def.castRange, 0, TAU);
      ctx.stroke();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = PALETTE.excite;
      ctx.beginPath();
      ctx.arc(SX(e.x), SY(e.y), def.castRange * k, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // BOSS AOE 圈：必须画在所有杂兵之上
  if (boss && boss.active && boss.state === 'aoeWindup') {
    const k = boss.aoeT;
    const cx = SX(boss.aoeX), cy = SY(boss.aoeY);
    ctx.strokeStyle = PALETTE.danger;
    ctx.lineWidth = 4;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.arc(cx, cy, BOSS.aoeRadius, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = PALETTE.danger;
    ctx.beginPath();
    ctx.arc(cx, cy, BOSS.aoeRadius * k, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawEnemies() {
  for (const e of enemies) {
    if (!e.active) continue;
    let sc = 1;
    if (e.hitPunch > 0) sc *= 1 + 0.3 * e.hitPunch;
    if (e.state === 'windup' || e.state === 'castwindup') sc *= 1.12;
    let alpha = 1;
    let size = e.def.displaySize;
    if (e.dying > 0) {
      const k = Math.max(0, e.dying / 0.28);
      sc *= k;
      alpha = k;
      // 死亡时上飘一点
      drawSprite(e.type === 'walker' ? 'enemy-walker'
               : e.type === 'flyer' ? 'enemy-flyer' : 'enemy-tank',
        e.x, e.y, size, sc, alpha);
      continue;
    }
    drawSprite(e.type === 'walker' ? 'enemy-walker'
             : e.type === 'flyer' ? 'enemy-flyer' : 'enemy-tank',
      e.x, e.y, size, sc, alpha);

    // 受击白闪（独立一层，不依赖是否有贴图）
    if (e.hitPunch > 0.05) {
      ctx.globalAlpha = e.hitPunch * 0.55;
      ctx.fillStyle = '#ffffff';
      const w = size * sc * 0.62;
      ctx.beginPath();
      ctx.arc(SX(e.x), SY(e.y), w / 2, 0, TAU);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

function drawBoss() {
  if (!boss || !boss.active) return;
  const b = boss;
  let sc = 1;
  if (b.hitPunch > 0) sc *= 1 + 0.12 * b.hitPunch;
  let alpha = 1;
  if (b.dying > 0) {
    const k = Math.max(0, b.dying / BOSS.deathTime);
    sc *= k; alpha = k;
  }
  drawSprite('enemy-tank', b.x, b.y, BOSS.displaySize, sc, alpha);
  if (b.hitPunch > 0.05) {
    ctx.globalAlpha = b.hitPunch * 0.5;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(SX(b.x), SY(b.y), BOSS.displaySize * 0.36, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function drawHeroes() {
  for (const h of squad.heroes) {
    // 缩放脉冲按**每只英雄自己的周期**算（三个技能节奏不同）
    const cycle = castCycle(h.kind);
    let s = 1;
    if (h.state === 'telegraph') s *= 1 + 0.18 * (1 - h.stateT / cycle.telegraph);
    else if (h.state === 'cast') s *= 1.28;
    else if (h.state === 'recovery') s *= 1 + 0.28 * (h.stateT / cycle.recovery);
    if (squad.exciteT > 0) s *= 1 + 0.12 * (squad.exciteT / 1.2);

    // 前摇环：颜色 = 饱食档位（这是"该喂了"的唯一提示）
    if (h.state === 'telegraph') {
      ctx.strokeStyle = satietyTier() === 'hungry' ? PALETTE.gold
        : (satietyTier() === 'starving' ? PALETTE.danger : 'rgba(255,215,0,.45)');
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(SX(h.x), SY(h.y), 26, 0, TAU);
      ctx.stroke();
    }
    drawSprite('pet', h.x, h.y, HERO.displaySize, s, 1);
  }
}

function drawPlayer() {
  const blink = player.blinkT > 0 && Math.floor(player.blinkT * 14) % 2 === 0;
  ctx.globalAlpha = blink ? 0.4 : 1;
  // 主角用金环标记（避免和 3 个英雄混在一起看不清）
  ctx.strokeStyle = PALETTE.gold;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(SX(player.x), SY(player.y), 24, 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 主角本体：用 pet 贴图 + 金色描边区分
  ctx.globalAlpha = blink ? 0.4 : 1;
  drawSprite('pet', player.x, player.y + 2, HERO.displaySize * 1.08, 1, 1);
  ctx.globalAlpha = 1;
  // 头顶一个金点，快速定位
  ctx.fillStyle = PALETTE.gold;
  ctx.beginPath();
  ctx.arc(SX(player.x), SY(player.y) - 40, 4, 0, TAU);
  ctx.fill();
}

/**
 * 技能表现（CR-017）。像素风下"技能感"靠形状，不靠光效：
 *  - 贯穿 = 一条会消失的锥形线（瞬发才有"斩"的意味）
 *  - 落雷 = 先圈后爆，预警圈**由大到小收缩**（与敌人前摇"由小涨到大"方向相反，敌我一眼可分）
 *  - 冲击 = 从脚下向外推的环（环是余波，判定在炸开瞬间）
 */
function drawAbilities() {
  // 落雷预警：地面标记，先画
  for (const fx of abilities) {
    if (fx.kind !== 'bolt' || fx.fired) continue;
    const p = Math.max(0, Math.min(1, fx.t / fx.warn));
    ctx.globalAlpha = 0.16 * (1 - p * 0.5);
    ctx.fillStyle = PALETTE.gold;
    ctx.beginPath();
    ctx.arc(SX(fx.x), SY(fx.y), fx.radius, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = PALETTE.gold;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(SX(fx.x), SY(fx.y), fx.radius, 0, TAU);
    ctx.stroke();
    // 收缩内圈：缩到中心 = 该炸了
    ctx.globalAlpha = 0.55;
    ctx.beginPath();
    ctx.arc(SX(fx.x), SY(fx.y), fx.radius * (1 - p), 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 冲击波：扩散环
  for (const fx of abilities) {
    if (fx.kind !== 'nova') continue;
    const p = Math.min(1, fx.t / fx.life);
    const r = fx.radius * (0.25 + 0.75 * p);
    ctx.globalAlpha = 0.85 * (1 - p * 0.8);
    ctx.strokeStyle = PALETTE.excite;
    ctx.lineWidth = Math.max(1, 5 - 4 * p);
    ctx.beginPath();
    ctx.arc(SX(fx.x), SY(fx.y), r, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // 贯穿：锥形收窄的光束（外层 + 白芯）
  for (const fx of abilities) {
    if (fx.kind !== 'beam') continue;
    const p = Math.min(1, fx.t / fx.life);
    const x0 = SX(fx.x), y0 = SY(fx.y), x1 = SX(fx.ex), y1 = SY(fx.ey);
    let ux = x1 - x0, uy = y1 - y0;
    const len = Math.hypot(ux, uy) || 1;
    ux /= len; uy /= len;
    const nx = -uy, ny = ux;
    const hw = fx.halfWidth;

    ctx.globalAlpha = 0.95 * (1 - p);
    ctx.fillStyle = '#FFF6D0';
    ctx.beginPath();
    ctx.moveTo(x0 + nx * hw, y0 + ny * hw);
    ctx.lineTo(x1 + nx * 2, y1 + ny * 2);
    ctx.lineTo(x1 - nx * 2, y1 - ny * 2);
    ctx.lineTo(x0 - nx * hw, y0 - ny * hw);
    ctx.closePath();
    ctx.fill();

    const cw = hw * 0.38;
    ctx.globalAlpha = 1 - p;
    ctx.fillStyle = fx.crit ? PALETTE.gold : '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(x0 + nx * cw, y0 + ny * cw);
    ctx.lineTo(x1 + nx * 0.5, y1 + ny * 0.5);
    ctx.lineTo(x1 - nx * 0.5, y1 - ny * 0.5);
    ctx.lineTo(x0 - nx * cw, y0 - ny * cw);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // 落雷爆发：中心闪光 + 扩散环，最后画（一闪而过）
  for (const fx of abilities) {
    if (fx.kind !== 'bolt' || !fx.fired) continue;
    const p = Math.min(1, (fx.t - fx.warn) / fx.life);
    const cx = SX(fx.x), cy = SY(fx.y);
    ctx.globalAlpha = 0.95 * (1 - p);
    ctx.fillStyle = '#FFF0A8';
    ctx.beginPath();
    ctx.arc(cx, cy, fx.radius * 0.55 * (1 - p * 0.6), 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.85 * (1 - p);
    ctx.strokeStyle = PALETTE.gold;
    ctx.lineWidth = Math.max(1, 4 - 3 * p);
    ctx.beginPath();
    ctx.arc(cx, cy, fx.radius * (0.55 + 0.65 * p), 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawProjectiles() {
  for (const p of projectiles) {
    ctx.fillStyle = p.fromPet ? (p.crit ? PALETTE.gold : '#FFF3C4') : PALETTE.foxPurple;
    ctx.beginPath();
    ctx.arc(SX(p.x), SY(p.y), p.r * (p.crit ? 1.35 : 1), 0, TAU);
    ctx.fill();
  }
}

function drawOrbs() {
  for (const o of orbs) {
    const bob = Math.sin(performance.now() * 0.006 + o.bob) * 1.8;
    const x = SX(o.x), y = SY(o.y) + bob;
    if (o.kind === 'exp') {
      ctx.fillStyle = PALETTE.safe;
      ctx.beginPath();
      ctx.moveTo(x, y - 5); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 5); ctx.lineTo(x - 5, y);
      ctx.closePath();
      ctx.fill();
    } else {
      // 肉块：方形 + 深色边，与经验珠形状和颜色双重区分
      ctx.fillStyle = '#e8a95c';
      ctx.fillRect(x - 4, y - 3, 8, 6);
      ctx.fillStyle = '#b06c33';
      ctx.fillRect(x - 4, y + 1, 8, 2);
    }
  }
}

// ---------------- HUD ----------------
function drawHearts() {
  for (let i = 0; i < PLAYER.hp; i++) {
    const x = 18 + i * 22, y = 20;
    ctx.fillStyle = i < player.hp ? PALETTE.danger : 'rgba(255,255,255,.14)';
    ctx.beginPath();
    // 简易心形：两个圆 + 三角
    ctx.arc(x, y - 2, 6, 0, TAU);
    ctx.arc(x + 9, y - 2, 6, 0, TAU);
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x - 6, y);
    ctx.lineTo(x + 15, y);
    ctx.lineTo(x + 4.5, y + 12);
    ctx.closePath();
    ctx.fill();
  }
}

function drawSatietyBar() {
  const x = 18, y = 42, w = 176, h = 12;
  const v = squad.satiety / SATIETY.max;

  // 底衬：半饿区间高亮（玩家要能一眼看出"最强档在哪"）
  const fullPx = SATIETY.fullLine / SATIETY.max * w;
  const hungryPx = satietyLine() / SATIETY.max * w;
  ctx.fillStyle = 'rgba(20,16,24,.75)';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = 'rgba(255,215,0,.16)';
  ctx.fillRect(x + hungryPx, y, fullPx - hungryPx, h);

  const tier = satietyTier();
  ctx.fillStyle = tier === 'hungry' ? PALETTE.gold
    : (tier === 'starving' ? PALETTE.danger : PALETTE.safe);
  ctx.fillRect(x, y, w * v, h);

  // 档位刻度
  ctx.strokeStyle = 'rgba(255,255,255,.35)';
  ctx.lineWidth = 1;
  [hungryPx, fullPx].forEach((px) => {
    ctx.beginPath();
    ctx.moveTo(x + px, y);
    ctx.lineTo(x + px, y + h);
    ctx.stroke();
  });

  ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = PALETTE.uiText;
  const label = tier === 'hungry' ? '半饿 ×1.5' : (tier === 'starving' ? '全饿 ×0.6' : '满饱 ×1.0');
  ctx.fillText('饱食 ' + Math.round(squad.satiety) + ' · ' + label, x + w + 8, y + h / 2);
}

function satietyLine() {
  return starvingLine();
}

function drawExpBar() {
  const x = 18, y = 60, w = 176, h = 6;
  const k = upg.expNeed > 0 ? clamp(upg.exp / upg.expNeed, 0, 1) : 1;
  ctx.fillStyle = 'rgba(20,16,24,.75)';
  ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
  ctx.fillStyle = PALETTE.foxPurple;
  ctx.fillRect(x, y, w * k, h);
  ctx.font = 'bold 11px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = PALETTE.uiText;
  ctx.fillText('Lv ' + upg.level, x + w + 8, y + h / 2);
}

function drawTopRight() {
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = PALETTE.uiText;
  const wv = Math.min(wave.idx, WAVE.total);
  ctx.fillText('第 ' + wv + ' / ' + WAVE.total + ' 波', W - 18, 20);

  ctx.font = '12px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(245,240,230,.7)';
  ctx.fillText('击杀 ' + G.stats.kills, W - 18, 40);

  // 肉块 + 可喂状态
  const canFeed = squad.feedCd <= 0 && squad.satiety < SATIETY.max
    && G.stats.meat >= SATIETY.feedMeatCost;
  ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = canFeed ? '#e8a95c' : 'rgba(245,240,230,.55)';
  ctx.fillText('肉块 ' + G.stats.meat + (canFeed ? '  [F 喂]' : ''), W - 18, 60);

  // 敌人剩余
  const alive = enemies.filter(e => e.active && e.dying <= 0).length;
  if (alive > 0) {
    ctx.font = '12px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(245,240,230,.55)';
    ctx.fillText('场上 ' + alive, W - 18, 80);
  }
}

function drawBossBar() {
  if (!boss || !boss.active || boss.dying > 0) return;
  const w = 420, h = 14, x = (W - w) / 2, y = 18;
  ctx.fillStyle = 'rgba(20,14,22,.82)';
  ctx.fillRect(x - 3, y - 3, w + 6, h + 6);
  const k = clamp(boss.hp / boss.maxHp, 0, 1);
  ctx.fillStyle = PALETTE.danger;
  ctx.fillRect(x, y, w * k, h);
  ctx.strokeStyle = 'rgba(255,255,255,.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 12px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = PALETTE.uiText;
  ctx.fillText(BOSS.name + '   ' + Math.ceil(boss.hp) + ' / ' + boss.maxHp, W / 2, y + h + 14);
}

function drawHint() {
  if (G.t > 12 || G.phase === 'settlement') return;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = Math.min(1, (12 - G.t) / 3) * 0.8;
  ctx.font = '13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = PALETTE.uiText;
  ctx.fillText('WASD 移动 · F 喂食（半饿火力最强） · E 撤离 · 1/2/3 选强化', W / 2, H - 24);
  ctx.globalAlpha = 1;
}

// ---------------- 升级面板 ----------------
const CARD_W = 200, CARD_H = 148, CARD_GAP = 20;

function cardRect(i) {
  const total = 3 * CARD_W + 2 * CARD_GAP;
  const x0 = (W - total) / 2 + i * (CARD_W + CARD_GAP);
  return { x: x0, y: 196, w: CARD_W, h: CARD_H };
}

function drawUpgradePanel() {
  if (!upg.choices.length) return;

  ctx.fillStyle = 'rgba(12,9,16,.72)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 22px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = PALETTE.gold;
  ctx.fillText('升级 · Lv ' + upg.level, W / 2, 140);
  ctx.font = '13px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(245,240,230,.65)';
  ctx.fillText('按 1 / 2 / 3 或点击卡片' + (upg.pending > 1 ? '（还有 ' + (upg.pending - 1) + ' 次待选）' : ''), W / 2, 168);

  for (let i = 0; i < upg.choices.length; i++) {
    const u = upg.choices[i];
    const r = cardRect(i);
    const hover = mouse.x >= r.x && mouse.x <= r.x + r.w
      && mouse.y >= r.y && mouse.y <= r.y + r.h;

    ctx.fillStyle = hover ? '#4a3f60' : PALETTE.uiPanel;
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = hover ? u.color : 'rgba(255,255,255,.18)';
    ctx.lineWidth = hover ? 3 : 1.5;
    ctx.strokeRect(r.x, r.y, r.w, r.h);

    // 色条
    ctx.fillStyle = u.color;
    ctx.fillRect(r.x, r.y, r.w, 5);

    ctx.textAlign = 'center';
    ctx.font = 'bold 17px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = PALETTE.uiText;
    ctx.fillText(u.name, r.x + r.w / 2, r.y + 40);

    ctx.font = '12.5px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(245,240,230,.8)';
    // 简单换行（描述都不长，手动断一次就够）
    wrapText(u.desc, r.x + r.w / 2, r.y + 72, r.w - 24, 18);

    const cur = upg.stacks[u.id] || 0;
    ctx.font = '11px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(245,240,230,.5)';
    ctx.fillText(cur > 0 ? '已强化 ' + cur + ' / ' + u.max : '可强化至 ' + u.max,
      r.x + r.w / 2, r.y + r.h - 20);

    // 按键角标
    ctx.font = 'bold 13px "Segoe UI",system-ui,sans-serif';
    ctx.fillStyle = u.color;
    ctx.textAlign = 'left';
    ctx.fillText(String(i + 1), r.x + 10, r.y + 20);
  }
  ctx.textAlign = 'center';
}

function wrapText(str, cx, y, maxW, lh) {
  const chars = str.split('');
  let line = '', lines = [];
  for (const ch of chars) {
    if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
    else line += ch;
  }
  if (line) lines.push(line);
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, y + i * lh);
}

// ---------------- 结算 ----------------
function drawSettlement() {
  if (G.phase !== 'settlement') return;
  ctx.fillStyle = 'rgba(12,9,16,.82)';
  ctx.fillRect(0, 0, W, H);

  const win = G.endReason === 'victory';
  const title = win ? '讨伐成功' : (G.endReason === 'hp0' ? '体力不支 · 撤退' : '主动撤离');
  const color = win ? PALETTE.gold : (G.endReason === 'hp0' ? PALETTE.danger : PALETTE.uiText);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = 'bold 34px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = color;
  ctx.fillText(title, W / 2, 168);

  const sec = Math.floor(G.stats.timeMs / 1000);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0');
  const ss = String(sec % 60).padStart(2, '0');

  const rows = [
    ['波次', Math.min(wave.idx, WAVE.total) + ' / ' + WAVE.total],
    ['等级', 'Lv ' + upg.level],
    ['击杀', G.stats.kills],
    ['喂食', G.stats.feeds + ' 次'],
    ['肉块', G.stats.meat],
    ['用时', mm + ':' + ss],
    ['BOSS', G.stats.bossKilled ? '已讨伐' : '未讨伐'],
  ];

  ctx.font = '15px "Segoe UI",system-ui,sans-serif';
  for (let i = 0; i < rows.length; i++) {
    const y = 232 + i * 26;
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(245,240,230,.55)';
    ctx.fillText(rows[i][0], W / 2 - 16, y);
    ctx.textAlign = 'left';
    ctx.fillStyle = PALETTE.uiText;
    ctx.fillText(String(rows[i][1]), W / 2 + 16, y);
  }

  ctx.textAlign = 'center';
  ctx.font = '14px "Segoe UI",system-ui,sans-serif';
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(performance.now() * 0.004);
  ctx.fillStyle = PALETTE.uiText;
  ctx.fillText('空格 / 点击鼠标 · 再来一局', W / 2, H - 60);
  ctx.globalAlpha = 1;

  // 无失败惩罚：撤退也带走战利品（红线②）
  ctx.font = '12px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = 'rgba(245,240,230,.4)';
  ctx.fillText('（无失败惩罚：无论哪种结局，战利品都带走）', W / 2, H - 32);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (!assetsReady) {
    ctx.fillStyle = '#14121a';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = PALETTE.uiText;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '16px "Segoe UI",system-ui,sans-serif';
    ctx.fillText('加载占位精灵…', W / 2, H / 2);
    return;
  }

  drawBackground();
  drawRings();
  drawOrbs();
  drawTelegraphs();
  drawEnemies();
  drawProjectiles();
  drawAbilities();
  drawHeroes();
  drawPlayer();
  drawBoss();
  drawParticles();
  drawTexts();

  // HUD
  drawHearts();
  drawSatietyBar();
  drawExpBar();
  drawTopRight();
  drawBossBar();
  drawHint();
  drawUpgradePanel();
  drawSettlement();
}

// ============ 21. 输入处理（每渲染帧一次） ============
function handleInput() {
  if (G.phase === 'settlement') {
    if (edge.includes('Space') || mouse.clicked) resetGame();
    edge.length = 0;
    mouse.clicked = false;
    return;
  }

  if (upg.choices.length) {
    if (edge.includes('Digit1')) chooseUpgrade(upg.choices[0].id);
    else if (edge.includes('Digit2') && upg.choices[1]) chooseUpgrade(upg.choices[1].id);
    else if (edge.includes('Digit3') && upg.choices[2]) chooseUpgrade(upg.choices[2].id);
    else if (mouse.clicked) {
      for (let i = 0; i < upg.choices.length; i++) {
        const r = cardRect(i);
        if (mouse.x >= r.x && mouse.x <= r.x + r.w
          && mouse.y >= r.y && mouse.y <= r.y + r.h) {
          chooseUpgrade(upg.choices[i].id);
          break;
        }
      }
    }
    edge.length = 0;
    mouse.clicked = false;
    return;
  }

  if (edge.includes('KeyF')) tryFeed();
  if (edge.includes('KeyE') || edge.includes('Escape')) endBattle('withdraw');

  edge.length = 0;
  mouse.clicked = false;
}

// ============ 22. 主循环 ============
let lastT = 0;
let acc = 0;

function frame(now) {
  requestAnimationFrame(frame);
  if (!lastT) lastT = now;
  let dt = (now - lastT) / 1000;
  lastT = now;
  // 切标签页回来 dt 会是几十秒，必须钳制，否则一帧内敌人瞬移
  dt = Math.min(dt, 0.25);

  handleInput();

  acc += dt;
  let steps = 0;
  while (acc >= FIXED && steps < 4) {
    step(FIXED);
    acc -= FIXED;
    steps++;
  }
  if (steps === 4) acc = 0;   // 防螺旋死亡

  render();
}

// ============ 23. 启动 ============
resetGame();
requestAnimationFrame(frame);

// 调试入口：控制台可用 window.PAWPACK（也是离线冒烟测试的唯一注入点）
window.PAWPACK = {
  G, player, squad, wave, upg, orbs,
  get enemies() { return enemies; },
  get boss() { return boss; },
  get projectiles() { return projectiles; },
  resetGame, endBattle,
  // 以下为自动化测试用，手玩不需要
  _step: step, _frame: frame, _keys: keys, _edge: edge,
  _handleInput: handleInput, _tryFeed: tryFeed, _choose: chooseUpgrade,
  _cardRect: cardRect, _isReady: () => assetsReady,
  _spawnExp: (x, y) => orbs.push({ kind: 'exp', x, y, vx: 0, vy: 0, r: 5, active: true, bob: 0 }),
  _aliveEnemies: () => enemies.filter(e => e.active && e.dying <= 0).length,
  _abilities: () => abilities,
  _spawnAt: (type, x, y) => spawnEnemy(type, false, x, y),
  // 技能判定直接暴露：这几条是"编译能过但一跑就错"的重灾区
  _castBeam: castBeam, _castBolt: castBolt, _castNova: castNova,
  _render: render,
};
</script>
