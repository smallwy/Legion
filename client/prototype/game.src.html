<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>吧唧军团 · PAWPACK</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1210;
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased; }
  #stage { position:absolute; width:1280px; height:720px; transform-origin:0 0;
    overflow:hidden; background:#FFE6C6; }

  /* ---------- L0 背景 ---------- */
  #bg { position:absolute; left:0; top:-40px; width:1280px; height:853px;
    pointer-events:none; user-select:none; -webkit-user-drag:none; }
  .fog-top { position:absolute; left:0; top:0; width:1280px; height:70px; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,246,232,.46), rgba(255,246,232,0)); }
  .fog-bot { position:absolute; left:0; bottom:0; width:1280px; height:152px; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,247,232,0) 0%, rgba(255,246,228,.50) 50%, rgba(255,244,222,.84) 100%); }

  /* ---------- L1 宠物 ---------- */
  #pets { position:absolute; inset:0; }
  .pet { position:absolute; transform-origin:50% 100%; cursor:pointer; }
  .pet img { position:absolute; pointer-events:none; user-select:none; -webkit-user-drag:none; }
  /* 接地投影：概念图 aiPet() 每只脚下一律画一个 rgba(74,44,24,.18) 的椭圆，
     rx = 0.34w / ry = 0.052h。没有这一层，立绘看起来是"贴"在画面上的纸片。 */
  .pet .shade { position:absolute; border-radius:50%; pointer-events:none;
    background:rgba(74,44,24,.18); }
  .pet .halo { position:absolute; left:50%; width:100%; height:26px;
    transform:translateX(-50%); border-radius:50%; opacity:0; pointer-events:none;
    background:radial-gradient(closest-side, rgba(255,226,150,.85), rgba(255,226,150,0) 72%);
    transition:opacity .18s ease; }
  .pet:hover .halo { opacity:1; }
  .pet:hover { filter:drop-shadow(0 0 10px rgba(255,230,150,.65)); }
  /* 出战标记：脚下一圈金色呼吸环 */
  .pet.active::after { content:""; position:absolute; left:50%; bottom:-4px;
    width:78%; height:16px; transform:translateX(-50%); border-radius:50%;
    border:2.6px solid rgba(255,196,72,.92);
    box-shadow:0 0 12px rgba(255,196,72,.75), inset 0 0 8px rgba(255,196,72,.5);
    animation:activePulse 1.9s ease-in-out infinite; }
  @keyframes activePulse { 0%,100% { opacity:.55; transform:translateX(-50%) scale(.94); }
    50% { opacity:1; transform:translateX(-50%) scale(1.04); } }

  .namecard { position:absolute; left:50%; transform:translateX(-50%) translateY(6px);
    bottom:calc(100% + 6px); padding:5px 11px 6px; border-radius:12px; white-space:nowrap;
    background:linear-gradient(180deg,#FFFEF8,#FAEEDA);
    border:2.4px solid rgba(122,80,52,.78);
    box-shadow:0 3px 0 rgba(74,44,24,.16), inset 0 2px 0 rgba(255,255,255,.6);
    opacity:0; transition:opacity .16s ease, transform .16s ease; pointer-events:none; }
  .pet:hover .namecard { opacity:1; transform:translateX(-50%) translateY(0); }
  .namecard b { font-size:14px; color:#5A3826; }
  .namecard i { font-style:normal; font-size:11px; color:#B07A28; margin-left:5px; letter-spacing:-1px; }
  .namecard em { display:block; font-style:normal; font-size:10.5px; color:rgba(112,72,46,.72); margin-top:2px; }

  /* ---------- 粒子层 ---------- */
  #fx { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .p { position:absolute; will-change:transform,opacity; font-weight:700;
    text-shadow:0 1px 2px rgba(140,80,40,.35); }
  .ripple { position:absolute; border-radius:50%; border:2.5px solid rgba(255,255,255,.92);
    pointer-events:none; }
  @keyframes rip { from { transform:scale(.25); opacity:.95; } to { transform:scale(2.4); opacity:0; } }
  @keyframes popin { 0% { transform:scale(.4) translateY(6px); opacity:0; }
    55% { transform:scale(1.14) translateY(-3px); opacity:1; }
    100% { transform:scale(1) translateY(0); opacity:1; } }
  .bubble { position:absolute; width:32px; height:32px; border-radius:50%;
    background:#FFFCF4; border:2.6px solid rgba(120,78,50,.78);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:700; color:#E8563C;
    box-shadow:0 3px 0 rgba(74,44,24,.16);
    animation:popin .34s cubic-bezier(.34,1.6,.64,1) both; }
  .bubble::after { content:""; position:absolute; left:50%; bottom:-8px; width:0; height:0;
    margin-left:-4px; border-left:4px solid transparent; border-right:4px solid transparent;
    border-top:7px solid rgba(120,78,50,.78); }
  @keyframes toast { 0% { transform:translate(-50%,10px); opacity:0; }
    18% { transform:translate(-50%,0); opacity:1; }
    80% { transform:translate(-50%,0); opacity:1; }
    100% { transform:translate(-50%,-8px); opacity:0; } }
  .toast { position:absolute; left:50%; top:200px; padding:9px 20px; border-radius:999px;
    background:linear-gradient(180deg,#FFFEF8,#FFE9B8); border:2.8px solid rgba(122,80,52,.8);
    font-size:15px; font-weight:700; color:#7A3A18; white-space:nowrap;
    box-shadow:0 5px 0 rgba(74,44,24,.18);
    animation:toast 2.0s cubic-bezier(.2,.9,.3,1) both; }

  /* ---------- L2 控件通用：概念图 glass() 的六层 ----------
     概念图每个玻璃件都是六层叠加，缺一层就"掉档"：
       ① 右下投影 (+2,+5) rgba(74,44,24,.22)      ← 主光在左上，投影一致朝右下
       ② 半透明垂直渐变 alpha .97/.93/.95          ← 背景暖光透过来才有玻璃感
       ③ 外深描边 2.8px rgba(122,80,52,.74)        ← 有边
       ④ 顶部内侧高光 2.4px rgba(255,255,255,.62)  ← 被光打到
       ⑤ 内浅描边 1.3px rgba(255,255,255,.40)      ← 有倒角
       ⑥ 底部内阴影 8px rgba(140,92,52,.14)        ← 有重力
     最容易做错的是 ②：写成不透明（#FFFEF8）就立刻从"玻璃"变成"一块贴纸"。
     ④⑥ 必须真占 2.4/8px 高度并被圆角裁掉，用伪元素；用 inset box-shadow 近似会
     在圆角处露出直角边。 */
  .glass { position:absolute; border-radius:19px; overflow:hidden;
    background:linear-gradient(180deg,
      rgba(255,254,248,.97) 0%,
      rgba(255,251,240,.93) 55%,
      rgba(250,238,218,.95) 100%);
    border:2.8px solid rgba(122,80,52,.74);
    box-shadow: 2px 5px 0 rgba(74,44,24,.22),                 /* ① */
                inset 0 0 0 1.3px rgba(255,255,255,.40); }    /* ⑤ */
  .glass::before { content:""; position:absolute; left:0; right:0; top:0; height:2.4px;
    background:rgba(255,255,255,.62); pointer-events:none; }                      /* ④ */
  .glass::after { content:""; position:absolute; left:0; right:0; bottom:0; height:8px;
    background:linear-gradient(180deg, rgba(140,92,52,0), rgba(140,92,52,.14));
    pointer-events:none; }                                                        /* ⑥ */
  .rnd { position:absolute; border-radius:999px; }
  /* 图标按钮：图标压在最上层，底下的玻璃渐变照旧 —— 两层用列表写法，
     且下面那层必须和 .glass 同样写成半透明，否则圆钮会变成实心片。 */
  .ico-btn { background-image: var(--ico),
      linear-gradient(180deg, rgba(255,254,248,.97) 0%,
                             rgba(255,251,240,.93) 55%,
                             rgba(250,238,218,.95) 100%);
    background-repeat: no-repeat, no-repeat;
    background-position: center, center;
    background-size: 30px 30px, 100% 100%; }
  .lbl { font-size:10px; line-height:10px; color:rgba(112,72,46,.66); }
  .val { font-size:17px; line-height:18px; font-weight:700; color:#5A3826; }

  /* 场景入口徽标 —— 三处曾经错到「玩家根本认不出这是什么」：
       ① 圆只有 27px、图标内容 14.4px，缩到 720p 里像颗芝麻；
       ② 点击区 = 视觉区 = 27px，远低于可用下限；
       ③ 只有 :hover 才给一句说明，而移动端没有 hover —— 等于没说明。
     现在：圆 40 / 图标内容 22（40×0.6875，沿用 68.75% 留白率）/ 常驻 11px 标签。
     圆心必须保持不变（改尺寸时 left/top 各减 6.5），否则整张图的锚点会漂。 */
  .badge { position:absolute; width:40px; height:40px; border-radius:50%;
    background-image: var(--ico),
      linear-gradient(180deg, rgba(255,255,255,.55) 0 3px, rgba(255,255,255,0) 3px),
      linear-gradient(180deg, rgba(255,252,244,.94), rgba(255,252,244,.94));
    background-repeat: no-repeat, no-repeat, no-repeat;
    background-position: center, center, center;
    background-size: 32px 32px, 100% 100%, 100% 100%;
    border:2.8px solid rgba(110,70,44,.82);
    box-shadow:2px 4px 0 rgba(74,44,24,.22);
    z-index:30;   /* 宠物是 z-index 10~16，徽标必须压在上面 */
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:transform .14s ease, box-shadow .14s ease; }
  /* 点击区外扩到 52×52：视觉 40 但手指要摸得到。用透明伪元素而不是加大盒子，
     否则阴影和 hover 缩放都会跟着变大。 */
  .badge::after { content:""; position:absolute; left:-6px; top:-6px; right:-6px; bottom:-6px; border-radius:50%; }
  .badge .cap { position:absolute; left:50%; top:100%; transform:translateX(-50%);
    margin-top:4px; padding:2px 7px 3px; border-radius:9px;
    background:rgba(255,252,244,.94); border:1.6px solid rgba(110,70,44,.60);
    box-shadow:1px 2px 0 rgba(74,44,24,.16);
    font-size:11px; line-height:11px; color:#6B4025; white-space:nowrap; pointer-events:none; }
  .badge:hover { transform:scale(1.16); box-shadow:2px 5px 0 rgba(74,44,24,.24), 0 0 12px rgba(255,214,120,.9); }

  /* ---------- HUD ----------
     位置全部按概念图 home2-shot.js 的绘制坐标换算，一律写 line-height 让竖直居中可算：
       文字中心 y = top + line-height / 2
     不写死 line-height 时，字号一改位置就漂 —— 之前整条 HUD 比概念图高 4~6px 就是这个原因。 */
  #logo { position:absolute; left:24px; top:0; }
  #logo .t { font-size:24px; line-height:24px; font-weight:700; color:#fff; margin-top:21px;
    letter-spacing:0;
    /* 概念图用 canvas 的 strokeText 描边（线宽 5.5 中心描边 → 字形外扩 2.75px）。
       CSS 没有真描边（-webkit-text-stroke 会盖住填充），用八向零模糊 text-shadow 拼；
       不要用带模糊的写法，那会读成"投影"而不是"描边"，白字立刻失去厚度。 */
    text-shadow:
       2.6px 0 0 rgba(120,66,44,.60), -2.6px 0 0 rgba(120,66,44,.60),
       0 2.6px 0 rgba(120,66,44,.60),  0 -2.6px 0 rgba(120,66,44,.60),
       1.8px 1.8px 0 rgba(120,66,44,.60), -1.8px 1.8px 0 rgba(120,66,44,.60),
       1.8px -1.8px 0 rgba(120,66,44,.60), -1.8px -1.8px 0 rgba(120,66,44,.60); }
  #logo .s { font-size:8.5px; line-height:9px; font-weight:700; color:rgba(255,255,255,.95);
    margin-top:.5px; margin-left:2px; letter-spacing:0;
    text-shadow:0 1px 2px rgba(120,66,44,.5); }
  /* HUD 进度条：概念图给的 300px 装不下「标签 + 8 格 + 连锁」，
     实测概念图里连锁文字压在最后两格上（原图就有这个重叠）。
     这里把底板加宽到 340 并保持**中心仍在 x=620**，左右各借 20px。
     330 还不够：实测第 8 格右沿到 713、连锁从 711 起，仍有 2px 压边。
     34 的余量是按 8 格 × 21 节奏 + 连锁实测 55px 宽倒推的，
     再窄就得动格子节奏或字号 —— 那才是改设计。 */
  #logo, .hud-prog, .hud-tip, .ico-btn, #dock { z-index:40; }
  .hud-prog { left:450px; top:12px; width:340px; height:46px; border-radius:23px; }
  .hud-tip  { left:820px; top:16px; width:236px; height:30px; border-radius:15px; }
  /* 提示条内件坐标 = 概念图 by+bw 相对值：爪印中心 (20,19) / 文字基线左 36 / 箭头右 26 */
  .hud-tip .paw { position:absolute; left:10px; top:9px; width:20px; height:20px;
    background:url(../assets/ui/icons/paw-red.png) center/contain no-repeat; }
  .hud-tip .tx { position:absolute; left:36px; top:13px; font-size:11.5px; line-height:12px;
    font-weight:700; color:#7A3A18; white-space:nowrap; }
  .hud-tip .ar { position:absolute; right:26px; top:10px; }

  /* ---------- Dock ---------- */
  #dock { position:absolute; left:0; top:618px; width:1280px; height:92px; }
  /* 截图模式藏掉调试条 —— 它会压在「出门」按钮下沿上 */
  #dev.hide { display:none; }
  /* 关卡格：概念图是 px+96+i*22 的 15×15 圆角 4，所以格宽 15 + 间距 7 = 22 的节奏 */
  .pip { width:15px; height:15px; border-radius:4px; display:inline-block; margin-right:6px;
    background:rgba(112,72,46,.09); border:1.6px solid rgba(112,72,46,.24); }
  .pip.on { background:#8FE0B8; border-color:rgba(56,124,88,.82); }

  /* 伙伴位：概念图 40×62 / 圆角 13 / 起始 x=506 / 间距 46（= 40 + 6）
     出战的那一只不进这一排 —— 它在左边的出战卡里已经有了，
     同一个信息做两遍会稀释焦点，而且概念图的这一排就是 5 格。 */
  .slot { position:absolute; top:15px; width:40px; height:62px; border-radius:13px;
    cursor:pointer; transition:transform .13s ease, box-shadow .13s ease; }
  .slot:hover { transform:translateY(-4px); }
  /* 圆环用 inset box-shadow 画在圆**内侧**，不要用 border：
     border 会占掉内容区 3.2px，头像就被多放大一截，只看到脸的中间。
     概念图 petHead() 是把 d=30.2 的图直接裁进 r=14 的圆，不缩内容区。 */
  .slot .av { position:absolute; left:6px; top:12px; width:28px; height:28px; border-radius:50%;
    overflow:hidden; background:#FFF6E4;
    box-shadow:inset 0 0 0 1.6px rgba(122,80,52,.44); }
  /* 头像按 d = r*2.16 放大后裁进圆里：r=14 → d=30.2，圆内容区 24.8 → 偏移 -2.7 */
  .slot .av img { display:block; width:30.2px; height:30.2px; margin:-1.1px 0 0 -1.1px; }
  .slot.locked { background:linear-gradient(180deg,rgba(248,240,226,.86),rgba(235,222,200,.86));
    border:2.2px dashed rgba(122,80,52,.40); box-shadow:2px 3.5px 0 rgba(74,44,24,.10); }
  .slot.locked .av { background:rgba(150,118,88,.16); border-color:rgba(122,80,52,.26);
    display:flex; align-items:center; justify-content:center; font-size:15px;
    color:rgba(122,80,52,.42); }
  .slot .tag { position:absolute; left:0; right:0; bottom:4px; text-align:center;
    font-size:8px; line-height:10px; color:rgba(112,72,46,.46); font-weight:400; }
  .slot.locked .tag { color:rgba(122,80,52,.52); }
  /* 刚到家：金色描边 + 右上角「新」 */
  .slot.is-new { background:linear-gradient(180deg, rgba(255,244,208,.96), rgba(255,240,196,.96));
    border:2.6px solid rgba(200,150,40,.92); box-shadow:2px 3.5px 0 rgba(150,96,20,.28); }
  .slot .new { position:absolute; right:4px; top:3px; width:14px; height:11px; border-radius:5.5px;
    background:#FFC84A; border:1.6px solid rgba(150,96,20,.88);
    font-size:7.5px; line-height:9px; text-align:center; font-weight:700; color:#5A3008; }

  /* ---------- 资源卡 ---------- */
  .res { top:15px; width:82px; height:62px; }
  /* 资源图标：概念图是**彩色填充**、视觉高度约 20~25px，比场景徽标的线描图标大一圈。
     图标 PNG 的内容占画布 68.75%，所以 32px 的框给出 ~22px 的可见尺寸。
     给 19px（线描图标的尺寸）会明显偏小 —— 这是 Dock 看起来"寡淡"的主因。 */
  .res .ic { position:absolute; left:8px; top:4px; width:32px; height:32px;
    background-position:center; background-size:contain; background-repeat:no-repeat; }
  .res .v { position:absolute; right:10px; top:17px; text-align:right; }
  .res .n { position:absolute; right:10px; top:39px; text-align:right; }

  /* ---------- 出战卡 ---------- */
  .go-card { top:15px; width:200px; height:62px; }
  .go-card .av { position:absolute; left:9px; top:9px; width:44px; height:44px; border-radius:50%;
    overflow:hidden; background:#FFF6E4;
    box-shadow:inset 0 0 0 2px rgba(122,80,52,.60); }
  /* 头像按 d = r*2.16 放大后裁进圆里：r=22 → d=47.5，圆内容区 40 → 偏移 (40-47.5)/2 = -3.75
     原来写 95px 是算错了，等于只看到脸的正中间一小块。 */
  .go-card .av img { display:block; width:47.5px; height:47.5px; margin:-1.75px 0 0 -1.75px; }

  /* 出门主按钮：概念图是**平涂面 + 下沉 6px 的深色侧边**，不是渐变。
     平涂是它读起来"厚实又能按下去"的关键；换成渐变会立刻变轻。 */
  #go { position:absolute; left:760px; top:12px; width:500px; height:68px;
    border-radius:34px; cursor:pointer;
    background:#FFCE6E;
    border:3.2px solid rgba(120,64,20,.90);
    box-shadow:0 6px 0 #E8A33C, 2px 9px 0 rgba(74,44,24,.26),
               inset 0 3.4px 0 rgba(255,255,255,.54);
    transition:transform .1s ease, box-shadow .1s ease, filter .18s ease; overflow:hidden; }
  /* hover / active 只改"侧边高度"，不改颜色 —— 按下时侧边从 6px 压到 2px，读起来才真按下去 */
  #go:hover { filter:brightness(1.04);
    box-shadow:0 6px 0 #E8A33C, 2px 9px 0 rgba(74,44,24,.26),
               inset 0 3.4px 0 rgba(255,255,255,.54), 0 0 26px rgba(255,206,110,.95); }
  #go:active { transform:translateY(4px);
    box-shadow:0 2px 0 #E8A33C, 2px 4px 0 rgba(74,44,24,.26),
               inset 0 3.4px 0 rgba(255,255,255,.54); }
  #go::before { content:""; position:absolute; top:0; left:-140px; width:120px; height:100%;
    background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.62), rgba(255,255,255,0));
    animation:sweep 3.4s ease-in-out infinite; }
  @keyframes sweep { 0%,62% { left:-140px; } 100% { left:520px; } }

  /* ---------- 新伙伴过场 ---------- */
  #intro { position:absolute; inset:0; z-index:900; display:none;
    align-items:center; justify-content:center; cursor:pointer;
    background:radial-gradient(ellipse at 50% 46%, rgba(72,44,22,.34), rgba(40,24,12,.82)); }
  #intro.on { display:flex; }
  #intro .card { position:relative; width:520px; padding:26px 30px 22px; border-radius:26px;
    text-align:center; overflow:hidden;
    background:linear-gradient(180deg,#FFFDF6,#FFF3DA 62%,#FBE7BE);
    border:4px solid rgba(122,80,52,.9);
    box-shadow:0 16px 0 rgba(74,44,24,.28), 0 0 80px rgba(255,206,110,.55),
               inset 0 3px 0 rgba(255,255,255,.75);
    animation:cardIn .5s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes cardIn { from { transform:scale(.82) translateY(24px); opacity:0; }
    to { transform:scale(1) translateY(0); opacity:1; } }
  #intro .rays { position:absolute; left:50%; top:118px; width:560px; height:560px;
    margin:-280px 0 0 -280px; pointer-events:none; opacity:.55;
    background:conic-gradient(from 0deg,
      rgba(255,214,120,.0) 0deg, rgba(255,214,120,.85) 12deg, rgba(255,214,120,0) 26deg,
      rgba(255,214,120,0) 60deg, rgba(255,214,120,.7) 74deg, rgba(255,214,120,0) 88deg,
      rgba(255,214,120,0) 140deg, rgba(255,214,120,.8) 154deg, rgba(255,214,120,0) 168deg,
      rgba(255,214,120,0) 220deg, rgba(255,214,120,.7) 234deg, rgba(255,214,120,0) 248deg,
      rgba(255,214,120,0) 300deg, rgba(255,214,120,.8) 314deg, rgba(255,214,120,0) 328deg);
    animation:spin 9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

<script>
/* ============================================================================
   吧唧军团 · 游戏入口（主界面）
   ----------------------------------------------------------------------------
   这一版把 home-demo.html 从「一张效果图」变成「真的游戏入口」：

   ① 开局只有砂糖一只。其余五只按通关数解锁（表见 PETS[].at）。
   ② 「出门」→ grove.html?from=home&hero=N&stage=K，打完回来自动结算解锁。
   ③ 存档 localStorage 'pawpack.save'，和 grove.html 共用（它只管写 cleared）。

   三层动画栈沿用 docs/混合生产管线 v3.2 §11：
     L1 呼吸 常驻 / L2 自主 6–14s / L3 点击 90→320→280ms
   ========================================================================== */

const TAU = Math.PI * 2;
const $ = (id) => document.getElementById(id);
const stage = $('stage'), petsEl = $('pets'), fxEl = $('fx');

/* ---------- 舞台自适应 ----------
   #shot：截图模式，强制 1:1 且贴左上角。
   没有这个开关就只能把窗口调到恰好 1280×720 客户端区才能截到无缩放画面，
   而窗口边框会把视口带偏 —— 一偏就不是逐像素比对了。 */
const SHOT = /shot/.test(location.hash);
/* #walkall：全解锁 + **不冻结**，专供动效验证。
   不能用 #shotall 测走动 —— 那个 hash 会把 nextAt 推到 1e15（截图要稳定），
   结果就是「宠物一动不动」，看起来像动效没实现。 */
const WALKALL = /walkall/.test(location.hash);
if (SHOT) {
  // 调试条会压在「出门」按钮的下沿上，截图时藏掉
  const dv = document.getElementById('dev');
  if (dv) dv.classList.add('hide');
}
function fit() {
  if (SHOT) {
    stage.style.transform = 'scale(1)';
    stage.style.left = '0';
    stage.style.top = '0';
    return;
  }
  const k = Math.min(innerWidth / 1280, innerHeight / 720);
  stage.style.transform = `scale(${k})`;
  stage.style.left = Math.max(0, (innerWidth - 1280 * k) / 2) + 'px';
  stage.style.top = Math.max(0, (innerHeight - 720 * k) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- 存档 ---------- */
const SAVE_KEY = 'pawpack.save';
/* #shot（不带 all）＝"首次进入"画面：先清掉本地存档再加载。
   不清的话，上一轮截图留下的进度会带过来，截出来既不是开局也不是概念图状态。 */
if (SHOT && !/shotall/.test(location.hash)) {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}
const DEFAULT_SAVE = { v: 1, cleared: [], active: 'sugar-stand', pats: {}, seen: [] };

function loadSave() {
  try {
    const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}');
    return {
      v: 1,
      cleared: Array.isArray(raw.cleared) ? raw.cleared.filter(n => Number.isInteger(n)) : [],
      active: typeof raw.active === 'string' ? raw.active : 'sugar-stand',
      pats: raw.pats && typeof raw.pats === 'object' ? raw.pats : {},
      seen: Array.isArray(raw.seen) ? raw.seen : [],
    };
  } catch (e) { return { ...DEFAULT_SAVE, cleared: [], seen: [], pats: {} }; }
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
let save = loadSave();
// 老存档自愈：早期版本可能把开局的砂糖也记进 seen
if (save.seen.includes('sugar-stand')) {
  save.seen = save.seen.filter(id => id !== 'sugar-stand');
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
const clearCount = () => new Set(save.cleared).size;

/* ---------- 六只的规格 ----------
   at = 解锁所需通关数；hero = grove.html 里 HEROES 的索引（必须对得上）。 */
const PETS = [
  /* 三个必须一起定，缺一个就会「站得像个贴纸」：
       cx/footY  站位（设计坐标，1280×720）
       h         立绘高度 —— 同时是**景深**：越远越小
       roam      领地 [左, 右]。走动不许越界 —— 这就是「互不干扰」的全部实现。

     排布不再是「六只一条水平线」：footY 分 548 / 574 / 596 / 602 / 610 五档，
     每只落在自己那段草地的深度上，眼下的景深才成立。
     砂糖（原 cx:490 footY:156）原本踩在穹顶上 —— 屋顶是**弧面**，没有平台，
     弧面上站猫在任何角度看都是穿模。改到左侧最远的一段草地，
     人格从「最高点」变成「最远处」，反而更贴它的守卫设定。 */
  { id:'sugar-stand',  name:'砂糖', star:1, at:0, hero:0,
    cx:160,  footY:548, h:84,  phase:0,    roam:[136, 192],
    why:'站得最远，看得最清',   mood:['♥','♪','★'],
    line:'这儿看得最远。你回来的时候，我第一个看见。' },

  { id:'nian-gao-dog', name:'年糕', star:1, at:1, hero:1,
    cx:320,  footY:602, h:148, phase:300,  roam:[288, 358],
    why:'永远在门口等', mood:['♥','♪','!','★'],
    line:'我一直在门口等着。这次……带上我吧。' },

  { id:'tuan-zi-ham',  name:'团子', star:2, at:3, hero:2,
    cx:700,  footY:596, h:138, phase:900,  roam:[676, 746],
    why:'守着锅等开饭', mood:['♥','♥','!'],
    line:'锅边那个位置……还给我留着吗？' },

  { id:'xue-tuan-rab', name:'雪团', star:2, at:5, hero:3,
    cx:500,  footY:574, h:128, phase:600,  roam:[472, 532],
    why:'只敢待在门口', mood:['♥','♪','!'],
    line:'我、我可以跟着你走一段吗？就一小段。' },

  { id:'dou-nai-ox',   name:'豆奶', star:3, at:7, hero:4,
    cx:890,  footY:610, h:138, phase:1200, roam:[862, 932],
    why:'怕热，只趴垫子', mood:['♥','♪','★'],
    line:'不用急。我走得慢，但一步都不会落下。' },

  { id:'xing-xie-fox', name:'星屑', star:4, at:8, hero:5,
    cx:1130, footY:568, h:112, phase:1500, roam:[1106, 1162],
    why:'刚到家，还不太靠近人', mood:['★','!','♥'],
    line:'……先说好，我不跟人太近。就这一次。' },
];

/* #shotall：把存档摆成与概念图一致的状态再截图，专供截图比对。
   只有 hash 里出现 shotall 才生效 —— 正常开局不受影响。
   为什么不直接用「全解锁」按钮：那样 cleared=8，HUD 会显示 8/8 与 连锁×2.00，
   而概念图是 3/8 与 ×1.45，状态不同就永远比不出所以然。 */
if (/shotall/.test(location.hash)) {
  save = {
    v: 1,
    cleared: [0, 1, 2],
    active: 'nian-gao-dog',
    pats: { 'nian-gao-dog': 12 },     // 12 次抚摸 → 3 颗心（1 + floor(12/5)）
    seen: PETS.map(p => p.id),
  };
  writeSave();
}


const byId = (id) => PETS.find(p => p.id === id);
/* SHOT_ALL：截图专用。概念图的状态是「6 只都在家 + 3/8 关」，
   而本作的解锁规则把伙伴绑在关卡上（过关才回家）—— 两者矛盾。
   为了能做 1:1 画面比对，截图模式下临时放开解锁，不改存档、不影响正常开局。 */
const SHOT_ALL = /shotall/.test(location.hash) || WALKALL;
const isUnlocked = (p) => SHOT_ALL || clearCount() >= p.at;
const unlockedPets = () => PETS.filter(isUnlocked);

/* 哪些还没播过"新伙伴加入"。
   注意 at > 0：砂糖是开局就有的，不算"新伙伴"——
   少了这个条件，重置存档后的第一次通关会把砂糖自己也演一遍。 */
function pendingIntro() {
  return unlockedPets().filter(p => p.at > 0 && !save.seen.includes(p.id));
}

/* 下一个该解锁的（用来写顶部提示条） */
function nextLocked() {
  return PETS.filter(p => !isUnlocked(p)).sort((a, b) => a.at - b.at)[0] || null;
}

const loadImg = (src) => new Promise((res, rej) => {
  const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src;
});

/* ============================================================================
   1. 场景里的宠物
   ========================================================================== */
let pets = [];
let totalPats = 0;

async function addPet(p, opts) {
  const o = opts || {};
  const img = await loadImg(`../shots/ai/${p.id}@v1.png`);
  const w = p.h * (img.naturalWidth / img.naturalHeight);
  const bw = Math.max(w * 1.28, 100);          // 点击区下限 100（触屏 88 的 720p 换算）
  const bh = Math.max(p.h * 1.02, 100);

  const wrap = document.createElement('div');
  wrap.className = 'pet';
  wrap.dataset.id = p.id;
  wrap.style.left = (p.cx - bw / 2) + 'px';
  wrap.style.top = (p.footY - p.h) + 'px';
  wrap.style.width = bw + 'px';
  wrap.style.height = bh + 'px';
  wrap.style.zIndex = 10 + Math.round(p.footY / 100);

  const im = document.createElement('img');
  im.src = `../shots/ai/${p.id}@v1.png`;
  im.style.width = w + 'px';
  im.style.height = p.h + 'px';
  im.style.left = ((bw - w) / 2) + 'px';
  im.style.top = '0';

  /* 接地投影 —— 参数直接取概念图 aiPet()：rx = max(10, .34w) / ry = max(4, .052h)
     贴在脚底（= 立绘底边），不是贴容器底边：wrap 的底边在小体型时比脚底低 18px，
     用 bottom 定位会让投影浮在半空。 */
  const srx = Math.max(10, w * 0.34);
  const sry = Math.max(4, p.h * 0.052);
  const shade = document.createElement('div');
  shade.className = 'shade';
  shade.style.left = (bw / 2 - srx) + 'px';
  shade.style.top = (p.h - sry) + 'px';
  shade.style.width = (srx * 2) + 'px';
  shade.style.height = (sry * 2) + 'px';

  const halo = document.createElement('div');
  halo.className = 'halo';
  halo.style.width = (w * 0.92) + 'px';
  halo.style.top = (p.h - 13) + 'px';

  const card = document.createElement('div');
  card.className = 'namecard';
  card.innerHTML = `<b>${p.name}</b><i>${'★'.repeat(p.star)}</i><em>${p.why}</em>`;

  wrap.append(shade, im, halo, card);
  petsEl.appendChild(wrap);

  const rec = { ...p, img: im, wrap, card, w, bw, bh,
    jump: null, react: null, sway: null, walk: null,
    /* 截图模式冻结自主行为：走动会让每次截图的宠物位置都不一样，
       差异像素率就退化成一个随机数，没法判断「这次改的有没有变好」。 */
    nextAt: (SHOT && !WALKALL) ? 1e15 : performance.now() + 1400 + Math.random() * 2600 };
  pets.push(rec);

  wrap.addEventListener('pointerdown', (e) => {
    const r = stage.getBoundingClientRect();
    const k = r.width / 1280;
    patPet(rec, (e.clientX - r.left) / k, (e.clientY - r.top) / k);
  });

  if (o.flyIn) {
    wrap.animate(
      [{ transform:'translate(300px,-120px) scale(.55)', opacity:0 },
       { transform:'translate(18px,10px) scale(1.06)', opacity:1, offset:.78 },
       { transform:'translate(0,0) scale(1)', opacity:1 }],
      { duration: 900, delay: o.delay || 0, easing:'cubic-bezier(.22,1.2,.36,1)', fill:'backwards' });
    setTimeout(() => {
      burst(p.cx, p.footY - p.h * 0.5, 20, 'gold');
      ripple(p.cx, p.footY - 4, 120);
    }, (o.delay || 0) + 560);
  }
  return rec;
}

/* ============================================================================
   2. 控件
   ========================================================================== */
function renderSlots() {
  const active = byId(save.active) || PETS[0];
  /* 出战的那一只不进这一排 —— 它在出战卡里已经完整显示了（名字/星/心/饱食）。
     同一信息做两遍会稀释"这一排是待命队"的语义，而且概念图这一排就是 5 格。
     几何按概念图：起始 x=506，间距 46（40 宽 + 6 缝）。 */
  const rest = PETS.filter(p => p.id !== active.id);
  const unAt = PETS.filter(isUnlocked).map(p => p.at);
  const newestAt = unAt.length ? Math.max(...unAt) : -1;

  $('slots').innerHTML = rest.map((p, i) => {
    const left = 506 + i * 46;
    const un = isUnlocked(p);
    const isNew = un && p.at === newestAt;
    const cls = ['slot', 'glass', un ? '' : 'locked', isNew ? 'is-new' : ''].filter(Boolean).join(' ');
    const inner = un
      ? `<div class="av"><img src="../shots/ai/head/${p.id}-head@v1.png" alt=""></div>
         <div class="tag">待命</div>
         ${isNew ? '<div class="new">新</div>' : ''}`
      : `<div class="av" style="background:#FFF6E4 url(../assets/ui/icons/lock.png) center/58% no-repeat;"></div>
         <div class="tag">第${p.at}关</div>`;
    return `<div class="${cls}" style="left:${left}px" data-slot="${p.id}" title="${un ? p.name : `通关第 ${p.at} 关解锁`}">${inner}</div>`;
  }).join('');

  // 出战标记
  for (const rec of pets) rec.wrap.classList.toggle('active', rec.id === active.id);

  // 出战卡（头像按 2.16 倍放进圆里再裁，与概念图 petHead() 的 d = r*2.16 一致）
  $('goAvImg').src = `../shots/ai/head/${active.id}-head@v1.png`;
  $('goName').textContent = active.name.split('').join(' ');
  $('goStar').style.display = active.star > 0 ? '' : 'none';

  const pats = save.pats[active.id] || 0;
  const hearts = Math.min(5, 1 + Math.floor(pats / 5));
  $('hearts').innerHTML = '♥'.repeat(hearts) +
    `<span style="color:rgba(122,80,52,.16);">${'♥'.repeat(5 - hearts)}</span>`;

  $('belly').innerHTML =
    [0,1,2].map(() => `<span style="width:20px;height:9px;border-radius:4.5px;background:#FFB56A;border:1.4px solid rgba(178,110,40,.8);"></span>`).join('') +
    `<span style="font-size:9px;line-height:10px;font-weight:700;color:#8C4A18;margin-left:10px;">满饱</span>`;

  // 出门文案
  const nextStage = firstUncleared();
  // 与概念图同一句式：带<名字> · 苔原 <进度> / 8
  // ⚠ 这里的数字必须和 HUD 的「N / 8 关」是同一个 N（都是已过关数）。
  //   原来写 nextStage + 1，结果 HUD 显示 3/8、按钮显示 4/8 —— 同一块屏两套进度，
  //   概念图里两处都是 3/8。宁可在 0 关时显示「苔原 0 / 8」也不要露两个数。
  $('goLine').textContent = `带${active.name} · 苔原 ${nextStage} / 8`;
  const nx = nextLocked();
  $('goSub').textContent = nx
    ? `再通关 ${Math.max(0, nx.at - clearCount())} 关，${nx.name} 会来到家里`
    : '六个伙伴都到家了 · 可以带谁出门都行';

  // 顶部关卡进度
  const cc = clearCount();
  $('stageProg').textContent = `${cc} / 8 关`;
  $('pips').innerHTML = Array.from({ length: 8 }, (_, i) =>
    `<span class="pip${i < cc ? ' on' : ''}"></span>`).join('');

  // 连锁倍率：与 grove.html 同一公式 —— 1 + 0.15 × 已过关数，上限 2.0
  const chain = Math.min(2, 1 + 0.15 * cc);
  $('chain').textContent = `连锁 ×${chain.toFixed(2)}`;

  // 顶部提示条（爪印是独立元素 + 红色图标资产，不再是 🐾 字符 —— emoji 换平台就变脸）
  $('tipBar').textContent = nx
    ? `${nx.name} 在第 ${nx.at} 关后到家`
    : '六个伙伴都在家了';

  $('devStat').textContent = `通关 ${cc} · 伙伴 ${unlockedPets().length}/6`;
}

function firstUncleared() {
  const set = new Set(save.cleared);
  for (let i = 0; i < 8; i++) if (!set.has(i)) return i;
  return 0;   // 全通了就从头再推一趟
}

function setActive(id) {
  const p = byId(id);
  if (!p) return;
  save.active = id; writeSave();
  renderSlots();
  const rec = pets.find(r => r.id === id);
  if (rec) {
    rec.react = { t0: performance.now(), dur: 690, glyph: '★' };
    ripple(rec.cx, rec.footY - 4, 110);
    burst(rec.cx, rec.footY - rec.h * 0.6, 10, 'gold');
  }
  toast(`出战 · ${p.name}`);
}

/* ============================================================================
   3. 粒子 / 反馈
   ========================================================================== */
const GLYPH = ['♥','♪','★','✿','♥'];
const COLOR = { pink:['#FF9EB6','#FFB8CB','#F5768F'], gold:['#FFD86A','#FFE9A8','#F5B93C'] };

function spawnGlyph(x, y, opt = {}) {
  const el = document.createElement('div');
  el.className = 'p';
  el.textContent = opt.glyph || GLYPH[(Math.random() * GLYPH.length) | 0];
  const pal = COLOR[opt.pal || 'pink'];
  el.style.color = pal[(Math.random() * pal.length) | 0];
  el.style.fontSize = (opt.size || 15) * (0.75 + Math.random() * 0.6) + 'px';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.style.opacity = 1;
  fxEl.appendChild(el);
  const a = (opt.dir === undefined ? (-140 + Math.random() * 80) : opt.dir) * Math.PI / 180;
  const sp = (opt.speed || 1) * (1.1 + Math.random() * 1.6);
  return { el, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
           life: 0, max: 900 + Math.random() * 450,
           rot: (Math.random() - .5) * 0.6, vr: (Math.random() - .5) * 3.2 };
}

let parts = [];
function burst(x, y, n, pal) {
  for (let i = 0; i < n; i++)
    parts.push(spawnGlyph(x + (Math.random() - .5) * 40, y + (Math.random() - .5) * 30,
      { pal, size: 16 }));
}
function ripple(x, y, size) {
  const el = document.createElement('div');
  el.className = 'ripple';
  el.style.left = (x - size / 2) + 'px';
  el.style.top = (y - size / 2) + 'px';
  el.style.width = size + 'px';
  el.style.height = size + 'px';
  el.style.animation = 'rip .62s cubic-bezier(.2,.8,.3,1) forwards';
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 680);
}
function bubble(x, y, glyph) {
  const el = document.createElement('div');
  el.className = 'bubble';
  el.textContent = glyph;
  el.style.left = (x - 16) + 'px';
  el.style.top = (y - 16) + 'px';
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 1180);
}
function toast(txt) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = txt;
  fxEl.appendChild(el);
  setTimeout(() => el.remove(), 2100);
}

function patPet(p, x, y) {
  const t = performance.now();
  p.react = { t0: t, dur: 690, glyph: p.mood[(Math.random() * p.mood.length) | 0] };

  ripple(p.cx, p.footY - 4, 84);

  const hx = p.cx, hy = p.footY - p.h * 0.92;
  for (let i = 0; i < 6; i++)
    parts.push(spawnGlyph(hx + (Math.random() - .5) * 34, hy, { size: 14 }));
  parts.push(spawnGlyph(hx, hy - 8, { glyph: p.react.glyph, size: 19, speed: .5, dir: -90, pal: 'pink' }));

  bubble(p.cx + p.bw * 0.34, p.footY - p.h * 0.72, p.react.glyph);

  totalPats++;
  const prev = save.pats[p.id] || 0;
  save.pats[p.id] = prev + 1;
  writeSave();
  const before = Math.min(5, 1 + Math.floor(prev / 5));
  const after = Math.min(5, 1 + Math.floor((prev + 1) / 5));
  if (after > before) {                 // 亲密度 +1 的那一下
    for (let i = 0; i < 16; i++)
      parts.push(spawnGlyph(p.cx, p.footY - p.h * 0.8, { pal: 'gold', size: 20, speed: 1.6 }));
    ripple(p.cx, p.footY - 4, 130);
    toast('亲密度 +1 · 它记住了你');
    renderSlots();
  }
}

/* ============================================================================
   4. 新伙伴过场
   ========================================================================== */
let introQueue = [];
let introBusy = false;

function queueIntro(p) { introQueue.push(p); playIntro(); }

function playIntro() {
  if (introBusy || !introQueue.length) return;
  introBusy = true;
  const p = introQueue.shift();

  $('introImg').src = `../shots/ai/${p.id}@v1.png`;
  $('introName').textContent = p.name;
  $('introStar').textContent = '★'.repeat(p.star);
  $('introLine').textContent = `「${p.line}」`;
  $('intro').classList.add('on');

  // 过场里的金色粒子
  const shoot = setInterval(() => {
    if (!$('intro').classList.contains('on')) { clearInterval(shoot); return; }
    burst(640 + (Math.random() - .5) * 360, 300 + (Math.random() - .5) * 200, 3, 'gold');
  }, 130);

  const close = async () => {
    $('intro').removeEventListener('pointerdown', close);
    clearInterval(shoot);
    $('intro').classList.remove('on');
    introBusy = false;

    // 落到场景里
    if (!pets.find(r => r.id === p.id)) await addPet(p, { flyIn: true, delay: 160 });
    renderSlots();
    setTimeout(playIntro, 240);
  };
  $('intro').addEventListener('pointerdown', close);
  // 4.2 秒后自动继续，免得一直等着
  setTimeout(() => { if (introBusy) close(); }, 4200);
}

/* ============================================================================
   5. 启动
   ========================================================================== */
async function boot() {
  // 已解锁的先摆进院子（后加的排后面，zIndex 靠 footY 自动分层）
  for (const p of unlockedPets()) await addPet(p);

  // 当前出战不存在/未解锁 → 回落到第一只
  if (!byId(save.active) || !isUnlocked(byId(save.active))) {
    save.active = unlockedPets()[0].id;
    writeSave();
  }

  renderSlots();

  // 从来没有过场记录的已解锁宠物（首次来 / 新解锁）逐个播
  for (const p of pendingIntro()) {
    save.seen.push(p.id);
    queueIntro(p);
  }
  writeSave();

  // 只有一只的时候给一句独白 —— 把「空」变成叙事，而不是读成 bug
  if (unlockedPets().length === 1) {
    setTimeout(() => { $('solo').style.opacity = 0; }, 7000);
  } else {
    $('solo').style.display = 'none';
  }

  requestAnimationFrame(loop);
}

/* ---------- 主循环（三层动画栈） ---------- */
let last = performance.now();
function loop(t) {
  const dt = Math.min(48, t - last); last = t;

  for (const p of pets) {
    let ty = 0, sx = 1, sy = 1, rot = 0;

    /* L1 呼吸：常驻，相位错开 300ms */
    const br = Math.sin((t - p.phase) / 2650 * TAU);
    sy *= 1 + 0.016 * br;
    sx *= 1 - 0.009 * br;
    ty += -1.3 * Math.max(0, br);

    /* L2 自主行为 —— 权重全部重排过。
       原来 6.2~14.4s 才动一次、且**只原地跳**，所以整幅画看起来是静止的：
       一动不动的间隔太长，动的幅度又只有 34px 的原地起落。
       现在 52% 是「走一段」，节奏 2.6~6.8s，位移最远 110px —— 画面这才有活气。 */
    if (!p.jump && !p.react && !p.sway && !p.walk && t > p.nextAt) {
      const r = Math.random();
      if (r < 0.62) {
        /* 走动：在自己的 roam 区间里挑一个落点。
           ⚠ 必须在区间内夹一次 —— 否则来回几次就漂到邻居的领地上，
             六只挤成一团，「互不干扰」就没了。 */
        const cur = parseFloat(p.wrap.style.left) + p.bw / 2;
        const dist = 42 + Math.random() * 96;
        let to = cur + (Math.random() < 0.5 ? -dist : dist);
        to = Math.max(p.roam[0], Math.min(p.roam[1], to));
        /* 贴边时改成往反方向走，否则会「原地踏步」到超时 */
        if (Math.abs(to - cur) < 20) to = cur + (cur - p.roam[0] < p.roam[1] - cur ? 58 : -58);
        to = Math.max(p.roam[0], Math.min(p.roam[1], to));
        const d = Math.abs(to - cur);
        p.walk = {
          t0: t, from: cur, to,
          dur: Math.max(620, d / 0.062),        // ≈62px/s：中型宠一格 46px 宽，走一格 0.75s
          steps: Math.max(2, Math.round(d / 24)), // 每步约 24px，决定踏步频率
          dir: to > cur ? 1 : -1,
        };
      }
      else if (r < 0.80) p.jump = { t0: t, dur: 640 };
      else if (r < 0.91) p.sway = { t0: t, dur: 1100, dir: Math.random() < .5 ? 1 : -1 };
      else p.react = { t0: t, dur: 520, glyph: p.mood[0] };
      /* 1.8~4.2s 一次。原来 2.6~6.8s 实测「7 秒内有一半宠物一次都没轮到」，
         画面读起来仍然是静的 —— 宠物的存在感靠的是**同时有几只在动**，不是单次幅度。 */
      p.nextAt = t + 1800 + Math.random() * 2400;
    }

    /* L2-c 走动：位移 + 踏步起伏。
       单帧立绘没有行走帧，靠「横向位移 + 每步 3.4px 的上下颠」两件事假装在走。
       ⚠ 位移改的是 wrap.style.left（占位盒），踏步改的是 wrap 的 transform，
         两套坐标系不能混 —— 混了会看到宠物一边走一边往画外漂。 */
    if (p.walk) {
      const u = (t - p.walk.t0) / p.walk.dur;
      if (u >= 1) {
        p.walk = null;
        p.nextAt = t + 900 + Math.random() * 1700;    // 走到位后先停一会儿
      } else {
        const e = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;   // easeInOutQuad
        const nx = p.walk.from + (p.walk.to - p.walk.from) * e;
        p.wrap.style.left = (nx - p.bw / 2) + 'px';
        const step = Math.sin(u * Math.PI * p.walk.steps);
        ty += -Math.abs(step) * 3.4;                  // 抬脚
        sy *= 1 + 0.012 * Math.abs(step);
        rot += 0.010 * p.walk.dir * step;             // 左右轻摆，重心才不像平移
      }
    }

    /* L2-a 蹦跳：单帧立绘不能真走路，所以移动一律用蹦的 */
    if (p.jump) {
      const u = (t - p.jump.t0) / p.jump.dur;
      if (u >= 1) p.jump = null;
      else if (u < 0.13) { const k = u / 0.13; sy *= 1 - 0.11 * k; sx *= 1 + 0.09 * k; }
      else if (u < 0.72) {
        const k = (u - 0.13) / 0.59;
        ty += -34 * Math.sin(Math.PI * k);
        sy *= 1.04; sx *= 0.97;
      } else if (u < 0.82) { const k = (u - 0.72) / 0.10; sy *= 1 - 0.08 * k; sx *= 1 + 0.06 * k; }
      else { const k = (u - 0.82) / 0.18; const e = Math.sin(Math.PI * k) * (1 - k); sy *= 1 + 0.05 * e; }
    }

    /* L2-b 摇摆：±0.035rad 是上限，再多脚底会离地 */
    if (p.sway) {
      const u = (t - p.sway.t0) / p.sway.dur;
      if (u >= 1) p.sway = null;
      else rot += Math.sin(u * TAU * 1.6) * 0.035 * p.sway.dir * (1 - u);
    }

    /* L3 点击反应 */
    if (p.react) {
      const u = (t - p.react.t0) / p.react.dur;
      if (u >= 1) p.react = null;
      else if (u < 0.13) { const k = u / 0.13; const s = 1 - 0.07 * k; sx *= s; sy *= s; }
      else if (u < 0.59) {
        const k = (u - 0.13) / 0.46;
        const e = 1 + 0.14 * Math.sin(Math.PI * k * 0.86) * (1 - k * 0.35);
        sx *= e; sy *= (2 - e) * 0.995 + 0.005;
        ty += -13 * Math.sin(Math.PI * k);
      } else {
        const k = (u - 0.59) / 0.41;
        const e = 0.06 * Math.sin(Math.PI * k) * (1 - k);
        sx *= 1 + e; sy *= 1 - e * 0.6;
      }
    }

    p.wrap.style.transform =
      `translateY(${ty.toFixed(2)}px) scale(${sx.toFixed(4)}, ${sy.toFixed(4)}) rotate(${rot.toFixed(4)}rad)`;
  }

  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.life += dt;
    if (q.life > q.max) { q.el.remove(); parts.splice(i, 1); continue; }
    const u = q.life / q.max;
    q.x += q.vx * dt * 0.055;
    q.y += q.vy * dt * 0.055;
    q.vy -= dt * 0.0016;
    q.vx *= 1 - dt * 0.0012;
    q.rot += q.vr * dt * 0.0016;
    q.el.style.transform = `translate(${q.x.toFixed(1)}px, ${q.y.toFixed(1)}px) rotate(${q.rot.toFixed(3)}rad) scale(${(1 + u * .25).toFixed(2)})`;
    q.el.style.opacity = (u < .18 ? u / .18 : 1 - (u - .18) / .82).toFixed(3);
  }

  requestAnimationFrame(loop);
}

/* ============================================================================
   6. 交互绑定
   ========================================================================== */
$('slots').addEventListener('click', (e) => {
  const el = e.target.closest('[data-slot]');
  if (!el) return;
  const p = byId(el.dataset.slot);
  if (!p) return;
  if (!isUnlocked(p)) {
    toast(`通关第 ${p.at} 关后 · ${p.name} 会到家`);
    return;
  }
  setActive(p.id);
});

$('go').addEventListener('click', () => {
  const a = byId(save.active) || PETS[0];
  location.href = `grove.html?from=home&hero=${a.hero}&stage=${firstUncleared()}`;
});

document.querySelectorAll('[data-say]').forEach((el) => {
  el.addEventListener('click', () => toast(el.dataset.say));
});

/* 调试：让用户不用真打完 8 关也能看解锁节奏 */
$('dev').addEventListener('click', (e) => {
  const b = e.target.closest('[data-dev]');
  if (!b) return;
  const act = b.dataset.dev;

  if (act === 'clear') {
    const s = firstUncleared();
    if (!save.cleared.includes(s)) save.cleared.push(s);
    writeSave();
    const fresh = pendingIntro();
    for (const p of fresh) { save.seen.push(p.id); queueIntro(p); }
    writeSave();
    renderSlots();
    if (!fresh.length) toast(`第 ${s + 1} 关记为通关`);
  }

  if (act === 'all') {
    save.cleared = [0,1,2,3,4,5,6,7];
    writeSave();
    for (const p of pendingIntro()) { save.seen.push(p.id); queueIntro(p); }
    writeSave();
    renderSlots();
  }

  if (act === 'reset') {
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }
});

boot().catch(e => { console.error(e); });
</script>
</body>
</html>
