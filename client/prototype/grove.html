 *  表现就是用户说的那句：**能不能上去取决于玩家站在哪，而玩家推不出规则。**
 *  同一只虫、同一块台面，你站左边它上得来、站右边它上不来 —— 这不是难度，
 *  是"没有规则"。
 *
 *  ## 改完之后玩家能自己算出来的规则
 *
 *  **它只在"这一跳真的能落到更高的那层"时才蹲。**
 *  所以每一次蹲身都兑现，不会再有白跳；够不着的时候它不装样子，
 *  而是沿着板底朝你走过来 —— 走到够得着的地方再起跳。
 *  "它从哪上来"于是变成玩家能预判、也能用站位去**引导**的东西。
 *
 *  ## 判据必须和 stepBody 同源
 *
 *  单向平台的判据是 `prevY <= p.y + 2 && y >= p.y`；木桩是实心墙。
 *  这里逐帧复刻这两条，就是为了不出现"算着能上、实际掉回去" ——
 *  那比不跳更伤，因为它让玩家学会不信任预告。
 *  **预演不许有副作用**：全程只读，不改 f 的任何字段，也不消耗随机数。
 */
function pounceLands(f, dir) {
  const dt = 1 / 60;
  const vx = dir * JUMPER_PUSH;
  const startY = f.y;
  let x = f.x, y = f.y, vy = -JUMPER_VY;

  for (let i = 0; i < 60; i++) {
    const prevY = y;
    x += vx * dt;
    if (x - f.w / 2 < WALL_L) x = WALL_L + f.w / 2;
    if (x + f.w / 2 > WALL_R) x = WALL_R - f.w / 2;

    /* 木桩实心：横向被吃掉之后，这一跳的落点就跟着变了，
       与其算一个假的落点，不如直接判定"上不去"。 */
    for (const s of S.stumps) {
      if (s.hp <= 0) continue;
      const top = s.y - s.h;
      if (y <= top + 4) continue;
      if (y - f.h >= s.y - 2) continue;
      if (x + f.w / 2 > s.x - s.w / 2 && x - f.w / 2 < s.x + s.w / 2) return false;
    }

    vy = Math.min(vy + GRAV * dt, MAXFALL);
    y += vy * dt;

    /* ---- 只查"这一跳会不会真的落到更高的那层" ----
     *
     * **单向平台允许从板底穿上去**（`stepBody` 里 `prevY <= p.y + 2 && y >= p.y`），
     * 玩家自己就是这么跳的 —— 所以虫穿板**不是 bug，是同一条语法**。
     * 我曾经试过让虫"绕到板外侧再跳"来避免穿模，结果是：它要绕到板外
     * 约 70px 才不穿（脚到板底要 0.126s、横移 26px，再加上半个身位），
     * 而绕出去之后朝向会被"朝玩家"覆盖回去，在板沿上来回震荡 13px，
     * 7 屏里 6 屏永远上不来。**为了躲两帧穿模，把机制直接搞死，不值。**
     * 穿模用遮挡解决（`platOverFoe` + 板顶暗影），那才是单向平台的标准画法。
     *
     * 这里只留真正该管的事：落点必须在**更高**的层，否则别跳。
     * 3px 容差：脚正好擦过板顶的那一帧不算"落到板上"以外的情况。
     */
    if (vy >= 0) {
      let best = null;
      for (const p of PLATS) {
        if (isBroken(p)) continue;
        if (x + f.w / 2 < p.x || x - f.w / 2 > p.x + p.w) continue;
        if (prevY <= p.y + 2 && y >= p.y) { if (best == null || p.y < best) best = p.y; }
      }
      if (best != null) {
        /* 至少上去半层才算"上去了"。同层落地（rise = 0）是原地跳，
           玩家眼里和"没跳"没区别，不如不跳。 */
        return (startY - best) >= 60;
      }
    }

    if (y > H + 100) return false;
  }
  return false;
}


/* ============================================================================
   6. 建局
   ========================================================================== */
function curStage() { return ACTIVE[S.stage] || ACTIVE[0] || LEVELS[0]; }
function curGoal() { return GOALS[curStage().goal]; }

/** 还剩几颗造球额度；没写 `ballLimit` 的关卡返回 Infinity。
 *
 * ★ **额度是关卡字段，不是目标类型。**
 *
 * 原来这里是 `if (st.goal !== "limit") return Infinity;` —— 也就是说
 * 「球是有限的」这件事只能作为**目标**存在，一屏只能考它，不能和别的
 * 目标叠加。而 7 种目标本来就是互斥的单选，于是整部游戏变成了
 * 「一屏考一件事」：这屏考连锁、那屏考限球、另一屏考收成。
 *
 * 但**策略需要两件事同时成立**：有约束（球不够）× 有价值差（火坑双份）。
 * 单选结构把这两件事永远隔开，所以 27 屏里没有一屏真的要求玩家权衡 ——
 * 球免费的时候"每只单独推一次"就是最优解（落袋给 holds+1，拆开比卷起来还赚），
 * 所有坡、滑道、缺口都退化成"更好看的解法"。
 *
 * 解耦之后 `clear / collect / chain / bank` 任意目标都能叠加球额度。
 * 老的四屏 `limit` 行为完全不变（它们本来就带 ballLimit）。
 */
function ballBudget() {
  const st = curStage();
  if (st.ballLimit == null) return Infinity;
  /* `wideball` 加的是**可用额度**，不改 `st.ballLimit` 本身。
     改字段的话，`par.made` 的评级口径会跟着漂 —— 那是关卡数据，不是玩家资产。 */
  const cap = st.ballLimit + perkLv("wideball");
  return Math.max(0, cap - S.stat.made);
}

/**
 * 造一只敌人。BOSS 也走这一条 —— 它只是"cm 更大的敌人"，
 * 不是第二套规则。玩家因此不用学新东西：糊满 → 变球 → 推进坑。
 *
 * `fromSky` 只对 BOSS 用：从高处砸下来，给自己一个登场。
 */
function foeFromSpec(sp, fromSky) {
  const def = FOES[sp.foe] || FOES.bug;
  const isBoss = sp.foe === "boss";
  const lv = sp.lv || 1;
  const w = isBoss ? 78 + lv * 6 : def.w;
  const h = isBoss ? 84 + lv * 6 : def.h;
  const f = {
    def, kind: isBoss ? "charge" : def.kind,
    isBoss: !!isBoss, lv,
    x: sp.x, y: fromSky ? -140 : sp.y,
    w, h,
    vx: 0, vy: fromSky ? 300 : 0, face: -1,
    coat: 0,
    // cm = 包裹上限。普通怪 3 层（也就是一次"糊满"），
    // BOSS 4 + lv：第 1 关 5 层，第 8 关 10 层（封顶）。
    // 原来写 3+lv，实测第 2 关 BOSS **2 秒就被糊成球**（玩家站在 100px 外
    // 一直喷，抗性 0.28s 根本拦不住），比小怪还短命 —— BOSS 至少得让玩家
    // 躲过一次砸地才算数。
    cm: isBoss ? Math.min(4 + lv, 10) : (3 + (modOn("thick") ? 1 : 0)),
    dead: false,
    onGround: def.kind !== "fly" && def.kind !== "moth" && !fromSky, ground: null,
    /* ---- 深巢四怪的专属状态（2026-10-26）----
     * 全部在这里给初值。**不许在 updateFoe / drawFoe 里判 `=== undefined`**：
     * 那种写法在"某条路径忘了赋值"时会静默变成 0，而 0 在时间类字段上
     * 等于"立刻触发"，读出来是"蛾子一进场就掉下来"这种没法归因的怪现象。 */
    invuln: 0,                        // 无敌窗口（地脉虫缩回时）
    /* 探头周期的相位：**不能在这里调 `rand()`**。
     *
     * 这里踩过一次（2026-10-26）：写成 `boreT: rand(0, 4)` 之后，
     * **主线 27 屏的 ALL9 当场三条红**（第 9/15/18 屏）。
     * 原因不是深巢的东西漏到主线，而是 `rand` 消耗的是 `S.rng` ——
     * 主线的每一只敌人也走这个函数，每只多消耗一次随机数，
     * 后面所有 `rand`/`S.rng` 的结果整体位移一位，机器人行为全变。
     * 这是"同一个随机流不能顺手多用一个数"的第 N 次复发。
     *
     * 所以相位改成从 `ph` 派生（`ph` 本来就有，不新增消耗），在下面赋值。 */
    boreT: 0, boreUp: 0,              // 地脉虫：探头周期（4 秒一轮，探头 2 秒）
    lit: 0,                           // 巢蛾：累计被光照了多久
    falling: false,                   // 巢蛾：被照掉、正在落地（落下来才能被推）
    rollV: 0,                         // 石壳：自己的水平速度，不走 def.spd
    /* 巢蛾在空中飘，不走 stepBody —— 它的 y 由 homeY 直接决定。
       `fly` 这个字段只留给乌鸦（它有一段"贴向玩家 + 正弦下沉"的专用逻辑），
       巢蛾走自己的分支，两者混用会让乌鸦那套 83% 可打窗口的调参白费。 */
    moth: def.kind === "moth",
    /* 悬停基准高度。**必须夹在可打区间里** —— fly 的 y 是每帧用
       `homeY + 18 + sin` 直接赋值的（不走 stepBody，没有重力、不会掉下去），
       所以 homeY 一旦非法，这只鸦就永久挂在那个高度：不落地、不越界、
       也不会被"掉出屏幕"兜底收掉。它会一直占着"还有一只没送走"，
       整层清场判定永远不成立 → 240 秒超时。
       上限取 GROUND_Y - 80：再低就贴地了（视觉上像站在地上飞）。 */
    fly: def.kind === "fly", homeY: Math.min(sp.y, GROUND_Y - 80),
    stun: 0, hitT: 0, bob: rand(0, 6.28),
    /* 步态相位：**出生定死，永不推进**。
       `bob` 和它必须分成两个字段，混用是这个游戏最长寿的一个 bug：
       `bob` 在 updateFoe 里每秒 +3.2（给乌鸦悬停 / BOSS 呼吸用的累加器），
       而绘制步态拿 `S.t + f.bob` 当相位 —— 等于相位被推进 1+3.2 = 4.2 倍。
       野猪 stepT=0.45 本该 2.2 步/秒，实测 9.3 步/秒，读出来就是"原地抽"。 */
    ph: rand(0, 6.28),
    dir: S.rng() < 0.5 ? -1 : 1,
    chargeT: rand(1.2, 3.2), charging: 0,
    // 落地 1.2 秒就砸第一次（不是 2.6）：2.6 秒的空窗里玩家已经把它糊成球了，
    // "举起来"这一下全程没机会播。
    /* 流派。BOSS 才有，普通怪是 null。
       `SCAPE` 在 loadLevel 里已经设好，这里直接读 —— 同一个产地的 BOSS
       打法一致，这正是"三章三套 BOSS"的意思。 */
    bossStyle: isBoss ? (BOSS_STYLE[SCAPE] || BOSS_STYLE.hills) : null,
    /* 断台 / 泥潮两条计时。
       ★ 这里原先还有半句"crusher 没有产卵、sump 没有砸地"—— **已经删掉**。
       那个做法想让三族"看起来不一样"，方式是**减动作**，结果 ALL9 三条红：
       减掉的不是"多余的一招"，是敌人的来源（产卵）和玩家的走位时机（砸地逼跳）。
       现在三族的基础三件全部保留，区别只在**加法**：cliffs 多断台、marsh 多泥潮。 */
    crackT: isBoss ? 3.0 : 0, cracking: 0,
    mudT: isBoss ? 3.6 : 0, mucking: 0,
    /* 预告锁定的目标。undefined 表示"没在抬手"。
       绘制层读这两个字段画圈；结算时读同一个值落手。**一份数据两处用**，
       所以画的和砸的不可能不是同一块。 */
    _crackTgt: null, _mudSpot: null,
    slamT: isBoss ? 1.2 : 2.6, slamming: 0,
    // 繁殖 / 散射两条计时。三条动作（砸地 6.5s、散射 5.5s、产卵 7.5s）
    // 特意错开，玩家的"跳 / 走位 / 攻击"三个动作才能轮流用上，
    // 挤在同一秒就成了"同时干三件事"，那是难度不是设计。
    scatterT: isBoss ? 3.4 : 0, spitting: 0,
    spawnT: isBoss ? 4.4 : 0, breeding: 0,
    spawned: 0, fed: 0,
    larva: sp.foe === "larva",
    // 空中登场：一路穿平台直落地面。不设这个的话，BOSS 会被 156 层的塔尖
    // 接住 —— 每关的塔尖位置都不一样，它就会"卡在半空"，玩家够不着。
    dropT: fromSky ? 99 : 0,
    skyDrop: !!fromSky,
  };
  /* ============================================================================
     跳虫：**出场已关闭**（2026-10-27 玩家砍）
     ----------------------------------------------------------------------------
     原设计：主线刺毛虫里约 1/3（`f.ph < 2.09`）会追人、会往上一层扑，
     头顶挂一个橙色感叹号三角当身份标记。

     砍的原因不是它做得不好，是**这个设计从根上不可教**：

     1. 外观完全一样。跳虫就是刺毛虫，靠一个头顶三角区分。
        玩家的原话是「这种敌方我不需要可以跳」—— 他看到的是同一种虫，
        行为却不一样。同一屏里四只虫约 80% 的概率至少有一只会跳，
        但玩家没法从"它长什么样"推出"它会不会跳"，只能把每只都当会跳，
        于是**每一只刺毛虫都变贵了**：不敢靠近、不敢推、先打远处那只。
        这不是难度，这是把所有普通怪的成本一起抬高。

     2. 走到最左边会来回蹭。追人时用 8px 死区判朝向，速度 66px/s
        （一帧 1.1px），贴脸后 face 卡在旧值继续朝墙走；撞墙触发
        `wallT = 0.45` 强制背离，走开 26px 又因为死区没解除而转身撞回来。
        实测第 5 屏左端台面：6 秒内速度反向 9 次、撞墙帧占 35%，
        也就是**三分之一的时间它在"背离"状态里抖**（`_left-jitter.js`）。

     3. 它想解决的结构性缺失（"玩家跳上台面就绝对安全"）应该用
        **关卡与武器**去回答，不该用一只伪装成普通怪的怪去回答。
        真正该做的是把"高度"写进关卡目标、或给敌人一个**看起来就会远程**
        的独立剪影 —— 那才是玩家能预判的东西。

     **状态机代码全部保留**（`crouch → pounce → landT`、`pounceLands` 预演、
     蹲身压扁、脚下脉冲环、抬头标记）。它有完整的"预告-可躲-可反击"三段窗口，
     是干净的实现；将来做成**独立怪种**（独立外观、独立名字）时直接接上，
     把 `f.jumper` 的赋值换成按 `sp.foe` 判定即可。
     ========================================================================== */
  f.jumper = 0;
  f.jumpCd = 0;      // 扑击冷却
  f.crouch = 0;      // 起跳前蹲身（预告）剩余时间
  f.pounce = 0;      // 滞空计时：这段时间里 vx 不许被重算
  f.landT = 0;       // 落地硬直
  f.pounceDir = 0;   // 这一次往哪边扑
  f.wallT = 0;       // 撞桩/撞墙后强制背离的剩余时间（见 updateFoe 里的死锁注释）
  /* 地脉虫的探头相位从 `ph` 派生（见上面 boreT 的注释：这里不能多消耗随机数）。
     这样同一波的几只会错开探头 —— 同时探头的脉虫读作"一整排墙"。 */
  f.boreT = (f.ph || 0) % 4;
  nudgeOutOfStumps(f);
  return f;
}

/**
 * 出生点压在实心木桩里 → 当场推到桩外侧。
 *
 * 为什么必须在"出生"这一刻解决：stepBody 的木桩判定是"重叠了就顶到桩外侧"，
 * 而敌人的朝向每帧由玩家位置重写。两者一叠加就是死循环 ——
 * 顶出去 → 下帧又朝玩家（也就是朝桩）走 → 又被顶回同一个位置。
 * 实测第 5 关的野猪：8 秒 480 帧，x 恒为 700，hitWall 帧帧 -1，一步没动。
 * 玩家看到的就是"开局卡在木头那儿半天"，直到把桩打碎它才挪窝。
 *
 * 推向哪一侧：**朝玩家那一侧**。推到背后的话，它下一帧又要朝玩家走回来，
 * 等于原地转圈；推到玩家这一侧，它一出生就是畅通的直线。
 */
function nudgeOutOfStumps(f) {
  /* BOSS 不动。它的站位是关卡设计的一部分（砸地/产卵的落点都按那个 x 算），
     而且它体积大、可能和桩半重叠是"看起来像站在桩后面"，不是卡死。
     实测把 BOSS 挪开 77px 会让它的五发弹幕有 4 发直接撞进平台，
     扇形机制整个失效 —— 这类对象不该被一条防卡死的保险顺手改位置。 */
  if (f.isBoss) return;
  /* 巢蛾同理：它在空中飘，木桩在它脚下几十像素的地方，
     "推到桩外侧"会把一只空中的怪横着挪一格，读作瞬移。 */
  if (f.moth) return;
  /* JSDoc 注解不是装饰：S.stumps 初始是 []，TS 会把它推成 never[]，
     循环体里每个 s.hp / s.x 都变成 "does not exist on type 'never'"。
     加一行 any[] 让类型检查闭嘴，同时这行在纯 JS 里也完全合法。 */
  const stumps = /** @type {any[]} */ (S.stumps);
  for (const s of stumps) {
    if (s.hp <= 0) continue;
    const top = s.y - s.h;
    if (f.y <= top + 4) continue;           // 站在桩顶上
    if (f.y - f.h >= s.y - 2) continue;     // 在桩底下面（下一层）
    const l = s.x - s.w / 2, r = s.x + s.w / 2;
    if (!(f.x + f.w / 2 > l && f.x - f.w / 2 < r)) continue;
    /* 优先朝玩家那侧；玩家位置拿不到（开局第一帧）就按它自己偏向哪边推。 */
    const p0 = /** @type {any} */ (S.p);
    const toPlayer = p0 ? sign(p0.x - s.x) : 0;
    const side = toPlayer || sign(f.x - s.x) || -1;
    f.x = side > 0 ? r + f.w / 2 + 1 : l - f.w / 2 - 1;
    f.x = clamp(f.x, WALL_L + f.w / 2, WALL_R - f.w / 2);
    /* 普通怪用 dir 定朝向，一出生就该朝着玩家走，别对着墙。 */
    f.dir = -side;
  }
}

/** 铺第 i 波。i=0 是开场，不打标题 —— 开场就弹字会盖住选人界面的余韵 */
function spawnWave(i) {
  const wv = WAVES[i] || [];
  const bossWave = wv.some(sp => sp.foe === "boss");
  for (const sp of wv) S.foes.push(foeFromSpec(sp, bossWave && sp.foe === "boss"));
  S.wave = i;
  S.waveT = 0;
  S.waveGap = 0;

  if (i > 0) {
    addText(W / 2, 176, bossWave ? "BOSS 来了" : "第 " + (i + 1) + " 波",
            bossWave ? "#FF8A6B" : "#FFE066", bossWave ? 38 : 28, bossWave ? 1.9 : 1.5);
    S.shake = Math.max(S.shake, bossWave ? 9 : 3);
    if (bossWave) S.flash = 0.14;
  }
}

function setupLevel() {
  S.foes = [];
  S.wave = 0;
  S.waveT = 0;
  S.waveGap = 0;
  S.shocks = [];
  S.foeShots = [];
  S.total = 0;
  for (const wv of WAVES) S.total += wv.length;
  spawnWave(0);
  S.stumps = STUMPS.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, hp: s.hp, shake: 0 }));
  /* 雾与菌光囊是**关卡级状态**，和 stumps 同一条规矩：
     从关卡数据拷一份，不写回 `L` 本身。直接引用的话，重打这一层时
     上一把打碎的囊还是碎的 —— 而"雾巢"的核心就是每次都要重新摸一遍。
     主线没有 `pods` 字段，这里自然得到 [] ，下面所有分支靠 `S.fog` 守门。 */
  S.fog = S.nest ? nestFogInit() : null;
  S.pods = (S.nest && curStage().pods ? curStage().pods : []).map(p =>
    ({ x: p.x, y: p.y, w: p.w, h: p.h, lit: false, burstT: 0 }));
  S.drops = [];
  S.shots = [];
  S.balls = [];
  S.frags = [];
  S.dust = [];
  S.texts = [];
  S.food = 0;
  S.killed = 0;
  S.failWhy = "";
  // 台词每关重置：first / big 是"这一关的第一次"，跨关累计就永远不说了
  S.say.txt = ""; S.say.t = 0; S.say.life = 0; S.say.fired = {};
  S.stat = { made: 0, burned: 0, banked: 0, burst: 0, drowned: 0, hits: 0, bankHolds: 0, maxHolds: 0, chests: 0, toured: 0, shroom: 0, rampIn: 0 };
  S.t = 0;
  S.shake = 0;
  S.flash = 0;
  S.hitStop = 0;
}

/** 回选人界面 */
function resetRun() {
  S.phase = "select";
  S.p = null;
  loadLevel(0);
  setupLevel();
}

/** 开一关：装几何 -> 铺敌人 -> 放玩家 */
function beginRun(i) {
  /* 本趟目标：每次起一屏都重读 —— 玩家可能在主界面换了一趟再进来。 */
  S.tripGoals = readTripGoals();
  if (typeof i === "number") S.stage = clamp(i, 0, ACTIVE.length - 1);
  S.playT = 0;
  S.clearT = 0;
  /* 清掉上一关留下的"打之前最好成绩"。不清的话，重打第 3 关时
     结算面板会拿第 2 关的纪录去比，把"首次记录"错报成"新纪录"。 */
  S.rankPrev = "";
  /* 雪和脚印是**关卡级状态**，必须跟着关卡重置 ——
     从雪原走回暖金森林时如果不清，雪会跟着飘到第 1 关（TH.snow 是 false，
     落雪drawSnowfall 会自己 return，但脚印是数组，不会自己消失）。 */
  S.snowDepth = 0;
  S.footprints.length = 0;
  /* 上一关到家那几只不许跟到下一关的结算卡上 —— 结算卡的横幅是
     "刚刚发生的事"，留着上一关的名字就会变成"这一关也在解锁谁"。 */
  S.unlocked = [];
  /* 星靶是**每屏一份**的状态：不清的话，第 6 屏的卡上会画着第 5 屏
     达成的靶（judgeStar 会在第 6 屏结束时覆盖它，但从第 5 屏通关
     到第 6 屏结束之前，任何读到它的代码看到的都是旧屏的数据）。 */
  S.starMet = [];
  S.starFresh = [];
  S.starGain = { shards: 0, logs: 0 };
  /* 深巢不写主线进度：`S.progress` 的唯一语义是"主线推到第几屏"，
     深巢的层号是**另一条轴**（S.nest.depth + 存档的 nest 字段）。
     混在一起的话，下潜 20 层会把主线进度顶到 20，回主界面一看
     "已经打通 20 屏"而实际一屏没打 —— 这是"一个数字表达两件事"。 */
  if (!S.nest) S.progress = Math.max(S.progress, S.stage);
  const SI = curStage();
  loadLevel(S.stage);
  setupLevel();

  const H = HEROES[S.heroIdx];
  S.p = {
    hero: S.heroIdx,
    x: PLAYER_SPAWN.x, y: PLAYER_SPAWN.y,
    w: H.w, h: H.h,
    vx: 0, vy: 0,
    face: 1,
    onGround: true, ground: PLATS[0],
    hp: 4, maxHp: 4,
    invT: 0, atkT: 0, dashT: 0, dashCd: 0,
    coyote: 0, jumpBuf: 0,
    castAnim: 0, dashAnim: 0, walkPhase: 0,
    dead: false,
  };
  S.phase = "play";
  /* 开场大字只报**关卡名**，不重复报目标。
   *
   * 「第 8 关 双塔 · 全部送回家」这句里的目标名，右上角卡片第一行**已经写着**
   * 同样的四个字，而且卡片是常驻的、字更大、旁边还有进度。
   * 同一句话说两遍不会让人更清楚，只会让"全部送回家"这行字看起来
   * 像关卡名字的一部分 —— 玩家读成「这关叫'双塔·全部送回家'」。
   *
   * **编号也改成章节口径。** 这里原来写「第 10 关 枯木坡口」——
   * 玩家一进场就被告知"这是第 10 关"，于是 27 屏被读成一条 27 长的直线。
   * 顶部 HUD 已经改成「枯木坡 · 1 / 9」，开场大字必须同源，
   * 否则同一块屏幕上两种编号打架。
   */
  {
    /* 深巢的层号是另一条轴，开场只报「深巢 · 第 N 层」（层名就是"第 N 层"，
       再拼屏名会变成"第 7 层 · 第 7 层"）。主线沿用「产地 第 N 屏 · 屏名」。 */
    if (S.nest) {
      addText(W / 2, 150, (S.nest.brood || "深巢") + " · 第 " + S.nest.depth + " 层", "#FFFFFF", 26, 1.6);
      /* 这一层**新解锁**的词条单独报一次（2026-10-27）。
         不报的话，深 15 玩家的第一反应是"我的 Shift 坏了"——
         规则变了必须说出来，这是词条和数值惩罚的区别。 */
      if (S.nest.fresh && S.nest.fresh.length) {
        const t = S.nest.fresh.map(function (m) { return m.name + " · " + m.desc; }).join("　　");
        addText(W / 2, 184, "词条生效　" + t, "#FFD86B", 16, 2.4);
      }
    } else {
      const ch = chapterOfStage(S.stage);
      addText(W / 2, 150, ch.name + " 第 " + (S.stage - ch.from + 1) + " 屏 · " + SI.name,
              "#FFFFFF", 26, 1.6);
    }
  }
  // 全饿的第一关必须说明白。不说的话，玩家按 K 没反应只会觉得游戏坏了
  if (bellyTier() === 0) {
    addText(W / 2, 194, "它饿得跑不动了 —— 推不动就收工回家", "#FFC9A8", 17, 4.2);
  }
}

/**
 * 推关：通关就往下走，失败就重打本关。
 * **正常运行时不回关卡列表** —— 一回到列表，"推关"的感觉就断了，
 * 人会开始挑着打。
 *
 * 唯一的例外是**最后一屏之后**：原来那里是 openPick()（27 格全亮刷 S），
 * 挑一屏 2026-10-26 删除后换成回出征页 —— 那里有当前进度、三颗星条件，
 * 想刷 S 从那儿再进同一屏，想收工按 E。**"没得玩了"这句话不该由游戏来说。 */
function nextLevel() {
  /* ---- 深巢：无尽 ---- */
  /* 打不过 → 重打本层（ACTIVE 里只有这一层，"只丢这一层的收成"）；
     打过 → 直接下潜下一层。**不回出征页** —— 每层断一次，
     无尽就退化成"闯关列表"，而列表恰恰是这游戏刻意不做的东西。 */
  if (S.nest) {
    if (S.phase === "fail") { beginRun(0); return; }
    enterNest(S.nest.depth + 1);
    return;
  }
  if (S.phase === "fail") { beginRun(S.stage); return; }
  if (S.stage + 1 < ACTIVE.length) { beginRun(S.stage + 1); return; }
  openGates();
}

/* ---------- 饱食 ----------
 * 三档只影响**看得见的东西**（肚子、眼睛、跑不跑得动），不碰火力。
 * 火力是 P2 的事：那时"半饿最强"才会接进来，现在提前做会把数值和
 * 表现搅在一起，改一个得同时验另一个。
 */
function bellyTier(v) {
  const b = v === undefined ? S.belly : v;
  return b < 30 ? 0 : b < 70 ? 1 : 2;      // 0 全饿 / 1 半饿 / 2 满饱
}

/* 饱食 → 火力。**全篇只有这一处把肚子接进战斗数值。**
 *
 * ---- 2026-10-24 改：从「半饿最强」改成「越饱越强」----
 *
 * 原来这里是 [0.92, 1.12, 1.00]（全饿 / 半饿 / 满饱），意图是
 * "七分饱最好干活：吃太饱犯困，饿透了没劲"。这个形状有个硬伤：
 *
 *   出门 100 → 满饱 1.00（**最弱**）
 *   过 2 屏 68 → 半饿 1.12（**最强**）
 *   过 5 屏 20 → 全饿 0.92
 *
 * 曲线是**非单调**的（平 → 升 → 降）。后果三条，都是实测出来的：
 *   ① 玩家没办法从这条线上读出"我现在该回家了吗" ——
 *      而它每 77 秒就弹一次（一屏 par 均值），是最频繁的那个决策；
 *   ② **"喂饱了反而软"**：计划书里 0:20 的第一次交互就是喂饭，
 *      喂完出门是最弱档，这个动作在数值上等于惩罚；
 *   ③ 代价只有 −18%（1.12→0.92），而倍率收益 +25%（1.60→2.00），
 *      算下来永远"继续" —— 于是"收工"从来没被选过，"继续/收工"
 *      退化成每屏弹一次的确认框，答案永远是同一个。
 *
 * 现在改成单调：**满饱 1.00 > 半饿 0.95 > 全饿 0.86**。
 * 喂饭第一次成为正收益；每多打一屏都在变弱，收工点才浮得出来。
 * 贪的甜头全部交给连锁倍率（1+0.15n），两个机制各管一件事、不再打架。
 *
 * **满饱 = 1.00 这一条绝对不能动，它是基准线。**
 * 27 屏的落点、竖井、营地全按"满饱推出去多远"（PUSH_BASE=620）调过，
 * 给满饱任何惩罚（哪怕 0.96 的"犯困"）都等于把所有关卡悄悄调紧 ——
 * 实测后果是第 1 屏的机器人直接清不完，球差一点进不了营地。
 * 所以这里只往下压**饿**的两档，基准不动。
 *
 * 幅度同样控制在 −14% 以内：再大就不是"饿不饿"，而是"换了一张地图"，
 * 那种改动必须连关卡数据一起调，不能在这里偷偷加系数。
 */
function bellyPower() {
  return [0.86, 0.95, 1.00][bellyTier()];
}
/** 饱食的三档说法。**必须给词，不能只给条** —— 一个没有刻度的条
 *  玩家只能看出"少了"，看不出"我现在是哪一档、该不该回家"。 */
function bellyWord() {
  return ["饿着呢", "七分饱", "刚吃饱"][bellyTier()];
}

/** 每过一屏掉多少饱食。**唯一真值** —— 通关判定和结算卡副标题都读它。
 *  原来这个 20 在两处各写一次，改一处另一处就骗人。 */
/* ============================================================================
   这一脚推出去有多重
   ----------------------------------------------------------------------------
   **推球和预瞄线必须共用这一个函数。**
   分开算过一次：predictBall 里写死 PUSH_BASE，于是玩家助跑跑满了，
   按住 Shift 看到的线还是"上不去"，照着线判断就放弃了。
   第 7 屏（回弹井）的整屏机制就建立在"助跑长度决定弹射高度"上，
   预瞄线不跟着助跑变，那一屏等于没有预瞄 —— 比不画更糟。
   ========================================================================== */
function pushPowerNow() {
  const p = S.p;
  const runUp = p ? Math.min(1, (p.runD || 0) / 380) : 0;
  /* 「沉石」（深 5）唯一挂载点。**必须挂在这个函数上而不是推球处** ——
     预瞄线也读它，写死在推球那边的话，线会按旧力度画，
     玩家照着线推会扑空（第 7 屏就是靠"线骗不骗人"立起来的）。 */
  const mod = modOn("heavy") ? 0.85 : 1;
  return PUSH_BASE * (1 + PUSH_RUN * runUp) * bellyPower() * mod;
}

const BELLY_PER_CLEAR = 20;

/** 这一屏实际掉多少饱。`thrift`（精打细算）是唯一的修改者。
 *
 * **为什么要把 20 包一层函数，而不是直接在扣血处写三元**：
 * 掉饱被读的地方有两处 —— 真扣（通关时）和预览（`nextBellyHint` 的
 * "下一屏之后是几档"）。两处各写一次三元，就会出现"预览说还有半饱、
 * 打完发现已经饿了"的分叉。函数只有一个返回值，两处不可能不一样。 */
/** 一颗球能滚多久。「空心」（深 30）砍 30%。
 *  包成函数是因为 `PUSH_LIFE` 有**两处**读（关卡里超时爆球、扔出去后的
 *  自由滚落），只改一处会变成"显示上说散了、实际还在滚"。 */
function ballLife() {
  return PUSH_LIFE * (modOn("hollow") ? 0.7 : 1);
}

/** 精打细算的四档掉饱。第 1 层 15 是原来那个数（一趟多走一屏），
 *  往上每层再省一点 —— 但不能省到 5 以下，否则"肚子"这个系统就没了。 */
const THRIFT_BELLY = [BELLY_PER_CLEAR, 15, 12, 10];

function bellyCost() {
  const base = THRIFT_BELLY[perkLv("thrift")] || BELLY_PER_CLEAR;
  /* 「饥肠」（深 20）。乘在**这里**而不是扣血处：预览
     （`nextBellyHint` 算"下一屏之后是几档"）也读这个函数，
     两处各乘一次就会变成"预览说还半饱、打完已经饿了"。 */
  return Math.round(base * (modOn("hunger") ? 1.5 : 1));
}

/** 结算卡「继续」副标题上的力气变化。**三态，不是两态。**
 *
 *  第一版只写了"降一档 / 见底"两个分支，结果满饱时（100 → 80，
 *  两边都还是满饱档）写成了"力气见底" —— 意思完全相反，
 *  玩家会以为打完这屏就废了。
 *
 *  抽成函数是为了让冒烟能验**真身**，而不是验一份抄过来的副本
 *  （项目里"同一件事存两份必然漂移"已经栽过三次）。
 */
function nextBellyHint(from) {
  const cur = from === undefined ? S.belly : from;
  const a = bellyTier(cur);
  const b = bellyTier(Math.max(0, cur - bellyCost()));
  if (b >= a) return "力气不变";
  return b === 0 ? "力气见底" : "力气降一档";
}

/** 关卡里冒一句话。新的直接盖掉旧的 —— 排队会在玩家已经跑远的时候冒出来 */
function sayLine(kind) {
  const H = HEROES[S.p ? S.p.hero : S.heroIdx];
  const V = VOICE[H.id] || VOICE.cat;
  let txt = V[kind] || "";
  if (!txt) return;
  // 饿到全饿的时候，挨打那句要换语气 —— 同一只饿和饱，说话不是一个调
  if (kind === "hurt" && bellyTier() === 0) txt = "……真的跑不动了。";
  S.say.txt = txt;
  S.say.t = 0;
  S.say.life = 2.1;
}

/** 结算面板上那句话。它跟"饿不饿"绑：饱着是邀功，饿着是求饶 */
function finishSay(ok) {
  const id = HEROES[S.heroIdx].id;
  if (!ok) {
    return {
      cat: "……丢脸。", dog: "我还能再试一次吗？", ham: "先吃点东西。",
      rab: "……对不起。", ox: "歇一下就好。", fox: "没人看见。",
    }[id] || "再给我一次。";
  }
  const tier = bellyTier();
  if (tier === 0) return "先……先回家吧。";
  if (tier === 1) return "还走得动。";
  return {
    cat: "这一片我先看过了。", dog: "回去吧回去吧！", ham: "我能带走一点吗？",
    rab: "抱我一下。", ox: "不着急。", fox: "天还没亮。",
  }[id] || "走吧。";
}

/**
 * 收工回家：这一趟到此为止。
 *
 * 结算 = 这一趟攒的收成 × 连锁倍率，**只有收工才拿得到倍率**。
 * 于是"每关都回家"是安全打法（永远 ×1.0），"贪到底"是赚的打法（×2.0）——
 * 两种都算在玩，但贪的那个得扛着饿。这是全篇唯一不做失败惩罚的张力来源。
 */
function goHome(allClear) {
  /* 那 12 份"走完全部"的奖励**在通关那一刻就发过了**（见 tick 里的 clear 判定）。
   * 原来挂在这里的 `+ (allClear ? 12 : 0)` 有个漏洞：结算卡上点「收工回家」
   * 传的是 `goHome(false)`，走完最后一屏点收工 = 拿不到这 12 份。
   * 同一件事两条路两种结果，玩家一定会撞上少给的那条。 */
  const gain = Math.round(S.trip.loot * S.trip.multi);
  S.home.loot += gain;
  S.home.lastLoot = gain;
  S.home.lastStages = S.trip.stages;
  S.home.runs++;
  S.belly = 100;                         // 回家吃饭
  /* 一趟结束就换一本新账。**字段必须和 `S` 的初值一字不差** ——
     这里少写一个，收工之后那个字段就是 undefined，下一趟从 NaN 起算。
     `rankLogs` / `nestCoins` 就是 2026-10-27 这么漏掉的：读点上靠
     `|| 0` 兜住了，所以没炸，但类型检查一眼就指出来了（TS2739）。 */
  S.trip = { loot: 0, multi: 1, stages: 0, rankLogs: 0, nestCoins: 0 };
  /* 星靶累计跟着一趟走：收工 = 这一趟的账结清。不重置的话，
     下一趟的结算卡会把上一趟攒的碎片也算进去。 */
  S.starShards = 0;
  S.starLogs = 0;
  S.starGain = { shards: 0, logs: 0 };
  S.phase = "select";
  S.p = null;
  S.door.pick = -1;
  S.door.leaveT = 0;
  S.say.txt = ""; S.say.t = 0; S.say.life = 0; S.say.fired = {};
  /* 进度不退回 —— "收工"不是惩罚，只是这一趟结束了。
   * 全通时**记成"走完了"而不是归零**：归零会把 27 屏的存档擦成第 1 关。 */
  if (allClear) S.progress = Math.max(S.progress, LEVELS.length);
  saveProgress();
  // 从家园进来的，收工就回主界面（解锁过场在那里播）
  if (FROM_HOME) { location.href = "game.html"; }
}

/* `progress` 的上界是 **LEVELS.length**（闭区间），不是 length-1。
   等于 length 就是"全部走完" —— 存档必须能表达这件事，否则全通和
   "卡在第 1 关"在磁盘上长得一模一样。 */
function saveProgress() {
  try { localStorage.setItem("pawpack.progress", String(clamp(S.progress, 0, LEVELS.length))); } catch (e) {}
}
function loadProgress() {
  try {
    const v = parseInt(localStorage.getItem("pawpack.progress"), 10);
    if (v >= 0 && v <= LEVELS.length) S.progress = v;
  } catch (e) {}
}

/* ---------------------------------------------------------------------------
   评级落盘

   进度和评级**分开存**：`pawpack.progress` 是一个数字（能打到第几关），
   `pawpack.best` 是 8 格数组（每关打得多好）。两件事独立变化 ——
   通关一次不代表拿了 S，重打刷 S 也不推进进度。

   为什么非存不可：`S.best` 原来是**死数据**。它被算出来、写进内存、
   然后没有任何地方读过它 —— 重启归零。一个 30 分钟的游戏，
   "刷 S"是仅有的重玩动机，而这个动机原来连凭证都不留。
   --------------------------------------------------------------------------- */
/**
 * 评级奖励判定 —— **纯函数，因为冒烟要直接测它**。
 *
 * 塞在清屏流程里的话，测试只能靠机器人打到通关，而"这一趟正好拿了 S"
 * 是不可控的（机器人有时候 3 星有时候 1 星）。抽出来之后
 * "打平不给 / 降级不给 / 升级给"这三条边界都能逐条钉死。
 *
 * 规则：
 *   · 首次达成 → 给
 *   · 评级提升 → 给
 *   · 打平     → **不给**（否则每次重打都白拿，第一屏能无限刷）
 *   · 降级     → 不给，而且不覆盖旧纪录（只升不降）
 *
 * @param {string} prevBest 这一屏之前的最佳（""=没打过）
 * @param {string} rk       这局拿到的评级
 */
function rankAward(prevBest, rk) {
  const ORD = { B: 1, A: 2, S: 3 };
  const LOGS = { S: 3, A: 2, B: 1 };
  if (!rk || !LOGS[rk]) return { better: false, best: prevBest || "", gain: 0 };
  const better = !prevBest || (ORD[rk] || 0) > (ORD[prevBest] || 0);
  return { better: better, best: better ? rk : prevBest, gain: better ? LOGS[rk] : 0 };
}

function saveBest() {
  try { localStorage.setItem("pawpack.best", JSON.stringify(S.best)); } catch (e) {}
}
function loadBest() {
  try {
    const raw = localStorage.getItem("pawpack.best");
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr)) return;
    /* 白名单：存档是外部输入（浏览器里能手改），
       一个 "SSS" 不该在图鉴上变成一行看不懂的字。 */
    for (let i = 0; i < S.best.length; i++) {
      const v = arr[i];
      if (v === "S" || v === "A" || v === "B") S.best[i] = v;
    }
  } catch (e) {}
}

/* ---------------------------------------------------------------------------
   战绩落盘：单屏最快用时 / 单屏最高连锁
   ---------------------------------------------------------------------------
   为什么必须单独存：`S.best` 只有评级（S/A/B），它能回答"打得多好"，
   回答不了"多快""多猛"。而"最快用时"这种数据**只有战斗侧拿得到** ——
   主界面没有 playT，永远算不出来。所以它必须在清屏那一刻写。

   键名 `pawpack.stats`，和 `pawpack.best` 分开存：
   后者是"每屏一格评级"（字符串数组，`loadBest` 里有白名单），
   前者是"每屏两个数"。合并成一个对象会让那个白名单失效。

   坏档一律当空处理：清一次纪录，好过崩一次。
   --------------------------------------------------------------------------- */
const STATS_KEY = "pawpack.stats";

/* ---------------------------------------------------------------------------
   本趟目标（2026-10-25）
   ---------------------------------------------------------------------------
   主界面出门时抽 2 条，写进 `pawpack.save.v1.tripGoals`；这里只读。

   **缩写表必须和 `HomeBiz.TRIP_GOALS` 的 `name` 逐字相等** ——
   两边各一份是必然的（一个 TS 一个内联脚本），所以冒烟有对齐断言
   （§38）。不同步的症状是"主界面写了『不碰火坑』，战斗 HUD 上显示 `nofire`"。
   --------------------------------------------------------------------------- */
const TRIP_CN = {
  nofire: "不碰火坑",
  bigchain: "大打卷",
  nohit: "一毛不拔",
  nolost: "一只不丢",
  noshell: "壳不破",
};

function readTripGoals() {
  try {
    const o = JSON.parse(localStorage.getItem(HOME_MIRROR_KEY) || "{}") || {};
    if (!Array.isArray(o.tripGoals)) return [];
    const out = [];
    for (const id of o.tripGoals) {
      if (typeof id === "string" && TRIP_CN[id] && out.indexOf(id) < 0) out.push(id);
    }
    return out.slice(0, 2);
  } catch (e) {
    return [];
  }
}

/* ---------------------------------------------------------------------------
   星靶（2026-10-25）—— 每屏 3 个挑战条件
   ---------------------------------------------------------------------------
   病根（用户原话）：「整个游戏只有 27 关 怎么保证长线的？」
   审计结论：7 种目标 27 次使用全是计数型/禁止型，没一种要求「球必须走某条路」
   → 机关全退化成虫好看的解法。星靶把「空间型条件」变成可收集的东西。

   三份数据在这里，**与 `config/StarTargets.ts` 逐字同源**（冒烟 §39 断言）：
     STAR_CN        id → 卡片短名（≤4 字，pill 只有 156px）
     STAR_OF_STAGE  27 屏 × 3 靶。配靶规则见 StarTargets.ts 顶部注释
     STAR_JUDGE     每个靶的判定。**只用 S.stat 已有字段**（外加 shroom/rampIn
                    两个计数器），所以不碰物理、不碰 predictBall。

   完成位存两份 key 是**故意的**，和 cleared 完全同一个 Pattern：
     pawpack.save     （战斗侧）star 是 27×3 的 0/1
     pawpack.save.v1  （主界面）同步镜像，图鉴读它
   recordStar 是唯一写入点，写完自己镜像（MEMORY 教训 2：让写入点自带镜像）。
   --------------------------------------------------------------------------- */

/** id → 卡片短名。与 TRIP_CN 共用的 5 个 id 名字必须逐字一致 */
const STAR_CN = {
  nofire: "不碰火坑",
  nolost: "一只不丢",
  nohit: "一毛不拔",
  noshell: "壳不破",
  nodrown: "不沉底",
  bigchain: "大打卷",
  shroom3: "三弹菇",
  ramp: "坡道入营",
};

/** id → 达成口径原文。**逐字照抄 `StarTargets.ts` 的 `STAR_TYPES[].desc`**，
    冒烟 §39 有跨文件比对（和 STAR_CN 同一条断言链），抄歪了门禁会响。
    唯一用途是触屏条件卡：格子底部那三颗星只回答"拿没拿到"，不回答
    "怎么拿"，而手机上除了这张卡没有别的地方能读到条件。 */
const STAR_DESC = {
  nofire: "一趟下来一次火坑都没用（烧球净消灭另算收成，这里不让用）",
  nolost: "一趟下来没有球滚出屏幕（左边滚出去的最亏，人还得重裹）",
  nohit: "一趟下来一次都没被打到（球可以挨打，人不行）",
  noshell: "一趟下来没有球崩开（到期、丢气、滚远、撞墙三次都会崩）",
  nodrown: "一趟下来没有球沉进水塘（砸进去才沉，滚过去不算）",
  bigchain: "至少一次让一颗球卷进 3 只（卷得越多越好，3 只是门槛）",
  shroom3: "一趟里触发的弹菇加起来 3 次（衰减制，第 5 次就弹不动了）",
  ramp: "让一颗球从坡面上滚进营地（推上去的不算，要自己滚下来）",
};

const STAR_OF_STAGE = [
  ["nofire", "bigchain", "ramp"],
  ["nolost", "nodrown", "ramp"],
  ["nofire", "bigchain", "ramp"],
  ["nolost", "nofire", "ramp"],
  ["nofire", "bigchain", "shroom3"],
  ["nolost", "nodrown", "noshell"],
  ["nofire", "nodrown", "nohit"],
  ["nolost", "bigchain", "noshell"],
  ["nofire", "nolost", "bigchain"],
  ["nofire", "bigchain", "ramp"],
  ["nolost", "nofire", "noshell"],
  ["nolost", "nodrown", "noshell"],
  ["nofire", "nodrown", "bigchain"],
  ["nofire", "nolost", "bigchain"],
  ["nofire", "bigchain", "shroom3"],
  ["nolost", "nodrown", "nohit"],
  ["nolost", "bigchain", "noshell"],
  ["nofire", "bigchain", "nolost"],
  ["nofire", "nodrown", "noshell"],
  ["nolost", "nodrown", "nohit"],
  ["nofire", "nodrown", "nohit"],
  ["nolost", "nodrown", "ramp"],
  ["nofire", "nodrown", "bigchain"],
  ["nolost", "bigchain", "nohit"],
  ["nofire", "bigchain", "nohit"],
  ["nolost", "nodrown", "noshell"],
  ["nofire", "nodrown", "bigchain"],
];

/* 判定。`made > 0` 这条守卫和本趟目标同一条理由：
   一球不打就躺赢「不碰火坑 / 一次不挨」，靶就成了躺出来的。
   bigchain / shroom3 / ramp 是"做到过"型，不需要守卫。 */
const STAR_JUDGE = {
  nofire: (s) => s.made > 0 && s.burned === 0,
  nolost: (s) => s.made > 0 && (s.lost || 0) === 0,
  nohit: (s) => s.made > 0 && s.hits === 0,
  noshell: (s) => s.made > 0 && s.burst === 0,
  nodrown: (s) => s.made > 0 && s.drowned === 0,
  bigchain: (s) => s.maxHolds >= 3,
  shroom3: (s) => (s.shroom || 0) >= 3,
  ramp: (s) => (s.rampIn || 0) >= 1,
};

/** 这一屏达成了哪几个靶。纯函数，结算卡和落盘共用（一份数据两处读）。 */
function judgeStar(idx, stat) {
  const row = STAR_OF_STAGE[idx];
  if (!row) return [];
  const out = [];
  for (const id of row) {
    const fn = STAR_JUDGE[id];
    if (fn && fn(stat || {})) out.push(id);
  }
  return out;
}

/** 一屏集满的额外奖励。数字与 StarTargets.ts 的 STAR_FULL_* 一致（冒烟断言） */
const STAR_FULL_SHARDS = 2;
const STAR_FULL_LOGS = 1;
const STAR_CHAPTER_SHARDS = 4;
const STAR_CHAPTER_LOGS = 3;

/** 把存档里的 star 字段整成 27×3 的 0/1（坏档不崩） */
function loadStarBits() {
  let o = {};
  try { o = JSON.parse(localStorage.getItem(HOME_SAVE_KEY) || "{}") || {}; } catch (e) { o = {}; }
  const bits = [];
  for (let i = 0; i < STAR_OF_STAGE.length; i++) {
    const row = [];
    const src = Array.isArray(o.star) ? o.star[i] : undefined;
    for (let k = 0; k < STAR_OF_STAGE[i].length; k++) {
      row.push(Array.isArray(src) && src[k] === 1 ? 1 : 0);
    }
    bits.push(row);
  }
  return bits;
}

/**
 * 星靶记账：达成位并档 + 镜像 + 累计这一趟的奖励。
 *
 * **只增不减**：存档里是 1 的格永远不会变回 0（和评级同一个口径）。
 * 返回这一屏**新**达成的 id —— 重复打同一屏第二次调用返回空数组，
 * 所以材料/碎片不会因为刷屏而翻倍。
 *
 * 集满一屏 / 一章的额外奖励也在这里发（按并档后的状态判定，
 * 所以「第 3 个靶是分三次补上的」照样算集满）。
 */
function recordStar(idx, metIds) {
  /* 每次判定都先把当次账清零：早退（没新鲜的）也要清。
     不清的话，重打一屏拿到 0 个新靶时，starGain 还留着上一屏的数 ——
     虽然卡片只在 starFresh 非空时才画回执，但这个字段的含义是
     "本次判定的奖励"，留着旧值就是给下一个读它的人埋雷。 */
  S.starGain = { shards: 0, logs: 0 };
  if (!(idx >= 0 && idx < STAR_OF_STAGE.length)) return [];
  const row = STAR_OF_STAGE[idx];
  const before = loadStarBits();
  const bits = before.map((r) => r.slice());
  const fresh = [];
  for (const id of metIds || []) {
    const k = row.indexOf(id);
    if (k < 0 || bits[idx][k]) continue;
    bits[idx][k] = 1;
    fresh.push(id);
  }
  if (!fresh.length) return [];
  /* ---- 写盘：先写战斗侧，再镜像主界面（顺序反了会留下分叉） ---- */
  try {
    const s = readHomeSave();
    s.star = bits;
    s.v = 1;
    localStorage.setItem(HOME_SAVE_KEY, JSON.stringify(s));
    let home = {};
    try { home = JSON.parse(localStorage.getItem(HOME_MIRROR_KEY) || "{}") || {}; } catch (e) { home = {}; }
    /* 镜像按格取并集，不是整表覆盖 —— 主界面那份可能更全
       （在只玩过 Cocos 侧的机器上，反过来也可能）。 */
    const mirror = [];
    for (let i = 0; i < bits.length; i++) {
      const m = Array.isArray(home.star) ? home.star[i] : undefined;
      const r = [];
      for (let k = 0; k < bits[i].length; k++) {
        r.push(bits[i][k] === 1 || (Array.isArray(m) && m[k] === 1) ? 1 : 0);
      }
      mirror.push(r);
    }
    home.star = mirror;
    home.v = 1;
    localStorage.setItem(HOME_MIRROR_KEY, JSON.stringify(home));
  } catch (e) {}
  /* ---- 奖励：只给新达成的 ----
     gain 记**本屏当次**（结算卡回信用），shards/logs 记**整趟累计**
     （收工结算用）。两个数不能混 —— 混了就会出现"第 3 屏的卡上写着
     第 1 屏以来一共拿了 6 碎片"，玩家以为这一屏给了 6。 */
  const gain = { shards: 0, logs: 0 };
  for (const id of fresh) { gain.logs += 1; S.starLogs += 1; }
  if (bits[idx].every((b) => b === 1) && !before[idx].every((b) => b === 1)) {
    gain.shards += STAR_FULL_SHARDS;
    gain.logs += STAR_FULL_LOGS;
    S.starShards += STAR_FULL_SHARDS;
    S.starLogs += STAR_FULL_LOGS;
  }
  /* 章集满从完成位派生，不另存一份。三章各 9 屏。 */
  for (let ch = 0; ch < 3; ch++) {
    const from = ch * 9;
    if (idx < from || idx >= from + 9) continue;
    let wasFull = true, nowFull = true;
    for (let i = from; i < from + 9; i++) {
      if (!before[i].every((b) => b === 1)) wasFull = false;
      if (!bits[i].every((b) => b === 1)) nowFull = false;
    }
    if (nowFull && !wasFull) {
      gain.shards += STAR_CHAPTER_SHARDS;
      gain.logs += STAR_CHAPTER_LOGS;
      S.starShards += STAR_CHAPTER_SHARDS;
      S.starLogs += STAR_CHAPTER_LOGS;
    }
  }
  S.starGain = gain;
  return fresh;
}

/** 清屏时调。只快不慢、只高不低 —— 和评级"只升不降"是同一条原则。 */
function recordStats(idx) {
  if (!(idx >= 0 && idx < LEVELS.length)) return;
  try {
    let o = {};
    try { o = JSON.parse(localStorage.getItem(STATS_KEY) || "{}") || {}; } catch (e) { o = {}; }
    const n = LEVELS.length;
    const T = Array.isArray(o.t) ? o.t.slice() : [];
    const C = Array.isArray(o.c) ? o.c.slice() : [];
    while (T.length < n) T.push(0);
    while (C.length < n) C.push(0);
    const t = Math.round((S.playT || 0) * 10) / 10;
    const c = (S.stat && S.stat.maxHolds) || 0;
    /* 0 表示"还没记过"，所以判据是 `!T[idx] ||`，不能只写 `t < T[idx]`。 */
    if (t > 0 && (!T[idx] || t < T[idx])) T[idx] = t;
    if (c > C[idx]) C[idx] = c;
    localStorage.setItem(STATS_KEY, JSON.stringify({ t: T, c: C }));
  } catch (e) {}
}

function loadStats() {
  try {
    const o = JSON.parse(localStorage.getItem(STATS_KEY) || "{}") || {};
    return { t: Array.isArray(o.t) ? o.t : [], c: Array.isArray(o.c) ? o.c : [] };
  } catch (e) {
    return { t: [], c: [] };
  }
}

/* ============================================================================
   7. 玩家
   ========================================================================== */

function updatePlayer(dt) {
  const p = S.p;
  if (!p || p.dead || S.phase !== "play") return;
  const H = HEROES[p.hero];

  p.atkT = Math.max(0, p.atkT - dt);
  p.dashCd = Math.max(0, p.dashCd - dt);
  p.invT = Math.max(0, p.invT - dt);
  p.castAnim = Math.max(0, p.castAnim - dt);
  p.dashAnim = Math.max(0, p.dashAnim - dt);
  // 推球后的后坐。人往后退一点点再弹回来 —— 只靠"手停住"读不出力道。
  p.pushBack = Math.max(0, (p.pushBack || 0) - dt);
  p.jumpBuf = Math.max(0, p.jumpBuf - dt);
  p.coyote = p.onGround ? 0.10 : Math.max(0, p.coyote - dt);

  // ---- 冲刺（撞飞）
  if (p.dashT > 0) {
    p.dashT -= dt;
    p.vx = p.face * H.dashPow;
    p.vy = Math.min(p.vy, 40);   // 冲刺时轻微"悬空"，读起来更有冲力
  } else {
    // ---- 左右移动
    let ax = 0;
    if (S.keys.left) ax -= 1;
    if (S.keys.right) ax += 1;
    if (ax !== 0) {
      p.face = ax;
      p.vx = ax * H.spd * heroSpeedK();
    } else {
      /* 地面摩擦大、空中近乎无阻力 —— 空中能改方向才跟手。
       *
       * **雪地上摩擦变小，这才是"打滑"**。原来打算给球加打滑，但球在这套
       * 物理里根本没有滚动摩擦（不撞东西就一直滚），"更滑"没有实现空间 ——
       * 真正有摩擦、也真正能被打滑影响的是**猫**：松手之后会再滑出去一段。
       * 慢是惩罚，滑是手感变化，后者才是雪的"物理感"。
       * 0.55 是在第 2 关试出来的：再小（0.7）像在冰上，越过弯道直接掉进坑里。 */
      const fr = p.onGround
        ? 2600 * (1 - 0.55 * S.snowDepth) * (GROUNDS.length ? MAT[matAt(p.x)].heroFr : 1)
        : 420;
      if (Math.abs(p.vx) <= fr * dt) p.vx = 0;
      else p.vx -= sign(p.vx) * fr * dt;
    }
  }

  // ---- 助跑距离：推球的力度按"这一趟朝这个方向跑了多远"算
  // 只算**当前方向**上的连续位移 —— 来回横跳不会攒出大力气，
  // 否则玩家会在原地左右左右刷满再推，那就成了"摇杆搓招"，不是"助跑"。
  const rdir = sign(p.vx) || p.face;
  // 只在"第一次有方向"之后才开始比较，否则开局那一帧会把 runD 清成 0
  if (p.runDir !== undefined && rdir !== p.runDir) p.runD = 0;
  p.runDir = rdir;
  if (p.onGround && Math.abs(p.vx) > 80) {
    p.runD = Math.min(420, (p.runD || 0) + Math.abs(p.vx) * dt);
  } else if (Math.abs(p.vx) < 80) {
    p.runD = Math.max(0, (p.runD || 0) - 420 * dt);
  }

  // ---- 从台上下来（↓）
  // 平台是单向的：能跳上去、能站在上面，但**走不到边就下不来**。
  // 有些台面一直顶到墙，等于连边都没有 —— 玩家会被困在上层。
  // 按住 ↓ 直接穿下去，是平台跳跃里最省事的一条解法（不用教）。
  p.dropT = Math.max(0, (p.dropT || 0) - dt);
  // 松开 ↓ 才允许下一次下穿。没有这把锁，按住 ↓ 会一层接一层地穿下去 ——
  // 玩家按的是"下去一层"，看到的是"直接掉到底"，中间那几层他根本没做选择。
  if (!S.keys.down) p.dropLock = false;
  // `Math.abs(p.y - p.ground.y) < 6` 这一条是"脚下那块的顶面就是我现在站的高度"。
  // 少了它，只要 p.ground 是上一帧留下的旧值（比如刚从 462 掉到地面），
  // 按住 ↓ 就会把 y 往下推 8px —— 而地面恰好就在 0px 处，
  // 8px 一推就落到地面以下，落地判定（prevY <= p.y + 2）再也接不住。
  if (S.keys.down && !p.dropLock && p.onGround && p.ground &&
      p.ground.kind !== "ground" && p.dropT <= 0 &&
      Math.abs(p.y - p.ground.y) < 6) {
    p.dropLock = true;
    p.dropT = 0.26;
    p.dropPlat = p.ground;
    p.y += 8;
    p.vy = 120;
    p.onGround = false;
    p.ground = null;
    for (let i = 0; i < 5; i++) addFrag(p.x + rand(-10, 10), p.y - 6, 4, "#DCEFC8");
  }

  stepBody(p, dt);

  // 落地且在往前走才迈步。相位只给绘制用：悬空、冲刺时停住，
  // 免得脚在空中还蹬、或者冲刺变成原地踏步。
  if (p.onGround && p.dashT <= 0 && Math.abs(p.vx) > 40) {
    p.walkPhase += dt * 11;
  }

  // ---- 跳（带土狼时间 + 输入缓冲，手感全靠这两个）
  if (S.press.jump) p.jumpBuf = 0.12;
  if (p.jumpBuf > 0 && p.coyote > 0 && p.dashT <= 0) {
    p.vy = -H.jump;
    p.onGround = false;
    p.coyote = 0;
    p.jumpBuf = 0;
    addFrag(p.x, p.y, 6, "#E8F6D8");
  }

  // ---- 喷（J）
  // **按住连发**。原来读的是 S.press（边沿）—— 按住 J 只打第一下，
  // 玩家会以为"按键没反应"。节流交给 atkCd，本来就是干这个的。
  // castDir 单独记一份：施法动作要朝"这一下打出去的方向"倾，
  // 而不是施法过程中玩家又转身跟着转（那会变成原地抽搐）。
  /* **按住 (keys) 和点一下 (press) 都要能喷。**
     原来只读 keys —— 按住连发是对的，但它把"边沿"这条路整个掐了。
     代价是任何一次 keys 没送达（焦点丢、桥接层被拦、模拟输入只置 press）
     就等于施法彻底失效，而且症状是"能走能跳就是喷不出来"，
     玩家会以为是键位坏了，不是代码坏了。两条都收，成本为零。 */
  if ((S.keys.atk || S.press.atk) && p.atkT <= 0) {
    p.atkT = H.atkCd;
    p.castAnim = CAST_T;
    p.castDir = p.face;
    H.fire(p);
  }

  // ---- 撞（K）
  /* **冲刺只做一件事：全饿收走。** 不按时长分档，也不按冷却分档。
     2026-10-24 试过两种加强满饱的做法，都被冒烟当场打回：
       · dashT 0.16 → 0.21（距离 +31%）→ 第 8 / 15 / 18 屏机器人全崩（240s 超时）
       · dashCd × 0.72（冲得更勤）    → 第 1 / 4 / 15 屏崩，问题从 3 条变 5 条
     原因很简单：**冲刺是关卡几何的隐式输入**。27 屏的平台间距、竖井宽度、
     营地落点是围绕"0.16 秒 × dashPow"这组数调的，动任何一项都等于偷偷改地图。
     想加强满饱的手感，只能在**推球力**和**表现**上做，不能碰位移。

     "饿"的后果仍然成立，而且是最硬的那种 —— 全饿直接没有这个动作。
     玩家想跳过那个坑、想撞开那只壳，按 K 没反应，比任何数值都清楚。 */
  if (S.press.dash && p.dashCd <= 0) {
    if (bellyTier() === 0) {
      // 全饿跑不动。**"饿"必须有后果**，否则饱食度只是贴在图标上的一个字，
      // 玩家永远不回家，"再贪一关"就不成立。
      p.dashCd = 0.55;
      addText(p.x, p.y - p.h - 20, "跑不动…", "#FFC9A8", 15, 0.85);
    } else {
      p.dashCd = H.dashCd;
      p.dashT = 0.16;
      p.dashAnim = 0.20;
      S.shake = Math.max(S.shake, 3);
      for (let i = 0; i < 6; i++) {
        addFrag(p.x - p.face * 12, p.y - p.h * 0.5 + rand(-8, 8), 4, "#DCF0C0");
      }
    }
  }

  // ---- 冲刺撞敌人：两段式造球的关键
  if (p.dashT > 0) {
    for (const f of S.foes) {
      if (f.dead || f.coat >= (f.cm || 3)) continue;
      if (!overlap(p, f)) continue;
      if (f.coat >= (f.cm || 3) - 1) {
        // 已经裹了两层 —— 一撞直接成球，朝面朝方向飞出去
        makeBallFrom(f, p.face * 660, -120);
        S.shake = Math.max(S.shake, 8);
        hitStop(0.055);
        addText(f.x, f.y - f.h - 26, "撞飞!", "#FFE58A", 20);
      } else {
        coatFoe(f, 1);
        f.stun = Math.max(f.stun, 0.35);
        f.x += p.face * 16;
        S.shake = Math.max(S.shake, 4);
      }
      p.dashT = 0;
      p.vx = -p.face * 140;
    }
  }

  // ---- 走位推球：贴近球就推走（和原版一样，不需要新按键）
  // **推多远，看你跑了多远。**
  // 用户原话："站的越远推球，球的推力越大"。站着不动推是 PUSH_BASE，
  // 退后跑满 380px 再推能再多 75% —— 于是"先退开、再冲过去"变成
  // 一个有代价的好习惯：退开的那两秒，敌人也在往你身上走。
  //
  // 上一版"感觉推不动"，问题不在数值而在**反馈**：推的那一帧什么也没发生。
  // 现在推球这一刻同时给四样东西 —— 顿帧、球压扁、人后坐、球拖影。
  const runUp = Math.min(1, (p.runD || 0) / 380);
  // 肚子接进来（见 bellyPower）。它乘在整条链路上：
  // 助跑还是那个助跑，"七分饱"的人推出去的每一球都更远一点。
  // **必须是 pushPowerNow()，不能在这儿再写一遍算式**（预瞄线读的是同一个）。
  const pushPow = pushPowerNow();
  for (const b of S.balls) {
    if (b.dead) continue;
    /* 站在石球上不许把它推走 —— 否则玩家一抬脚就踩空，
       而且这个判定本来就**几乎踩线**：`b.y < p.y + 20` 在 p.y = b.y - r、
       r ≥ 22.8 时已经接近为假，靠不住的边界不能拿来做功能。 */
    if (b.stone && p.ground && p.ground.ball === b) continue;
    // 判定窗口 = 两个圆刚好相切再加 2px。上一版是 -4 ——
    // 人得先"陷进球里 4px"才算推，而人和球之间没有碰撞体，
    // 于是高速冲过去的那一帧常常整个跳过窗口：看起来就是"从球里穿过去了"。
    if (Math.abs(b.x - p.x) < b.r + p.w / 2 + 2 &&
        b.y > p.y - p.h - b.r * 2 && b.y < p.y + 20) {
      const pushDir = (b.x - p.x) !== 0 ? sign(b.x - p.x) : p.face;
      /* ---- 按 ↓ 把球压住，变石球（2026-10-27）----
         为什么不是"滚到墙角就自动变砖"：**这个游戏里的球永远不会停**。
         撞墙 ×0.62 有 `MIN_BOUNCE = 120` 兜底（那是为了"球贴墙慢慢蹭时
         眼睛还看得到在弹"），所以低速撞墙之后仍然有 120px/s。
         试过让它停下来（低速撞墙 `vx = 0`），ALL9 立刻两条红：
         第 12 屏「单球最多装 2 只、目标 3 只」、第 15 屏「落袋 3 / 目标 4」——
         球少滚一段就少撞几只，**清场能力是拿"球一直在滚"算出来的**。
         所以"停住"必须由一个**玩家动作**产生，不能由物理自己发生。
         ↓ 键本来就是"从台面下穿"，压在球上是同一个动作的另一种用法；
         机器人不按 ↓，所以这条对 27 屏基线完全免疫。 */
      if (S.keys.down && b.onGround && !b.stone) {
        hardenBall(b);
        continue;
      }
      if (Math.abs(b.vx) < 140) {
        /* 推一下就"活过来"：石球恢复成普通球，重新开始漏气。
           **气不给补** —— 补了就变成"存球回血"，石球会变成刷气手段。 */
        if (b.stone) {
          b.stone = 0;
          b.stillT = 0;
          addText(b.x, b.y - b.r * 2 - 16, "又滚起来了", "#CFC7B2", 16);
        }
        b.vx = pushDir * pushPow;
        b.vy = Math.min(b.vy, -40);
        // 推出去 = 一次性。见 updateBalls 里 "推出后必消失" 那条。
        b.pushed = true;
        b.relT = 0;
        b.wallHits = 0;
        /* 玩家重新推它 = 这一球是新的。弹菇的衰减计数必须归零，
         * 否则这颗球弹满 6 次之后，之后路过任何菇都不会再被弹起来。 */
        b.bounceN = 0;
        // 球被顶瘪一下：沿运动方向压短、垂直方向鼓起来 ——
        // 这是"它真的被撞了"唯一不靠文字的表达。
        b.pushSquash = 0.30 + runUp * 0.14;
        b.pushDir = pushDir;
        p.runD = 0;
        // 人被顶住：继续全速往前跑的话，读起来像"人从球里穿过去了"。
        p.vx *= 0.2;
        p.pushBack = 0.16;
        p.face = pushDir;
        hitStop(0.04 + runUp * 0.03);
        S.shake = Math.max(S.shake, 6 + runUp * 7);
        addText(b.x, b.y - b.r * 2 - 12,
                runUp > 0.75 ? "蓄力推!" : "推!",
                runUp > 0.75 ? "#FFD86B" : "#CFE9FF",
                runUp > 0.75 ? 22 : 18);
        for (let i = 0; i < 4 + Math.round(runUp * 6); i++) {
          addFrag(b.x - pushDir * b.r * 0.6, b.y - b.r * 0.5 + rand(-10, 10), 5,
                  runUp > 0.4 ? "#EAF7C0" : "#DCE9F7");
        }
      }
    }
  }

  // ---- 碰敌人受伤
  if (p.invT <= 0 && p.dashT <= 0) {
    for (const f of S.foes) {
      if (f.dead || f.coat >= (f.cm || 3)) continue;
      if (!overlap(p, f)) continue;
      p.hp -= 1;
      S.stat.hits++;   // 无伤关就靠这一个数
      p.invT = 1.2;
      p.vx = -sign(f.x - p.x) * 320;
      p.vy = -260;
      S.shake = Math.max(S.shake, 12);
      S.flash = 0.25;
      addText(p.x, p.y - p.h - 20, "唔!", "#FF9E8E", 20);
      if (p.hp <= 0) { p.hp = 0; p.dead = true; S.phase = "fail"; }
      break;
    }
  }

  // ---- 火坑烫脚：地形对玩家同样有效，所以火坑是"必须跳过去"的东西，
  // 不是一个只对球生效的装饰
  if (p.onGround && p.invT <= 0 && p.dashT <= 0) {
    for (const pit of PITS) {
      if (pit.kind !== "fire") continue;
      // 必须连竖向一起判。只判横向的话，站在火坑**正上方那块平台上**
      // 也会被烫 —— 而那三块平台就在火坑上方，等于整片高地都是禁区。
      if (p.x > pit.x + 8 && p.x < pit.x + pit.w - 8 && p.y >= pit.y - 6) {
        p.hp -= 1;
        S.stat.hits++;
        p.invT = 1.2;
        p.vy = -430;
        p.vx = sign(p.x - (pit.x + pit.w / 2)) * 210;
        S.shake = Math.max(S.shake, 10);
        S.flash = 0.22;
        addText(p.x, p.y - p.h - 22, "烫!", "#FF9E8E", 20);
        for (let i = 0; i < 12; i++) addFrag(p.x, p.y - 10, 6, "#FFB05C");
        if (p.hp <= 0) { p.hp = 0; p.dead = true; S.phase = "fail"; }
        break;
      }
    }
  }

  // ---- 捡地上的掉落物。五种东西走同一条碰撞，效果分开算
  for (const d of S.drops) {
    if (d.taken) continue;
    if (Math.abs(d.x - p.x) > 28 || Math.abs(d.y - (p.y - 14)) > 44) continue;
    d.taken = true;
    const K = DROP_KINDS[d.kind] || DROP_KINDS.fruit;

    // 宝箱：开出来的是"这一趟最缺的那一样"，不是随机装饰
    if (K.chest) {
      const hold = d.holds || 1;
      const roll = S.rng();
      if (roll < 0.52) {
        const f = 4 + hold * 2;
        S.food += f;
        addText(d.x, d.y - 36, "宝箱 +" + f + " 收成", "#FFD65C", 22, 1.2);
      } else if (roll < 0.80) {
        for (const bb of S.balls) bb.air = Math.min(1, bb.air + 0.5);
        addText(d.x, d.y - 36, "宝箱 · 全队回气", "#8FE4FF", 21, 1.2);
      } else if (p.hp < p.maxHp) {
        p.hp = Math.min(p.maxHp, p.hp + 2);
        addText(d.x, d.y - 36, "宝箱 +2 心", "#FF8FA6", 22, 1.2);
      } else {
        S.food += 6;
        addText(d.x, d.y - 36, "宝箱 +6 收成", "#FFD65C", 22, 1.2);
      }
      S.stat.chests++;
      for (let i = 0; i < 18; i++) addFrag(d.x, d.y, 7, i % 2 ? "#FFD65C" : "#FFF3C0");
      S.shake = Math.max(S.shake, 7);
      S.flash = Math.max(S.flash, 0.10);
      continue;
    }

    if (K.food) {
      S.food += K.food;
      addText(d.x, d.y - 22, "+" + K.food, K.color, 17);
    }
    if (K.air) {
      for (const bb of S.balls) bb.air = Math.min(1, bb.air + K.air);
      addText(d.x, d.y - 22, "回气", K.color, 17);
    }
    if (K.heal) {
      if (p.hp < p.maxHp) { p.hp++; addText(d.x, d.y - 22, "+1 心", K.color, 17); }
      else { S.food += 2; addText(d.x, d.y - 22, "+2", K.color, 17); }
    }
    for (let i = 0; i < 6; i++) addFrag(d.x, d.y, 4, K.color);
  }

  // ---- 掉出世界（不该发生，但兜一下）
  if (p.y > H + 60) { p.y = GROUND_Y; p.x = PLAYER_SPAWN.x; p.vy = 0; }
}

/* ============================================================================
   8. 敌人
   ========================================================================== */

/** 敌人掉出屏幕 —— **消失即算送走，必须计入 killed。**
 *
 *  病根（2026-10-26，深巢第 1 层机器人实测）：
 *  原来这三处只 `f.dead = true` 不记账，于是场上的确清空了，
 *  但 `S.killed < S.total` 永远成立 —— `checkGoal` 第一条就返回 false，
 *  整局直接判负，而 failWhy 报的是「人都送走了，但用了 3 颗球（只给 8 颗）」，
 *  读数的人和看代码的人都以为是额度问题，实际是记账问题。
 *
 *  主线 27 屏的地形是手摆的，敌人基本走不到台边缘，这条"不该发生"的兜底路径
 *  从来没被走到过。深巢的台是生成的、常常更窄，它变成了**常见**路径 ——
 *  一行不记账，整个玩法就不可玩。这也正是设计文档 §6 要求第二套机器人的原因：
 *  ALL9 跑主线 27 屏永远照不到这里。 */
function killByFall(f) {
  if (f.dead) return;
  f.dead = true;
  /* 只给"算在 S.total 里"的敌人记账。BOSS 召唤的幼虫（larva）是运行时生成的，
     不在 total 里 —— 给它记账，结算会写出「11 / 9」这种读数。 */
  if (!f.larva && S.killed < S.total) {
    S.killed += 1;
    /* **掉出屏幕也必须给收成**（2026-10-25）。
     *
     * 这条路径原来只记 killed 不记 food，后果是 collect 关的死局：
     * 敌人被推下台 → 落进坑 → 落到屏幕外 → killed+1、food+0。
     * 玩家看到的是"人全没了，收成还是 0"，HUD 上永远差那几口粮，
     * 而场上已经没有可推的东西了 —— **不是难，是无解**。
     *
     * 主线手摆地形，敌人站位都避开了坑，这条路径几乎走不到，所以一直没暴露；
     * 深巢是生成地形，坑和兵站各算各的，撞上就是必然。
     *
     * 只给 +1（最小单位），不给 holds 加成：掉下去是地形干的，
     * 不是玩家的手艺，不该和"一球卷三只"同价。 */
    S.food += 1;
  }
}

function updateFoe(f, dt) {
  if (f.dead) return;
  if (f.isBoss) { updateBoss(f, dt); return; }
  f.hitT = Math.max(0, f.hitT - dt);
  f.stun = Math.max(0, f.stun - dt);
  f.bob += dt * 3.2;
  /* 雪厚了走不动。乘在速度上而不是改 def.spd ——
     FOES 是共享表，改它等于把所有敌人永久变慢，切关也不会恢复。 */
  const FK = foeSpeedK();

  // 被裹到 3 层就该变球了，这里是保险（正常流程在 coatFoe 里处理）
  if (f.coat >= (f.cm || 3)) return;

  if (f.stun > 0) { f.vx = 0; }

  if (f.fly) {
    // 乌鸦：缓慢贴向玩家，纵向做正弦摆动 —— 它要看起来"不着急"
    const p = S.p;
    if (p && !p.dead) {
      const dx = p.x - f.x;
      f.vx = sign(dx) * f.def.spd * FK * (Math.abs(dx) > 40 ? 1 : 0.15);
      /* **朝向必须带死区。** 原来是无条件 `f.face = sign(dx)`：
         乌鸦贴到玩家身边时 dx 在 0 附近来回穿越（它自己还在以 0.15 倍速
         往前挪，玩家也在动），于是 face 每帧在 +1/-1 之间跳 ——
         整只乌鸦左右镜像闪烁。这就是玩家报的"抖得很严重"。
         死区 26px 远大于一帧的位移（92px/s ÷ 60 = 1.5px），
         所以只有真的跑到另一侧才会转身。 */
      if (Math.abs(dx) > 26) f.face = sign(dx);
    }
    f.x += f.vx * dt;
    /* ---- 悬停高度：这是"半天打不着"的真正病根 ----
     *
     * 关卡表里乌鸦的出生 y 填的是 300。而玩家在 350 层台面平推时，
     * 球心在 `350 - r` = 328（普通球 r=22）；碰撞阈值是 `b.r + f.h/2` = 22+16 = 38。
     * 也就是说**鸦心必须 ≥ 290，即 y ≥ 306 才撞得到**。
     * y 的基准是 300 → 它整个摆动周期里大部分时间飘在打不到的高度上。
     *
     * 走过的弯路（留在这里防再踩）：先把摆幅从 18 收到 7，结果**更打不着**——
     * 摆幅是让它偶尔"低下来"进判定区的唯一手段，收窄等于把这个机会也砍掉了
     * （实测第 8 关机器人从 79s 达标直接变 240s 超时、造球数 38→156）。
     * 摆幅是美术参数，**悬停高度才是那个要动的数**。
     *
     * 还有一条：摆幅收到 7 **即使配上正确的下沉量**也会把机器人拖死
     * （乌鸦几乎贴在判定线上一动不动，机器人反复糊它 → 撞 MAX_BALLS 上限
     * → 卡在"想造球造不出来"的循环里，240s 清不了场）。
     * 摆幅 18 保留的那点错开节奏，反而让"糊人 / 造球 / 球滚走"错得开。
     * **这不是鸟的问题，是节奏不能压成常数。**
     *
     * 现在：基准 300 下沉 18（落到 318），摆幅保持 18。
     * y ∈ [300, 336] → 鸦心 ∈ [284, 320] → dy ∈ [8, 44]。
     * 阈值 38 只要求鸦心 ≥ 290（y ≥ 306），即**约 83% 的周期可打**（原来 39%）。
     * 视觉上它仍然在台面上方低飞，不会贴到台面。 */
    const FLY_DROP = 18;
    /* 悬停曲线**保持纯正弦**。
       2026-10-27 试过一版"平台化"（sign(s)·|s|^2.1）：想把 80% 的时间挤到
       ±9px 内，让它读作"停在某个高度、偶尔沉一趟"。想法没错，但把 y-t 曲线
       画出来一看，红色（纯正弦）是圆滑的波，绿色（平台版）是**方波**——
       平台段 + 陡峭过渡比匀速正弦更像"跳"。测试指标（二阶差分 RMS）
       也从 0.0229 涨到 0.0464。**当场回退。**
       结论：这只鸟"看起来在上下跳"不是曲线的错，是朝向逐帧翻转（已加死区）
       和绘制层重复位移（已删）。**改美术问题之前先画曲线，不要凭手感改公式。** */
    f.y = f.homeY + FLY_DROP + Math.sin(f.bob * 0.8) * 18;
    f.x = clamp(f.x, WALL_L + f.w / 2, WALL_R - f.w / 2);
    return;
  }

  /* ==========================================================================
     深巢四怪的行为分支（2026-10-26）
     --------------------------------------------------------------------------
     顺序在 `fly` 之后、`larva` 之前。**每一支都要自己 `return`** ——
     漏一个 return，这只怪会继续跑下面主线的 walk/charge 逻辑，
     表现是"盲蛛突然按主线的速度走"这种很难归因的漂移。

     共同前提：四只都不吃"推着走"这一套，各有各的入口条件。
     ========================================================================== */

  // ---- 巢蛾：**球碰不到它**，只能用光照 ----
  if (f.moth) {
    /* 光源只有两种：**球**（球本身就是火，主线已有设定）和**火坑 / 裂缝**。
       半径：球 150、火坑 220、裂缝 200 —— 球是移动光源，给最小；
       火坑和裂缝是固定光源，玩家可以"把蛾子赶到光里去"。
       这一条是规格 §2.7「球从得分工具变成探照灯」的落点。 */
    let lit = false;
    for (const b of S.balls) {
      if (b.dead) continue;
      if (Math.hypot(b.x - f.x, (b.y - b.r) - f.y) < 150) { lit = true; break; }
    }
    if (!lit) {
      for (const p of PITS) {
        if (p.kind !== "fire") continue;
        if (Math.abs(p.x + p.w * 0.5 - f.x) < 220 && Math.abs(p.y - f.y) < 240) { lit = true; break; }
      }
    }
    if (!lit) {
      for (const c of CHASMS) {
        if (Math.abs(c.x + c.w * 0.5 - f.x) < 200) { lit = true; break; }
      }
    }
    f.litOn = lit;
    /* 光晕强度**单独平滑**，不直接用布尔值。
       `lit` 是按 150px 半径硬判的，玩家推着球在边界附近走，它就会每帧
       0/1 翻转 —— 绘制侧按布尔画光晕的话，那圈光会"啪嗒啪嗒"闪，
       看起来像贴图坏了。0.2 秒渐入渐出之后，同一条边界读作"光慢慢压上来"。 */
    f.glowK = (f.glowK || 0) + ((lit ? 1 : 0) - (f.glowK || 0)) * Math.min(1, dt * 5);
    /* 亮起来是**加得慢、退得快**（3 秒满 / 0.6 秒退一半）：
       加法太快它一进球光就掉，玩家不用做任何事；退得太慢的话
       一次照亮就永久有效，蛾子也就不用躲了。 */
    f.lit = lit ? Math.min(3.2, f.lit + dt) : Math.max(0, f.lit - dt * 1.7);
    if (f.lit >= 3) {
      /* 照满 3 秒：翅膀烧穿，掉下来。**掉下来之后走主线的 walk 分支**，
         于是"糊三下推走"这套它照样吃 —— 玩家不需要学第二套送走方式。 */
      f.moth = false;
      f.kind = "walk";
      f.onGround = false;
      f.vy = 0;
      f.lit = 0;
      f.dazzled = 1;
      addText(f.x, f.y - 34, "翅膀烧穿了!", "#FFE08A", 19);
      for (let i = 0; i < 10; i++) addFrag(f.x, f.y, 5, i % 2 ? "#FFD86B" : "#C8B0F0");
      S.shake = Math.max(S.shake, 4);
      return;
    }
    /* 空中飘：缓慢横移 + 上下摆。**不走 stepBody**（没有重力），
       所以 y 必须每帧由 homeY 算出来，和乌鸦那条一样 —— 只是它不追人。

       上下摆是**两层、有因果**的：
         · `glide`  慢气流浮沉，11px，约 0.26Hz —— 决定它整体待在哪个高度
         · `wing`   扑翅上冲，2.6px，约 1.7Hz —— 每次拍翅身体被顶一下
       两层频率差 6 倍以上，叠起来读作"扑着往上顶、滑一段往下沉"。
       上一版只有一层 9px 正弦，看着像挂在绳子上的牌子；
       而绘制层又额外叠了一个近频位移（已删）——那才是抖的真正来源。
       蛾子不吃球、只看光，没有任何玩法参数绑在它的高度上，
       所以这里的幅度可以完全按观感定。 */
    f.x += Math.sin(S.t * 0.62 + f.ph) * 16 * dt;
    f.x = clamp(f.x, WALL_L + f.w / 2, WALL_R - f.w / 2);
    const glide = Math.sin(f.bob * 0.52 + f.ph);
    /* 扑翅**只取正半周**。真蛾子拍翅只把身体往上顶，不会往下压；
       写成正负对称的正弦，读起来就是"在抖"——位置层叠两个近频正弦
       这件事在乌鸦身上已经踩过一次，只是那次是两层频率打架，
       这次是方向错了。只留上冲之后，慢波上叠的是一串单侧的"顶"。 */
    /* 幅度只有 1.4px / 频率 2.2（≈1.1Hz）。第一版给的是 3.6px / 3.4（≈1.7Hz），
       实测抖动强度 0.1386，是乌鸦（0.0237）的**六倍** —— 那不是在飞，是在抖。
       "扑翅"这件事本来就该由**翅形**去表达，身体只需要被轻轻顶一下。
       位移越小越像生物，越大越像弹簧。 */
    const wing = Math.max(0, Math.sin(f.bob * 2.2 + f.ph));
    f.y = f.homeY + glide * 11 - wing * 1.4;
    f.face = Math.cos(S.t * 0.62 + f.ph) > 0 ? 1 : -1;
    if (f.y > H + 100) killByFall(f);
    return;
  }

  // ---- 石壳：只会往低处滚；撞墙反弹；**不能被裹成球** ----
  if (f.kind === "roll") {
    /* 它自己维持一个水平速度 `rollV`（不是 def.spd）：
       坡上按坡度加速、平地上慢慢停、撞墙反向 ×0.72。
       玩家把它推上坡 = 给它一段下坡路，它自己滚进裂缝。
       **它永远不会朝玩家走** —— "石壳在追我"是这只怪绝对不能给人的印象。 */
    const rp = rampAt(f.x);
    if (rp) {
      f.rollV -= GRAV * rp.slope * 0.30 * dt;
    } else {
      f.rollV *= Math.max(0, 1 - 1.1 * dt);
    }
    f.rollV = clamp(f.rollV, -720, 720);
    f.vx = f.rollV;
    f.face = f.rollV > 6 ? 1 : f.rollV < -6 ? -1 : f.face;
    const was = f.x;
    const g2 = stepBody(f, dt);
    if (f.hitWall) { f.rollV *= -0.72; f.vx = f.rollV; }
    /* 停在"同一层且几乎不动"超过 2.4 秒就不再是威胁（否则它只是块石头）。
       这条不删，但也不做任何事 —— 保留是为了说明它**可以**停住。 */
    if (Math.abs(f.x - was) < 0.4 && Math.abs(f.rollV) < 20) f.rollV *= 0.94;
    if (f.y > H + 100) killByFall(f);
    return;
  }

  // ---- 地脉虫：每 4 秒探头 2 秒，缩回时无敌 ----
  if (f.kind === "burrow") {
    /* 周期 4 秒：**探头 2.1 秒 / 缩回 1.9 秒**。
       探头那 2 秒里它完全按主线的规矩来（能糊、能推），
       缩回时 `invuln = 1`、`coatFoe` 直接返回 —— 玩家唯一要学的是"等"。 */
    f.boreT += dt;
    const t = f.boreT % 4;
    const up = t < 2.1;
    f.boreUp = up ? 1 : 0;
    f.invuln = up ? 0 : 1;
    f.vx = 0;
    /* 缩回时把已经糊上的壳保住，但不加不减 —— 缩回反而不掉层，
       否则"等窗口"会变成"等它清空我的进度"。 */
    stepBody(f, dt);
    if (f.y > H + 100) killByFall(f);
    return;
  }

  // ---- 幼虫：目标不是玩家，是 BOSS。爬到了就被吃掉，BOSS 补一层壳
  if (f.larva) {    const boss = S.foes.find(q => q.isBoss && !q.dead);
    f.bornT = (f.bornT || 0) + dt;
    if (!boss || f.bornT > 14) {
      // 没有 BOSS 了 / 爬了 14 秒还没到 —— 自己散掉，别在场上堆着
      if (f.bornT > 14) f.dead = true;
      f.vx = f.dir * f.def.spd * FK * 0.5;
    } else if ((f.wanderT || 0) > 0) {
      // 刚孵出来：先朝外爬一小段。这一段是给玩家的反应时间，
      // 也是"虫群散开"的画面 —— 一出壳就直扑 BOSS 的话，玩家只看到一串加号。
      f.wanderT -= dt;
      f.face = f.dir;
      f.vx = f.face * f.def.spd * FK * 0.72;
    } else {
      const dx = boss.x - f.x;
      f.dir = sign(dx);
      f.face = f.dir;
      f.vx = f.face * f.def.spd * FK * 1.15;
      // 到嘴：横向贴住 + 同一层 + 出了孵化保护期
      // 差一层就够不着：幼虫在上层平台、BOSS 在地面时，它得先走到边缘掉下去。
      // 上一版给了它"跳"，结果它在平台上原地蹦，永远绕不到 BOSS 那一侧。
      if ((f.bornT || 0) > 0.8 &&
          Math.abs(dx) < boss.w * 0.5 + 12 && Math.abs(f.y - boss.y) < 70) {
        f.dead = true;
        feedBoss(boss, f);
        return;
      }
    }
    stepBody(f, dt);
    if (f.hitWall) f.dir = -f.hitWall;
    if (f.y > H + 100) killByFall(f);
    return;
  }

  if (f.kind === "charge") {
    const p = S.p;
    f.chargeT -= dt;
    /* 转向要留死区。玩家正好站在它身上（|dx| 个位数）时，`sign(p.x - f.x)`
       会随着双方抖动逐帧翻转 —— 翻一次朝向就整体镜像一次，是肉眼可见的抽搐。
       8px 以内当作"已经贴身"，不重新判断朝向。 */
    if (p && !p.dead && Math.abs(p.y - f.y) < 60 && Math.abs(p.x - f.x) > 8) {
      f.face = sign(p.x - f.x);
    }
    if (f.charging > 0) {
      f.charging -= dt;
      f.vx = f.face * f.def.spd * FK * 3.1;
    } else {
      if (f.chargeT <= 0) { f.charging = 0.55; f.chargeT = rand(2.2, 3.6); }
      f.vx = f.face * f.def.spd * FK * 0.5;
    }
  } else if (f.def.hunt === "shake") {
    /* ---- 盲蛛：追**震动**，不追人 ----
     *
     * 深巢是窄井，盲蛛看不见（名字里的"盲"），它靠地面震动定位。
     * 所以目标不是玩家，是**正在滚的球** —— 而且滚得越快它越"听得见"。
     * 结果是一个新决策：以前"球推出去就不管了"，现在推出去会把盲蛛拽过来。
     * 玩家可以拿一颗空球把盲蛛拖到裂缝边上。
     *
     * 没有球的时候才退化成追人（不然它会站死在原地，机器人跑不通）。 */
    let tx = null, best = 1e9;
    for (const b of S.balls) {
      if (b.dead) continue;
      /* d / (1 + |vx|/300)：静止的球按距离算，滚起来的球"折算距离"变短。
         300 是巡航速度的量级（PUSH_BASE 620 的一半），滚得更快就到饱和。 */
      const score = Math.abs(b.x - f.x) / (1 + Math.abs(b.vx || 0) / 300);
      if (score < best) { best = score; tx = b.x; }
    }
    if (tx == null) {
      const p = S.p;
      if (p && !p.dead) tx = p.x;
    }
    if (tx != null && Math.abs(tx - f.x) > 10) f.dir = sign(tx - f.x);
    f.face = f.dir;
    f.vx = f.dir * f.def.spd * FK;
  } else if (f.jumper) {
    /* ---- 跳虫：全游戏**第一种会主动往上层移动的普通怪**（2026-10-27）----
     *
     * 三段状态机，顺序不能换：
     *     crouch（蹲 0.30s）→ pounce（滞空）→ landT（硬直 0.28s）
     *
     * 每一段都是一个**可读的窗口**：
     *   蹲     = "要来了"，玩家可以跑开或者提前糊它；
     *   滞空   = "能躲"，它走的是固定抛物线，不是追踪弹；
     *   硬直   = "该你打了"，落地的 0.28 秒它一动不动。
     *
     * 少了任何一段，它就变成"突然出现在脸上" —— 那不是难度，是暗算。
     * ------------------------------------------------------------------ */
    const p = S.p;
    f.jumpCd = Math.max(0, f.jumpCd - dt);
    f.landT = Math.max(0, f.landT - dt);

    if (f.crouch > 0) {
      f.crouch -= dt;
      f.vx = 0;                                  // 蹲住不动，这一下必须看得出来
      if (f.crouch <= 0) {
        f.vy = -JUMPER_VY;
        f.vx = f.pounceDir * JUMPER_PUSH;
        f.pounce = 0.78;                         // 比实际滞空略长，落地会提前清掉
        f.jumpCd = JUMPER_CD;
      }
    } else if (f.pounce > 0) {
      /* 滞空中：**一帧都不许重算 vx**。
         下面那条追人分支每帧会把 vx 写回 spd×1.15 ≈ 54，
         210 掉到 54 之后虫子只会原地上下 —— 一次都上不了台面。 */
      f.pounce -= dt;
    } else if (f.landT > 0) {
      f.vx = 0;                                  // 落地硬直：给玩家反击窗口
    } else if (p && !p.dead) {
      const dx = p.x - f.x;
      /* 撞过桩/墙之后必须先背离 0.45 秒再回头追人。
         **不这么做会和 stepBody 的木桩判定死锁**：桩把它顶到外侧 →
         下一帧它又把朝向重写成"朝玩家"（也就是朝桩）→ 被顶回原地，
         一步不动，看起来像卡在木头里发呆。`nudgeOutOfStumps` 的注释里
         记的是**出生那一刻**的同一个坑，这里是移动中的版本 ——
         区别是出生能一次推出去，移动中必须靠时间逃走。 */
      if (f.wallT > 0) {
        f.wallT -= dt;
        f.vx = f.dir * f.def.spd * FK;
      } else {
        /* 8px 死区照抄 charge 那条：玩家贴身时 sign() 会逐帧翻转，读作抽搐 */
        if (Math.abs(dx) > 8) f.face = sign(dx);
        f.vx = f.face * f.def.spd * FK * 1.15;   // 比巡逻快一点，但远慢于玩家

        /* 玩家在**下方**：走向最近的台面边缘，让重力把它带下去。
           **这一条不是为了好看，是为了不制造射击死角。**
           六把武器的弹道 vy 全是 0 或 -40（平飞或略上），没有一支能往下打 ——
           所以玩家站在台面上打不到正下方的怪。怪一旦赖在死角里，
           "清场"就永远不成立，整关卡死（实测第 3 屏剩 2 只、180 秒超时）。
           原来"朝玩家走"要横穿半个台面（47px/s，一块 594 宽的台面要 6 秒）
           才走到边缘掉下去，太慢；直接朝最近的边缘走，1 秒内就下去了。 */
        if (f.onGround && f.ground && (p.y - f.y) > 40) {
          const gl = f.x - f.ground.x, gr = f.ground.x + f.ground.w - f.x;
          f.face = gl < gr ? -1 : 1;
        }

        /* 起跳条件：玩家在**上面**、水平够得着、自己站在地上、冷却好了、
           **而且这一跳真的能落到上面那层**（pounceLands）。
           最后一条是补的，它修的就是"有的地方不能跳、有的可以"：
           原来只有"玩家高出 40px"一条，既没有上限也不看落点，
           于是玩家在上面**两层**（206px）它也蹲下起跳 —— 跳高只有 123px，
           顶到板底掉回去；玩家在 240px 外它也跳，可滞空只能横移 107px，落空。
           玩家看到的就是"它有时候上得来、有时候上不来"，而规则推不出来。
           现在规则只有一条：**它只在真的能落到更高那层时才蹲。** */
        if (f.onGround && (f.y - p.y) > 40 && Math.abs(dx) < 240 && f.jumpCd <= 0) {
          const pd = sign(dx) || f.face;
          if (pounceLands(f, pd)) {
            f.crouch = 0.30;
            f.pounceDir = pd;
          } else {
            /* 上不去：不装样子蹲一下，但也别每帧重算 60 步预演。
               0.2 秒是"玩家挪一步"的粒度 —— 他移到能上去的位置后，
               虫子最迟五分之一秒就反应过来。 */
            f.jumpCd = 0.20;
          }
        }
      }
    } else {
      f.vx = f.dir * f.def.spd * FK;
      f.face = f.dir;
    }
  } else {
    f.vx = f.dir * f.def.spd * FK;
    f.face = f.dir;
  }

  f.vx = f.vx * (f.stun > 0 ? 0 : 1);
  const wasAir = !f.onGround;
  const g = stepBody(f, dt);
  /* 从空中落地 → 硬直。起跳那一帧 onGround 还是 true（stepBody 之后才清），
     所以 wasAir 为 false，不会误触发。 */
  if (f.jumper && wasAir && f.onGround) {
    f.landT = JUMPER_LAND;
    f.pounce = 0;
    f.vx = 0;
  }

  // 走到平台边缘就掉头 —— 不然敌人会自己跳崖，玩家一个都不用打
  /* 跳虫不适用：它追人，玩家在下一层时它本来就该走下去跟着。
     （掉进坑里算它的损失，但坑的位置是固定的、看得见的。） */
  if (f.onGround && f.kind !== "charge" && !f.jumper) {
    const ahead = f.x + f.dir * (f.w / 2 + 10);
    if (!g || ahead < g.x + 4 || ahead > g.x + g.w - 4) f.dir = -f.dir;
  }
  if (f.hitWall) {
    f.dir = -f.hitWall;
    /* 跳虫撞墙要记住"刚才撞过"，否则下一帧又把朝向写回朝玩家（见上面死锁注释）。
       0.45 秒是"走得开"的下限：巡逻速度 58×0.45 ≈ 26px，
       够它脱离桩的碰撞盒 + 自身宽度。 */
    if (f.jumper) f.wallT = 0.45;
  }

  if (f.y > H + 100) killByFall(f);
}

/* ----------------------------------------------------------------------------
   BOSS
   ----------------------------------------------------------------------------
   它走的是**同一套规则**：糊满 cm 层 → 变球 → 推进坑。
   没有第二套血量、没有免疫、没有阶段 —— 玩家不用学新东西。

   让它和普通怪不一样的只有两件事：
     1. 慢速追击。压迫感来自"它一直在过来"，不是来自速度。
     2. 每 6.5 秒砸一次地，放出两道贴地冲击波。这一条是**逼玩家离开地面** ——
        不然最舒服的打法就是站在它脚边一路糊，BOSS 战会变成木桩战。
   BOSS 被球撞不消失那一条在 updateBalls 里（球会弹回去，可以连撞）。
   -------------------------------------------------------------------------- */

function updateBoss(f, dt) {
  f.hitT = Math.max(0, f.hitT - dt);
  f.stun = Math.max(0, f.stun - dt);
  f.bob += dt * 1.7;

  // 从天上掉下来的登场：穿平台直落地面，落地之前什么都不做
  if (f.dropT > 0) {
    f.dropT -= dt;
    stepBody(f, dt);
    if (f.onGround) {
      f.dropT = 0;
      S.shake = Math.max(S.shake, 12);
      for (let i = 0; i < 22; i++) addFrag(f.x + rand(-50, 50), f.y - 4, 8, "#D8C8A8");
    }
    return;
  }

  if (f.coat >= (f.cm || 3)) return;
  const p = S.p;

  f.slamT -= dt;
  f.scatterT -= dt;
  f.spawnT -= dt;
  // 流派专属的两条。普通怪没有 bossStyle，这两个计时恒为 0、永远不会触发。
  if (f.bossStyle) { f.crackT -= dt; f.mudT -= dt; }

  /* ---- 砸地（最高优先级：手已经举起来了就必须砸完） ---- */
  if (f.slamming > 0) {
    f.slamming -= dt;
    f.vx = 0;
    if (f.slamming <= 0.35 && !f._slammed) {
      f._slammed = true;
      S.shake = Math.max(S.shake, 15);
      S.flash = 0.18;
      for (let i = 0; i < 12; i++) {
        addFrag(f.x + rand(-62, 62), f.y - 4 - rand(0, 16), 9, i % 3 ? "#B99B6A" : "#E8C88A");
      }
      S.shocks.push({ x: f.x, y: f.y, t: 0, life: 0.62, dir: 1 });
      S.shocks.push({ x: f.x, y: f.y, t: 0, life: 0.62, dir: -1 });
      addText(f.x, f.y - f.h - 26, "轰!", "#FF9A6B", 26);
    }
    if (f.slamming <= 0) { f._slammed = false; f.slamT = 6.5; }
    stepBody(f, dt);
    return;
  }

  /* ---- 产卵：肚子鼓一下，两侧各钻出一只幼虫 ---- */
  if (f.breeding > 0) {
    f.breeding -= dt;
    f.vx = 0;
    if (f.breeding <= 0.36 && !f._born) {
      f._born = true;
      for (const sd of [-1, 1]) {
        // 出生点必须**离嘴够远**：BOSS 半宽 54，吃得着的范围是 66px。
        // 原来从 ±50 处钻出来，一出生就落在嘴里，两只幼虫当场被吃掉 ——
        // 玩家连看见的机会都没有，"繁殖"就成了"BOSS 免费回血"。
        const lx = clamp(f.x + sd * (f.w * 0.5 + 56), WALL_L + 20, WALL_R - 20);
        const l = foeFromSpec({ foe: "larva", x: lx, y: f.y - 4 }, false);
        l.y = f.y; l.vy = -220; l.onGround = false;
        // 孵化后先朝外爬 1.2 秒再回头归巢。这 1.2 秒是留给玩家的：
        // 没有它，幼虫从 88px 外爬回来只要 0.2 秒，你根本来不及拦。
        l.wanderT = 1.2;
        l.dir = sd;
        S.foes.push(l);
        for (let k = 0; k < 8; k++) addFrag(lx + rand(-9, 9), f.y - 10, 5, "#D8F09A");
      }
      /* 文案要说明"它是干嘛的"。
       * 原来只写"钻出两只幼虫"，玩家看到的就是"又冒出两只虫"，
       * 而它的真实作用是爬回 BOSS 身边被吃掉、给 BOSS 补一层壳 ——
       * 不写出来，这一整套繁殖闭环在玩家眼里就是"敌人凭空变多"
       * （体验评审第 5 条）。 */
      addText(f.x, f.y - f.h - 26, "幼虫钻出 · 回巢给 BOSS 补壳", "#D8F09A", 17);
      S.shake = Math.max(S.shake, 6);
    }
    if (f.breeding <= 0) { f._born = false; f.spawnT = 7.5; }
    stepBody(f, dt);
    return;
  }

  /* ---- 散射：抬头吸气，然后朝玩家喷一个五发扇形 ---- */
  if (f.spitting > 0) {
    f.spitting -= dt;
    f.vx = 0;
    if (f.spitting <= 0.30 && !f._spat) { f._spat = true; spitFan(f); }
    if (f.spitting <= 0) { f._spat = false; f.scatterT = 5.5; }
    stepBody(f, dt);
    return;
  }

  /* ---- 触发：一帧只开一个。三个动作叠在同一秒，"跳 / 走位 / 攻击"
         就变成"同时干三件"，那是难度，不是设计。 ---- */
  /* 流派开关。`st` 对普通怪是 undefined —— 普通怪本来就走不到这里
     （上面 `if (!f.isBoss)` 已经 return），但留 `|| ALL` 兜住手改配置的情况。 */
  const st = f.bossStyle || BOSS_STYLE.hills;
  const larvas = S.foes.filter(q => q.larva && !q.dead).length;
  if (st.spawn && f.spawnT <= 0 && larvas < 3 && (f.spawned || 0) < 5) {
    f.spawned = (f.spawned || 0) + 1;
    f.breeding = 0.9;
    addText(f.x, f.y - f.h - 30, "产卵…", "#FFD86B", 20);
    stepBody(f, dt);
    return;
  }
  /* ---- 断台 / 泥潮：**不打断移动** ----
   *
   * 第一版把这两个动作写成"站住 1 秒再放"（和砸地/产卵一样的做法）。
   * ALL9 当场三条红，而且**每次红的屏都不一样** —— 换配置实验四轮，
   * 红的分别是 12+27 / 12+15+27 / 12+27 / 12+15+18。
   * 那不是在说"某个动作坏了"，是在说：**BOSS 一站住，机器人的瞄准全错**，
   * 后面的每一波都跟着乱，最后随机地掉进超时。
   *
   * 所以这两个动作改成"边走边抬手"：只开一个计时器，
   * BOSS 照常以原速度移动，时间到了地形再变。
   * 它对玩家依然是一次可读的预告（有字、有震动），
   * 但对整个战斗节奏的扰动只剩"那块板/那段地面变了"这一件事。
   */
  /* ★ 抬手那一刻就**锁定目标**，并把它挂到 f 上给绘制层读。
     没有可打的台面 / 没有可铺的位置 → 不抬手。
     （原来是"抬手放空炮，落手时再去找"：找不到就白抬手，
      玩家看到一次举拳什么都没发生，会读作"这招没用"。） */
  if (st.crack && f.crackT <= 0) {
    f.crackT = 11.0;
    const tg = crackTarget(f);
    if (tg) {
      f.cracking = 0.85;
      f._crackTgt = tg;
      addText(f.x, f.y - f.h - 30, "举拳…", "#FFCF6B", 20);
      S.shake = Math.max(S.shake, 3);
    }
  }
  if (st.mud && f.mudT <= 0) {
    f.mudT = 10.0;
    const sp = mudSpot(f);
    if (sp) {
      f.mucking = 0.95;
      f._mudSpot = sp;
      addText(f.x, f.y - f.h - 30, "渗泥…", "#B8946A", 20);
    }
  }
  if (st.fan && f.scatterT <= 0) {
    f.spitting = 0.72;
    addText(f.x, f.y - f.h - 30, "吸气…", "#C7E86B", 20);
    stepBody(f, dt);
    return;
  }
  if (st.slam && f.slamT <= 0) {
    f.slamming = 1.15;
    addText(f.x, f.y - f.h - 30, "举起来了", "#FFB08A", 20);
    S.shake = Math.max(S.shake, 4);
    stepBody(f, dt);
    return;
  }

  if (p && !p.dead) f.face = sign(p.x - f.x);
  f.vx = f.face * (f.stun > 0 ? 0 : 40 + (f.lv || 1) * 7);

  /* 结算断台 / 泥潮。位置在**移动之后**：
     这样落点用的是 BOSS 抬手结束时真实站的地方，不是抬手开始的地方。 */
  if (f.cracking > 0) {
    f.cracking -= dt;
    if (f.cracking <= 0.30 && !f._cracked) {
      f._cracked = true;
      const tg = f._crackTgt;
      f._crackTgt = null;
      if (tg && crackPlat(f, tg)) { S.shake = Math.max(S.shake, 13); S.flash = 0.12; }
    }
    if (f.cracking <= 0) { f._cracked = false; f._crackTgt = null; }
  }
  if (f.mucking > 0) {
    f.mucking -= dt;
    if (f.mucking <= 0.30 && !f._mucked) {
      f._mucked = true;
      const sp = f._mudSpot;
      f._mudSpot = null;
      if (sp) mudRise(f, sp);
    }
    if (f.mucking <= 0) { f._mucked = false; f._mudSpot = null; }
  }

  stepBody(f, dt);
  if (f.hitWall) f.face = -f.face;

  // 掉进坑里（不该发生，但兜一下）
  if (f.y > H + 120) killByFall(f);
}

/**
 * 断台（crusher 专属）：把离 BOSS 最近的一块**浮空台面**整块打掉。
 *
 * 为什么这是"空间"动作而不是"数值"动作：
 * 它改的是**能站的地方**。台面没了，玩家要么换位、要么掉到下一层，
 * 而球原本滚得过去的那条线也断了 —— 玩家得重新找一条路。
 * 这和"球速 ×0.72"是两回事：后者只是同一个空间里的一个数字。
 *
 * 三条护栏（踩过才知道为什么必须有）：
 *  1. **不打 ground**。地面没了，营地、出生点、球的全套物理全塌 —— 那不是难度，是坏档。
 *  2. **不打玩家脚下那块**。玩家站在那里被抽掉地板，感觉是"游戏 bug"，
 *     不是"我被打中了"。这一条是手感边界，不是平衡。
 *  3. **每关最多 2 块**。碎光了这一屏就变成一块光板，地形设计全废。
 */
/** 断台的**选目标**。和"砸下去"分开，因为预告要在抬手那一刻就锁定：
 * 玩家看到的那块，必须就是最后碎掉的那块。分两步做，就只能靠"落手时再选一次"
 * 来假装——而 BOSS 在这 0.85 秒里是走动的，两块可能不是同一块。 */
function crackTarget(f) {
  if (BROKEN.length >= 2) return null;
  const p0 = S.p;
  let best = null, bd = 1e9;
  for (const p of PLATS) {
    if (p.kind === "ground") continue;
    if (isBroken(p)) continue;
    /* ★ 只打**高层**（y <= 360，也就是 350 和 248 那两层）。
       试过连 462 一起打，ALL9 当场三条红：第 12 屏「树桩林」单球只装到 2 只
       （目标 3）、第 15 屏落袋 3（目标 4）—— 462 是球最常走的那一层，
       抽掉一块，整条球道就断了。**断台要改的是"玩家站的地方"，
       不是"球滚的那条线"**：这两件事在同一屏里往往就是同一层，
       所以只能从最高层下手。 */
    if (p.y > 360) continue;
    /* ★ 台面上还站着活敌人 → 不打。
       敌人脚下的板抽掉，它会直落地面，机器人原本算好的路线全废
       （实测第 12 屏：碎片一落，机器人绕着空位转，一个也装不上）。 */
    let occupied = false;
    for (const q of S.foes) {
      if (q.dead) continue;
      if (Math.abs(q.y - p.y) < 40 && q.x > p.x - 12 && q.x < p.x + p.w + 12) { occupied = true; break; }
    }
    if (occupied) continue;
    const cx = p.x + p.w / 2;
    // 玩家站在这块上（脚下 30px 内、水平在范围内）→ 跳过
    if (p0 && !p0.dead &&
        Math.abs(p0.y - p.y) < 32 &&
        p0.x > p.x - 16 && p0.x < p.x + p.w + 16) continue;
    const d = Math.abs(cx - f.x);
    if (d < bd) { bd = d; best = p; }
  }
  if (!best || bd > 360) return null;
  return best;
}

function crackPlat(f, forced) {
  if (BROKEN.length >= 2) return false;
  let best;
  if (forced) {
    /* 预告锁定的那块走这条路。**只用它，不再重新选**：
       锁定之后那块可能已经被上一发打碎、可能有人在上面站着了 ——
       那时该"落空"，不该"换一块打"。换了就是画一块砸另一块。 */
    if (forced.kind === "ground" || isBroken(forced) || forced.y > 360) return false;
    best = forced;
  } else {
    best = crackTarget(f);
    if (!best) return false;
  }
  BROKEN.push(best);
  /* 碎片要从**台面的两端**飞出去，不是从中心炸开：
     中心炸开读作"这块板爆了"，两端崩开读作"这块板塌了"。 */
  for (let i = 0; i < 18; i++) {
    const edge = i % 2 ? best.x : best.x + best.w;
    addFrag(edge + rand(-10, 10), best.y + rand(-6, 14), 8,
            i % 3 ? TH.wood : TH.wood3);
  }
  addText(best.x + best.w / 2, best.y - 26, "台塌了!", "#FFAE7A", 21);
  return true;
}

/**
 * 泥潮（sump 专属）：在 BOSS 脚下铺开一段泥沼。
 *
 * 用的是**已有的** GROUNDS / MAT 机制（N1 地脉），不新增物理：
 * 球滚上去 ×0.72 + 每帧拖拽，人踩上去摩擦 ×2.10。
 * 这样"BOSS 的动作"和"地形材质"是同一套规则，玩家学一次就懂 ——
 * 给 BOSS 单开一套物理，玩家会读成"Boss 一边的东西不算数"。
 *
 * 放置规则：**朝玩家那一侧**铺。铺在 BOSS 背后等于没铺（玩家在另一边）。
 * 最多 3 段：铺满全屏之后，这一屏就只剩"到处都慢"，没有"哪段快哪段慢"。
 */
/** 营地"门口那一截"（球滚进门的最后 280px）的判定。
 *
 *  **方向必须跟着营地走。** 主线 27 屏营地恒贴右墙（x≈852），所以历史上
 *  写死的是 `x0 + w > CAMP.x - 280`（禁区在营地左边）。深巢整屏镜像后
 *  营地搬到左墙（x=26），同一个式子变成 `x0 + w > -254` —— 几乎恒真，
 *  泥潮在镜像层里一次都铺不出来。而泥是 BOSS `spawn` 动作的一部分，
 *  三动作谁都不许关（硬红线）。这里按营地贴哪面墙判断禁区在哪一侧。
 */
function nearCampApproach(x0, w) {
  const campOnRight = CAMP.x + CAMP.w / 2 > W / 2;
  if (campOnRight) return x0 + w > CAMP.x - 280 && x0 < CAMP.x + CAMP.w;
  return x0 < CAMP.x + CAMP.w + 280 && x0 + w > CAMP.x;
}

/** 泥潮的**选址**。和"铺下去"分开 —— 同 crackTarget 的理由：
 * 预告画在哪一段，最后就得铺哪一段。 */
function mudSpot(f) {
  const p0 = S.p;
  const dir = (p0 && !p0.dead) ? sign(p0.x - f.x) || 1 : (f.face || 1);
  /* 宽度 150 → 130、上限 3 → 2。
     实测 3 段 × 150px 之后第 27 屏「沼气王」机器人清不完（6/7）：
     球滚到 BOSS 面前已经没速度了。泥是"让路变难"，不是"把路堵死"。 */
  const w = 130;
  const cx = clamp(f.x + dir * (f.w * 0.5 + 80), WALL_L + w / 2, WALL_R - w / 2);
  const x0 = cx - w / 2;
  /* ★ 营地门口那一截（球滚进门的最后 280px）不铺。
     那一段是"球滚进门的最后一截"：铺上去球会在门口停住，
     玩家看着球停在营地外面，读作"门坏了"。
     （第 15 屏落袋 3 vs 目标 4 就是这么来的。）
     **禁区方向跟着营地走**：主线营地在右墙，禁区在它左边；
     深巢整屏镜像后营地在左墙，禁区必须在它右边 —— 写死 `CAMP.x - 280`
     的话镜像层里这个式子几乎恒真，泥潮一次都铺不出来。 */
  if (nearCampApproach(x0, w)) return null;
  // 已经有泥在附近 → 不叠（叠了只是把同一段加深，玩家看不出变化）
  for (const g of GROUNDS) {
    if (g.kind !== "mud") continue;
    if (x0 < g.x + g.w + 20 && x0 + w > g.x - 20) return null;
  }
  let n = 0;
  for (const g of GROUNDS) if (g.kind === "mud") n++;
  if (n >= 2) return null;
  return { x0, w, cx };
}

function mudRise(f, forced) {
  let spot;
  if (forced) {
    /* 锁定之后要**复验**：这 0.95 秒里可能已经铺过一段，或者刚好又到上限。
       复验不过就落空 —— 不另找地方铺（画一段铺另一段是最难查的那种不一致）。 */
    spot = forced;
    if (nearCampApproach(spot.x0, spot.w)) return false;
    for (const g of GROUNDS) {
      if (g.kind !== "mud") continue;
      if (spot.x0 < g.x + g.w + 20 && spot.x0 + spot.w > g.x - 20) return false;
    }
    let m = 0;
    for (const g of GROUNDS) if (g.kind === "mud") m++;
    if (m >= 2) return false;
  } else {
    spot = mudSpot(f);
    if (!spot) return false;
  }

  /* `boss: true` 是**画法标记**，不是第二份真相：物理仍然只认 kind="mud"。
     为什么要标：沼泽类关卡本身遍地是泥（27 屏里 24 屏自带），
     BOSS 再"多铺一段"如果长得和地形泥一样，玩家根本看不出它做了什么 ——
     机制在跑、反馈为零，等于没做。 */
  GROUNDS.push({ x: spot.x0, w: spot.w, kind: "mud", boss: true });
  for (let i = 0; i < 14; i++) {
    addFrag(spot.x0 + rand(0, spot.w), GROUND_Y - rand(0, 10), 6, i % 3 ? "#7A5A38" : "#5C4226");
  }
  addText(spot.cx, GROUND_Y - 74, "地面渗泥了", "#C9A277", 19);
  S.shake = Math.max(S.shake, 5);
  return true;
}

/** 五发扇形。目的是逼玩家**走位**——砸地逼他跳，扇形逼他换位置，
 *  两件事合起来才叫"这个 BOSS 要看"。 */
function spitFan(f) {
  const p = S.p;
  const muzzleY = f.y - f.h * 0.64;
  let base = f.face > 0 ? 0 : Math.PI;
  if (p && !p.dead) {
    base = Math.atan2((p.y - p.h * 0.5) - muzzleY, p.x - f.x);
  }
  const N = 5, half = 0.50;
  for (let i = 0; i < N; i++) {
    const a = base + ((i / (N - 1)) - 0.5) * half * 2;
    S.foeShots.push({
      x: f.x + Math.cos(a) * (f.w * 0.40),
      y: muzzleY + Math.sin(a) * 12,
      // 弹道要"平"：上一版初速 330、重力 300，从 BOSS 胸口射出来 1 秒就砸进土里，
      // 玩家站在 400px 外根本等不到弹幕，这条机制等于不存在。
      vx: Math.cos(a) * 380,
      vy: Math.sin(a) * 380 - 70,
      r: 9.5, life: 2.4, t: 0, dead: false,
    });
  }
  S.shake = Math.max(S.shake, 8);
  addText(f.x, muzzleY - 30, "噗!", "#C7E86B", 24);
}

/** BOSS 吃掉自己的幼虫 → 补回一层壳。
 *  硬上限 3 层：不设上限的话，玩得越久它越硬，玩家会陷进"打洞-补洞"的死循环。
 *  场上最多 3 只幼虫、每 7.5 秒一对、总共只产 5 对 —— 这四条一起兜住时长。 */
function feedBoss(boss, larva) {
  boss.fed = (boss.fed || 0) + 1;
  for (let i = 0; i < 10; i++) addFrag(boss.x + rand(-22, 22), boss.y - boss.h * 0.55, 6, "#9BE06A");
  if (boss.coat >= 2 && boss.fed <= 3) {
    boss.coat -= 1;
    addText(boss.x, boss.y - boss.h - 18, "嚼掉幼虫 · 壳 +1", "#FFD86B", 20);
    S.shake = Math.max(S.shake, 6);
  } else if (boss.coat < 2) {
    addText(boss.x, boss.y - boss.h - 18, "壳快没了，吃不回来", "#C8C0A8", 17);
  } else {
    addText(boss.x, boss.y - boss.h - 18, "嚼了嚼", "#C8C0A8", 17);
  }
}

/** BOSS 的粘液弹：有重力、会被地形挡住。
 *  "躲到板子下面"是它唯一的解法 —— 这是范围散射给玩家的那个决策。 */
function updateFoeShots(dt) {
  const p = S.p;
  for (const s of S.foeShots) {
    s.life -= dt;
    s.t += dt;
    const prevY = s.y;
    s.vy += 150 * dt;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.life <= 0) { s.dead = true; continue; }
    if (s.x < WALL_L - 30 || s.x > WALL_R + 30 || s.y > GROUND_Y + 12) { s.dead = true; continue; }
    // 只判"从上方落到台面"，不判"球心进了平台的包围盒"。
    // 上一版用包围盒，BOSS 胸口正好和头顶那块板同高，五行弹一出口就被吃掉 ——
    // 一条"范围散射"变成了"BOSS 朝空气撒了一把"。
    if (s.vy > 0) {
      for (const q of PLATS) {
        if (s.x < q.x - s.r || s.x > q.x + q.w + s.r) continue;
        if (prevY + s.r <= q.y + 6 && s.y + s.r >= q.y) { s.dead = true; break; }
      }
    }
    if (s.dead) continue;
    if (p && !p.dead) {
      const dx = Math.abs(s.x - p.x), dy = Math.abs(s.y - (p.y - p.h * 0.5));
      if (dx < s.r + p.w * 0.38 && dy < s.r + p.h * 0.42) {
        hurtPlayer(s.x, "被喷到了");
        s.dead = true;
      }
    }
  }
  if (S.foeShots.length) S.foeShots = S.foeShots.filter(s => !s.dead);
}

/** 玩家受伤只有这一条路 —— 碰敌人、踩火、被冲击波打，都走这里 */
function hurtPlayer(srcX, txt) {
  const p = S.p;
  if (!p || p.dead || p.invT > 0) return;
  p.hp -= 1;
  S.stat.hits++;
  p.invT = 1.2;
  p.vx = -sign(srcX - p.x) * 300;
  p.vy = -300;
  S.shake = Math.max(S.shake, 12);
  S.flash = 0.25;
  addText(p.x, p.y - p.h - 20, txt || "唔!", "#FF9E8E", 20);
  // 只剩一滴血的时候才说 —— 每次挨打都说话会挤成一团，
  // 而"最后一次机会"是玩家注意力最集中的地方，那句才被记住。
  if (p.hp === 1) sayLine("hurt");
  if (p.hp <= 0) { p.hp = 0; p.dead = true; S.phase = "fail"; }
}

/** 冲击波：贴地跑，跳起来就能躲 */
function updateShocks(dt) {
  const p = S.p;
  for (const s of S.shocks) {
    s.t += dt;
    s.x += s.dir * 560 * dt;
    if (s.x < WALL_L || s.x > WALL_R) s.t = s.life;
    // 用"脚底离地高度"判，不用碰撞盒：玩家明明跳过去了还被判定，
    // 那种"我躲开了却没躲掉"是手感里最伤的一种。
    if (p && !p.dead && Math.abs(p.x - s.x) < 32 && p.y > s.y - 66) {
      hurtPlayer(s.x, "被震到了");
    }
  }
  if (S.shocks.length) S.shocks = S.shocks.filter(s => s.t < s.life);
}

/* ============================================================================
   9. 包裹 / 造球
   ========================================================================== */

/**
 * 往敌人身上糊一层苔。
 *
 * `intoBall` 是球传进来的：糊满之后**卷进球里**（球变大），而不是原地
 * 变成一颗新球。这一条必须和 burstBall 对称 ——
 * 卷进去几只，崩开就吐出几只，否则场上人数会自己增殖：
 * 实测漏了这一条，4 只敌人能滚成 12 只，而玩家一个都清不掉。
 *
 * 限球关的额度只在**新造一颗球**时扣。被球卷进去不扣 ——
 * 否则"限 4 颗球"和"4 只敌人各造一颗"没区别，目标就不成立了。
 */
function coatFoe(f, n, intoBall) {
  if (f.dead || f.coat >= (f.cm || 3)) return;
  /* 地脉虫缩回岩壁里的时候**打不中**（规格："缩回时无敌"）。
     这一条必须写在最前面：后面的额度判定、上限判定都会改 `f.coat`，
     写在中间的话"无敌期间被裹到 2 层"这种半生效状态是跑得出来的。 */
  if (f.invuln > 0) {
    /* 提示要节流 —— 每帧一条会把屏幕刷白（和 warnNoBall 同一个病）。
       用 `_invHintAt` 记上次提示时间，0.6 秒一次。 */
    if (S.t - (f._invHintAt || -9) > 0.6) {
      f._invHintAt = S.t;
      addText(f.x, f.y - f.h - 12, "缩回去了", "#8A7A9A", 15);
    }
    return;
  }
  // BOSS 有抗性：0.5 秒内最多吃一层。
  // 0.28 秒是照着"音波喇叭 0.30 秒一发"配的，但除了音波还有溜溜球、飞刀、
  // 影分身的连发 —— 0.28 秒等于没拦，一梭子就是三四层。
  if (f.isBoss) {
    if (S.t - (f._coatAt || -9) < 0.5) return;
    f._coatAt = S.t;
  }

  // 额度用完：允许糊到 2 层（还能被路过的球卷走），但糊不成第三层
  const max = f.cm || 3;
  if (!intoBall && f.coat + n >= max && ballBudget() <= 0) {
    f.coat = max - 1;
    f.hitT = 0.20;
    warnNoBall();
    return;
  }

  // 同屏最多 2 颗球。这不是性能限制，是**注意力限制**：
  // 场上有 4 颗球的时候，玩家不是在决策，是在救火（实测就是这么崩的）。
  // 这条同时是"攒球不免费"最直接的答案 —— 你根本攒不了 3 颗，
  // 只能往一颗球里攒 3 只，而那才是有意思的那件事。
  if (!intoBall && f.coat + n >= max && S.balls.length >= MAX_BALLS) {
    f.coat = max - 1;
    f.hitT = 0.20;
    warnBallFull();
    return;
  }

  f.coat = Math.min(max, f.coat + n);
  f.hitT = 0.20;
  addText(f.x, f.y - f.h - 12, "+" + n, "#E4FFA8", 16);
  for (let i = 0; i < 5; i++) addFrag(f.x, f.y - f.h * 0.5, 5, "#BFE86E");

  if (f.coat >= max) {
    if (intoBall) {
      absorbIntoBall(f, intoBall);
    } else {
      makeBallFrom(f, 0, 0);
      addText(f.x, f.y - f.h - 34, "裹成球了", "#9BE86E", 18);
    }
  }
}

/** "球用完了"提示。不节流的话每帧一条，屏幕直接白掉 */
function warnNoBall() {
  if (S.t - (S._noBallAt || -9) < 1.4) return;
  S._noBallAt = S.t;
  addText(W / 2, 210, "球用完了 · 只能靠卷", "#FF9E8E", 20, 1.2);
  S.shake = Math.max(S.shake, 4);
}

/** "手上有球了，先送走" —— 玩家必须知道为什么这次喷不出去 */
function warnBallFull() {
  if (S.t - (S._fullAt || -9) < 1.4) return;
  S._fullAt = S.t;
  addText(W / 2, 210, "手上已经两颗球 · 先推走一颗", "#FFD08A", 20, 1.2);
}

/** 被滚球卷进去：球变大变重，人从场上消失 */
function absorbIntoBall(f, b) {
  f.dead = true;
  /* 吸入反馈：之前 f.dead = true 直接消失，玩家只看到"敌人没了"。
     一蓬叶绿尘土留在原地，"被卷走"才有个过程。
     注意不能用 addFrag —— 它吃 S.rng，这条路径原来不消耗随机数，
     加进去整局掉落序列就变了（冒烟的清场断言就是这么被打挂的）。 */
  addDust(f.x, f.y - f.h * 0.45, 9, 0.9, "rgba(168,214,110,");
  addDust(f.x, f.y - 3, 3, 0.7);
  b.packed.push(f.def);
  b.holds = b.packed.length;
  b.r = 20 + Math.min(16, b.holds * 2.8);
  b.w = b.h = b.r * 2;
  b.vx *= 0.97;
  // 卷人回一口气：连锁是有回报的，不然"卷"永远不如"另造一颗"
  b.air = Math.min(1, b.air + 0.10);
  if (b.holds > S.stat.maxHolds) S.stat.maxHolds = b.holds;
  // 撞击之后爆一件掉落 —— 这是短反馈循环里唯一的"意外"
  dropOnAbsorb(b);
  /* 连续卷人会叠字，这是出图实测到的真 bug：
     卷人间隔约 9 帧（0.15 秒），而飘字活 0.9 秒 —— 一球 6 连时
     "卷进去 x2".."x6" 五条字全在屏幕上，彼此只隔 92px、字宽约 80px，
     正好叠成一团黑字，玩家读不出"现在几只"。
     只留最新一条：中间那几条本来也没人来得及看，
     而且"字被新字顶掉"本身就像计数器在涨，比五行并排更像反馈。 */
  for (const t of S.texts) if (t.txt.indexOf("卷进去") === 0) t.life = 0;
  addText(b.x, b.y - b.r * 2 - 16, "卷进去 x" + b.holds, "#B9F06A", 17);
  S.shake = Math.max(S.shake, 5);
}

function makeBallFrom(f, vx, vy) {
  if (f.dead) return;
  f.dead = true;
  /* 裹成球：原地一蓬尘土。敌人变球是个"大动作"，静默发生就读不出变了什么 */
  addDust(f.x, f.y - 4, 6, 1.0);
  S.stat.made++;
  S.stat.maxHolds = Math.max(S.stat.maxHolds, 1);
  // BOSS 球更大更重：滚得慢，但推一次值 14 倍收成。
  const isBoss = !!f.isBoss;
  const r = isBoss ? 44 : 22;
  S.balls.push({
    x: f.x, y: f.y, w: r * 2, h: r * 2, r,
    vx: vx || 0, vy: vy || 0,
    holds: 1, mud: false,
    // 气：这一版的核心压力。球会一直漏，漏到 0 就崩开。
    // 卷人回气，所以"铺场再引爆"是有回报的，但回报有上限。
    air: 1,
    // 冰壳：自己的技能打到球上叠的层数。
    // 有了它，"手上的枪"和"场上的球"才第一次连起来 ——
    // 以前对着自己的球开枪，子弹直接穿过去，像是两套不相干的系统。
    frost: 0, frostCd: 0,
    onGround: false, ground: null,
    /* 赛道游标：这颗球走到第几段了。0 = 一段都没走。
       存在**球**上而不是全局 —— 赛道考的是"每一颗球都得自己走完"，
       存在全局的话第一颗球走完，之后所有球都白捡。 */
    tour: 0,
    t: 0, spin: 0, dead: false,
    boss: isBoss, bossLv: f.lv || 1,
    packed: [f.def],
    hitWall: 0, bounceCd: 0, portalCd: 0,
  });
  S.shake = Math.max(S.shake, 6);
  for (let i = 0; i < 12; i++) addFrag(f.x, f.y - r, 7, "#9BE86E");
}

/* ============================================================================
   10. 球：滚、撞、连锁、地形
   ========================================================================== */

function updateBalls(dt) {
  // 快照遍历：滚球撞到敌人会当场造出新球（push 进 S.balls）。
  // 直接遍历原数组的话，新球会在同一个 dt 里被更新 —— 整条连锁
  // 会在一帧内结算完，玩家看到的是一团光，而不是"滚过去撞出一串"。
  const list = S.balls.slice();
  for (const b of list) {
    if (b.dead) continue;
    b.t += dt;
    if (b.reflectCd > 0) b.reflectCd = Math.max(0, b.reflectCd - dt);
    // 推球形变回弹：0.3 秒内从压扁回到圆。不衰减的话，球会一直是个横椭圆。
    if (b.pushSquash > 0) b.pushSquash = Math.max(0, b.pushSquash - dt * 1.9);

    // 寿命上限已由"气"接管（air <= 0 就崩），这里只留一个兜底，
    // 防止极端情况下球卡在某个角上永远不死。
    // **石球豁免**：它的寿命由玩家决定（推起来就活，不推就是一块砖）。
    // 不豁免的话，深巢一层打 240 秒，玩家存着的垫脚会在第 45 秒当着他面炸开。
    if (b.t > 45 && !b.stone) { burstBall(b); continue; }

    /* 掉出世界：**不该发生**，但一旦发生绝不能让人凭空消失。
     * 原来只有一行 `b.dead = true` —— 球没了，装在里面的人也没了，
     * 而 `killed` 不涨，`checkGoal` 的第一条永远不成立，这一层就成了
     * 不可通关。玩家看到的只是"我的球滚着滚着不见了"。
     * 现在按"白推"处理（和左右端滚出同一个口径）：记账 + 人放回场上。
     *
     * ---- 边界规则（2026-10-27 用户拍板，改之前先读完这段）----
     * **只要球落到下方，无论左右，一律消失。不做"掉下去还能继续滚"。**
     * 曾经提过一个「深坑」出口（不给口粮、给改造件碎片、球能继续往下滚），
     * 用户否掉："只要是下方 无论左右 球都消失"。原因不难猜：
     * 一旦允许"往下滚"，y 就不再是终点而是一条连续的轴，
     * 球会开始跨层搬运状态（球里裹的人算哪一层的 killed？目标怎么算？
     * 上层还有怪的台面怎么办），而这一整套复杂度换来的只是玩家
     * 少按一次推 —— **不划算**。
     * 左右两侧同理：那两堵墙是反弹面（×0.62），不是出口。
     * 唯一的方向性出口是"进送走点"（营地 / 地缝）和"烧掉"（火坑），
     * 两者都给收成、都消失，区别只在收益和代价。 */
    if (b.y > H + 200) {
      b.dead = true;
      S.stat.lost = (S.stat.lost || 0) + Math.max(1, b.holds);
      for (const f of respawnPacked(b, 1, WALL_L + 46)) S.foes.push(f);
      continue;
    }

    /* ---- 石球：停住就是一块砖（见 hardenBall 上方那段设计注释）----
       **三个条件缺一不可，每一个都是被打红之后补的**：

       · `b.pushed` —— 刚造出来的球本来就是静止的（vx=0、onGround），
         少了它玩家一造球它就变砖，连推都推不走。实测当场把清场、bounty、
         无限血三条基线全打红。

       · `atWall` —— **只认"贴着墙停住"**。第一版只判 `|vx| < 260`，
         结果球在装人的时候被撞减速（撞一下 ×0.42~0.7），速度掉到 260 以下
         就被判成停住了 —— 攒到第 2 只就变砖，直接把刚做的「加注」毁掉。
         ALL9 第 12 屏「单球能装够目标只数 最大 2 vs 目标 3」就是它。
         **"减速"和"停下"不是一回事，判据必须落到几何上（贴墙）而不是速度上。**

       · `b.onGround` —— 空中的球贴墙不算（它只是路过墙角）。 */
    if (!b.stone) {
      const atWall = (b.x - b.r < WALL_L + 6) || (b.x + b.r > WALL_R - 6);
      /* **判据是"位置不再变"，不是"速度小"。**
         第四版了。前三版都在速度上做文章，全部被 ALL9 打回：
           ① 只判 `|vx| < 260` → 刚造出来的球也静止 → 一造出来就变砖，三条基线全红
           ② 加 `b.pushed` → 球装人时被撞减速到 260 以下 → 攒到 2 只就变砖
              （第 12 屏「目标 3 只」、第 15 屏「落袋 4」）
           ③ 加 `atWall` + `|vx| < 40` → 球在墙边撞木桩减速到 40 以下 → 同样变砖
         根子在于**"减速"和"停下"不是一回事**，而墙边恰恰是两个都会发生的地方。
         速度是连续量，任何阈值都有一条可以误踩的边；位移是事件的直接结果 ——
         撞墙时 `STONE_STOP` 已经把 `vx` 归零，位置就真的不动了。
         所以这里比较**这一帧和上一帧的 x**：`< 0.25px` 才算停
         （0.25 ≈ 15px/s，一帧 0.25px 肉眼看不见）。 */
