    g.fillStyle = "#16261C";
    g.beginPath();
    g.ellipse(cx, f.y + 2, bw * 0.42, 4.5, 0, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
  }

  /* 跳虫蹲身时脚下的橙色脉冲环（2026-10-27）。
     **这是预告里最容易被读到的一层。** 只有头顶那个三角的话，
     玩家得盯着某一只虫才会发现它；脚下一亮，余光就能扫到 ——
     而且"地上的圈在扩散"天然读作"有东西要离开地面"。
     环从脚下向外扩、同时变淡，0.30 秒走完，正好和 crouch 同步。 */
  if (f.jumper && f.crouch > 0) {
    const k = 1 - clamp(f.crouch / 0.30, 0, 1);
    g.globalAlpha = 0.62 * (1 - k);
    g.strokeStyle = "#FFB347";
    g.lineWidth = 2.4;
    g.beginPath();
    g.ellipse(cx, f.y, bw * (0.42 + k * 0.85), 4 + k * 5, 0, 0, 6.283);
    g.stroke();
    g.globalAlpha = 1;
  }

  /* 跳虫蹲身：**压扁是攻击预告，不是动画。**
     玩家必须能在起跳前 0.3 秒看出"这只跟别的不一样了"。
     给到高度 ×0.72、横向 ×1.18 —— 这是"明显变形但还认得出是同一只虫"的上限，
     再夸张就变成另一个物种了。 */
  const crouchK = (f.jumper && f.crouch > 0) ? clamp(f.crouch / 0.30, 0, 1) : 0;
  const sx = (1 + squash * 0.18) * (1 + crouchK * 0.18);
  const sy = (1 - squash * 0.16) * (1 - crouchK * 0.28);

  g.save();
  /* **位置只由物理层决定一次。**
     这里原来还叠了一个 `Math.sin(f.bob) * 2.5`，理由是"贴图是静态的，
     翼/腿在动的信息会丢"——但飞行敌人的 `f.y` 本来就是每帧由 homeY
     算出来的正弦（乌鸦 18px / 巢蛾 11px），绘制层再叠一个**频率不同**的
     2.5px，两个接近但不相等的频率就打出拍频。
     实测症状就是玩家报的"上下跳动很奇怪、抖得很严重"：
     视觉上是一跳一跳的顿挫，不是飞。删掉这一层，位移就只有一份。 */
  g.translate(cx, cy);
  g.scale(sx, sy);
  // 只画朝右的版本，靠镜像翻面 —— 三套造型各自处理左右会把代码写成三份
  g.save();
  g.scale(f.face, 1);

  /* 敌人立绘（4x 贴图，由 GroveBattle 走 resources.load 注入 ART["foe-<key>"]）。
     有图就贴图、没图回退到下面那三套三档色代码图形 —— 与宠物同一套「两套并存」的规矩。

     **画多大用 def.vw/vh，不是碰撞盒 bw/bh**。碰撞与视觉刻意分开：
     野猪碰撞 56×40、画 76×54，多出来的部分不参与任何碰撞判定。
     贴图由 prep_foes.py 按 vw/vh 等比装框（不拉伸），所以按原比例还原不会变形；
     反过来说，这里如果改用 bw/bh 当视觉尺寸，贴图就会被压扁 —— 因为贴图的
     宽高比是 vw/vh，不是 bw/bh。

     **底边必须贴 f.y**：局部坐标里 y 向下为正，贴图底边要落在世界 y = f.y 上，
     也就是局部 y = bh/2。所以 yTop = bh/2 - ih，而不是简单的 -ih/2。
     写成 -ih/2 的后果是：视觉比碰撞高的敌人会往地里陷 (ih-bh)/2 像素
     —— 野猪会陷 7px，脚看不见了。

     贴图是静态的，原来画法里"腿在动"的信息会丢；用 1.2px 的走路弹跳补回来
     （28 高的敌人上是 4%，够读出"在挪"，又不至于像在蹦）。 */
  /* 贴图 key：**按 `def.kind` 分，不能按 `f.kind`** ——
     巢蛾被照亮之后 `f.kind` 会从 "moth" 改成 "walk"（这样它才会掉下来、
     才会被裹），但它的贴图仍然是巢蛾那张。按 f.kind 分的话，
     它一落地就变成毛毛虫的贴图 —— 玩家会以为"打出了另一只怪"。
     新怪（spider / shell / moth / vein）暂时没有立绘，`artOf` 返回 null，
     自动回退到下面的代码图形分支。 */
  const foeKey = f.larva ? "larva"
    : d.kind === "fly" ? "crow"
    : d.kind === "charge" ? "boar"
    : d.kind === "walk" && d.hunt === "shake" ? "spider"
    : d.kind === "roll" ? "shell"
    : d.kind === "moth" ? "moth"
    : d.kind === "burrow" ? "vein" : "bug";
  const foeImg = artOf("foe-" + foeKey);
  if (foeImg) {
    const ih = d.vh || bh, iw = ih * (foeImg.width / foeImg.height);

    /* ---------------- 贴图敌人的行走姿态：伸 → 缩 → 顿 ----------------
     *
     * 前四版全部失败，前三版是参数没给够，**第四版是方法错了**，
     * 而且错的地方很具体：用 `sin` 做**连续**形变。
     *
     * 连续变化里**没有一帧是静止的**。人眼对这种信号的解读不是"走了一步"，
     * 而是"这个东西在抖" —— 这正是你说的"一直往前抖动，不是蠕动"。
     * 爬行也好、四足也好，落脚之后**必然有一段身体不动的支撑相**，
     * 那段静止才是"一步"这个单位能被看见的原因。跳舞才是一刻不停的。
     *
     * 所以这里不用 sin，改成相位切三段（一个周期 = 一步）：
     *
     *   0.00 ~ 0.34   伸：身体沿轴线拉长变薄 + 沿朝向前探  (smoothstep 加速)
     *   0.34 ~ 0.50   缩：挤回短厚 + 收回到位             (smoothstep 减速)
     *   0.50 ~ 1.00   顿：形变**完全回到 1**，一动不动
     *
     * 一半时间静止，是这一版和前三版最根本的差别。
     *
     * 频率也必须降。上一版 `6.5 + 8×速度` rad/s → **3~7 步/秒**，
     * 那个频率下不管什么形变都只会读作抖。现在：
     *   毛毛虫 0.62s 一步（1.6 步/秒）—— 慢，黏，贴地；
     *   野猪   0.45s 一步（2.2 步/秒）—— 快一点，因为它是四足冲锋。
     *
     * 竖直位移只给野猪，而且只有 2.6px、只出现在"伸"的那一段（蹬地一抬）。
     * 给虫子加竖直起伏试过：它是贴地爬的东西，一抬就露馅成"跳"。
     * 野猪那张图本身就是四腿腾空的奔跑姿态，不抬反而不对。
     *
     * **伸缩的轴必须是身体轴（水平），不是竖直。**
     * 前几版一直在缩放 `sqY` —— 那是"变高变瘦"，读作长个儿/呼吸，
     * 和"爬行"没有任何关系。毛毛虫蠕动、四足跑动，身体都是**沿前进方向**
     * 一伸一缩：蹿出去的时候身体变长变薄，落定的时候挤回来变短变厚。
     * 这一条错了，幅度给多大都不对 —— 这是"抖动感"最后的根。
     *
     * 前倾只有野猪有，而且只在"伸"的那一段出现（0.085 rad ≈ 4.9°）。
     * 上一版是常驻 0.11 rad：一张站着画的图被恒定掰斜 6°，读作"要摔倒"。
     */
    const spdK = Math.min(1, Math.abs(f.vx || 0) / 60);
    const walker = f.kind === "walk" || f.kind === "charge";

    let lean = 0, sqX = 1, sqY = 1, fwd = 0, hop = 0;

    if (walker) {
      const isBoar = f.kind === "charge";
      /* 步频：虫子慢、野猪快。`f.ph` 是出生时给每只的固定相位（弧度），
         换算成 0~1 的圈内偏移 —— 同一个波次的敌人不能同手同脚。 */
      const stepT = isBoar ? 0.45 : 0.62;
      const ph0 = ((f.ph || 0) / 6.2832) % 1;
      const cyc = (t / stepT + ph0) % 1;

      /* 形变强度不跟速度线性走：慢速的小怪也要看得出在爬，
         所以给 0.55 的地板；完全停下（spdK≈0）时才收干净。 */
      const amp = Math.max(0.55, spdK);

      /* stretch ∈ [-1, 1]：+1 蹿到最长，-1 挤到最短，0 是原始比例 */
      let stretch = 0;
      let lift = 0;        // "伸"的进行度 0~1，只给前探和前倾用

      if (cyc < 0.34) {
        const k = cyc / 0.34;
        const e = k * k * (3 - 2 * k);
        stretch = e;
        lift = e;
      } else if (cyc < 0.50) {
        const k = (cyc - 0.34) / 0.16;
        const e = k * k * (3 - 2 * k);
        stretch = 1 - 2 * e;      // +1 → -1
        lift = Math.max(0, 1 - 2 * e);
      }
      /* cyc ≥ 0.50：stretch / lift 都保持 0 —— 静止段。 */

      /* 水平是主通道：虫子 ±13%、野猪 ±10%。
         竖直方向只做**反相补偿**（伸长时变薄），幅度是水平的三分之一左右 ——
         体积守恒的直觉，也让"伸"看起来是肉在拉长而不是图被压扁。 */
      const ampS = isBoar ? 0.100 : 0.130;
      sqX = 1 + ampS * stretch * amp;
      sqY = 1 - ampS * 0.38 * stretch * amp;
      fwd = (isBoar ? 3.0 : 2.6) * lift * amp;
      lean = (isBoar ? 0.085 : 0.020) * lift * amp;
      /* 四足还有蹬地那一抬：**只在伸的时候**，落下就贴回地面。
         它不是"跳"，幅度只有 2.6px，配合落地压扁读作"跑起来有重量"。 */
      hop = isBoar ? -2.6 * lift * amp : 0;
    }

    g.save();
    /* 前探沿**局部 +x**：外层已经 `g.scale(f.face,1)` 镜像过，
       所以朝左的敌人不用再取反，这里是它自己的前方。 */
    g.translate(fwd, hop);
    g.translate(0, bh / 2);
    g.rotate(lean);
    g.scale(sqX, sqY);
    g.translate(0, -bh / 2);
    g.drawImage(foeImg, -iw / 2, bh / 2 - ih, iw, ih);
    g.restore();
  } else if (f.larva) drawLarva(g, f, bw, bh, t);
  else if (f.kind === "fly") drawCrow(g, f, bw, bh, t);
  else if (f.kind === "charge") drawBoar(g, f, bw, bh, t);
  /* ---- 深巢四怪的分派也按 `def.kind`，理由同上（巢蛾落地后 f.kind 变 walk）---- */
  else if (d.kind === "roll") drawShell(g, f, bw, bh, t);
  else if (d.kind === "moth") drawMoth(g, f, bw, bh, t);
  else if (d.kind === "burrow") drawVein(g, f, bw, bh, t);
  else if (d.hunt === "shake") drawSpider(g, f, bw, bh, t);
  else drawWorm(g, f, bw, bh, t);
  g.restore();
  g.restore();

  // ---- 包裹层：这是这个游戏里唯一的"血条"，必须一眼数得清
  //
  // **环要包住视觉体，不是碰撞盒**。贴图化以后两者不再相等（野猪碰撞 56×40、
  // 画 68×50），如果还用 bw/bh 算半径，环就会切进身体里 —— 出图看得很明显：
  // 野猪的血条比它自己小一圈，像穿了件小一号的衣服。
  // 中心也要跟着视觉体走：贴图底边贴 f.y，所以视觉体中心是 f.y - vh/2，
  // 而 cx/cy 里的 cy 是按碰撞高 bh 算的 —— 别直接复用。
  if (f.coat > 0) {
    const cvw = d.vw || bw, cvh = d.vh || bh;
    const ccy = f.y - cvh / 2;
    for (let i = 0; i < f.coat; i++) {
      const p = i / 3;
      g.strokeStyle = i === 2 ? "#B9F06A" : "#8FD45A";
      g.lineWidth = 3.2 - i * 0.5;
      g.globalAlpha = 0.95;
      g.beginPath();
      g.ellipse(cx, ccy, cvw * 0.5 + 3 + p * 5, cvh * 0.5 + 3 + p * 5,
        (i * 0.5 + S.t * 0.6) % 3.14, 0.3 + i, 3.9 + i);
      g.stroke();
    }
    g.globalAlpha = 1;
    if (f.coat === 2) {
      g.globalAlpha = 0.28 + Math.sin(S.t * 8) * 0.14;
      g.fillStyle = "#B9F06A";
      g.beginPath();
      g.ellipse(cx, ccy, cvw * 0.72, cvh * 0.72, 0, 0, 6.283);
      g.fill();
      g.globalAlpha = 1;
    }
  }

  /* ---- 跳虫的身份标记（2026-10-27）----
     头顶一个朝上的小三角。三条理由：

     1. **不能靠换颜色**：有立绘的敌人是用 resources 注入的贴图画出来的，
        代码里没有地方改色；改 `FOES.bug.c1` 会把全世界的刺毛虫一起改。
     2. **不能靠描边**：`coat` 环已经占了身体那一圈，两者会糊成一片。
     3. **形状就是说明书**：它唯一会做的额外动作就是往上跳，
        朝上的三角不用任何文字解释。

     蹲身时三角闪（20Hz 硬切，不是渐变）—— 渐变看起来像呼吸，硬切像警报。 */
  if (f.jumper && !f.isBoss) {
    /* 做成一个"感叹号"（三角 + 短杆）而不是孤立三角。
       第一版只有三角、而且悬在头顶 9px 外，出图后读成了
       "天上飘着的一个橙色图标"—— 它和这只虫没有视觉联系，
       玩家不会想到"这只会扑我"。那条 2×6 的杆子就是为了把它钉在这只虫身上。 */
    const vh = d.vh || bh;
    const topY = f.y - vh;                          // 视觉体顶边
    const mx = cx;                                  // 和脚下的脉冲环同心
    const tipY = topY - 14;
    /* 蹲身时闪（20Hz 硬切）。渐变读作呼吸，硬切才读作警报。 */
    const blink = f.crouch > 0 ? (Math.sin(S.t * 42) > 0 ? 1 : 0.15) : 0.82;
    g.globalAlpha = blink;
    g.fillStyle = f.crouch > 0 ? "#FF6B3D" : "#D9822B";
    g.fillRect(mx - 1, tipY + 8, 2, 6);
    g.beginPath();
    g.moveTo(mx, tipY);
    g.lineTo(mx + 6, tipY + 9);
    g.lineTo(mx - 6, tipY + 9);
    g.closePath();
    g.fill();
    g.globalAlpha = 1;
  }
}

function drawBall(g, b) {
  const cx = b.x, cy = b.y - b.r;
  const r = b.r;
  // 被推的那一刻沿运动方向拉长、垂直方向压扁（0..0.45，0.3 秒内收回去）。
  // 球是圆的，圆的滚动本身看不出"受力" —— 这一下形变是推球唯一的物理读数。
  const sq = b.pushSquash || 0;
  const rx = r * (1 + sq * 0.42);
  const ry = r * (1 - sq * 0.26);

  // 拖影：速度越快拖得越长。四个残影，alpha 递减。
  const sp = Math.abs(b.vx);
  if (sp > 260) {
    const k = Math.min(1, (sp - 260) / 700);
    for (let i = 1; i <= 3; i++) {
      g.globalAlpha = 0.16 * k * (1 - i * 0.24);
      g.fillStyle = b.mud ? "#8A6A40" : "#CFEE7C";
      g.beginPath();
      g.ellipse(cx - sign(b.vx) * i * 11 * k, cy, rx * (1 - i * 0.08), ry * (1 - i * 0.08), 0, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  // 影子
  g.globalAlpha = 0.2;
  g.fillStyle = "#16261C";
  g.beginPath();
  g.ellipse(cx, b.y + 2, r * 0.9, 6, 0, 0, 6.283);
  g.fill();
  g.globalAlpha = 1;

  // 外发光：球是场上唯一"可交互"的东西，必须一眼从敌人里挑出来。
  // 刺毛虫本身也是绿圆球（#8FC96A），只靠颜色分不开 —— 靠光晕和体量。
  // 石球仍然可交互（能踩、推一下又能滚），所以光晕要留；
  // 但颜色换成石头色系 —— 用黄绿光晕的话，一颗灰球在发绿光，读作"它还是绿的"。
  // 透明度也压一半：石球已经不是"活的"，光晕弱一档才对。
  if (!b.stone) {
    g.globalAlpha = 0.22 + Math.sin(S.t * 7) * 0.09;
    g.fillStyle = b.mud ? "#B08A52" : "#D8F98C";
    g.beginPath();
    g.arc(cx, cy, r * 1.34, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
  }

  // 球体
  /* 「加注」的主信号是**球本身的颜色**，不是那圈金环。
     第一版只加了 3px 的 `rgba(255,214,90,.34~.6)` 环在 r+3.5 —— 放大 4 倍
     的验收图上一颗都看不出来：它在绿草地上、又和"剩余的气"那圈 r+6 贴着，
     两条绿/金细线挤在一起读作一条描边。**弱信号叠在强信号旁边等于没有。**
     现在球体从黄绿（#C9E96E）直接转金（#E9DC72），环只当动画。
     泥球不动 —— 泥是"变狠"的状态，两者可以同时存在（泥金球合理）。 */
  const gold = b.holds >= 3 && !b.stone;
  g.fillStyle = b.stone ? "#A89F8A"
              : b.mud ? "#7A5C36"
              : gold ? "#E9DC72" : "#C9E96E";
  g.beginPath();
  g.ellipse(cx, cy, rx, ry, 0, 0, 6.283);
  g.fill();
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.4;
  g.stroke();

  // 高光
  g.globalAlpha = 0.5;
  g.fillStyle = "#FFFFFF";
  g.beginPath();
  g.ellipse(cx - r * 0.32, cy - r * 0.38, r * 0.24, r * 0.16, -0.6, 0, 6.283);
  g.fill();
  g.globalAlpha = 1;

  // 冰壳：层数越多，外圈越白越厚，还长出几根冰刺。
  // 这是"这颗球现在一撞就整只卷走"的**唯一**读数 ——
  // 不做成数字，因为战斗中没人会去读数字。
  if (b.frost > 0) {
    g.globalAlpha = 0.16 + 0.13 * b.frost;
    g.fillStyle = "#DFF6FF";
    g.beginPath();
    g.arc(cx, cy, r, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;

    g.strokeStyle = "rgba(226,248,255,.92)";
    g.lineWidth = 2 + b.frost;
    g.lineCap = "round";
    for (let i = 0; i < b.frost * 2 + 1; i++) {
      const a0 = b.spin * 0.6 + i * 1.9;
      g.beginPath();
      g.arc(cx, cy, r - 2, a0, a0 + 0.5);
      g.stroke();
    }

    for (let i = 0; i < b.frost; i++) {
      const a = b.spin + i * 2.1;
      const px = cx + Math.cos(a) * (r - 1), py = cy + Math.sin(a) * (r - 1);
      g.fillStyle = "#EAFBFF";
      g.beginPath();
      g.moveTo(px + Math.cos(a) * 8, py + Math.sin(a) * 8);
      g.lineTo(px + Math.cos(a + 1.9) * 7, py + Math.sin(a + 1.9) * 7);
      g.lineTo(px + Math.cos(a - 1.9) * 7, py + Math.sin(a - 1.9) * 7);
      g.closePath();
      g.fill();
      g.strokeStyle = "rgba(120,170,200,.75)";
      g.lineWidth = 1.2;
      g.stroke();
    }
  }

  /* 缠绕的苔绳：跟着 spin 转，读得出"在滚"。
     石球换成**石缝**：三条弧改成三条折线，而且不转（spin 冻结在硬化那一刻，
     因为转 = 在滚 = 还能推，会误导玩家去推一块砖）。
     弧是"缠着的东西"，折线才是"裂开的石头" —— 这个区别在 46px 上很明确。 */
  g.save();
  g.translate(cx, cy);
  g.rotate(b.stone ? 0 : b.spin);
  if (b.stone) {
    g.strokeStyle = "rgba(48,42,32,.72)";
    g.lineWidth = 2.6;
    g.lineCap = "round";
    g.lineJoin = "round";
    for (let i = 0; i < 3; i++) {
      const a = i * 2.1 + hash(i) * 2.4;
      const rr = r * (0.34 + i * 0.20);
      const ax = Math.cos(a) * rr, ay = Math.sin(a) * rr;
      const bx = Math.cos(a + 0.9) * rr * 0.9, by = Math.sin(a + 0.9) * rr * 0.9;
      g.beginPath();
      g.moveTo(ax, ay);
      g.lineTo(bx + Math.cos(a + 1.4) * r * 0.16, by + Math.sin(a + 1.4) * r * 0.16);
      g.lineTo(bx, by);
      g.stroke();
    }
    g.restore();
  } else {
    g.strokeStyle = b.mud ? "rgba(50,36,20,.55)" : "rgba(60,110,40,.55)";
    g.lineWidth = 2.6;
    g.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      g.beginPath();
      g.arc(0, 0, r * (0.5 + i * 0.16), i * 1.1, i * 1.1 + 1.5);
      g.stroke();
    }
    g.restore();
  }

  /* 里面那位的眼睛 —— 让球"是个活物被包起来了"，不是道具。
     **石球不画眼睛**：硬化 = 里面那位被压住了，还有眼睛会读成"它只是不动了"，
     玩家就会去等它自己动。没有眼睛才是"变成石头了"。 */
  if (!b.stone) {
    g.fillStyle = "rgba(20,26,18,.75)";
    g.beginPath();
    g.arc(cx - r * 0.18, cy - r * 0.02, r * 0.11, 0, 6.283);
    g.arc(cx + r * 0.18, cy - r * 0.02, r * 0.11, 0, 6.283);
    g.fill();
  }

  /* ---- 「加注」的读数（2026-10-27）----
     有加成的球必须**在场上就看得出来**，不能等落袋才显示一个数字：
     玩家要能在"再糊一只、还是现在推走"这个瞬间读到"这颗已经值钱了"。
     两个信号：球体从黄绿转金（主）、装载数从 `x3` 变成 `x3 +1`（金额）。
     **这里没有金环**，试过两版都否掉：
       · 3px / 透明度 .34~.6 在 r+3.5 —— 放大 4 倍的验收图上一颗都看不见
         （绿草地上，细金线读作描边的一部分）；
       · 加粗到 4px / .55~.9 —— 它和气圈的**内缘**（r+6 宽 3.4，从 r+4.3
         开始）直接重叠，绿气圈把金环盖掉一半，剩下的部分读作"球上有两圈线"。
     球体变金是主信号，`x4 +3` 是金额，两样加起来已经够读。
     **弱信号叠在强信号旁边不是加强，是噪音。** */

  // 装载数
  if (b.holds > 1) {
    g.fillStyle = b.stone ? "#3E362A" : gold ? "#5A4614" : "#FFE58A";
    g.font = "bold 13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.lineWidth = 3;
    /* 金字球上的字必须换成深色 —— 原来是 #FFE58A 奶金压在 #E9DC72 金球上，
       对比度不到 1.3:1，放大图上 `x4 +3` 直接消失（和排行榜那次同一个病）。
       描边也从深棕改成奶白：深描边在深字上等于没有边。
       石球同理：石灰底上用深褐字 + 浅描边。 */
    g.strokeStyle = b.stone ? "rgba(232,226,210,.75)"
                  : gold ? "rgba(255,248,220,.9)" : "rgba(24,32,20,.85)";
    const loadTxt = gold ? "x" + b.holds + " +" + holdBonus(b.holds) : "x" + b.holds;
    g.strokeText(loadTxt, cx, cy + r * 0.52);
    g.fillText(loadTxt, cx, cy + r * 0.52);
  }

  /* 剩余的气：球外侧画一圈弧。这是"这颗球还能滚多久"的**唯一**读数，
     必须能在不读数字的情况下看出大概 —— 所以用长度而不是数字。
     **石球没有这一圈**：它不漏气了，画一个不会变的圈等于骗人
     （玩家会一直等那个圈往下走）。石球的状态读数是"没有圈、没有眼睛、是灰的"。 */
  if (!b.stone) {
  const air = b.air === undefined ? 1 : b.air;
  const a0 = -Math.PI / 2;
  g.lineWidth = 3.4;
  g.lineCap = "round";
  g.strokeStyle = "rgba(20,30,22,.28)";
  g.beginPath();
  g.arc(cx, cy, r + 6, 0, 6.283);
  g.stroke();
  g.strokeStyle = air > 0.55 ? "rgba(150,235,120,.85)"
                : air > 0.28 ? "rgba(255,206,90,.9)"
                : "rgba(255,110,90,.95)";
  g.beginPath();
  g.arc(cx, cy, r + 6, a0, a0 + 6.283 * air);
  g.stroke();

  // 快漏完了：裂纹 + 抖。给一个"再不动手就没了"的即时信号
  if (air < 0.42) {
    const k = (0.42 - air) / 0.42;
    const jx = Math.sin(S.t * 46) * k * 2.2;
    g.strokeStyle = "rgba(255,90,70," + (0.3 + k * 0.55).toFixed(2) + ")";
    g.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      const a = i * 2.1 + hash(i) * 3;
      g.beginPath();
      g.moveTo(cx + jx + Math.cos(a) * r * 0.2, cy + Math.sin(a) * r * 0.2);
      g.lineTo(cx + jx + Math.cos(a) * r * 0.85, cy + Math.sin(a) * r * 0.85);
      g.stroke();
    }
  }
  }
}

/* ----------------------------------------------------------------------------
   预瞄线：画在关卡之上、单位之下。压在所有东西下面，但比地面亮。
   -------------------------------------------------------------------------- */
const AIM_COL = {
  fire:  "255,146,72",
  camp:  "255,212,88",
  stump: "226,226,226",
  stop:  "126,232,255",
  air:   "126,232,255",
  water: "120,214,255",
};

function drawAimLine(g, b, A, dir) {
  const pts = A.pts;
  if (!pts || pts.length < 2) return;
  const col = AIM_COL[A.end] || AIM_COL.air;

  // 按"反弹前 / 反弹后"切段。撞墙之后球会滚回来，这一段是真的，
  // 但它和"我主动推出去"不是同一件事 —— 画成同样的线，玩家会以为
  // 球会一直往那个方向走（截图里看起来就是一条笔直的长线）。
  const parts = [];
  let cur = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    if (pts[i].ph !== pts[i - 1].ph) { parts.push(cur); cur = [pts[i - 1]]; }
    cur.push(pts[i]);
  }
  parts.push(cur);

  g.lineCap = "round";
  g.setLineDash([8, 7]);
  for (let k = 0; k < parts.length; k++) {
    const seg = parts[k];
    if (seg.length < 2) continue;
    g.globalAlpha = k === 0 ? 1 : 0.3;
    g.strokeStyle = "rgba(10,22,14,.62)";
    g.lineWidth = 6.5;
    g.beginPath();
    g.moveTo(seg[0].x, seg[0].y);
    for (let i = 1; i < seg.length; i++) g.lineTo(seg[i].x, seg[i].y);
    g.stroke();
    g.strokeStyle = "rgba(" + col + ",1)";
    g.lineWidth = 3.4;
    g.beginPath();
    g.moveTo(seg[0].x, seg[0].y);
    for (let i = 1; i < seg.length; i++) g.lineTo(seg[i].x, seg[i].y);
    g.stroke();
  }
  g.setLineDash([]);
  g.globalAlpha = 0.9;

  // 终点：一个空心圈。落点比路径更重要 —— 玩家算的是"最后停在哪"
  const last = pts[pts.length - 1];
  g.globalAlpha = 0.82;
  g.beginPath();
  g.arc(last.x, last.y, 8, 0, 6.283);
  g.stroke();
  g.beginPath();
  g.arc(last.x, last.y, 3, 0, 6.283);
  g.fillStyle = "rgba(" + col + ",.9)";
  g.fill();

  // 沿途事件
  g.globalAlpha = 0.95;
  g.font = "bold 12px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  for (const m of A.marks) {
    const label = m.kind === "fire" ? "烧"
                : m.kind === "camp" ? "袋"
                : m.kind === "mud"  ? "泥"
                : m.kind === "stump" ? "桩"
                : m.kind === "water" ? "水"
                : m.kind === "bounce" ? "弹"
                : m.kind === "portal" ? "洞"
                : m.kind === "expire" ? "散"
                : m.kind === "out" ? "出"
                : String(m.n);
    g.lineWidth = 3;
    g.strokeStyle = "rgba(16,26,20,.85)";
    g.strokeText(label, m.x, m.y);
    g.fillStyle = m.kind === "fire" ? "#FFB07A"
                : m.kind === "camp" ? "#FFE08A"
                : m.kind === "foe"  ? "#C9F06E"
                : m.kind === "water" ? "#8FD8F0"
                : m.kind === "bounce" ? "#B6EE72"
                : m.kind === "portal" ? "#9FE4FF"
                : m.kind === "out" ? "#CBD8E8"
                : "rgba(220,235,240,.9)";
    g.fillText(label, m.x, m.y);
  }

  // 这一球能撞几只 —— 连锁关唯一的决策依据
  if (A.hits > 0) {
    g.font = "bold 12px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.textAlign = "left";
    g.fillStyle = "rgba(" + col + ",.95)";
    g.strokeStyle = "rgba(16,26,20,.85)";
    g.lineWidth = 3;
    const tx = last.x + 12, ty = last.y - 14;
    g.strokeText("撞 " + A.hits, tx, ty);
    g.fillText("撞 " + A.hits, tx, ty);
  }
  g.restore();
}

function drawAim(g) {
  // 站在台面上时提醒"↓ 能下去"。只在能穿的时候画 —— 一直画就成了噪音
  const p = S.p;
  if (p && !p.dead && p.onGround && p.ground && p.ground.kind !== "ground") {
    const bob = Math.sin(S.t * 5) * 3;
    g.save();
    g.globalAlpha = 0.55;
    g.strokeStyle = "#FFFFFF";
    g.lineWidth = 2.6;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(p.x - 7, p.y + 5 + bob);
    g.lineTo(p.x, p.y + 13 + bob);
    g.lineTo(p.x + 7, p.y + 5 + bob);
    g.stroke();
    g.restore();
  }

  // 轨迹默认**不画**。用户原话："球滚动的轨迹不用显示出来了"。
  // 常驻的预测线会把画面变成一张工程图，而且看久了玩家就不再看球本身。
  // 想算的时候按住 Shift —— 它退回到"可选辅助"的位置。
  /* 「盲眼」（深 15）：Shift 不再给线。**只关轨迹，不关上面那个
     "↓ 能下去"的箭头** —— 那个是地形提示不是预测，关掉等于让人
     在台面上反复试跳。 */
  if (!S.aim || modOn("blind")) return;

  for (const b of S.balls) {
    if (b.dead) continue;
    const dirs = b.onGround && Math.abs(b.vx) < 140 ? [-1, 1] : [sign(b.vx) || 1];
    for (const d of dirs) drawAimLine(g, b, aimFor(b, d), d);
  }
}

function drawShot(g, s) {
  const k = clamp(s.life / s.maxLife, 0, 1);

  /* ---- 溜溜球：一根绳 + 一个转起来的盘。绳子从人身上出去，这条线是"特色"本身 ---- */
  if (s.kind === "yoyo") {
    const u = s.u;
    g.globalAlpha = 1;
    g.strokeStyle = "#FFF3D6";
    g.lineWidth = 2.2;
    g.lineCap = "round";
    g.beginPath();
    if (u && !u.dead) {
      g.moveTo(u.x + s.dir * 14, u.y - 30);
      g.quadraticCurveTo((u.x + s.x) / 2, Math.min(u.y - 30, s.y) - 16, s.x, s.y);
    }
    g.stroke();

    g.save();
    g.translate(s.x, s.y);
    g.rotate(s.spin);
    g.fillStyle = "#FFC94E";
    g.beginPath();
    g.arc(0, 0, s.r, 0, 6.283);
    g.fill();
    g.strokeStyle = COL.outline;
    g.lineWidth = 2.4;
    g.stroke();
    g.fillStyle = "#FF8A3C";
    g.beginPath();
    g.arc(0, 0, s.r * 0.42, 0, 6.283);
    g.fill();
    g.strokeStyle = "rgba(255,255,255,.85)";
    g.lineWidth = 1.6;
    g.beginPath();
    g.moveTo(-s.r * 0.8, 0);
    g.lineTo(s.r * 0.8, 0);
    g.stroke();
    g.restore();
    return;
  }

  /* ---- 音波：一团往前推的弧。外圈张得越开，读起来才是"锥"不是"圈" ---- */
  if (s.kind === "wave") {
    const dir = s.dir || 1;
    const fade = clamp(k * 1.6, 0, 1);
    g.lineCap = "round";
    for (let i = 0; i < 3; i++) {
      const rr2 = s.r * (0.46 + i * 0.26);
      const wide = 0.52 + i * 0.16;
      g.lineWidth = 6.4 - i * 1.5;
      g.globalAlpha = fade * (0.95 - i * 0.24);
      g.strokeStyle = s.color;
      g.beginPath();
      if (dir > 0) g.arc(s.x, s.y, rr2, -wide, wide);
      else g.arc(s.x, s.y, rr2, Math.PI - wide, Math.PI + wide);
      g.stroke();
    }
    // 波心一点白：没有它，三圈弧在浅色背景上会糊成一片
    g.globalAlpha = fade * 0.85;
    g.fillStyle = "#FFFFFF";
    g.beginPath();
    g.arc(s.x - dir * s.r * 0.18, s.y, 4.6, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
    return;
  }

  /* ---- 飞刀：一把转着飞的刀。刀尖在前、柄在后，转起来才像"丢出去" ---- */
  if (s.kind === "knife") {
    g.globalAlpha = 1;
    g.save();
    g.translate(s.x, s.y);
    g.rotate(s.spin);

    // 拖影：高速旋转的东西必须有轨迹，否则看起来只是"一个东西在飘"
    g.globalAlpha = 0.28;
    g.strokeStyle = s.color;
    g.lineWidth = 3;
    g.lineCap = "round";
    g.beginPath();
    g.arc(0, 0, 16, -2.2, -0.9);
    g.stroke();
    g.globalAlpha = 1;

    // 刀身
    g.fillStyle = s.color;
    g.beginPath();
    g.moveTo(24, 0);
    g.quadraticCurveTo(8, -7.5, -8, -5);
    g.lineTo(-12, 0);
    g.lineTo(-8, 5);
    g.quadraticCurveTo(8, 7.5, 24, 0);
    g.fill();
    g.strokeStyle = COL.outline;
    g.lineWidth = 2.2;
    g.stroke();

    // 磨出来的一道白
    g.strokeStyle = "rgba(255,255,255,.92)";
    g.lineWidth = 1.7;
    g.beginPath();
    g.moveTo(18, -1.2);
    g.lineTo(-6, -2.2);
    g.stroke();

    // 刀柄
    g.fillStyle = "#7A5230";
    rr(g, -24, -3.6, 13, 7.2, 3);
    g.fill();
    g.strokeStyle = COL.outline;
    g.lineWidth = 1.8;
    g.stroke();
    g.restore();
    return;
  }

  /* ---- 坚果：贴地滚，带旋转的纹路 ---- */
  if (s.kind === "nut") {
    g.globalAlpha = 1;
    g.save();
    g.translate(s.x, s.y);
    g.rotate(s.spin);
    g.fillStyle = s.color;
    g.beginPath();
    g.arc(0, 0, s.r, 0, 6.283);
    g.fill();
    g.strokeStyle = COL.outline;
    g.lineWidth = 2.4;
    g.stroke();
    g.strokeStyle = "rgba(255,236,196,.8)";
    g.lineWidth = 2;
    g.beginPath();
    g.arc(0, 0, s.r * 0.62, -0.6, 1.9);
    g.stroke();
    g.beginPath();
    g.arc(0, 0, s.r * 0.62, 2.1, 4.4);
    g.stroke();
    g.restore();
    return;
  }

  /* ---- 萝卜炮：一颗带绿叶的胡萝卜，翻滚 ---- */
  if (s.kind === "lob") {
    g.globalAlpha = 1;
    g.save();
    g.translate(s.x, s.y);
    g.rotate(s.spin);
    g.fillStyle = s.color;
    g.beginPath();
    g.moveTo(-11, -6);
    g.quadraticCurveTo(4, -11, 12, 0);
    g.quadraticCurveTo(4, 11, -11, 6);
    g.closePath();
    g.fill();
    g.strokeStyle = COL.outline;
    g.lineWidth = 2;
    g.stroke();
    g.fillStyle = "#5FBF5A";
    g.beginPath();
    g.ellipse(-13, -4, 6, 3.4, -0.5, 0, 6.283);
    g.ellipse(-13, 4, 5, 3, 0.5, 0, 6.283);
    g.fill();
    g.restore();
    return;
  }

  /* ---- 影分身：三只小狐影平推。要有尖耳和尖吻，否则读起来只是三个白团 ---- */
  if (s.kind === "shadow") {
    const a = clamp(k * 1.5, 0, 1);
    const dir = s.dir || 1;
    const drawFox = (cx, cy, sc, alpha, body) => {
      g.globalAlpha = alpha;
      g.fillStyle = body;
      g.beginPath();
      g.ellipse(cx, cy, s.r * 1.0 * sc, s.r * 0.72 * sc, 0, 0, 6.283);
      g.fill();
      // 尖吻（朝飞行方向）
      g.beginPath();
      g.moveTo(cx + dir * s.r * 0.7 * sc, cy - s.r * 0.16 * sc);
      g.lineTo(cx + dir * s.r * 1.7 * sc, cy + s.r * 0.10 * sc);
      g.lineTo(cx + dir * s.r * 0.66 * sc, cy + s.r * 0.42 * sc);
      g.closePath();
      g.fill();
      // 两只尖耳
      for (const sd of [-1, 1]) {
        g.beginPath();
        g.moveTo(cx + sd * s.r * 0.62 * sc - dir * s.r * 0.1 * sc, cy - s.r * 0.30 * sc);
        g.lineTo(cx + sd * s.r * 0.42 * sc - dir * s.r * 0.2 * sc, cy - s.r * 1.24 * sc);
        g.lineTo(cx + sd * s.r * 0.12 * sc - dir * s.r * 0.2 * sc, cy - s.r * 0.52 * sc);
        g.closePath();
        g.fill();
      }
      // 一条甩起来的尾巴
      g.strokeStyle = body;
      g.lineWidth = s.r * 0.34 * sc;
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(cx - dir * s.r * 0.85 * sc, cy + s.r * 0.1 * sc);
      g.quadraticCurveTo(cx - dir * s.r * 1.6 * sc, cy - s.r * 0.5 * sc,
                         cx - dir * s.r * 1.35 * sc, cy - s.r * 1.0 * sc);
      g.stroke();
    };

    // 拖尾
    for (let t = 3; t >= 1; t--) {
      drawFox(s.x - dir * t * 16, s.y, 1 - t * 0.10, a * 0.16 * (4 - t) / 3, s.color);
    }
    // 本体
    drawFox(s.x, s.y, 1, a, "#EDE6FF");
    g.globalAlpha = a;
    // 眼睛
    g.fillStyle = "#3B2E6B";
    g.beginPath();
    g.arc(s.x + dir * s.r * 0.28, s.y - s.r * 0.12, s.r * 0.13, 0, 6.283);
    g.arc(s.x + dir * s.r * 0.62, s.y - s.r * 0.10, s.r * 0.13, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
    return;
  }

  // 兜底：一个带拖尾的圆
  g.globalAlpha = clamp(k * 1.6, 0, 1);
  g.fillStyle = s.color;
  g.beginPath();
  g.arc(s.x, s.y, s.r * (0.8 + k * 0.2), 0, 6.283);
  g.fill();
  g.globalAlpha = 1;
}

/* ============================================================================
   16. 绘制：HUD 与选择界面
   ========================================================================== */

/* ----------------------------------------------------------------------------
   目标进度 / 判定
   ---------------------------------------------------------------------------- */

function _goalBase() {
  const st = curStage();
  const done = S.killed >= S.total;
  if (st.goal === "limit") {
    const left = Math.max(0, st.ballLimit - S.stat.made);
    return {
      text: "球 " + S.stat.made + " / " + st.ballLimit + (done ? "" : " · 已清 " + S.killed + "/" + S.total),
      frac: S.stat.made / st.ballLimit, done,
      /* cells/filled = HUD 画"一颗豆子代表一颗球"用。
       * 只给计数类目标（总数 ≤14、玩家能一眼数清）—— 收成 70 份画 70 颗粒子
       * 是噪点不是信息，那些关继续走连续条（cells 留空）。 */
      cells: st.ballLimit, filled: Math.min(S.stat.made, st.ballLimit),
    };
  }
  if (st.goal === "chain") {
    return {
      text: "最大 x" + S.stat.maxHolds + " / " + st.chain + (done ? "" : " · 已清 " + S.killed + "/" + S.total),
      frac: S.stat.maxHolds / st.chain,
      done: S.stat.maxHolds >= st.chain,
    };
  }
  if (st.goal === "bank") {
    return {
      text: "落袋 " + S.stat.bankHolds + " / " + st.bank + (done ? "" : " · 已清 " + S.killed + "/" + S.total),
      frac: S.stat.bankHolds / st.bank,
      done: S.stat.bankHolds >= st.bank,
      cells: st.bank, filled: Math.min(S.stat.bankHolds, st.bank),
    };
  }
  if (st.goal === "tour") {
    /* 赛道关的进度**只数走完的球**。这里不能顺手把 S.stat.toured 换成
       S.stat.banked —— 落袋数包括"没走完就滚进营地"的那些，
       拿它当进度条的话，玩家会看到进度条往前走、却一直通不了关。 */
    const need = st.tourNeed || 1;
    return {
      text: "走完赛道 " + S.stat.toured + " / " + need + (done ? "" : " · 已清 " + S.killed + "/" + S.total),
      frac: S.stat.toured / need,
      done: S.stat.toured >= need,
      cells: need, filled: Math.min(S.stat.toured, need),
    };
  }
  if (st.goal === "collect") {
    return {
      text: "收成 " + S.food + " / " + st.collect + (done ? "" : " · 已清 " + S.killed + "/" + S.total),
      frac: S.food / st.collect,
      done: S.food >= st.collect,
    };
  }
  // 两种"不许犯错"的目标：数字越小越好，进度条反着走
  if (st.goal === "intact") {
    return {
      text: "崩开 " + S.stat.burst + " 次 · 一次都不行" + (done ? "" : " · 已清 " + S.killed + "/" + S.total),
      frac: S.stat.burst === 0 ? 1 : 0,
      done: S.stat.burst === 0,
    };
  }
  if (st.goal === "nohit") {
    return {
      text: "挨打 " + S.stat.hits + " 次 · 一次都不行" + (done ? "" : " · 已清 " + S.killed + "/" + S.total),
      frac: S.stat.hits === 0 ? 1 : 0,
      done: S.stat.hits === 0,
    };
  }
  // 两头都显式化：左边"送走几只 / 总共几只"，右边"造了几颗 / 标准几颗"。
  //
  // 原来写的是 `"剩余 N 只 · 球 " + S.stat.made` —— `S.stat.made` 是**累加器**
  // （makeBallFrom 里 `S.stat.made++`），也就是"已经造了几颗"，不是剩余球数。
  // 玩家 100% 读成"我还剩 6 颗球"，然后一直不敢造球。这是纯读数错误。
  //
  // 同时把总数摆到屏幕上：波次补位（场上 ≤1 只就刷下一波）会让场上人数
  // 反复回升，玩家读成"打完反而变多"。**总数固定这件事一旦可见，错觉就没** ——
  // 这一条比加任何动画都管用。
  return {
    text: "已送 " + S.killed + " / " + S.total + " · 造球 " + S.stat.made + " / " + st.par.made,
    // `inner` 是叠在进度条里侧的字。只有"按比例推进"的目标给，
    // 其他目标（限球/连锁/落袋…）的 frac 含义不同，叠上去就是错的。
    inner: S.killed + " / " + S.total,
    frac: S.killed / Math.max(1, S.total), done,
    // 一颗豆子 = 一只被送走的小怪。总数就是 S.total，是这关真实的人数。
    cells: S.total, filled: Math.min(S.killed, S.total),
  };
}

/* 目标进度 + 赛道约束。
 *
 * 赛道**不是第七种目标**，它是给已有目标加的一条空间条件 ——
 * "落袋 5 只"和"走完这条路线"是两件事，不该互相替代。
 * 做成附加约束之后，任何一关都能挂一条路线要求，而不用为它单开一种 goal。
 * （第 5 屏就是这么用的：bank 5 照旧，但必须有两颗球是从塔上滚下来的。） */
function goalProgress() {
  const r = _goalBase();
  if (TOUR.length) {
    const need = curStage().tourNeed || 1;
    r.text += " · 赛道 " + S.stat.toured + "/" + need;
    /* 赛道没走完就不给"已完成"。不给这一行的话，主目标先满、进度条全绿、
       玩家以为通关了，实际还差路线 —— 那种"明明满了却过不去"是最伤人的。 */
    if (S.stat.toured < need) r.done = false;
  }
  return r;
}

/** 定宽文字截断。卡片宽度是写死的，brief 长短不一，溢出去会压到卡片外面。 */
function fitText(g, txt, maxW) {
  if (g.measureText(txt).width <= maxW) return txt;
  let s = txt;
  while (s.length > 1 && g.measureText(s + "…").width > maxW) s = s.slice(0, -1);
  return s + "…";
}

/** 结算评价：时间达标 +1 分，球数达标 +1 分。2 分 S，1 分 A，0 分 B */
function rate() {
  const st = curStage();
  let sc = 0;
  if (S.playT <= st.par.time) sc++;
  if (S.stat.made <= st.par.made) sc++;
  return sc >= 2 ? "S" : sc === 1 ? "A" : "B";
}

/* 关卡轨迹：顶上一排点。推关的「进度感」全靠这一条 ——
   没有它，玩家打第 5 关和打第 1 关的感觉是一样的。 */
function drawTrail(g) {
  /* ---- 顶部：产地 · 屏序 / 本章屏数 ----
   *
   * **原来的「第 10 / 27 关」是"关卡无脑搞那么长"这个抱怨的真正来源。**
   * 27 是内部数字：玩家站在枯木坡第 1 屏，却被告知这是"第 10 关" ——
   * 他读到的是"前面还有 26 个长得一样的东西"，而不是"我刚进第二章"。
   *
   * 章的信息一直都在（`FACTIONS` 三产地），只是从来没画到 HUD 上。
   * 现在标题报「枯木坡 · 1 / 9」，进度点也只画**当前产地那 9 颗** ——
   * 这两件事一起做才成立：只改文案不改点，玩家看到 27 颗点仍然是一条直线。
   *
   * 顺带解决的硬 bug：27 颗点 × 22px = 572px，横跨 x 194…766，
   * 而目标卡左边界是 672 —— **重叠 94px**（截图上右边的点被奶白卡片盖掉）。
   * 9 颗只跨 176px，居中在 392…568，离卡片还有 104px 余量。
   */
  const CH = chapterOfStage(S.stage);
  const n = CH.count;
  const gap = 22;
  const cx = W / 2;
  const total = (n - 1) * gap;

  g.textAlign = "left";
  g.textBaseline = "middle";
  g.font = "bold 13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.lineWidth = 3.4;
  g.strokeStyle = "rgba(6,20,14,.55)";
  /* 「产地 · 第 N 屏 + 关卡名」。**不写「N / 本章屏数」**（2026-10-26
     用户：「我不想暴露最大关卡 只显示当前进度即可」）—— 本章一共几屏
     是内部数字，报进度不报总数。
     深巢：层号是另一条轴，只报「巢室 · 第 N 层」，不拼屏名
     （层名本身就是"第 N 层"，拼起来是"第 7 层 第 7 层"）。
     **巢室名必须写在这里**（2026-10-27）：玩家要能一眼看出"这层是卵房、
     上上层的蛛巢"，否则五套巢室在他眼里只是"怪换了个花样"。 */
  /* 词条也挂在 HUD 上（只报前两条 + 余量）。
     完整列表在出征页的词条看板上 —— 但下了三层以后玩家已经想不起
     "现在到底有哪些规矩"，而这一行是他**不用切界面**就能看到的唯一一处。 */
  const modsTag = (S.nest && S.nest.mods && S.nest.mods.length)
    ? (function () {
        const names = S.nest.mods.map(function (m) { return m.name; });
        /* 分隔符必须是**顿号**，不能是空格（2026-10-27 截图救回）：
           12px 下一个空格只有 3px，"沉石 厚甲"渲出来是"沉石厚甲"，
           读成一条叫"沉石厚甲"的词条。顿号是中文里的并列符，
           也压得住"菌圃 · 第 26 层"那一层用"·"分隔的口径。 */
        return "  ·  " + names.slice(0, 2).join("、")
             + (names.length > 2 ? " +" + (names.length - 2) : "");
      })()
    : "";
  const label = S.nest
    ? (S.nest.brood || "深巢") + " · 第 " + S.nest.depth + " 层" + modsTag
    : CH.name + " · 第 " + (S.stage - CH.from + 1) + " 屏   " + curStage().name;

  /* 波次：一关 2~3 波，最后一波是 BOSS。没有这一行，玩家不知道"还剩多久"。
   *
   * **两块一起量、一起居中。** 上一版把关卡名居中、波次钉在 cx+132 ——
   * 关卡名一变长（"泥沼"→"陡坡·顶层推球"），两块之间的缝就忽大忽小，
   * 看起来像两个没对齐的控件。现在按两块的实际宽度算起点。
   */
  const wtxt = "第 " + Math.min(S.wave + 1, WAVES.length) + " / " + WAVES.length + " 波";
  const PAD = 24;
  const w1 = g.measureText(label).width;
  const w2 = g.measureText(wtxt).width;
  const x0 = cx - (w1 + PAD + w2) / 2;

  g.strokeText(label, x0, 22);
  g.fillStyle = "rgba(255,255,255,.94)";
  g.fillText(label, x0, 22);

  g.strokeText(wtxt, x0 + w1 + PAD, 22);
  g.fillStyle = (S.wave >= WAVES.length - 1) ? "#FF9E82" : "rgba(255,255,255,.82)";
  g.fillText(wtxt, x0 + w1 + PAD, 22);

  /* ---- 本趟目标（2026-10-25）----
   * **必须画在战斗里。** 只在结算时说"目标达成"，等于打完才发考卷 ——
   * 玩家没法为了它改打法，那和原来那 6 条一次性任务没有区别。
   * 放第二行、居中小字：它是"约束"，不该抢关卡名的视觉重量。 */
  if (S.tripGoals && S.tripGoals.length) {
    const t = "本趟 · " + S.tripGoals.map(function (id) { return TRIP_CN[id] || id; }).join(" · ");
    g.font = "12px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.lineWidth = 3;
    g.strokeStyle = "rgba(6,20,14,.52)";
    /* y=68 不是 44：44 正好压在关卡进度那排绿点上（截图 `_t-tripHUD` 第一版
       就是"本趟 · 不碰火坑"和五颗绿点叠在一起）。68 在绿点下方 24px，
       底下是中景树冠，有描边读得清。 */
    g.strokeText(t, cx, 68);
    g.fillStyle = "rgba(255,236,190,.92)";
    g.fillText(t, cx, 68);
  }
  g.textAlign = "center";

  const pipOff = artOf("ui-pip");
  const pipOn = artOf("ui-pip-on");

  for (let i = 0; i < n; i++) {
    const x = cx - total / 2 + i * gap;
    const y = 45;
    /* 点的序号是**产地内序号**，评级和"当前屏"必须查全局索引 ——
     * 直接用 i 的话，站在枯木坡第 1 屏（全局 9）会读到 `S.best[0]`，
     * 整排点显示的是苔原的成绩。 */
    const gi = CH.from + i;
    const rk = S.best[gi];
    const done = !!rk;
    const cur = gi === S.stage;

    if (pipOff && pipOn) {
      // 有点/亮点图就贴图。深色底圈必须留着 —— 亮天空主题里，
      // 浅色方块糊在白云上就没了（原代码的圆点也是靠这个底圈才看得见）
      const s = cur ? 16 : 11;
      // 底圈跟着方块走（圆角矩形，不是圆）：形状不一致时读起来像"灰点 + 灰块"两层东西
      rr(g, x - s / 2 - 2, y - s / 2 - 2, s + 4, s + 4, 4.5);
      g.fillStyle = cur || done ? "rgba(20,34,26,.42)" : "rgba(20,34,26,.26)";
      g.fill();
      g.globalAlpha = cur ? 1 : done ? 0.95 : 0.72;
      g.drawImage(done || cur ? pipOn : pipOff, x - s / 2, y - s / 2, s, s);
      g.globalAlpha = 1;
    } else {
      // 深色底圈：亮天空主题里，浅灰点在白云上根本看不见
      g.beginPath();
      g.arc(x, y, (cur ? 6 : 4.2) + 2, 0, 6.283);
      g.fillStyle = "rgba(20,34,26,.38)";
      g.fill();
      g.beginPath();
      g.arc(x, y, cur ? 6 : 4.2, 0, 6.283);
      g.fillStyle = cur ? "#FFE066" : done ? "#B9F06A" : "rgba(255,255,255,.58)";
      g.fill();
    }

    if (cur) {
      g.strokeStyle = "rgba(255,224,102,.55)";
      g.lineWidth = 2.4;
      g.beginPath();
      g.arc(x, y, 10 + Math.sin(S.t * 4) * 1.6, 0, 6.283);
      g.stroke();
    }

    /* ---- 评级色条：每颗点下面一小横 ----
     *
     * 27 颗点只能回答"走了多远"，回答不了"走得怎么样"。评级原来只活在
     * 结算卡上 —— 一闪而过，而且只有当前这一屏。通关之后想刷 S，
     * 屏幕上没有任何地方能看到"哪几屏还是 B"。
     *
     * 为什么不直接把字母写上去：27 个 9px 的字母在 960 宽的屏上是一片噪点，
     * 而且每颗点间距只有 22px，"第 10 屏"的字母会和"第 11 屏"的点黏在一起。
     * 一条 11×3 的色条在同样的间距下不会互相干扰，扫一眼就是一片金色/绿色。
     *
     * 色值不能靠压暗区分 —— B 也得是能读的颜色，它只代表"没打好"。
     * S 金 / A 绿 / B 青灰，和结算卡徽章同一套。 */
    if (done) {
      g.fillStyle = RANK_COLOR[rk] || "rgba(255,255,255,.5)";
      rr(g, x - 5.5, y + 8.5, 11, 2.6, 1.3);
      g.fill();
    }
  }

  /* ---- 下一波 · 常驻预警 ----
   * 波次规则是"场上 ≤1 只就补下一波"（为了不让人赶路）。原来唯一的提示是
   * drawWaveGap 那 1.1 秒的地面三圈 + 一行字 —— 玩家正在盯场面的时候
   * 根本注意不到，读成"我打完反而变多了"（体验评审第 5 条）。
   *
   * 现在从场上剩 2 只开始就挂一个闪烁小标："要来了"这件事是持续的，
   * 不是一个 1 秒的偶发事件。玩家看到它就知道不是打不完，是下一波要来了。
   * 挂在进度点下面（y 63~84），不占卡片也不压关卡名。 */
  const nxWv = WAVES[S.wave + 1] || [];
  if (nxWv.length && S.waveGap <= 0 && S.foes.length <= 2) {
    const bossNext = nxWv.some(sp => sp.foe === "boss");
    const wTxt = bossNext ? "BOSS 要来" : "下一波 " + nxWv.length + " 只";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = "bold 13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    const wW = g.measureText(wTxt).width;
    g.globalAlpha = 0.55 + 0.45 * Math.sin(S.t * 7);
    rr(g, cx - wW / 2 - 9, 63, wW + 18, 21, 10.5);
    g.fillStyle = bossNext ? "rgba(120,30,20,.60)" : "rgba(20,34,26,.50)";
    g.fill();
    g.lineWidth = 3;
    g.strokeStyle = "rgba(6,16,12,.55)";
    g.strokeText(wTxt, cx, 74);
    g.fillStyle = bossNext ? "#FFB08A" : "#FFE9A8";
    g.fillText(wTxt, cx, 74);
    g.globalAlpha = 1;
    g.textAlign = "left";
    g.textBaseline = "middle";
  }
}

/** 下一波预告：地上画三圈扩散的标记 + 一行倒计时。看不见的刷新最气人 */
function drawWaveGap(g) {
  if (S.waveGap <= 0) return;
  const nx = WAVES[S.wave + 1] || [];
  const boss = nx.some(sp => sp.foe === "boss");
  const k = 1 - S.waveGap / (boss ? WAVE_GAP_BOSS : WAVE_GAP);

  g.save();
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.font = "bold 22px 'Microsoft YaHei','PingFang SC',system-ui,sans-serif";
  const txt = boss ? "地面在震…" : "下一波";
  g.strokeStyle = "rgba(8,16,12,.72)";
  g.lineWidth = 4;
  g.strokeText(txt, W / 2, 128);
  g.fillStyle = boss ? "#FFB08A" : "#FFE9A8";
  g.fillText(txt, W / 2, 128);

  // 在每一只即将出现的敌人脚下画一个收缩的圈
  for (const sp of nx) {
    const r = 34 * (1 - k) + 10;
    g.globalAlpha = 0.35 + 0.45 * k;
    g.strokeStyle = boss ? "#FF9A6B" : "#FFE066";
    g.lineWidth = 3;
    g.beginPath();
    g.arc(sp.x, (sp.y || GROUND_Y) - 6, r, 0, 6.283);
    g.stroke();
  }
  g.globalAlpha = 1;
  g.restore();
}

/* ============================================================================
   14b. 面板 / 皮肤
   ============================================================================
   有美术面板图就走"奶油风"，没有就退回原来的深色玻璃风。

   **两套配色写在同一处**：上一版把颜色散在 drawHUD 和结算里各写一遍，
   改了一处忘了另一处，出现过"底是奶白、字是浅绿"（对比度 1.4:1，
   截图上几乎读不出来）。这里只允许通过 hudSkin() 取色。
   ========================================================================== */

/**
 * 九宫格拉伸。四个角不拉伸、四条边单向拉伸、中间双向拉伸。
 * 直接 `drawImage(img, x, y, w, h)` 拉一张圆角面板，圆角会变成椭圆 ——
 * 在 548×500 的结算卡上那四个角一眼就看得出是"被拽开的"。
 *
 * `ds` 是**源图**上的角尺寸。目标角尺寸要按缩放比折算，不能直接用 ds：
 * 上一版写死 `dd = min(ds, w/2, h/2)`，把 583×96 的提示条铺到 236×62 时
 * dd 被算成 31，而 31+31 已经等于 62 —— 中间那一行高度变成 0，
 * 上下两边硬压在一起，圆角挤成一条缝。
 */
function drawNine(g, img, x, y, w, h, ds) {
  const iw = img.width || img.naturalWidth;
  const ih = img.height || img.naturalHeight;
  if (!iw || !ih || w <= 0 || h <= 0) return;
  const k = Math.min(w / iw, h / ih);
  const dd = Math.max(2, Math.min(ds * k, w / 2 - 1, h / 2 - 1));
  const ss = Math.min(ds, iw / 2 - 1, ih / 2 - 1);
  const sx = [0, ss, iw - ss], sw = [ss, iw - ss * 2, ss];
  const dx = [x, x + dd, x + w - dd], dw = [dd, w - dd * 2, dd];
  const sy = [0, ss, ih - ss], sh = [ss, ih - ss * 2, ss];
  const dy = [y, y + dd, y + h - dd], dh = [dd, h - dd * 2, dd];
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 3; c++) {
      if (sw[c] <= 0 || sh[r] <= 0 || dw[c] <= 0 || dh[r] <= 0) continue;
      g.drawImage(img, sx[c], sy[r], sw[c], sh[r], dx[c], dy[r], dw[c], dh[r]);
    }
  }
}

/* ----------------------------------------------------------------------------
   奶白结算卡：**代码画，不贴图**
   ----------------------------------------------------------------------------
   上一版拿 ui-res.png 九宫格铺 620×520，整个卡面摊成了一颗蛋。

   病根不在 ds，在这张资产本身：ui-res.png 的圆角半径实测 **≈150px**
   （图高 420 的 36%）—— 它是一张"泡泡卡"。九宫格的前提是 ds ≥ 圆角半径；
   ds=56 时边条会把这段圆弧**顺着边拉长**，卡面变成"小圆角 + 一条长肩线"，
   就是蛋形。ds 提到 150 能让形状忠实，但圆角会变成 189px，读作胶囊。
   结论：这张资产只能在它自己的 524×420 上待着，一变形就没救。

   所以按 26px 圆角自己画。色值**全部取自资产**，不另起一套配色：
     顶 #FFFCFB → 中 #FBF8ED → 底 #F3E9D6，描边 #754E2D，
     另外资产顶部有一道 1.5px 的高光、底部有一圈内阴影 —— 这两笔是"纸感"的来源，
     少了它卡面会变成一块纯色塑料。
   -------------------------------------------------------------------------- */
function creamCard(g, x, y, w, h, r) {
  const R = r === undefined ? 26 : r;

  // 投影：偏下 6px、不扩散，让卡"坐在"压暗层上而不是浮着
  g.fillStyle = "rgba(24,14,6,.26)";
  rr(g, x + 2, y + 7, w, h, R);
  g.fill();

  const gr = g.createLinearGradient(0, y, 0, y + h);
  gr.addColorStop(0, "#FFFCFB");
  gr.addColorStop(0.34, "#FBF8EE");
  gr.addColorStop(0.80, "#F8F0DF");
  gr.addColorStop(1, "#F3E9D6");
  g.fillStyle = gr;
  rr(g, x, y, w, h, R);
  g.fill();

  // 顶部高光：只在圆角内沿上方 1/3 走，长度收在中间，不顶到两端圆角
  g.save();
  g.beginPath();
  rr(g, x, y, w, h, R);
  g.clip();
  const hl = g.createLinearGradient(0, y, 0, y + h * 0.30);
  hl.addColorStop(0, "rgba(255,255,255,.85)");
  hl.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = hl;
  g.fillRect(x + R * 0.5, y + 3, w - R, h * 0.30);
  // 底部内阴影：把卡"压"出厚度
  const sh = g.createLinearGradient(0, y + h - 46, 0, y + h);
  sh.addColorStop(0, "rgba(168,136,96,0)");
  sh.addColorStop(1, "rgba(168,136,96,.30)");
  g.fillStyle = sh;
  g.fillRect(x, y + h - 46, w, 46);
  g.restore();

  /* 描边两条：外面一条实棕 #754E2D（3.4px，和 HUD 那套同一支笔），
     里面再压一条 1.2px 的淡棕，作用是**把奶油底和描边分开** ——
     只画一条实棕，深棕直接啃进白面，边缘读作"锯齿"。 */
  g.strokeStyle = "#754E2D";
  g.lineWidth = 3.4;
  rr(g, x + 1.7, y + 1.7, w - 3.4, h - 3.4, Math.max(4, R - 1.7));
  g.stroke();
  g.strokeStyle = "rgba(138,100,64,.42)";
  g.lineWidth = 1.2;
  rr(g, x + 4.4, y + 4.4, w - 8.8, h - 8.8, Math.max(3, R - 4.4));
  g.stroke();
}

/** 画一块面板底：有图贴图（九宫格），没图画原来的半透明圆角。 */
function panelBg(g, key, x, y, w, h, ds, fallbackFill, fallbackRadius) {
  const img = artOf(key);
  const r = fallbackRadius === undefined ? 14 : fallbackRadius;

  /* 贴纸三件套：投影 → 面板 → 深棕描边。
   *
   * 之前只贴了一张奶白图，图本身的边是 1~2px 淡棕，落在绿草地上"没有轮廓" ——
   * 截图里那块 UI 读起来像网页里的 card，不像游戏里的牌子。
   * Q 版卡通的识别特征就是**深色粗描边**：只加这一圈，东西立刻从"控件"变"贴纸"。
   */
  g.fillStyle = "rgba(26,16,8,.22)";
  rr(g, x + 1, y + 4, w, h, r);
  g.fill();

  let okArt = false;
  if (img) {
    drawNine(g, img, x, y, w, h, ds);
    okArt = true;
  } else {
    g.fillStyle = fallbackFill || "rgba(12,26,20,.72)";
    rr(g, x, y, w, h, r);
    g.fill();
  }

  /* 描边按概念图重定过：`#754E2D`、3.4px。
   *
   * 上一版是 2.2px / rgba(92,60,34,.40) —— 半透明的细线。在奶白底上还看得见，
   * 一落到绿草地/暖黄天空上就糊进背景，"牌子"退化成"控件"。
   * 概念稿（concept/Game_UI_kit_sheet_*.png）里的面板边是**实色深棕 + 3~4px**，
   * 尺寸比 1:100 左右 —— 960 宽的画面正好对应 3.4px。 */
  g.strokeStyle = img ? "#754E2D" : "rgba(255,255,255,.14)";
  g.lineWidth = img ? 3.4 : 1.5;
  rr(g, x + 1.7, y + 1.7, w - 3.4, h - 3.4, Math.max(6, r - 1.7));
  g.stroke();
  return okArt;
}

/** 取当前配色。cream = 奶油面板图到位。 */
function hudSkin() {
  const cream = !!artOf("ui-tip");
  if (cream) {
    return {
      cream: true,
      ink: "#4A3524",          // 主文字 / 深棕
      ink2: "rgba(74,53,36,.70)",
      ink3: "rgba(74,53,36,.46)",
      hi: "#A85E20",           // 强调（目标名、关卡名）
      good: "#3F7D24",
      warn: "#B06A2C",
      bad: "#B0453A",
      barBg: "rgba(120,92,64,.20)",
      barOn: "#E0A23C",
      barDone: "#5FA53A",
    };
  }
  return {
    cream: false,
    ink: "#EAF6E2",
    ink2: "rgba(200,230,200,.72)",
    ink3: "rgba(190,220,190,.45)",
    hi: "#FFE9B0",
    good: "#B9F06A",
    warn: "#FFD86B",
    bad: "#FF9E8E",
    barBg: "rgba(255,255,255,.13)",
    barOn: "#8ED6F0",
    barDone: "#B9F06A",
  };
}

function drawHUD(g) {
  const p = S.p;
  if (!p) return;
  const H = HEROES[p.hero];

  drawTrail(g);
  drawWaveGap(g);

  // BOSS 层数条：贴在最上面，和关卡名分开一层 ——
  // BOSS 战中玩家最需要知道的是"还差几层"，不是自己还有几颗心。
  const boss = S.foes.find(f => f.isBoss && !f.dead);
  if (boss) {
    const cm = boss.cm || 3;
    const bw2 = 300, bx = W / 2 - bw2 / 2, by = 66;
    g.fillStyle = "rgba(12,8,22,.62)";
    rr(g, bx - 8, by - 7, bw2 + 16, 22, 11);
    g.fill();
    g.fillStyle = "rgba(255,255,255,.12)";
    rr(g, bx, by, bw2, 8, 4);
    g.fill();
    const k = clamp(boss.coat / cm, 0, 1);
    g.fillStyle = "#9BE86E";
    rr(g, bx, by, Math.max(5, bw2 * k), 8, 4);
    g.fill();
    // 每 3 层一道刻度：告诉玩家"再糊 3 层就变球"
    g.strokeStyle = "rgba(10,20,12,.55)";
    g.lineWidth = 2;
    for (let i = 3; i < cm; i += 3) {
      const px = bx + bw2 * (i / cm);
      g.beginPath(); g.moveTo(px, by - 1); g.lineTo(px, by + 9); g.stroke();
    }
    g.font = "bold 12px 'Microsoft YaHei','PingFang SC',system-ui,sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.strokeStyle = "rgba(6,10,20,.7)";
    g.lineWidth = 3;
    const bt = "苔原巨兽 · 壳 " + boss.coat + " / " + cm;
    g.strokeText(bt, W / 2, by + 24);
    g.fillStyle = "#FFE6C8";
    g.fillText(bt, W / 2, by + 24);
  }

  // 左上：角色 + 心
  const K = hudSkin();
  panelBg(g, "ui-tip", 16, 14, 236, 88, 40, "rgba(12,26,20,.72)", 14);

  // 头像：有美术圆头像就贴，没图就画代码脸
  const av = artOf("head-" + H.id);
  const ring = artOf("ui-ring");
  if (ring) {
    // 徽章环：外圈一圈描边，把头像从奶油底上"抠"出来
    g.drawImage(ring, 26 - 3, 23 - 3, 50, 50);
  }
  g.save();
  g.beginPath();
  g.arc(48, 45, 22, 0, 6.283);
  g.clip();
  if (av) {
    g.drawImage(av, 26, 23, 44, 44);
  } else {
    g.fillStyle = H.c1;
    g.fillRect(26, 23, 44, 44);
  }
  g.restore();
  if (!ring) {
    g.strokeStyle = av ? "rgba(255,255,255,.55)" : H.c3;
    g.lineWidth = 2;
    g.beginPath();
    g.arc(48, 45, 22, 0, 6.283);
    g.stroke();
  }
  if (!av) drawEyes(g, 48, 44, 7, 2.6, 1, false);

  g.fillStyle = K.ink;
  g.font = "bold 16px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.fillText(H.name, 78, 36);
  g.font = "12px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.fillStyle = K.ink2;
  g.fillText(H.tag, 78, 52);

  // 心
  for (let i = 0; i < p.maxHp; i++) {
    const hx = 168 + i * 20, hy = 45;
    const on = i < p.hp;
    g.fillStyle = on ? "#E85466" : (K.cream ? "rgba(120,92,64,.22)" : "rgba(255,255,255,.16)");
    g.beginPath();
    g.moveTo(hx, hy + 7);
    g.bezierCurveTo(hx - 11, hy - 2, hx - 6, hy - 11, hx, hy - 5);
    g.bezierCurveTo(hx + 6, hy - 11, hx + 11, hy - 2, hx, hy + 7);
    g.fill();
  }

  /* ---------------- 肚子（卡片第二行） ----------------
   *
   * **这一条以前是不存在的。** 肚子的三档只体现在两处看不见的地方：
   * 跑不动时的"跑不动…"（只在按 K 的那一瞬）和眼睛下垂的几像素。
   * 于是"我该收工了吗"是玩家算不出来的 —— 他得记住自己打了第几关。
   *
   * 两个刻度（30 / 70）比填充本身重要：没有刻度，这条只读成"还剩多少"；
   * 有了刻度，它才读成"我现在在哪一档、离下一档还有多远"。
   *
   * 颜色只标一件事：**七分饱是金色的**。金色在这套 UI 里一直等于"好"，
   * 于是"别吃太饱"这条规则不用写一个字。
   */
  {
    const tier = bellyTier();
    const bcol = ["#E06A4E", "#F5B93C", "#8FBF5A"][tier];
    const bx0 = 52, bw0 = 150, by0 = 80, bh0 = 7;

    g.textAlign = "left";
    g.textBaseline = "middle";
    g.fillStyle = K.ink3;
    g.font = "10.5px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.fillText("肚子", 26, by0);

    // 槽
    g.fillStyle = K.cream ? "rgba(122,92,60,.22)" : "rgba(255,255,255,.16)";
    rr(g, bx0, by0 - bh0 / 2, bw0, bh0, bh0 / 2);
    g.fill();
    // 填充
    const k = clamp(S.belly / 100, 0, 1);
    if (k > 0.01) {
      g.fillStyle = bcol;
      rr(g, bx0, by0 - bh0 / 2, Math.max(bh0, bw0 * k), bh0, bh0 / 2);
      g.fill();
    }
    // 两个档位刻度：30 / 70
    g.strokeStyle = K.cream ? "rgba(60,40,24,.42)" : "rgba(20,34,26,.55)";
    g.lineWidth = 1.4;
    for (const t of [0.30, 0.70]) {
      const tx = bx0 + bw0 * t;
      g.beginPath();
      g.moveTo(tx, by0 - bh0 / 2 - 1.5);
      g.lineTo(tx, by0 + bh0 / 2 + 1.5);
      g.stroke();
    }

    g.textAlign = "right";
    g.fillStyle = bcol;
    g.font = "bold 10.5px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.fillText(bellyWord(), 246, by0);
    g.textAlign = "left";
  }

  /* ---------------- 目标卡（右上） ----------------
   *
   * 内容四段，纵向四条基线（GOAL_ROW）：
   *   ① 玩家语言的目标名（`title`，不是 `name`）+ 手上的口粮 + 倒数几句
   *   ② 一句能照着做的说明（往哪推、推到哪）
   *   ③ **一颗豆子 = 一只小怪** 的进度阵列
   *   ④ 读数带：用时 / 用球 / 本关奖励
   *
   * ③ 是上一版留下的核心：一条连续填充条、条内印 10px 的字，
   * "已送 4 / 12" 是这一局唯一的目标读数却被压进 14px 高的胶囊里，
   * 玩家得凑近才读得出。拆成十几颗豆子之后，"还剩几个空圈"是扫一眼就有的答案。
   *
   * **尺寸从 272×168 收到 300×96 是一次纠正，不是缩水。** 上一版那句
   * "顶到 y=182 也不挡东西"是错的：它只算了关卡名，没算**关卡几何**。
   * 第 8 屏「双塔」的台面在 y=156、x660~860，玩家站在那上面头顶 ≈116，
   * 整只被卡片盖住。27 屏扫下来右半最高台面就是 156，所以把下沿压到 110
   * 就彻底安全 —— 具体推理见文件上方 GOAL_CARD 那段。
   */
  panelBg(g, "ui-cream", GOAL_CARD.x, GOAL_CARD.y, GOAL_CARD.w, GOAL_CARD.h,
          GOAL_CARD.ds, "rgba(12,26,20,.72)", 14);

  const GX = GOAL_CARD.x + 14, GW = GOAL_CARD.w - 28;
  const pr = goalProgress();

  // ① 目标名（玩家语言）+ 手上的口粮，同一行
  g.textAlign = "left";
  g.textBaseline = "middle";
  g.fillStyle = K.hi;
  g.font = "bold 17px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  const goalTitle = curGoal().title || curGoal().name;
  g.fillText(goalTitle, GX, GOAL_ROW.title);
  const gtw = g.measureText(goalTitle).width;

  /* 口粮紧跟在目标名右边（不是钉在卡片右端）。
   * 卡片右端要留给「还差 12 只」那句 —— 两个都钉右端就会打架，
   * 而"我手上还有几份口粮"和"目标要几份"本来就该挨着读。 */
  const coinArt = artOf("ui-coin");
  const coinTxt = "" + S.food;
  g.font = "bold 13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  const coinTxtW = g.measureText(coinTxt).width;
  const coinX = GX + gtw + 13;
  if (coinArt) {
    g.drawImage(coinArt, coinX, GOAL_ROW.title - 7.5, 15, 15);
  } else {
    g.fillStyle = "#FFD86B";
    g.beginPath();
    g.arc(coinX + 7.5, GOAL_ROW.title, 6.5, 0, 6.283);
    g.fill();
  }
  g.fillStyle = K.hi;
  g.fillText(coinTxt, coinX + 19, GOAL_ROW.title);

  // ② 说明。fitText 兜底：七套 brief 长短不一，最长那句 206.7px / 可用 272
  g.fillStyle = K.ink2;
  g.font = "11px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.fillText(fitText(g, curGoal().brief(curStage(), S.total), GW), GX, GOAL_ROW.brief);

  /* ③ 进度：能数清的关走豆子，数不清的关（收成 70 份）走连续条
   *
   * BY 从 72 提到 66、BH 从 14 收到 11 —— 卡片整体压到 96 高（见 GOAL_CARD
   * 那段注释），四条基线之间只剩 18px。豆子那条路径不受影响
   * （豆心在 BY+1、半径 5.8，上沿 61.2 下沿 72.8，夹在 48 和 88 之间），
   * 连续条的槽变成 11 高：`pr.inner` 那条 10px 的字本来就永远不成立
   * （goalProgress 从来没有返回过 inner），所以没有字号问题。 */
  const BX = GX, BY = GOAL_ROW.bar, BW = GW, BH = 11;
  if (pr.cells > 0) {
    /* 一颗豆子 = 一只小怪（或一颗球）。**固定豆径、整体居中**：
     * 按 N 均分宽度会让 8 只的关豆子散得像省略号、14 只的关挤成一串珠子。
     * 豆径写死 5.2，间距上限 20 —— 少的时候居中排，多的自动收窄。 */
    const n = Math.min(pr.cells, 16);
    const dr = 5.8;
    const step = Math.min(21, (BW - dr * 2) / Math.max(1, n - 1));
    const totalW = dr * 2 + step * (n - 1);
    const x0 = BX + (BW - totalW) / 2 + dr;
    for (let i = 0; i < n; i++) {
      const dx = x0 + i * step;
      const on = i < pr.filled;
      // 底 + 描边 + 高光三层。只填一个实心圆的话，在奶油底上读作"一排点"，
      // 分不出"已送 / 未送"；描边一给，未送的那几颗变成"空圈"，对比立刻就出来。
      g.fillStyle = on ? "#F5B93C" : (K.cream ? "rgba(122,92,60,.34)" : "rgba(255,255,255,.20)");
      g.beginPath();
      g.arc(dx, BY + 1, dr, 0, 6.283);
      g.fill();
      g.strokeStyle = on ? "#8A5208" : (K.cream ? "rgba(122,92,60,.62)" : "rgba(255,255,255,.34)");
      g.lineWidth = on ? 1.9 : 1.3;
      g.beginPath();
      g.arc(dx, BY + 1, dr, 0, 6.283);
      g.stroke();
      if (on) {
        g.fillStyle = "rgba(255,255,255,.66)";
        g.beginPath();
        g.arc(dx - dr * 0.30, BY + 1 - dr * 0.34, dr * 0.34, 0, 6.283);
        g.fill();
      }
    }
  } else {
    // 连续条（收成 / 连锁 / 零崩 / 无伤）：这些目标的 frac 不是"数了几只"，
    // 画豆子只会骗人，所以保留一条连续填充。
    const progArt = artOf("ui-prog");
    if (progArt) {
      g.drawImage(progArt, BX, BY, BW, BH);
    } else {
      g.fillStyle = K.cream ? "rgba(122,92,60,.55)" : "rgba(255,255,255,.20)";
      rr(g, BX, BY, BW, BH, BH / 2);
      g.fill();
    }
    g.fillStyle = K.cream ? "rgba(96,66,40,.52)" : "rgba(255,255,255,.16)";
    rr(g, BX + 3, BY + 3, BW - 6, BH - 6, (BH - 6) / 2);
    g.fill();
    if (pr.frac > 0) {
      g.fillStyle = pr.done ? K.barDone : K.barOn;
      rr(g, BX + 3, BY + 3, Math.max(5, (BW - 6) * clamp(pr.frac, 0, 1)), BH - 6, (BH - 6) / 2);
      g.fill();
    }
    if (pr.inner) {
      g.textAlign = "center";
      g.font = "bold 10px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
      g.lineWidth = 3;
      g.strokeStyle = "rgba(34,22,10,.62)";
      g.strokeText(pr.inner, BX + BW / 2, BY + BH / 2 + 0.5);
      g.fillStyle = "#FFF8E8";
      g.fillText(pr.inner, BX + BW / 2, BY + BH / 2 + 0.5);
      g.textAlign = "left";
    }
  }

  /* ---- 赛道计数：画在进度条**右侧**的空白里 ----
   *
   * 这张卡片只有四条基线（title / brief / bar / cond），底下两行已被
   * "倒数 + 用时 + 用球 + 奖励"占满，塞不下第五行。
   * 而赛道恰恰是这一屏**唯一的新东西** —— 不显示的话，玩家看到的就是
   * "一个普通的落袋关，地上多了几块发光的地板"，根本不知道要走。
   *
   * 位置是量出来的：豆子 5 颗、dr=5.8、step=21 → 总宽 142，居中后右端在
   * BX+207；卡片可用宽 272，`赛道 0/2` 用 10px 字约 54 宽，
   * 右对齐到 BX+272 时左端在 BX+218 —— 离豆子 11px，不撞。
   * 超过 16 颗豆子时 step 会自动收窄、右端仍在 BX+207 附近，这条结论不变。 */
  if (TOUR.length) {
    const need = curStage().tourNeed || 1;
    const tDone = S.stat.toured >= need;
    g.textAlign = "right";
    g.textBaseline = "middle";
    g.font = "bold 10px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    // 完成用深绿、未完成用灰绿：这一格不能抢主目标的颜色，它是附加条件
    g.fillStyle = tDone ? "#22785A" : "rgba(62,106,92,.85)";
    g.fillText("赛道 " + S.stat.toured + "/" + need, BX + BW, BY + 5);
    g.textAlign = "left";
    g.textBaseline = "alphabetic";
  }

  /* ④ 倒数 + ⑤ S 的两个条件 + 本关奖励 —— **压成同一行**
   *
   * 卡片从 272×168 收到 300×96 之后，四条基线之间只剩 18px，
   * 原来"倒数一行 / S 条件一行 / 奖励一行"的三行纵向排法放不下了。
   *
   * 但这不是"被逼着挤在一起"，是本来就该在一起：
   *   倒数   = 主目标还差多少
   *   用时/用球 = 拿 S 的两个条件
   *   奖励   = 这一屏打完能挣到什么
   * 四者都是"这一屏的读数"，横向排成一条读数带比纵向堆成表格更扫得快。
   *
   * 宽度实测（真字体量过）：用时 75.6 + 用球 58.3 + 奖励 76，
   * 加上间距 256 < 可用 272 —— 有富余，所以奖励存在时不用缩字。 */
  const pendingInBall = S.killed >= S.total && S.balls.length > 0;
  /* 这句原来叫「把球里剩下的送走！」（117px），收窄后会把口粮挤出去。
   * 改短不是妥协：玩家此刻要做的动作是"把已经在场上的球推过去"，
   * 「把球推去营地！」更短也更像指令。 */
  const leftTxt = pendingInBall
    ? "把球推去营地！"
    : pr.done ? "全送走了 ✓"
    : "还差 " + Math.max(0, S.total - S.killed) + " 只";

  /* 倒数句钉在卡片右端。它和标题、口粮同一行 —— 三者加起来
     102(标题最长) + 13 + 40(口粮) = 155，右端再放 91 的倒数，共 246 < 272。 */
  g.textAlign = "right";
  g.fillStyle = pendingInBall ? "#FFB060" : (pr.done ? K.good : K.ink);
  g.font = (pendingInBall ? "bold " : "") +
    "13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.fillText(fitText(g, leftTxt, 110), GX + GW, GOAL_ROW.title);
  g.textAlign = "left";

  /* 读数带：最底一行。三枚胶囊从左往右排，谁在场谁占位。 */
  {
    const par = curStage().par;
    const reward = stageUnlockReward(S.stage);
    const cy2 = GOAL_ROW.cond;
    const F10 = "bold 10px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    const F11 = "bold 11px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    const PILL_H = 17;
    let x = GX;

    /* 胶囊画法抽成小函数：三枚的口径必须一样，否则读成三种控件。 */
    const pill = (w, fill, dotColor, text, font, textColor, lead) => {
      g.fillStyle = fill;
      rr(g, x, cy2 - PILL_H / 2, w, PILL_H, PILL_H / 2);
      g.fill();
      let tx = x + 9;
      if (dotColor) {
        g.fillStyle = dotColor;
        g.beginPath();
        g.arc(tx, cy2, 3.2, 0, 6.283);
        g.fill();
        tx += 8;
      }
      if (lead) {
        g.save();
        g.beginPath();
        g.arc(tx + 7.5, cy2, 7.5, 0, 6.283);
        g.clip();
        g.drawImage(lead, tx, cy2 - 7.5, 15, 15);
        g.restore();
        tx += 19;
      }
      g.textAlign = "left";
      g.textBaseline = "middle";
      g.font = font;
      g.fillStyle = textColor;
      g.fillText(text, tx, cy2);
      x += w + 6;
    };

    const condStyle = (ok) => ({
      fill: ok ? "rgba(120,178,54,.18)" : "rgba(150,110,80,.13)",
      dot: ok ? "#63A82A" : (K.cream ? "rgba(122,92,60,.42)" : "rgba(255,255,255,.30)"),
      ink: ok ? "#3E7A18" : (K.cream ? "rgba(74,53,36,.56)" : "rgba(220,240,220,.60)"),
    });

    /* ① 用时：绿 = 还在 S 线内 */
    const tOk = S.playT <= par.time;
    const tTxt = "用时 " + Math.floor(S.playT) + " / " + par.time + "s";
    const tSt = condStyle(tOk);
    g.font = F10;
    const tW = g.measureText(tTxt).width + 25;
    pill(tW, tSt.fill, tSt.dot, tTxt, F10, tSt.ink);

    /* ② 用球 */
    const bOk = S.stat.made <= par.made;
    const bTxt = "用球 " + S.stat.made + " / " + par.made;
    const bSt = condStyle(bOk);
    const bW = g.measureText(bTxt).width + 25;
    pill(bW, bSt.fill, bSt.dot, bTxt, F10, bSt.ink);

    /* ③ 本关奖励。**不闪、不动、不弹** —— 奖励是一条"事实"，不是"事件"。
     * 头像圆片不能省：玩家认脸比认字快，而"到家的是谁"本来就是个脸的问题，
     * 只有名字的话，"影狐"对还没见过它的玩家是一个没有形状的词。 */
    if (reward && x + 80 < GX + GW) {
      const rTxt = reward.name + " 到家";
      const hd = artOf("head-" + reward.id);
      g.font = F11;
      const rW = Math.min(GX + GW - x, g.measureText(rTxt).width + (hd ? 34 : 25));
      pill(rW, "rgba(245,185,60,.16)", null, rTxt, F11, "#8A4A18", hd);
    }
    g.textAlign = "left";
    g.textBaseline = "middle";
  }


  // 卡片里不再挂"ESC 回选 · R 重来 · Shift 预测线"。
  // 屏幕底部本来就有那条 8 秒操作提示（含 Shift），两处都说等于都没说 ——
  // 而且它占了卡片最后 20px，把目标卡撑成一个表格。

  // 底部操作提示（前 8 秒）
  if (S.playT < 8) {
    g.globalAlpha = clamp((8 - S.playT) / 3, 0, 1) * 0.82;
    g.textAlign = "center";
    // 奶油风下是浅底，白字看不见 —— 换成深字 + 一条浅底
    if (K.cream) {
      g.fillStyle = "rgba(255,250,238,.80)";
      rr(g, W / 2 - 300, H - 36, 600, 26, 13);
      g.fill();
    }
    g.fillStyle = K.cream ? K.ink : "#E8F6DC";
    g.font = "13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.fillText("← → 移动   ·   空格 跳   ·   J 喷裹   ·   K 撞飞   ·   走进球里推它   ·   Shift 看全部预测线", W / 2, H - 22);
    g.globalAlpha = 1;
  }
}

/* ---------- 门口那间小屋 ---------- */
function drawHut(g, T, open) {
  const WX = 62, WY = 264, WW = 276, WB = 442;

  // 墙：夜色下压暗的深木
  const wg = g.createLinearGradient(0, WY, 0, WB);
  wg.addColorStop(0, "#4A3320");
  wg.addColorStop(1, "#2E1F14");
  g.fillStyle = wg;
  rr(g, WX, WY, WW, WB - WY, 7);
  g.fill();

  // 木板横纹
  g.strokeStyle = "rgba(18,10,6,.30)";
  g.lineWidth = 1.2;
  for (let y = WY + 22; y < WB - 6; y += 26) {
    g.beginPath(); g.moveTo(WX + 3, y); g.lineTo(WX + WW - 3, y); g.stroke();
  }

  // 屋顶：不对称的斜顶，比对称三角更像"自己搭的"
  g.fillStyle = "#1E130C";
  g.beginPath();
  g.moveTo(38, WY + 10);
  g.lineTo(WX + WW * 0.46, 152);
  g.lineTo(366, WY + 10);
  g.closePath();
  g.fill();
  // 月光勾一条边，屋顶才不糊进夜空
  g.strokeStyle = "rgba(176,222,190,.26)";
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(38, WY + 10);
  g.lineTo(WX + WW * 0.46, 152);
  g.stroke();
  // 屋檐
  g.fillStyle = "#2A1B11";
  rr(g, 32, WY + 6, 372, 12, 5);
  g.fill();

  // 窗：暖黄，里面有一盏灯。窗光轻微呼吸
  const fl = 0.86 + 0.14 * Math.sin(T * 3.1);
  g.fillStyle = "rgba(255,203,107," + (0.92 * fl).toFixed(3) + ")";
  rr(g, 104, 300, 62, 50, 6); g.fill();
  g.fillStyle = "rgba(255,168,70," + (0.55 * fl).toFixed(3) + ")";
  rr(g, 118, 318, 34, 32, 4); g.fill();
  g.strokeStyle = "#3A2415"; g.lineWidth = 4;
  rr(g, 104, 300, 62, 50, 6); g.stroke();
  g.beginPath(); g.moveTo(135, 300); g.lineTo(135, 350); g.stroke();
  g.beginPath(); g.moveTo(104, 325); g.lineTo(166, 325); g.stroke();
  // 窗光在地面的投影
  g.fillStyle = "rgba(255,190,96,.07)";
  g.beginPath(); g.ellipse(135, 454, 48, 9, 0, 0, 6.283); g.fill();

  // 门洞（暗）
  g.fillStyle = "#1A1008";
  rr(g, 244, 318, 76, 124, 5); g.fill();

  // 门帘：**open 是掀开的程度**。0 = 关着，1 = 全开露出里面。
  // 这里是"家里有人"的证据 —— 帘子一动，门口就从背景变成了场景。
  const lift = 6 + open * 118;      // 全开时整块帘子升到门框顶上
  g.save();
  rr(g, 244, 318, 76, 124, 5);
  g.clip();
  // 里面：**先铺一层暗底，再打光。** 只铺暖光的话，门洞是一块平的亮黄方块，
  // 读起来像贴在墙上的黄纸，而不是"一个能走进去的地方"。
  g.fillStyle = "#241608";
  g.fillRect(244, 318, 76, 124);
  const ig = g.createLinearGradient(0, 318, 0, 442);
  ig.addColorStop(0, "rgba(255,214,140," + (0.10 + open * 0.55).toFixed(3) + ")");
  ig.addColorStop(0.55, "rgba(255,186,96," + (0.22 + open * 0.58).toFixed(3) + ")");
  ig.addColorStop(1, "rgba(255,150,44," + (0.34 + open * 0.52).toFixed(3) + ")");
  g.fillStyle = ig;
  g.fillRect(244, 318, 76, 124);
  // 门帘本体：**底边是波浪形，而且一直在轻轻摆。**
  // 一块方方正正的矩形读作"木门"，只有布才会被风吹成那样。
  // 这是门口画面里唯一一直在动的东西 —— 有它，场景才不是一张图。
  const bh2 = Math.max(4, 124 - lift);
  const flap = 1.8 + Math.sin(T * 1.7) * 1.2;
  g.fillStyle = "#5A3B22";
  g.beginPath();
  g.moveTo(242, 318);
  g.lineTo(322, 318);
  for (let x = 322; x >= 242; x -= 6) {
    g.lineTo(x, 318 + bh2 + Math.sin(x * 0.19 + T * 2.1) * flap);
  }
  g.closePath();
  g.fill();
  // 褶皱
  g.fillStyle = "rgba(20,12,6,.26)";
  for (let i = 0; i < 4; i++) {
    const fx = 250 + i * 18;
    g.fillRect(fx, 320, 3, Math.max(4, bh2 - 2 + Math.sin(fx * 0.19 + T * 2.1) * flap));
  }
  g.restore();
  g.strokeStyle = "#33200F"; g.lineWidth = 4;
  rr(g, 244, 318, 76, 124, 5); g.stroke();

  // 门口的台阶和草垫
  g.fillStyle = "#3A2919";
  rr(g, 232, 440, 100, 10, 4); g.fill();
  g.fillStyle = "#4C5B33";
  rr(g, 258, 448, 50, 8, 4); g.fill();

  // 门牌
  g.fillStyle = "#6B4A2A";
  rr(g, 250, 284, 64, 21, 4); g.fill();
  g.fillStyle = "rgba(255,225,170,.82)";
  g.font = "bold 12px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("爪 队", 282, 295);
}

/* ---------- 头顶气泡 ---------- */
function drawBubble(g, x, y, text, alpha) {
  if (alpha <= 0.01) return;
  g.font = "13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  const tw = g.measureText(text).width;
  const bw = tw + 26, bh = 31;
  const bx = Math.max(8, Math.min(W - bw - 8, x - bw / 2));
  const by = y - bh;

  g.globalAlpha = alpha;
  g.fillStyle = "rgba(11,24,19,.92)";
  rr(g, bx, by, bw, bh, 10); g.fill();
  g.strokeStyle = "rgba(185,240,106,.40)";
  g.lineWidth = 1.4;
  rr(g, bx, by, bw, bh, 10); g.stroke();
  g.beginPath();
  g.moveTo(x - 5, by + bh - 1);
  g.lineTo(x + 5, by + bh - 1);
  g.lineTo(x, by + bh + 7);
  g.closePath();
  g.fillStyle = "rgba(11,24,19,.92)";
  g.fill();
  g.fillStyle = "#EAF6E2";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(text, bx + bw / 2, by + bh / 2 + 1);
  g.globalAlpha = 1;
}

/* ============================================================================
   16.4 挑一屏（phase === "pick"）
   ----------------------------------------------------------------------------
   为什么非要有这一站：27 屏做完之后，存档里只有一个"推到第几关"的数字。
   那个数字一旦顶到 27，就**只能表达"没得玩了"** —— 重进游戏回到第一屏，
   玩家看到的是"我通关了，怎么又重新开始了"。进度条能回答"我在哪"，
   回答不了"我还能玩什么"。这一屏就是那个答案。

   三处入口：
     ① 门口选人 → 「挑一屏重打」（`L` 也行）
     ② 全通后从主界面进来 —— 没有"下一个没通的关"可推，直接落在这里
     ③ 通关第 27 屏之后 —— 原来那一步直接把存档拍回第 1 关

   版式是 **3 产地 × 9 屏**，和 LEVELS 的实际结构 1:1 对上（不是凑出来的
   3×9 —— 每个产地就是 8 屏 + 1 屏收尾，一共 27）。行 = 产地，列 = 屏序。

   评级（S/A/B）**只在这块面板里露字母**。HUD 顶上那排 27 颗点是"进度"，
   每颗点旁边挂一个 9px 的字母，在 960 宽的屏幕上就是一片噪点。
   点负责"走了多远"，这里负责"走得怎么样"，两件事分开画才都读得清。
   ========================================================================== */

/* ============================================================================
   出征界面（phase === "portals"）
   ----------------------------------------------------------------------------
   病根：主界面点「出征」直接掉进第 N 屏 —— 玩家**没有"挑玩法"这一步**。
   27 屏是一条线，深巢是另一条线，两条线在代码里都存在，但界面上只露一条，
   于是"还有别的玩法"这件事只能靠公告说出来。

   形状（2026-10-26 第三轮定稿）：
     · 左上角入口网格（小卡 = 立绘 + 名字 + 当前进度一行）
     · 右侧大立绘预览卡（这条路长什么样 + 当前这一屏的三颗星条件）
     · **没有挑一屏**：点门直接进当前进度那一屏（用户：「这个界面也不需要吧
       显示当前进度就可以了」）
     · **不暴露总数**：没有「/27」「/81」，只有「第 N 屏」（用户：「我不想暴露
       最大关卡 只显示当前进度即可」）
   从家园进来必走这一页（`?stage=` 调试口除外）。
   ========================================================================== */
const GATE = {
  /* 2026-10-25 第二次打回：「不要全屏 玩法在左上角排列就要可以 给其他玩法预留空间
     每个玩法需要背景立绘啊」。
     所以门从"居中的大卡"降级成**左上角的入口网格**：
       小卡 208×118（16:9），2 列 —— 已开的填前面，加玩法自动往下排一行。
     右侧 360 宽留给「当前选中这条路的立绘预览」：小卡只够放名字，
     "这条路长什么样"必须有地方放大，否则立绘等于没画。
     216→208 是 16:9 反推的（208/118 = 1.763，立绘画的 768×432 = 1.778，
     cover 裁掉不到 1%，看不出）。
     2026-10-26 第三次调整：**空槽删除**（用户否掉画装饰虚框占位那套）。
     预留空间不再靠画装饰框，靠的是版式本身 —— 网格按 GATES.length 排，
     多一个玩法就多一行，右侧预览永远是"当前选中的那张"。
     2026-10-26 第四次调整：**「出征」大标题删除，小卡上移到左上角**
     （用户：「出征去掉啊 2个玩法不能移动到左上角吗」）。
     原标题占着 (88,56) 的黄金位，两张玩法卡反而缩在它下面 ——
     标题只是给这一页起名，而起名这件事底部操作提示已经做了。
     小卡 y 168→52 补标题的空位；预览卡同步放大
     （360×303→384×318）并右缘钉死 920：右下角留 40 给 gateTip 呼吸，
     顶部让不开月亮（光晕占 y 20–168），所以 y 保持 176。
     2026-10-26 第五次调整：**小卡改竖排大卡 358×201，撑满左列**
     （用户：「直接移动上方…注意布局不能太突兀」）。预览卡上移到 52 齐顶后
     变成 420 高，而横排两张 118 高的小卡只占 250 —— 左下半空，重心全压右上，
     比原来更突兀。竖排两张 (52..253 / 271..472) 底正好 472 与预览卡齐平，
     左右两列等高，才是"两块拼一起"而不是"一大一小"。
     358×201 仍是 16:9（≈1.781），cover 不裁。 */
  /* 2026-10-25 第六次调整：**删掉右侧预览卡，玩法卡横排 + 悬停放大**
     （用户：「鼠标放在上面原图就放大就可以了啊」）。

     为什么删得掉：预览卡存在的唯一理由是"这条路长什么样"，可卡本身就是
     立绘 —— 用 40%~87% 的画面去重复卡里已经有的信息，是纯损耗。删掉之后
     卡从 358 宽涨到 410，立绘可用面积接近翻倍，"放大"这件事卡自己就能做。

     为什么不能再竖排：左列可用高度只有 420（y 52..472），358×201 竖排的
     第 3 张从 490 落到 691 —— 直接出屏。纵向列表天生不可扩展，横向条
     天生可扩展，这是排列方向的问题，不是"缩多少"的问题。

     公式：w = (840 - (n-1)*20) / n，h = round(w*9/16)，y 垂直居中。
     840 = 960 - 左右各 60；gap 20 必须大于卡内边距 16，否则两张卡会被
     读成"一整块被竖线切开"而不是"两扇独立的门"；16:9 是立绘素材比例，
     改比例就得重画立绘，本轮不做。
     2 张 410×231 / 3 张 266×150 / 4 张 195×110 / 5 张 152×86。 */
  marginX: 60, gap: 20, top: 52, bottom: 472,
  /* 悬停放大 1.2：**中心不变**，左右各外扩 w*0.1。
     n=2 时左卡中心 265、放大后半宽 246 → 左缘 19，仍在屏内；n≥3 卡更窄，
     更安全。命中判定用**常态矩形**：常态区是放大区的子集且同心，
     鼠标放上去不会"放大→掉出→复原→再放大"地抖。 */
  scale: 1.2,
  /* 卡内第三行（星靶条件 / 深巢规则）只在卡够高时画：它要 22px，加上
     名字 20 + 进度 18 + 上下留白 14 = 74，而底部渐变只有 h*0.48 ——
     h < 150 时装不下，硬画就是把字压在亮图上。 */
  detailMinH: 170,
  get slots() { return GATES.length; },
  /* 用 floor 不用 round：3 个玩法时 round 会算出 267，3*267+40 = 841，
     右缘 901 比边距多 1px（半像素错位就是这么来的）。floor 最多让右缘
     早 2px 收住，看不出来。 */
  get w() {
    const n = Math.max(1, this.slots);
    return Math.floor((W - this.marginX * 2 - (n - 1) * this.gap) / n);
  },
  /* 16:9 反推，但**不低于 120**：5 个玩法时纯 16:9 只有 86 高，扣掉
     文字块 56 + 过渡 16，立绘只剩 30px —— 那张图等于没画。120 是
     "名字 16px + 副行 11.5px 站得住、立绘还剩 48px" 的下限，
     代价是 cover 会裁左右（本来就在裁，看不出来）。 */
  get h() {
    /* 上限 420 = 可用区高。只有 1 个玩法时 840 宽按 16:9 是 473，
       会顶穿 472 撞到底部提示条。 */
    return Math.min(420, Math.max(120, Math.round(this.w * 9 / 16)));
  },
  get y() { return Math.round(this.top + (this.bottom - this.top - this.h) / 2); },
};
const GATES = [
  {
    id: "trail",
    name: "苔原古道",
    /* sub 已删（2026-10-26）：旧值「27 屏 · 一屏一屏推过去」暴露屏数总数，
       用户明确「不想暴露最大关卡」。古道是开放玩法，"我在哪"由小卡副行
       「第 N 屏」和预览卡的当前进度行回答，不需要第二条描述。 */
    art: "gate-trail",
    open: true,
  },
  {
    id: "nest",
    name: "深巢无尽",
    sub: "越往下越深 · 每层地形都不一样",
    art: "gate-nest",
    /* 2026-10-26 开放：地形生成器（N1）已经过 1..60 层 × 10 种子的 C1~C6
       批量校验，能玩才开门。开门这件事本身**不需要改版式** ——
       GATE.slots 是 getter，两扇门都开时网格还是两行。 */
    open: true,
  },
];

/** 出征页的点击出口。预览卡已删（2026-10-25 第六次），点卡就是进 ——
 *  以前还要判一次"是不是点在大立绘上"，现在整页只有卡可点，少一条分支。 */
function gateTap(mx, my) {
  const i = gateHit(mx, my);
  if (i >= 0) enterGate(i);
}

/** 第 i 个槽的矩形（**常态**，不含悬停放大）。绘制与命中共用这一处坐标 ——
 *  两处各算一套，改布局必然错开。 */
function gateRect(i) {
  return {
    x: GATE.marginX + i * (GATE.w + GATE.gap),
    y: GATE.y, w: GATE.w, h: GATE.h,
  };
}

/** 悬停放大后的矩形。**中心不变** —— 改中心的话鼠标会在放大那一瞬间
 *  "跳"到卡外，于是立刻复原，闪成一片。 */
function gateZoomRect(i) {
  const r = gateRect(i), s = GATE.scale;
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  return { x: cx - r.w * s / 2, y: cy - r.h * s / 2, w: r.w * s, h: r.h * s };
}

/** 命中：**含空槽**。空槽也要有反馈 —— 点了没动静是最差的交互，
 *  返回的槽号可能 >= GATES.length，由 enterGate 判成「筹备中」。 */
function gateHit(mx, my) {
  for (let i = 0; i < GATE.slots; i++) {
    const r = gateRect(i);
    if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
  }
  return -1;
}

function openGates() {
  S.phase = "portals";
  S.p = null;
  /* 从深巢回来必须把表换回主线 —— 否则出征页的 gateCur 正常、
     一点「苔原古道」却进了刚才那层深巢（curStage 读的是 ACTIVE）。
     放在这里而不是每个退出口各自清，是因为"回出征页"是唯一出口。 */
  if (S.nest) exitNest();
  /* 不重置 gateCur：从战斗退回来还应该停在刚才那扇门上。
     只 clamp —— 门数变了（以后加门）也不至于指到空位。 */
  S.gateCur = clamp(S.gateCur || 0, 0, GATES.length - 1);
  S.hoverGate = -1;
  /* 星靶完成位快照。预览卡要画"当前这一屏还有哪颗靶没拿到"，
     所以必须在这里读一次最新的（打完一屏回来这张图就是旧的）。 */
  S.starBits = loadStarBits();
}

/** 选一扇门。开着的**直接进当前进度那一屏** —— 挑一屏已删
 * （2026-10-26 用户：「这个界面也不需要吧 显示当前进度就可以了」）。
 * beginRun 内部有 clamp，全通时 progress = LEVELS.length 会落回最后一屏，
 * 重打最后一屏，不会越界。关着的门必须说一句话（不静默吞点击）。 */
function enterGate(i) {
  const p = GATES[i];
  if (!p) return;
  if (!p.open) {
    S.gateTip = { txt: p.name + " 还没挖通，先把古道走完", life: 2.4 };
    return;
  }
  if (p.id === "trail") {
    beginRun(clamp(S.progress, 0, LEVELS.length - 1));
  } else if (p.id === "nest") {
    /* 已经解锁了词条 → 先让他看一眼再下潜。
       没解锁（历史最深 < 5）就**直接进** —— 第 1 次玩的人不该
       在"出发前"先被一张看不懂的表格拦住。 */
    if (NEST_MODS.some(function (m) { return readNestDepth() + 1 >= m.depth; })) {
      openModBoard();
    } else {
      enterNest();
    }
  }
}

/* ---------------------------------------------------------------------------
   深巢：下潜

   「一路往下，深度无上限」。三件事必须同时成立才算"无尽"：
     ① 每层地形不一样（nestLevel 生成 + 镜像 + 主题）
     ② 通关自动往下，**不回出征页** —— 每层断一次就变成"闯关列表"
     ③ 打不过只丢这一层的收成，最深处记录永久保留（硬红线 3：无失败惩罚）

   最深深度存在独立的 `pawpack.nest` 里，**不混进 pawpack.progress**：
   那个数字的唯一语义是"主线推到第几屏"，混用就会出现"下潜 20 层、
   主界面显示已通关 20 屏"这种一个数字表达两件事的错。
   --------------------------------------------------------------------------- */
const NEST_KEY = "pawpack.nest";

function readNestDepth() {
  try { return Math.max(0, parseInt(localStorage.getItem(NEST_KEY), 10) || 0); }
  catch (e) { return 0; }
}

/** 只增不减：重打浅层不许把"下到过第几层"拍回去 */
function writeNestDepth(d) {
  try { if (d > readNestDepth()) localStorage.setItem(NEST_KEY, String(d)); } catch (e) {}
}

/** 下潜到第 depth 层。不传 = 接着存档里的最深处（没有记录就从第 1 层）。 */
function enterNest(depth) {
  /* 「还是同一趟吗」必须在函数**最开头**问。
     下面第 24 行就会 `S.nest = {...}` 覆盖掉它 —— 第一版把这一句写在
     覆盖之后，于是 `sameTrip` 恒为 true：新开一趟时上一趟挣的巢币
     会跟过来，结算卡上报一个这一趟根本没挣过的数字。 */
  const sameTrip = !!S.nest;
  const d = depth == null ? Math.max(1, readNestDepth()) : Math.max(1, Math.floor(depth));
  const r = nestLevel(d);
  ACTIVE = [r.level];
  /* 巢室名带上：HUD 顶部和开场大字都读它（2026-10-27）。
     放在 `S.nest` 上而不是每次去 ACTIVE 里翻 —— 结算/重打时 ACTIVE 会重建，
     而"这一层叫什么"属于这一趟的背景，不该跟着重建而闪成 undefined。 */
  /* 跳过名单在**顶层** `S.nestSkip`（看板在出征页就要能写），
     这里只把当层的词条算出来 —— 下潜到下一层不会把刚才花币关掉的又打开，
     因为名单根本没被重建过。 */
  S.nest = {
    depth: d,
    brood: (r.level.brood && r.level.brood.name) || "深巢",
    mods: [],
    /* 这一层**新出现**的词条。开场大字用它报一次 ——
       "深 15 起没有预瞄线"如果不说，玩家的第一反应是"我的 Shift 坏了"。 */
    fresh: [],
  };
  S.nest.mods = nestModsAt(d);
  {
    const prev = new Set(nestModsAt(d - 1).map(function (m) { return m.id; }));
    S.nest.fresh = S.nest.mods.filter(function (m) { return !prev.has(m.id); });
  }
  S.stage = 0;
  /* 币的差额**必须在 `writeNestDepth` 之前算**：那个函数是"只增不减"，
     写完再读 `readNestDepth()` 拿到的已经是新纪录，差额永远 0 ——
     "只增不减"和"按差额发"撞在一起时，先算后写是唯一顺序。 */
  const coinGain = nestCoinAt(d) - nestCoinAt(readNestDepth());
  writeNestDepth(d);
  beginRun(0);
  /* 放在 `beginRun` **之后**：它会把 `S.trip` 整个换成新对象，
     提前写进去的那一枚会被当场丢掉。 */
  if (!sameTrip) S.trip.nestCoins = 0;
  if (coinGain > 0) S.trip.nestCoins = (S.trip.nestCoins || 0) + coinGain;
}

/** 离开深巢（回出征页 / 回家）：表换回主线，nest 状态清空。
 *  **必须清**：不清的话下一次进主线会拿深巢的那一层当第 0 屏打。 */
function exitNest() {
  S.nest = null;
  /* 这一趟的跳过名单到此为止。不清的话，下一趟下潜会白拿上一趟花钱买的
     两个"不生效" —— 而玩家已经忘了自己买过，只会觉得"这次怎么这么简单"。 */
  S.nestSkip = [];
  ACTIVE = LEVELS;
  S.stage = 0;
  /* 墙也立刻还原，不等下一次 loadLevel。
     `loadLevel` 里已经会按关卡切墙，所以严格说这里可以省 ——
     但"退出深巢之后、进主线之前"那段状态（出征页）里 WALL_L 还是 160，
     而冒烟正好在这个窗口读它，一读就露。**状态要么立刻一致，要么就
     得记住"它现在是不一致的"** —— 后者靠人记，早晚忘。 */
  applyWalls(false);
}

/** 五角星。`on` = 已拿到（实心金），否则空心灰描边 */
function drawStar(g, cx, cy, R, on) {
  const inner = R * 0.46;
  g.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + (Math.PI * k) / 5;
    const rd = k % 2 === 0 ? R : inner;
    const x = cx + Math.cos(a) * rd, y = cy + Math.sin(a) * rd;
    if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
  if (on) {
    g.fillStyle = "#F0A81E";
    g.fill();
  } else {
    g.strokeStyle = "rgba(120,92,64,.38)";
    g.lineWidth = 1.6;
    g.stroke();
  }
}

/** 每个产地 9 屏。名字是产地，不是主题键 —— 主题键有 12 套（含变体），
 *  按主题分组会切出 7 行，和"一产地一屏地打完"的实际路径对不上。 */
const FACTIONS = [
  { id: "tundra", name: "苔原" },
  { id: "wither", name: "枯木坡" },
  { id: "marsh",  name: "泥沼" },
];

/* ---------------------------------------------------------------------------
   当前屏属于哪个产地
   ---------------------------------------------------------------------------
   HUD（顶部标题 + 进度点）和「挑一屏」面板必须用**同一份**分章几何，
   否则会出现"标题说枯木坡、面板把这一屏画在苔原那一行"这种错位。

   每章屏数按 `LEVELS.length / 产地数` 向上取整算，**不写死 9**：
   写死以后再加一屏（比如中间插一屏）就会算出负数或越界行。
   最后一章取余量，允许和前两章不等长。
   --------------------------------------------------------------------------- */
function chapterOfStage(idx) {
  /* 深巢：层号不是主线的一条"屏"。给一个 count=1 的伪章节 ——
     顶部进度点只画一颗（画 9 颗等于暗示"这一章还有 9 层"，
     而深巢是无限的，任何数字都在撒谎）。 */
  if (typeof S !== "undefined" && S && S.nest) {
    return { row: 0, name: "深巢", from: 0, count: 1 };
  }
  const per = Math.ceil(LEVELS.length / FACTIONS.length);
  const row = clamp(Math.floor(idx / per), 0, FACTIONS.length - 1);
  const from = row * per;
  return {
    row,
    name: FACTIONS[row].name,
    from,
    count: Math.max(1, Math.min(per, LEVELS.length - from)),
  };
}

/* ============================================================================
   测试跳关（F2）
   ----------------------------------------------------------------------------
   测试期要能"想打哪屏就打哪屏"。挑一屏 2026-10-26 整页删除后，正向流程
   只剩"当前进度那一屏"，而机器人要能直接落到第 23 屏的芦苇荡 ——
   这个面板就是干这个的，**不是玩法功能**。

   三件事：
     ① F2 打开/关闭本面板（play / clear / fail / pick / select 都能开）
     ② 面板里 27 格全可点，**无视解锁与存档进度**，选了立刻 beginRun
     ③ 打的时候按 [ / ] 直接上一屏/下一屏，连扫不用回面板

   **这不是玩法功能，别混进正向流程。** 它不改 progress、不写存档、
   不发奖励（beginRun 只重置关卡级状态），所以随便点不会污染存档。
   正式版要删的话，删掉 keydown 里那三段 + 这个块即可，不留后门。
   ========================================================================== */
const JUMP = {
  /* 版式按"三行刚好把卡填满"定：格子 68 高 + 行距 14，三行占 232，
     加抬头 96，卡高 366 —— 第一版是 388/60/10，下面空了一大块，
     看起来像格子没画完。 */
  x: 44, y: 118, w: 872, h: 366,
  cols: 9, cw: 80, ch: 68, gapX: 7, gapY: 14,
  labelW: 56, labelGap: 10,
  gridY: 118 + 96,
};

/** 第 i 屏的格子矩形。绘制与命中共用这一份 ——
 *  两边各算一次必然错开，表现是"点上去跳到隔壁那屏"。
 *  挑一屏那边已经吃过一次这个亏（所以它也只留了 pickCell 一份真值）。 */
function jumpCell(i) {
  const col = i % JUMP.cols, row = Math.floor(i / JUMP.cols);
  return {
    x: JUMP.x + JUMP.labelW + JUMP.labelGap + col * (JUMP.cw + JUMP.gapX),
    y: JUMP.gridY + row * (JUMP.ch + JUMP.gapY),
    w: JUMP.cw, h: JUMP.ch,
  };
}

function jumpHit(mx, my) {
  for (let i = 0; i < LEVELS.length; i++) {
    const c = jumpCell(i);
    if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) return i;
  }
  return -1;
}

function openJump() {
  if (S.phase === "jump") { closeJump(); return; }
  /* 只从这五个阶段进。别的时候开面板没意义，而且 closeJump 得有地方可回。 */
  if (["play", "clear", "fail", "pick", "select"].indexOf(S.phase) < 0) return;
  S.jumpPrev = S.phase;
  S.jumpCur = clamp(S.stage, 0, LEVELS.length - 1);
  S.jumpHover = -1;
  S.phase = "jump";
}

function closeJump() {
  const back = S.jumpPrev || "select";
  S.jumpPrev = null;
  S.jumpHover = -1;
  /* 回 play 的前提是角色和关卡还在。从 select / pick 进来的没有 S.p，
     硬回 play 会得到"一片空地 + 没人"—— 看起来像崩了。 */
  S.phase = (back === "play" && S.p) ? "play" : (back === "pick" ? "pick" : "select");
  if (S.phase === "select") { S.door.pick = -1; S.door.leaveT = 0; }
}

/** 直接开打第 i 屏。**不动 progress、不写存档** —— 这是测试工具，不是作弊码。
 *
 *  必须显式护住 progress：`beginRun` 里有一行
 *  `S.progress = Math.max(S.progress, S.stage)`（正常流程"进到第 N 屏就记 N"）。
 *  不护的话，测试时按两下 `]` 跳到第 20 屏，存档进度就真的变成 20 ——
 *  下次从主界面进来直接掉到第 20 屏，看起来像存档被写坏了。
 *
 *  beginRun 自己不调 saveProgress（写盘在 pickStage / 通关判定里），
 *  所以只要把内存值还原，盘上就一点没动。 */
function jumpTo(i) {
  const n = clamp(Math.round(i), 0, LEVELS.length - 1);
  S.jumpPrev = null;
  S.jumpHover = -1;
  const keepProg = S.progress;
  beginRun(n);
  S.progress = keepProg;
}

function drawJump(g) {
  const FONT = "'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  const K = hudSkin();

  /* 全屏盖死。底下的画布可能是战场（从 play 进来），也可能是门口 ——
     不盖死的话，漏出来的平台木条会跟格子咬在一起，27 个数字读不出来。 */
  g.fillStyle = "rgba(8,13,17,.93)";
  g.fillRect(0, 0, W, H);

  creamCard(g, JUMP.x, JUMP.y, JUMP.w, JUMP.h, 24);

  g.textAlign = "left";
  g.textBaseline = "middle";
  g.fillStyle = K.ink;
  g.font = "bold 22px " + FONT;
  g.fillText("测试跳关", JUMP.x + 28, JUMP.y + 36);

  g.fillStyle = "rgba(116,98,76,.95)";
  g.font = "12px " + FONT;
  g.fillText("27 屏全开 · 无视解锁与存档进度 · F2 关闭 · 方向键选 · 回车开打 · [ ] 上下屏",
             JUMP.x + 130, JUMP.y + 37);

  g.strokeStyle = "rgba(150,124,92,.34)";
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(JUMP.x + 28, JUMP.y + 78);
  g.lineTo(JUMP.x + JUMP.w - 28, JUMP.y + 78);
  g.stroke();

  // 产地产地标签：每行一产地，和挑一屏的分组一致
  for (let row = 0; row < FACTIONS.length; row++) {
    const c = jumpCell(row * JUMP.cols);
    g.textAlign = "right";
    g.font = "bold 12px " + FONT;
    g.fillStyle = "rgba(112,94,72,.95)";
    g.fillText(FACTIONS[row].name, JUMP.x + JUMP.labelW, c.y + c.h / 2);
  }

  for (let i = 0; i < LEVELS.length; i++) {
    const c = jumpCell(i);
    const cur = i === S.jumpCur;
    const hov = i === S.jumpHover;
    const seen = !!S.best[i];

    g.fillStyle = cur ? "rgba(232,149,26,.20)"
                : hov ? "rgba(112,150,84,.22)"
                : seen ? "rgba(248,242,228,.92)"
                       : "rgba(240,232,216,.62)";
    rr(g, c.x, c.y, c.w, c.h, 10);
    g.fill();

    g.lineWidth = cur ? 2.6 : 1.2;
    g.strokeStyle = cur ? "#E8951A" : hov ? "#6E9A48" : "rgba(150,128,100,.55)";
    rr(g, c.x + 0.6, c.y + 0.6, c.w - 1.2, c.h - 1.2, 10);
    g.stroke();

    g.textAlign = "center";
    g.fillStyle = K.ink;
    g.font = "bold 19px " + FONT;
    g.fillText(String(i + 1), c.x + c.w / 2, c.y + 24);

    /* 关卡名：先挤掉空格再截到 5 字。
       数据里有「乌 鸦」这种带空格的敌人名，空格会白吃一格宽度。 */
    const nm = String(LEVELS[i].name || "").replace(/\s/g, "");
    g.font = "10.5px " + FONT;
    g.fillStyle = "rgba(96,82,66,.92)";
    g.fillText(nm.length > 5 ? nm.slice(0, 5) : nm, c.x + c.w / 2, c.y + 47);

    // 已打过的那几屏挂个评级角标，一眼看出哪些验过了
    const rk = S.best[i];
    if (rk) {
      g.textAlign = "right";
      g.font = "bold 10px " + FONT;
      g.fillStyle = RANK_COLOR[rk] || "#7a6a55";
      g.fillText(rk, c.x + c.w - 5, c.y + 11);
    }
  }

  g.textAlign = "center";
  g.fillStyle = "rgba(255,248,232,.72)";
  g.font = "bold 12px " + FONT;
  g.fillText("点格子或按回车开打   ·   [ / ]  上一屏 / 下一屏   ·   F2 或 ESC 关掉",
             W / 2, JUMP.y + JUMP.h + 22);
}

const RANK_COLOR = { S: "#E8951A", A: "#4F9B24", B: "#3F82A2" };

/** 夜空底。出征页和门口选人共用这一份 —— 两处各画一遍，
    改配色时必然只改一处，玩家会在两个连续页面之间看到天色不一样。
    `withMoon`：出征页传 false（2026-10-26 用户：「直接移动上方 把上面的内容去掉」
    —— 月亮+光晕占 y 20–168，是右侧预览卡没法跟左上小卡齐顶的唯一原因）；
    门口选人页仍传默认 true，那里的月亮没人挡。 */
function drawNightSky(g, t, HZ, withMoon) {
  const sky = g.createLinearGradient(0, 0, 0, HZ + 10);
  sky.addColorStop(0, "#0A1520");
  sky.addColorStop(0.52, "#12232A");
  sky.addColorStop(1, "#1A3029");
  g.fillStyle = sky;
  g.fillRect(0, 0, W, H);

  // 星：用 hash 不抖。Math.random 每帧变，整片星空会闪成噪点
  for (let i = 0; i < 54; i++) {
    const x = hash(i * 7 + 1) * W;
    const y = hash(i * 13 + 5) * 330;
    const tw = Math.sin(t * 1.3 + i * 0.9) * 0.5 + 0.5;
    g.fillStyle = "rgba(214,238,226," + (0.10 + 0.40 * tw).toFixed(3) + ")";
    g.fillRect(x, y, 1.7, 1.7);
  }

  // 月亮（出征页去掉：见函数注释）
  if (withMoon !== false) {
    g.fillStyle = "rgba(226,240,214,.86)";
    g.beginPath(); g.arc(816, 94, 29, 0, 6.283); g.fill();
    g.fillStyle = "rgba(226,240,214,.045)";
    g.beginPath(); g.arc(816, 94, 74, 0, 6.283); g.fill();
  }

  // 远树剪影
  g.fillStyle = "#0E2820";
  for (let i = 0; i < 12; i++) {
    const x = i * 86 + (hash(i * 3) - 0.5) * 44;
    const h = 88 + hash(i * 11) * 80;
    const w = 38 + hash(i * 17) * 28;
    g.beginPath();
    g.moveTo(x, HZ + 6);
    g.lineTo(x + w * 0.5, HZ + 6 - h);
    g.lineTo(x + w, HZ + 6);
    g.closePath();
    g.fill();
  }
  g.fillStyle = "rgba(9,24,20,.50)";
  g.fillRect(0, HZ - 10, W, 16);
}

/** 苔原古道的概念图：**简笔版**（2026-10-25 用户打回 340 宽的精细版 ——
 *  「不需要展示里面的，只需要一个简易的」）。只留四个符号：
 *  地面（横版）→ 一颗球 → 向右的箭头 → 拱门营地。
 *  一眼读出「横着把球推到门里」，坑/坡/宠物的细节是进了门才需要知道的。 */
function drawTrailArt(g, x, y, w, h) {
  const sky = g.createLinearGradient(x, y, x, y + h);
  sky.addColorStop(0, "#1B3A46");
  sky.addColorStop(1, "#2A5E49");
  g.fillStyle = sky;
  g.fillRect(x, y, w, h);

  // 地面：一条横线就是「横版」的全部信息
  const gy = y + h * 0.72;
  g.fillStyle = "#2E5A3C";
  g.fillRect(x, gy, w, y + h - gy);
  g.fillStyle = "#3C7050";
  g.fillRect(x, gy, w, 3);

  // 一颗球 + 向右箭头：这条线唯一要做的动作
  g.fillStyle = "rgba(255,240,210,.88)";
  g.beginPath(); g.arc(x + w * 0.30, gy - 10, 8, 0, 6.283); g.fill();
  g.strokeStyle = "rgba(240,220,160,.75)";
  g.lineWidth = 2.4;
  g.beginPath();
  g.moveTo(x + w * 0.42, gy - 10);
  g.lineTo(x + w * 0.60, gy - 10);
  g.stroke();
  g.beginPath();
  g.moveTo(x + w * 0.55, gy - 15);
  g.lineTo(x + w * 0.60, gy - 10);
  g.lineTo(x + w * 0.55, gy - 5);
