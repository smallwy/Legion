<script>
"use strict";

/* ============================================================================
   PAWPACK · 林地  V1
   ----------------------------------------------------------------------------
   单角色出战的雪人式关卡。跟 Snow Bros 的差别集中在三条规则上，
   它们合起来构成这一版想验证的"微创新"：

   ① 敌人**没有血量**，只有 3 格包裹槽。
      攻击不扣血，只是往身上糊一层苔。糊满 3 层 -> 变成一颗滚球。
      于是"输出"和"控制"变成同一件事，屏幕上不需要血条。

   ② 球会**造球**。
      滚球撞到敌人，给那个敌人 +1 层包裹（泥坑里 +2）。
      已经裹了两层的，被球一撞就当场变成新球，以 70% 速度朝原方向继续滚。
      所以一颗球可以滚出一场风暴 —— 前提是你**提前把整层敌人各喷了两下**。
      这就是"先铺场，再引爆"，是原版没有的一层规划。

   ③ 落地位置决定这颗球的价值（地形分岔）。
      火坑：直接烧掉，收成 ×2，但**断连锁**（球没了，后面的人撞不到）
      泥坑：球裹上泥，变重，之后每次撞人 +2 层 —— 强化通道
      营地：落袋，收成 ×1 且额外 +1 —— 稳妥
      所以"往哪推"不是清场方向问题，是"我这一球想要什么"的问题。

   ④ 推关制（这一版加的）。
      选一只 → 第 1 关 → 结算停 3 秒自动进下一关。不回关卡列表，
      因为一回到列表，人就会开始挑着打，推关的手感就断了。
      进度存 localStorage，关掉再打开从上次那关继续。

   ⑤ 六把武器，作用方式全不一样（这一版重做）。
      溜溜球（去回）/ 音波喇叭（原地扇形）/ 滚坚果（贴地滚）/
      萝卜炮（抛物线）/ 飞刀（丢出去，自旋穿透）/ 影分身（召唤两个分身替你打）。
      命中效果完全相同，差异化只在怎么打到 —— 这是推球游戏，不是弹幕游戏。
      上一版六把全是"飞出去一颗东西"，只有形状差别；现在至少四把连"东西"都不是：
      音波是范围、坚果是地面滚动物、飞刀是一次性投掷、分身是召唤物。

   ⑥ Q 版战斗场景（这一版改的）。
      原来画的是暗色森林剪影，读起来像横版探险。现在每关一套主题色，
      天空要亮、云山树全用圆弧、所有东西都有深色粗描边 —— 像贴纸，不像写实。

   ⑦ 球是"一次性"的（这一版改的）。
      被玩家推出去的球有 3.2 秒寿命，撞两次墙就散。以前地面无摩擦 + 撞墙只衰减，
      底层会永远有几颗球在溜达，玩家分不清"哪颗还能用、哪颗是上一波的残骸"。

   ⑧ 宝箱只从"球送走的人"身上掉（这一版加的）。
      火坑/营地结算时按这一球**连带送走几只**判概率：单杀 14%、两只 38%、三只 62%。
      武器糊不死人（只糊层），所以"只有雪人式击杀才有宝箱"是机制自带的，不用额外判。
   ========================================================================== */

/* ---------- 画布 ---------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const W = 960, H = 600;

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.style.width = (W * s) + "px";
  cv.style.height = (H * s) + "px";
}
window.addEventListener("resize", fit);
fit();

/* ---------- 工具 ---------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
// 随机数统一走 S.rng，别直接 Math.random。
// 不然一局里敌人的巡逻方向、粒子的散射角度都不可复现，
// 同一个 bug 跑两次能不能复现全看运气 —— 测试就没意义了。
function rand(a, b) { return a + S.rng() * (b - a); }
const sign = (v) => (v < 0 ? -1 : 1);

/** 圆角矩形路径（不 fill，交给调用方决定画法） */
function rr(g, x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + k, y);
  g.lineTo(x + w - k, y);
  g.quadraticCurveTo(x + w, y, x + w, y + k);
  g.lineTo(x + w, y + h - k);
  g.quadraticCurveTo(x + w, y + h, x + w - k, y + h);
  g.lineTo(x + k, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - k);
  g.lineTo(x, y + k);
  g.quadraticCurveTo(x, y, x + k, y);
  g.closePath();
}

/** 五角星路径（不 fill）。挑一屏格子底部那三颗靶就是它 ——
 *  为什么是星不是圆点：玩家对"关卡挂星"的读法已经固化（实心 = 拿到），
 *  换成圆点等于把这句话翻译一遍。内半径取 0.45 是瘦长星，
 *  0.5 以上在 r=4 这个尺度上会胖成一团糊。 */
function starPath(g, cx, cy, r) {
  g.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + (k * Math.PI) / 5;
    const rad = k % 2 === 0 ? r : r * 0.45;
    const x = cx + Math.cos(a) * rad;
    const y = cy + Math.sin(a) * rad;
    if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.closePath();
}

/** 确定性伪随机：同一个 seed 每帧同一条曲线，否则背景会抖成雪花屏 */
function hash(i) {
  const v = Math.sin(i * 127.1 + 311.7) * 43758.5453;
  return v - Math.floor(v);
}

/* ============================================================================
   1. 角色
   ----------------------------------------------------------------------------
   六只宠物都能出战，但**一局只能带一只**。它们不是换皮：
   `fire()` 里的弹道形状是真的不一样，玩家按一下就知道自己换了人。
   ========================================================================== */

/* ----------------------------------------------------------------------------
   我方单位
   ----------------------------------------------------------------------------
   一局带一只，所以六只必须**按一下就知道换了人**。判据不是数值不同，
   是弹道形状不同 —— 玩家不看 UI 也能从手感上认出来。

     尖耳猫  溜溜球    甩出去、拉回来，来回都能打。站位对了能打两遍
     短尾犬  音波喇叭  原地吼一圈。射程最短、覆盖最宽，专治贴身围殴
     胖仓鼠  滚坚果    贴地滚，穿透，撞墙弹一次。地上有人的时候最好用
     长耳兔  萝卜炮    抛物线，落点炸一片。唯一能打"高台背面"的
     老实牛  飞刀      丢出去，高速自转，穿两个人。丢完就没了，不回收
     影狐    影分身    召两个分身站你左右，替你吐影弹。分身不走，得自己找角度

   后两把是用户点名要改的：飞刀"是丢出去的，不是环绕的"；
   分身上一版是三道平推的残影，读起来只是"三个白药丸"，现在改成真正的召唤物。

   注意：这些弹丸打中的效果**都一样**（+1 层包裹）。不做元素克制、
   不做伤害数字 —— 这是推球游戏，不是弹幕游戏。差异化只在"怎么打到"。
   ========================================================================== */

/* ----------------------------------------------------------------------------
   美术图（可选注入）
   ----------------------------------------------------------------------------
   grove.html 要能双击打开、零外部依赖，所以这里**不引用任何图片文件**。
   图片只在 Cocos 里由 GroveBattle 通过 resources.load 加载后注进来：
   有图就贴图，没图回退到下面的代码图形 —— 两套并存，谁也不会坏。

   键名约定：pet-<heroId> / head-<heroId> / ui-<name>
   （heroId 见 HEROES[].id：cat / dog / ham / rab / ox / fox）
   -------------------------------------------------------------------------- */
const ART = Object.create(null);

/**
 * 注入一张美术图。
 * img 可以是 HTMLImageElement / ImageBitmap / HTMLCanvasElement —— 只要能被
 * drawImage 直接吃掉。传 null 就是撤掉（回退代码图形）。
 */
function groveSetArt(key, img) {
  if (img) ART[key] = img; else delete ART[key];
}

/** 取图；没注入或图还没解码完（宽高为 0）都返回 null，让调用方走回退分支。 */
function artOf(key) {
  if (!key) return null;
  const a = ART[key];
  if (!a) return null;
  const w = a.width || a.naturalWidth || 0;
  return w > 0 ? a : null;
}

/* ----------------------------------------------------------------------------
   手感常量。**放在 HEROES 之前**，因为绘制、物理、预瞄线三处都要读同一份 ——
   上一版推球初速在 updatePlayer 里写 620、在 predictBall 里也写 620，
   两处各写一遍，改一处忘一处的时候，预测线就会开始骗人。
   -------------------------------------------------------------------------- */
/** 施法动作时长（秒）。0.16 太快，肉眼只看到闪白；0.26 够走完"后坐 → 前冲 → 回落" */
const CAST_T = 0.30;
/** 站着不动推球的初速。
 *  **这个数不能随手加大。** 试过 800：泥沼/阶梯塔直接从"能进营地"变成
 *  "全图一次都推不进去" —— 球从平台上被推出去是抛物线，初速一变落点就整体前移，
 *  正好落进营门前那道火坑。八关的落点都是按 620 摆的，动它就是动关卡。 */
const PUSH_BASE = 620;
/** 助跑满格再加多少（620 → 1209）。跑满约 380px */
const PUSH_RUN = 0.95;
/** 推出去的球多久散掉。3.2 秒只够滚 1984px，很多关推出去滚一半就没了 ——
 *  读作"球推不动"。4.6 秒足够滚穿一整屏再回来。 */
const PUSH_LIFE = 4.6;

/* ---- 石球（2026-10-27）：停下来就是一块砖 -------------------------------
   玩家原话：「球停留在平台可以跳上去，这个建议做。」

   这条和"气"曾经被认为是冲突的（球会漏光崩开，怎么能变成永久地形），
   想通之后才发现刚好相反：**气管的是"滚动的寿命"，硬化管的是"停下来"**。
   一颗球要么在滚（漏气、会崩、是弹药），要么停住（不漏气、不崩、是砖）。
   两者不是同一件事，不该抢同一条规则。

   判定用"静止"而不是"撞到某个位置"：
     · 撞墙 ×0.62 衰减，墙角上几脚之后必然掉到 90 以下 —— 死角自己会出现；
     · 满力推（1209）撞 6 次才慢下来，那时 `ballLife()` 早过了，会滚到爆。
       **于是"轻踢才停得住、猛推一定滚到爆"** —— 和既有的"推出去=一次性"
       是同一个味道，不用额外加规则。

   上限 2 颗：不加的话玩家会把整屏的球都摆成楼梯。上限是硬约束，
   不是建议 —— 第 3 颗硬化时最老的那颗会崩开（人吐回场上，绝不凭空消失）。
   -------------------------------------------------------------------------- */
const STONE_HOLD = 0.5;   // 满足条件后还要撑多久。0.5 秒比一次呼吸短，玩家不会等
const STONE_MAX = 2;      // 同时存在的石球上限
/* **两个速度阈值，各管一件事 —— 用一个数会出人命。**
 *
 * `STONE_STOP`（撞墙时用）：撞墙后该怎么处理。620（PUSH_BASE）→ 384（第一脚）
 *   → 238（第二脚），所以 260 意味着"第二脚撞完就该停了"。放 90 的话永远等不到
 *   （减到 90 要撞 5 次、约 7 秒，而 `ballLife()` 只有 4.6 秒），**窗口是空的**。
 *
 * `STONE_V`（硬化时用）：贴墙之后"真的停下来了"的判据。放得很低，因为
 *   **"减速"和"停下"不是一回事**：球在墙边撞怪、撞木桩都会减速（×0.42~0.62），
 *   用 260 判就会在装人的过程中把球变成砖 —— 实测 ALL9 第 12 屏
 *   「单球最多装 2 只、目标 3 只」、第 15 屏「落袋 3 / 目标 4」当场打红。
 *   撞墙时 `STONE_STOP` 已经把 `vx` 归零，所以这里 40 只是排除"还在挪"的球。 */
const STONE_STOP = 260;
const STONE_V = 40;

const HEROES = [
  {
    id: "cat", name: "尖耳猫", tag: "溜溜球",
    c1: "#F3B366", c2: "#FFEBCF", c3: "#DC8443",
    w: 38, h: 44, spd: 330, jump: 830,
    atkCd: 0.34, dashCd: 0.60, dashPow: 620,
    ears: "cat",
    desc: "甩出去再拉回来，来回都能糊一层。贴脸放等于打两下。",
    fire(u) {
      spawnShot({
        x: u.x + u.face * 20, y: u.y - 26,

      });

  {
    id: "dog", name: "短尾犬", tag: "音波喇叭",
    c1: "#B98C63", c2: "#F2DFC4", c3: "#8A623E",
    w: 46, h: 46, spd: 300, jump: 800,
    atkCd: 0.46, dashCd: 0.55, dashPow: 660,
    ears: "dog",
    desc: "吼出一道会越撑越宽的音波。射程短，但它一路变宽，正对着放很难躲。",
    fire(u) {
      // 上一版是 vx=0 的原地扩张 —— 那不是子弹，是贴在人身上的光环：

      spawnShot({
        x: u.x + u.face * 22, y: u.y - 26,
        vx: u.face * 740, vy: 0, r: 18, life: 0.52,
        kind: "wave", dir: u.face, grow: 130, maxR: 46,
        color: "#FFF0C8", pierce: true,
      });
    },
  },
  {
    id: "ham", name: "胖仓鼠", tag: "滚坚果",
    c1: "#D9C08C", c2: "#FFF6E2", c3: "#A98B5C",
    w: 40, h: 40, spd: 350, jump: 780,
    atkCd: 0.42, dashCd: 0.70, dashPow: 580,
    ears: "ham",
    desc: "一颗坚果贴地滚，撞墙会弹回来。地上站成一排的时候最好用。",
    fire(u) {
      spawnShot({
        x: u.x + u.face * 18, y: u.y - 16,
        vx: u.face * 560, vy: -40, r: 15, life: 1.6,
        kind: "nut", dir: u.face, spin: 0,
        color: "#B07A42", pierce: true, bounces: 1,
      });
    },
  },
  {
    id: "rab", name: "长耳兔", tag: "萝卜炮",
    c1: "#F0E3E8", c2: "#FFFFFF", c3: "#D0A8B6",
    w: 38, h: 46, spd: 340, jump: 880,
    atkCd: 0.56, dashCd: 0.65, dashPow: 600,
    ears: "rab",
    desc: "横着把萝卜射出去，碰到东西就炸开一片。射程最远的一把，但要算好提前量。",
    fire(u) {

      // 萝卜飞出去 300px 就砸进土里，而敌人多半站在同一个高度 ——
      // 于是"能打到高台背面"的代价变成了"平时根本打不中"。
      // 用户的原话是"所有的技能都应该是横向施法"：
      // 现在它贴着胸口高度平射，落地/碰到人才炸，靠 AOE 而不是靠落点。
      spawnShot({

        vx: u.face * 620, vy: 0,

      spawnShot({

        vx: u.face * 900, vy: -30,
        r: 13, life: 0.58, kind: "knife", dir: u.face,
        spin: 0, grav: 320, pierce: true, hitMax: 2,

      });
    },

  {
    id: "fox", name: "影狐", tag: "影分身",
    c1: "#E08A5E", c2: "#FFE4D2", c3: "#B45F38",
    w: 42, h: 44, spd: 360, jump: 820,

/* ============================================================================
   3. 关卡
   ----------------------------------------------------------------------------
   单屏固定，六层木台 + 地面。地面从左到右的通路顺序是：

       左墙 | 木桩A | 泥坑 | 火坑 | 木桩B | 营地

   落在火坑右边的地面（x > 600）再往右滚。落点由上层平台的布局决定，
   这一条是整张关卡的设计核心。
   ========================================================================== */

const GROUND_Y = 556;
/* 左右逻辑墙。**主线是常量值，但变量本身必须是 let** ——
   深巢的活动区是 640（见 NEST.W），墙要跟着往内缩。
   全程只有两个写入点：`applyWalls()` 一个函数，`loadLevel` 调它。
   散在别处赋值的话，"从深巢回主线"早晚漏一次，主线就会变成一条
   两端各少 134px 的窄路，而那种错在截图上看不出来（背景还是满屏的）。 */
const WIDE_L = 26, WIDE_R = 934;
let WALL_L = WIDE_L, WALL_R = WIDE_R;

/* ============================================================================
   空间语法 · 一：地面材质带（N1 地脉）
   ----------------------------------------------------------------------------
   **必须理解这一条再改数字：本作的地面是"完全无摩擦"的。**
   上面 updateBalls 里写得很清楚 —— 球一旦推起来就一路滚，唯一的衰减是撞墙
   ×0.62。这不是疏漏，是"往哪推是一次真赌注"的手感来源。

   所以材质带**不能**做成"三种摩擦系数" —— 那等于给无摩擦世界偷偷加摩擦，
   27 屏的落点、竖井、营地全按 620 的巡航速度调过，一动就会集体偏。
   这里的做法是：
     · ice 冰面 → **给球加速**（不是"少减速"，是这个物理里根本没有减速）
     · mud 泥面 → 给球减速（唯一一处主动加摩擦，只作用在泥上）
     · moss 苔面 → 常规，什么都不做（绝大多数地面的默认值）

   对**人**才是真正的摩擦差异：`fr` 本来就在那儿（见 updatePlayer 里那段
   "雪地上摩擦变小，这才是打滑"）。材质带只是把那个全局雪深换成局部的。

   幅度都压在 ±25% 内。冰面让球多滚 200px、泥面让它早停 150px ——
   足够改变"这一推去哪"，不足以让某一屏从可通变成不可通。
   -------------------------------------------------------------------------- */
const MAT = {
  moss: { ballGain: 0,    ballDrag: 0,    heroFr: 1.00, tint: null },
  ice:  { ballGain: 0.45, ballDrag: 0,    heroFr: 0.10, tint: "#BFE9FF" },
  mud:  { ballGain: 0,    ballDrag: 1.10, heroFr: 2.10, tint: "#7A5A38" },
};

/** 球心 x 落在哪条材质带上。没写 grounds 的屏永远返回 moss */
function matAt(x) {
  for (const g of GROUNDS) {
    if (x >= g.x && x <= g.x + g.w) return g.kind in MAT ? g.kind : "moss";
  }
  return "moss";
}

/* ============================================================================
   空间语法 · 二：反射板（N2）
   ----------------------------------------------------------------------------
   一块悬空的斜板。球撞上去**按镜面反射，速度一点不衰减** —— 这一点是刻意的，
   它和"撞墙 ×0.62"的区别必须让玩家一摸就知道：墙是惩罚，板是机会。

   ★ 这个函数被 updateBalls 和 predictBall **共用**。
     本作最不能犯的错是"预瞄线骗人"，而反射板是唯一一个"6px 的撞点差异
     → 20 度的出射差异"的件，两处各写一遍必然漂移。所以做成单函数，
     连那个临时对象都是共用的（不会同时调用）。
   -------------------------------------------------------------------------- */
const _rb = { x: 0, y: 0, vx: 0, vy: 0, nx: 0, ny: 0 };

/** 圆 vs 线段：命中就地把 o 的 {x,y,vx,vy} 改成反射后的值，返回 true */
function reflectStep(o, r) {
  if (!REFLECTS.length) return false;
  for (const d of REFLECTS) {
    const dx = d.x2 - d.x1, dy = d.y2 - d.y1;
    const len2 = dx * dx + dy * dy;
    if (len2 < 1) continue;
    // 球心在线段上的投影（夹到 0..1，所以端点也参与判定）
    let t = ((o.x - d.x1) * dx + (o.y - d.y1) * dy) / len2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const cx = d.x1 + dx * t, cy = d.y1 + dy * t;
    let ux = o.x - cx, uy = o.y - cy;
    const dist = Math.hypot(ux, uy);
    if (dist > r + 2 || dist < 0.01) continue;
    ux /= dist; uy /= dist;
    // 正在离开就不再反射 —— 不加这条，球会被贴在板上反复反射，原地抖动
    const vn = o.vx * ux + o.vy * uy;
    if (vn > 0) continue;
    o.vx -= 2 * vn * ux;
    o.vy -= 2 * vn * uy;
    o.x = cx + ux * (r + 1.5);
    o.y = cy + uy * (r + 1.5);
    o.nx = ux; o.ny = uy;
    return true;
  }
  return false;
}


/** 雪从 0 积到最厚要这么多秒。第 2 关 par 是 60 秒，所以通常打到一半才过半厚 */
const SNOW_BUILD_SEC = 90;
/** 雪最厚时敌人还剩多少速度。−30%：看得出"它们慢了"，又不至于变成站桩 */
const SNOW_FOE_SLOW = 0.30;
/** 雪最厚时猫还剩多少速度。−18%：比敌人小 —— 玩家先于敌人感到"陷进去"就太难了 */
const SNOW_HERO_SLOW = 0.18;

/** 敌人速度系数。雪厚了走不动 —— 这是"雪是机制"里最省的一刀：只改一个乘数 */
function foeSpeedK() {
  return S.snowDepth > 0 ? 1 - SNOW_FOE_SLOW * S.snowDepth : 1;
}
/** 猫的移动系数。比敌人轻：雪该让玩家觉得"地面重了"，不该让他觉得"猫坏了" */
function heroSpeedK() {
  return S.snowDepth > 0 ? 1 - SNOW_HERO_SLOW * S.snowDepth : 1;
}

/* ----------------------------------------------------------------------------
   脚印

   雪地上留洞。**只做猫和球**，不做敌人 —— 敌人多、走位碎，
   一堆小椭圆会糊成噪点，反而看不出"谁走过"。

   间距按**走了多远**算，不按帧：按帧的话站着不动也会一直踩，
   屏幕上会长出一条原地不动的脚印带。

   上限 120 个：脚印是消耗品，不是存档内容。再多也不会更"被踩过"，
   只会让每帧多画好几百个椭圆。
   -------------------------------------------------------------------------- */
function leavePrints() {
  if (!TH.snow || S.snowDepth < 0.25) return;

  const p = S.p;
  if (p && !p.dead && p.onGround) {
    if (S._pkLast === undefined) S._pkLast = p.x;
    if (Math.abs(p.x - S._pkLast) > 11) {
      S._pkLast = p.x;
      S.footprints.push({ x: p.x, y: p.y, t: S.t, w: 9, h: 3.8 });
    }
  }

  for (const b of S.balls) {
    if (b.dead || !b.onGround) continue;
    if (b._pkLast === undefined) b._pkLast = b.x;
    if (Math.abs(b.x - b._pkLast) > 9) {
      b._pkLast = b.x;
      S.footprints.push({ x: b.x, y: b.y, t: S.t, w: b.r * 1.1, h: b.r * 0.3 });
    }
  }

  while (S.footprints.length > 120) S.footprints.shift();
}

/* 球是不是在**地面层**这条道上。
 *
 * 这一条决定了左右两端到底该不该有墙 —— 原来两端是通高的隐形墙，
 * 球滚到边上弹回来，玩家看到的是"撞到空气"。现在的规则：
 *   · 地面层：两端**开口**。左边滚出去就没了（掉出场外），右边滚出去是进门结算。
 *   · 上层（462 / 350 / 248）：还是实墙，球撞上去要弹。
 *
 * 判据用球的 y：贴地滚时球心压在台面上，b.y === GROUND_Y（556）；
 * 最低那层浮空台是 462。差 94，取 24 的余量，跳起来也不会误判。
 */
function onGroundLane(b) { return b.y >= GROUND_Y - 24; }

/* ----------------------------------------------------------------------------

   每关的布局都是重新排的，八关有八种形状：
     1 直井        两段台面，一道竖井直通地面

     6 传送        球道被洞接成一条长链

/* ----------------------------------------------------------------------------
   派生的"空气透视"配色
   ----------------------------------------------------------------------------
   手写的 sky/hill/grass/wood 只够分物件，分不出**前后**。

   上一版的远山直接用了主题里的 hill1/hill2 —— 那对颜色是从草地色派生的，
   和天空同明度同色相（泥沼那关：暖黄天空 + 黄褐山），画上去等于没有，
   整片背景读作"一块渐变色板"。这就是用户说的"像画出来的"。

   空气透视的正解是**色相分离 + 明度递进**，两条都用程序算，八套主题自动一致：
     · 远的往冷里走（混青蓝），近的回到草色 —— 色相上就分开了；
     · 远的往天空里混得多（更亮更淡），近的混得少（更实）—— 明度上再分一次。
   -------------------------------------------------------------------------- */

/* 草地整体压暗的系数。
   0.86 → 0.80 是在换成暖金天空之后调的：亮黄绿的草地 + 暖金天空，
   两者明度太接近，平台的投影读不出来，整屏像"一张金绿色的纸"。
   压到 0.80 之后草退到中景，木平台和角色的明度才跳出来。
   **只压 grass / grass2** —— 压暗 sky / wood 会把纵深反着压平。 */
const GRASS_DIM = 0.80;

/* 雪地的地面压暗系数。**雪是唯一不能按 0.80 压的主题。**
   0.80 的 #D6E3F2 会变成 #ABB6C2 —— 一块冷灰水泥，不是雪。
   0.90 之后明度约 205，仍比压过的草地（约 130）亮 75 档，
   角色分离靠描边和木平台的暖色，不靠把地面压黑。
   **只给雪地开这个口子**，其它七套一律 0.80 —— 否则会变成
   "每关都能找到一个理由调参数"，八套就不成一套系统了。 */
const SNOW_DIM = 0.90;

function hexDim(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.min(255, Math.round(((n >> 16) & 255) * k));
  const g2 = Math.min(255, Math.round(((n >> 8) & 255) * k));
  const b = Math.min(255, Math.round((n & 255) * k));
  return "#" + ((1 << 24) | (r << 16) | (g2 << 8) | b).toString(16).slice(1);
}

/** t = 0 → a，t = 1 → b */
function hexMix(a, b, t) {
  const na = parseInt(a.slice(1), 16), nb = parseInt(b.slice(1), 16);
  const ch = (s) => {
    const va = (na >> s) & 255, vb = (nb >> s) & 255;
    return Math.min(255, Math.max(0, Math.round(va * (1 - t) + vb * t)));
  };
  return "#" + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}

/** 同一个颜色、指定的 alpha。做雾带时必须用它 ——
 *  从 #RRGGBB 渐变到 rgba(0,0,0,0)，中间会插出灰黑，雾会变脏。 */
function rgbaOf(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
}

/* 远景的统一冷调。偏青蓝，但不能太蓝（太蓝会像阴天，和"Q 版亮天空"冲突）。 */
const COOL = "#5F86A8";

/** 前景剪影用的墨绿。**刻意保留一点绿**，纯黑("#000")会在低亮屏幕上糊成一块洞；
 *  带一点点绿，它仍然是"叶子"，只是逆光。 */
const INK_LEAF = "#14241A";

for (const _tk of Object.keys(THEMES)) {
  const T = THEMES[_tk];

  /* 草地压一档 + 明度纵深三档
     原来草地 L≈70、我方主体 L≈55，只差一档 —— 灰度下猫和草地糊在一起。
     压 0.86 约等于 L 降 8，主体就跳出来了。
     **只压 grass / grass2，不动 sky / hill / wood**：远山要"淡"（往天空靠），
     平台要"靠描边和投影分离"，压暗它们只会把层次压平。
     压同一个系数，草皮亮面与草地底色的相对关系不变 ——
     两个色各压各的，草皮的"受光"会消失，地面就变成一块平涂。 */
  const gdim = T.snow ? SNOW_DIM : GRASS_DIM;
  T.grass2 = hexDim(T.grass2, gdim);
  T.grass = hexDim(T.grass, gdim);

  /* ---------------- 木材锁定 ----------------
     八关八套主题，但**木头只有一种**。

     原来 wood / wood2 / wood3 跟着主题整组换色相：第 8 关（紫夜）是
     "#8E80CA / #6A5E9E / #C8BEF2"，画出来是**一排紫色胶囊**。
     玩家不会读成"被紫光照着的木板"，只会读成"这不是木头" ——
     这是常识违反，不是风格选择，和"树画成橙色"是同一类错。

     概念图里环境是冷的（背光的蓝绿林荫），人造物是暖的（橙木台），
     靠这个冷暖对立把"能站的地方"从背景里推出来。
     所以木头锁在暖棕，主题只决定**被什么光照着**：
     主题原木色只留 16% 的倾向，冷关偏灰紫、暖关偏橙。

     明度还要跟环境走一档：夜里（天空暗）木头要沉下去，
     否则紫夜关一排暖橙木板会亮得像贴了荧光条。 */
  const WB3 = "#E6C08A";   // 顶面受光
  const WB1 = "#BC8049";   // 顶面主色
  const WB2 = "#7C5029";   // 侧面暗部
  /* 主题只留 22%。再高（试过 0.45）第 8 关又会读出紫色胶囊；
     再低（0.10）八关看起来是同一张图，关与关之间没有温差。 */
  const tint = hexMix(WB1, T.wood, 0.22);
  const skyL = (parseInt(T.sky1.slice(1, 3), 16) * 0.3 +
                parseInt(T.sky1.slice(3, 5), 16) * 0.59 +
                parseInt(T.sky1.slice(5, 7), 16) * 0.11) / 255;
  /* 0.86（夜）~ 1.0（白天）。0.86 是下限：再压木头的板缝就消失了，
     而板缝正是"这是堆叠木板"唯一的证据。 */
  const ambL = 0.86 + 0.14 * Math.min(1, skyL * 1.9);
  T.wood3 = hexDim(hexMix(WB3, tint, 0.30), ambL);
  T.wood = hexDim(tint, ambL);
  T.wood2 = hexDim(hexMix(WB2, tint, 0.34), ambL);

  /* 地面自己也要有纵深：地平线附近发亮（远处受天光照）、画面底部最暗。 */
  const cooled = hexMix(T.grass, COOL, 0.24);
  T.grassLight = hexMix(T.grass2, T.sky2, 0.30);
  T.grassDark = hexDim(T.grass, 0.74);

  /* 远山两档：远的混天空多（更淡），近的混草色多（更实）。
   *
   * 0.48 / 0.72 不是 0.24 / 0.50 —— 混得太少的话山几乎等于天空色，
   * 在暖色主题上（第 4 关：橙黄天空）整片远山直接消失，画面只剩"天 + 地"两块。
   * 空气透视不是"把远山变淡到看不见"，是"变淡但仍能分出三段明度"。 */
  T.hillFar = hexMix(T.sky2, cooled, 0.48);
  T.hillNear = hexMix(T.sky2, cooled, 0.72);
  /* 地平线雾带：天空色里渗一点点草绿，读作"远处的空气"。 */
  T.horizon = hexMix(T.sky2, cooled, 0.14);

  /* 树：近景树和草地同族但更亮，远景树退到远山那一档。
   *
   * **但要往叶绿锚一点（0.30）。** 八关八套色，其中第 4 关（slope）是纯暖橙：
   * 草 "#D9764A"、木 "#C4703E"、山 "#E08A5E"。树的颜色原来完全从草派生，
   * 于是那一关的树是橙褐色的 —— 和山坡、木头同一个色相，光看轮廓读不出"这是树"，
   * 读成"一块鼓包"。
   * 混 0.30 的叶绿之后，暖色关里它是橄榄绿：仍然在这个关的色域里（不跳），
   * 但有"活的东西"这个读法。晚上、紫夜关同理，只会更沉，不会更艳。 */
  const LEAF = "#6FB33F";
  /* 树要**压暗**（0.74），不能跟草地一样亮。
     0.97 的时候近景树和草地同明度，只在轮廓上分开 ——
     换成暖金天空之后更糟：树冠在天空前是一团发亮的浅黄绿，
     读作"天上挂了两个浅色球"。概念图里近景树是深色剪影，
     亮的那一侧靠边缘的暖光，不靠整体提亮。 */
  T.treeNear = hexDim(hexMix(hexMix(T.grass2, LEAF, 0.30), "#FFFFFF", 0.05), 0.74);
  T.treeFar = hexMix(T.treeNear, T.hillFar, 0.28);

  /* 雪地的树**不能从雪面派生**。
     上面的通用算法是 mix(grass2, LEAF) —— 雪地的 grass2 近白，混出的是淡绿白，
     压 0.74 之后是灰绿，读作"一棵掉漆的树"。雪松本来就是深色的：
     **雪压枝头不等于树变白**（这一点和雪面不能压暗是同一条逻辑的反面）。
     压 0.92 而不是 0.74 —— 雪地背景整体亮，树要压得更沉才有剪影；
     远景树混远山的比例也从 0.28 拉到 0.52，让它在雪雾里退得更快。 */
  if (T.snow) {
    T.treeNear = hexDim("#2E5B4A", 0.92);
    /* 远景树混 0.72（通用是 0.28、第一版给雪地也是 0.52）。
       0.52 出来是灰绿的一片，在雪雾里读作"雾霾"而不是"远处的树林" ——
       雪景的远景树几乎只剩蓝灰轮廓，绿色早被雪和空气吃掉了。 */
    T.treeFar = hexMix(T.treeNear, T.hillFar, 0.72);
  }

  T.trunkNear = hexDim(T.wood2, 0.86);
  T.trunkFar = hexMix(T.trunkNear, T.hillFar, 0.45);

  /* 前景灌木：**压到接近剪影**，不只是"暗一档"。
     0.54 出来的是"深绿灌木"—— 它和草地暗部同族，读作"地上长得比较深的草"，
     撑着画面的力气不够。概念图里这一层几乎是黑的（#1E2A1A 级别），
     才把视线从画面边缘推进中场。

     混的色也不能是 COOL（偏青蓝）：青蓝前景压在绿草上会发灰，
     读作"没上色的草"。改混近黑的墨绿 INK_LEAF，压完是暖调的暗，
     和暖金天空、橙木平台在同一色温上。 */
  /* 剪影是"**深**"，不是"黑"。
     0.66 混 + 0.52 压之后，第 1 关（暖金天空、亮绿草地）出来是一整条
     近乎纯黑的带子 —— 读作"画面被黑边切掉一截"，读不出"这是草"。
     混 0.54、压 0.70：仍然是画面里最暗的一层，但看得出是绿、是叶子。
     受光边也提一档（0.22 → 0.34），否则一丛里几片叶子分不出来，只是黑球。 */
  T.shrub = hexDim(hexMix(T.grass, INK_LEAF, 0.54), 0.70);
  T.shrubLit = hexMix(T.shrub, "#FFE9B8", 0.34);

  /* ---------------- 雪地：四处覆写 ----------------
     上面所有派生都建立在「草是绿的、土地是褐的」这个前提上。雪地一条都不成立，
     所以不是调参数能解决的 —— 必须按"雪"的物理重算。

     **集中写在循环末尾一处**，不散到各自的算法里：八套主题共用一套派生流程，
     雪地是唯一的例外分支，例外越集中越不容易在下一次改动时漏掉。

     ① 远山：通用是 mix(sky2, cooled)，雪地 sky2 与 grass 都近白 → 混出白，
        远山整片消失。雪景的纵深**全靠远山那点冷蓝**，所以直接锁蓝灰。
     ② 地平线雾带同理，混一个淡蓝才有"远处空气"。
     ③ 地面最暗档：通用 hexDim(grass, 0.74) 把雪压成 #9EA6B2 —— 一块沥青路面。
        雪的"暗部"是**背光的雪**，是蓝的、不是灰的。改成压得极轻再混冷蓝。
     ④ 前景灌木：通用是把草地混墨绿压暗 → 深绿灌木。雪地里长深绿灌木丛
        读作"没扫干净的落叶"。改成冷白 —— 形状语言现成的，白色就是雪堆。
        **受光边保持最亮**，否则雪堆会糊成一个白团。 */
  if (T.snow) {
    T.hillFar = hexMix(T.sky2, "#7E9BBE", 0.42);
    T.hillNear = hexMix(T.sky2, "#6C8CB2", 0.62);
    T.horizon = hexMix(T.sky2, "#C8D8EA", 0.50);
    T.grassDark = hexMix(hexDim(T.grass, 0.92), "#8FA6C4", 0.38);
    T.shrub = hexMix("#DCE8F6", "#93AACB", 0.42);
    T.shrubLit = "#F4FAFF";
  }
}

   ----------------------------------------------------------------------------
   用户 2026-10-25：「深巢无尽模式 我需要改变地形 需要改变新鲜感」。
   设计见 docs/Legion-深巢地形生成设计_20261025.md，这里是 N1：
   **不含参数扰动**（用户已拍板「N1 先不含参数扰动，机器人绿了再加」）。

   一条铁律：**不从零随机几何**。每一块台、每一条坡、每一个坑的参数都来自
   27 屏里真实跑通过的几何 —— 生成器只做"重新组装"，不做"新造"。
   从零随机会同时炸物理、寻路、机器人三条线（设计文档 §7：明确不做）。

   为什么"重排原语"不够（设计文档 §1 的判定）：27 屏里坡只有 6 条、
   营地 27/28 在 x≈852，重排只是洗牌 152 个平台，玩家第 3 层就认出
   「哦还是那些台子」。所以四个零风险手段必须同时上：
     ① 整屏镜像（营地 27/28 从没在左边 → 立即是没见过的画面）
     ② 主题轮换（纯皮肤，物理一个数不动）
     ③ 波次配方（waves 是纯数据）
     ④ 危险密度（坑的数量随深度开放）
   手段 ① 的代价是零：镜像后 WALL_L/WALL_R 与地面段完全对称。

   每个候选都要过 C1~C6（设计文档 §4），不过就换种子重抽；
   20 次仍不过就退到"最简版"——那个版本几何上不可能不过。
   ========================================================================== */

const NEST = {
  /* 活动区宽度。主线是 WALL_L 26 → WALL_R 934，可走 908；深巢砍到 **640**
     （用户 2026-10-25 拍板「活动区砍到 640」）。
     砍下来的 268 分到两侧岩壁（各 134），不是靠边站 —— 井居中，镜像后
     还是自己（(960-800)=160、960-160=800），所以 nestMirror 的
     `x' = W - x - w` 在井坐标系里仍然成立。
     为什么"窄"是深巢的立身之本：主线的乐趣是**长途**（把兽从 x=90 推到
     x=852，600px 的规划），深巢反过来 —— 494px 的推送距离里塞 3~5 个坑
     和两层台，一球卷三只靠的不是滚得远，是**选顺序**。
     同一个推力参数，两套距离 = 两种游戏。 */
  W: 640,
  /* 井的左缘 / 右缘。生成器全用这两个，不用全局 WALL_L/WALL_R ——
     生成发生在 enterNest 里，那时墙还没切过来，读全局会拿到主线值。 */
  get L() { return Math.round((W - this.W) / 2); },      // 160
  get R() { return this.L + this.W; },                   // 800
  /* ---- 深巢自己的台层表：4 层、层距 110 ----
   *
   * 上一版直接借用主线的 `462 / 350 / 248`，理由是"改它 = 造新物理几何"。
   * 那是**当时**对的：借来的层 y 让深巢复用主线的台宽/台位分布，
   * 一次就通。但它也是"深巢像主线换皮"的最后一条硬证据 ——
   * 玩家在两款游戏里看到的台阶高度、层数完全一样（2026-10-26 用户：
   * 「空间设计 玩法最好更加创新」）。
   *
   * 现在按设计文档 §2.3 摊成 **4 层、层距 110**：
   *   556(地面) → 446 → 336 → 226 → 116
   * 层距 110 / 球直径 46 = 2.4，球在层间通过时留得出余量（文档给的比例）。
   *
   * **主线一个字节都不动**：主线的台 y 写在 `LEVELS[].plats` 里，
   * 是 27 屏手摆几何的一部分，机器人、星靶落点、`best[]` 全按它调过。
   * 这张表只被 `nestBuildRaw` / `nestSimpleLevel` 读 —— 换掉它等于
   * "只重排深巢的地形"，这正是 ACTIVE 表切换那一套能成立的原因。
   *
   * 最顶层取 116 而不是 6：洞顶岩体画到 y≈90、钟乳石最长下垂 234，
   * 116 是"还看得见天、又已经贴到洞顶"的那一档。再往上就是钻岩层里了。
   *
   * **不许在这里加第 5 层。** 116 - 110 = 6 已经越过洞顶；
   * 真要 5 层必须先把 GROUND_Y 或层距改小，那是另一轮的事。 */
  LAYERS: [446, 336, 226, 116],
  /* 层距，写给 `nestCheck` 与机器人当口径用（不从数组差值反推，
     免得以后改成不等距时断言悄悄失效）。 */
  LAYER_GAP: 110,
  CAMP_W: 82,
  /* 坑宽上限 140 是 27 屏里最宽的坑，机器人能跳过去；再宽就不是"跳得过去
     的障碍"而是"必须走台"的另一种关卡设计，不在这里做。 */
  PIT_MIN: 80, PIT_MAX: 140,
  PIT_GAP: 120,        // C4：相邻坑缘间距下限
  SPAWN_CLEAR: 100,    // C6：出生点净空
  CAMP_CLEAR: 160,     // C2a：营地前净空（球滚进营地前不许有坑）
  RAMP_W: 246,         // 110 落差下 2.24H，峰值 ≤25°（层距从 94 加到 110，坡跟着加长）
  MAX_TRIES: 20,
  /* 坡是稀缺件：主线 27 屏只有 6 条，当"这一层有个坡"的事件用，
     不当标配（设计文档 §2：浅层 30%、深层 80%）。 */
  RAMP_P: (d) => Math.min(0.8, 0.3 + d * 0.04),
};

/* ---- 深巢配色：三套"地底"语汇，按深度轮换 ----
 *
 * **为什么必须另起一套，不能沿用主线那 8 套再压暗**（2026-10-25 用户：
 * 「深巢的场景肯定不能沿用之前的啊」）。那 8 套全是**地表**：亮色的天空、
 * 云、远山、树线、草地。压暗之后玩家看到的不是"地底"，是"傍晚的森林" ——
 * 同一款游戏换个时间而已。地底要成立，得换掉三件事：
 *
 *   ① **没有天空**。画面上缘必须是岩体，不能是亮色。
 *   ② **光从下往上**。主线的光源在右上（斜阳），地底的光在脚下。
 *   ③ **地面不是草**。是碎石、岩屑、被水冲过的砂。
 *
 * 木台（wood 系）刻意**保持暖色且不压暗**。它是落脚面，可读性优先于氛围；
 * 而且"墨色岩壁之间一排暖木架"本来就是"井下的人工结构"，
 * 是设定的一部分，不是妥协。
 *
 * 三套只差底光色和岩层色相：熔岩洞（橙红）/ 苔窟（菌绿）/ 晶洞（冷蓝）。
 * 相邻层不会撞色（depth 递增取模）。 */
const NEST_THEMES = [
  { id: "ember",   rock: "#1C1410", rockLit: "#2E211A", ground: "#3B3630",
    groundLit: "#4A443C", soil: "#322A24", soilDeep: "#1D1812",
    wood: "#B0763E", woodDeep: "#7A4E2A", woodLit: "#E0B078",
    glow: "#FF7A3C", haze: "#5A3A26" },
  { id: "moss",    rock: "#1A211C", rockLit: "#28312A", ground: "#343530",
    groundLit: "#41423B", soil: "#2A2B26", soilDeep: "#181915",
    wood: "#A87240", woodDeep: "#6E4828", woodLit: "#D8AC74",
    glow: "#7FE0A0", haze: "#3A5244" },
  { id: "crystal", rock: "#171C26", rockLit: "#252C3A", ground: "#35373E",
    groundLit: "#43454D", soil: "#2B2D34", soilDeep: "#171A20",
    wood: "#AC7248", woodDeep: "#74492C", woodLit: "#DCB080",
    glow: "#7FC8F0", haze: "#33445E" },
];

/** 第 depth 层的地底配色，摊平成和 THEMES 一样的字段名 ——
 *  平台 / 地面 / 斜坡的绘制代码全部读 TH.xxx，摊平之后**一行都不用改**。
 *  （这就是"换主题 = 换场景"能成立的原因：绘制侧只认字段名，不认题材。） */
function nestTheme(depth) {
  const d = Math.max(1, depth | 0);
  const b = NEST_THEMES[(d - 1) % NEST_THEMES.length];
  return {
    sky1: b.rock, sky2: b.rockLit, cloud: b.rockLit,
    hill1: b.rock, hill2: b.rockLit,
    grass: b.ground, grass2: b.groundLit,
    dirt: b.soil, dirt2: b.soilDeep,
    wood: b.wood, wood2: b.woodDeep, wood3: b.woodLit,
    accent: b.glow,
    grassLight: b.groundLit, grassDark: b.soil,
    hillFar: b.rock, hillNear: b.rockLit,
    horizon: b.haze,
    /* `soilDeep` 是深巢场景自己的字段（碎石/裂纹的暗色），主线没有；
       `night` 主线用它切"夜晚"那一套亮度，深巢不走那条分支，但它必须存在 ——
       漏一个字段的后果不是"颜色差一点"，是 `rgbaOf(undefined)` 直接抛错，
       而抛错发生在 `drawForest` 之后：**背景画完、平台和 HUD 全没了**，
       截图上看是"一张没有角色的风景图"，很容易被当成"还没画完"。 */
    soilDeep: b.soilDeep,
    night: false,
    treeNear: b.rock, treeFar: b.rockLit,
    trunkNear: b.soil, trunkFar: b.soilDeep,
    shrub: b.soilDeep, shrubLit: b.soil,
  };
}

const NEST_PIT_KINDS   = ["fire", "mud", "water"];

/* ============================================================================
   3.4a-2 雾巢：迷雾 + 巢室生态（2026-10-27）
   ----------------------------------------------------------------------------
   用户两句话：「现在这个关卡的怪物都一样啊」「可以做一个下探的关卡
   有迷雾啥的 探索性的 你发挥下想象 创造力」。

   这两条其实是同一个病：**每一层抽的是同一个池子，而且一进场全亮着**。
   池子一样 → 第 3 层和第 30 层站的是同一批虫子；全亮 → 玩家不需要
   "摸过去看看那边是什么"。所以雾不是装饰，它是把这两条缝起来的东西：

     · 看不见的地方，你连对面站的是什么都不知道（只看得见两点眼睛）
     · 照亮它需要动作：走过去（随身灯），或者把球推过去（球就是火）
     · 每层的巢室类型不同 → 池子本来就不同 → 照亮之后看到的也不一样

   ⚠ **随机数**：雾 / 巢室 / 菌光囊全部走独立的 `RF` 流（seed 异或一个盐）。
     在 `R()` 上多抽一次，后面 60 层地形会整体重排 ——
     设计文档第五章记过这个坑，代价是机器人通关率 15/18 → 10/18。
     `tools/_nest-hash.js` 是这条的守门人：改完哈希必须和基线一致。
   ========================================================================== */
const NEST_FOG = {
  /* 格子 16px。为什么栅格化：光照是"每个点被照到多少"的场，
     逐格算 O(1160)，逐像素算 O(29 万) —— 前者一帧都不到 0.1ms。
     附带好处：40×29 的低分辨率掩码放大到 640×460 时，双线性插值天然把
     边缘糊成雾的过渡，不需要额外做噪声撕裂。 */
  cell: 16,
  /* 雾只盖**井内**（160..800 / 96..556）。井外的岩壁保持可见 ——
     它是画面的画框，糊掉之后玩家连"这是口井"都读不出来。 */
  Y0: 96,
  /* 三档。浅层先教"这里有雾"，深层才收灯：
       1–5   未探 0.94 / 记忆 0.44 / 灯 240
       6–15  未探 0.96 / 记忆 0.52 / 灯 200
       16+   未探 0.97 / 记忆 0.60 / 灯 175

     **深度这条轴上，真正变的是"记忆"和"灯"，不是"未探"。**
     未探三档 0.94→0.97 几乎一样（那一档已经是"黑"了，再黑没地儿去）；
     而记忆 0.44→0.60 是"走过的地方你还记得多少"，
     灯 240→175 是"你能提前看多远" —— 这两条才是深层更难的原因。

     第一版给的是 0.62/0.26，出手就是"整屏只是变暗了一点"——
     测量过：走过的地方和没走过的在像素上只差 25 级亮度（20~58），
     而人眼在暗底上要 ~40 级才读得出"这是两个不同的地方"。
     所以未探必须压到接近全黑，记忆值要抬到"看得见轮廓但明显比脚下暗"。
     `seen` 是"走过、但此刻没照着"的记忆值。它必须**明显低于**未探，
     否则玩家分不清"这片我看过"和"这片我没去过"，雾就只是整屏变暗。 */
  TIERS: [
    { max: 5,  unseen: 0.94, seen: 0.44, lamp: 240, ball: 258 },
    { max: 15, unseen: 0.96, seen: 0.52, lamp: 200, ball: 238 },
    { max: 99, unseen: 0.97, seen: 0.60, lamp: 175, ball: 222 },
  ],
  /* 菌光囊：探索的落点。走上去或球撞上就炸开 → 永久点亮一片 + 孢子收成。
     放在雾里而不是放在亮处，是因为"发现"必须先有"看不见"。 */
  POD_W: 38, POD_H: 46, POD_R: 168, POD_FOOD: 2,
  /* 离裂缝的最小净距。**生成器和 nest-check 必须读同一个数** ——
     上一版生成用 44、断言用 50，于是每一层都在边界上红（实测 482 条），
     而地形本身是对的，只是两处各写了一个魔数。 */
  POD_CHASM: 50,
};

/** 第 depth 层的雾档。传进来的深度是 1 起的层号（`S.nest.depth`）。 */
function nestFogTier(depth) {
  const d = Math.max(1, depth | 0);
  let t = null;
  for (const x of NEST_FOG.TIERS) if (d <= x.max) { t = x; break; }
  if (!t) t = NEST_FOG.TIERS[NEST_FOG.TIERS.length - 1];
  if (!modOn("gloom")) return t;
  /* 「重雾」（深 25）在**当前档上再压**，而不是"按更深的档算"。
   *
   * 第一版写成 `q = d + 10` 再查表，结果这条词条**完全无效** ——
   * 三档的上限是 5 / 15 / 99，16 层以后已经全部落在最后一档，
   * 加 10 层还是最后一档（实测 d20 和 d25 的灯都是 175）。
   * 而它偏偏在 25 层才解锁，也就是**永远不起作用**。
   * 档位表是用来描述"深度段"的，不能拿它表达"在同一段里再难一档"。
   */
  return {
    max: t.max,
    unseen: Math.min(1, t.unseen + 0.02),
    seen: Math.min(1, t.seen + 0.06),
    lamp: Math.round(t.lamp * 0.8),
    ball: Math.round(t.ball * 0.9),
  };
}

/* ---- 词条：每 5 层改一条**规则**（2026-10-27）----
 *
 * 60 层如果是 60 次"地形换个样"，第 20 层和第 5 层的差别只是
 * "这个窝我好像见过"。词条改的是**规矩**：推力、额度、视野、肚子、球寿命 ——
 * 玩家在深 15 学会的打法，深 16 要重新想一遍。
 *
 * **只碰运行时参数，不碰生成器。** 这是硬约束：
 * `nestBuildRaw` 里多抽一个随机数，60 层地形会整体漂移，而
 * `tools/_nest-hash.js` 的地形哈希是"这一层在哪"的唯一证据。
 * 所以设计文档里「敌人翻倍」那条**没有照抄** —— 它必须改波次生成。
 * 六条全部落在"生成之后才读的运行时参数"上，地形与波次哈希一个字都不动。
 *
 * **一条词条只改一处。** 每个效果都挂在那个参数的唯一出口上：
 *   沉石 → `pushPowerNow()`（推球和预瞄线共用它，所以线不会骗人）
 *   窄喉 → `ballBudget()`        盲眼 → `drawAim()`
 *   饥肠 → `bellyCost()`         重雾 → `nestFogTier()`
 *   空心 → `ballLife()`
 *
 * `skip` 是**这一趟**花多少巢币让它不生效。为什么是"这一趟"而不是永久：
 * 永久关掉等于把深层买回浅层的难度，词条就不再是"贪的代价"。
 */
const NEST_MODS = [
  { id: "heavy",  depth: 5,  name: "沉石", desc: "推球力度 −15%",    skip: 40 },
  /* 「窄喉」（球额度 −2）第一版在这里，**但它对深巢完全无效** ——
     深巢的目标只有 collect / clear，`ballLimit` 恒为 null（限球是主线
     那几屏的专属目标），`ballBudget()` 判到 null 直接返回 Infinity，
     `−2` 根本没机会执行。实测：60 层 × 10 种子，球额度**全部是 ∞**。
     换成「厚甲」：敌人多糊一层才变球。它对**每一层**都生效，
     而且是真的玩法变化（要贴得更久、喷得更多次，风险更高），不是拖时间。 */
  { id: "thick",  depth: 10, name: "厚甲", desc: "敌人多糊一层才变球", skip: 50 },
  { id: "blind",  depth: 15, name: "盲眼", desc: "预瞄线不显示",     skip: 60 },
  { id: "hunger", depth: 20, name: "饥肠", desc: "每层掉饱 ×1.5",    skip: 70 },
  { id: "gloom",  depth: 25, name: "重雾", desc: "灯更小、记忆更糊", skip: 80 },
  { id: "hollow", depth: 30, name: "空心", desc: "球滚过的路短 30%", skip: 90 },
];

/** 第 depth 层会生效的词条（**不含**这一趟花币跳过的）。
 *  纯函数：只读 `S.nest.skip`，不改任何东西 —— 冒烟能直接喂深度验。 */
function nestModsAt(depth) {
  const d = Math.max(1, depth | 0);
  const skip = S.nestSkip || [];
  const out = [];
  for (const m of NEST_MODS) {
    if (d >= m.depth && skip.indexOf(m.id) < 0) out.push(m);
  }
  return out;
}

/* ---- 巢币：深巢唯一的经济产出 ----
 *
 * 为什么是**超线性**（`2d + d²/30`）而不是"每层固定 2 枚"：
 * 线性的话，"深 20 打一趟"和"深 10 打两趟"收益完全一样，而后者明显更省力
 * （浅层词条少、地形熟）。超线性才让"再深一层"这件事有溢价 ——
 * 而溢价正是"贪"的动机。实测：深 10 = 23 枚，深 20 = 53 枚，深 30 = 90 枚。
 *
 * 为什么按**新到达的最深层差额**发（而不是每趟按当前层数发）：
 * 否则玩家在第 5 层反复重开就能无限刷 —— 这和后巢币时代的"通胀 6.5×"
 * 是同一个病。差额口径下，深 5 刷十趟给的币还是 0。
 */
function nestCoinAt(d) {
  const x = Math.max(0, d | 0);
  return x * 2 + Math.floor((x * x) / 30);
}

/** 某条词条此刻在不在生效。**主线恒 false**（S.nest 为 null），
 *  所以主线不需要为词条写一行判断。 */
function modOn(id) {
  const mods = S.nest && S.nest.mods;
  if (!mods || !mods.length) return false;
  for (let i = 0; i < mods.length; i++) if (mods[i].id === id) return true;
  return false;
}

/* ---- 巢室生态：每层一个"这里住着什么" ----
 *
 * 光调怪物密度不够。上一版的池子是全局的（bug/bug/spider + 按深度解锁），
 * 于是 1~4 层永远是"两只 bug"，玩家第 2 层就得出"深巢的怪都一样"。
 *
 * 巢室类型把"这一层的池子"和"这一层叫什么"绑在一起，两个作用：
 *   ① 同一层的怪**成组出现**（蛛巢里全是细腿的，卵房里有蛾），
 *      读起来是"进了一个窝"，而不是"随机刷了几只"
 *   ② 玩家在 HUD 上看得见名字 → 有预期 → 第 7 层和第 8 层是"两个地方"
 *
 * `pool` 里的顺序不重要（生成时按波次内序号轮转，见 nestBuildRaw），
 * `pods` 是这一类的菌光囊数量 —— 菌圃囊多，是因为它就是"长菌的地方"。
 *
 * **深度门槛写在 `nestBroodPool` 里，不写在表里**：同一张表要能被
 * 浅层复用（浅层把 moth/vein 过滤掉，剩下的还是合法池子），
 * 门槛散在表里的话，"菌圃在 3 层还剩下什么"就没法一眼看出来。 */
const NEST_BROODS = [
  { id: "web",     name: "蛛巢", pool: ["bug", "spider"],         pods: 2 },
  { id: "shell",   name: "石室", pool: ["bug", "shell"],          pods: 2 },
  { id: "nursery", name: "卵房", pool: ["bug", "spider"],         pods: 3 },
  { id: "fungus",  name: "菌圃", pool: ["bug", "moth"],           pods: 3 },
  { id: "vein",    name: "地脉", pool: ["bug", "vein", "shell"],  pods: 2 },
];

/** 一张巢室表在这一层**实际**能刷什么，以及它这一层够不够"有花样"。
 *
 *  门槛从原来的 5/9/14 降到 1/4/8。为什么要降：**解锁太晚是"怪物都一样"
 *  的另一半原因** —— 石壳到第 5 层才出现，而多数人第 2~4 层就下了判断。
 *  三只的排序按"规则好不好懂"来，不按"谁更酷"：
 *    石壳 1 层   只有一条规则（只会往下滚），四只新怪里最好懂
 *    巢蛾 4 层   要求玩家先明白"球是火"（雾一上来就把这条讲了）
 *    脉虫 8 层   窗口怪（每 4 秒探头 2 秒），最晚
 *
 *  `usable` 返回去重后的种类数。**少于 2 的巢室会被跳过**（见 nestBuildRaw）：
 *  第一层如果抽到"菌圃"，而蛾 4 层才开，这个巢室的池子就只剩 bug ——
 *  名字写着菌圃、里面全是毛虫，那比不做巢室更糟。 */
function nestBroodPool(brood, depth) {
  const d = Math.max(1, depth | 0);
  const ok = (k) => {
    if (k === "bug" || k === "spider") return true;
    if (k === "shell") return d >= 1;
    if (k === "moth") return d >= 4;
    if (k === "vein") return d >= 8;
    return false;
  };
  const p = (brood && brood.pool ? brood.pool : []).filter(ok);
  return p.length ? p : ["bug", "spider"];
}

/** 这一层能抽的巢室（池子里至少 2 种）。 */
function nestBroodsAt(depth) {
  const list = NEST_BROODS.filter(b => {
    const u = {};
    for (const k of nestBroodPool(b, depth)) u[k] = 1;
    return Object.keys(u).length >= 2;
  });
  return list.length ? list : [NEST_BROODS[0]];
}

/* ---- 构件库：从 27 屏真实几何里收集，一条都不新造 ----
 * **按"层号"索引，不按 y 索引。**
 *
 * 上一版用 y 当键（`ledges[462]`），因为那时深巢直接借用主线的三层 y。
 * 现在深巢有了自己的层表（`NEST.LAYERS` = 446/336/226/116），
 * 拿 y 当键的话库一条都对不上 —— 每层都退化成"没有候选台"，
 * 于是每一层都被重抽 20 次然后落到兜底最简版（`nest-check` 会看到
 * 重抽峰值直接顶到 20）。
 *
 * 所以统一成**层号 k**：k=0 是离地面最近的那层台（主线 462 / 深巢 446），
 * k=1 主线的 350 / 深巢 336，**k=2 对应主线的 248，k=3 复用 k=2 的料**
 * （248 是最顶层，宽度分布最接近"贴着洞顶那一层"）。
 * 这样"台是从真实关卡里搬来的"这条性质不变，只是搬的时候换了高度。 */
const NEST_LIB = (function () {
  const MAIN_K = { 462: 0, 350: 1, 248: 2 };
  const ledges = [[], [], []];
  for (const L of LEVELS) {
    for (const p of (L.plats || [])) {
      if (p.kind !== "ledge") continue;
      const k = MAIN_K[p.y];
      if (k != null) ledges[k].push({ x: p.x, w: p.w });
    }
  }
  /* 库层号：深巢第 k 层去哪个库取料。k=3 没有对应料，复用最顶层。 */
  const KIT = [0, 1, 2, 2];
  return { ledges: ledges, kitOf: (k) => KIT[Math.min(k, KIT.length - 1)] };
})();

/** 确定性伪随机（mulberry32）。**不能用 Math.random** ——
 *  同一层要能复现：玩家重进第 7 层必须还是那一层，否则"记住地形"这件事不存在，
 *  而记忆地形正是无尽模式的乐趣来源之一。 */
function nestRand(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 第 depth 层的主题**名**（写进 L.theme，记录用）。
 *  上一版从主线 8 套里随机挑一套 —— 那是"换皮肤"，而深巢要的是"换地方"。
 *  现在名字直接来自 NEST_THEMES，和 nestTheme() 同一个索引：
 *  名字和配色**不可能对不上**（两处各算一次取模，早晚会差一层）。 */
function nestThemeOf(depth) {
  const d = Math.max(1, depth | 0);
  return "nest-" + NEST_THEMES[(d - 1) % NEST_THEMES.length].id;
}

/** 把主线坐标的台子搬进 640 井里：**位置按比例缩，宽度原样保留**。
 *
 *  为什么宽度不缩：台宽决定"上面站不站得下一只虫"（席位要 140），
 *  按 640/908 = 0.70 缩的话，350/248 层那些 154 / 174 的台会变成
 *  108 / 122，一只都站不下 —— 而这两层本来就是靠宽度承接弹道的。
 *
 *  为什么位置按比例：库里的台有一个真实分布（大量贴着左墙 x=26、
 *  少数在中段），按 rel = (x-26)/908 映射能把这个分布原样带过来。
 *  直接 clamp 的话所有贴墙的台会全部堆在井左缘，一层里三块台叠在一起。
 *
 *  宽度上限 `NEST.W - 80`：留两侧各 40。**不能取到 W-40** —— 那样
 *  794 那种整条长台会变成"左右都贴墙"，撞上 C3 顶死墙角，从此每层
 *  都被重抽掉。560 = 640-80 是"能当长球道、但左右至少各留 40"的值。 */
function nestFit(x, w) {
  const cap = NEST.W - 80;
  const ww = Math.min(w, cap);
  const slack = NEST.W - 40 - ww;                       // >= 40
  const rel = clamp((x - WIDE_L) / (WIDE_R - WIDE_L), 0, 1);
  return { x: Math.round(NEST.L + 20 + rel * slack), w: Math.round(ww) };
}

/** 整屏镜像：x' = W - x - w。WALL_L/WALL_R 与地面段完全对称，
 *  所以镜像后一片台都不会出画 —— 这就是它"物理风险为零"的原因。 */
function nestMirror(L) {
  const fx = (x, w) => W - x - w;
  L.plats = L.plats.map(p => Object.assign({}, p, { x: fx(p.x, p.w) }));
  L.pits = L.pits.map(p => Object.assign({}, p, { x: fx(p.x, p.w) }));
  L.ramps = L.ramps.map(r => Object.assign({}, r, { x: fx(r.x, r.w) }));
  /* 坡的 yL/yR 是"左端高还是右端高"——镜像后必须**交换**，
     否则镜像出来的坡会从地面往天上爬。 */
  L.ramps.forEach(r => { const t = r.yL; r.yL = r.yR; r.yR = t; });
  L.camp = Object.assign({}, L.camp, { x: fx(L.camp.x, L.camp.w) });
  L.spawn = Object.assign({}, L.spawn, { x: W - L.spawn.x });
  /* 裂缝也必须镜像（2026-10-27 补）。**这是一条真实的漏**：
     `nestMirror` 从加进来那天起就只翻台/坑/坡/营地/出生点/敌人，
     裂缝是 10-26 才有的，加的时候没回来补这一行。
     后果不是"缝位置难看"，而是**坐标系分裂**：镜像层里营地翻了、
     出生点翻了、敌人翻了，只有缝还在原来的 x 上 ——
     所以"出生点到第一道缝 103px"这种由对称性保证的性质，在镜像层里全是假的。
     雾巢的菌光囊要按"离缝多远"摆，第一个撞上的就是它。
     镜像对**所有相对距离都是等距变换**，所以 C7c/C7e/C8 一条都不会变。 */
  L.chasms = (L.chasms || []).map(c => Object.assign({}, c, { x: fx(c.x, c.w) }));
  /* 菌光囊是 2026-10-27 加的，必须一起镜像 —— 漏了的话镜像层里
     "营地到左边了、囊还全在右边"，前三层的探索落点会挤在同一个角。 */
  L.pods = (L.pods || []).map(p => Object.assign({}, p, { x: fx(p.x, p.w) }));
  /* 敌人也镜像：不镜像的话，镜像层里敌人全挤在营地那头，
     第一波就贴脸 —— 那是"镜像"这个手段最容易带出来的副作用。 */
  L.waves = L.waves.map(w => w.map(f => {
    const o = Object.assign({}, f);
    if (o.x != null) o.x = W - o.x;
    return o;
  }));
  return L;
}

/** 装配一个候选（未校验）。坐标全在"营地靠右"的坐标系里算，最后统一镜像。 */
function nestBuildRaw(depth, seed) {
  const R = nestRand((seed ^ (depth * 7919)) >>> 0);
  const rnd = (a, b) => a + R() * (b - a);
  const ri = (a, b) => Math.floor(rnd(a, b + 0.999));
  const pick = (arr) => arr[Math.floor(R() * arr.length)];

  /* **这一行必须吃掉一次随机数**，哪怕主题名已经不需要它。
   *
   * 上一版 `nestThemeOf(depth, R)` 内部用 `R()` 抽主题；改成"主题由深度决定"
   * 之后，这里少消耗一次 —— 后果不是"主题变了"，是**后面每一次 rnd()
   * 都前移一位**，等于把 60 层地形整个重排了一遍。
   * 实测代价：机器人通关率 15/18 → 10/18（地形漂移，而新序列没验证过）。
   *
   * 地形是"同一层每次长一样"这个玩法的载体（记住地形是无尽模式的乐趣），
   * 它不该因为一次改配色而整体漂移。所以把这次消耗**显式保留**，
   * 并命名成变量，免得以后被人当成无用代码删掉、再漂一次。 */
  const themeSalt = R();
  void themeSalt;
  const theme = nestThemeOf(depth);
  /* ---- 雾巢的独立随机流（2026-10-27）----
   * 巢室、菌光囊全部从这里取，**一次都不许碰上面的 `R()`**。
   * 理由见 NEST_FOG 顶部：多抽一次，60 层地形整体前移一位。 */
  const RF = nestRand((seed ^ 0x9E3779B1) >>> 0);
  /* 巢室只在**这一层真的有料**的那几张里抽（池子去重后 ≥ 2 种）。
     不筛的话，第 1 层抽到"菌圃"而蛾要 4 层才开，那一层就叫着菌圃、
     里面全是毛虫 —— 名字和内容对不上，比不做巢室更糟。 */
  const broodList = nestBroodsAt(depth);
  const brood = broodList[Math.floor(RF() * broodList.length)];
  /* 营地贴**井**右壁，不是贴画面右缘 —— 640 之后这两件事差 134px。
     写 WALL_R 的话营地会掉到井外，球永远推不到（而画面上营地还在那儿）。 */
  const campX = NEST.R - NEST.CAMP_W;
  /* 出生点离井左壁 64 = 人宽 46 + 18 呼吸。写死 90 的话，
     地面从 160 才开始，人会一开始就悬在井外往下掉。 */
  const spawnX = NEST.L + 64;

  /* ---- 地面：恒一整段（坑是"挖在地面里"，不是把地面切成几段）---- */
  const plats = [{ x: NEST.L, y: GROUND_Y, w: NEST.W, h: 44, kind: "ground" }];

  /* ---- 台层：按深度开放层数，每层从库里抽 1~2 条 ----
   * 抽中的片段保留它**自己原本的 w** —— 那是真实关卡里验证过的宽度，
   * 我只做"同层不重叠"这一道筛。
   *
   * 层数从 2 层起（上一版是 1 层）：`NEST.LAYERS` 是 4 层表，浅层只开
   * 底下 2 层就够"有个落脚面 + 有个高处"，一口气全开会让第 1 层就长成
   * 满屏台 —— 而第 1 层是**第一次进深巢的那一屏**，它要回答的是
   * "这里和主线不一样"，不是"这里很挤"。
   *
   *   depth 1–5   2 层（446 / 336）
   *   depth 6–15  3 层（+ 226）
   *   depth 16+   4 层（+ 116，贴着洞顶）
   */
  const topK = depth >= 16 ? NEST.LAYERS.length - 1 : depth >= 6 ? 2 : 1;
  for (let k = 0; k <= topK; k++) {
    const y = NEST.LAYERS[k];
    /* 最底那层给 1~2 条（坡和地面兵站都靠它），上层一律 1~2 条但偏 1 条 ——
       4 层全抽满 = 8 块台叠在 640 宽里，机器人会在层间反复落下去。 */
    const want = k === 0 ? ri(1, 2) : (R() < 0.55 ? 1 : 2);
    const kit = NEST_LIB.kitOf(k);
    const placed = [];
    let guard = 0;
    while (placed.length < want && guard++ < 40) {
      const cand = pick(NEST_LIB.ledges[kit]);
      if (!cand) break;
      /* 先搬进井里，再做"同层不重叠"的筛 —— 顺序反过来是在**主线坐标**
         上判重叠，搬完可能又叠上了（rel 把不同 x 压到相近位置）。 */
      const fit = nestFit(cand.x, cand.w);
      /* 同层留 30 间隙：两块台贴在一起就是一块长台，抽两条没意义 */
      const clash = placed.some(u =>
        !(fit.x + fit.w + 30 <= u.x || u.x + u.w + 30 <= fit.x));
      if (clash) continue;
      placed.push({ x: fit.x, y: y, w: fit.w, h: 20, kind: "ledge" });
    }
    plats.push.apply(plats, placed);
  }

  /* ---- 坡：从 462 台滑到地面。位置由台决定，不由随机决定 ----
   * 为什么只做"462 ↔ 地面"这一种落差：这是主线 6 条坡里唯一同时满足
   * 「坡顶接台、坡底落地、不钻台底」的形态，另外几条各有各的前提。
   * 深巢第一版不赌第二种。
   *
   * **两个方向都要试。** 库里的台大量贴着右墙（x+w 常等于 934），
   * 只从右端往右下伸的话，坡几乎永远抽不出来。左坡合法：
   * rampSurfY 只认 yL/yR，球往哪边滚由两端高度差决定，与"往哪边下降"无关。
   *
   * **坡在坑之前生成**（上一版是坑在前，结果 40 层里只有 3 层有坡）：
   * 坡是稀缺件（主线 27 屏只有 6 条），它的落脚点是"必须留出来"的，
   * 坑才是可以挪的。顺序反过来，坡的落点每次都被坑占掉，
   * 于是"这层有个坡"这个事件基本不发生 —— 而那正是新鲜的来源之一。 */
  const ramps = [];
  if (depth >= 3 && R() < NEST.RAMP_P(depth)) {
    /* 坡顶接**最底下那层台**（`NEST.LAYERS[0]` = 446），不是写死的 462 ——
       462 是主线的数，深巢换层表之后它一块台都对不上，坡就永远抽不出来
       （而且不会报错，只是"这层没有坡"，肉眼完全看不出来）。 */
    const baseY = NEST.LAYERS[0];
    const bases = plats.filter(p => p.y === baseY && p.kind === "ledge");
    /* 坡的上方不许有台：C5 判的是"坡身钻台底"。
       层距从 154（230/248 那种疏排）压到 110 之后，同一段 x 上方
       很可能压着 336 / 226 层的台 —— 坡照样能走（玩家头顶 406 高于
       336 的台底），但**判据是按"坡的 x 区间全覆盖"算的**，过不去就重抽。
       与其放宽 C5（那是主线的安全网），不如在候选阶段就筛掉。 */
    const covered = (rx, rw) => plats.some(p =>
      p.kind === "ledge" && p.y < baseY - 4 &&
      p.x < rx + rw && p.x + p.w > rx);
    const rampHi = NEST.R - 104;      // 右端要给第一道缝（96 宽）让出来
    const cands = [];
    for (const b of bases) {
      /* 坡必须整段落在井内：坡身出井 = 一半悬在岩壁里，读作"木头插进石头"，
         而且球滑到坡底正好撞墙。上界不取 NEST.R：右端 96 是送走点裂缝，
         坡伸进去就是"坡从缝上飞过去"（C7c 会红）。 */
      const rx = b.x + b.w, rx2 = rx + NEST.RAMP_W;
      if (rx2 <= rampHi && !covered(rx, NEST.RAMP_W)) {
        cands.push({ x: rx, w: NEST.RAMP_W, yL: baseY, yR: GROUND_Y });
      }
      const lx = b.x - NEST.RAMP_W;
      if (lx >= NEST.L && !covered(lx, NEST.RAMP_W)) {
        cands.push({ x: lx, w: NEST.RAMP_W, yL: GROUND_Y, yR: baseY });
      }
    }
    /* 打乱一下再挑：永远取第一条的话，"有坡的层"坡都在同一个位置 */
    for (let i = cands.length - 1; i > 0; i--) {
      const j = Math.floor(R() * (i + 1));
      const t = cands[i]; cands[i] = cands[j]; cands[j] = t;
    }
    if (cands.length) {
      const c = cands[0];
      ramps.push({ x: Math.round(c.x), w: c.w, yL: c.yL, yR: c.yR });
    }
  }

  /* ---- 深巢**不挖坑**：地面的"破口"只留一种 —— 裂缝（2026-10-26）----
   *
   * 主线那三个坑（火 / 泥 / 水）各自对应一种"这一球我想要什么"：
   * 火坑断连锁给双倍收成、泥坑把球裹厚、水坑沉球。
   * 深巢第一版照抄了它们，代价是"地面语法和主线一模一样"——
   * 玩家进深巢第一眼看到的仍然是中间一团火光、左边一摊泥。
   *
   * 更要命的是几何：坑和裂缝**都是地面破口**，两者一起把地面切成四五段，
   * 而球是滚的、跳不过任何一段破口。站在"没有送走点的那一段"上的虫
   * **永远送不走** —— C8 实测 60 层 × 10 种子命中 1456 次，
   * 663 层重抽 20 次全失败。那不是难，是几何上无解。
   *
   * 所以深巢的地面只保留裂缝：**它自己就是送走点**，
   * 球滚到哪儿都有去处，"一球卷多只"于是变成"往最近那道缝赶"，
   * 而不是主线的"往右端一点一点挪"。这就是两个玩法该有的差别。 */
  const pits = [];

  /* ---- 裂缝：深巢的送走点（2026-10-26）----
   *
   * 主线只有一个营地、贴在右端，所以兽必须一路推回端点，600px 的规划
   * 就是主线那一整局的乐趣。深巢反过来：**任意一道都算**，
   * 同一只兽可能只需推 80px。这是"就地解决的取舍"和"长途搬运的规划"
   * 的区别，也是这两个玩法不该长得一样的最硬一条。
   *
   * **两道，不是设计文档写的 3–5 道。** 640 的井里放不下三道：
   * 地面可用跨度只有 476（出生净空 100 之后到右壁），
   * 3 道 96 宽的缝之后只剩 188，分给 4 个间隙每个 47 ——
   * 而"两道缝之间至少 90"是下限（一只虫宽 34~56 要站得进、
   * 球的落点要分得开），47 会让中间那段地面变成纯装饰：
   * 站不下人、也停不住球。实测 C7e 在 60 层里红了 1198 次，全是这条。
   *
   * 两道 96 之后：缝间 142、右缝到井壁 71，每只虫最多被推 120px
   * —— 仍然是"就地解决"的量级，而主线的对应数字是 600。
   * 要 3 道以上必须先放宽活动区（`NEST.W`），那是另一轮的取舍。
   *
   * 每道避开坡：坡从台滑到地面，缝压在坡上读作"坡从缝上飞过去"（C7c），
   * 而且坡底落进缝里就读作"坡通向一个洞"。 */
  const chasms = [];
  {
    const CW = 96;
    const lo = spawnX + NEST.SPAWN_CLEAR;
    const span = NEST.R - lo;
    const nCh = 2;
    for (let i = 0; i < nCh; i++) {
      const mid = lo + span * (i + 0.5) / nCh;
      let cx = Math.round(mid - CW / 2);
      /* 压坡就往左让，最多让 2 次（92px）。让再多会撞上前一道缝（C7e），
         而两道缝挨太近 = 中间那段地面站不住人。让不过去就交给 C7c 重抽。 */
      for (let t = 0; t < 2; t++) {
        const clash = ramps.some(r => !(cx + CW <= r.x || cx >= r.x + r.w));
        if (!clash) break;
        cx = Math.max(NEST.L + 8, cx - 46);
      }
      chasms.push({ x: cx, y: GROUND_Y, w: CW });
    }
    chasms.sort((a, b) => a.x - b.x);
  }

  /* ---- 菌光囊：雾里的探索落点（2026-10-27）----
   *
   * 雾如果只是"看不见"，探索就只剩成本没有收益 —— 玩家会一路沿着灯能照到
   * 的地方走最短路线，雾就退化成一个滤镜。菌光囊给雾一个**目的地**：
   * 打碎它，这片永久亮起来（这一层剩下的时间都亮），还掉孢子（收成）。
   *
   * 三条约束，每条都对应一种"摆错就出事"：
   *   ① 离裂缝 ≥ 56：裂缝本身有光，贴上去等于摆在亮处，失去"发现"
   *   ② 离出生点 ≥ 90：一进场就在脸前的不是探索，是捡
   *   ③ 囊之间 ≥ 110：摆在一起就只探索了一次
   * 位置来自 `RF`（独立流），所以放它不会动地形。 */
  const pods = [];
  {
    /* 候选分两类：地面（要跳过裂缝/营地/出生点）和 446 台面。
       **地面至少有 2 个候选段**：640 井减两道缝之后本来就很碎，
       但一个都不给的话，三个囊会全部落在 446 台上 ——
       每层的囊都在同一个高度、同一个视平线上，重复感立刻回来了。 */
    const cands = [];
    for (let x = NEST.L + 96; x <= NEST.R - 130; x += 26) {
      /* 离缝 44 而不是 56：缝本身有光，囊贴上去读作"摆在亮处"；
         但 640 井减两道缝之后地面本来就碎，56 会把所有地面候选吃光
         （实测第 1 层一个都不剩，三个囊全落到 446 台上）。 */
      const gut = NEST_FOG.POD_CHASM;
      const onCh = chasms.some(c => x + NEST_FOG.POD_W > c.x - gut && x < c.x + c.w + gut);
      const nearCamp = Math.abs(x + NEST_FOG.POD_W / 2 - (campX + NEST.CAMP_W / 2)) < 96;
      const nearSpawn = Math.abs(x + NEST_FOG.POD_W / 2 - spawnX) < 90;
      if (!onCh && !nearCamp && !nearSpawn) cands.push({ x: x, y: GROUND_Y });
    }
    /* 台上也是候选，取**下面两层**（446 / 336）。
       只给 446 的时候，深层（4 层台、台子更碎）经常连第二个位置都排不出来 ——
       实测 60 层 × 10 种子里有 22 层的囊数掉到 1 个。
       336 那一层够得着（跳高 145 > 层距 110），而且"囊在上一层"本身
       就给了玩家一个"要不要跳上去看看"的选择。 */
    for (const p of plats) {
      if ((p.y !== NEST.LAYERS[0] && p.y !== NEST.LAYERS[1]) || p.w < 120) continue;
      for (let x = p.x + 34; x <= p.x + p.w - 34 - NEST_FOG.POD_W; x += 30) {
        cands.push({ x: x, y: p.y });
      }
    }
    for (let i = cands.length - 1; i > 0; i--) {
      const j = Math.floor(RF() * (i + 1));
      const t = cands[i]; cands[i] = cands[j]; cands[j] = t;
    }
    /* 间距只在**同一高度**上判（|dy| < 40）。地面和台上的囊可以 x 重叠 ——
       它们在不同层，读起来是"上下各有光"，不是"挤在一起"。 */
    const far = (c) => !pods.some(q =>
      Math.abs(q.y - c.y) < 40 && Math.abs(q.x - c.x) < 96);
    const want = Math.max(2, Math.min(3, brood.pods || 2));
    /* 第一个**必须**是地面的那个（如果地面还有位置）。
       结构上保证，而不是"取完再兜底换一个" —— 兜底换的位置常常不满足间距，
       实测会换出一个贴着另一个囊的。 */
    const g0 = cands.find(c => c.y === GROUND_Y);
    if (g0) pods.push({ x: Math.round(g0.x), y: g0.y, w: NEST_FOG.POD_W, h: NEST_FOG.POD_H });
    for (const c of cands) {
      if (pods.length >= want) break;
      if (!far(c)) continue;
      pods.push({ x: Math.round(c.x), y: c.y, w: NEST_FOG.POD_W, h: NEST_FOG.POD_H });
    }
    /* 还不够就**放宽间距**再扫一遍（96 → 58）。
       宁可两个囊近一点，也不要整层只剩一个 —— 雾巢的"探索"是靠
       "还有别的地方没去"撑起来的，一个囊等于没有选择。 */
    if (pods.length < want) {
      const loose = (c) => !pods.some(q =>
        Math.abs(q.y - c.y) < 40 && Math.abs(q.x - c.x) < 58);
      for (const c of cands) {
        if (pods.length >= want) break;
        if (!loose(c)) continue;
        pods.push({ x: Math.round(c.x), y: c.y, w: NEST_FOG.POD_W, h: NEST_FOG.POD_H });
      }
    }
  }

  /* ---- 兵站只认**地面与 462 台** ----
   * 清场的动词是"把人推进营地"，不是"打死"。站在 350 / 248 台上的虫子
   * **推不下来**：球从地面滚不上去，玩家跳上去也只能打，不能把一只虫子
   * 从三层高台运到营地。机器人实测就是这个死法 —— 41 层 8 只里 5 只在
   * 350/248 上，240 秒只送走 3 只，然后超时。
   *
   * 主线里 350/248 也摆了 53 + 14 只，但主线是**手摆地形**，每个高台旁边
   * 都有能下去的路。深巢没有连通性校验（C1~C6 只验几何合法，不验"人能不能
   * 被运走"），所以只能把兵站压到"推一把就落地"的两层：
   *   地面 556       → 直接推进营地
   *   台 446（k=0）  → 台沿一推就落地，坡也能把人送下去
   * 336 / 226 / 116 照旧生成 —— 它们的职责是**承接弹道**、拉开层次，不是站人。
   *
   * 席位按 170px 一格拆开，抽中的是"一个人能站的地方"而不是"一整块台"：
   * 抽台的话 5 只虫子会挤在同一个 x 上互相重叠。 */
  const spots = [];
  const seatLedgeY = NEST.LAYERS[0];
  for (const p of plats) {
    if (p.y !== GROUND_Y && p.y !== seatLedgeY) continue;
    /* 台宽不足 140 就不放人了（两侧各留 40，剩下的不够一只虫巡逻） */
    if (p.y !== GROUND_Y && p.w < 140) continue;
    /* 地面席位的右端必须收在**营地之前**。
       640 之后地面是 160..800、营地在 718，不减这一刀的话最后一格
       会落到 710~760 —— 那只虫一开局就站在营地里，画面上是
       "还没推就消失了"，而 killed 记账发生在进营地那一下，
       实际表现是"这一层永远少一只"。21 层 / 51 层都撞过这条。 */
    let lo = p.x + 40, hi = p.x + p.w - 40;
    if (p.y === GROUND_Y) hi = Math.min(hi, campX - 50);
    /* 剩不到 70 就不放人了：一只虫加巡逻余量需要的宽度 */
    if (hi - lo < 70) continue;
    for (let gx = lo; gx <= hi; gx += 170) {
      spots.push({ y: p.y, x: gx, x1: Math.min(gx + 70, hi) });
    }
  }
  /* 地面席位要避开坑：站坑口上会自己掉下去。
     **也要避开裂缝**（2026-10-26）：敌人不会掉进缝里（物理地面是完整的，
     只有球会被 `ballTerrain` 判掉），所以它站在缝上不会消失 ——
     但那一格正好是玩家的送走点，一只虫从头到尾站在原地挡着缝，
     玩家读作"这缝是假的"。 */
  const groundSeats = spots.filter(s => s.y === GROUND_Y);
  for (const s of groundSeats) {
    const onPit = pits.some(p => s.x1 > p.x - 40 && s.x < p.x + p.w + 40);
    const onChasm = chasms.some(c => s.x1 > c.x - 30 && s.x < c.x + c.w + 30);
    if (onPit || onChasm) spots.splice(spots.indexOf(s), 1);
  }
  if (!spots.length) {
    for (let gx = NEST.L + 70; gx < campX - NEST.CAMP_CLEAR - 70; gx += 170) {
      const onPit = pits.some(p => gx > p.x - 50 && gx < p.x + p.w + 50);
      const onChasm = chasms.some(c => gx + 70 > c.x - 30 && gx < c.x + c.w + 30);
      if (!onPit && !onChasm) spots.push({ y: GROUND_Y, x: gx, x1: gx + 70 });
    }
  }
  /* 一个席位只用一次 —— 两只虫站同一个 x 会叠成一只 */
  const seatPool = spots.slice();
  const takeSeat = () => (seatPool.length
    ? seatPool.splice(Math.floor(R() * seatPool.length), 1)[0] : null);
  const waves = [];
  /* 敌人密度：`2 + min(3, depth/8)`，深层封顶 5 只小怪。
     设计文档写的是"1 + depth/20"的连续曲线，但生成器的台数是**离散**的
     （最多 6 块台），51 层按 depth/4 算出 6 只小怪 + boar + crow + boss = 9 只，
     实测机器人稳定卡在 7/9 —— 不是地形死路，是**场上敌人比可站位还多**。
     密度曲线要服从"台的数量"，不能只看深度。 */
  const n1 = 2 + Math.min(3, Math.floor(depth / 8));
  /* ---- 敌人类型按**巢室**开池（2026-10-27，雾巢轮重做）----
   *
   * 上一版是一条全局池子：bug 两个位 + 按深度依次加 spider/shell/moth/vein。
   * 后果是 1~4 层的池子只有 bug/bug/spider，抽出来的组合几乎永远是
   * "两只 bug" —— 用户那句话「这个关卡的怪物都一样啊」说的就是这里。
   *
   * 现在池子来自这一层的**巢室**（NEST_BROODS），四只特殊怪各咬一个
   * 物理事实的老规矩不变（盲蛛咬窄、石壳咬往下、巢蛾咬暗、地脉虫咬岩壁），
   * 只是"这层住谁"变成了一个可见的选择，而不是深度的副产品。
   *
   * bug 仍然要留权重（push 一次 = 出现两次）：它是**唯一"什么条件都不需要"
   * 的怪**，每层至少要有一只，否则玩家学不到"这层的规矩"就被特殊怪教做人。 */
  const foePool = nestBroodPool(brood, depth).slice();
  if (foePool.indexOf("bug") >= 0) foePool.push("bug");
  const w1 = [];
  let hasMoth = false, hasVein = false;
  /* 池子里有几种不同的东西。前 `uniqN` 只**必须互不相同** ——
     这是"剪影至少两种"的硬保证，只靠轮转做不到：池子是
     ["bug","shell","bug"] 时，两次抽到 bug 仍然可能（roll 落在 0 和 2）。
     修正**不额外抽随机数**（只是把已经抽到的那一只换成池里没用过的），
     所以后面的目标/镜像不会漂移。 */
  const uniqN = foePool.filter((k, i2, a) => a.indexOf(k) === i2).length;
  for (let i = 0; i < n1; i++) {
    const s = takeSeat();
    if (!s) break;
    const roll = R();
    let foe = foePool[(Math.floor(roll * foePool.length) + i) % foePool.length];
    if (i < uniqN) {
      const used = w1.map(o => o.foe);
      if (used.indexOf(foe) >= 0) {
        const alt = foePool.filter(k => used.indexOf(k) < 0)[0];
        if (alt) foe = alt;
      }
    }
    /* 每波最多一只蛾 / 一只脉虫：蛾要"用光"才掉，两只同时在场就变成
       "先找光、再找光"的重复劳动；脉虫固定在原地，两只等于一道墙。 */
    if ((foe === "moth" && hasMoth) || (foe === "vein" && hasVein)) foe = "bug";
    if (foe === "moth") hasMoth = true;
    if (foe === "vein") hasVein = true;
    /* 蛾在空中：给 336 层上方 70px（它能被球光照到，也够不着玩家的头）。
       取 `NEST.LAYERS[1] - 70` 而不是写死数字 —— 层表改过一次，
       写死的高度会落在台的中间，蛾子看起来像卡在板子里。 */
    if (foe === "moth") {
      w1.push({ foe: "moth", x: Math.round(rnd(NEST.L + 90, NEST.R - 90)),
                y: NEST.LAYERS[1] - 70 });
      continue;
    }
    /* 脉虫贴地：它从地面/岩里长出来，不能站在悬空台上（底下没东西可长）。 */
    if (foe === "vein") {
      w1.push({ foe: "vein", x: Math.round(rnd(NEST.L + 60, NEST.R - 160)), y: GROUND_Y });
      continue;
    }
    w1.push({ foe: foe, x: Math.round(rnd(s.x, s.x1)), y: s.y });
  }
  if (w1.length) waves.push(w1);

  /* 第二波：深一点才给 boar / crow。crow 会飞，不受台限制。 */
  if (depth >= 2) {
    const w2 = [];
    const s = depth >= 4 ? takeSeat() : null;
    if (s) w2.push({ foe: "boar", x: Math.round(rnd(s.x, s.x1)), y: s.y });
    const nCrow = depth >= 8 ? 1 : 0;
    for (let i = 0; i < nCrow; i++) {
      w2.push({ foe: "crow", x: Math.round(rnd(NEST.L + 120, campX - 160)), y: 300, fly: 1 });
    }
    /* 第二波给一只石壳（5+）：石壳是"地形怪"，和 boar 放同一波
       会让这一波变成"两只都会冲"，所以单独挑一层台给它。 */
    if (depth >= 5) {
      const s2 = takeSeat();
      if (s2) w2.push({ foe: "shell", x: Math.round(rnd(s2.x, s2.x1)), y: s2.y });
    }
    if (w2.length) waves.push(w2);
  }
  /* 最后一波 BOSS：lv 随深度涨，封顶 5（设计文档 §5） */
  waves.push([{ foe: "boss", x: Math.round(campX - 160), y: GROUND_Y, lv: Math.min(5, 1 + Math.floor(depth / 6)) }]);

  /* ---- 目标：按深度开放池（设计文档 §3.4）----
   * **浅层不给 limit。** 浅层敌人只有 3~4 只，额度怎么给都接近"不限"；
   * 而一旦给紧（3 颗 vs 3 只）就是几何上无解 —— 机器人实测 1 层、41/51 层
   * 三局全灭，全是这条。额度公式也不能只看深度，必须跟敌人数挂钩。 */
  /* 池子里 clear 出现两次 = 权重加倍。三种目标不是等价的：
     clear 是"标准层"（大多数层该是它），collect 是"顺手多攒"。
     等权抽的话 62% 的层都在限球，而限球关机器人过不去是预期行为，
     等于三分之二的层"看起来不可玩"。

     **深巢不要 limit（2026-10-25）。** 不是"太难"，是机制对不上：
     限球的解法是"一颗球按顺序卷掉多只"，它需要两样东西 ——
     ① 一条够长的连续球道（球滚得越久卷得越多）
     ② 一个能就地销毁球的出口（坑）
     深巢的生成地形两样都不保证：沿用到池子里的 6 个限球层实测
     0/6 通关，换了 640 井之后仍然 0/3（21/26/46 层，26 层直接报
     "球用完了还有 3 只没送走"，46 层 240 秒只用掉 2 颗）。
     这跟"玩家水平"无关，是**额度算不出一球卷两只的余量**。
     主线保留 limit（那是手摆地形，两条前提都满足）；深巢换成
     clear / collect 两种，各占一半权重 —— 它们都不需要额外前提。 */
  const goalPool = ["clear", "clear", "collect", "collect"];
  const goal = pick(goalPool);
  const foes = waves.reduce((n, w) => n + w.length, 0);
  /* ---- S 线跟着这一层的敌人数走，不写死 ----
   * 写死 `70 秒 / 8 颗` 的后果不是"难"，是**深层永远拿不到 S**：
   * 层 6 是 6~7 只，层 51 是 9 只还带两波压场，同一根 70 秒的线
   * 在第 6 层随便过、在第 51 层不存在。评级一旦变成"深层必然 B"，
   * 玩家就不再读它了 —— 而深巢是纯刷分模式，评级是它唯一的分。
   *
   * 系数取自主线 27 屏实测（8~14 只 ↔ par.time 60~135，约 6 秒/只），
   * 深巢再松一档：生成地形没有手摆地形那么顺，容错要给。
   * `par.made` 取 0.70 × 敌人数 —— 主线是 0.67（12 只给 8 颗）。 */
  const parTime = Math.round(52 + foes * 3.4);
  const parMade = Math.max(3, Math.round(foes * 0.70));
  const L = {
    id: "nest-" + depth,
    name: "第 " + depth + " 层",
    sub: "深巢 · 深度 " + depth,
    note: "深巢第 " + depth + " 层。地形每次下潜都不一样，打不过就只丢这一层",
    theme: theme,
    goal: goal,
    par: { time: parTime, made: parMade },
    plats: plats,
    ramps: ramps,
    pits: pits,
    /* 裂缝 = 深巢的送走点。`loadLevel` 会把它塞进全局 `CHASMS`，
       `ballTerrain` / `predictBall` 走同一个数组 —— 主线那边这个数组
       只有 `[CAMP]` 一项，所以两套玩法共用一条判定。 */
    chasms: chasms,
    stumps: [],
    /* 菌光囊（雾巢）：跟着层走的几何，和台/坑一样属于地形。
       镜像时一起翻（见 nestMirror），否则"营地翻到左边了，囊还在右边"
       会让三层的囊全挤在同一个角落。 */
    pods: pods,
    /* 巢室：这一层"住着什么"。HUD 和开场大字读它，生成器读它的池子。 */
    brood: { id: brood.id, name: brood.name },
    camp: { x: campX, y: GROUND_Y, w: NEST.CAMP_W },
    waves: waves,
    spawn: { x: spawnX, y: GROUND_Y },
    nest: { depth: depth, seed: seed },
  };
  /* 额度跟**敌人数**挂钩，不跟深度挂钩：深度只决定敌人有多少，
     额度要回答的是"这层够不够卷"。`min(foes-1, ...)` 保证额度严格小于敌人数
     （等于敌人数就等于没限，那这个目标不存在）；`0.55` 让一球平均卷两只是正解 ——
     一颗球实测最多卷 3 只，所以 0.55 大约是"两球卷掉三只"的强度。 */
  if (goal === "limit") {
    L.ballLimit = Math.max(2, Math.min(foes - 1, Math.round(foes * 0.55)));
    /* 带额度的关，`par.made` **必须等于额度**。
       额度 3 而 S 线写 8 的话，"用球"这一项永远达标 —— 限球关的评级
       等于白送，玩家读到的是"这层我打得很好",实际只是线画错了。
       这条是主线就定下的规矩（`ballBudget()` 判 `ballLimit == null`），深巢照抄。 */
    L.par.made = L.ballLimit;
  }
  /* 收成目标贴着**主线实测区间**定：27 屏的 collect 全是 12/13/14，
     单屏收成 31~64 —— 目标只有收成的 1/3 到 1/2，这才是"顺手就够，
     刻意去攒更快"的量级。深巢按敌人数的 1.6 倍加半档深度，封顶 22：
     层 6 = 10，层 26 = 17，层 51 = 20。上一版按 foes*2.6 算出 40+，
     机器人实测收成 9~13，那不是"难"，是几何上够不着。 */
  /* 收成目标的**上限**由这一层自己决定，不是公式拍一个数。
     机制：火坑 = holds × 2（球烧掉）、营地 = holds + 1。所以
       有火坑的层：每只最多 2 收成 → cap = foes × 2
       没火坑的层：只能走营地，一球卷多只时那个 +1 被摊薄 → cap ≈ foes × 1.4
     目标取 cap 的 6 成。**不能取满**：取满等于"每只都必须单独进营地"，
     而一球卷三只才是这游戏的正解 —— 卷 3 只得 4 收成、单独 3 次得 6，
     目标一顶到上限，正解就变成亏本买卖。
     机器人实测就是这个死法：21 层目标 14 = 上限 14，三局收工在 1~2 收成。 */
  if (goal === "collect") {
    /* **只有火坑给 ×2。** 上一版写的是 `pits.length`，把水坑和泥坑也算成了
       "收成翻倍的地方" —— cap 被抬高，目标跟着抬高，而水坑根本不给收成。
       41 层（一行 water 坑、5 只敌人）算出来 cap=10、目标 8，
       而这一层物理上最多只能收到 7 —— **目标超过上限，是无解，不是难**。 */
    const cap = pits.some(q => q.kind === "fire") ? foes * 2 : Math.round(foes * 1.4);
    /* **cap - 1，不是 cap**。取满等于"每一只都必须单独进营地"，
       而一球卷三只（3 只 → 4 收成）比单独送三次（6 收成）更省事才是正解；
       目标一顶到上限，正解反而成了亏本买卖 —— 这是主线就定过的规矩。
       层 51 / 60 就是被这条断言抓出来的（cap 4 目标也 4）。
       **下限的顺序也不能反**：先 `max(下限)` 再 `min(cap-1)`。
       反过来的话 `max(3, min(2, 2))` = 3 = cap，照样越顶
       —— 深巢不再挖坑之后 cap 从 `敌×2` 掉到 `敌×1.4`，
       2 只敌人的层 cap 只有 3，下限 3 当场撞上去（第 7 层 3 条红）。 */
    L.collect = Math.min(cap - 1, Math.max(2, Math.round(cap * 0.6)));
  }
  if (goal === "chain") L.chain = Math.max(2, Math.min(4, Math.round(foes * 0.5)));

  /* ---- 镜像：一半的层整屏翻过来。营地 27/28 在右边，翻过来就是新画面 ---- */
  if (R() < 0.5) nestMirror(L);
  return L;
}

/** C1~C6 校验。返回 { ok, fails }。**纯几何，不跑物理** ——
 *  跑物理要给每一层跑一遍机器人，那样生成一层的成本比打完一层还高。 */
function nestCheck(L) {
  const fails = [];
  const ground = L.plats.find(p => p.kind === "ground");
  const ledges = L.plats.filter(p => p.kind === "ledge");
  const pits = L.pits || [];
  const ramps = L.ramps || [];

  /* C3 没有顶死墙角：一块台不能同时贴左右墙（那样台下就是个死胡同） */
  for (const p of ledges) {
    if (p.x <= NEST.L + 20 && p.x + p.w >= NEST.R - 20) fails.push("C3 台顶死墙角");
  }
  /* C4 坑不连成墙：相邻坑缘间距 ≥ 120（连成墙 = 人过不去，只能走台） */
  const ps = pits.slice().sort((a, b) => a.x - b.x);
  for (let i = 1; i < ps.length; i++) {
    if (ps[i].x - (ps[i - 1].x + ps[i - 1].w) < NEST.PIT_GAP) fails.push("C4 坑连成墙");
  }
  /* C4b 坑宽不超上限（超了就不是"跳得过去的坑"） */
  for (const p of pits) if (p.w > NEST.PIT_MAX + 1) fails.push("C4b 坑过宽");
  /* C5 坡不钻台底：坡的 x 区间不能整段落在某块台的**正下方**。
     判据必须是"台比坡高"（p.y 更小），**不能用 yL 当坡顶** ——
     坡现在左右两个方向都会生成，左坡的 yL 是地面（556），
     拿它当坡顶会把"坡身在地面上"误判成"钻台底"。 */
  for (const r of ramps) {
    const topY = Math.min(r.yL, r.yR);
    for (const p of ledges) {
      if (p.x <= r.x && r.x + r.w <= p.x + p.w && p.y <= topY - 4) {
        fails.push("C5 坡钻台底");
      }
    }
  }
  /* C6 出生点不落坑、不在坑边 */
  for (const p of pits) {
    if (L.spawn.x + NEST.SPAWN_CLEAR > p.x && L.spawn.x < p.x + p.w + NEST.SPAWN_CLEAR) {
      fails.push("C6 出生点离坑太近");
    }
  }
  /* C2a 营地前净空：球滚到营地之前不被坑吃掉 */
  for (const p of pits) {
    if (p.x + p.w > L.camp.x - NEST.CAMP_CLEAR && p.x < L.camp.x + L.camp.w) {
      fails.push("C2a 营地前有坑");
    }
  }
  /* C1 人到得了营地：地面从出生点到营地，沿途每个坑都要跳得过去。
     C4 已经保证 ≤140，这里再挡一次"某段被两个坑夹成一个窄岛"的情况。 */
  {
    const lo = Math.min(L.spawn.x, L.camp.x), hi = Math.max(L.spawn.x, L.camp.x + L.camp.w);
    for (let i = 1; i < ps.length; i++) {
      const a = ps[i - 1], b = ps[i];
      if (a.x + a.w >= lo && b.x <= hi && b.x - (a.x + a.w) < 60) fails.push("C1 中间站不住");
    }
  }
  /* 每一波敌人必须站在某块台面或地面上（飘着的敌人打不到） */
  const surf = (L.plats || []).filter(p => p.kind !== "ramp");
  for (const w of L.waves) {
    for (const f of w) {
      if (f.fly) continue;
      /* 巢蛾本来就悬在半空（它没有落脚面，靠光打下来）——
         这一条"不许悬空"对它是反的，跳过。 */
      if (f.foe === "moth") continue;
      const on = surf.some(p => f.y >= p.y - 2 && f.y <= p.y + 4 && f.x >= p.x - 10 && f.x <= p.x + p.w + 10);
      if (!on) fails.push("敌人悬空");
    }
  }

  /* ---- C7 裂缝（送走点）：深巢唯一的出口，错一条这层就打不通 ----
   * 这几条的共同病根都是"缝画在那儿、球却过不去或掉不进去"：
   *   ① 缝在井外 → 画不出来，球也滚不到（CAMP.x 是最右那道，最容易撞）
   *   ② 总宽超 40% → 地面成筛子，走两步就掉，玩家来不及做任何决定
   *   ③ 缝压在坡上 → "坡从缝上飞过去"，读作 bug，而且坡底落进缝里
   *   ④ 缝互相之间不留 90 → 中间那段地面站不住人
   * 敌人不掉进缝不在这里验：物理地面是完整的，只有球会被判掉。 */
  const chs = L.chasms || [];
  {
    let total = 0;
    for (const c of chs) {
      total += c.w;
      if (c.x < NEST.L - 2 || c.x + c.w > NEST.R + 2) fails.push("C7a 裂缝出井");
      if (c.w < 60 || c.w > 140) fails.push("C7b 裂缝宽度越界");
      for (const r of ramps) {
        if (!(c.x + c.w <= r.x || c.x >= r.x + r.w)) fails.push("C7c 裂缝压在坡上");
      }
    }
    if (total > Math.round(NEST.W * 0.45) + 2) fails.push("C7d 裂缝总宽超过 45%");
    const cs = chs.slice().sort((a, b) => a.x - b.x);
    for (let i = 1; i < cs.length; i++) {
      if (cs[i].x - (cs[i - 1].x + cs[i - 1].w) < 90) fails.push("C7e 两道裂缝挨太近");
    }
    /* 深巢必须有裂缝：没有的话 `loadLevel` 会退回 `[L.camp]`，
       而深巢已经没有营地视觉了 —— 球滚到右端凭空消失。 */
    if (L.nest && !chs.length) fails.push("C7f 深巢没有送走点");
  }

  /* ---- C8 送得走：每只地面敌人的"地面段"里必须有至少一道裂缝 ----
   *
   * **这是"裂缝会切地面"这件事唯一正确的读法，判错方向就会把可玩的层判死。**
   *
   * 切段的东西只有**坑**：人踩进坑会掉下去，所以坑是真障碍。
   * **裂缝不是障碍，是目的地** —— 它是一段的终点，不是切开地面的刀。
   * 第一版把裂缝也算进"切段"里，于是"两道缝之间的那段地面"被算成
   * 一个独立的段、而那段里当然没有缝（缝就是它的两端）——
   * 60 层 × 10 种子瞬间 1196 次误报，全是假红。
   *
   * 台上（446 层）的敌人不在这一条里：台沿一推就落地，落到哪一段由地形
   * 决定，而台下地面通常有好几段可选，机器人能绕。
   * 这条只兜"它一开始就站在走不掉的地方"。 */
  {
    const cuts = [];
    for (const p of pits) cuts.push([p.x, p.x + p.w]);
    cuts.sort((a, b) => a[0] - b[0]);
    /** x 落在哪一段自由地面（两端用井壁封口） */
    const segOf = (x) => {
      let lo = NEST.L, hi = NEST.R;
      for (const c of cuts) {
        if (x < c[0]) { hi = c[0]; break; }
        lo = c[1];
      }
      return [lo, hi];
    };
    const segHasChasm = (lo, hi) => chs.some(c => c.x >= lo - 1 && c.x + c.w <= hi + 1);
    for (const w of (L.waves || [])) {
      for (const f of w) {
        if (f.fly || f.y !== GROUND_Y) continue;
        const sg = segOf(f.x);
        if (!segHasChasm(sg[0], sg[1])) fails.push("C8 这段地面没有缝，人送不走");
      }
    }
  }
  return { ok: fails.length === 0, fails: fails };
}

/** 最简版：一块 462 台 + 一个坑。几何上不可能不过任何一条校验，
 *  是所有重抽都失败时的兜底 —— 宁可这层无聊，不可这层不可玩。 */
function nestSimpleLevel(depth) {
  const L = nestBuildRaw(1, 1);
  L.id = "nest-" + depth;
  L.name = "第 " + depth + " 层";
  L.sub = "深巢 · 深度 " + depth;
  /* 主题名和配色必须来自**同一处**。上一版这里写的是
     `NEST_THEME_LIGHT[depth % ...]`，而配色已经改成 nestTheme(depth) ——
     两处各算一次，索引早晚会差一层。
     更麻烦的是这条分支只在"20 次重抽全失败"时才走，冒烟和截图都碰不到它，
     等它真被走到的时候是玩家卡在某一层、控制台抛 ReferenceError。 */
  L.theme = nestThemeOf(depth);
  L.goal = "clear";
  /* 兜底版恒 4 只（3 小怪 + 1 BOSS），S 线照 nestBuildRaw 同一套公式算：
     52 + 4×3.4 ≈ 66 秒、0.70×4 ≈ 3 颗。写死别的数会让兜底层评级失真。 */
  L.par = { time: 66, made: 3 };
  /* 兜底版的每一件都按井重排（640 之后旧坐标全部出界：
     台 26..620 会伸到岩壁里、坡 620..846 右半截悬空、营地 852 在井外）。 */
  L.plats = [
    { x: NEST.L, y: GROUND_Y, w: NEST.W, h: 44, kind: "ground" },
    /* 台宽 250（不是 300）：右边要给坡（246）和右端的送走点裂缝（96）让位。
       180..430 台 + 430..676 坡 + 704..800 缝，四段首尾接上、互不重叠。 */
    { x: NEST.L + 20, y: NEST.LAYERS[0], w: 250, h: 20, kind: "ledge" },
  ];
  L.ramps = [{ x: NEST.L + 270, w: NEST.RAMP_W, yL: NEST.LAYERS[0], yR: GROUND_Y }];
  L.pits = [{ x: NEST.L + 260, y: GROUND_Y, w: 100, kind: "mud" }];
  L.camp = { x: NEST.R - NEST.CAMP_W, y: GROUND_Y, w: NEST.CAMP_W };
  /* 兜底版也必须有裂缝 —— `loadLevel` 里 `L.chasms` 为空时会退回 `[L.camp]`，
     那样兜底层就变成"还是有营地"的旧语义，而玩家看到的是没有营地视觉的
     一片空地：球滚到右端凭空消失。宁可这层只有一个送走点，也要是缝。 */
  L.chasms = [
    /* 240..336：台（180..430）正下方的地面，坡（430..676）左侧。
       放到 370 会压在坡身上（C7c 红）。 */
    { x: NEST.L + 80, y: GROUND_Y, w: 96 },
    { x: NEST.R - 96, y: GROUND_Y, w: 96 },
  ];
  L.spawn = { x: NEST.L + 64, y: GROUND_Y };
  L.waves = [
    [{ foe: "bug", x: NEST.L + 70, y: NEST.LAYERS[0] },
     { foe: "bug", x: NEST.L + 150, y: NEST.LAYERS[0] },
     { foe: "bug", x: NEST.R - 200, y: GROUND_Y }],
    [{ foe: "boss", x: NEST.R - NEST.CAMP_W - 160, y: GROUND_Y,
       lv: Math.min(5, 1 + Math.floor(depth / 6)) }],
  ];
  L.nest = { depth: depth, seed: 0 };
  return L;
}

/** 生成第 depth 层：抽 → 校验 → 不过换种子重抽（上限 20 次）→ 兜底最简版。
 *  `seed` 默认由 depth 决定，所以**同一层每次都长一样**（可记忆）。 */
function nestLevel(depth, seed) {
  const s0 = seed == null ? (depth * 2654435761) >>> 0 : seed;
  let last = null;
  for (let t = 0; t < NEST.MAX_TRIES; t++) {
    const L = nestBuildRaw(depth, (s0 + t * 1013) >>> 0);
    const r = nestCheck(L);
    if (r.ok) return { level: L, tries: t + 1, fails: [] };
    last = r.fails;
  }
  return { level: nestSimpleLevel(depth), tries: NEST.MAX_TRIES, fails: last || [] };
}

/* 当前生效的关卡表。主线 = 27 屏；深巢 = 只有当前这一层的单元素表。
   `loadLevel` / `curStage` / `beginRun` 全部走它，所以"换一张表 = 换一个玩法"，
   不需要在绘制、物理、机器人任何一处加 if。 */
let ACTIVE = LEVELS;

/** 逻辑墙宽：深巢 = 640 井，主线 = 26..934。
 *  **唯一写入点**（`loadLevel` 调），物理里三十多处引用读它。
 *  为什么必须收口成一个函数：漏还原一次，主线就会变成一条两端各少
 *  134px 的窄路 —— 而这种错在截图上看不出来（背景还是满屏的），
 *  只有"球在离右缘 134px 的地方撞了一下空气墙"能暴露它。 */
function applyWalls(narrow) {
  if (narrow) { WALL_L = NEST.L; WALL_R = NEST.R; }
  else { WALL_L = WIDE_L; WALL_R = WIDE_R; }
}

function loadLevel(i) {
  const L = ACTIVE[i] || ACTIVE[0] || LEVELS[0];

/* ---- 坡面剖面 --------------------------------------------------------------
   坡不是"一根斜着的方木"，是**一段弯下去的路面**。

   上一版画的是"旋转过的圆角矩形、厚度垂直于坡面"。这带来三个问题，
   单看每一个都小，叠起来就变成用户嘴里那句"像是个木头接上去的"：
     ① 厚度垂直于坡面 → 接平台那一端，台面下方鼓出一个楔形；
     ② 两端是斜切面（旋转过的圆角）→ 和水平的台面顶面之间有一道折角；
     ③ 砖缝垂直于坡面 → 像梯子横档，不像一条路。

   现在换成"路面剖面"：一条顶面曲线，**沿竖直方向**量厚度，
   两端切线缓入缓出贴近水平，砖缝照旧竖直。这样它读起来是
   "台面在尽头弯了下去"，而不是"有人把木头架在台子边上"。

   物理和绘制共用这一个函数，所以永远不会有"人和画面对不上"的问题。
   -------------------------------------------------------------------------- */

// 缓入缓出的强度。0 = 纯直线（端头有折角）；1 = 纯 smoothstep（端点导数严格为 0）。
//
// **必须等于 1。** 这不是手感调参，是几何约束：
// 接缝处平台顶面是水平线（导数 0），坡顶的切线也必须是 0，两条轮廓才连成一条光滑曲线。
// 上一版 0.82 留下 10° 的残余夹角 —— 10° 在 2D 侧视图里就是一道看得见的折角，
// 无论把木纹画得多细，它都会被读成"两根木头对接"。这就是"接上去"的数学来源。
//
// 代价是中段更陡（峰值导数 1.5 倍），所以坡度必须同步加长：
// 峰值斜率 = 1.5·H/W，要压在 32° 以内，需要 W ≥ 2.4H。数据侧已经按这个重排。
// 物理和绘制共用这一个函数，所以画面和手感永远同步，不会出现"人画对不上"。
const RAMP_EASE = 1.0;

/** s ∈ [0,1] → 缓动后的进度。端点导数是 1-RAMP_EASE，中段略大于 1。 */
function rampProfile(s) {
  const e = 3 * s * s - 2 * s * s * s;
  return s + (e - s) * RAMP_EASE;
}
/** 上式的导数。用来算某一点的坡度。 */
function rampProfileD(s) {
  return 1 + (6 * s - 6 * s * s - 1) * RAMP_EASE;
}
/** 坡在某个 x 处的顶面高度（超出范围按两端水平夹住）。 */
function rampSurfY(r, x) {
  const s = clamp((x - r.x) / r.w, 0, 1);
  return r.yL + (r.yR - r.yL) * rampProfile(s);
}

/** 球/人是否"贴"在这条坡面上。
 *
 *  只看两件事：离坡面够近，或者这一帧从坡面上方穿了进来。
 *
 *  上一版只看 `y >= rp.y - 6` —— 那读作"在坡面下方不超过 6px"，
 *  但**地面上的东西永远满足它**：第 3 关那条悬空滑梯挂在 350→462，
 *  从底下路过的球会被一把抓到 350，瞬移 200px。人也是一样。
 *  这条判据是本轮加缓动剖面时暴露出来的，但 bug 一直都在。 */
function onRampSurface(y, rp, prevY, tol) {
  const T = tol === undefined ? 20 : tol;
  if (Math.abs(y - rp.y) <= T) return true;
  return prevY <= rp.y && y >= rp.y;     // 高速下落：这一帧跨过了坡面
}

/** 斜坡在某个 x 处的表面高度；不在任何斜坡上返回 null */
function rampAt(x) {
  for (const r of RAMPS) {
    if (x < r.x || x > r.x + r.w) continue;
    const s = (x - r.x) / r.w;
    // slope 沿用原口径：向右下降为正（= -dy/dx）。
    // 球的 `vx -= GRAV * slope * 0.45 * dt` 靠这个符号决定"下坡加速"。
    const slope = (r.yL - r.yR) * rampProfileD(s) / r.w;
    return { y: rampSurfY(r, x), slope, x0: r.x, w: r.w, r };
  }
  return null;
}

   4. 状态
   ========================================================================== */

/* ============================================================================
   ★ 改造件（perk）—— 全游戏唯一的"永久变强"出口
   ----------------------------------------------------------------------------
   为什么需要这个东西：审计下来 `RECIPES` 只有干粮（消耗品）和收集篮（一次性），
   `MEALS` 三条也全是消耗品 —— **没有任何一条产出能让玩家变强**。
   于是第 1 小时和第 10 小时的能力完全相同，经济是循环不是螺旋，
   评级 S/A/B 也只是记录、不给任何东西，玩家没有理由为"打得更好"付出。

   设计约束（三条，都是踩过的坑）：
    1. **只读副本，不双向镜像。** 真值只存在主界面那份存档
       （`pawpack.save.v1` 的 `perks` 数组）。战斗侧启动时读一次进内存，
       绝对不往回写 —— MEMORY 第 2 条教训：同一件事存两份必然漂移。
    2. **生效点必须少而集中。** 一个 perk 只改一处，改完能直接被断言盯住。
       散在五个地方的改造件，没有一个能被验证"真的生效了"。
    3. **不动关卡几何的隐式输入。** 坡的 `0.45`、`dashT/dashCd/dashPow`、
       `PUSH_BASE` 都是 27 屏按满饱调过的，改它们会让 ALL9 大范围超时。
       所以"坡道省力"这类改造**不做**，宁可换一个不碰物理的。
   ============================================================================ */

/** 四件改造件。id 必须和 `HomeBiz.ts` 的 `PERKS` 逐字相等（冒烟有断言）。 */
const PERK_IDS = ["hotpit", "wideball", "thrift", "bounty"];
/* 层数上限。**必须和 `SaveData.ts` 的 `PERK_MAX_LV` 相等**（冒烟断言）——
   两边各写一个数，存档能存到 4 层而战斗只认 3 层，第 4 层白买。 */
const PERK_MAX_LV = 3;

/** 已购的改造件，只读。值是**层数**（1..PERK_MAX_LV），没买就是 key 不存在。 */
let PERKS = Object.create(null);

/** 这件现在几层（0 = 没买）。**战斗侧唯一的读法。**
 *
 *  2026-10-27 之前这里是布尔，于是四件买完就再没东西可买 ——
 *  "全游戏唯一的永久变强出口"只够支撑 4 次消费，长线又断了。
 *  改成层数之后，加成幅度由各自的调用点按 `perkLv(id)` 算。 */
function perkLv(id) {
  const n = PERKS[id];
  return typeof n === "number" && n > 0 ? n : 0;
}
function perkOn(id) { return perkLv(id) > 0; }

/** 从主界面存档读改造件。**只读** —— 见上面第 1 条约束。 */
function loadPerks() {
  PERKS = Object.create(null);
  try {
    const raw = localStorage.getItem("pawpack.save.v1");
    if (!raw) return;
    const home = JSON.parse(raw) || {};
    /* 2026-10-27 起存档是 `perkLv: {id: n}`。旧档的 `perks: string[]`
       在这里迁移成 n = 1 —— **不迁移的话，老玩家花 180 果买的东西，
       升级后开战当场变成没买**（perkLv 全 0，而 perkOn 判 `> 0`）。 */
    const lv = home.perkLv;
    if (lv && typeof lv === "object" && !Array.isArray(lv)) {
      for (const id of PERK_IDS) {
        const n = Math.floor(Number(lv[id]));
        if (isFinite(n) && n > 0) PERKS[id] = Math.min(n, PERK_MAX_LV);
      }
    } else {
      const arr = Array.isArray(home.perks) ? home.perks : [];
      for (const id of arr) if (PERK_IDS.indexOf(id) >= 0) PERKS[id] = 1;
    }
  } catch (e) { PERKS = Object.create(null); }
}

/* 进游戏读一次。主界面买完改造件后回到战斗会重新加载本页，所以不需要监听。 */
loadPerks();

/* ---------- 巢币：战斗侧唯一的存档写入口（和 `recordStar` 同一类） ----------
 * 为什么战斗侧可以写：词条看板开在出征页（属于战斗原型），玩家在那里
 * 花币买"这一趟不生效"，钱必须当场扣。`loadSave` 每次都重读盘，
 * 所以主界面不会拿到过期值 —— 前提是**读-改-写整份 JSON**，
 * 不能在内存里留一份副本然后整份覆盖（那会把主界面这一趟的果子抹掉）。
 */
function readNestCoins() {
  try {
    const raw = localStorage.getItem("pawpack.save.v1");
    if (!raw) return 0;
    const o = JSON.parse(raw) || {};
    const n = Math.floor(Number(o.nestCoins));
    return isFinite(n) && n > 0 ? n : 0;
  } catch (e) { return 0; }
}

/** 扣 n 枚。**扣成功才返回 true** —— 调用方必须据此决定要不要落账，
 *  否则会出现"钱没扣、词条却跳过了"。 */
function spendNestCoins(n) {
  const cost = Math.max(0, Math.floor(n) || 0);
  if (cost <= 0) return true;
  try {
    const raw = localStorage.getItem("pawpack.save.v1");
    if (!raw) return false;
    const o = JSON.parse(raw) || {};
    const have = Math.max(0, Math.floor(Number(o.nestCoins)) || 0);
    if (have < cost) return false;
    o.nestCoins = have - cost;
    localStorage.setItem("pawpack.save.v1", JSON.stringify(o));
    return true;
  } catch (e) { return false; }
}

const KEYMAP = {
  ArrowLeft: "left", KeyA: "left",
  ArrowRight: "right", KeyD: "right",
  ArrowUp: "jump", KeyW: "jump", Space: "jump",
  ArrowDown: "down", KeyS: "down",
  KeyJ: "atk",
  KeyK: "dash",
  ShiftLeft: "aim", ShiftRight: "aim",
};

/* 键盘监听走**捕获阶段**（第三个参数 true），不走冒泡阶段。

   麻烦在这里：Cocos 预览把 game canvas 铺在最上层，它自己的输入系统、
   以及宿主页面任何一层监听，只要调了 stopPropagation，冒泡阶段挂在
   window 上的监听就收不到。而症状恰好是"能走能跳、就是按 J 喷不出来" ——
   走和跳是别的东西转发的，喷只认这一张表。

   捕获阶段 window 是事件链上的第一个节点，谁拦都拦不住它。 */
/* 同一次物理按键可能从两条路进来：DOM 的 window 监听，和 Cocos 引擎的
   input 转发（GroveBattle._onKeyDown → GROVE._key）。不去重的话
   F2 会被"开一次、又关一次"，表现就是**按了完全没反应**。
   40ms 足够宽 —— 人手连点两下同一个键最快也要 80ms。 */
let _keyGuard = { code: "", t: -1e9 };

function onKeyDown(ev) {
  const _t = (typeof performance !== "undefined" && performance.now)
    ? performance.now() : Date.now();
  if (ev.code === _keyGuard.code && _t - _keyGuard.t < 40) return;
  _keyGuard.code = ev.code;
  _keyGuard.t = _t;
  // 非战斗阶段，方向键归界面用，不往角色身上送
  const inPlay = S.phase === "play";

  /* ---- 测试跳关（F2）----
     必须放在所有分支之前：面板打开时它要是**唯一**接收按键的地方，
     否则方向键会同时被 select / pick 的逻辑吃掉，光标和格子对不上。 */
  if (ev.code === "F2") { openJump(); ev.preventDefault(); return; }
  if (S.phase === "jump") {
    const cols = JUMP.cols, n = LEVELS.length;
    let c = S.jumpCur;
    if (ev.code === "ArrowLeft")       c -= 1;
    else if (ev.code === "ArrowRight") c += 1;
    else if (ev.code === "ArrowUp")    c -= cols;
    else if (ev.code === "ArrowDown")  c += cols;
    else if (ev.code === "Enter" || ev.code === "Space") {
      jumpTo(S.jumpCur);
      ev.preventDefault();
      return;
    } else if (ev.code === "Escape") { closeJump(); return; }
    else return;
    // 上下越界不绕圈（和挑一屏一致）：绕圈会让人以为"按到底又从头开始了"
    if (!ev.repeat) S.jumpCur = clamp(c, 0, n - 1);
    ev.preventDefault();
    return;
  }

  const k = KEYMAP[ev.code];
  if (k && inPlay) {
    // 只在"第一次按下"记一次边沿。浏览器按住键会不停重发 keydown，
    // 拿重发当新按键的话，按住空格就会一路连跳。
    if (!S.keys[k]) S.press[k] = true;
    S.keys[k] = true;
    ev.preventDefault();
  }
  if (k === "aim") S.aim = true;

  if (ev.code === "KeyR" && (inPlay || S.phase === "clear" || S.phase === "fail")) {
    beginRun(S.stage);
    return;
  }
  /* 测试跳关：[ / ] 直接上一屏 / 下一屏，连扫 27 屏不用回面板。
     **只在 play 里给** —— clear / fail 时回车已经是"进下一关"，
     再挂一对键会让人分不清哪个是正常推进、哪个是测试跳过。 */
  if (inPlay && (ev.code === "BracketLeft" || ev.code === "BracketRight")) {
    const d = ev.code === "BracketRight" ? 1 : -1;
    jumpTo(clamp(S.stage + d, 0, LEVELS.length - 1));
    ev.preventDefault();
    return;
  }
  if (ev.code === "Escape" && S.phase !== "select") {
    /* 从家园进来的，ESC 就是"收工回家" —— 主界面已经取代了门口选人这一站。
     * （挑一屏的"ESC 一律退回出征页"规则随该页 2026-10-26 删除一起取消。） */
    if (FROM_HOME) { location.href = "game.html"; return; }
    S.phase = "select";
    S.p = null;
    // 门口状态必须复位：不复位的话，下次回来六只还保持着上次"已经出门"的姿势
    S.door.pick = -1;
    S.door.leaveT = 0;
    return;
  }

  // 选人：先走 1.6 秒的出门演出，再开打。（演出内容 = 其余五只的反应）
  if (S.phase === "select") {
    const n = ["Digit1", "Digit2", "Digit3", "Digit4", "Digit5", "Digit6"].indexOf(ev.code);
    if (n >= 0 && n < HEROES.length) { pickHero(n); return; }
    // Enter / Space = 带"上一次用的那只"出门，不再按默认来。
    if (ev.code === "Enter" || ev.code === "Space") {
      pickHero(S.heroIdx);
      ev.preventDefault();
    }
    return;
  }

  /* 出征页：左右键在两扇门之间挑，Enter 进。
   * 只有两扇门，所以不分行列 —— 上下键也当左右用，手机外接键盘和
   * 习惯按上下的人都不至于按了没反应。 */
  if (S.phase === "portals") {
    let c = S.gateCur;
    if (ev.code === "ArrowLeft" || ev.code === "ArrowUp") c -= 1;
    else if (ev.code === "ArrowRight" || ev.code === "ArrowDown") c += 1;
    else if (ev.code === "Enter" || ev.code === "Space") {
      enterGate(S.gateCur);
      ev.preventDefault();
      return;
    } else if (ev.code === "KeyE") { goHome(false); return; }
    else return;
    if (!ev.repeat) {
      S.gateCur = clamp(c, 0, GATES.length - 1);
      /* 键盘挑门也要放大 —— 否则按了 ←→ 画面一动不动，玩家不知道
         现在选的是哪张、Enter 会进哪里。放大由**操作**触发（按键），
         不由"当前选中"这种状态触发（那会让一进页面就有一张是大的）。 */
      S.hoverGate = S.gateCur;
    }
    ev.preventDefault();
    return;
  }

  /* 挑一屏（phase === "pick"）2026-10-26 整页删除：出门链路简化成
     出征页 → 当前进度那一屏，不再有 27 格选择层，方向键导航随之取消。 */

  // 结算：回车 / 空格 继续。通关就下一关，失败就重打本关 —— 不回列表。
  // E = 收工回家，把这一趟攒的收成 × 倍率落袋。
  if (S.phase === "clear" || S.phase === "fail") {
    if (ev.code === "KeyE") { goHome(false); return; }
    if (ev.code === "Enter" || ev.code === "Space") {
      nextLevel();
      ev.preventDefault();
    }
  }
}

/* 真实 DOM 监听（浏览器直开 grove.html 时唯一的那条路）。 */
window.addEventListener("keydown", onKeyDown, true);

window.addEventListener("keyup", (ev) => {
  const k = KEYMAP[ev.code];
  if (k === "aim") S.aim = false;
  /* 松键**无条件**清，不看 phase。
     原来要求 phase === "play" 才清：在 clear / select 里松开 J，
     keys.atk 就一直挂着 true，回到 play 的第一帧立刻"自己喷了一发"，
     而且按着不放的效果会永远粘住。清键是收尾动作，收尾不该有前置条件。 */
  if (k) {
    S.keys[k] = false;
    if (S.phase === "play") ev.preventDefault();
  }
}, true);

/* 窗口失焦：把按键表整个清空。
   不挡的话，按住 → 切标签页 → 松开（keyup 打给了别的窗口）→ 回来，
   角色会自己一直往那个方向跑。这是浏览器里最经典的粘键。 */
window.addEventListener("blur", () => {
  for (const k of Object.keys(S.keys)) S.keys[k] = false;
  S.aim = false;
});

/* ============================================================================
   5. 物理：所有实体统一用「y = 脚底」的坐标
   ----------------------------------------------------------------------------
   球的圆心 = y - r，顶 = y - 2r。统一成"底部对齐"省掉了一堆
   "这个用中心那个用底部"的转换错误 —— 那类 bug 只在撞墙时才现形。
   ========================================================================== */

const GRAV = 2100;
const MAXFALL = 1250;

/* ============================================================================
   跳虫的四个数（2026-10-27）
   ----------------------------------------------------------------------------
   加跳虫不是为了"多一种怪"，是为了补一个结构性缺失：
   在此之前 `f.vy` 在全文只被赋过一次值，而且是 0 —— 249 只敌人里没有一只
   主动向上移动过一个像素。玩家跳上任何一块浮空台就绝对安全，
   于是"高度"对敌人无效，对玩家自然也就无效。

   四个数全部由**已有的重力**反推，不新造物理：
   · JUMPER_VY 720 → 跳起高度 = vy²/(2·GRAV) = 720²/4200 ≈ 123px。
     27 屏的台面只落在 156 / 248 / 350 / 462 四个高度，相邻层差 92~112px，
     所以 123 是"越过最高那档（462→350 差 112）+ 11px 余量"。
     再高就跳出画面，玩家读作"它飞起来了"。
   · JUMPER_PUSH 210 → 滞空 2·720/2100 ≈ 0.69 秒，横移 0.69×210 ≈ 145px。
     一道台面到斜上方那道台面的水平偏移就是这个量级。
     少了它，虫子只会原地上下，一次都上不了台面。
   · JUMPER_CD 2.2 → 两次扑击间隔。1.6 以下场上会变成"蛙群"，
     玩家没有能站稳的窗口；2.2 秒才读得成"它喘口气"。
   · JUMPER_LAND 0.28 → 落地硬直。**这条是公平性不是手感**：
     没有它，虫子落在你身边的同一帧就能撞掉一滴血。
   ========================================================================== */
const JUMPER_VY = 720;
const JUMPER_PUSH = 210;
const JUMPER_CD = 2.2;
const JUMPER_LAND = 0.28;

/**
 * 走一步：水平位移 → 挡墙 → 挡木桩 → 重力 → 落地。
 * 返回落地的平台（null 表示还在空中）。
 */
function stepBody(b, dt) {
  const prevY = b.y;
  b.hitWall = 0;

  b.x += b.vx * dt;
  if (b.x - b.w / 2 < WALL_L) { b.x = WALL_L + b.w / 2; b.vx = 0; b.hitWall = -1; }
  if (b.x + b.w / 2 > WALL_R) { b.x = WALL_R - b.w / 2; b.vx = 0; b.hitWall = 1; }

  // 木桩是实心墙，横向挡人。已经被球撞碎的（hp<=0）自动让路。
  // 只挡桩身那一段（桩顶到桩底）。少了下沿的话，立在 350 层的桩
  // 会变成一根通到地面的空气柱，人站在下一层同一条竖线上走不过去。
  for (const s of S.stumps) {
    if (s.hp <= 0) continue;
    const top = s.y - s.h;
    if (b.y <= top + 4) continue;           // 站在木桩顶上，不挡
    if (b.y - b.h >= s.y - 2) continue;     // 整个人在桩底下面，是下一层的事
    const l = s.x - s.w / 2, r = s.x + s.w / 2;
    if (b.x + b.w / 2 > l && b.x - b.w / 2 < r) {
      if (b.vx > 0) { b.x = l - b.w / 2; b.hitWall = 1; }
      else if (b.vx < 0) { b.x = r + b.w / 2; b.hitWall = -1; }
      b.vx = 0;
    }
  }

  b.vy = Math.min(b.vy + GRAV * dt, MAXFALL);
  b.y += b.vy * dt;

  b.onGround = false;
  b.ground = null;
  if (b.vy >= 0) {
    let best = null;
    // 下穿：只放过"脚下那一块"，落到下一层就停。
    // 上一版是"窗口内所有台面都不算落脚点"，于是按住 ↓ 会一路穿到地面 ——
    // 玩家要的是"下一层"，不是"跳楼"。窗口只用来兜住"刚起跳那几帧"，
    // 真正的范围由 dropPlat（脚下这一块）限死，层距再小也不会多穿一层。
    // skyDrop 是给 BOSS 天降用的：它要从天上直接落到地面，中途所有台面都不接。
    const dropping = b.dropT > 0 && (b.dropPlat || b.skyDrop);
    for (const p of PLATS) {
      if (isBroken(p)) continue;            // 断台：这块板已经没了
      if (dropping) {
        if (b.skyDrop) { if (p.kind !== "ground") continue; }
        else if (p === b.dropPlat) continue;
      }
      if (b.x + b.w / 2 < p.x || b.x - b.w / 2 > p.x + p.w) continue;
      // 单向平台：只有"上一帧还在顶面之上"的那一块算数，
      // 这样从下面跳上去能穿过去，不会一头撞死在板底
      if (prevY <= p.y + 2 && b.y >= p.y) {
        if (!best || p.y < best.y) best = p;
      }
    }
    // 木桩顶面也算落脚点 —— 不给的话，玩家跳到木桩正上方会被侧面
    // 判定一路推出去，看起来像"空气墙把人弹开了"
    for (const s of S.stumps) {
      if (s.hp <= 0) continue;
      const top = s.y - s.h;
      if (b.x + b.w / 2 < s.x - s.w / 2 || b.x - b.w / 2 > s.x + s.w / 2) continue;
      if (prevY <= top + 2 && b.y >= top) {
        if (!best || top < best.y) {
          best = { x: s.x - s.w / 2, y: top, w: s.w, kind: "stump" };
        }
      }
    }
    /* 石球顶面也是落脚点（2026-10-27）。
       **只给玩家**：`b.hero !== undefined`。给敌人的话，敌人会开始站在球上，
       那一屏的站位分布整体改变 —— ALL9 的清场基线是拿敌人站位调的，
       一只怪站高 20px 就可能让机器人的推球路线全废。石球是给玩家用的台阶，
       让敌人也吃它属于"顺手加的副作用"，不该混进这次改动。

       横向判定用 `r * 0.62` 而不是 `r`：球面是圆的，踩着边缘会滑。
       用满宽的话，玩家脚离圆心 0.9r 也算"站住了"，画面上人会悬在球外面。 */
    if (b.hero !== undefined) {
      for (const ball of S.balls) {
        if (!ball.stone || ball.dead) continue;
        const top = ball.y - ball.r;
        const hw = ball.r * 0.62;
        if (b.x + b.w / 2 < ball.x - hw || b.x - b.w / 2 > ball.x + hw) continue;
        if (prevY <= top + 2 && b.y >= top) {
          if (!best || top < best.y) {
            best = { x: ball.x - hw, y: top, w: hw * 2, kind: "ball", ball };
          }
        }
      }
    }
    // 斜坡：坡面也是落脚面。上一版只有球认坡、人不认，
    // 结果玩家走上去直接穿到地面 —— 看得见坡、踩不上去，地图就成了假的。
    if (!dropping) {
      const rp = rampAt(b.x);
      if (rp && b.vy >= -40 && onRampSurface(b.y, rp, prevY, 16)) {
        // 坡面是斜的，"离得最近"不能按 y 比 —— 按 |y - 坡面| 比，
        // 否则站在地面上、头顶有一条悬空滑梯时，平台会被那条滑梯顶掉。
        const dy = Math.abs(rp.y - b.y);
        if (!best || dy < Math.abs(best.y - b.y)) {
          best = { x: rp.x0, y: rp.y, w: rp.w, kind: "ramp" };
        }
      }
    }
    if (best) {
      b.y = best.y; b.vy = 0;
      b.onGround = true; b.ground = best;
    }
  }
  return b.ground;
}

/** 预演一次扑击的真实落点：`true` 表示"这一跳真的能落到**更高的那层**"。
 *
 *  ## 为什么必须有这一步（2026-10-27 用户："有点地方不能跳，有的可以"）
 *
 *  起跳判据原来只有三个条件：玩家高出 40px、水平 240px 内、冷却好了。
 *  **既没有上限，也不看落点**，于是两种白跳同时存在：
 *
 *   · 玩家在上面**两层**（层距 94/112，两层就是 206px）—— 虫照样蹲下起跳，
 *     可跳高只有 123px，顶到板底、掉回原地。玩家看到"它跳了，但上不来"。
 *   · 玩家在水平 240px 外 —— 也照跳，而滞空只能横移 107px，
 *     落点在半空中，掉回原地。
 *
