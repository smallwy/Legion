      const still = b._sx !== undefined && Math.abs(b.x - b._sx) < 0.25;
      b._sx = b.x;
      if (b.pushed && b.onGround && atWall && still) {
        b.stillT = (b.stillT || 0) + dt;
        if (b.stillT >= STONE_HOLD) { hardenBall(b); continue; }
      } else {
        b.stillT = 0;
      }
    }
    if (b.stone) { b.vx = 0; continue; }

    // ---- 漏气：这一版的核心压力
    // 滚动时慢慢漏，停着漏得更快。于是"攒 3 只再推"不是免费的：
    // 你攒的时间直接从这个球的剩余里程里扣。卷人回一口气，
    // 所以铺场是有回报的，但回报封顶，攒不出永动机。
    // 上一版用的是"停住 4.2 秒崩开"的固定倒计时 —— 玩家只要一路推着
    // 球走，倒计时就永远不开始，等于没有压力。
    const idle = b.onGround && Math.abs(b.vx) < 60;
    b.air -= dt * (idle ? 0.11 : 0.055);
    if (b.air <= 0) { b.air = 0; burstBall(b); continue; }

    // ---- 「推出去 = 一次性」
    // 用户的原话：球在底层的时候，只要推出去之后都要消失。
    // 不这么做的话，地面无摩擦 + 撞墙只衰减一次，底层会永远有几颗球在溜达，
    // 玩家分不清"哪颗还能用、哪颗是上一波的残骸"。
    //
    // 给 1.6 秒：够它滚 990px（从场中间推到墙、弹回来再撞第二串），
    // 但彻底堵死"无限滚"。自造但没推过的球不受这条约束 —— 玩家还能走上去推它。
    if (b.pushed) {
      b.relT = (b.relT || 0) + dt;
      if (b.relT > ballLife()) { burstBall(b, "滚远了…"); continue; }
    }

    // ---- 不减速。
    // 上一版给球加了摩擦（170/s），推出去滚 1100px 就自己停，玩家得追着推。
    // 现在地面完全无摩擦：球一旦被推起来就一路滚，直到撞墙、掉坑、漏气崩开。
    // 唯一的衰减来自**撞墙 ×0.62** —— 所以"往哪个方向推"变成一次真赌注：
    // 推对了滚穿一整层，推错了撞两次墙才能停下来再补一脚。
    //
    // 副作用（故意留着的）：球的巡航速度比玩家快，追不上。
    // 玩家必须提前决定，而不是跟在球屁股后面慢慢修 —— 这正是想要的手感。
    b.x += b.vx * dt;
    b.spin += b.vx * dt * 0.05;

    /* ---- 地面材质（N1）。用**上一帧**的 onGround 判，和 predictBall 同构 ——
       两处都必须在"位移之后、落地判定之前"用旧状态，否则差一帧就漂 10px。 */
    if (b.onGround && GROUNDS.length && b.y >= GROUND_Y - 26) {
      const mk = matAt(b.x);
      if (mk === "ice") b.vx *= 1 + MAT.ice.ballGain * dt;
      else if (mk === "mud") b.vx *= 1 - MAT.mud.ballDrag * dt;
    }

    /* ---- 反射板（N2）。放在撞墙判定**之前**：板是悬空的，不该先被墙夹一次。
       撞板不消耗撞墙次数（那是墙的规矩），但会记一笔，给 rebound 类目标用。

       `reflectCd` 只挡**文字和粒子**，不挡物理 —— 连撞两块板是设计里
       要的多段谜题，不能被特效节流误伤。 */
    if (REFLECTS.length) {
      _rb.x = b.x; _rb.y = b.y; _rb.vx = b.vx; _rb.vy = b.vy;
      if (reflectStep(_rb, b.r)) {
        b.x = _rb.x; b.y = _rb.y; b.vx = _rb.vx; b.vy = _rb.vy;
        b.onGround = false;
        b.rebounds = (b.rebounds || 0) + 1;
        S.shake = Math.max(S.shake, 4);
        if (!(b.reflectCd > 0)) {
          b.reflectCd = 0.15;
          for (let i = 0; i < 5; i++) addFrag(b.x - _rb.nx * b.r, b.y - _rb.ny * b.r, 5, "#9FE4FF");
          addText(b.x, b.y - b.r * 2 - 6, "弹!", "#BFEFFF", 15, 0.45);
        }
      }
    }
    /* ---- 赛道（TOUR）。判的是"球**这一帧**踩在哪层、踩在哪一段"，
       所以必须放在位移之后、落点判定之前。

       容差 12px 的来历：球的 y 是**底边**，贴台面时 y ≈ 台面 y，
       但落地那几帧会有 1~3px 的穿插/悬浮。12px 吃得掉这个抖动，
       又不足以让"从上一层掉下来穿过这一层"蒙混过关 ——
       自由落体一帧就掉 8px 以上，穿过时 y 跟台面只差十几像素，
       但它**不会在 x 区间里停住**，下一帧就飞出去了，游标照样不推进。
       （真正防止蒙混的是"必须在区间内"，不是 y 容差。） */
    if (TOUR.length && b.tour < TOUR.length) {
      const seg = TOUR[b.tour];
      /* x1/x2 一律按 min/max 取，不假设"小的写前面"。
         配置里写反了是常事（跑道的方向本来就有两向），
         写反就让整段失效的话，这种错没人查得出来 —— 它只是"球不计数"。 */
      const sx1 = Math.min(seg.x1, seg.x2), sx2 = Math.max(seg.x1, seg.x2);
      if (Math.abs(b.y - seg.y) <= 12 && b.x >= sx1 && b.x <= sx2) {
        b.tour++;
        const last = b.tour >= TOUR.length;
        addText(b.x, b.y - b.r * 2 - 12,
                last ? "赛道走完" : "跑道 " + b.tour + "/" + TOUR.length,
                last ? "#FFD86B" : "#8FE9C8", last ? 19 : 15, last ? 1.0 : 0.6);
        for (let i = 0; i < (last ? 12 : 5); i++) {
          addFrag(b.x, b.y - 4, 5, last ? "#FFD86B" : "#8FE9C8");
        }
        if (last) S.shake = Math.max(S.shake, 5);
      }
    }

    /* 滚动扬尘：只在贴地且够快时冒。节流 0.07s 一粒 —— 每帧都冒
       会糊成一条尾巴（拖尾已经有一条了，尘土再连成线就是双重残影）。
       出尘点在球**后脚跟**（运动反方向 0.6r），球往前滚、土往后扬。 */
    if (b.onGround && Math.abs(b.vx) > 150) {
      b._dc = (b._dc || 0) - dt;
      if (b._dc <= 0) {
        addDust(b.x - Math.sign(b.vx) * b.r * 0.6, b.y - 2, 1, 0.55);
        b._dc = 0.07;
      }
    }
    // 撞墙反弹。推出去的球最多弹一次 —— 第二次撞墙就地散掉，
    // 这是"底层不出现来回溜达的球"的最后一道闸。
    /* 撞墙反弹。
     *
     * 三处改动，都对着同一个现象：「球滚到边上就没了，不会弹」。
     *
     *  ① **最小反弹速度。** 原来只有 ×0.62 衰减。球贴着墙慢慢蹭过来时，
     *     一次反弹后只剩 3~8px/s —— 屏幕上几乎看不出在动，然后就是
     *     air 漏光 burstBall。玩家看到的完整过程是"撞过去 → 停住 → 消失"。
     *     现在任何一次撞墙都至少弹回 MIN_BOUNCE，眼睛一定读得到"弹"。
     *  ② **撞墙计数加速度门槛。** 原来不看速度，球在墙角蹭两下就散，
     *     读作"碰一下就没了"。改成只有真正撞（≥200）才计数。
     *  ③ **撞击反馈。** 木屑 + 震屏。没有反馈的反弹会被当成穿模，
     *     有碎屑才知道"是撞到了东西才弹的"。
     */
    if (!onGroundLane(b) && (b.x - b.r < WALL_L || b.x + b.r > WALL_R)) {
      const left = b.x - b.r < WALL_L;
      const impact = Math.abs(b.vx);
      const MIN_BOUNCE = 120;
      b.x = left ? WALL_L + b.r : WALL_R - b.r;
      /* ---- 低速撞墙不反弹，就地停住（2026-10-27，为石球服务）----
         原来这里无条件 ×0.62 + MIN_BOUNCE 兜底，也就是**球永远不会停在墙边**。
         于是"滚到墙角停住变成一块砖"这件事在物理上根本不可能发生 ——
         石球机制写了半天，实测触发 0 次。
         现在：推出去过、且已经很慢的球撞墙就直接 `vx = 0`，贴着墙停住，
         0.5 秒后由 `hardenBall` 硬化。玩家看到的是"滚到墙角，定住了"。
         **不计数 `wallHits`** —— 那是"撞散"的闸（>=3 爆球），
         停住的球没撞散，不该被它算进去。 */
      b.vx = -b.vx * 0.62;
      if (Math.abs(b.vx) < MIN_BOUNCE) b.vx = (left ? 1 : -1) * MIN_BOUNCE;
      S.shake = Math.max(S.shake, 5);
      // 木屑从撞点往外溅。两色交替，单色会读作"一撮土"。
      const hx = left ? WALL_L + 8 : WALL_R - 8;
      for (let i = 0; i < 6; i++) {
        addFrag(hx, b.y - b.r * 1.4, 5, i % 2 ? "#C98A50" : "#8B5A32");
      }
      /* 方向指向。木屑 + 震屏已经给了"有东西被撞了"，但没有给"往哪弹"——
       * 第 8 关两塔各 314 宽、八关里球道最窄，球半秒就撞一次墙，
       * 玩家看到的是"球在乱飞"，读成弹簧bug（体验评审第 4 条）。
       * 只在真撞（impact ≥ 200）时才出字：贴墙慢慢蹭的时候
       * 每帧都弹一下会刷满屏幕，那比不写更糟。 */
      if (impact >= 200) {
        addText(left ? WALL_L + 40 : WALL_R - 40, b.y - b.r * 2 - 4, "弹!", "#FFD8A0", 15);
      }
      if (impact > 200 && b.pushed) {
        b.wallHits = (b.wallHits || 0) + 1;
        if (b.wallHits >= 3) { burstBall(b, "撞散了…"); continue; }
      }
    }

    // 撞木桩：球是唯一能打碎木桩的东西 —— 所以"想开新路"必须先造球
    for (const s of S.stumps) {
      if (s.hp <= 0) continue;
      const top = s.y - s.h;
      // 这里的判据是**球底**而不是球顶：球底已经高过木桩顶面，
      // 说明它是在桩子上面滚过去的，不该被侧面挡住。
      // 写成 b.y - b.r（球顶）的话，条件刚好反过来 ——
      // 球永远撞不到木桩，而玩家看起来只是"木桩没有反应"。
      if (b.y <= top + 2) continue;
      if (b.y - b.h >= s.y - 2) continue;   // 球在桩底下面一层，撞的不是这根桩
      const l = s.x - s.w / 2, r = s.x + s.w / 2;
      if (b.x + b.r > l && b.x - b.r < r) {
        if (b.vx > 0) { b.x = l - b.r; } else if (b.vx < 0) { b.x = r + b.r; }
        else { b.x = l - b.r; }
        b.vx = -b.vx * 0.62;
        s.hp -= 1;
        s.shake = 0.2;
        S.shake = Math.max(S.shake, 8);
        hitStop(0.04);
        addText(s.x, top - 20, s.hp > 0 ? "咔!" : "撞碎了!", "#FFD08A", 18);
        for (let i = 0; i < 10; i++) addFrag(s.x, top + 10, 6, "#A97E4E");
        if (s.hp <= 0) {
          // 碎木桩掉果子 —— 破坏要立刻给回报，否则玩家不会主动去撞
          dropFrom(s.x, top + 26, 0.6);
          dropFrom(s.x, top + 26, 0.3);
        }
      }
    }

    // 重力 + 落地
    const prevY = b.y;
    b._fallVy = b.vy;
    b.vy = Math.min(b.vy + GRAV * dt, MAXFALL);
    b.y += b.vy * dt;
    b.onGround = false;
    b.ground = null;
    if (b.vy >= 0) {
      let best = null;
      for (const p of PLATS) {
        if (isBroken(p)) continue;          // 断台
        if (b.x + b.r < p.x || b.x - b.r > p.x + p.w) continue;
        if (prevY <= p.y + 2 && b.y >= p.y) {
          if (!best || p.y < best.y) best = p;
        }
      }
      if (best) {
        /* 落地反馈：之前这里只有物理（vy 清零），视觉上是"球悬浮到位"。
           尘土量按**这帧之前的下落速度**给 —— 轻放不扬灰，砸下来才有。 */
        if (b._fallVy > 130) addDust(b.x, best.y - 2, Math.min(7, 2 + b._fallVy / 90), Math.min(1.5, b._fallVy / 380));
        b.y = best.y; b.vy = 0; b.onGround = true; b.ground = best;
      }
    }

    // ---- 斜坡（第 4 关）
    // 球被"贴"在坡面上走：每帧把球底压到坡面高度，位移由 vx 决定，
    // 所以坡度只是一个 y = f(x) 的约束，不需要额外的碰撞体。
    // 速度变化用重力沿坡面的分量：上坡掉速、下坡加速 —— 这是物理，不是摩擦。
    const rp = rampAt(b.x);
    if (rp && b.vy >= -40 && onRampSurface(b.y, rp, prevY, 20)) {
      if (b._fallVy > 150 && !b.onGround) addDust(b.x, rp.y - 2, 4, 0.9);
      b.y = rp.y;
      b.vy = 0;
      b.onGround = true;
      b.vx -= GRAV * rp.slope * 0.45 * dt;
      /* 星靶「坡道入营」的标记：这颗球踩过坡。**标记而不是计数** ——
         判的是"有没有一颗球从坡上滚进营"，一颗球踩二十次坡也只算一次机会，
         所以计数点在落袋处（见营地那段），这里只负责记住。 */
      b.ramped = true;
    }

    // ---- 弹簧菇
    /* 这里修过三个病，**三个都在同一条链上**，少修一个还剩乱跳：
     *
     * ① 弹起速度原来是 `b.vy = -980` 的**赋值** —— 每次都一模一样高。
     *    球落回同一朵菇就再弹一次，永远收不了尾（实测能在几朵菇之间弹满 20 秒）。
     *    改成逐次衰减 0.72：980 → 706 → 508 → 366 → 264，第 5 次不足 300，
     *    当作普通地面放过，球自己滚开。
     * ② `bounceCd` 原来是 0.35s，而一个完整来回要 **1 秒**（上 0.5 + 下 0.5）——
     *    冷却早就过了，等于没有。提到 0.7s 才真正能"隔一次"。
     * ③ `b.vx` 被覆写成 ±200 —— 一颗 vx=-50 的慢球经过菇时速度突变成 -200，
     *    读起来就是"球自己窜了出去"。改成只补下限 120，方向永远跟着原 vx。
     *
     * 还有一个更隐蔽的：`b.bounceN` 只在**玩家重新推它**时清零（见 pushBall）。
     * 不清零的话球弹过 6 次就永远不再被弹 —— 下一次路过同一个关会以为菇坏了。
     */
    b.bounceCd = Math.max(0, (b.bounceCd || 0) - dt);
    /* 衰减计数按**位置**重置，不按时间。
     *
     * 一开始是"玩家重新推才清零"，结果是第 5 关（两级弹菇塔）直接废掉：
     * 地面那朵弹一次、350 那朵弹一次，第三朵就没劲了 —— 球堆在 350 层下不来。
     * 而如果改成"落地就清零"，第 12 关那朵被 248 台面压在正下方的菇又会
     * 无限反复弹（球落回同一处、清零、再弹满）。
     *
     * 分清这两种情况的唯一线索是**空间**：换了一朵菇，球横向走过了；
     * 同一朵反复弹，球几乎留在原地。所以按 120px 位移判。 */
    if (b.lastBounceX === undefined || Math.abs(b.x - b.lastBounceX) > 120) b.bounceN = 0;
    if (b.bounceCd <= 0) {
      for (const bo of BOUNCERS) {
        if (Math.abs(b.x - bo.x) > 30) continue;
        if (b.y < bo.y - 60 || b.y > bo.y + 10) continue;
        const k = Math.min(5, b.bounceN || 0);
        const pow = 980 * Math.pow(0.72, k);
        if (pow < 300) continue;              // 衰减到弹不动了，当普通地面
        b.vy = -pow;
        b.bounceN = k + 1;
        b.lastBounceX = b.x;
        // 慢球要有一点水平位移才离得开这朵菇，但**不覆盖方向**（见 ③）
        if (Math.abs(b.vx) < 120) b.vx = (b.vx < 0 ? -1 : 1) * 120;
        b.onGround = false;
        b.bounceCd = 0.7;
        /* 星靶「三弹菇」的计数。**放在弹成功之后** —— 衰减到弹不动
           （pow < 300 被 continue 掉）的那次不算，否则贴地滚过去也算触发。 */
        S.stat.shroom = (S.stat.shroom || 0) + 1;
        addText(bo.x, bo.y - 74, "弹!", "#C9F27A", 18);
        for (let i = 0; i < 8; i++) addFrag(bo.x, bo.y - 6, 6, "#8ED36A");
        S.shake = Math.max(S.shake, 4);
      }
    }

    // ---- 传送洞（第 6 关）
    // 保持水平速度原样穿过去 —— 方向不变，只换位置。
    // 所以"从左进、从右出"之后球还是往右滚，一球能把两端的人串成一条链。
    b.portalCd = Math.max(0, (b.portalCd || 0) - dt);
    if (b.portalCd <= 0) {
      for (const pt of PORTALS) {
        if (Math.abs(b.x - pt.x) > 26) continue;
        if (b.y < pt.y - 70 || b.y > pt.y + 8) continue;
        const o = PORTALS.find(q => q.id === pt.link);
        if (!o) continue;
        b.x = o.x;
        b.y = o.y;
        b.vy = 0;
        b.portalCd = 0.45;
        addText(o.x, o.y - 86, "穿过来了", "#9FE4FF", 17);
        for (let i = 0; i < 10; i++) addFrag(pt.x, pt.y - 26, 6, "#7FD8F0");
        for (let i = 0; i < 10; i++) addFrag(o.x, o.y - 26, 6, "#7FD8F0");
        S.shake = Math.max(S.shake, 4);
        break;
      }
    }

    // 撞敌人：不满 3 层的糊一层（泥球糊两层），已经 2 层的被一撞就卷进球里
    if (Math.abs(b.vx) > 60 || Math.abs(b.vy) > 60) {
      for (const f of S.foes) {
        if (f.dead || f.coat >= (f.cm || 3)) continue;
        /* 巢蛾在空中，**球直接穿过去**（规格："球碰不到，只能用光"）。
           这一条的代价要说清：玩家会先试一次"推球撞它"，撞不中会以为判定坏了。
           所以 updateFoe 的 moth 分支里挂了 `litOn`，绘制侧会给它打一层
           "被照亮"的描边 —— 玩家能看出"光在起作用、撞没用"。 */
        if (f.moth) continue;
        const dx = Math.abs(b.x - f.x), dy = Math.abs((b.y - b.r) - (f.y - f.h / 2));
        /* 这里**不加**飞行单位的判定容差。
         * 试过 `+10`，但那是"隔空撞到"——玩家看到球还没碰到鸟它就变球了，
         * 比打不着更糟。正确做法是把鸟的悬停高度压进判定区（见 fly 分支的
         * FLY_DROP），让它在物理上真的够得着，而不是放宽判定去凑。 */
        if (dx > b.r + f.w / 2 || dy > b.r + f.h / 2) continue;

        // BOSS：球撞上去糊一层，然后**弹回来**。
        // 这一条是 BOSS 战和普通战最大的区别：普通怪被撞就滚过去，
        // BOSS 把球弹回来 —— 玩家可以站在旁边连续推同一颗球砸它，
        // 不用每次重新糊一颗。限球关才打得动。
        if (f.isBoss) {
          coatFoe(f, (b.mud ? 2 : 1) + (b.frost || 0), null);
          if (b.frost > 0) { b.frost = 0; addText(b.x, b.y - b.r * 2 - 8, "冰壳碎了", "#BFE8FF", 15); }
          const dr = b.x < f.x ? -1 : 1;
          b.x = f.x + dr * (f.w / 2 + b.r + 2);
          b.vx = dr * Math.max(380, Math.abs(b.vx) * 0.85);
          b.vy = -140;
          b.relT = Math.max(0, (b.relT || 0) - 0.7);
          hitStop(0.05);
          S.shake = Math.max(S.shake, 9);
          S.flash = Math.max(S.flash, 0.06);
          continue;
        }

        // 冰壳是"一次性的弹药"：这一撞多吃几层，吃完全掉。
        // 不消耗的话，打三枪就能白嫖一整局，推球这件事就没有代价了。
        const frost = b.frost || 0;
        /* ---- 石壳：**不裹壳，只吃冲量** ----
         * 它是块圆石头，没有能"被糊住"的表面。撞上去的唯一结果是被推走，
         * 推的方向和力道来自球 —— 于是"把它推上坡"变成一件要做两次的事
         * （先撞一下给它速度，再看着它自己滚）。
         * **必须 `continue`**：漏了它会被下面的 coatFoe 裹成球，
         * 而石壳裹成球之后再滚进缝，玩家看到的是"石头变成球滚走了"。 */
        if (f.kind === "roll") {
          const dir = sign(b.vx || 1);
          f.rollV = clamp(f.rollV + dir * Math.min(520, Math.abs(b.vx) * 0.55), -720, 720);
          f.hitT = 0.18;
          addText(f.x, f.y - f.h - 10, "滚!", "#C8C0A8", 16);
          for (let i = 0; i < 7; i++) addFrag(b.x, f.y - f.h * 0.5, 5, "#A8A296");
          hitStop(0.03);
          b.vx *= 0.42;                 // 球自己被挡了一下：推石头是有代价的
          continue;
        }
        coatFoe(f, (b.mud ? 2 : 1) + frost, b);
        if (frost > 0) {
          b.frost = 0;
          addText(b.x, b.y - b.r * 2 - 8, "冰壳碎了", "#BFE8FF", 15);
          for (let i = 0; i < 7; i++) addFrag(b.x, b.y - b.r, 4, "#CFEFFF");
        }
        // 撞人不减速（阻尼那一节已经删了），只把球轻轻顶偏一点点，
        // 否则球会"穿过"一排敌人而不产生任何节奏变化。
        b.vx *= 0.995;
        S.shake = Math.max(S.shake, 5);
      }
    }

    // 地形判定。把"落下来时的竖直速度"一起传进去 ——
    // 水塘只认砸进水里的球（见 ballTerrain 里的理由）。
    ballTerrain(b, b._fallVy || 0);

    // 气到很低就开始抖 —— 视觉上给"快崩了"的信号，不用玩家盯血条
    if (onGroundLane(b)) {
      /* 地面层左端是**开口**（不是墙）：球整颗滚出画面就没了。
         必须先做这一条再做任何夹紧，否则 clamp 会把球按回场地里，
         玩家看到的是"球在边缘抖了一下又回来了"。

         ------------------------------------------------------------------
         **这里改过一次设计，因为上一版被玩家当成 bug 报上来。**
         ------------------------------------------------------------------
         旧写法是 `respawnPacked(b, 1, WALL_L + 46)` —— 球消失，装在里面的人
         原地放回 x=72。当时的理由是"直接 dead 的话玩家看到莫名其妙少了两只"。
         实测证明这个理由站不住：玩家读到的是「我把它撞下去了，它又活过来了」，
         违反因果，比"少了两只"更像故障。

         但人不能真的凭空消失 —— `S.total` 是固定的波次总数，`S.killed` 只统计
         **送进营地/火坑**的。人若蒸发又不计 killed，这一屏永远差几只，关卡
         直接变成不可通关。所以人必须回到场上，能做的是把**代价做得可见**：

           · 浮字说清是什么代价：「滚出去了 · 3 只白推」，不再是含糊的"滚出去了"
           · `stat.lost` 记**人次**（原来记次数），结算卡拿它报"白推"
           · 放回来的人裹壳层数不变（还是 1 层），惩罚在"白推了这一趟"，
             不在"要多糊三下" —— 后者会让这一屏直接崩盘

          **放回位置试过改，退回去了。** 先改成 `PLAYER_SPAWN.x`（想让它"退回起点"），
         第 8 屏当场从 48 秒达标变成 240 秒超时：出生点 x≈60 正好在某块台面底下，
         放回来的人起跳顶到台底，永远出不来 —— 和以前第 19 屏那个
         "机器人在 (46,481) 站死"是同一个病。12px 的差别就够踩中。
         所以位置保持 `WALL_L + 46`（这是被 27 屏验证过的安全值），
         要改观感只能改文案和特效，不能动坐标。

         判出界的线是**画面边缘**，不是逻辑墙 WALL_L。
         上一版写 `b.x + b.r < WALL_L - 2`（球心 < 46），球在离左缘 46px 的
         地方就没了 —— 那时左端有一根封口树干挡着，看起来像"滚进树根下面"。
         现在两端都是敞开的地面，球必须真的滚出屏幕才消失，
         否则就成了"在草地上凭空不见"。 */
      if (b.x + b.r < -4) {
        b.dead = true;
        const lostN = Math.max(1, b.holds);
        S.stat.lost = (S.stat.lost || 0) + lostN;
        const back = respawnPacked(b, 1, WALL_L + 46);
        for (const f of back) S.foes.push(f);
        addText(WALL_L + 90, GROUND_Y - 118,
                "滚出去了 · " + lostN + " 只白推", "#CBD8E8", 18);
        for (let i = 0; i < 8; i++) addFrag(14, GROUND_Y - 10, 5, "#8B5A32");
        continue;
      }
      /* ---- 右端**夹紧**，不留开口 ----
       * 和左端不对称是故意的：左边是出口，右边是墙。
       *
       * 主线营地永远贴右墙，球滚到那儿先被营地吃掉，所以"从右边滚出去"
       * 从来没发生过 —— 地面车道也就一直没做右侧夹紧。深巢有一半的层是
       * **整屏镜像**的（营地贴左墙），右边于是成了空地：球滚过 934 之后
       * 没人接，一路飞到 x≈1300、y 掉到 810，最后被 `b.y > H + 200`
       * 兜底静默清除 —— 装在里面的人凭空消失，`killed` 不加，
       * 这一层就永远差几只、永远打不通。机器人实测 21/31 层就死在这条路上。
       *
       * 夹紧而不是"滚出去"：右端没有出口的语义，让球贴墙停住（然后漏气崩开）
       * 比"人白推一趟"更符合玩家对这一侧的理解。 */
      if (b.x + b.r > WALL_R) {
        b.x = WALL_R - b.r;
        /* 低速撞右端也停住（2026-10-27）：地面车道这里原来只有 ×0.62，
           球会贴着右墙一直弹到漏气崩开 —— 玩家看到的是"球在墙角抽搐"。
           和台面那条走同一个门槛，石球才有可能出现在地面上。 */
        if (b.vx > 0) b.vx = -b.vx * 0.62;
      }
    } else {
      b.x = clamp(b.x, WALL_L + b.r, WALL_R - b.r);
    }

  }

  // ---- 球撞球：连带一起滚
  // 上一版两颗球互相穿透、各走各的 —— 场上两颗球像活在不同局里。
  // 现在撞上就把速度交给对方，两颗以同一个速度一起往前滚：
  // 一颗慢球可以被快球"带起来"，一路串成一条。
  for (let i = 0; i < S.balls.length; i++) {
    const a = S.balls[i];
    if (a.dead) continue;
    for (let j = i + 1; j < S.balls.length; j++) {
      const b = S.balls[j];
      if (b.dead) continue;
      const dx = b.x - a.x;
      const dy = (b.y - b.r) - (a.y - a.r);
      const sum = a.r + b.r;
      if (dx * dx + dy * dy > sum * sum) continue;
      // 只处理"正在靠近"的一对。两颗已经同速贴在一起的时候，
      // 每帧都结算一次会让它们像黏住一样抖。
      if (dx * (b.vx - a.vx) >= 0) continue;

      // 谁快听谁的：方向取快那颗的方向，速度取它的 96%（一撞掉 4%）
      const lead = Math.abs(a.vx) >= Math.abs(b.vx) ? a : b;
      const trail = lead === a ? b : a;
      let dir = sign(lead.vx) || 1;
      /* 贴着墙还往墙里带，两颗球会在角上互相弹、看起来一直在左边打转。
         已经靠墙了，就改成顺着墙往外滚。 */
      const hugL = a.x - a.r < WALL_L + 8 || b.x - b.r < WALL_L + 8;
      const hugR = a.x + a.r > WALL_R - 8 || b.x + b.r > WALL_R - 8;
      if (hugL && dir < 0) dir = 1;
      if (hugR && dir > 0) dir = -1;
      const sp = Math.abs(lead.vx) * 0.96;
      if (sp < 60) continue;

      // 分开，别让它们叠在一起
      const need = sum - Math.abs(dx) + 1;
      const sd = sign(dx) || dir;
      a.x -= sd * need * 0.5;
      b.x += sd * need * 0.5;

      lead.vx = dir * sp;
      trail.vx = dir * sp;
      // 被带起来的那颗也要算"推出去的"：不然它永远不消失，
      // 底层会留一颗不知道从哪来的球。
      for (const q of [a, b]) {
        q.pushed = true;
        q.relT = 0;
        q.wallHits = Math.min(q.wallHits || 0, 1);
      }
      addText((a.x + b.x) / 2, Math.min(a.y, b.y) - a.r * 2 - 12, "连滚!", "#FFE58A", 17);
      S.shake = Math.max(S.shake, 5);
    }
  }

  // 清掉死球
  let w = 0;
  for (let i = 0; i < S.balls.length; i++) if (!S.balls[i].dead) S.balls[w++] = S.balls[i];
  S.balls.length = w;
}

/* ----------------------------------------------------------------------------
   预瞄线
   ----------------------------------------------------------------------------
   这一版最重要的一件东西。没有它，玩家在"撞一下看看"；有了它，玩家在
   "算这一球能撞几个、会落在哪"。同一个物理，两种游戏。

   只模拟球自己会遇到的东西：墙、木桩、平台、地形。**不模拟敌人**，
   因为敌人会让球减速（每次 ×0.94）—— 忽略它只会让预测偏"远"，
   也就是"线画到哪，球至少能滚到哪"，宁可保守不要骗人。

   静态的球画左右两条。推球在雪人式玩法里就是个二选一，
   把两个后果并排摆出来，决策成本比读文字小一个数量级。
   -------------------------------------------------------------------------- */
const AIM_DT = 1 / 60;

function predictBall(b, dir, pow) {
  const r = b.r;
  let x = b.x, y = b.y;
  /* pow 不传就按基准 620 算（旧调用点全都还是两参数，行为不变）。
     传了就按真实推球力度算 —— 见 pushPowerNow()。 */
  let vx = dir * (pow || PUSH_BASE), vy = -40;
  let air = b.air;
  let mud = b.mud;
  let onGround = false;
  let bounce = 0, travel = 0, portalCd = 0, bouncerCd = 0, relT = 0, bounceN = 0;
  let tour = 0;      // 这条路线能走完几段赛道（从球当前的位置起算）

  const pts = [{ x, y: y - r }];
  const marks = [];
  const hitFoes = [];
  let end = "air";

  for (let i = 0; i < 360; i++) {
    // 用滚动漏气速率（0.055），不用静止的 0.11：预测算的是"推出去之后
    // 能滚多远"，按滚动算才对得上。
    air -= AIM_DT * 0.055;
    if (air <= 0) { end = "air"; break; }

    // 推出后 1.6 秒必散 —— 和 updateBalls 的寿命同一条。
    // 不画这一段，玩家就会以为线尾那段还算数，等于骗人。
    relT += AIM_DT;
    if (relT > ballLife()) {
      marks.push({ x, y: y - r, kind: "expire" });
      end = "expire";
      break;
    }

    // 不减速 —— 和 updateBalls 严格一致。这里如果偷偷加一点阻尼，
    // 线就会画短，玩家按线推出去球多滚一截，"预瞄骗人"是这一版最不能犯的错。
    x += vx * AIM_DT;
    travel += Math.abs(vx) * AIM_DT;

    /* 材质（N1）—— 和 updateBalls 里那三行**逐字同源**。
       顺序也一样：先位移，再用**上一帧**的 onGround 判材质。 */
    if (onGround && GROUNDS.length && y >= GROUND_Y - 26) {
      const mk = matAt(x);
      if (mk === "ice") vx *= 1 + MAT.ice.ballGain * AIM_DT;
      else if (mk === "mud") vx *= 1 - MAT.mud.ballDrag * AIM_DT;
    }

    /* 赛道（TOUR）—— 判据和 updateBalls 里那一处逐字同源。
       预瞄线必须能回答"这条路线能走完几段"，否则赛道关只能盲试；
       而盲试恰恰是这个游戏最不该有的东西 —— 有预瞄线就是为了不盲试。 */
    if (TOUR.length && tour < TOUR.length) {
      const seg = TOUR[tour];
      const sx1 = Math.min(seg.x1, seg.x2), sx2 = Math.max(seg.x1, seg.x2);
      if (Math.abs(y - seg.y) <= 12 && x >= sx1 && x <= sx2) {
        tour++;
        marks.push({ x, y: y - r, kind: "tour", n: tour });
      }
    }

    /* 反射板（N2）—— 同一把 reflectStep，连临时对象都是同一个。
       线在这里必须**拐弯**：如果预瞄线走直线而球撞了板，玩家照着直线推
       会得到完全不同的结果，这比不画预瞄线更坏。 */
    if (REFLECTS.length) {
      _rb.x = x; _rb.y = y; _rb.vx = vx; _rb.vy = vy;
      if (reflectStep(_rb, r)) {
        x = _rb.x; y = _rb.y; vx = _rb.vx; vy = _rb.vy;
        onGround = false;
        marks.push({ x, y: y - r, kind: "reflect" });
      }
    }

    /* 和 updateBalls 同一条：地面层两端是开口，上层才是墙。
       预瞄线在这里必须严格一致 —— 线上画着"会弹回来"、实际滚出去了，
       是这套系统里最不能被原谅的一种骗人。 */
    const aimGround = y >= GROUND_Y - 24;
    if (!aimGround) {
      if (x - r < WALL_L) { x = WALL_L + r; vx = -vx * 0.62; bounce++; }
      if (x + r > WALL_R) { x = WALL_R - r; vx = -vx * 0.62; bounce++; }
    } else if (x + r < WALL_L) {
      marks.push({ x: WALL_L, y: y - r, kind: "out" });
      end = "out";
      break;
    }
    // 只能弹一次：第二次撞墙球就散了（和 updateBalls 同一条）。
    // 以前允许弹三次，是因为球还能无限滚；现在球是"一次性"的，
    // 线画过第二次撞墙就是在骗人。
    if (bounce >= 3 || travel > 4000) { end = "wall"; break; }
    if (onGround && Math.abs(vx) < 40) { end = "stop"; break; }

    // 木桩：球撞上去就停，这是"想开新路先造球"的那道门
    let stump = null;
    for (const s of S.stumps) {
      if (s.hp <= 0) continue;
      const top = s.y - s.h;
      if (y <= top + 2) continue;
      if (y - r * 2 >= s.y - 2) continue;   // 和 updateBalls 同一条：下层的球不撞上层的桩
      if (x + r > s.x - s.w / 2 && x - r < s.x + s.w / 2) { stump = s; break; }
    }
    if (stump) { marks.push({ x, y: y - r, kind: "stump" }); end = "stump"; break; }

    // 重力 + 落地
    const prevY = y;
    vy = Math.min(vy + GRAV * AIM_DT, MAXFALL);
    y += vy * AIM_DT;
    onGround = false;
    if (vy >= 0) {
      let best = null;
      for (const p of PLATS) {
        if (isBroken(p)) continue;          // 断台：预瞄线和实跑必须同一套地形
        if (x + r < p.x || x - r > p.x + p.w) continue;
        if (prevY <= p.y + 2 && y >= p.y) { if (!best || p.y < best.y) best = p; }
      }
      if (best) { y = best.y; vy = 0; onGround = true; }
    }

    // 斜坡：和 updateBalls 同一套公式
    const rp = rampAt(x);
    if (rp && vy >= -40 && onRampSurface(y, rp, prevY, 20)) {
      y = rp.y; vy = 0; onGround = true;
      vx -= GRAV * rp.slope * 0.45 * AIM_DT;
    }

    // 弹簧菇。**和 updateBalls 里的主物理必须逐字同源** ——
    // 预测线算的是 980 的固定弹起、实际却是衰减弹起的话，玩家照着预瞄线推
    // 会发现球落点差一大截，那比不画预测线更糟。
    bouncerCd = Math.max(0, bouncerCd - AIM_DT);
    if (bouncerCd <= 0) {
      for (const bo of BOUNCERS) {
        if (Math.abs(x - bo.x) > 30) continue;
        if (y < bo.y - 60 || y > bo.y + 10) continue;
        const k = Math.min(5, bounceN);
        const pow = 980 * Math.pow(0.72, k);
        if (pow < 300) continue;
        vy = -pow; bounceN = k + 1;
        onGround = false; bouncerCd = 0.7;
        if (Math.abs(vx) < 120) vx = (vx < 0 ? -1 : 1) * 120;
        marks.push({ x: bo.x, y: bo.y - 46, kind: "bounce" });
      }
    }

    // 传送洞
    portalCd = Math.max(0, portalCd - AIM_DT);
    if (portalCd <= 0) {
      for (const pt of PORTALS) {
        if (Math.abs(x - pt.x) > 26) continue;
        if (y < pt.y - 70 || y > pt.y + 8) continue;
        const o = PORTALS.find(q => q.id === pt.link);
        if (!o) continue;
        marks.push({ x: pt.x, y: pt.y - 46, kind: "portal" });
        x = o.x; y = o.y; vy = 0; portalCd = 0.45;
        marks.push({ x: o.x, y: o.y - 46, kind: "portal" });
        break;
      }
    }

    // 会撞到几只（不扣速，只数数）
    for (const f of S.foes) {
      if (f.dead || f.coat >= (f.cm || 3)) continue;
      if (hitFoes.indexOf(f) >= 0) continue;
      if (Math.abs(x - f.x) < r + f.w / 2 && Math.abs((y - r) - (f.y - f.h / 2)) < r + f.h / 2) {
        hitFoes.push(f);
        marks.push({ x: f.x, y: f.y - f.h - 10, kind: "foe", n: hitFoes.length });
      }
    }

    // 地形：火坑断连锁、泥坑变强、水塘沉底、营地收工
    let hitPit = false;
    for (const pit of PITS) {
      if (pit.kind === "fire") {
        if (x > pit.x + 8 && x < pit.x + pit.w - 8 && y >= pit.y - 8) {
          marks.push({ x, y: y - r, kind: "fire" }); end = "fire"; hitPit = true; break;
        }
      } else if (pit.kind === "water") {
        if (vy > 240 && x > pit.x + 6 && x < pit.x + pit.w - 6 && y >= pit.y - 10) {
          marks.push({ x, y: y - r, kind: "water" }); end = "water"; hitPit = true; break;
        }
      } else if (pit.kind === "mud" && !mud) {
        if (x > pit.x && x < pit.x + pit.w && y >= pit.y - 8) {
          mud = true;
          /* ★ 2026-10-24 补：这里原来只标了 `mud = true`，**漏了实跑那一下
             `b.vx *= 0.72`**。于是所有穿过泥坑的预瞄线都比真实轨迹长 39%
             —— 玩家照着线推，球早停一截。这条骗了很多屏，一直没人发现，
             因为泥坑很少正好在球的必经路上。
             撞板那屏把它暴露了：预测说能上二层，实跑差 60px 上不去。 */
          vx *= 0.72;
          marks.push({ x, y: y - r, kind: "mud" });
        }
      }
    }
    if (hitPit) break;

    /* 送走点：主线是营地，深巢是任意一道裂缝 —— 走同一个数组。
       `end = "camp"` 这个标记名不改：`marks` 下游（12252 那一段）按它画
       "袋 / 落袋"的标记，深巢借用同一个标记，视觉上由 `drawChasms` 承担。 */
    if (y >= GROUND_Y - 6) {
      for (const ch of CHASMS) {
        if (x > ch.x && x < ch.x + ch.w) {
          marks.push({ x, y: GROUND_Y - 40, kind: "camp" }); end = "camp"; break;
        }
      }
      if (end === "camp") break;
    }

    if (i % 4 === 0) pts.push({ x, y: y - r, ph: bounce > 0 ? 1 : 0 });
  }

  pts.push({ x, y: y - r, ph: bounce > 0 ? 1 : 0 });
  return { pts, marks, end, hits: hitFoes.length, tour };
}

/* ============================================================================
   「加注」：第三只起，收成超线性（2026-10-27）
   ----------------------------------------------------------------------------
   玩家原话：「在机制上需要更丰富的设计，策略性、吸引力。」排查下来，
   现在每一局其实只做一个决定 —— **从哪只开始糊**。原因不是机制太少，
   而是机制**不相乘**：目标只改结束条件、武器只改弹道形状，两者都不改
   过程里的选择。玩家读完目标就知道怎么打，剩下全是执行精度。

   唯一能做出「赌 / 不赌」这个决定的杠杆是**一球装几只**。可原来的
   收成是线性的（`holds + 1`），装 4 只和装 4 次 1 只收益完全一样，
   而装 4 只明显更累、更容易全损 —— 于是最优解永远是"能推就推，
   别贪"。**线性收成把"贪"这个选项从游戏里删掉了。**

   改法是一层平方项，但**只在 holds >= 3 时才生效**：

     holds  1   2   3   4   5   6
     原来   2   3   4   5   6   7
     现在   2   3   5   8  12  17

   1 只和 2 只一个数都不变，这是刻意的：
     · 大部分入袋就是 1~2 只，所以 27 屏的 collect 目标（12/13/14）
       和机器人行为**完全不受影响** —— ALL9 基线不会被这次改动动摇；
     · 风险与收益都精确地落在"要不要再糊第三只"这一个瞬间上。

   **为什么不动推力、不加"重球更难推"**：`PUSH_BASE = 620` 是 27 屏
   落点的隐式输入（注释在常量表里写着，试过 800 就八关全废）。
   按 holds 削推力等于让每一关的落点都随球重变化，几何一次性作废。
   "贪"的代价本来就在系统里：球越重、攒的时间越长，**气漏得越久**，
   炸在水塘/火坑/半路 = 这一球全损。收成是分子，漏气时间是分母，
   分母早就写好了，只是之前分子是常数，这个比值从来没变过。

   验收口径（都不是拍脑袋）：跑 nest-play 看「每球卷人数分布」是否
   出现两极（要么 1~2 只，要么 4 只以上），而不是平均值移动。
   ========================================================================== */
/** 超过两只之后的**额外**收成。0 / 1 / 3 / 6 / 10 …（三角数）。
 *  抽成函数是因为**三处**都要用（营地/裂缝、火坑、以后可能的别的出口），
 *  各写一份必然漂 —— 这个项目在 `b.holds` 的记账上已经踩过一次。 */
function holdBonus(h) {
  return h >= 3 ? Math.round(0.5 * (h - 1) * (h - 2)) : 0;
}

/** 送走点（营地 / 地缝）的收成。**唯一真值**，绘制侧的文字也从这里读，
 *  不许在 addText 那边再算一遍 —— 会出现"文字 +8、实际 +5"。 */
function bankGain(holds, boss) {
  const h = Math.max(1, holds || 1);
  return h + 1 + holdBonus(h) + (boss ? 12 : 0);
}

/** 取缓存：球没动、气没变、敌人没死，就不用重算 */
function aimFor(b, dir) {
  b._aim = b._aim || {};
  /* pow 必须进缓存 key —— 玩家一边跑一边看预瞄线，助跑长度每帧都在变，
     不进 key 的话线会一直画第一次算的那条（"怎么跑都不动"）。 */
  const pow = Math.round(pushPowerNow());
  const key = [Math.round(b.x / 6), Math.round(b.y / 6), Math.round(b.air * 24), pow,
               S.foes.map(f => (f.dead || f.coat >= (f.cm || 3)) ? 0 : 1).join(""),
               S.stumps.map(s => s.hp).join("")].join("|");
  const slot = b._aim[dir];
  if (slot && slot.key === key) return slot.val;
  const val = predictBall(b, dir, pow);
  b._aim[dir] = { key, val };
  return val;
}

function ballTerrain(b, fallVy) {  // 火坑：烧掉，收成翻倍，但球没了 -> 断连锁
  for (const pit of PITS) {
    if (pit.kind !== "fire") continue;
    if (b.x > pit.x + 8 && b.x < pit.x + pit.w - 8 && b.y >= pit.y - 8) {
      b.dead = true;
      S.stat.burned++;
      /* `hotpit` 只改普通敌人的系数。BOSS 的 14 不动 —— 那一个数是按
         "打掉 BOSS ≈ 打掉 7 只" 定的，乘 1.5 会让 BOSS 变成唯一正解。 */
      /* 火坑每只 2 + 层数（lv0=2 / lv1=3 / lv2=4 / lv3=5） */
      const per = b.boss ? 14 : (2 + perkLv("hotpit"));
      /* **火坑必须跟着"加注"一起涨**，否则它会输给营地：
         营地改成超线性之后 holds=4 是 8，而火坑还是 4×2=8 —— 打平；
         holds=5 营地 12、火坑 10 —— **火坑反而更亏**。
         一个"球没了 + 断连锁"的高风险出口输给"稳"的出口，
         就没有存在的理由了。加同一条 holdBonus 之后：
           holds  3    4    5
           营地   5    8   12
           火坑   7   11   16   ← 始终高 2~4，风险溢价还在 */
      const gain = b.holds * per + holdBonus(b.holds);
      S.food += gain;
      S.killed += b.holds;
      addText(b.x, pit.y - 70, "烧掉了 +" + gain, "#FFB05C", 22);
      dropChest(b.x, pit.y - 36, b.holds);
      for (let i = 0; i < 26; i++) addFrag(b.x, pit.y - 12, 8, i % 2 ? "#FF9A3C" : "#FFD86B");
      S.shake = Math.max(S.shake, 10);
      S.flash = 0.18;
      return;
    }
  }

  // 水塘：球沉底，人被冲回岸上。
  // 这是三个落点里最差的一个：没有收成、球没了、人还得重新裹一遍。
  // 它存在的唯一意义就是让"推过头"有代价 —— 没有水塘的那几关，
  // 往左推和往右推一样安全，预瞄线就只剩"能撞几个"这一个信息。
  for (const pit of PITS) {
    if (pit.kind !== "water") continue;
    // 只有"砸进去"才沉（竖直速度 > 240）。
    // 不这么判的话，水塘放在场地两端就变成必死区：球撞墙反弹之后一定会
    // 从水面滚过去，泥沼那关机器人沉了 113 颗球，240 秒只清掉 3 只。
    if ((fallVy || 0) > 240 && b.x > pit.x + 6 && b.x < pit.x + pit.w - 6 && b.y >= pit.y - 10) {
      b.dead = true;
      S.stat.drowned++;
      const back = respawnPacked(b, 1, b.x);
      for (const f of back) S.foes.push(f);
      addText(b.x, pit.y - 74, "沉底了…", "#8FD8F0", 20);
      for (let i = 0; i < 18; i++) addFrag(b.x, pit.y - 14, 7, i % 2 ? "#7FC8E8" : "#CFEFFA");
      S.shake = Math.max(S.shake, 5);
      return;
    }
  }

  // 泥坑：球裹上泥，变重 —— 之后每次撞人 +2 层。这是"强化通道"，
  // 不是惩罚。三个地形各自对应一种"这一球我想要什么"。
  for (const pit of PITS) {
    if (pit.kind !== "mud" || b.mud) continue;
    if (b.x > pit.x && b.x < pit.x + pit.w && b.y >= pit.y - 8) {
      b.mud = true;
      b.vx *= 0.72;
      addText(b.x, pit.y - 60, "裹泥 · 更狠", "#B98A4E", 19);
      for (let i = 0; i < 10; i++) addFrag(b.x, pit.y - 10, 6, "#8A6238");
    }
  }

  /* ---- 送走点：主线 = 营地（落袋为安），深巢 = 裂缝（掉到下层）----
   *
   * 两边的**记账完全一样**（killed / food / bankHolds / 星靶 rampIn），
   * 差的是动词和表现：
   *   主线  球滚进营地 → 往上"回家"    → 暖黄、箱子落地、收成 +holds+1
   *   深巢  球滚进地缝 → 往下"掉下去"  → 冷紫、掉落碎屑、同一次记账
   *
   * **为什么必须共用同一段记账**：清场的判据是 `S.killed`，
   * 而 `checkGoal` 的第一条就是它。分成两段写，两段里必有一段的
   * `+= b.holds` 早晚漏掉（这个项目在 killByFall 上已经踩过一次，
   * 那次的表现是"人全没了，进度还差 3 只"，且没有任何报错）。 */
  let sunk = null;
  if (b.y >= GROUND_Y - 6) {
    for (const ch of CHASMS) {
      if (b.x > ch.x && b.x < ch.x + ch.w) { sunk = ch; break; }
    }
  }
  if (sunk) {
    b.dead = true;
    S.stat.banked++;
    /* 星靶「坡道入营」：这颗球踩过坡面才进的营。推上去的不算。 */
    if (b.ramped) S.stat.rampIn = (S.stat.rampIn || 0) + 1;
    // 落袋关考的是"只数"，不是"球数"：一球装三只走营地算三只
    S.stat.bankHolds += b.holds;
    /* 赛道关：只有**走完全程**的球才算数。
       没走完的照常给收成和落袋 —— 球是玩家费劲造出来的，一进营地就
       把它判成"废了"太黑；但 HUD 上那个「走完 N / M」的数是通关条件，
       它只认走完的。收成是过程奖励，不是通关条件，两件事不能混。 */
    if (TOUR.length) {
      if (b.tour >= TOUR.length) S.stat.toured++;
      else addText(b.x, CAMP.y - 116, "赛道没走完 · 不算", "#E8A0A0", 17, 1.0);
    }
    /* 收成走 `bankGain()` —— 唯一真值。第三只起超线性（见函数上方的
       「加注」注释）：1 只 = 2、2 只 = 3 和原来一样，3 只 = 5、4 只 = 8、
       5 只 = 12。**这里是整个游戏里"贪"唯一有回报的地方，所以文字必须
       把额外那部分说出来** —— 只显示 +8 的话，玩家读不出是"因为装了
       4 只"，下次还是会一只一只推。 */
    const gain = bankGain(b.holds, b.boss);
    const bonus = holdBonus(b.holds);
    S.food += gain;
    S.killed += b.holds;
    if (S.nest) {
      /* 深巢：往下。碎屑必须朝**下**飞（营地那一版是朝上飞 + 暖黄），
         这一条是"往下"这个动词在画面上的唯一落点。 */
      addText(b.x, GROUND_Y - 76, "掉下去了 · " + gain + (bonus ? " · 加注+" + bonus : ""), "#C8B0F0", 22);
      for (let i = 0; i < 16; i++) {
        addFrag(b.x + rand(-14, 14), GROUND_Y - 8, 7, i % 2 ? "#7A6AA0" : "#C8B0F0");
      }
      addDust(b.x, GROUND_Y + 6, 8, 1.2, "rgba(120,104,150,");
    } else {
      addText(b.x, CAMP.y - 80, "落袋 +" + gain + (bonus ? " · 加注+" + bonus : ""), "#FFD86B", 22);
      dropChest(CAMP.x - 18, CAMP.y - 36, b.holds);
      for (let i = 0; i < 16; i++) addFrag(b.x, CAMP.y - 40, 7, "#FFD86B");
    }
    S.shake = Math.max(S.shake, 6);
  }
}

/**
 * 把球里装着的人放回场上（崩开 / 沉底共用）。
 * coat 给 1：重新裹一层，玩家还得再糊两下，不能白赚。
 */
function respawnPacked(b, coat, atX) {
  // BOSS 崩开吐回来的还得是 BOSS。吐成普通怪的话，玩家会觉得"打错了"，
  // 而且下一轮再糊满会造出一颗普通球 —— 一个 BOSS 能漏成两条命。
  if (b.boss) {
    return [foeFromSpec({ foe: "boss", x: atX === undefined ? b.x : atX,
                          y: b.y - b.r * 2, lv: b.bossLv || 1 }, false)];
  }
  const n = b.packed.length;
  const out = [];
  const cx = atX === undefined ? b.x : atX;
  for (let i = 0; i < n; i++) {
    const def = b.packed[i];
    out.push({
      def, kind: def.kind,
      x: cx + (i - (n - 1) / 2) * 26, y: b.y - b.r * 2,
      w: def.w, h: def.h,
      vx: rand(-60, 60), vy: -260,
      face: -1, coat: coat, dead: false,
      onGround: false, ground: null,
      /* 从球炸开的位置继承悬停高度 —— 但**球可能是在坑里炸的**。
         坑里的球 y 能到 700+，减掉球径还有 650，接过来的鸦就飘在
         屏幕下方的黑暗里，永远打不到也永远不死（51 层实测）。
         所以继承之后必须夹一次上限。 */
      fly: def.kind === "fly", homeY: Math.min(b.y - b.r * 2 - 20, GROUND_Y - 80),
      stun: 0.5, hitT: 0, bob: rand(0, 6.28),
      dir: S.rng() < 0.5 ? -1 : 1,
      chargeT: 2, charging: 0,
    });
  }
  return out;
}

/** 把一颗停住的球硬化成「石球」：不再漏气、不再崩、可以踩。
 *
 *  三个必须做对的地方：
 *   1. `b.pushed = false` —— 否则"推出去 4.6 秒必散"那条会继续数，
 *      石球会在第 5 秒当着玩家的面炸开，而玩家刚把它踩在脚下。
 *   2. 超上限时爆的是**最老**的那颗（`S.balls` 里排在最前），不是新的那颗。
 *      爆新的等于"你刚摆好就没了"，玩家读作 bug；爆老的读作规则。
 *   3. 爆开必须走 `burstBall`（它内部 `respawnPacked` 把里面的人吐回场上）。
 *      自己写 `b.dead = true` 会让人凭空消失 → `killed` 不涨 → 这一屏不可通关。
 *      这个坑在 `killByFall` 上已经踩过一次，注释在 updateBalls 里。 */
function hardenBall(b) {
  b.stone = 1;
  b.vx = 0;
  b.vy = 0;
  b.stillT = 0;
  b.pushed = false;
  b.relT = 0;
  b.pushSquash = 0;
  S.stat.stoned = (S.stat.stoned || 0) + 1;
  addText(b.x, b.y - b.r * 2 - 18, "定住了", "#BDB49E", 17);
  for (let i = 0; i < 10; i++) addFrag(b.x, b.y - b.r, 5, i % 2 ? "#9C9482" : "#CFC7B2");
  S.shake = Math.max(S.shake, 2);

  const stones = S.balls.filter(x => x.stone && !x.dead);
  if (stones.length > STONE_MAX) {
    const old = stones.find(x => x !== b);
    if (old) {
      addText(old.x, old.y - old.r * 2 - 18, "撑不住了…", "#FF9E8E", 17);
      burstBall(old);
    }
  }
}

function burstBall(b, why) {
  b.dead = true;
  S.stat.burst++;
  // 装几只就吐几只 —— 和 absorbIntoBall 严格对称。
  // 少了就白赚，多了敌人会自己增殖，两种都会让局面失控。
  for (const f of respawnPacked(b, 1)) S.foes.push(f);
  addText(b.x, b.y - b.r * 2 - 20, why || "崩开了…", "#FF9E8E", 19);
  for (let i = 0; i < 18; i++) addFrag(b.x, b.y - b.r, 7, "#8FBF5E");
  S.shake = Math.max(S.shake, 7);
}

/* ----------------------------------------------------------------------------
   掉落
   ----------------------------------------------------------------------------
   球卷进一个人就爆一次。这不是"奖励"，是**让撞击有悬念**：

     · 大部分时候是一颗野果（+1 收成），维持基础经济
     · 偶尔是气罐（球回 28% 气）—— 连锁越长越容易出，直接强化"攒大球"
     · 更少见的晶核（+5）、心（回 1 点血）
     · 连锁越长，稀有池越宽 —— 这是"卷"除清场之外的第二层回报

   用 S.rng，所以固定种子下序列可复现，测试能断言概率结构。
   -------------------------------------------------------------------------- */
const DROP_KINDS = {
  fruit: { name: "野果", food: 1, color: "#FF6B5E", ring: "#FFD0C8" },
  berry: { name: "蜜莓", food: 2, color: "#C46BFF", ring: "#EBC8FF" },
  air:   { name: "气罐", air: 0.28, color: "#78D8FF", ring: "#D2F2FF" },
  gem:   { name: "晶核", food: 5,  color: "#7CF2C8", ring: "#D6FFF0" },
  heart: { name: "心",   heal: 1,   color: "#FF5A7A", ring: "#FFD6DE" },
  chest: { name: "宝箱", chest: true, color: "#FFC53D", ring: "#FFF3C0" },
};

/**
 * 宝箱 —— 只有「被球送走」才可能掉。
 *
 * 掉落点只有两个：火坑结算、营地结算。武器糊不死人（敌人只会被裹成球），
 * 所以「只有雪人式击杀才有宝箱」这条不用额外判断，是机制自带的。
 *
 * 概率随**这一球连带送走几只**上浮：
 *   单杀 14% / 两只 38% / 三只 62% / 四只以上封顶 85%
 * 这就是「卷」的第三层回报 —— 第一层省球，第二层稀有掉落，第三层宝箱。
 */
/** 掉落落在坑外的实地上。火坑正中、墙缝里都不算能捡的地方。 */
function landBeside(x, y) {
  let spot = x;
  for (const pit of PITS) {
    if (spot <= pit.x + 4 || spot >= pit.x + pit.w - 4) continue;
    if (y < pit.y - 140) continue;
    const left = pit.x - 28;
    const right = pit.x + pit.w + 28;
    const solid = (px) => PLATS.some((p) => px >= p.x + 16 && px <= p.x + p.w - 16 && Math.abs(p.y - pit.y) < 28);
    if (solid(right)) spot = right;
    else if (solid(left)) spot = left;
    else spot = right;
  }
  return clamp(spot, 64, 896);
}

function dropChest(x, y, holds) {
  const p = Math.min(0.85, 0.14 + (holds - 1) * 0.24);
  if (S.rng() > p) return false;
  const lx = landBeside(x, y);
  S.drops.push({
    kind: "chest", x: lx, y: y - 8,
    vx: (lx - x) * 1.4, vy: -220,
    taken: false, t: 0, spin: 0, holds: holds || 1,
  });
  addText(x, y - 30, "宝箱!", "#FFD65C", 21);
  S.shake = Math.max(S.shake, 5);
  return true;
}

/**
 * 在 (x, y) 爆一件掉落物。
 * boost 是"连锁长度加成"（0~1.5），越大越容易出稀有。
 */
function dropFrom(x, y, boost) {
  boost = clamp(boost || 0, 0, 1.5);
  const r = S.rng() * 100;
  let kind;
  if (r < 5 + boost * 9)        kind = "heart";
  else if (r < 16 + boost * 20) kind = "gem";
  else if (r < 32 + boost * 22) kind = "air";
  else if (r < 62)              kind = "berry";
  else                          kind = "fruit";

  const lx = landBeside(x, y);
  S.drops.push({
    kind, x: lx, y: y - 6,
    vx: clamp(lx - x, -70, 70), vy: -260,
    taken: false, t: 0, spin: rand(0, 6.28),
  });
}

/** 卷进去一个人：爆一件掉落，连锁越长越容易出好东西 */
function dropOnAbsorb(b) {
  dropFrom(b.x, b.y - b.r * 1.6, (b.holds - 1) * 0.5);
}

/* ============================================================================
   11. 弹丸
   ========================================================================== */

function spawnShot(o) {
  const s = Object.assign({
    vx: 0, vy: 0, r: 9, life: 0.5,
    color: "#FFFFFF", kind: "ball",
    pierce: false, grav: 0, aoe: 0,
    dir: 1, t: 0, spin: 0, bounces: 0,
  }, o);
  s.maxLife = s.life;
  s.hit = [];
  S.shots.push(s);
}

/**
 * 弹丸。六种 role 各走一条分支，但**命中之后的效果完全一样**（+1 层）。
 * 差异化只在"怎么打到"：来回、绕圈、贴地滚、抛、平推。
 */
function updateShots(dt) {
  const p = S.p;
  // 分身吐出来的影弹先攒着，循环结束再并进 S.shots ——
  // 边遍历边 push 会让新弹丸在同一个 dt 里被更新两次，轨道会跳一格。
  const spawned = [];
  for (const s of S.shots) {
    if (s.dead) continue;
    s.life -= dt;
    s.t = (s.t || 0) + dt;

    /* ---- 溜溜球：伸出去、拉回来。绳子一直连着人，人动了球跟着动 ---- */
    if (s.kind === "yoyo") {
      const u = (s.u && !s.u.dead) ? s.u : p;
      const T = 0.30;
      const k = s.t < T ? s.t / T
                        : Math.max(0, 1 - (s.t - T) / Math.max(0.001, s.maxLife - T));
      s.x = u.x + s.dir * (18 + k * 230);
      s.y = u.y - 26;
      s.spin += dt * 30;
      if (s.life <= 0) s.dead = true;
    }
    /* ---- 音波：一颗会撑开来的弹。往前飞，波前一路变宽 ---- */
    else if (s.kind === "wave") {
      s.x += s.vx * dt;
      s.r = Math.min(s.maxR || 46, s.r + (s.grow || 130) * dt);
      if (s.x < WALL_L - 40 || s.x > WALL_R + 40) { s.dead = true; continue; }
    }
    /* ---- 飞刀：丢出去，直线带一点下坠，高速自旋，能穿两个人 ---- */
    else if (s.kind === "knife") {
      s.vy += (s.grav || 700) * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.spin += dt * 26;
      if (s.x < WALL_L - 30 || s.x > WALL_R + 30 || s.y > GROUND_Y + 40) s.dead = true;
    }
    /* ---- 坚果：抛物线落地，之后贴地滚。撞墙弹一次 ---- */
    else if (s.kind === "nut") {
      const prevBottom = s.y + s.r;
      s.vy += 1600 * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.spin += s.vx * dt * 0.055;

      // 落在平台顶上（只认"从上面穿下来"的那一层）
      if (s.vy >= 0) {
        let land = null;
        for (const q of PLATS) {
          if (s.x < q.x || s.x > q.x + q.w) continue;
          const bottom = s.y + s.r;
          if (prevBottom <= q.y + 6 && bottom >= q.y) {
            if (land === null || q.y < land) land = q.y;
          }
        }
        if (land !== null) { s.y = land - s.r; s.vy = 0; }
      }

      if (s.x - s.r < WALL_L) {
        s.x = WALL_L + s.r;
        s.vx = -s.vx * 0.86;
        s.dir = -s.dir;
        if (s.bounces-- <= 0) s.dead = true;
      } else if (s.x + s.r > WALL_R) {
        s.x = WALL_R - s.r;
        s.vx = -s.vx * 0.86;
        s.dir = -s.dir;
        if (s.bounces-- <= 0) s.dead = true;
      }
      if (s.life <= 0) s.dead = true;
    }
    /* ---- 其余：直线 / 抛物 ---- */
    else {
      if (s.grav) s.vy += s.grav * dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.spin = (s.spin || 0) + dt * 9;

      if (s.kind === "lob") {
        // 只认"这一帧从台面上方落下来"。
        // 上一版只判 `s.y + s.r >= q.y`，那对**头顶上的平台**永远成立 ——
        // 平射出去的萝卜出门第一帧就炸在自己头顶那块板下面。
        const prevBottom = s.y + s.r - s.vy * dt;
        for (const q of PLATS) {
          if (s.x < q.x || s.x > q.x + q.w) continue;
          if (prevBottom <= q.y + 4 && s.y + s.r >= q.y) { explodeShot(s); s.dead = true; break; }
        }
        if (s.dead) continue;
      }
      if (s.life <= 0) {
        if (s.kind === "lob" && s.aoe > 0) explodeShot(s);
        s.dead = true;
        continue;
      }
      if (s.x < WALL_L - 40 || s.x > WALL_R + 40 || s.y < -100) { s.dead = true; continue; }
    }

    /* ---- 命中判定 ---- */
    for (const f of S.foes) {
      if (f.dead || f.coat >= (f.cm || 3)) continue;
      if (s.hit.indexOf(f) >= 0) continue;

      // 判定只有一种：圆。以前音波走"扇形"特判（因为它没有位置，挂在人身上），
      // 现在它自己有位置了，扇形那套就成了唯一一条走不到的分支。
      const dx = Math.abs(s.x - f.x);
      const dy = Math.abs(s.y - (f.y - f.h / 2));
      if (dx >= s.r + f.w / 2 || dy >= s.r + f.h / 2) continue;

      // 萝卜炮：碰到人就炸，不再"穿过去等落地"。
      // 它是唯一一把 AOE，AOE 的判定点必须在**命中那一刻**，
      // 而不是在它落地那一刻 —— 否则平射出去的萝卜只会炸到地面。
      if (s.kind === "lob") {
        explodeShot(s);
        s.dead = true;
        break;
      }

      coatFoe(f, 1);
      s.hit.push(f);
      if (!s.pierce) { s.dead = true; break; }
      if (s.hitMax && s.hit.length >= s.hitMax) { s.dead = true; break; }
    }
    if (s.dead) continue;

    /* ---- 打自己的球 = 给它冻上一层 ----
       球是场上唯一"友方但可被击中"的东西。以前子弹从球身上直接穿过去，
       手上的枪和场上的球像是两套不相干的系统。
       现在打一枪，球多一层冰壳（上限 3）：
         · 撞人时一次多糊一层，用掉就掉 —— 冰壳 3 层 = 一撞就整只卷走
         · 回一点气，所以"先打再推"不是纯亏
       子弹**不消耗**：球是个大目标，判它把子弹吃掉只会让人不敢开枪。 */
    for (const b of S.balls) {
      if (b.dead) continue;
      if ((b.frostCd || 0) > S.t) continue;
      const bdx = Math.abs(s.x - b.x);
      const bdy = Math.abs(s.y - (b.y - b.r));
      if (bdx >= s.r + b.r || bdy >= s.r + b.r) continue;

      b.frostCd = S.t + 0.12;
      const was = b.frost || 0;
      b.frost = Math.min(3, was + 1);
      b.air = Math.min(1, b.air + 0.10);
      for (let i = 0; i < 5; i++) addFrag(b.x, b.y - b.r, 4, "#CFEFFF");
      if (b.frost > was && was < 3) {
        addText(b.x, b.y - b.r * 2 - 10,
                b.frost >= 3 ? "冻实了!" : "冰壳 +1", "#BFE8FF", b.frost >= 3 ? 18 : 15);
        S.shake = Math.max(S.shake, b.frost >= 3 ? 5 : 2);
      }
    }

    /* ---- 木桩挡弹丸（坚果和溜溜球不挡：一个是滚过去的，一个是飞过去的） ---- */
    if (s.kind !== "nut" && s.kind !== "yoyo" && s.kind !== "wave") {
      for (const st of S.stumps) {
        if (st.hp <= 0) continue;
        if (Math.abs(s.x - st.x) < st.w / 2 + s.r && s.y > st.y - st.h && s.y < st.y) {
          s.dead = true;
          addFrag(s.x, s.y, 4, "#C8A070");
          break;
        }
      }
    }
  }

  if (spawned.length) S.shots.push.apply(S.shots, spawned);

  let w = 0;
  for (let i = 0; i < S.shots.length; i++) if (!S.shots[i].dead) S.shots[w++] = S.shots[i];
  S.shots.length = w;
}

function explodeShot(s) {
  for (const f of S.foes) {
    if (f.dead || f.coat >= (f.cm || 3)) continue;
    const d = Math.hypot(f.x - s.x, (f.y - f.h / 2) - s.y);
    if (d < s.aoe) coatFoe(f, 1);
  }
  for (let i = 0; i < 14; i++) addFrag(s.x, s.y, 7, i % 2 ? "#FFB05C" : "#FFE08A");
  S.shake = Math.max(S.shake, 5);
}

/* ============================================================================
   12. 特效与工具
   ========================================================================== */

function addFrag(x, y, n, color) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.283), sp = rand(60, 240);
    S.frags.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80,
      life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 4.5),
    });
  }
  if (S.frags.length > 320) S.frags.splice(0, S.frags.length - 320);
}

/** 尘土：不是碎片。碎片是"东西被撞碎了"，尘土是"有重量的东西落地/擦地"。
 *  两套并存的原因：尘土没有重力弹跳，是慢慢升起、变淡、变大的软圆 ——
 *  用碎片的抛物线运动做尘土，读出来是"地上蹦渣"，不是扬灰。
 *  pow 控制初速与尺寸量级：落地按下落速度给，滚动给小值。
 *
 *  **必须用 Math.random，不许用 rand()**：rand 消耗 S.rng（固定种子），
 *  而尘土挂在落地/滚动这些高频路径上 —— 每粒尘土消耗一次随机数，
 *  整局的敌人 AI、掉落序列就全变了。实测把"150 秒清场"的冒烟断言
 *  直接打到超时。视觉特效与玩法随机序列严格隔离。 */
function addDust(x, y, n, pow, col) {
  pow = pow || 1;
  for (let i = 0; i < n; i++) {
    S.dust.push({
      x: x + (Math.random() * 12 - 6) * pow, y: y + (Math.random() * 4 - 2),
      vx: (Math.random() * 92 - 46) * pow, vy: (Math.random() * 42 - 58) * pow,
      life: 0.34 + Math.random() * 0.28, max: 0.62,
      r: (2.4 + Math.random() * 2.6) * Math.min(1.6, 0.7 + pow * 0.5),
      col: col || "rgba(196,178,138,",
    });
  }
  if (S.dust.length > 200) S.dust.splice(0, S.dust.length - 200);
}

function addText(x, y, txt, color, size, life) {
  S.texts.push({ x, y, txt, color, size: size || 18, life: life || 0.9, max: life || 0.9 });
  if (S.texts.length > 24) S.texts.splice(0, S.texts.length - 24);
}

function hitStop(t) { S.hitStop = Math.max(S.hitStop, t); }

function overlap(a, b) {
  return Math.abs(a.x - b.x) < (a.w + b.w) / 2 &&
         Math.abs((a.y - a.h / 2) - (b.y - b.h / 2)) < (a.h + b.h) / 2;
}

function tickFx(dt) {
  for (const f of S.frags) {
    f.life -= dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.vy += 900 * dt;
    f.vx *= 0.99;
  }
  let w = 0;
  for (let i = 0; i < S.frags.length; i++) if (S.frags[i].life > 0) S.frags[w++] = S.frags[i];
  S.frags.length = w;

  /* 尘土：升、减速、微涨。没有重力 —— 尘土不该往下掉，
     往下掉就成碎石了。横向阻力大（0.9^dt 量级）让它很快停住，
     只剩"冒出来又散了"的那一下。 */
  for (const d of S.dust) {
    d.life -= dt;
    d.x += d.vx * dt; d.y += d.vy * dt;
    d.vx *= 0.90; d.vy *= 0.86;
  }
  w = 0;
  for (let i = 0; i < S.dust.length; i++) if (S.dust[i].life > 0) S.dust[w++] = S.dust[i];
  S.dust.length = w;

  for (const t of S.texts) { t.life -= dt; t.y -= dt * 42; }
  w = 0;
  for (let i = 0; i < S.texts.length; i++) if (S.texts[i].life > 0) S.texts[w++] = S.texts[i];
  S.texts.length = w;

  for (const s of S.stumps) if (s.shake > 0) s.shake = Math.max(0, s.shake - dt);

  S.shake = Math.max(0, S.shake - dt * 34);
  S.flash = Math.max(0, S.flash - dt * 2.2);

  // 掉落物：抛出去 → 落到最近的平台 → 被玩家捡 / 掉进坑里烧掉 / 15 秒后消失。
  // 落在平台上而不是一律落地面，是因为从高层炸出来的果应该留在高层 ——
  // 玩家在楼上打着架，不该跑下去捡一颗果子。
  for (const d of S.drops) {
    if (d.taken) continue;
    d.t = (d.t || 0) + dt;
    if (d.t > 15) { d.taken = true; continue; }

    const py = d.y;
    d.vy = Math.min(d.vy + 1500 * dt, 900);
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vx *= 0.994;

    // 掉进火坑 / 水塘：直接没了（不然捡一堆果子站在火里吃，很怪）
    // 宝箱例外 —— 它就是在火坑/营地边上刷出来的，被自己的火花烧掉太蠢了
    let gone = false;
    if (d.kind !== "chest") for (const pit of PITS) {
      if (pit.kind === "mud") continue;
      if (d.x > pit.x + 6 && d.x < pit.x + pit.w - 6 && d.y > pit.y - 8) {
        d.taken = true; gone = true;
        for (let i = 0; i < 5; i++) addFrag(d.x, d.y, 4, pit.kind === "fire" ? "#FFB05C" : "#8FD8F0");
        break;
      }
    }
    if (gone) continue;

    if (d.vy >= 0) {
      let best = null;
      for (const p2 of PLATS) {
        if (d.x < p2.x || d.x > p2.x + p2.w) continue;
        if (py <= p2.y + 2 && d.y >= p2.y) { if (!best || p2.y < best.y) best = p2; }
      }
      if (best) { d.y = best.y - 9; d.vy = 0; d.vx = 0; }
    }
    if (d.y > GROUND_Y - 9) { d.y = GROUND_Y - 9; d.vy = 0; d.vx = 0; }
  }
}

/* ============================================================================
   13. 绘制：背景
   ----------------------------------------------------------------------------
   背景只干一件事：把"这是一片林间空地"交代清楚，然后闭嘴。
   任何带形状的东西（树干、叶球）都推到画面两侧和顶部，绝不落进
   平台区 —— 上一版就是因为树画在单位背后，读起来像"战斗发生在树上"。
   ========================================================================== */

const COL = {
  outline: "#3A2B44",
  ink: "#20282A",
  grass1: "#4E8F55",
  grass2: "#6DB867",
  grass3: "#8ACB78",
  dirt: "#5C4432",
  dirt2: "#3E2E22",
  wood: "#7A5638",
  wood2: "#5C3E28",
  wood3: "#9A6E48",
  fireA: "#FF8A2E",
  fireB: "#FFD34E",
  mud: "#4A3826",
  camp: "#C99A4E",
};

/* ----------------------------------------------------------------------------
   Q 版背景
   ----------------------------------------------------------------------------
   原来画的是"暗色森林剪影"：树冠压在顶上、四边压黑、整体低饱和。
   问题是它像**横版探险**，不像**雪人兄弟那种一屏一关的卡通游乐场**。

   这里改成 Q 版战斗场景的四条硬规矩：
     1. 天空要亮、要彩，占画面上半，不能压黑 —— 单位才跳得出来
     2. 云、山、树全部用**圆弧**拼，不出现尖角（尖角 = 写实）
     3. 所有东西都有深色粗描边（3px 左右），像贴纸
     4. 背景对比度永远低于前景：远景只上 30% 不透明度，近景才实色
   -------------------------------------------------------------------------- */

function drawSky(g) {
  const sky = g.createLinearGradient(0, 0, 0, 330);
  sky.addColorStop(0, TH.sky1);
  sky.addColorStop(0.55, TH.sky2);
  sky.addColorStop(1, TH.sky2);
  g.fillStyle = sky;
  g.fillRect(0, 0, W, 340);

  /* 太阳：三层光。
     原来只有"一个圆 + 150 半径的小晕"—— 那读作"天上贴了个黄点"，
     画面整体还是平光，物体之间全靠描边分开。

     第一版把大晕写成 `rgba(255,244,196,.40)`（**接近白**），结果整片天空
     被提亮又掉饱和，出来是"沙漠灰"，不是概念图的金橙 —— 往白里混就是降饱和，
     这一层不能当"光"用，只能当"亮"用。
     大晕必须是**饱和橙**（#FFC96A）：色相推暖、明度只提一点点。 */
  /* 夜关画月亮，不画太阳。
     紫夜 + 一圈暖橙大光晕 = 一片粉紫，读作"日落的延迟摄影"挂在星空上 ——
     这是第 8 关最刺眼的一处违和：地面是夜、天上是黄昏。
     月亮只做三件事：一层弱冷晕、一个满月、几块环形山。
     光晕必须是**冷**的（190,206,255），换成暖白又变回日落。

     位置也不能用太阳那个 (700,74)：右上角被"清场"卡片占着，
     30px 的月亮会被整块盖住 —— 太阳没露馅是因为它的光晕有 520 半径，
     隔着一层卡片还能透出来；月亮小，盖住就真没了。挪到卡片下方。 */
  if (TH.night) {
    const mx = 858, my = 214;
    const night = g.createRadialGradient(mx, my, 16, mx, my, 300);
    night.addColorStop(0, "rgba(196,210,255,.22)");
    night.addColorStop(0.45, "rgba(164,182,242,.09)");
    night.addColorStop(1, "rgba(164,182,242,0)");
    g.fillStyle = night;
    g.fillRect(0, 0, W, 420);

    g.fillStyle = "rgba(242,246,255,.95)";
    g.beginPath();
    g.arc(mx, my, 28, 0, 6.283);
    g.fill();
    /* 环形山。没有它就是一个白色圆点，读作"UI 图标"；
       三块大小不一的暗斑压上去，才读作"月亮是个球"。 */
    g.fillStyle = "rgba(192,204,238,.50)";
    g.beginPath(); g.arc(mx - 8, my - 7, 7, 0, 6.283); g.fill();
    g.beginPath(); g.arc(mx + 8, my + 8, 5, 0, 6.283); g.fill();
    g.beginPath(); g.arc(mx + 11, my - 10, 3.6, 0, 6.283); g.fill();
    return;
  }

  const sunX = 700, sunY = 74;
  const wide = g.createRadialGradient(sunX, sunY, 20, sunX, sunY, 520);
  wide.addColorStop(0, "rgba(255,201,106,.34)");
  wide.addColorStop(0.45, "rgba(255,186,92,.13)");
  wide.addColorStop(1, "rgba(255,186,92,0)");
  g.fillStyle = wide;
  g.fillRect(0, 0, W, 420);

  const halo = g.createRadialGradient(sunX, sunY, 10, sunX, sunY, 140);
  halo.addColorStop(0, "rgba(255,253,226,.72)");
  halo.addColorStop(1, "rgba(255,250,214,0)");
  g.fillStyle = halo;
  g.fillRect(sunX - 150, sunY - 150, 300, 300);

  g.fillStyle = "rgba(255,252,226,.96)";
  g.beginPath();
  g.arc(sunX, sunY, 38, 0, 6.283);
  g.fill();
}

/* 一道从太阳斜打下来的光柱。
   只画一次、alpha 0.07，作用是把"光源在上方"这件事写进画面：
   没有它的时候，暖光只是"底色变黄了"，有了之后才读作"有光照进来"。
   角度固定 62°（不是 45°）—— 45° 会正好压在画面中轴上，
   变成一条把画面劈成两半的斜线；62° 靠右，只在右半屏扫过。 */
function drawSunShaft(g) {
  g.save();
  /* 夜关的"光柱"是月光，要更淡、更冷。暖白光柱压在紫夜色上，
     会在中段扫出一条**灰米色**的斜带 —— 紫里的暖光只会变脏，不会变亮。 */
  g.globalAlpha = TH.night ? 0.05 : 0.07;
  g.fillStyle = TH.night ? "#C8D6FF" : "#FFF6D2";
  g.beginPath();
  g.moveTo(700, 60);
  g.lineTo(760, 60);
  g.lineTo(300, H);
  g.lineTo(-40, H);
  g.closePath();
  g.fill();
  g.restore();
}

/** 一朵 Q 版云：三个圆叠一个平底，全部同一色，只有底部一条淡阴影 */
function drawCloud(g, x, y, sc, alpha) {
  g.save();
  g.globalAlpha = alpha;
  g.fillStyle = TH.cloud;
  g.beginPath();
  g.arc(x - 26 * sc, y + 4 * sc, 20 * sc, 0, 6.283);
  g.arc(x + 2 * sc, y - 8 * sc, 28 * sc, 0, 6.283);
  g.arc(x + 32 * sc, y + 4 * sc, 18 * sc, 0, 6.283);
  g.rect(x - 26 * sc, y + 4 * sc, 58 * sc, 17 * sc);
  g.fill();
  g.fillStyle = "rgba(180,214,240,.30)";
  g.beginPath();
  g.ellipse(x + 4 * sc, y + 19 * sc, 44 * sc, 6 * sc, 0, 0, 6.283);
  g.fill();
  g.restore();
}

/** 远山：二次曲线堆出来的圆顶，两层，越远越淡 */
function drawHills(g, baseY, amp, color, seed, step) {
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(-40, baseY + 40);
  for (let i = 0, x = -40; x < W + 80; i++, x += step) {
    const h = amp * (0.55 + hash(i + seed) * 0.55);
    g.quadraticCurveTo(x + step * 0.5, baseY - h * 1.5, x + step, baseY - amp * 0.16);
  }
  g.lineTo(W + 80, baseY + 40);
  g.closePath();
  g.fill();
}

/* ===========================================================================
 * 场景形状语言（2026-10-24 第三批）
 * ===========================================================================
 *
 * 病根：**27 屏共用同一套远景** —— 4 朵云、3 层圆顶山、一条光柱，
 * 位置参数全部写死，27 屏只换颜色。
 * 用户原话：「为什么不是在空间设计上多去思考 比如场景上的」。
 * 他是对的：**配色只能说明"这是哪个产地"，形状才能说明"这是另一个地方"。**
 *
 * 三族的形状语言必须彼此**不能混**，否则玩家读成"同一个地方换了滤镜"：
 *   hills  —— 圆顶、连续、水平起伏   （苔原 / 雪原 / 缓坡 / 井 / 塔）
 *   cliffs —— 垂直、断裂、尖角       （断崖 / 枯木三产地）
 *   marsh  —— 无山、一条水平线 + 细长竖直（沼泽三产地）
 *
 * cliffs 和 marsh 里都有"竖直"，区别是：cliffs 是**块**（宽 40~130，顶部是尖的），
 * marsh 是**线**（宽 2~4，成排）。块和线在缩到 30% 的缩略图里也不会混。
 * ------------------------------------------------------------------------- */

/** 主题 → 场景族。**不放 THEMES 里**：那 14 个主题块是配色，
 *  形状是另一条正交的轴，混在一起以后改配色会不小心改掉形状。 */
const SCAPE_OF_THEME = {
  tundra: "hills", snow: "hills", slope: "hills", bouncy: "hills",
  well: "hills", stairs: "hills", tower: "hills",
  cliff: "cliffs", wither1: "cliffs", wither2: "cliffs", wither3: "cliffs",
  marsh1: "marsh", marsh2: "marsh", marsh3: "marsh",
};
let SCAPE = "hills";

/**
 * 岩柱。**垂直**是这一族全部的辨识度来源 —— 圆顶山是"一条连续起伏的边"，
 * 岩柱是"一排彼此断开、顶上带尖的竖块"。两者的轮廓在缩略图里完全分得开。
 *
 * 三个参数不许省：
 *  - `lean`：顶点相对中轴的偏移。全是正立的矩形会读成"一排楼"，
 *    偏一点点才是自然岩石。
 *  - 尖顶上的小台阶：只有尖角的话是"一堆三角形"，加一级断崖才是"岩层"。
 *  - 柱身竖缝：不画的话整根柱子是纯色块，缩到 30% 读成背景贴纸。
 */
function drawCliffs(g, base, color, hMin, hMax, wMin, wMax, seed, n, alpha) {
  g.save();
  g.globalAlpha = alpha;
  /* 受光棱：**岩柱的辨识度一半来自这条棱，不来自填色。**
     没有它，柱子是一块和天空同族的紫色，缩到 30% 直接消失
     （第一版就是这样：截图里只有一片模糊的竖纹）。
     棱走左侧 —— 光源在右上，左侧是背光面，所以受光的那条边其实是**右**棱。
     这里按"右上光源"统一：右缘亮、左缘暗。 */
  const rim = hexMix(color, "#FFFFFF", 0.34);
  g.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 2.31 + seed);
    const h2 = hash(i * 5.17 + seed * 3);
    const h3 = hash(i * 7.79 + seed * 7);
    /* 位置不均匀：`h1 * 0.60` 让每个柱子的落点在格内浮动 60%。
       均分（i/n）会排成栅栏，而栅栏是"人造物"的形状语言。 */
    const cx = -70 + (W + 140) * ((i + 0.20 + h1 * 0.60) / n);
    const w = wMin + (wMax - wMin) * h2;
    const h = hMin + (hMax - hMin) * h3;
    const top = base - h;
    const lean = (h1 - 0.5) * w * 0.34;
    const l = cx - w / 2, r = cx + w / 2;

    g.beginPath();
    g.moveTo(l, base + 24);
    g.lineTo(l + w * 0.05, top + h * 0.16);
    g.lineTo(cx + lean - w * 0.12, top);
    /* 尖顶下面那一级台阶：`top + h*0.06` 而不是同高，
       读作"被风化掉一角的岩层"，不是"三角形的腰"。 */
    g.lineTo(cx + lean + w * 0.06, top + h * 0.09);
    g.lineTo(r - w * 0.03, top + h * 0.26);
    g.lineTo(r, base + 24);
    g.closePath();
    g.fill();

    /* 右缘受光棱：从尖顶沿右侧刃下来。
       宽度按柱子走（2~4px），太粗会读成"描边"，太细在 30% 缩略图里消失。 */
    g.strokeStyle = rim;
    g.lineWidth = Math.max(1.8, w * 0.055);
    g.beginPath();
    g.moveTo(cx + lean + w * 0.06, top + h * 0.09);
    g.lineTo(r - w * 0.03, top + h * 0.26);
    g.lineTo(r, base + 24);
    g.stroke();

    /* 柱身竖缝：一条从尖顶往下 55% 的暗线，宽度随柱子走。
       它是"这块石头有厚度"唯一的证据 —— 没有它，柱子是纯色块。 */
    g.fillStyle = "rgba(0,0,0,.10)";
    g.fillRect(cx + lean * 0.5 - 1, top + h * 0.10, Math.max(1.6, w * 0.045), h * 0.55);
    g.fillStyle = color;
  }
  g.restore();
}

/**
 * 芦苇。这一族**没有山** —— 地平线压得很低，画面大半是天空和雾，
 * 远景只有一排细长的竖线。这是和 hills 差距最大的一点：
 * 有山 / 没山，是两种完全不同的空间感受。
 */
function drawReeds(g, base, color, hMin, hMax, seed, n, alpha) {
  g.save();
  g.globalAlpha = alpha;
  g.strokeStyle = color;
  g.fillStyle = color;
  g.lineCap = "round";
  for (let i = 0; i < n; i++) {
    const h1 = hash(i * 3.13 + seed);
    const h2 = hash(i * 6.71 + seed * 2);
    const h3 = hash(i * 9.37 + seed * 5);
    const x = -24 + (W + 48) * ((i + h1 * 0.9) / n);
    const h = hMin + (hMax - hMin) * h2;
    /* 倾斜 ±0.30：全垂直的话，一排竖线读成"下雨"或者"栅栏"。
       自然界里没有一根芦苇是直的。 */
    const lean = (h3 - 0.5) * 0.60;
    const tipX = x + lean * h * 0.42;
    const tipY = base - h;
    /* 前景/远景审计探针（`S._fgAudit` 只有测试会开）：
       记录每一根的顶端 y。数值契约写在冒烟里，参数一改就报红 ——
       2026-10-25 那次"画面很乱"的根因就是没人算过顶端到哪。 */
    if (S._fgAudit) S._fgAudit.push(["reed", tipY]);

    g.lineWidth = 1.5 + h3 * 1.2;
    g.beginPath();
    g.moveTo(x, base + 8);
    g.quadraticCurveTo(x + lean * h * 0.10, base - h * 0.55, tipX, tipY);
    g.stroke();

    /* 穗：顶端一个斜的小椭圆。**必须有**，否则 60 根等长的线
       只读作"一片竖线"，读不出"这是植物"。 */
    if (h1 > 0.28) {
      g.save();
      g.translate(tipX, tipY - 4);
      g.rotate(lean * 0.9);
      g.beginPath();
      g.ellipse(0, 0, 2.6 + h2 * 1.6, 7.5 + h3 * 4, 0, 0, 6.283);
      g.fill();
      g.restore();
    }
  }
  g.restore();
}

/** Q 版树：树干一个圆角方块，树冠三四个圆点，深色描边 */
/**
 * 一团树叶的**单条闭合轮廓**。
 *
 * 原来树冠是 3 个圆：`fill()` 三次（canvas 填的是并集，看起来没问题），
 * 然后 `stroke()` 三次 —— **描边描的是三个整圈**，包括落在并集内部的那几段。
 * 结果树冠上出现三条互相穿插的弧线，读作"线框气泡 / 维恩图"，不像树。
 * 这是全场最"画出来"的一处，比平台材质更扎眼。
 *
 * canvas 没有"只描并集外轮廓"的 API（`destination-over` 那条路会把描边压到
 * 整个 canvas 底下，连天空一起盖掉）。所以换思路：**用一条路径画出团块**。
 * 按 13 个角度采样半径（两个不同频率的正弦错开，避免读成规则花边），
 * 再用二次贝塞尔穿过相邻采样点的中点，得到一条平滑闭合曲线。
 * 一条路径 fill、一条路径 stroke，内外永远一致。
 */
function blobPath(g, cx, cy, r, seed, cont) {
  /* **用密集采样 + 直线段，不用二次曲线穿中点。**
   *
   * 二次曲线穿中点的写法在采样点少的时候会把峰顶削成尖角：
   * 13 个点、幅度 0.30 出来一张海星；把幅度收到 0.07 是圆了，但圆成一团气球。
   * 两个极端都不对 —— 一片叶子既有起伏、又不该有尖角。
   *
   * 真因是采样密度：直线段只要够密，本身就看不出折角。
   * 48 个点、半径按两个频率的正弦起伏（0.16 / 0.08 → 3 个大瓣 + 5 个小瓣），
   * 得到的是"一团有起伏的叶子"，成本和二次曲线一样，只是循环次数多。
   * x 方向拉 1.10、y 方向压 0.94：树冠横着长，不是正圆。
   */
  const N = 48;
  /* `cont` = true 时**不新开路径**，往当前路径里追加一个子路径。
   *
   * 这是"一丛叶子 = 多个圆团的并集"唯一的可行写法：canvas 对同一条路径里
   * 多个闭合子路径按非零环绕填充，出来就是并集，内部不会出现交叉线。
   *
   * 踩过的坑：第一版没加这个参数，每个 lobe() 调用都在内部 beginPath()，
   * 于是画了 5 个圆、只有最后那一个被填充 —— 树冠和灌木全缩成一个
   * 淡色小圆，读起来像"雾里的光斑"。在画面上看起来完全像"颜色调淡了"，
   * 极难反推。 */
  if (!cont) g.beginPath();
  for (let i = 0; i <= N; i++) {
    const a = (i / N) * 6.283;
    const k = 1 + 0.16 * Math.sin(a * 3 + seed) + 0.08 * Math.sin(a * 5 - seed * 1.7);
    const px = cx + Math.cos(a) * r * k * 1.10;
    const py = cy + Math.sin(a) * r * k * 0.94;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}

/**
 * 一棵 Q 版树。
 *
 * `back`   —— true = 无描边（远景/中景）；false = 有描边（贴脸的近景）
 * `dim`    —— 空气透视的浓度，0 = 完全融进雾里，1 = 实色。
 *
 * **为什么要有 dim 这个连续值，而不是"远/中/近"三档枚举：**
 * 上一版只有 back 一个布尔，于是全部中景树只能是同一档颜色、同一档浓度，
 * 九棵排在一起读作"一条墙纸"。参考概念图里远处的树是**一层一层化进雾里**
 * 的，浓度必须连续可调，眼睛才分得出第 1 排、第 2 排、第 3 排。
 *
 * 退后不靠"调低 globalAlpha"（透明会和后面的绿混成脏色，读作"没画清"），
 * 靠**换色**：往地平线雾色里混。混得越多越像在雾里，这正是空气透视。
 */
/**
 * 枯木：**没有树冠，只有扭曲的枝干**。
 *
 * 这是 cliffs 族的植被语言。它和 drawTree 的区别不在"颜色更灰"，
 * 而在**轮廓里有没有那个圆团**：
 *   drawTree   = 一根杆 + 一团叶 → 轮廓上半是圆的
 *   drawDeadTree = 一根弯杆 + 几根尖枝 → 轮廓上半全是刺
 * 缩到 30% 之后颜色差别全没了，能留下的只有"圆 / 刺"这两个形状。
 *
 * 枝干要**向上分叉并逐渐变细**：等粗的分叉读作"晾衣架"。
 * 顶端不封口（不画小圆点）—— 枯枝的末端是断的，封口就成了"棒棒糖"。
 */
/* 背景植被的统一入口。
 *
 * **造型**和**数量**必须一起分派，只分派一个是不够的：
 *   - 只换造型（枯木）、数量照旧 30 棵 → 一屏全是刺，岩柱被切碎
 *   - 只减数量、造型照旧圆冠 → 稀稀拉拉一片圆树，"断崖"读不出来
 * 两件事绑在一个地方改，才不会改一半。
 */
function drawBgTree(g, x, baseY, sc, back, dim) {
  if (SCAPE === "cliffs") drawDeadTree(g, x, baseY, sc, dim);
  else drawTree(g, x, baseY, sc, back, dim);
}

/** 按场景族从树表里挑子集。 */
function bgTreeRow(arr) {
  if (SCAPE === "cliffs") return arr.filter((_, i) => i % 3 === 0);   // 15 → 5
  if (SCAPE === "marsh") return arr.filter((_, i) => i % 5 !== 4);    // 15 → 12
  return arr;
}

function drawDeadTree(g, x, baseY, sc, dim) {
  const D = dim === undefined ? 1 : dim;
  /* 74 → 96：第一版按 74 出来，中景枯木只有 37~56px 高，
     比球（44）高不了多少 —— 一屏"几根小木棍"，读不出"枯木林"。
     枯木没有树冠，**只能靠高度和枝展**撑住体量。 */
  const h = 96 * sc;
  g.save();
  g.globalAlpha = 0.55 + D * 0.45;
  const col = hexMix(hexMix(TH.trunkFar, TH.trunkNear, D), TH.horizon, (1 - D) * 0.45);
  const colDark = hexMix(col, "#20140B", 0.34);

  // 投影（和 drawTree 同一条规则：没有落影就是贴纸）
  g.fillStyle = "rgba(28,56,30," + (0.08 + D * 0.13).toFixed(3) + ")";
  g.beginPath();
  g.ellipse(x, baseY + 1.5, 16 * sc, 3.6 * sc + 1.5, 0, 0, 6.283);
  g.fill();

  g.lineCap = "round";
  // 主杆：一条微微 S 形的曲线，比直线"活"
  const bend = (hash(x * 0.71) - 0.5) * 13 * sc;
  g.strokeStyle = colDark;
  g.lineWidth = 9 * sc;
  g.beginPath();
  g.moveTo(x, baseY);
  g.quadraticCurveTo(x + bend, baseY - h * 0.55, x + bend * 1.25, baseY - h);
  g.stroke();
  // 受光的一侧细高光：只给左缘，压在暗杆上
  g.strokeStyle = col;
  g.lineWidth = 3.2 * sc;
  g.beginPath();
  g.moveTo(x - 2.4 * sc, baseY - 2);
  g.quadraticCurveTo(x + bend - 2.4 * sc, baseY - h * 0.55, x + bend * 1.25 - 2 * sc, baseY - h * 0.94);
  g.stroke();

  /* 分叉：4 根，从杆身的 38%~92% 处伸出。
     `sgn` 交替（+1/-1）保证左右都有，不然全偏一侧读作"被风吹歪"。
     长度按出发高度递减（越高枝越短）—— 真实的树枝是这个规律，
     反过来就像倒插的扫帚。 */
  const BRANCH = [[0.38, 0.52], [0.56, 0.44], [0.72, 0.36], [0.88, 0.26]];
  for (let i = 0; i < BRANCH.length; i++) {
    const [at, len] = BRANCH[i];
    const sgn = i % 2 ? 1 : -1;
    const bx = x + bend * at * 1.1;
    const by = baseY - h * at;
    const tx = bx + sgn * h * len * 0.62;
    const ty = by - h * len * 0.72;
    g.strokeStyle = colDark;
    g.lineWidth = (5.4 - i * 0.9) * sc;
    g.beginPath();
    g.moveTo(bx, by);
    g.quadraticCurveTo(bx + sgn * h * len * 0.30, by - h * len * 0.36, tx, ty);
    g.stroke();
    // 次生小枝：只在最下面两根上加，否则树冠会"长满"，失去枯的感觉
    if (i < 2) {
      g.lineWidth = 2.2 * sc;
      g.beginPath();
      g.moveTo((bx + tx) / 2, (by + ty) / 2);
      g.lineTo((bx + tx) / 2 + sgn * h * len * 0.26, (by + ty) / 2 - h * len * 0.30);
      g.stroke();
    }
  }
  g.restore();
}

function drawTree(g, x, baseY, sc, back, dim) {
  const D = dim === undefined ? 1 : dim;
  g.save();
  g.globalAlpha = back ? 0.88 * (0.55 + D * 0.45) : 1;
  /* 树干 60×sc、树冠 27×sc。
   *
   * **这两个数是从"一排绿篱"改回来的。** 原来是 40 / 31 —— 树干 37 高、
   * 树冠 62 宽，比例 1.2，读作"棒棒糖"或"灌木"，不读作树。
   * 中景的一排棒棒糖连起来就成了一道绿篱，这是第一版重做时最刺眼的问题。
   * 真实的中景树在低角度看是**细高的**：树干 58~60、树冠 26~27，
   * 高度/宽度比 1.7 左右，才读成"远处的一棵树"。
   *
   * 树干宽度保持 16×sc 不动（sc=0.8 时 13px）—— 这是比例的另一半，
   * 只拉长不加宽，才有"细高"而不是"柱子变长了"。 */
  const tw = 16 * sc, th = 60 * sc;

  /* 地面投影 —— 这一条是"贴纸感"最直接的解药。
   *
   * 一个物体如果不在它脚下的表面上留下影子，眼睛就判定"它和地面不是同一个空间"。
   * 之前十五棵中景树 + 十五棵远景树，一棵影子都没有，整排树读作
   * 剪好贴在草地上的贴纸。平台、坡、角色、球都有影子，唯独树没有 ——
   * 全屏最大的面积没有落影，这就是"假"的来源。
   *
   * 尺寸：宽 42×sc（树冠宽约 54×sc，影子收到 0.78 倍，太宽会像水洼），
   * 高 5×sc+2。远处（D 小）更淡更扁 —— 光越远越散，这是空气透视的另一半，
   * 和"颜色往雾里混"是同一件事的两个表现，必须同步。 */
  g.fillStyle = "rgba(28,56,30," + (0.09 + D * 0.15).toFixed(3) + ")";
  g.beginPath();
  g.ellipse(x, baseY + 1.5, 42 * sc, 5 * sc + 2, 0, 0, 6.283);
  g.fill();

  /* 颜色按 depth 在 treeFar ↔ treeNear 之间插值，再往雾里混一点。
   *
   * 上一版只做了一件事：往 horizon 混 (1-D)。D 从 0.28 到 0.82 的树，
   * 每一棵都是**从同一个 treeFar 出发**的，最近那棵也只比最远那棵实一点 ——
   * 拍出来十五棵树同一个淡橄榄色，深度只剩大小差别，整体读作"一层雾树"。
   * 正解是**两端都要动**：最近的那棵吃满 treeNear（深绿、有彩度），
   * 最远的那棵在 treeFar 之外再混 55% 的雾。两端拉开，中间才有梯度。 */
  const mixTo = (1 - D) * 0.55;
  const trunkBase = back ? hexMix(TH.trunkFar, TH.trunkNear, D) : TH.trunkNear;
  let leafBase = back ? hexMix(TH.treeFar, TH.treeNear, D) : TH.treeNear;

  /* **每棵树自己的色相偏移。**
   * 参考图里那片林子是黄绿 / 橙金 / 墨绿三种树混着长，一片林子读作"活的"；
   * 而我们十五棵树全从 treeNear 同一个颜色出发，只在明度上差 ——
   * 拍出来是一排同色蘑菇，间距再随机也救不了。
   * 偏移量按 x 取 hash，±0.30 —— 再多就开始像"每棵都换了树种"。
   * 暖的那头往夕阳的金黄偏，冷的那头往青绿偏，都不离开本关的色域。 */
  const hueShift = hash(x * 0.37 + 5.1) * 2 - 1;
  if (back) {
    /* 雪地的远景树**不能往暖金偏**。上面那条黄绿/橙金混色是为暖色森林调的，
       雪雾里的树只有两个方向：更冷、或被雪压得更白。
       所以这里不按 hueShift 的正负分冷暖，而是用它决定"这棵树积了多少雪"
       —— 一片雪林里每棵的积雪量本来就不一样，这个随机量正好现成。 */
    leafBase = TH.snow
      ? hexMix(leafBase, "#C6D8EC", 0.10 + hash(x * 0.91 + 3.3) * 0.30)
      : (hueShift > 0
        ? hexMix(leafBase, "#E8C066", hueShift * 0.34)
        : hexMix(leafBase, "#4C8C74", -hueShift * 0.30));
  }
  // 树干
  g.fillStyle = back ? hexMix(trunkBase, TH.horizon, mixTo) : TH.trunkNear;
  rr(g, x - tw / 2, baseY - th, tw, th + 4, 5 * sc);
  g.fill();
  /* 树冠：**三瓣叠加**，不是一个圆。
   *
   * 一个 blob 读作"棒棒糖"，这是上一版被指出的原话。真实树冠的轮廓是
   * 三四个大小不一的叶团挤在一起，最低那一瓣还要压住树干顶端 ——
   * 有这个压住关系，树冠才是"挂在树干上"的，不是"插在杆子上的球"。
   *
   * 瓣之间**不分别描边**：一条路径里放三个子圆，canvas 按非零环绕填充，
   * 出来就是并集，内部不会出现交叉线。远景树本来就不描边，近景树
   * 只描整圈外轮廓 —— 这也是"只描并集"在这个 API 下唯一的做法。
   */
  const cy = baseY - th - 13 * sc, r = 27 * sc;
  const seed = (x + (back ? 3.7 : 0)) * 0.031;
  const leafCol = back ? hexMix(leafBase, TH.horizon, mixTo) : TH.treeNear;
  g.fillStyle = leafCol;
  const lobe = (dx, dy, k, sd, cont) => blobPath(g, x + dx, cy + dy, r * k, sd, cont);
  if (back) {
    lobe(0, -r * 0.06, 1.00, seed, false);             // 主瓣
    lobe(-r * 0.52, -r * 0.34, 0.62, seed + 1.7, true);// 左上瓣，抬高
    lobe(r * 0.50, -r * 0.26, 0.66, seed + 3.1, true); // 右上瓣，抬高
    lobe(-r * 0.30, r * 0.44, 0.58, seed + 4.4, true); // 左下瓣
    lobe(r * 0.28, r * 0.48, 0.62, seed + 5.8, true);  // 右下瓣，压住树干顶
  } else {
    lobe(0, -r * 0.06, 1.00, seed, false);
  }
  g.fill();

  if (!back) {
    // 统一描边语言：全场物件同一个墨色，只有粗细按"远近"分档。
    // 原来是树 rgba(30,64,44,.55) 偏绿的 2.4px、平台 COL.outline 偏紫的 2.6px ——
    // 同一张画面上两套描边系统，读作"拼的图"，正是用户说的"像贴上去的"。
    /* 近景树是**单瓣 + 整圈描边**：并集没有可描的外轮廓（见灌木那段），
       而贴脸的两棵树描边重量是整个画面的定调 —— 宁可造型简单，
       也要保证"描边 = 这个物件的轮廓"这条规则不被破坏。 */
    g.strokeStyle = COL.ink;
    g.lineWidth = sc > 1.4 ? 3.4 : 2.8;
    blobPath(g, x, cy, r, seed);
    g.stroke();

    /* 受光面：一块**不描边**的浅色团。只有填充没有边线，所以不会又把树冠
       切成两半 —— 有边线就退化成原来那三个圆的问题。

       **受光色必须是暖的。** 原来写 `rgba(226,255,222,.30)`（冷白绿），
       在蓝天版本里看着像"叶面反光"，换到暖金天空之后立刻露馅：
       树冠读作"天上挂了一个浅米绿的球"，和周围一个色温都没有。
       光是橙色天空来的，高光就得偏暖 —— 这一点跟"前景受光边不用纯白"是同一条。

       **受光面必须在朝太阳的那一侧。** 太阳固定在 (700, 74)，原来两棵近景树
       的高光都固定偏左（x - r*0.24）—— 左边那棵（x=6）等于把高光画在了背光面。
       两个物件的受光方向互相矛盾，眼睛就把它们读成"两张贴纸"，
       这是"背景像贴上去的"里最隐蔽的一条。
       现在按 x 和太阳的左右关系取符号：太阳在右边，高光就往右偏。 */
    const lit = (700 - x) >= 0 ? 1 : -1;
    g.fillStyle = "rgba(255,238,178,.24)";
    blobPath(g, x + lit * r * 0.22, cy - r * 0.34, r * 0.44, seed + 1.9);
    g.fill();
    g.fillStyle = "rgba(255,246,206,.34)";
    g.beginPath();
    g.arc(x + lit * r * 0.30, cy - r * 0.42, r * 0.16, 0, 6.283);
    g.fill();

    /* ---- 树冠积雪（只雪地）----
       雪景最省事的识别特征不是"地面白"，是**树顶那道白边**。
       没有它，画面读作"雾里的森林"；有了它，一眼读作"下过雪的森林"。

       三条要点：
         · **不描边** —— 一描边就变成"树冠上贴了块白色补丁"，
           雪是堆上去的，它的边界是软的。
         · 位置比受光面再高一点、再大一圈：受光面在 r*0.34 处、半径 0.44r，
           雪在 r*0.46 / 0.66r —— 雪盖的是树冠**上表面**，不是正面的反光点。
         · 两块叠加（大块 + 小高光），因为纯一块 r*0.66 的白团边界太圆，
           看着像"顶了个球"；加一小块偏心高光，轮廓才碎、才像积的。 */
    if (TH.snow) {
      g.fillStyle = "rgba(240,247,255,.90)";
      blobPath(g, x + lit * r * 0.08, cy - r * 0.46, r * 0.66, seed + 4.4);
      g.fill();
      g.fillStyle = "rgba(255,255,255,.95)";
      g.beginPath();
      g.arc(x + lit * r * 0.18, cy - r * 0.58, r * 0.30, 0, 6.283);
      g.fill();
    }
  } else {
    /* 中景树冠也必须有一块受光面 —— **纯剪影排成一行就是一道绿篱**，
       这是重做第一版翻车的地方：15 棵树冠颜色一样、形状一样、没有明暗，
       叠起来读作"一条绿色的墙"，而不是"远处有几棵树"。
       但这里**不能描边**：描边会把远处的树钉到前景（描边的粗细是距离的刻度）。
       只给一块偏移的受光团：往太阳那一侧上移 18% 半径，往天光混 42%，
       远树（D 小）的 alpha 本来就低，这块会自然跟着淡下去。 */
    const lit2 = (700 - x) >= 0 ? 1 : -1;
    g.fillStyle = rgbaOf(hexMix(TH.treeFar, TH.cloud, 0.42), 0.55);
    blobPath(g, x + lit2 * r * 0.18, cy - r * 0.22, r * 0.62, seed + 1.9);
    g.fill();
  }
  g.restore();
}

/* ---- 草脊：地面与远山之间那条边 ------------------------------------------
 *
 * **上一版是 `fillRect(0, 300, W, H - 300)` —— 一条横贯全屏的绝对水平线。**
 * 这是"背景像贴上去的"最大的单一来源：任何一条贯穿整幅画面的直线，
 * 眼睛都会读成"两块图拼在这里"。参考概念图里草地是**一条起伏的脊**，
 * 脊后面才是远山和雾林，所以才有前后。
 *
 * 两个正弦叠加（周期约 2027 / 873，振幅 13 / 6.5），合成起伏 ±19.5px。
 * 周期刻意不成整数比 —— 单个正弦在 960 宽里会左右各留一段同形，
 * 读作"复制粘贴的波浪"。
 *
 * 振幅上限 20 是被碰撞几何反推的：脊线最高 280.5，而最上面那层平台在 248、
 * 坡底在 350，脊线不能越过 300±22 这条带，否则会开始和玩法元素打架。
 */
function ridgeY(x) {
  return 300 + Math.sin(x * 0.0031 + 1.1) * 13 + Math.sin(x * 0.0072 + 3.4) * 6.5;
}

/* ----------------------------------------------------------------------------
   落雪 —— 只在雪地主题生效
   ----------------------------------------------------------------------------
   **纯函数、零状态**：不建粒子数组，位置由 (序号, S.t) 直接算出来。
   三条理由：
     1) 不占存档、不影响任何玩法断言 —— grove-smoke 比的是数值，
        多一个数组就多一个可能被写坏的变量；
     2) 切关卡不用清场，S.t 一变雪自然错开；
     3) 和云是同一个做法（云也是 hash 固定位置）。
   **绝对不能用 Math.random()** —— 每帧随机会让雪变成噪点闪烁，
   只有 hash(seed) 才是一条稳定的下落路径。

   两档而不是一档：同尺寸同速度的雪片读起来是一层贴纸。
     远景 54 片 · 半径 0.9–1.6 · 26–40 px/s · alpha .45 → 靠"密"读作空气
     近景 16 片 · 半径 1.8–2.8 · 52–78 px/s · alpha .85 → 靠"大"读作距离

   横向漂移走 sin(t·0.7 + 相位)×10，不是匀速直线 —— 雪是打着旋落的，
   直线下落一眼假。相位由 hash 给，保证每片不同步。
   -------------------------------------------------------------------------- */
function drawSnowfall(g) {
  if (!TH.snow) return;
  const t = S.t;
  const span = W + 40;
  g.save();
  g.fillStyle = "#FFFFFF";
  for (let layer = 0; layer < 2; layer++) {
    /* 数量 80 / 22 是**量出来的下限**，不是拍的：第一版 54 / 16 在 960×600 上
       平均每 1.2 万个像素才有一片，截图里几乎找不到 —— 雪"看不见"等于没有。
       密度这东西没有"稍微一点"这一档：要么读得出在下雪，要么只是画面脏。

       **再乘一个随雪厚长的系数**：薄雪 35%、最厚 100%。
       同一场雪从稀到密，比"一开场就是大雪"多说明一件事 —— 时间在走。 */
    const k = 0.35 + 0.65 * S.snowDepth;
    const n = Math.max(4, Math.round((layer ? 22 : 80) * k));
    const rA = layer ? 1.8 : 0.9, rB = layer ? 2.8 : 1.6;
    const sA = layer ? 52 : 26, sB = layer ? 78 : 40;
    g.globalAlpha = layer ? 0.92 : 0.55;
    for (let i = 0; i < n; i++) {
      const h1 = hash(i * 1.37 + layer * 91.7);
      const h2 = hash(i * 4.11 + layer * 53.3);
      const h3 = hash(i * 7.73 + layer * 17.9);
      const spd = sA + (sB - sA) * h3;
      /* y 走 (t·spd + 初相位) % (H+40) 减 20 —— 让雪片**从画面上方外面
         进来、落到下方外面去**，而不是凭空在顶边出现、在底边消失。 */
      const y = ((t * spd + h2 * (H + 40)) % (H + 40)) - 20;
      const x = ((h1 * span + Math.sin(t * 0.7 + h2 * 6.283) * 10 + span) % span) - 10;
      const r = rA + (rB - rA) * h1;
      g.beginPath();
      g.arc(x, y, r, 0, 6.283);
      g.fill();
    }
  }
  g.globalAlpha = 1;
  g.restore();
}

/**
 * 云按场景族分派。
 *
 * hills 保留原来的四朵（那个位置是量过的：x=690 会压住太阳）。
 * cliffs 只留两朵、压得很高、拉得很扁 —— 岩柱已经占满竖向，
 * 云再"竖"就糊成一片；高空长条卷云和柱状岩体是互补的形状。
 * marsh **不画云**，画雾。阴天的沼泽没有一朵一朵的云，
 * 只有一层贴在地平线上的白 —— 这一条比换颜色更能说明"这里气氛不一样"。
 */
function drawClouds(g) {
  if (SCAPE === "marsh") {
    /* 低雾：地平线上 0..46px 的一条，两头淡。用圆角矩形拼比用渐变便宜，
       而且雾的**边缘**本来就不该是数学上的平滑衰减。 */
    for (let i = 0; i < 7; i++) {
      const h1 = hash(i * 4.7 + 13);
      const h2 = hash(i * 8.3 + 41);
      const x = -60 + (W + 120) * ((i + h1 * 0.7) / 7);
      const y = 262 + h2 * 22;
      g.save();
      g.globalAlpha = 0.10 + h1 * 0.11;
      g.fillStyle = TH.cloud;
      g.beginPath();
      g.ellipse(x, y, 90 + h1 * 130, 9 + h2 * 15, 0, 0, 6.283);
      g.fill();
      g.restore();
    }
    return;
  }

  if (SCAPE === "cliffs") {
    // 高空卷云：拉扁的椭圆叠成一条，比 drawCloud 更"横"
    for (let i = 0; i < 2; i++) {
      const cx = (i ? 640 : 250) + Math.sin(S.t * (i ? 0.09 : 0.12) + i * 2) * 16;
      const cy = i ? 58 : 90;
      g.save();
      g.globalAlpha = i ? 0.44 : 0.30;
      g.fillStyle = TH.cloud;
      for (let k = 0; k < 4; k++) {
        g.beginPath();
        g.ellipse(cx + k * 34 - 50, cy + (k % 2) * 5, 46 - k * 5, 8 - k * 1.2, 0, 0, 6.283);
        g.fill();
      }
      g.restore();
    }
    return;
  }

  // 云：远慢近快，四朵。位置用 hash 固定，不用随机 —— 每帧随机会闪。
  // x=690 那朵原来正好压在太阳上（太阳默认 700,74），整颗太阳被吃掉，
  // 只剩一圈光晕 —— 于是"有光没太阳"。向左让出 110。
  drawCloud(g, 160 + Math.sin(S.t * 0.10) * 14, 66, 1.0, 0.92);
  drawCloud(g, 470 + Math.sin(S.t * 0.14 + 2) * 18, 44, 0.74, 0.80);
  drawCloud(g, 560 + Math.sin(S.t * 0.08 + 4) * 10, 104, 0.62, 0.62);
  drawCloud(g, 300 + Math.sin(S.t * 0.12 + 1) * 12, 122, 0.48, 0.45);
}

/**
 * 远景场景。**这一屏是"哪个地方"的主要判据。**
 *
 * hills 的三层参数一个都不能随便动（最远那层是近白的雾，只有轮廓；
 * 两层不够 —— 只有两级的话"远"和"中"挨在一起，读作同一片背景）。
 * cliffs / marsh 沿用同一条"三层"原则，只是把每一层的**形状**换掉，
 * 这样三族的纵深关系一致，玩家不会觉得某一族"扁"。
 */
function drawScape(g) {
  if (SCAPE === "cliffs") {
    /* 三层岩柱。近层**更矮更宽**：近的东西在画面里占的面积大，
       如果近层也高，一排柱子会顶到天空上沿、压迫感过强，
       而且会盖住远处的太阳。 */
    /* 颜色**不能直接用 hillFar / hillNear** —— 那两个是给"圆山"算的，
       按"远山往天空里退"的比例混出来，在紫夜和灰岩主题下和天空几乎同色。
       岩柱要读成"石头"，所以往木色（土）里混 0.30，明度再压一档：
       石头是画面上**比天空暗**的东西，不是比天空淡的东西。 */
    const rockFar = hexDim(hexMix(TH.hillFar, TH.trunkNear, 0.30), 0.96);
    const rockNear = hexDim(hexMix(TH.hillNear, TH.trunkNear, 0.26), 0.90);
    drawCliffs(g, 292, "#FFFFFF", 118, 186, 26, 52, 3, 7, 0.14);
    drawCliffs(g, 306, rockFar, 92, 158, 38, 82, 7, 6, 1);
    drawCliffs(g, 322, rockNear, 50, 104, 54, 116, 11, 5, 1);
    return;
  }

  if (SCAPE === "marsh") {
    /* 沼泽**没有山**。只有：
         ① 远处一条积水亮带（在草脊 276 之上 6px，被草地压住下沿）
         ② 两层芦苇（远层淡而高，近层实而矮）
       地平线压在 280（= 草脊 276 往下 4px）—— 不能更低：
       再低就会在草地和天空之间露出一条"没有东西"的缝。 */
    const wl = g.createLinearGradient(0, 258, 0, 280);
    wl.addColorStop(0, rgbaOf(TH.hillFar, 0.0));
    wl.addColorStop(0.55, rgbaOf(TH.cloud, 0.30));
    wl.addColorStop(1, rgbaOf(TH.hillNear, 1));
    g.fillStyle = wl;
    g.fillRect(0, 258, W, 22);

    /* ★ 2026-10-25：**这一层才是"画面很乱"的主因，不是中景那一层。**
       上一版 n=72 + n=58 = **130 根**，h 70~132 → 顶端 282-132 = **150**，
       也就是从地平线一路竖到画面上四分之一处，把天空、远树、350 层平台、
       462 层平台全部穿过一遍。960px 上 130 根 = 平均 7.4px 一根，
       读出来不是"芦苇荡"，是"整个屏幕被划了很多竖道"。
       对照 `_cmp-old-s20.png`（三族之前没有这一层）干净得多。

       现在 60 根、顶端封顶 228（hMax 54，全在草脊 276 之上、离地 48px 内）。
       芦苇在这一层只承担一件事：**证明地平线是湿地**。
       它不需要"高过树冠"——那是中景该干的活，而中景现在只剩 34 根矮的。 */
    drawReeds(g, 282, TH.hillFar, 24, 54, 5, 34, 0.40);
    drawReeds(g, 286, TH.hillNear, 16, 38, 11, 26, 0.72);
    return;
  }

  // hills：最远一道近白的雾（只有轮廓）→ 远山 → 近山
  drawHills(g, 296, 104, rgbaOf("#FFFFFF", 0.20), 3, 224);
  drawHills(g, 310, 72, TH.hillFar, 7, 178);
  drawHills(g, 324, 46, TH.hillNear, 11, 134);
}

/** 深巢的场景：一口竖井的**背景**（岩体 / 层理 / 天花板 / 岩地）。
 *
 *  **为什么这层比井壁和暗罩都重要**：井壁只解决了"左右有边界"，
 *  暗罩只解决了"整体偏暗"，可背景本身还是主线的天空 + 远山 + 树线 ——
 *  于是玩家看到的是"傍晚的森林里立着两根石柱"。要读成地底，
 *  画面必须回答三个问题：**上缘是什么（岩体，不是天）**、
 *  **光从哪来（脚下，不是右上）**、**脚下踩的是什么（碎石，不是草）**。
 *
 *  这三条全部落在这一层里。它不参与任何物理，纯绘制，
 *  所以改它不会让任何一层变得不可通关 —— 这也是先做它的原因。
 */
function drawNestScene(g) {
  const d = (S.nest && S.nest.depth) || 1;
  const rnd = nestRand(d * 4831 + 7);
  /* 远处地面的起点。取 296 是为了和主线的草脊（276~322）落在同一档高度 ——
     两边的**透视关系**要一致，否则换玩法时玩家会觉得镜头变了。 */
  const HZ = 296;

  /* ① 岩体底：**上暗下亮**，和主线正好相反。
     主线是右上斜阳（天最亮、地面最暗），地底的光在脚下。
     这一条反过来的明度梯度，比换任何颜色都更能说明"这里不是外面" ——
     它作用在整屏上，玩家第一眼看到的就是它。 */
  const bg = g.createLinearGradient(0, 0, 0, GROUND_Y + 20);
  bg.addColorStop(0, TH.sky1);
  bg.addColorStop(0.50, TH.sky2);
  bg.addColorStop(1, TH.hill2);
  g.fillStyle = bg;
  g.fillRect(0, 0, W, H);

  /* ② 层理：7 条横向岩层，带起伏、左右不等宽。
     **不能画成贯通的横条** —— 满宽的直线会读成"条纹布"，
     而岩石的层理是"一层压着一层、长度不齐"。
     所以每条单独给起点/终点/起伏相位，全部由深度种子决定：
     同一层每次进来长得一样（可记忆），换一层就换一套。 */
  for (let i = 0; i < 7; i++) {
    const y = 26 + i * 66 + rnd() * 20;
    const h = 10 + rnd() * 22;
    const x0 = rnd() < 0.5 ? 0 : rnd() * 180;
    const x1 = W - (rnd() < 0.5 ? 0 : rnd() * 180);
    if (x1 - x0 < 120) continue;
    const dark = i % 2 === 0;
    /* 深巢背景是暗的，第一版给的 .20 / .16 在截图里**完全看不见** ——
       "有层理"和"没有层理"看起来一模一样。暗底上的层理得靠更狠的差：
       暗线压到 .34，亮线用 rockLit（比背景亮一档）而不是半透明叠加。 */
    g.fillStyle = dark ? "rgba(0,0,0,.34)" : rgbaOf(TH.hill2, 0.55);
    g.beginPath();
    const ph = rnd() * 6.28;
    g.moveTo(x0, y);
    for (let x = x0; x <= x1; x += 40) {
      g.lineTo(x, y + Math.sin(x * 0.011 + ph) * 5);
    }
    for (let x = x1; x >= x0; x -= 40) {
      g.lineTo(x, y + h + Math.sin(x * 0.013 + ph + 1.3) * 5);
    }
    g.closePath();
    g.fill();
  }

  /* ③ 背景岩块：十几个大小不一的暗色多边形，只在上部（y<270）。
     它们的职责是**打破"一整面墙色"**：只有渐变 + 层理时，
     上半屏仍然是一块干净的色板，和主线的天空一样"平"。
     加一层压暗的块状岩体，画面才有"身后还有石头"的厚度。 */
  for (let i = 0; i < 14; i++) {
    const cx = rnd() * W;
    const cy = 20 + rnd() * 240;
    const rw = 46 + rnd() * 130;
    const rh = 26 + rnd() * 66;
    g.fillStyle = "rgba(0,0,0," + (0.10 + rnd() * 0.16).toFixed(3) + ")";
    g.beginPath();
    const n = 5 + Math.floor(rnd() * 3);
    for (let k = 0; k < n; k++) {
      const a = (k / n) * 6.283;
      const rr2 = 0.62 + rnd() * 0.46;
      const px = cx + Math.cos(a) * rw * 0.5 * rr2;
      const py = cy + Math.sin(a) * rh * 0.5 * rr2;
      if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
    g.fill();
  }

  /* ④ 天花板：顶部 46px 的岩体 + 倒挂的钟乳石。
     **这一层是"我在洞里"最直接的证据** —— 画面上缘不再是亮的天空，
     而是一排从顶上垂下来的石头。没有它，上面那些层理看起来只是"深色的山"。 */
  /* **必须比背景更暗**。第一版直接填 TH.sky1 —— 而背景顶部正是 sky1，
     于是整排钟乳石是隐形的（截图里顶部干干净净，看不出有洞顶）。
     地底的东西全在逆光里：背景是被远处地光照到的岩层，近处的洞顶是剪影。 */
  g.fillStyle = hexDim(TH.sky1, 0.62);
  g.beginPath();
  g.moveTo(0, 0);
  g.lineTo(W, 0);
  for (let x = W; x >= 0; x -= 30) {
    g.lineTo(x, 34 + Math.sin(x * 0.017) * 9);
  }
  g.closePath();
  g.fill();

  /* 钟乳石：长度 34~234，间隔 42~112。
   *
   * **上限 234 是算出来的**：上一版最高的浮空台在 248 层，顶面 248 —— 垂到 234
   * 时还留 14px。第一版只给到 132，截图里洞顶下面空出一大片什么都没有的区域，
   * 整屏读作"上面暗、下面亮的一块布"。洞顶必须**伸进画面**才有压迫感，
   * 这也是地底和地表的区别：地表的上方是开阔的天空，地底的上方是石头。
   *
   * ★ **2026-10-26：层表从主线三层换成深巢自己的 4 层（446/336/226/116）之后，
   * 固定的 234 上限不再安全** —— 116 层平台的顶面就在 116，
   * 一根 234 长的钟乳石会从上往下穿过 226 层和 116 层两块台，
   * 画面上读作"石头插在台子上"，玩家会去找"那根能不能站"。
   * 所以长度改成**按当前层自己的平台高度现算**：
   * 垂到它正下方最近那块台的顶面再留 22px 就停。
   * 不在任何平台上方的那些照旧可以长到 234 —— 悬空的石柱本来就是洞顶的常态。 */
  {
    /* 平台顶面（y 越小越高）。地面不算：钟乳石不可能垂到地面。 */
    const ledges = /** @type {any[]} */ (PLATS).filter(q => q.kind !== "ground");
    for (let x = 6; x < W; x += 42 + rnd() * 70) {
      const hw = 7 + rnd() * 16;
      const base = 34 + Math.sin(x * 0.017) * 9;
      let len = 34 + Math.pow(rnd(), 0.7) * 200;
      /* 正下方有台 → 长度夹到"台顶 - 46"。**用 clamp 不用 continue**：
         continue 会跳过后面的 rnd()，整个画面的随机序列就跟着变，
         同一个深度的两张截图对不上。
         留 46 不是 22：玩家身高 40，站在台面上时头顶在 `台顶 - 40`。
         只留 22 的话，站在 116 层（离洞顶最近的台）的玩家
         **上半身会被钟乳石尖穿过去** —— 那是"角色卡在石头里"的观感。 */
      for (const q of ledges) {
        if (x + hw + 12 <= q.x || x - hw - 12 >= q.x + q.w) continue;
        len = Math.min(len, q.y - base - 46);
      }
      len = Math.max(30, len);
      /* **尖端必须收圆**。第一版是两条二次曲线交在一个点上 —— 数学上"尖"，
         视觉上是一排**针叶树**：截图里洞顶挂着一排松树剪影，底部长着一排，
         连起来就是一片林子。钟乳石是水滴形的：上粗、中段鼓、尖端是圆头。
         改法是在尖端补一段小圆弧，把两根曲线的交点让开 hw*0.14。 */
      g.fillStyle = hexDim(TH.sky1, 0.62);
      g.beginPath();
      g.moveTo(x - hw, base - 6);
      g.quadraticCurveTo(x - hw * 0.72, base + len * 0.52, x - hw * 0.16, base + len * 0.93);
      g.quadraticCurveTo(x, base + len * 1.04, x + hw * 0.16, base + len * 0.93);
      g.quadraticCurveTo(x + hw * 0.72, base + len * 0.52, x + hw, base - 6);
      g.closePath();
      g.fill();
      /* 受光：只在**右上**一条窄面。地底的光从下往上打，但岩体的
         "下方"是暗的、"上方"是更暗的 —— 真正被照亮的是朝下的尖端。
         所以给尖端一点微光，而不是给整条描亮边。 */
      /* 尖端受光：光在脚下，所以**钟乳石越靠近尖端越亮**（尖端离地最近）。
         这是"光从下面来"在洞顶这一侧唯一的落点 —— 没有它，整排钟乳石
         是背景里一块更深的东西，看不见形状。0.10 试过，看不出来；
         0.22 配合渐隐才读得出"这根石头的下端被照亮了"。 */
      if (len > 58) {
        const tp = g.createLinearGradient(0, base + len * 0.48, 0, base + len);
        tp.addColorStop(0, rgbaOf(TH.accent, 0));
        tp.addColorStop(1, rgbaOf(TH.accent, 0.22));
        g.fillStyle = tp;
        g.beginPath();
        g.moveTo(x - hw * 0.40, base + len * 0.48);
        g.lineTo(x - hw * 0.13, base + len * 0.90);
        g.lineTo(x + hw * 0.13, base + len * 0.90);
        g.lineTo(x + hw * 0.40, base + len * 0.48);
        g.closePath();
        g.fill();
      }
    }
  }

  /* ⑤ 岩地：从 HZ 到画面底部。
   *
   * **明度梯度的方向和主线相反** —— 主线是"远亮近暗"（远处受天光），
   * 地底是"远暗近亮"（远处背光，脚下被地缝的光照着）。
   *
   * 第一版照抄了主线的方向，出来是：画面上部深棕、中部忽然亮出一块灰褐、
   * 底部又暗下去 —— 那条亮带横在屏幕中间，读作"一层雾"，把洞窟的纵深压平了。
   * 换成远暗近亮之后，亮部落在角色和地面这一侧，
   * 正好和 drawNestGlow 的地缝光叠在一起，读作"脚下有光"。
   *
   * 起点用 rockLit 和背景底部**同色**：两个色不同就是一道横缝，
   * 而那条缝正好在 y=296 —— 画面上唯一一处"天与地"的分界，
   * 它必须由形状（起伏）产生，不能由色差产生。 */
  const gr = g.createLinearGradient(0, HZ, 0, H);
  gr.addColorStop(0, TH.hill2);
  gr.addColorStop(0.20, hexDim(TH.hill2, 0.88));
  gr.addColorStop(0.62, TH.grass);
  gr.addColorStop(1, TH.grassLight);
  g.fillStyle = gr;
  g.beginPath();
