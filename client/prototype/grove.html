  g.moveTo(0, H);
  for (let x = 0; x <= W + 12; x += 12) {
    g.lineTo(x, HZ + Math.sin(x * 0.008 + 1.1) * 7 + Math.sin(x * 0.031) * 3);
  }
  g.lineTo(W + 12, H);
  g.closePath();
  g.fill();

  /* 地面与岩体的交界线：一条浅色细线（相当于主线的草脊受光边）。
     作用一样 —— 把"两块色板拼接"变成"一处坡顶"。 */
  g.strokeStyle = rgbaOf(TH.grassLight, 0.16);
  g.lineWidth = 2;
  g.beginPath();
  for (let x = 0; x <= W + 12; x += 12) {
    const y = HZ + Math.sin(x * 0.008 + 1.1) * 7 + Math.sin(x * 0.031) * 3 + 1.2;
    if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();

  /* ⑦ 石笋：3~5 根从地面长上来的岩柱。
   *
   * **加这一层的原因和主线种树完全一样**：主线的中景靠三层山 + 30 棵树 +
   * 9 丛灌木撑着，随便砍掉就会变成"一整块布"。深巢第一版只有渐变 + 层理 +
   * 碎石，截图上是**一大片灰绿的雾** —— 元素都在，但没有一个敢从背景里站出来。
   *
   * 石笋是地底唯一的"中景形状"：它从地面往上长，正好占据 y 300~556 这条
   * 空带；而且它天然解释"光从下面来" —— 柱子越靠上越暗，根部被地缝照亮。
   *
   * **明度要压到低于地面**：它站在玩法区的后面，如果和地面一样亮，
   * 玩家会把石笋和浮空台混起来（"那个尖的东西能不能站"）。
   * 远处的石头必须退后，能站的地方才凸出来。 */
  {
    const n = 3 + Math.floor(rnd() * 2);
    /* **石笋必须避开平台的 x 区间**。第一版没避，结果一根石笋正好顶着
       350 层平台的底 —— 画面上读作"托着那块台子的柱子"，
       空间关系当场就浊了（玩家会去找"哪根能站"）。
       避让半径 60：石笋宽约 90~110，留 60 才能保证轮廓不和平台挨着。 */
    const nearPlat = (x) => PLATS.some(q =>
      q.kind !== "ground" && x > q.x - 40 && x < q.x + q.w + 40);
    for (let i = 0; i < n; i++) {
      let cx = 190 + (i + 0.5) * ((W - 380) / n) + (rnd() - 0.5) * 84;
      for (let t = 0; t < 8 && nearPlat(cx); t++) cx += 46;
      /* 高度 110~200：上限 200 时顶端落在 y≈356。
         2026-10-26 层表换成 446/336/226/116 之后，最近的台是 **446** 层
         （不再是主线的 350）—— 石笋已经按 `nearPlat` 避开了所有平台的 x 区间，
         所以高度只要不超过"底台到地面"这段（556-446 = 110）就不会和台子相交；
         200 是"敢从背景里站出来、又还在玩法区下面"的那一档。
         一旦石笋穿过平台，玩家会把它当成"托着平台的那根柱子"，空间关系就浊了。 */
      const hgt = 110 + rnd() * 90;   // 110~200，见上：不超过"底台到地面"这段
      const hw0 = 30 + rnd() * 20;          // 根部半宽
      const top = GROUND_Y - hgt;
      const lean = (rnd() - 0.5) * 16;      // 顶端偏移，别全都笔直
      /* 0.52：比地面暗一档（退得进背景），但比岩壁亮得多（看得见轮廓）。
         0.46 出来是纯黑的锥体（读作"塔/墓碑"），0.66 又和地面糊在一起。 */
      g.fillStyle = hexDim(TH.grass, 0.52);
      g.beginPath();
      g.moveTo(cx - hw0, GROUND_Y + 4);
      g.lineTo(cx - hw0 * 0.70, GROUND_Y - hgt * 0.44);
      g.quadraticCurveTo(cx + lean - hw0 * 0.34, top + hgt * 0.14,
                         cx + lean - hw0 * 0.06, top + hgt * 0.02);
      g.quadraticCurveTo(cx + lean + hw0 * 0.18, top - hgt * 0.02,
                         cx + lean + hw0 * 0.30, top + hgt * 0.16);
      g.lineTo(cx + hw0 * 0.76, GROUND_Y - hgt * 0.36);
      g.lineTo(cx + hw0 * 0.94, GROUND_Y + 4);
      g.closePath();
      g.fill();
      /* 暗面：左半边压暗（光在下方偏中间，柱子两侧都背光，
         但左侧更远，所以更暗）。一条多边形就够，别做渐变 ——
         这个尺寸的物体上渐变会读成"塑料"。 */
      g.fillStyle = "rgba(0,0,0,.20)";
      g.beginPath();
      g.moveTo(cx - hw0, GROUND_Y + 4);
      g.lineTo(cx - hw0 * 0.66, GROUND_Y - hgt * 0.42);
      g.lineTo(cx + lean - hw0 * 0.16, top);
      g.lineTo(cx + lean, top + hgt * 0.06);
      g.lineTo(cx - hw0 * 0.10, GROUND_Y + 4);
      g.closePath();
      g.fill();
      /* 根部受光：地缝的光从脚下扫上来，越往上越弱 */
      const rt = g.createLinearGradient(0, GROUND_Y - hgt * 0.42, 0, GROUND_Y + 4);
      rt.addColorStop(0, rgbaOf(TH.accent, 0));
      rt.addColorStop(1, rgbaOf(TH.accent, 0.13));
      g.fillStyle = rt;
      g.beginPath();
      g.moveTo(cx - hw0 * 0.86, GROUND_Y + 4);
      g.lineTo(cx - hw0 * 0.62, GROUND_Y - hgt * 0.42);
      g.lineTo(cx + hw0 * 0.70, GROUND_Y - hgt * 0.34);
      g.lineTo(cx + hw0 * 0.90, GROUND_Y + 4);
      g.closePath();
      g.fill();
    }
  }

  /* ⑥ 碎石：铺满岩地的一层小石子 + 几道裂纹。
     **这一层的量必须给足**。主线靠 90 撮细草 + 26 块苔斑 + 22 片落叶
     解决"一张绿色纸"；岩地如果只有渐变，就是"一张灰色纸"，一模一样的问题。
     石子是深巢的"草" —— 它不承担造型，只承担"这块地有东西"。 */
  for (let i = 0; i < 110; i++) {
    const sx = hash(i * 13.7) * W;
    const sy = HZ + 20 + Math.pow(hash(i * 7.9), 0.72) * 290;
    if (sy > H) continue;
    const k = clamp((sy - HZ) / 300, 0, 1);
    const sr = 1.6 + k * 4.4;
    const tone = hash(i * 3.1);
    g.fillStyle = rgbaOf(tone > 0.5 ? TH.grassLight : TH.soilDeep,
                         (0.16 + k * 0.30).toFixed(3));
    g.beginPath();
    g.ellipse(sx, sy, sr, sr * (0.52 + tone * 0.3),
              hash(i * 2.1) * 3.14, 0, 6.283);
    g.fill();
  }
  /* 裂纹：6 条，只在近处（远端裂纹会读成噪点） */
  g.strokeStyle = rgbaOf(TH.soilDeep, 0.40);
  g.lineWidth = 1.8;
  for (let i = 0; i < 6; i++) {
    const cx0 = 40 + hash(i * 17.3) * (W - 80);
    const cy0 = HZ + 60 + hash(i * 9.1) * 200;
    g.beginPath();
    g.moveTo(cx0, cy0);
    let px = cx0, py = cy0;
    for (let k = 0; k < 4; k++) {
      px += (hash(i * 5.7 + k) - 0.5) * 54;
      py += 8 + hash(i * 3.9 + k) * 16;
      g.lineTo(px, py);
    }
    g.stroke();
  }

  /* ⑧ 环境光：**从画面中部就开始铺**，不是只贴着地面。
   *
   * 这一层是整张图"糊不糊"的关键。深巢的洞顶、岩壁、背景全是同一族深色，
   * 只画地面附近的光，中上部就是一整块平涂 —— 截图上是"一大片灰绿的雾"。
   * 主线靠天空（亮）vs 山（中）vs 树（暗）三档明度撑起纵深；
   * 深巢没有天空，能接下"最亮那一档"的只有**地底光升起来的那片弥散**。
   *
   * 所以它从 y=GROUND_Y-340 就开始（约画面上 1/3 处），alpha 0 → 0.10。
   * 再高就会把洞顶也照亮，"下面有光"这件事就没了。 */
  const amb = g.createLinearGradient(0, GROUND_Y - 340, 0, GROUND_Y + 30);
  amb.addColorStop(0, rgbaOf(TH.accent, 0));
  amb.addColorStop(0.62, rgbaOf(TH.accent, 0.035));
  amb.addColorStop(1, rgbaOf(TH.accent, 0.11));
  g.fillStyle = amb;
  g.fillRect(0, GROUND_Y - 340, W, 372);
}

function drawForest(world) {
  const g = ctx;
  g.clearRect(0, 0, W, H);

  /* 深巢走自己的场景，一行的地表语汇都不借用。
     **为什么不是"在 drawForest 里到处加 if"**：这条函数有 450 行，
     里面每一项都是地表物件（云、远山、光柱、树线、灌木、蘑菇、浮尘）。
     散着加十几个 if，改动面覆盖整条函数，而主线要被回归一次 ——
     收益是省下一个函数，代价是把唯一稳定的东西（27 屏的画面）也动了。
     分流成两个函数之后，主线那 450 行**这一轮一个字都没改**。 */
  if (S.nest) { drawNestScene(g); return; }

  drawSky(g);

  drawClouds(g);
  drawScape(g);

  // 光柱压在山之上、地表之下：光是在空气里走的，被山挡住就成了贴纸。
  drawSunShaft(g);

  // 地平线雾带：山脚到草地之间 68px 的天空色残余。
  // 没有这一层，草地是"一刀切"压在山脚上的，读作两块色板拼接。
  // **必须在草脊之前画** —— 它盖的是山脚，不是草地。
  const hz = g.createLinearGradient(0, 284, 0, 352);
  hz.addColorStop(0, rgbaOf(TH.horizon, 0.94));
  hz.addColorStop(1, rgbaOf(TH.horizon, 0));
  g.fillStyle = hz;
  g.fillRect(0, 284, W, 68);

  // 地面：明度纵深三档。地平线亮（远处受天光）、中段本色、画面底部最暗。
  // 一整片同色读作"一张绿色纸"；压一道 26% 的明度落差，地面自己就有纵深了。
  // **上边界是草脊曲线，不是一条直线**（见 ridgeY 的注释）。
  const gr = g.createLinearGradient(0, 276, 0, H);
  gr.addColorStop(0, TH.grassLight);
  gr.addColorStop(0.30, TH.grass2);
  gr.addColorStop(0.68, TH.grass);
  gr.addColorStop(1, TH.grassDark);
  g.fillStyle = gr;
  g.beginPath();
  g.moveTo(0, H);
  for (let x = 0; x <= W + 12; x += 12) g.lineTo(x, ridgeY(x));
  g.lineTo(W + 12, H);
  g.closePath();
  g.fill();

  /* 草脊的受光边：沿脊线走一条 2.5px 的浅金线。
     参考概念图里草地和远山交界处有一条被夕阳打亮的边 —— 就这一条线，
     把"两块色板拼接"变成了"一个坡顶"。alpha 只给 0.55（在 grassLight 上），
     再往上就是描边，会读成"贴了一条金丝"。
     往下压 1.2px：压在脊线的**内侧**，露出来的是草地自身的亮面。 */
  g.strokeStyle = rgbaOf(TH.grassLight, 0.55);
  g.lineWidth = 2.5;
  g.beginPath();
  for (let x = 0; x <= W + 12; x += 12) {
    const y = ridgeY(x) + 1.2;
    if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();

  // 地面上的浅色条纹：给"深度"，但只在低对比度下出现。
  // 已经有三档明度了，条纹只是补充；alpha 从 0.07 收到 0.05，
  // 否则每一道都是一条"横在战场上的白线"。
  g.globalAlpha = 0.05;
  g.fillStyle = "#FFFFFF";
  for (let i = 0; i < 5; i++) {
    const y = 352 + i * 48;
    g.beginPath();
    g.ellipse(W / 2, y, 460 - i * 30, 10 + i * 2, 0, 0, 6.283);
    g.fill();
  }
  g.globalAlpha = 1;

  /* 草面纹理：一撮撮小草，越靠下越大越密。
     没有这一层，300~556 是一整片纯渐变 —— 那是"一张绿色纸"的最后一块证据，
     也是"像贴上去"最直白的一条：真实的一整片草地里找不到一块干净的平面。
     一撮只画两根细弧，不做叶片造型 —— 草地上有 90 撮，
     每一撮都画清楚反而会读成"一片尖刺"。
     尺寸 / 线宽 / 透明度三样都随 y 递增（近大远小），这一层的纵深就出来了。 */
  for (let i = 0; i < 90; i++) {
    const tx = hash(i * 13.7) * W;
    const ty = ridgeY(tx) + 26 + Math.pow(hash(i * 7.9), 0.72) * 246;
    if (ty > 558) continue;
    const k = clamp((ty - 300) / 256, 0, 1);          // 0 = 远，1 = 近
    const s = 2 + k * 4.5;
    g.strokeStyle = rgbaOf(TH.grassDark, 0.10 + k * 0.13);
    g.lineWidth = 1.1 + k * 0.9;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(tx - s * 0.7, ty);
    g.quadraticCurveTo(tx - s * 0.4, ty - s * 1.3, tx, ty - s * 1.75);
    g.moveTo(tx + s * 0.7, ty);
    g.quadraticCurveTo(tx + s * 0.4, ty - s * 1.05, tx, ty - s * 1.5);
    g.stroke();
  }

  /* 树高统一乘这个系数。
   *
   * 表里的 sc 是"相对基准树"的比例，基准树（sc=1）高 60+27×1.9 ≈ 111px。
   * 乘 1.5 之后，最高的那棵 ≈ 167px = 屏高的 28%，加上草脊的位置，
   * 树冠顶到 y≈150 —— 正好落在最上层平台（248）之上、HUD（90）之下。
   *
   * 为什么必须放大：原来最高的树只有 111px = 屏高 18%，
   * 十五棵排开读作"草地上散着几棵小树"，而不是"战斗发生在一片林子的空地上"。
   * 概念图里中景树占到屏高一半 —— 背景的体量感直接来自这个比例，
   * 不是来自细节画得多不多。 */
  const TREE_SCALE = 2.0;

  /* 更远的一排树（第二道树线）：**专门用来填前排的缝**。
     只有一排树的时候，每棵树之间露出天空和草地，读作"草地上散着几棵蘑菇"——
     间距再随机也救不了，因为"稀疏"本身就是问题。
     后排尺寸只有前排的 40%~55%、贴着草脊站、颜色再往雾里推一档，
     它不负责造型，只负责把"树后面还有树"这件事画出来。
     这一层是概念图和当前实现差别最大的地方：概念图的背景是一**片**林，不是几棵树。 */
  const FAR_TREES = [
    [  12, 0.30, 0.16], [  62, 0.38, 0.24], [ 116, 0.26, 0.14],
    [ 176, 0.34, 0.20], [ 240, 0.28, 0.14], [ 306, 0.36, 0.22],
    [ 368, 0.25, 0.12], [ 442, 0.34, 0.20], [ 508, 0.30, 0.16],
    [ 578, 0.38, 0.24], [ 646, 0.26, 0.14], [ 706, 0.34, 0.18],
    [ 768, 0.30, 0.16], [ 830, 0.36, 0.22], [ 896, 0.27, 0.12],
  ];
  /* 场景族分派：数量见 bgTreeRow，造型见 drawBgTree。
     cliffs 只留 5 棵 —— 岩柱的辨识度靠"露出竖向的天"，
     30 棵树会把每根柱子切成两段，"垂直"这个形状语言当场失效。 */
  for (const [fx, fsc, fd] of bgTreeRow(FAR_TREES)) {
    // 贴着草脊站（+3 让树干底边压进草皮 3px，不然会浮在脊线上面）
    drawBgTree(g, fx, ridgeY(fx) + 3, fsc * TREE_SCALE, true, fd);
  }

  /* 中景树：**三档深度 + 允许互相遮挡**。
     上一版 9 棵等距 118px、同一档尺寸（0.54~0.82）、同一条基线（308~320）——
     等距 + 等高 + 等大，三条凑齐就是"平"的定义，拍出来是一条墙纸条带。

     深度的唯一可靠线索是**遮挡**：一棵压住另一棵的边缘，眼睛才认为它在前面。
     所以这里刻意让相邻两棵重叠 20%~40%，间距 42~84 不等，尺寸分三档
     （0.44 / 0.66 / 0.94），基线按 depth 递进（越近越往下）。
     depth 同时喂给 drawTree 的 dim —— 越远的越往地平线雾色里混。
     格式：[x, 尺寸, depth] */
  const MID_TREES = [
    [  26, 0.62, 0.60], [  84, 0.42, 0.34], [ 138, 0.76, 0.80],
    [ 214, 0.48, 0.42], [ 272, 0.58, 0.56], [ 340, 0.40, 0.28],
    [ 396, 0.70, 0.74], [ 474, 0.46, 0.38], [ 532, 0.78, 0.82],
    [ 612, 0.52, 0.46], [ 672, 0.64, 0.64], [ 742, 0.44, 0.34],
    [ 800, 0.74, 0.78], [ 862, 0.50, 0.42], [ 930, 0.60, 0.58],
  ];
  for (const [tx, tsc, td] of bgTreeRow(MID_TREES)) {
    /* 基线 = 草脊 + 一个和 depth 成正比的小位移。
       越近越靠下 —— 这是"从低角度看一片平地"时唯一成立的规律；
       少了它，树再大也贴在同一个平面上。
       **位移只给 12px，不能给 30。** 试过 30：树干会整根落到草脊以下，
       十五根立在草地前面、间距又均匀，读作"一排栅栏"。
       树必须**扎在脊线上**，深度靠尺寸和颜色差别的，不靠把树往下挪。
       **夹到 334**：350 那层平台从 350 起，树根扎进去就开始读作
       "战斗发生在树上"（之前踩过一次，六棵树画在战场背后）。 */
    const by = Math.min(334, ridgeY(tx) + 2 + td * 12);
    drawBgTree(g, tx, by, tsc * TREE_SCALE, true, td);
  }

  /* 沼泽的中景芦苇带：**这一层是 marsh 和另外两族最大的差别**。
     树是"块"（有体积、有冠），芦苇是"线"（只有茎）。
     一条地平线上"线多于块"，读作湿地；"块多于线"读作山林。
     放在树之后、灌木之前 —— 它比中景树近，比前景灌木远。 */
  /* ★ 2026-10-25 大幅收量（用户："战斗内的很乱……越做越乱"）。
     上一版：n=62 + n=48 = **110 根**，h 最高 82 → 顶端 318-82 = **236**，
     也就是说整条带子从地平线（296~322）一路竖到 350 层和 462 层平台之上。
     实测 `_cmp-now-s20.png`：满屏竖线，和树干混成一片栅栏，
     球的蓝色在泥堆和草根里几乎找不出来。对照 `_cmp-old-s20.png`（三族之前）干净得多。

     现在 34 根、顶端封顶 **280**（hMax 40）—— 只在地平线草脊上冒出一截毛，
     读作"远处是湿地"，不读作"前面有一排杆子"。alpha 也降了一档，
     因为它比树远，雾该更重而不是更实。 */
  if (SCAPE === "marsh") {
    drawReeds(g, 320, hexMix(TH.hillNear, TH.treeNear, 0.30), 14, 40, 23, 20, 0.40);
    drawReeds(g, 332, hexMix(TH.hillNear, TH.treeNear, 0.52), 10, 26, 31, 14, 0.55);
  }

  /* 树脚雾：草脊那一条上贴一层薄雾，把树根"化"进地面。
     **只能是贴着草脊的一条薄带（26px 高、alpha .14）。**
     第一版写成 48px 高、alpha .30，覆盖了树干下半截 —— 出来是
     "树干被拦腰切了一刀"，因为空气透视是**按距离**累积的，不是按高度。
     同一棵树的上半截和下半截离镜头一样远，凭什么下半截更雾？
     所以这一层只负责"地面和树根之间没有硬边界"，不负责纵深；
     纵深交给 drawTree 的 dim。 */
  const fog = g.createLinearGradient(0, 296, 0, 322);
  fog.addColorStop(0, rgbaOf(TH.horizon, 0.14));
  fog.addColorStop(1, rgbaOf(TH.horizon, 0));
  g.fillStyle = fog;
  g.fillRect(0, 296, W, 26);

  /* 中景大树干：**这是参考图和当前实现差得最远的一处构图**。
   *
   * 参考概念图里，画面两侧和中间各有一根**贯穿上下的粗树干**，
   * 树冠在画面顶部连成一片 —— 于是"这是一片林子"不用解释，
   * 一眼就成立。而我们的中景只有一排细杆 + 圆树冠，间距又均匀，
   * 读作"草地上排了一排蘑菇"。
   *
   * 三根就够，位置刻意不等距（246 / 704 / 916）、粗细不等（40 / 26 / 34）。
   * 等距等粗 = "一排柱子"，那是上一版被否掉的读法。
   * 它们全部画在中景树之后、灌木之前 —— 也就是"比灌木远、比远树近"这一档。
   */
  const BIG_TRUNKS = [
    // [x, 宽度, 底部 y, depth]
    [246, 40, 430, 0.46], [704, 26, 412, 0.36], [916, 34, 424, 0.42],
  ];
  /* 三根中景大树干只在 hills 出现。
     cliffs 的竖向由岩柱负责、marsh 的竖向由芦苇负责，
     再叠三根 40px 粗的树干，三族又会糊成同一个空间。 */
  for (const [tx0, tw0, tbase, tdep] of (SCAPE === "hills" ? BIG_TRUNKS : [])) {
    const tk0 = hexMix(hexMix(TH.trunkNear, TH.trunkFar, 1 - tdep), TH.horizon, 0.16);
    const tkLit = hexMix(tk0, "#FFE0A8", 0.34);
    const tkDark = hexMix(tk0, "#2A1A0E", 0.34);
    // 落影：树干站在草地上，脚下左右各一块暗
    g.fillStyle = "rgba(18,42,24,.20)";
    g.beginPath();
    g.ellipse(tx0, tbase + 2, tw0 * 1.5, 7, 0, 0, 6.283);
    g.fill();
    // 干身：上接树冠（出画），下到 tbase
    const tg = g.createLinearGradient(tx0 - tw0 / 2, 0, tx0 + tw0 / 2, 0);
    tg.addColorStop(0, tkDark);
    tg.addColorStop(0.42, tk0);
    tg.addColorStop(0.86, tkLit);
    tg.addColorStop(1, tk0);
    g.fillStyle = tg;
    g.beginPath();
    g.moveTo(tx0 - tw0 / 2, -20);
    g.lineTo(tx0 + tw0 / 2, -20);
    g.lineTo(tx0 + tw0 / 2 - 2, tbase - 6);
    g.quadraticCurveTo(tx0 + tw0 * 0.7, tbase + 4, tx0, tbase + 4);
    g.quadraticCurveTo(tx0 - tw0 * 0.7, tbase + 4, tx0 - tw0 / 2 + 2, tbase - 6);
    g.closePath();
    g.fill();
    // 树皮沟：三道竖的，断成截
    g.fillStyle = "rgba(48,28,14,.26)";
    for (let k = 0; k < 3; k++) {
      const gx = tx0 - tw0 * 0.30 + k * tw0 * 0.30;
      for (let yy = -10; yy < tbase - 20; yy += 58) {
        rr(g, gx, yy, 4.5, Math.min(34, tbase - 24 - yy), 2);
        g.fill();
      }
    }
    // 树冠：压在画面顶部，出画
    /* 树冠中心固定在 132，**不随树干高度变**。
       原来算成 "tbase - 86% 高度"，结果三根树干各自的冠顶都被推到 y≈40，
       正好压在 HUD 卡片后面 —— 画面上只剩三根光杆往天上伸。
       固定值让三顶冠在画面顶部连成一条林冠线，那才是"一片林子"。 */
    const ccy = 132;
    g.fillStyle = hexMix(hexMix(TH.treeNear, TH.treeFar, 1 - tdep), TH.horizon, 0.12);
    blobPath(g, tx0 - tw0 * 1.5, ccy, tw0 * 2.1, hash(tx0 * 0.03), false);
    blobPath(g, tx0 + tw0 * 1.4, ccy - tw0 * 0.7, tw0 * 2.2, hash(tx0 * 0.03) + 2.2, true);
    blobPath(g, tx0, ccy - tw0 * 1.6, tw0 * 2.4, hash(tx0 * 0.03) + 4.1, true);
    g.fill();
  }

  /* 中景灌木带 —— 草脊到地面之间那 250px 空绿的解药。
   *
   * 上一版的这一段只有渐变 + 90 撮细草。拍出来是一大片干净的绿色，
   * 用户的判断是"元素像贴上去的"。真因不是"元素少"，是**这一整条空间是空的**：
   * 参考图里从远处树线到脚下，至少叠着三档灌木/蕨类，彼此互相遮挡，
   * 眼睛一路都有东西落脚，才会认为"这块地有纵深"。
   *
   * 三档（远 / 中 / 近）按 baseY 分开，尺寸、颜色、描边重量同步递增：
   *   远：baseY 350~400，尺寸 0.55，色淡，无描边
   *   中：baseY 400~480，尺寸 0.95，本色，细描边
   *   近：baseY 480~545，尺寸 1.45，压暗，粗描边
   * 位置全部手写，不用随机 —— 随机灌木会自己挤成一堆，留出大片空白。
   */
  /* 表里的第二个数是"这一丛多大"。**从 26 一路加到 74 是试出来的。**
   *
   * 26~40 那一档拍出来是"草地上散着一地小圆点"——单丛 40~70px 宽，
   * 在 960 宽的画面上读作苔藓斑点，不读作灌木。参考概念图里最近的灌木
   * 一丛就占屏宽 15%，正是这个体量让它"站在前景"、把视线推进中场。
   * 现在最近的一档 74×1.9 ≈ 140 半径 → 单丛近 300px 宽，才压得住画面下缘。
   *
   * 数量从 22 降到 13：丛一大就必须稀，密了会糊成一条绿带，
   * 又把"空"换成"堵"。
   */
  const BUSHES = [
    // [x, baseY, scale, depth]
    [ 190, 372, 0.52, 0.24], [ 560, 366, 0.48, 0.22], [ 860, 374, 0.54, 0.26],
    [ 300, 424, 0.78, 0.46], [ 690, 416, 0.72, 0.42],
    [  96, 486, 1.18, 0.72], [ 404, 500, 1.30, 0.80],
    [ 700, 492, 1.22, 0.76], [ 924, 502, 1.34, 0.82],
  ];
  for (const [bx0, by0, bsc0, bd] of BUSHES) {
    /* **不能直接拿 TH.shrub 当灌木色。**
     那是前景那一层的颜色（压到接近剪影），用在中景上出来是一地
     "深色三叶草" —— 和画面最下缘的前景灌木长得一模一样，
     眼睛会以为它们是同一层，纵深反而没了。
     中景灌木应该和草地同族、但比草地实一档：从 grass 往 treeNear 混。 */
    const bsd = hash(bx0 * 0.07);
    /* **灌木必须明摆着比草地暗一档，不能只暗 5%。**
     *
     * 试过从 TH.grass 往 treeNear 混 0.42 再往地平线雾里推 40% —— 出来
     * 和草地几乎同明度，画面上读作"草地里有一片虚影"。用户看到的
     * "元素像贴上去的"，有一半是这种"什么都有、什么都看不见"造成的：
     * 每个物件都在，但没有一个敢从背景里站出来。
     *
     * 现在从 treeNear 出发、往前景剪影色（shrub）混 0.34，只往雾里推 12%。
     * 结果比草地暗约 25% 明度 —— 站在草地上，但仍然比最前景那一层亮。
     * 三档（前景剪影 / 中景灌木 / 草地）各自拉开，纵深才是靠明度立起来的。 */
    const tone = hexMix(hexMix(TH.treeNear, TH.shrub, 0.34), TH.horizon, (1 - bd) * 0.12);
    const litTone = hexMix(tone, "#FFF0C8", 0.50);
    const ch = 50 * bsc0;
    /* 一丛 = 6 瓣，左右铺开、高低错落。
       瓣数少了（4）读作"一团圆球"，瓣数多了（9）轮廓变成毛边；
       6 瓣刚好读作"一丛长得比较随意的灌木"。中间两瓣最高，
       两侧两瓣往外趴 —— 灌木就是往外趴的，直上直下读作"树"。 */
    const bushPath = () => {
      blobPath(g, bx0, by0 - ch * 0.44, ch * 0.62, bsd, false);
      blobPath(g, bx0 - ch * 0.54, by0 - ch * 0.30, ch * 0.54, bsd + 1.9, true);
      blobPath(g, bx0 + ch * 0.56, by0 - ch * 0.26, ch * 0.56, bsd + 3.4, true);
      blobPath(g, bx0 - ch * 0.24, by0 - ch * 0.76, ch * 0.40, bsd + 5.2, true);
      blobPath(g, bx0 + ch * 0.30, by0 - ch * 0.68, ch * 0.38, bsd + 6.6, true);
      blobPath(g, bx0 - ch * 0.92, by0 - ch * 0.08, ch * 0.40, bsd + 8.1, true);
      blobPath(g, bx0 + ch * 0.94, by0 - ch * 0.06, ch * 0.42, bsd + 9.3, true);
    };
    // 落影先画：灌木脚下一定要有一块暗，否则它浮在草地上
    g.fillStyle = "rgba(20,46,26,.16)";
    g.beginPath();
    g.ellipse(bx0, by0 + 1.5, ch * 1.25, 5.5, 0, 0, 6.283);
    g.fill();
    g.fillStyle = tone;
    bushPath();
    g.fill();
    // 底部压暗：丛的下半截背光，没有这一层读作"贴在草上的一个色块"
    g.save();
    bushPath();
    g.clip();
    const bd2 = g.createLinearGradient(0, by0 - ch * 0.70, 0, by0);
    bd2.addColorStop(0, "rgba(0,0,0,0)");
    bd2.addColorStop(1, "rgba(18,44,26,.30)");
    g.fillStyle = bd2;
    g.fillRect(bx0 - ch * 1.4, by0 - ch * 1.2, ch * 2.8, ch * 1.3);
    g.restore();
    // 受光：只有右上那一块，光源在右上
    g.fillStyle = rgbaOf(litTone, 0.50);
    g.beginPath();
    blobPath(g, bx0 + ch * 0.20, by0 - ch * 0.82, ch * 0.34, bsd + 2.6);
    g.fill();
    /* **灌木不描边。**
     *
     * 试过给中近两档描边，出来是一堆线团 —— 原因很硬：canvas 的 stroke()
     * 描的是**每条子路径的整圈轮廓**，7 瓣并集里的每个瓣都会把自己的内圈
     * 弧线也描出来，那些弧线在填充色里是看得见的。
     * 想只描并集外轮廓没有 API（需要布尔运算），只能不描。
     *
     * 不描也不吃亏：参考概念图里只有**最前景**那一层是深色带描边的剪影，
     * 中景灌木全靠明度分层次。这一层的可读性来自"比草地暗、比前景亮"，
     * 不来自轮廓线。 */
    // 落影：灌木脚下一定要有一块暗，否则它浮在草地上
    g.fillStyle = "rgba(20,46,26,.14)";
    g.beginPath();
    g.ellipse(bx0, by0 + 1.5, ch * 1.05, 4.5, 0, 0, 6.283);
    g.fill();
  }

  /* 草地细节：苔斑 / 落叶 / 石子 / 蘑菇。
     这一层的量要给足 —— 一片 250px 高的草地如果只有渐变和细草，
     读作"一张绿色纸"。参考图里草地是一块一块深浅不一的苔，脚边还有落叶和蘑菇。
     全部在 552 以上（地面走动带 534~578 之下不压细节），不参与碰撞。 */
  for (let i = 0; i < 26; i++) {
    const mx = hash(i * 4.13) * W;
    const my = ridgeY(mx) + 40 + Math.pow(hash(i * 9.71), 0.7) * 210;
    if (my > 548) continue;
    const k = clamp((my - 300) / 250, 0, 1);
    const mr = 22 + hash(i * 3.3) * (34 + k * 40);
    g.fillStyle = rgbaOf(hexMix(TH.grass, i % 3 ? "#8CC24E" : "#5E8E33", 0.55), 0.09 + k * 0.10);
    g.beginPath();
    g.ellipse(mx, my, mr, mr * 0.30, hash(i * 2.1) * 0.5 - 0.25, 0, 6.283);
    g.fill();
  }
  // 落叶：三片一组的小斜片，颜色比草地暖一档
  for (let i = 0; i < 22; i++) {
    const lx = hash(i * 6.7 + 11) * W;
    const ly = ridgeY(lx) + 60 + Math.pow(hash(i * 8.3 + 3), 0.62) * 190;
    if (ly > 546) continue;
    const k = clamp((ly - 300) / 250, 0, 1);
    const ls = 2.4 + k * 3.2;
    g.fillStyle = rgbaOf(hexMix("#D9A24E", TH.grass, 0.35), 0.30 + k * 0.34);
    g.save();
    g.translate(lx, ly);
    g.rotate(hash(i * 2.9) * 3.14);
    g.beginPath();
    g.ellipse(0, 0, ls, ls * 0.44, 0, 0, 6.283);
    g.fill();
    g.restore();
  }
  // 石子：一两颗，只放在近处，远处给了反而像噪点
  for (let i = 0; i < 7; i++) {
    const sx = 70 + hash(i * 12.1 + 7) * (W - 140);
    const sy = 496 + hash(i * 5.5) * 44;
    const sr = 4 + hash(i * 3.7) * 4.5;
    g.fillStyle = rgbaOf("#8A8478", 0.55);
    g.beginPath();
    g.ellipse(sx, sy, sr, sr * 0.72, 0, 0, 6.283);
    g.fill();
    g.fillStyle = rgbaOf("#C8C2B4", 0.50);
    g.beginPath();
    g.ellipse(sx - sr * 0.22, sy - sr * 0.28, sr * 0.55, sr * 0.34, 0, 0, 6.283);
    g.fill();
  }
  // 蘑菇：三簇，靠近两侧（中间要留给球道，别在球道上长东西）
  for (const [mx, my, ms] of [[96, 528, 1.0], [842, 512, 0.8], [486, 540, 0.7]]) {
    g.fillStyle = "#F3E6CE";
    g.fillRect(mx - 1.8 * ms, my - 8 * ms, 3.6 * ms, 8 * ms);
    g.fillStyle = rgbaOf("#D9563E", 0.92);
    g.beginPath();
    g.ellipse(mx, my - 9 * ms, 7.4 * ms, 5.2 * ms, 0, Math.PI, 0);
    g.fill();
    g.fillStyle = "rgba(255,246,232,.85)";
    for (const [ox, oy] of [[-3, -1.5], [2.4, -2.6], [0.2, 0.4]]) {
      g.beginPath();
      g.arc(mx + ox * ms, my - 9 * ms + oy * ms, 1.3 * ms, 0, 6.283);
      g.fill();
    }
  }

  /* 下半部分压暗：**舞台光**。
   *
   * 参考概念图里最暗的地方不在天上，而在画面下缘 —— 前景树丛、脚边的土、
   * 灌木的背光面。整张图的明度因此是"上亮下暗"，视线被压回中场。
   *
   * 我们原来是从上到下几乎同一个明度，于是画面读作"一块绿纸"。
   * 这不是"再画点东西"能解决的，是**明度骨架**的问题：
   * 一幅画没有一条明确的明度梯度，再多样件也是散落的贴纸。
   *
   * 起点 392（最低一层浮空台 462 的上方 70px）、alpha 只到 0.20 ——
   * 再重会开始影响"球落在哪一层"的判断，那是玩法红线。
   */
  const stage = g.createLinearGradient(0, 392, 0, H);
  stage.addColorStop(0, "rgba(24,48,28,0)");
  stage.addColorStop(0.55, "rgba(24,48,28,.09)");
  stage.addColorStop(1, "rgba(20,40,24,.22)");
  g.fillStyle = stage;
  g.fillRect(0, 392, W, H - 392);

  /* 两侧近景树：**一侧一棵**。
     原来是 "1.9 + 1.3" 两棵并排 —— 两个 blob 各自描边，描边在中间交叉，
     拍出来读作"两个球叠在一起"，是全场最像"没画完"的地方。
     blobPath 只能描自己的整圈，没有"只描并集外轮廓"的 API（canvas 不给），
     所以并排的两棵树要么合并成一个 blob，要么就别并排。选后者。 */
  drawTree(g, 6, 470, 1.9, false);
  drawTree(g, W - 8, 470, 1.9, false);

  // 空气里的浮尘：小圆点，向上飘。数量少、对比低
  for (let i = 0; i < 16; i++) {
    const ph = (S.t * 0.22 + hash(i * 7.7)) % 1;
    const x = 60 + hash(i * 2.3) * (W - 120) + Math.sin(S.t * 0.6 + i) * 10;
    const y = 520 - ph * 380;
    g.globalAlpha = 0.20 * (1 - Math.abs(ph - 0.5) * 2);
    g.fillStyle = "#FFFFFF";
    g.beginPath();
    g.arc(x, y, 1.6 + hash(i) * 1.8, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
  }

  // 顶部渐晕：只收掉过曝，不染色。0.22 的时候顶部被漂成灰白，
  // 整片天空的最高点反而比中段暗 —— 读作"天上盖了块脏玻璃"。
  const top = g.createLinearGradient(0, 0, 0, 40);
  top.addColorStop(0, "rgba(255,255,255,.10)");
  top.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = top;
  g.fillRect(0, 0, W, 40);

  if (world) {
    g.save();
    g.translate(0, 0);
    g.restore();
  }
}

/* ============================================================================
   14. 绘制：关卡
   ========================================================================== */

/* 平台体积参数 —— 浮空台和斜坡共用同一组数，"厚度吻合"就靠这个。
   之前斜坡用 26、浮空台用 h+6（18~26 之间浮动），两块接在一起永远差几像素，
   肉眼读出来的就是"拼上去的"。 */
const PLAT_TOP = 7;    // 顶面：俯视能看到的窄面带
/* 视觉总厚（从物理顶面 p.y 往下量）。
 *
 * **33 → 27 是用户一句"比较粗大了点"量出来的，不是审美偏好。**
 * 屏高 600，33 占 5.5%；参考概念图里圆木直径只占屏高 4%（= 24）。
 * 取 27 = 4.5%，是"细一档但仍然是根木头"的位置：
 *   再往下到 24 会读成"一块板"（层缝就没有高度可放了，3 层挤不进 8px）；
 *   再往上到 30 就回到"粗大"，和参考图差得太远。
 * 27 = 3 × 9，每层 9px —— 刚好够一条层缝(3.4) + 一个年轮(5.6)，
 * LAYER_SHIFT 的错缝语义不变。 */
const PLAT_TK  = 27;

/* 平台由几层木板叠成。27 / 3 = 9，每层刚好够放一条层缝 + 一个年轮。
   改这个数就要同步看 LAYER_SHIFT —— 层数是"错缝"的唯一来源。 */
const LAYERS = 3;
/* 每层拼缝的水平偏移。**必须互不相同且不成倍数**，否则三层缝会在
   某些 x 上重合，一眼就看出是"同一根线复制了三遍"。 */
const LAYER_SHIFT = [0, 16, 32];

/** 某个平台端点是不是接了斜坡。端点用 (x, 顶面 y) 表示。
 *
 *  接坡的那一端要"开口"：不做圆角、不描竖边，让坡的轮廓接管。
 *  否则平台整圈描边会横穿接缝，成了一道黑竖线。 */
function rampMating(x, y, tol) {
  const T = tol === undefined ? 3 : tol;
  for (const r of RAMPS) {
    if (Math.abs(r.x - x) < T && Math.abs(r.yL - y) < T) return { r, end: "L" };
    if (Math.abs(r.x + r.w - x) < T && Math.abs(r.yR - y) < T) return { r, end: "R" };
  }
  return null;
}

/** 圆角矩形路径，但两端可以单独做成直角（flatL / flatR）。
 *  填充用完整路径；描边分上下两段调用，接缝端才不会封口。 */
function platPath(g, x, y, w, h, r, flatL, flatR) {
  const k = Math.min(r, w / 2, h / 2);
  g.beginPath();
  if (flatL) g.moveTo(x, y);
  else { g.moveTo(x, y + k); g.quadraticCurveTo(x, y, x + k, y); }
  if (flatR) g.lineTo(x + w, y);
  else { g.lineTo(x + w - k, y); g.quadraticCurveTo(x + w, y, x + w, y + k); }
  if (flatR) g.lineTo(x + w, y + h);
  else { g.lineTo(x + w, y + h - k); g.quadraticCurveTo(x + w, y + h, x + w - k, y + h); }
  if (flatL) g.lineTo(x, y + h);
  else { g.lineTo(x + k, y + h); g.quadraticCurveTo(x, y + h, x, y + h - k); }
  g.closePath();
}

/* ----------------------------------------------------------------------------
   雪线：沿平台顶面画一条上缘起伏的白带

   **上缘必须起伏**。直的一条读作"在台子上贴了张白纸"，起伏才读作"堆了一层雪"。
   起伏用 `hash` 定（不是 Math.random）—— 每帧随机会让雪原地抽搐。

   形状用**圆齿**而不是随机多边形：地面本来就是一排圆弧草齿，
   雪顺着同一套齿形加厚，看起来是"同一块地上积了雪"；
   换成另一套几何就变成"两块不同的地"。
   -------------------------------------------------------------------------- */
function snowLine(g, x, w, y, depth) {
  if (!TH.snow || depth <= 0.04) return;
  /* **不做圆齿，做一条上缘低频起伏的实心带。**
   *
   * 第一版照草皮的做法画了一排上拱的圆弧，出来读作"花边"——
   * 因为草皮本身就是一排向下鼓的圆弧，两层齿叠在同一位置，
   * 谁也读不出是雪，只像给台子镶了道白蕾丝。
   *
   * 雪的证据不是齿，是**一条连续的厚带 + 上缘的松软起伏**。
   * 起伏频率用 54px 一段（草齿是 26px）：比草慢一倍，
   * 视觉上才不会和草齿共振。幅度由 hash 定，每段不一样 ——
   * 一样的话会读成"规则的波浪装饰"，那还是花边。 */
  const h = 3 + 10 * depth;
  const n = Math.max(2, Math.round(w / 54));
  const step = w / n;
  const baseY = y - h * 0.42;

  g.save();
  g.globalAlpha = 0.55 + 0.42 * depth;
  g.fillStyle = "#F4F8FF";
  g.beginPath();
  g.moveTo(x, y + 5);
  g.lineTo(x, baseY);
  for (let i = 0; i < n; i++) {
    const x0 = x + step * i;
    const x1 = x0 + step;
    const bump = h * (0.5 + 0.62 * hash(i * 5.1 + x * 0.011));
    g.quadraticCurveTo((x0 + x1) / 2, baseY - bump, x1, baseY);
  }
  g.lineTo(x + w, y + 5);
  g.closePath();
  g.fill();
  g.restore();
}

/**
 * 被打碎的浮台留下的**断茬**。
 *
 * 整块凭空消失读作"贴图丢了"；两端各留一截参差的木桩，才读作"这块板塌了"。
 * 断口那一侧不能是直线 —— 直线是"被人锯断"，参差才是"被砸断"。
 *
 * 只在 BROKEN 里有的台面才画。BROKEN 空的时候这个循环一次都不进。
 */
function drawBrokenPlat(g, p) {
  const h = p.h || 22;
  const stub = Math.min(26, Math.max(14, p.w * 0.16));
  for (const side of [-1, 1]) {
    const x0 = side < 0 ? p.x : p.x + p.w - stub;
    const inner = side < 0 ? x0 + stub : x0;      // 朝中间那一侧的边
    /* 断口：三个折点，深度按台面高度走。
       折点顺序从顶到底 —— 这样填充出来是一块缺角的木头。 */
    g.beginPath();
    g.moveTo(x0, p.y);
    g.lineTo(x0 + stub, p.y);
    g.lineTo(inner - side * stub * 0.26, p.y + h * 0.30);
    g.lineTo(inner - side * stub * 0.05, p.y + h * 0.58);
    g.lineTo(inner - side * stub * 0.32, p.y + h);
    g.lineTo(x0, p.y + h);
    g.closePath();
    g.fillStyle = TH.wood2;
    g.fill();
    // 顶面受光：和完整台面同一条规则，否则断茬读作"一块深色贴片"
    g.fillStyle = TH.wood3;
    g.fillRect(Math.min(x0, x0 + stub), p.y, stub, 3.5);
  }
}

/* ============================================================
 * BOSS 的预告层（断台 / 泥潮）
 *
 * **为什么必须有这一层**：机制先做完的时候，`f.cracking` / `f.mucking`
 * 这两个计时器在绘制代码里一次都没被读过 —— 也就是说 BOSS 举手、
 * 地形变样，中间**什么都没有**。系统是通的（冒烟全绿），玩家什么都看不见。
 * 那和"没做"没有区别，而"没感觉"就是这么来的。
 *
 * 三条规矩：
 *  1. **预告的范围 = 真正变化的范围**。锁定和落手共用同一份数据
 *     （`f._crackTgt` / `f._mudSpot`），所以画的和砸的不可能是两处。
 *  2. **画在目标上，不画在屏幕中央**。屏幕上弹一行字是 UI；
 *     在那块板子上画裂纹才是"这块板要塌了"。
 *  3. **进度要看得出来**。三个信号同时随 k 长大：裂缝变深、箭头压下来、
 *     角括号收紧。只做一个的话，玩家分不清"刚开始"和"马上要落"。
 * ============================================================ */

/** 描一条"任何背景上都看得见"的线：**先画一粗的底，再画一细的面**。
 *
 * 为什么不能单色：这个游戏的天空是暖橙、木头也是暖橙。第一版预告用的
 * `#FF6B3D` 橙色，在断崖那一章和背景撞成一片 —— 出图上完全找不到，
 * 我自己的截图里都要盯半天才看见那条带。
 * 深底 + 亮面之后，浅背景上有暗边、深背景上有亮芯，两种都立得住。
 */
function sigLine(g, w, under, over) {
  g.lineCap = "round";
  g.lineJoin = "round";
  g.strokeStyle = under || "#33150E";
  g.lineWidth = w + 3.4;
  g.stroke();
  g.strokeStyle = over || "#FFF3E2";
  g.lineWidth = w;
  g.stroke();
}

/** 断台预告。p = 被锁定的台面，k = 0（刚抬手）→ 1（快要落） */
function drawCrackMark(g, p, k) {
  const h = p.h || 22;
  const t = clamp(k, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 20);
  const cx = p.x + p.w / 2;

  /* ① 整块压暗泛红 → "被锁定了"。
     第一版是在顶边涂一条橙色带。橙色带落在木头本来就有的奶白高光上，
     读起来就是"这块板的高光画得有点脏"，完全不像预告。 */
  g.globalAlpha = 0.10 + 0.20 * pulse;
  g.fillStyle = "#5A1B0C";
  g.fillRect(p.x, p.y, p.w, h);
  g.globalAlpha = 1;

  /* ② 顶边一条亮带（黑底 + 亮面）。它给的是"这条边"，
     裂缝给的是"这块板要从这里断开"。 */
  g.beginPath();
  g.moveTo(p.x + 2, p.y - 1.5);
  g.lineTo(p.x + p.w - 2, p.y - 1.5);
  sigLine(g, 3.2, "#33150E", "#FFE2BE");

  /* ③ 裂缝：**主体是深色**。
     浅色线在浅色木头上读作"在发光"，不读作"裂开了"；
     木头裂开的地方是暗缝。所以这里反过来：亮色当底（把它从木纹里剥出来），
     深色当芯（才是裂缝本身）。深度随 t 长大 = 进度。 */
  for (let i = 0; i < 3; i++) {
    const bx = p.x + p.w * (0.26 + i * 0.24);
    const d = (h + 14) * (0.32 + 0.68 * t);
    g.beginPath();
    g.moveTo(bx, p.y - 1);
    g.lineTo(bx + 5, p.y + d * 0.40);
    g.lineTo(bx - 4, p.y + d * 0.70);
    g.lineTo(bx + 3, p.y + d);
    /* 亮底 6.4 / 暗芯 3.0：暗芯必须比亮圈粗，否则整条读作"白色的爪痕"。
       第一版是 5.6 / 2.2，出图上就是三道白痕。 */
    sigLine(g, 3.0, "#FFF0DC", "#33120A");
  }

  /* ④ 四角角括号：把"这一块"框出来。长度随 t 收紧（不是变长）——
     收紧读作"锁定了"，变长读作"在展开"。 */
  const L = Math.min(20, p.w * 0.24) * (1.0 - 0.35 * t);
  g.beginPath();
  for (const sd of [-1, 1]) {
    const bx = sd < 0 ? p.x - 5 : p.x + p.w + 5;
    for (const [ey, dy] of [[p.y - 9, 1], [p.y + h + 9, -1]]) {
      g.moveTo(bx, ey + dy * L);
      g.lineTo(bx, ey);
      g.lineTo(bx - sd * L, ey);
    }
  }
  sigLine(g, 2.8);

  /* ⑤ 下压箭头：从上方压到顶边。它给的是"方向"，不是"进度" */
  const ay = p.y - 52 + 38 * t;
  g.beginPath();
  for (const off of [0, 13]) {
    g.moveTo(cx - 14, ay + off);
    g.lineTo(cx, ay + off + 12);
    g.lineTo(cx + 14, ay + off);
  }
  sigLine(g, 3.2);
}

/** 泥潮预告。spot = 锁定的 {x0, w, cx}，k = 0 → 1 */
function drawMudWarn(g, spot, k) {
  const t = clamp(k, 0, 1);
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 16);
  const hh = 8 + 26 * t;

  /* ① 地面上升起的一层泥影：**高度跟着 t 长**。
     固定高度的话，"在涨"这件事完全读不到，看起来只是地上脏了一块。 */
  const grd = g.createLinearGradient(0, GROUND_Y - hh, 0, GROUND_Y + 4);
  /* 第一版 0.06 → 0.58，出图上是"草地上有一点点脏"，基本看不见。
     泥是在深绿草地上长的，明度差要够 30 级才认得出来。 */
  grd.addColorStop(0, "rgba(40,26,12,0.18)");
  grd.addColorStop(1, "rgba(40,26,12," + (0.72 + 0.20 * t).toFixed(3) + ")");
  g.fillStyle = grd;
  g.fillRect(spot.x0, GROUND_Y - hh, spot.w, hh + 10);

  /* ② 顶部一条界线：泥会涨到这里为止。
     没有这条线，玩家不知道"现在躲一下够不够"，只能等它真涨上来。 */
  g.beginPath();
  g.moveTo(spot.x0 + 4, GROUND_Y - hh);
  g.lineTo(spot.x0 + spot.w - 4, GROUND_Y - hh);
  sigLine(g, 2.6, "#2A1B10", "#EFE0C6");

  /* ③ 冒泡：黑边 + 亮芯。**相位错开**（+i*19）——
     同步冒的三个点看起来像一条虚线，不是气泡。 */
  for (let i = 0; i < 3; i++) {
    const bx = spot.x0 + spot.w * (0.22 + i * 0.28);
    const by = GROUND_Y - 4 - ((S.t * 26 + i * 19) % (16 + 30 * t));
    const r = 3.4 + i * 0.9;
    g.globalAlpha = 0.55 + 0.40 * pulse;
    g.fillStyle = "#D8B98C";
    g.beginPath(); g.arc(bx, by, r, 0, 6.283); g.fill();
    g.strokeStyle = "#2A1B10"; g.lineWidth = 1.6; g.stroke();
    g.globalAlpha = 1;
  }

  /* ④ 两端封口：这段泥到这里为止。
     没有封口线，玩家会以为泥会一直往两边蔓延，不敢走。 */
  g.beginPath();
  for (const xb of [spot.x0 + 2, spot.x0 + spot.w - 2]) {
    g.moveTo(xb, GROUND_Y - hh);
    g.lineTo(xb, GROUND_Y + 3);
  }
  sigLine(g, 2.4, "#2A1B10", "#EFE0C6");
}

/** 把场上所有 BOSS 的预告一次画完。空的时候一次都不进循环。 */
function drawBossMarks(g) {
  for (const f of S.foes) {
    if (f.dead || !f.isBoss) continue;
    if (f.cracking > 0 && f._crackTgt) drawCrackMark(g, f._crackTgt, 1 - f.cracking / 0.85);
    if (f.mucking > 0 && f._mudSpot) drawMudWarn(g, f._mudSpot, 1 - f.mucking / 0.95);
  }
}

function drawPlat(g, p) {
  const isGround = p.kind === "ground";
  if (isGround) {
    /* ---- 地面：泥土块 + 一层圆齿草皮。草齿是圆的，这是 Q 版和写实的唯一分界线。
     *
     * **画到画面外（-20 ~ 980），不在地面块的逻辑边界（26 / 934）收口。**
     * 逻辑边界只是球的碰撞范围，不是地面的边缘 —— 上一版在 26/934 收口，
     * 两端就露出"地面到此为止"的断头，于是必须再画一个封口物（树干/出口门）
     * 去遮它。用户那两句"右下角圆筒太突兀""左侧那个也不需要"，
     * 要遮的东西本来就不该存在。
     *
     * 现在地面直接铺出画外：球滚到画面外就是"滚出屏幕"，这是 2D 里
     * 最不需要解释的一种出界，不用任何装置去交代。 */
    const px = -20, pw = W + 40;
    const dg = g.createLinearGradient(0, p.y, 0, p.y + p.h + 26);
    dg.addColorStop(0, TH.dirt);
    dg.addColorStop(1, TH.dirt2);
    g.fillStyle = dg;
    g.fillRect(px, p.y, pw, p.h + 26);

    // 土里的石子：几颗深色圆点，固定位置
    g.fillStyle = "rgba(0,0,0,.14)";
    for (let i = 0, x = px + 20; x < px + pw - 16; i++, x += 62) {
      const o = hash(i + 31);
      g.beginPath();
      g.ellipse(x + o * 18, p.y + 16 + o * 20, 4 + o * 4, 3 + o * 3, 0, 0, 6.283);
      g.fill();
    }

    // 草皮底
    g.fillStyle = TH.grass2;
    g.beginPath();
    g.moveTo(px, p.y + 6);
    g.lineTo(px, p.y - 4);
    for (let x = px, i = 0; x <= px + pw; i++, x += 22) {
      g.arc(x + 11, p.y - 4, 12, Math.PI, 0);
    }
    g.lineTo(px + pw, p.y + 6);
    g.closePath();
    g.fill();

    // 草皮亮面
    g.fillStyle = TH.grass;
    g.beginPath();
    g.moveTo(px, p.y + 2);
    g.lineTo(px, p.y - 6);
    for (let x = px, i = 0; x <= px + pw; i++, x += 26) {
      g.arc(x + 13, p.y - 6, 12, Math.PI, 0);
    }
    g.lineTo(px + pw, p.y + 2);
    g.closePath();
    g.fill();

    // 草皮顶部深描边：只描上缘，不封边（封边会像贴纸框）
    g.strokeStyle = "rgba(24,58,34,.32)";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(px, p.y - 4);
    for (let x = px, i = 0; x <= px + pw; i++, x += 22) {
      g.arc(x + 11, p.y - 4, 12, Math.PI, 0);
    }
    g.stroke();

    // 草尖：三两根，稀疏
    g.strokeStyle = "rgba(40,110,52,.35)";
    g.lineWidth = 2;
    g.lineCap = "round";
    for (let i = 0, x = px + 14; x < px + pw; i++, x += 74) {
      const hh = 5 + hash(i + 7) * 5;
      g.beginPath();
      g.moveTo(x, p.y - 7);
      g.quadraticCurveTo(x + 3, p.y - 7 - hh, x + 6, p.y - 7);
      g.stroke();
    }
    /* 积雪压在草尖**之后** —— 雪是把草压住的，画在草尖下面就成了"草从雪里长出来" */
    snowLine(g, px, pw, p.y - 4, S.snowDepth);
    return;
  }

  // ---- 浮空台：一块有厚度的圆角木台
  // Q 版 2D 平台的正解是"一块砖"，不是"顶面 + 立面的伪 3D"。
  // 厚度由三件事建立：底部暗带、外轮廓、落在背景上的影子。
  const TOP = 6;
  const TK  = PLAT_TK;
  const R   = 11;

  // **接坡的那一端要开口**：不做圆角、不描竖边。
  // 整圈描边压在斜坡上，接缝处就是一条贯穿厚度的黑竖线 ——
  // 那条线是"两根木头对接"的全部证据，去掉它，台面才真的"弯了下去"。
  const flatL = !!rampMating(p.x, p.y);
  const flatR = !!rampMating(p.x + p.w, p.y);
  const openL = flatL ? 0 : 1;     // 1 = 这一端是真正的台头，要圆角 + 年轮
  const openR = flatR ? 0 : 1;

  /* ① 影子：远影（落在背景/地面上）+ 贴地 AO。没有影子，平台就是贴纸。
   *
   * 三层叠出柔边，不用 blur：每个平台每帧做一次全尺寸模糊，
   * 四条平台就是四次 —— 这个代价在手机上是白给的帧。
   * 三层逐次外扩 + 逐层变淡，出来的边缘已经读作"软"了。
   *
   * 整体左移 9px：和角色同一套光源（太阳在右上 700,74）。
   * 上一版影子在正下方，和角色的正下方影子"互相印证"，
   * 于是画面里有一套自洽的、错误的光照 —— 比不一致更糟。 */
  const shX = p.x + (openL ? 8 : 0);
  const shW = p.w - (openL ? 8 : 0) - (openR ? 8 : 0);
  g.fillStyle = "rgba(14,38,24,1)";
  for (let i = 2; i >= 0; i--) {
    const k = i / 2;
    g.globalAlpha = 0.13 * (1 - k * 0.55);
    rr(g, shX - 9 - k * 5, p.y + 20 + k * 2.5, shW + k * 10, TK - 2 + k * 3, R + 2 + k * 5);
    g.fill();
  }
  g.globalAlpha = 1;
  // 贴地 AO：紧贴平台底面的一条实心暗带，负责"这是接触面"。
  g.fillStyle = "rgba(14,38,24,.16)";
  rr(g, p.x + 2, p.y + TK - 6, p.w - 4, 12, 6);
  g.fill();

  /* ② 主体：**两根圆木**，不是一块板。
   *
   * 上一版是「一块 27px 圆角板 + 三条水平层缝」，用户的原话是「一根木头很突兀」。
   * 病根：层缝只能把一块板切成三块板，永远切不出圆木 —— 圆木的证据是
   * **每根都有自己的一条受光弧和一条背光弧**，叠在一起时中缝读作
   * "上木的背光压着下木的受光"，必然是一条暗线紧挨着一条亮线。
   *
   * 两根而不是三根：27 / 2 = 13.5，端头圆能画到 r≈7；
   * 分三根就只剩 9px，端头圆退化成小点，反而比板更像板。
   */
  const LH = TK / 2;
  g.save();
  platPath(g, p.x, p.y, p.w, TK, R, flatL, flatR);
  g.clip();

  for (let L = 0; L < 2; L++) {
    const y0 = p.y + L * LH;
    // 每根独立渐变。两根共用一个渐变的话，中间那道弯就没了，又回到"一块板"。
    const lg = g.createLinearGradient(0, y0, 0, y0 + LH);
    lg.addColorStop(0, TH.wood3);
    lg.addColorStop(0.30, TH.wood);
    lg.addColorStop(0.78, TH.wood);
    lg.addColorStop(1, TH.wood2);
    g.fillStyle = lg;
    g.fillRect(p.x, y0, p.w, LH);

    // 顶部受光弧：2px 暖白。Q 版读"圆柱"靠这条弧，不靠渐变
    g.fillStyle = "rgba(255,244,206,.50)";
    g.fillRect(p.x, y0 + 1.2, p.w, 2.2);
    // 下缘背光：圆的底部永远比顶部暗一档
    g.fillStyle = "rgba(44,24,10,.26)";
    g.fillRect(p.x, y0 + LH - 3, p.w, 3);

    // 中缝：上木压着下木 —— 先一条暗、再一条亮
    if (L === 1) {
      g.fillStyle = "rgba(38,20,8,.42)";
      g.fillRect(p.x, y0 - 1.6, p.w, 2.0);
      g.fillStyle = "rgba(255,240,200,.34)";
      g.fillRect(p.x, y0 + 0.4, p.w, 1.2);
    }
  }

  /* 树皮：**短横纹**，不是竖拼缝。
     竖缝在 27px 高的横木上读作"一截一截的木板"；横纹才读作树皮。
     每根三两道，长度 22~48，错开摆。 */
  g.strokeStyle = "rgba(72,42,22,.28)";
  g.lineWidth = 1.4;
  g.lineCap = "round";
  for (let L = 0; L < 2; L++) {
    const y0 = p.y + L * LH;
    const sh = L * 23;
    for (let x = p.x + 26 + sh; x < p.x + p.w - 16; x += 63) {
      const w2 = 22 + hash(x * 0.07 + L) * 26;
      const yy = y0 + LH * (0.34 + hash(x * 0.11 + L * 3) * 0.30);
      g.beginPath();
      g.moveTo(x, yy);
      g.quadraticCurveTo(x + w2 * 0.5, yy - 1.6, x + w2, yy);
      g.stroke();
    }
  }

  /* 树结：每 190px 一个，位置固定。
     没有结的木头读作"一截木色的条"，有结才读作"这块是木头"。 */
  for (let x = p.x + 96; x < p.x + p.w - 40; x += 190) {
    const cy = p.y + LH * 0.56;
    g.strokeStyle = "rgba(70,40,20,.30)";
    g.lineWidth = 1.3;
    for (let k = 1; k <= 2; k++) {
      g.beginPath();
      g.ellipse(x, cy, 2.0 * k, 1.5 * k, 0, 0, 6.283);
      g.stroke();
    }
  }

  /* 段缝：整根平台是**几段圆木对接**成的，不是一整根 600px 的原木。
     一道竖线单独画会读成裂纹，必须"左暗右亮"成对出现，才读作"两根木头顶在一起"。 */
  for (let x = p.x + 168; x < p.x + p.w - 40; x += 168) {
    g.fillStyle = "rgba(40,22,8,.34)";
    g.fillRect(x - 1.2, p.y + 1, 2.2, TK - 2);
    g.fillStyle = "rgba(255,238,196,.22)";
    g.fillRect(x + 1.0, p.y + 1, 1.4, TK - 2);
  }

  g.restore();

  /* ③ 端头：**大年轮**。
     Q 版横木的端头是一整个圆，不是一条窄竖条 —— 这是"这是一根木头"最强的
     单一信号，参考图里每根圆木端头都顶着这个圆。半径给到 LH/2 + 2，
     故意比木身略鼓一点：鼓出来才看得出"这是被锯断的断面"。 */
  const capTone = hexMix(TH.wood3, "#FFEDC4", 0.42);
  const ringTone = hexMix(TH.wood2, "#3E2410", 0.28);
  const capEnds = [];
  if (openL) capEnds.push([p.x + 5.5, 1]);
  if (openR) capEnds.push([p.x + p.w - 5.5, -1]);
  for (const [ex] of capEnds) {
    for (let L = 0; L < 2; L++) {
      const cy = p.y + L * LH + LH / 2;
      const rr2 = LH / 2 + 1.6;
      g.fillStyle = "rgba(30,16,6,.22)";
      g.beginPath();
      g.ellipse(ex + 1.4, cy + 1.2, 5.6, rr2, 0, 0, 6.283);
      g.fill();
      g.fillStyle = capTone;
      g.beginPath();
      g.ellipse(ex, cy, 5.6, rr2, 0, 0, 6.283);
      g.fill();
      g.strokeStyle = ringTone;
      g.lineWidth = 1.1;
      g.globalAlpha = 0.55;
      for (let k = 1; k <= 2; k++) {
        g.beginPath();
        g.ellipse(ex, cy, 5.6 * k / 3.1, rr2 * k / 3.1, 0, 0, 6.283);
        g.stroke();
      }
      g.globalAlpha = 1;
    }
  }

  // ④ 外轮廓：上下各描一段，接坡端不封口。
  //    整圈描边（rr + stroke）会 closePath，把接缝那道竖线画出来。
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.6;
  g.lineJoin = "round";

  // 上缘：左上 → 右上
  g.beginPath();
  if (flatL) g.moveTo(p.x, p.y);
  else { g.moveTo(p.x, p.y + R); g.quadraticCurveTo(p.x, p.y, p.x + R, p.y); }
  if (flatR) g.lineTo(p.x + p.w, p.y);
  else { g.lineTo(p.x + p.w - R, p.y); g.quadraticCurveTo(p.x + p.w, p.y, p.x + p.w, p.y + R); }
  g.stroke();

  // 下缘：右下 → 左下
  g.beginPath();
  if (flatR) g.moveTo(p.x + p.w, p.y + TK);
  else { g.moveTo(p.x + p.w, p.y + TK - R); g.quadraticCurveTo(p.x + p.w, p.y + TK, p.x + p.w - R, p.y + TK); }
  if (flatL) g.lineTo(p.x, p.y + TK);
  else { g.lineTo(p.x + R, p.y + TK); g.quadraticCurveTo(p.x, p.y + TK, p.x, p.y + TK - R); }
  g.stroke();

  // 没接坡的端头补那条竖边（圆角之间的直段）
  if (openL) {
    g.beginPath();
    g.moveTo(p.x, p.y + R);
    g.lineTo(p.x, p.y + TK - R);
    g.stroke();
  }
  if (openR) {
    g.beginPath();
    g.moveTo(p.x + p.w, p.y + R);
    g.lineTo(p.x + p.w, p.y + TK - R);
    g.stroke();
  }

  /* 积雪盖在木头顶面。**必须压在描边之后** ——
     否则那条 2.6px 的深棕上缘会从雪里透出来，读作"雪是垫在木头底下的一张纸"。
     左右各内缩 2px，避开端头那个大年轮（雪不该盖住断面）。 */
  if (TH.snow && S.snowDepth > 0.04) {
    snowLine(g, p.x + 3, p.w - 6, p.y + 1, S.snowDepth);
  }
}

/* ---------------------------------------------------------------------------
   Q 版火焰
   ---------------------------------------------------------------------------
   一支火焰 = 一团**胖水滴** + 深色描边 + 两层内焰。

   为什么不用细长火舌：960×600 里一根 5px 宽的火苗，缩到手机上不足 3px，
   读作"一条橙色竖线"，不是火。Q 版靠**轮廓**识别 —— 先画大、再描边，
   描边负责把它从背景里拔出来，轮廓负责让人一眼认出是火。
   --------------------------------------------------------------------------- */
function qflame(g, cx, by, h, w, ph) {
  const t = S.t;

  /* 三条互不成整数比的频率叠加。
     单频 = 匀速呼吸，一眼看出是循环；两条 = 看十秒能数出周期；
     三条才像"没规律"。幅度递减，高频只负责让轮廓起毛刺。 */
  const wob = (k) =>
      Math.sin(t * 7.3 + ph * 3.1 + k) * 0.11 +
      Math.sin(t * 11.9 + ph * 2.1 + k * 1.7) * 0.06 +
      Math.sin(t * 17.7 + ph * 5.3 + k * 2.3) * 0.03;

  /* 每一层用**自己的相位**，这是这一版和上一版最根本的差别。
     上一版三层共用同一组 flick / ww / tipX，等于等比缩放 ——
     画面上读作"一个气球在呼吸"，不是"火在烧"。
     火能被认出来的证据是**各层不同步**：外焰抖得快、焰心稳，中间那层跟着气流摆。 */
  /* 窜火：每隔几秒突然窜高一次。
     `max(0,sin)^6` 这个形状的意义 —— 六次方让函数在绝大部分时间里贴近 0，
     只在峰值附近几十度内冲上去。所以三次里大概有两次"几乎不动"、
     一次突然拉高 22%。用普通正弦做不出来：那是匀速升降，
     看起来像弹簧在拉。真火就是"长时间安静 + 偶尔窜一下"。 */
  const surge = (1 + Math.sin(t * 5.6 + ph) * 0.07)
      * (1 + Math.pow(Math.max(0, Math.sin(t * 1.55 + ph * 2.3)), 6) * 0.28);

  const path = (k, raise, lp) => {
    const f = wob(lp);
    const H = h * k * (1 + f) * surge;
    /* 窜高时**同时变细**：面积守恒的直觉。只拉高不瘦身的话，
       窜火那一刻会变成一个又高又胖的橙团 —— 那是气球，不是火。 */
    const W = w * k * (1 - f * 0.55) / Math.sqrt(surge);
    // 顶端横摆：两侧控制点各用不同相位，火焰才会"扭"；同相位就只是整体左右平移
    const tx = cx + Math.sin(t * 3.2 + ph) * w * 0.22
        + Math.sin(t * 5.4 + ph * 2.2 + lp * 1.4) * W * 0.28;
    const lx = Math.sin(t * 8.6 + ph + lp) * W * 0.11;
    const rx = Math.sin(t * 8.6 + ph + lp + 2.2) * W * 0.11;
    const b = by - raise * H;
    g.beginPath();
    /* 轮廓比例是 Q 版火焰的关键：**底宽 = 高 × 0.78**，中段往外鼓。
       上一版底宽只有高的 0.6 倍、中段还往里收，画出来是三根"尖塔"——
       尖顶瘦身是写实火焰的形状，Q 版火焰必须是**胖水滴**：
       下半个圆、上半个尖，重心压在下面。 */
    g.moveTo(cx - W * 0.46, b);
    g.bezierCurveTo(cx - W * 0.74 + lx, b - H * 0.20,
                    cx - W * 0.44 + lx, b - H * 0.70, tx, b - H);
    g.bezierCurveTo(cx + W * 0.44 + rx, b - H * 0.70,
                    cx + W * 0.74 + rx, b - H * 0.20, cx + W * 0.46, b);
    g.closePath();
  };

  /* **亮度要闪，不是恒定的。**
     真火最容易被认出来的特征不是形状，是**同一团火在零点几秒内亮度来回变**：
     一瞬间窜亮、一瞬间压下去。上一版三层用的是三个固定色值，
     无论形状抖得多好，看上去都是"一个不断变形的橙色物体"。
     这条和形状抖动是两件事，缺一样都不像火。 */
  const heat = 0.84 + Math.sin(t * 13.7 + ph * 4.1) * 0.10
                    + Math.sin(t * 23.1 + ph * 1.7) * 0.055;

  // 外焰
  path(1, 0, 0);
  g.fillStyle = hexMix("#F05C0A", "#FFA23C", heat);
  g.fill();
  /* 只描外焰。内焰也描的话，一团火的内部会出现两条黑线，
     读作"火裂开了"—— 这是描边最容易用错的地方。 */
  g.strokeStyle = "rgba(112,38,10,.70)";
  g.lineWidth = 2.2;
  g.lineJoin = "round";
  g.stroke();

  // 中焰（相位 +1.9）
  path(0.60, 0.11, 1.9);
  g.fillStyle = hexMix("#FFB31E", "#FFE07A", heat);
  g.fill();

  // 焰心（相位 +3.7，最稳）：亮到过曝时直接给白
  path(0.30, 0.21, 3.7);
  g.fillStyle = heat > 0.94 ? "#FFFCE0" : "#FFF4B8";
  g.fill();

  /* 焰舌：从焰尖脱出去、往上飘一段就淡掉的一小团。
     这是"火"最容易被认出来的一个动作 —— 火不是一个会伸缩的色块，
     它一直在往上掉渣、掉渣的东西还继续烧。没有这一层，
     再好的抖动也只是"橙色的形状在动"。 */
  for (let i = 0; i < 2; i++) {
    const k = ((t * 0.74 + ph * 0.9 + i * 0.5) % 1);
    const ex = cx + Math.sin(k * 6.2 + ph + i * 2.4) * w * 0.34;
    const ey = by - h * 0.86 - k * h * 0.72;
    const sw = (1 - k) * w * 0.20;
    const sh = (1 - k) * h * 0.24;
    g.globalAlpha = (1 - k) * 0.80;
    g.fillStyle = k < 0.40 ? "#FFD977" : "#FF8A2E";
    g.beginPath();
    g.ellipse(ex, ey, sw, sh, 0, 0, 6.283);
    g.fill();
  }
  g.globalAlpha = 1;
}

/* ---------------------------------------------------------------------------
   Q 版坑洞
   ---------------------------------------------------------------------------
   旧版是「梯形填色 + 两条斜线 + 里面一层渐变」，看着就是贴上去的一块色。
   贴图感不来自"画得少"，来自三处结构缺失：

     ① **没有描边**。同屏的平台、木桩、角色全是 2.6~3.2px 深色描边，
        唯独坑没有 —— 它立刻被并进背景，不再是一个场景物件。
     ② **没有断面**。地面被切了个洞，边缘是一条零厚的线。这个游戏的地面是
        **剖面**（44px 厚的土），挖开一定露出土层的高度。
     ③ **内部只有一种暗色**。没有"后壁受光 / 前壁背光"的明度差，
        眼睛读不出"往下陷"，只能读出一块深色形状。

   三层补齐：隆起坑沿 → 断面土层 → 深腔 + 后壁光。三种坑共用这套底盘。

   数值依据（画布 960×600，GROUND_Y = 556，地面块厚 44）：
     CUT = 8      断面要能看见"土有多厚"，但不超过地面块厚的 1/5，
                  否则坑会吃掉整条地面变成一条沟。
     INSET = 14   坑口比坑底每侧宽 14（总宽 100 → 底宽 72）。
                  斜边斜率约 8/14 ≈ 30°，再陡就读作"井"、再缓就读作"浅碟"。
     BOT = y + 32 坑底离地面 32px，坑下方还剩 12px 土，剖面才没有"挖穿"。
   --------------------------------------------------------------------------- */
function drawPit(g, pit) {
  const x = pit.x, y = pit.y, w = pit.w;
  const cx = x + w / 2;
  const CUT = 8, INSET = 14, BOT = y + 32;

  // ---- ② 断面土层：被挖开的那一层。
  //     必须**比地面土色暗一档**，否则断面和周围地面糊成一片，
  //     "挖开"这个动作就读不出来（第 1 关地面土是 #8A5B3A）。
  g.fillStyle = "#63401F";
  g.beginPath();
  g.moveTo(x, y);
  g.lineTo(x + w, y);
  g.lineTo(x + w - INSET + 3, y + CUT);
  g.lineTo(x + INSET - 3, y + CUT);
  g.closePath();
  g.fill();

  // 断面上的土粒。位置由 x 定死（不用随机），否则每帧都在抖。
  g.fillStyle = "rgba(158,114,74,.85)";
  for (let i = 0; i < 4; i++) {
    g.beginPath();
    g.arc(x + 13 + i * (w - 26) / 3, y + CUT * 0.58, 1.9, 0, 6.283);
    g.fill();
  }

  // ---- ③ 深腔
  g.fillStyle = "#221610";
  g.beginPath();
  g.moveTo(x + INSET - 3, y + CUT);
  g.lineTo(x + w - INSET + 3, y + CUT);
  g.lineTo(x + w - INSET, BOT);
  g.lineTo(x + INSET, BOT);
  g.closePath();
  g.fill();

  /* 后壁受光带。**坑的深度全靠这一条。**
     没有它，深腔只是一个贴在剖面上的深色块；有它，才读得出"洞往里陷"。
     14px 是试出来的：再窄读作"描边阴影"，再宽会把坑填亮、变成浅碟。 */
  const wl = g.createLinearGradient(0, y + CUT, 0, y + CUT + 14);
  wl.addColorStop(0, "rgba(152,118,84,.62)");
  wl.addColorStop(1, "rgba(152,118,84,0)");
  g.fillStyle = wl;
  g.beginPath();
  g.moveTo(x + INSET - 3, y + CUT);
  g.lineTo(x + w - INSET + 3, y + CUT);
  g.lineTo(x + w - INSET - 1, y + CUT + 14);
  g.lineTo(x + INSET + 1, y + CUT + 14);
  g.closePath();
  g.fill();

  /* ---- ④ 外轮廓：只描左斜、底、右斜。
     **不描坑口那条横线** —— 描了就等于在洞口压一块黑边，
     读作"洞口被板子盖住"，恰好否掉"这是个能掉进去的洞"。 */
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.8;
  g.lineJoin = "round";
  g.beginPath();
  g.moveTo(x + 3, y);
  g.lineTo(x + INSET, BOT);
  g.lineTo(x + w - INSET, BOT);
  g.lineTo(x + w - 3, y);
  g.stroke();

  // ---- ① 隆起坑沿：洞口左右各一坨土堆，压在地面上。
  //      画法用「粗描边 + 填充」两遍：
  //        第一遍把三块圆用 6px 深色描一遍，第二遍用土色填盖住内侧一半描边。
  //        留下的正好是**并集的外轮廓** —— 这是 canvas 里做"一堆东西"的唯一稳法。
  //        每个圆单独描边再拼起来是不行的：内侧的边会互相交叉，
  //        立刻读作"几个球叠着"（树冠上踩过同一个坑）。
  for (const sd of [-1, 1]) {
  const bx = cx + sd * (w / 2 - 3);
  const lumps = [[0, 3, 12, 5.5], [sd * 3, -2, 8.5, 5.5], [-sd * 1.5, -5, 5.5, 3.5]];
  const lumpPath = (ox, oy, rx, ry) => {
    g.beginPath();
    g.ellipse(bx + ox, y + oy, rx, ry, 0, 0, 6.283);
  };

  // 堆底阴影：让堆"坐"在地上，而不是浮着
  g.fillStyle = "rgba(52,32,18,.32)";
  g.beginPath();
  g.ellipse(bx, y + 6.5, 18, 4.5, 0, 0, 6.283);
  g.fill();

  g.strokeStyle = COL.outline;
  g.lineWidth = 4;
  g.lineJoin = "round";
  for (const [ox, oy, rx, ry] of lumps) { lumpPath(ox, oy, rx, ry); g.stroke(); }
  // 土堆比地面土**亮一档**：它是被翻上来的新土，本来就该更浅
  g.fillStyle = "#A06E44";
  for (const [ox, oy, rx, ry] of lumps) { lumpPath(ox, oy, rx, ry); g.fill(); }
  // 顶部受光（光源在右上）
  g.fillStyle = "rgba(214,168,118,.9)";
  g.beginPath();
  g.ellipse(bx + sd * 2, y - 4, 7, 2.6, -0.22, 0, 6.283);
  g.fill();
  // 翻出来的草皮：一小块绿色挂在土堆外侧。
  // 有它才是"被挖开的草地"，没有就只是"两堆土"
  g.fillStyle = "rgba(116,174,90,.95)";
  g.beginPath();
  g.ellipse(bx + sd * 10, y + 2.5, 6, 2.8, sd * 0.35, 0, 6.283);
  g.fill();
  g.strokeStyle = "rgba(48,86,44,.55)";
  g.lineWidth = 1.4;
  g.stroke();
  }

  /* ======================= 腔内内容 ======================= */

  if (pit.kind === "fire") {
    /* 余烬床：坑底一层发亮的炭灰。
       必须是 radialGradient —— 纯色读作"坑底铺了块橙色纸"。 */
    const eg = g.createRadialGradient(cx, BOT - 5, 2, cx, BOT - 5, w * 0.50);
    eg.addColorStop(0, "rgba(255,178,64,.95)");
    eg.addColorStop(0.5, "rgba(232,104,26,.62)");
    eg.addColorStop(1, "rgba(178,54,8,0)");
    g.fillStyle = eg;
    g.beginPath();
    g.ellipse(cx, BOT - 5, w * 0.42, 10, 0, 0, 6.283);
    g.fill();

    /* ---- 火光溢出：**这一层是"真火"和"火的贴图"唯一的分界线**。
      现实里任何一个光源都会在自己周围留下明暗变化。一团火如果只照亮
      自己、不照亮周围任何东西，眼睛立刻判定它是贴上去的一张橙图 ——
      这正是用户前几轮反复说的"像贴上去的"在火坑这里的形态。

      三圈，半径 34 / 74 / 118：
        · 内圈压在坑口和坑沿上，把土堆照成暖色（不是把土染橙，
          是让土“被照亮” —— 所以用叠加式的低 alpha，不用实色）
        · 中圈落到坑外的草地上
        · 外圈只到几乎看不出，作用是让边界不出现一圈硬边

      强度用一个独立的高频抖动，和火焰的抖动**不同频**：
      同频的话光圈会跟着火焰一起呼吸，读作一个整体缩放的特效；
      不同频才像"火苗窜了一下，光跟着闪"。 */
    const glowK = 0.86 + Math.sin(S.t * 9.1) * 0.07 + Math.sin(S.t * 14.7 + 1.3) * 0.05;
    /* **必须用 `lighter`（加色）叠，不能用普通 alpha。**
       普通 alpha 是把橙色"混"进草地色，浓度一高就变脏、一低就看不见 ——
       试过 0.26 的那一版，采样（550,500）几乎和周围一模一样。
       真实的光是**相加**的：照到哪儿，那儿的每个通道都往上加。
       lighter 才是物理上正确的叠加，而且低 alpha 就有明显效果。 */
    g.save();
    g.globalCompositeOperation = "lighter";
    /* 衰减曲线是"平"的，不是"高斯"的：0~55% 半径内几乎不掉，
       85% 之后才快速收口。用标准的三段式（0/0.5/1 线性）时，
       半径 110 才能照到的地方实际 alpha 只剩 4% —— 画上去看不出来，
       采样差 5 个色阶，人眼完全无感。平坦曲线才能在**同一块草地**
       上留下能看出来的明暗差。 */
    /* **必须是扁椭圆，不是圆。** 两个理由：
       ① 火在平地上投出的光斑本来就是横向铺开的，圆形光斑是"聚光灯"；
       ② 圆形半径 200 会一路照到 350 那层浮空台**上面**去 ——
          平台是不透明的，光穿过去就露馅了。扁到 ry/rx ≈ 0.55 之后，
          最外圈也只到 y≈470，正好停在 462 那层平台下沿。
       三层的圆心略微错开（-3 / +4 / 0），叠出来的边界就不是一个完美圆，
       避免读作"贴了一张径向渐变"。 */
    for (const [rx_, ry_, dx_, a0] of [[178, 104, -3, 0.105], [124, 76, 4, 0.175], [74, 50, 0, 0.38]]) {
      const gx = cx + dx_, gy = BOT - 44;
      const gg = g.createRadialGradient(gx, gy, 2, gx, gy, rx_);
      gg.addColorStop(0, `rgba(255,178,84,${a0 * glowK})`);
      gg.addColorStop(0.55, `rgba(255,152,62,${a0 * glowK * 0.72})`);
      gg.addColorStop(0.86, `rgba(255,132,46,${a0 * glowK * 0.16})`);
      gg.addColorStop(1, "rgba(255,120,30,0)");
      g.save();
      g.translate(gx, gy);
      g.scale(1, ry_ / rx_);
      g.fillStyle = gg;
      g.beginPath();
      g.arc(0, 0, rx_, 0, 6.283);
      g.fill();
      g.restore();
    }
    g.restore();
    /* 坑内后壁被火照亮的那一片：一条贴着后壁的暖带。
       没有它，坑腔永远是同一个暗度，火焰像插在一个洞里；
       有它，坑才是一个**被自己的火烧亮的容器**。 */
    const wallLit = g.createLinearGradient(0, y + CUT, 0, BOT);
    wallLit.addColorStop(0, `rgba(255,150,60,${0.20 * glowK})`);
    wallLit.addColorStop(0.6, `rgba(255,120,40,${0.09 * glowK})`);
    wallLit.addColorStop(1, "rgba(255,110,30,0)");
    g.fillStyle = wallLit;
    g.beginPath();
    g.moveTo(x + INSET - 1, y + CUT);
    g.lineTo(x + w - INSET + 1, y + CUT);
    g.lineTo(x + w - INSET, BOT - 2);
    g.lineTo(x + INSET, BOT - 2);
    g.closePath();
    g.fill();

    /* 炭块：3 块圆角黑炭，每块都带描边 + 顶面被烤亮。
       有描边才有体积 —— 无描边的色块丢在火里只会读作"噪点"。 */
    const coals = [[-0.27, 2, 14, 9], [0.04, -1, 17, 11], [0.31, 3, 13, 8]];
    for (const [fx, dy, cw, ch] of coals) {
      const kx = cx + fx * w, ky = BOT - ch / 2 + dy;
      g.fillStyle = "#3A2A22";
      rr(g, kx - cw / 2, ky - ch / 2, cw, ch, 4.5);
      g.fill();
      g.strokeStyle = "rgba(20,12,8,.92)";
      g.lineWidth = 1.8;
      g.stroke();
      g.fillStyle = "rgba(255,158,66,.6)";
      rr(g, kx - cw / 2 + 2, ky - ch / 2 + 1.5, cw - 4, 2.8, 1.4);
      g.fill();
    }

    /* 火根：火焰底边不能是水平直线 —— 直线读作"一排贴纸的下沿"。
       先用一条亮橙的扁椭圆把三团火的脚糊在一起，火才是"从炭火里长出来的"。 */
    for (const dx of [-0.26, 0, 0.27]) {
      const fg = g.createRadialGradient(cx + dx * w, BOT - 3, 1, cx + dx * w, BOT - 3, w * 0.22);
      fg.addColorStop(0, `rgba(255,222,130,${0.85 * glowK})`);
      fg.addColorStop(0.55, `rgba(255,146,44,${0.55 * glowK})`);
      fg.addColorStop(1, "rgba(255,110,20,0)");
      g.fillStyle = fg;
      g.beginPath();
      g.ellipse(cx + dx * w, BOT - 3, w * 0.22, 7, 0, 0, 6.283);
      g.fill();
    }

    /* 火焰：**三团大的**，不是七根细条。
       旧版 7 根 22px 火苗、实体只有 5px 宽 —— 缩到手机上不足 3px，
       读作"一排橙色竖线"。Q 版靠轮廓识别，必须画大。
       中间那团高 50（坑口到焰尖），另外两团 34 / 30，错落才不像三根蜡烛。 */
    qflame(g, cx - w * 0.30, BOT - 1, 36, 22, 0.0);
    qflame(g, cx + w * 0.31, BOT - 1, 32, 20, 1.9);
    qflame(g, cx, BOT - 3, 54, 34, 0.8);

    /* 火星：8 颗，每颗带一条**短拖尾**。
       拖尾是"它在动"的直接证据 —— 单颗圆点无论飘多快，静帧上都是个点；
       有了拖尾，同一帧就有了方向和速度。拖尾用同一颗的上一段位置反推，
       不用额外状态，所以不会和暂停/回溯打架。 */
    for (let i = 0; i < 8; i++) {
      const ph = (S.t * 0.62 + i * 0.125) % 1;
      const sx = cx + Math.sin(ph * 6.4 + i * 2.1) * (12 + i * 2.6) + ph * ph * (i % 2 ? 9 : -7);
      const sy = BOT - 12 - ph * 58;
      const sr = 2.9 - ph * 1.5;
      const tail = 3.6 + ph * 7;
      g.globalAlpha = (1 - ph) * 0.90;
      g.strokeStyle = i % 2 ? "#FFD977" : "#FF9A3C";
      g.lineWidth = sr * 1.5;
      g.lineCap = "round";
      g.beginPath();
      g.moveTo(sx, sy);
      g.lineTo(sx - Math.sin(ph * 6.4 + i * 2.1) * tail * 0.5, sy + tail);
      g.stroke();
      g.fillStyle = i % 2 ? "#FFF0B8" : "#FFC061";
      g.beginPath();
      g.arc(sx, sy, sr, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;
    return;
  }

  if (pit.kind === "water") {
    // 水面比坑口**低**：这是"能沉下去"的唯一视觉证据。
    const wy = y + CUT + 5;
    const wg = g.createLinearGradient(0, wy, 0, BOT - 2);
    wg.addColorStop(0, "#8FDCEE");
    wg.addColorStop(0.55, "#4FB3D8");
    wg.addColorStop(1, "#2A7396");
    g.fillStyle = wg;
    g.beginPath();
    g.moveTo(x + INSET - 1, wy);
    g.lineTo(x + w - INSET + 1, wy);
    g.lineTo(x + w - INSET, BOT - 2);
    g.lineTo(x + INSET, BOT - 2);
    g.closePath();
    g.fill();

    // 水面亮顶：一条椭圆浅带。没有它，水面读作"一个蓝色的洞"
    g.fillStyle = "rgba(228,250,255,.85)";
    g.beginPath();
    g.ellipse(cx, wy + 1, (w - INSET * 2) / 2 - 2, 3.4, 0, 0, 6.283);
    g.fill();

    // 涟漪：三圈往外扩的光环（粗一点、慢一点，Q 版不画细纹）
    for (let i = 0; i < 3; i++) {
      const k = ((S.t * 0.55 + i / 3) % 1);
      g.globalAlpha = 0.75 * (1 - k);
      g.strokeStyle = "#E8FBFF";
      g.lineWidth = 2.2;
      g.beginPath();
      g.ellipse(cx - 10 + i * 9, wy + 2, 5 + k * 19, (5 + k * 19) * 0.34, 0, 0, 6.283);
      g.stroke();
      g.globalAlpha = 1;
    }

    // 水面浮的一片叶子：给"水"一个参照物，否则读作"空的"
    const lx = cx + 12, ly = wy + 8;
    g.fillStyle = "#63A24E";
    g.beginPath();
    g.ellipse(lx, ly, 8, 3.4, -0.22, 0, 6.283);
    g.fill();
    g.strokeStyle = "rgba(36,62,30,.7)";
    g.lineWidth = 1.4;
    g.stroke();
    return;
  }

  // ---- 泥坑
  const my = y + CUT + 3;
  const mg = g.createLinearGradient(0, my, 0, BOT - 2);
  mg.addColorStop(0, "#6B4E32");
  mg.addColorStop(1, "#3A2A1C");
  g.fillStyle = mg;
  g.beginPath();
  g.moveTo(x + INSET - 1, my);
  g.lineTo(x + w - INSET + 1, my);
  g.lineTo(x + w - INSET, BOT - 2);
  g.lineTo(x + INSET, BOT - 2);
  g.closePath();
  g.fill();

  // 泥面高光：一条跟着坑口走的浅带，读作"表面是湿的"
  g.fillStyle = "rgba(150,114,74,.55)";
  g.beginPath();
  g.ellipse(cx, my + 2, (w - INSET * 2) / 2 - 3, 3.2, 0, 0, 6.283);
  g.fill();

  // 气泡：Q 版用大圆 + 描边，细碎气泡会碎成噪点
  for (let i = 0; i < 4; i++) {
    const bx = x + 22 + i * (w - 44) / 3;
    const ph = (S.t * 0.8 + i * 0.26) % 1;
    g.globalAlpha = 1 - ph;
    g.fillStyle = "#8A6E4C";
    g.beginPath();
    g.arc(bx, my + 12 - ph * 15, 2.6 + ph * 3.4, 0, 6.283);
    g.fill();
    g.strokeStyle = "rgba(46,32,20,.6)";
    g.lineWidth = 1.3;
    g.stroke();
    g.globalAlpha = 1;
  }
}

/* ---------- 斜坡 ---------- */
function drawRamp(g, r) {
  // ---- 一条弯下去的路
  // 关键：厚度**垂直于路面**量，不是竖直量。
  // 竖直量的话，45° 的坡看起来只有平路的 70% 厚 —— 这就是"斜的比横的薄"。
  // 平台是水平的（垂直厚度 = 竖直厚度 = PLAT_TK），坡用同一个垂直厚度，
  // 竖直投影自动放大 1/cosθ，两块接在一起才真的"厚度吻合"。
  /* 栈道面厚度。
   *
   * **21 是"坡不能堵"量出来的。** 整条坡在最长的一关是 494 长，
   * 厚度 27 就等于 13000 平方像素的实色横在屏幕中间 —— 它把背景挡完了，
   * 背景再有层次也看不见，这就是用户说的"太堵"。
   * 收到 21（-22%）之后体量明显下去，但仍然是"一根木头"，不是"一张纸"。
   *
   * **接头处必须是 PLAT_TK，往前走 18% 行程才收到 21。**
   * 不做这个渐变，台面和坡的下缘会差 6px，接缝处出现一个看得见的台阶缺口
   * —— 那正是上一版花大力气消灭掉的"两根木头对接"。
   * 顺带白拿一点透视：越往下越薄。
   */
  const RAMP_TK = 21;
  const TOP = 6;
  const N   = 48;                // 采样点取密，弯的地方才没有折线感
  const x1 = r.x, x2 = r.x + r.w;

  // 接平台那一端水平往外伸一截，塞到台面底下（平台后画，会盖住）。
  // **只伸高端** —— 低端伸出去会悬空，球在肉眼看得到的坡上却踩不到东西。
  const highLeft = r.yL <= r.yR;
  const EXT = 26;
  const xa = highLeft ? x1 - EXT : x1;
  const xb = highLeft ? x2 : x2 + EXT;

  const yAt = (x) => rampSurfY(r, x);
  const xAt = (i) => xa + (xb - xa) * (i / N);

  // 坡度 → 竖直厚度系数：垂直厚度 t 对应的竖直偏移 = t·√(1+m²)
  const slopeAt = (x) => (yAt(x + 2) - yAt(x - 2)) / 4;
  const vk = (x) => Math.sqrt(1 + slopeAt(x) * slopeAt(x));
  const off = (x, t) => t * vk(x);

  /* 某一点的栈道面厚度。s 从**高的一端**量起 —— 高的一端接台面，要吻合。 */
  const tkAt = (x) => {
    let s = clamp((x - x1) / r.w, 0, 1);
    if (!highLeft) s = 1 - s;
    const k = clamp(s / 0.18, 0, 1);
    return PLAT_TK + (RAMP_TK - PLAT_TK) * k;
  };

  const yA = yAt(xa), yB = yAt(xb);
  const yTop = Math.min(yA, yB);
  const yBot = Math.max(yA, yB) + PLAT_TK * 1.7;

  // 沿曲线切一条带：上沿 / 下沿都可以是常数或 (x) => 竖直偏移
  const band = (topFn, botFn) => {
    const tv = (x) => (typeof topFn === "function" ? topFn(x) : topFn);
    const bv = (x) => (typeof botFn === "function" ? botFn(x) : botFn);
    g.beginPath();
    for (let i = 0; i <= N; i++) {
      const x = xAt(i);
      const y = yAt(x) + tv(x);
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    for (let i = N; i >= 0; i--) {
      const x = xAt(i);
      g.lineTo(x, yAt(x) + bv(x));
    }
    g.closePath();
  };

  // ① 环境遮蔽：贴着栈道底面的一条薄暗带。
  //    厚度收窄到 11（原来是 13~46 的一大条），alpha .16 → .13 ——
  //    它的职责已经从"影子"降级成"底面有厚度"，不再参与构图。
  g.fillStyle = "rgba(16,42,28,.13)";
  band((x) => off(x, 5), (x) => off(x, tkAt(x) + 10));
  g.fill();

  // ② 主体
  const bg = g.createLinearGradient(0, yTop, 0, yBot);
  bg.addColorStop(0, TH.wood3);
  bg.addColorStop(0.12, TH.wood);
  bg.addColorStop(0.72, TH.wood);
  bg.addColorStop(1, TH.wood2);
  g.fillStyle = bg;
  band(0, (x) => off(x, tkAt(x)));
  g.fill();

  // ③ 顶带 / 层缝 / 底带 / 拼缝，全部 clip 在路面里
  g.save();
  band(0, (x) => off(x, tkAt(x)));
  g.clip();

  // 顶带跟着曲线走 —— 这是"路"和"管子"的分界线：
  // 管子是均匀截面，路有一条明确的受光面。
  g.fillStyle = "rgba(255,255,255,.20)";
  band(0, TOP);
  g.fill();
  g.fillStyle = "rgba(255,255,255,.46)";
  band(0, 2);
  g.fill();
  g.fillStyle = "rgba(40,22,10,.30)";
  band((x) => off(x, tkAt(x)) - 5, (x) => off(x, tkAt(x)));
  g.fill();

  /* 分层：和浮空台同一套（3 层，层缝在 t = TK·⅓、TK·⅔）。
     **层缝必须沿曲线画**。用 fillRect 画水平线，在 40° 的坡上会直接穿出路面 ——
     这是"坡"和"台阶"最容易被写混的一处：台阶的缝是水平的，坡的缝平行于路面。
     厚度现在是 tkAt(x) 变的，所以层缝位置也得跟着变，不能再用常数。 */
  for (let L = 1; L < LAYERS; L++) {
    const f = L / LAYERS;
    g.fillStyle = "rgba(255,255,255,.30)";
    band((x) => off(x, tkAt(x) * f), (x) => off(x, tkAt(x) * f) + 1.8);
    g.fill();
    g.fillStyle = "rgba(34,18,8,.34)";
    band((x) => off(x, tkAt(x) * f) + 1.8, (x) => off(x, tkAt(x) * f) + 3.4);
    g.fill();
  }
  for (let L = 1; L <= LAYERS; L++) {
    const f = L / LAYERS;
    g.fillStyle = "rgba(34,18,8,.15)";
    band((x) => off(x, tkAt(x) * f) - 2.2, (x) => off(x, tkAt(x) * f));
    g.fill();
  }

  // 拼缝：每层一段，三层错开。贯穿全厚的竖线读作"一根木条"，
  // 分段错开才读作"几块板搭在坡上"。
  g.strokeStyle = "rgba(52,30,16,.24)";
  g.lineWidth = 1.2;
  for (let L = 0; L < LAYERS; L++) {
    const sh = LAYER_SHIFT[L % LAYER_SHIFT.length];
    for (let x = x1 + 26 + sh; x < x2 - 16; x += 48) {
      const y = yAt(x), tk = tkAt(x);
      const t0 = tk * (L / LAYERS) + 2.2;
      const t1 = tk * ((L + 1) / LAYERS) - 2.6;
      if (t1 <= t0 + 0.6) continue;     // 薄段放不下一道缝就跳过，别画成一条黑点
      g.beginPath();
      g.moveTo(x, y + off(x, t0));
      g.lineTo(x, y + off(x, t1));
      g.stroke();
    }
  }
  g.restore();

  /* ③b 短支腿 —— **这是"不堵"的关键，不是装饰。**
   *
   * 参考概念图里的栈道是「薄板 + 稀疏支腿 + 底下透空」。
   * 透空这件事有两个作用，缺一不可：
   *   ① 视觉体量直接砍掉一半 —— 实心厚板挡住的那 20~30px 背景回来了；
   *   ② 支腿给出了「这块板浮在地面之上」的唯一证据。
   *      没有它，一条薄板在 2D 里会读成"画在背景上的一条线"，
   *      反而比厚板更像贴纸。
   *
   * **支腿不落地。** 最长那一关坡顶离地 206px，落地就是战场中间竖一排栅栏，
   * 球道会被切成格子（可读性事故）。只出 18px 的短腿，读作"架起来的"就够 ——
   * 观众不需要知道它架在什么上，这是 Q 版卡通的默认豁免。 */
  const LEGS = [0.26, 0.46, 0.66, 0.84];
  for (const s of LEGS) {
    const bx = x1 + r.w * s;
    const byTop = yAt(bx) + off(bx, tkAt(bx));
    const lw = 7, lh = 18;
    g.fillStyle = TH.wood2;
    rr(g, bx - lw / 2, byTop - 3, lw, lh, 2.5);
    g.fill();
    // 斜撑：往上坡方向斜伸一根短木，给出"支"的方向
    g.strokeStyle = COL.outline;
    g.lineWidth = 1.8;
    g.lineJoin = "round";
    g.beginPath();
    g.moveTo(bx - lw / 2 + 1, byTop + 4);
    g.lineTo(bx - lw / 2 - 9, byTop - 6);
    g.stroke();
    // 腿的轮廓：左、下、右三边（上边被栈道面盖住，不描）
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(bx - lw / 2, byTop);
    g.lineTo(bx - lw / 2, byTop + lh - 2.5);
    g.quadraticCurveTo(bx, byTop + lh + 1.5, bx + lw / 2, byTop + lh - 2.5);
    g.lineTo(bx + lw / 2, byTop);
    g.stroke();
  }

  // ④ 外轮廓：上缘、下缘各描一条，**不闭合**。
  //    闭合就会在接平台那一端画出一道竖边，正好压在平台端头上 ——
  //    接缝处那条黑线，一半来自平台整圈描边，另一半来自这里。
  const joinsL = !!rampMating(r.x, r.yL);
  const joinsR = !!rampMating(r.x + r.w, r.yR);
  // 悬空端要封口（读作"桥到头了"）；落地端被草皮盖住，不封。
  const openL = !joinsL && r.yL < GROUND_Y - 6;
  const openR = !joinsR && r.yR < GROUND_Y - 6;

  g.strokeStyle = COL.outline;
  g.lineWidth = 2.6;
  g.lineJoin = "round";
  g.lineCap = "round";

  // 上缘
  g.beginPath();
  for (let i = 0; i <= N; i++) {
    const x = x1 + (x2 - x1) * (i / N);
    const y = yAt(x);
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();

  // 下缘
  g.beginPath();
  for (let i = 0; i <= N; i++) {
    const x = x1 + (x2 - x1) * (i / N);
    const y = yAt(x) + off(x, tkAt(x));
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  g.stroke();

  // 悬空端封口
  if (openL) {
    g.beginPath();
    g.moveTo(x1, yAt(x1));
    g.lineTo(x1, yAt(x1) + off(x1, tkAt(x1)));
    g.stroke();
  }
  if (openR) {
    g.beginPath();
    g.moveTo(x2, yAt(x2));
    g.lineTo(x2, yAt(x2) + off(x2, tkAt(x2)));
    g.stroke();
  }
}

/* ---------- 弹簧菇 ---------- */
function drawBouncer(g, b) {
  const ph = Math.sin(S.t * 4.4 + b.x * 0.02);
  const squash = 1 + ph * 0.10;
  const top = b.y - 30;
  const bw = 30 * (1 / squash), bh = 22 * squash;

  // 影子
  g.fillStyle = "rgba(20,40,26,.22)";
  g.beginPath();
  g.ellipse(b.x, b.y + 2, 26, 6, 0, 0, 6.283);
  g.fill();

  // 柄
  g.fillStyle = "#E8E0C2";
  g.beginPath();
  rr(g, b.x - 6, top + bh * 0.5, 12, b.y - top - bh * 0.5 - 2, 5);
  g.fill();

  // 伞
  const capG = g.createLinearGradient(b.x, top, b.x, top + bh);
  capG.addColorStop(0, "#FF9A7A");
  capG.addColorStop(1, "#D9463F");
  g.fillStyle = capG;
  g.beginPath();
  g.ellipse(b.x, top + bh * 0.55, bw, bh * 0.72, 0, Math.PI, 0);
  g.fill();
  g.fillStyle = "#FFC6A8";
  g.beginPath();
  g.ellipse(b.x, top + bh * 0.55, bw, 4.5, 0, 0, 6.283);
  g.fill();

  // 伞上的白点
  g.fillStyle = "rgba(255,246,200,.92)";
  for (const dx of [-14, 0, 14]) {
    g.beginPath();
    g.arc(b.x + dx, top + bh * 0.34 - Math.abs(dx) * 0.18, 3.2, 0, 6.283);
    g.fill();
  }
  g.strokeStyle = "rgba(40,64,36,.5)";
  g.lineWidth = 2;
  g.beginPath();
  g.ellipse(b.x, top + bh * 0.55, bw, bh * 0.72, 0, Math.PI, 0);
  g.stroke();
}

/* ---------- 地面材质带（N1）----------
   画在地面顶面上，厚 9px。**只有 ice / mud 才画** —— 苔面是本作的默认地面，
   给它加一条色带等于给所有屏幕加一条横线，反而更乱。

   读法必须靠颜色本身，不靠形状：
     冰 = 亮蓝白 + 横向高光断点（读作"滑"）
     泥 = 深棕 + 不规则斑块（读作"陷"）
   两条都在 30% 缩放下还能分辨，这是这个件的合格线。 */
/** BOSS 现铺的泥。
 *
 * 和关卡自带的泥**同一套物理**（`MAT.mud`：球 ×0.72 增益 + 每帧拖拽、
 * 人摩擦 ×2.10），只有画法不同：
 *   地形泥  = 一条静态色带 + 几个暗点（它一直在那儿，不需要抢注意力）
 *   BOSS 泥 = 顶边是不规则的泥包 + 一直冒泡（它是刚刚发生的，必须抢到注意力）
 *
 * 高度上限 10px 是量出来的：球底 556、球心 545。高过 545 就会把球整个盖住，
 * 读作"球被埋了"（物理上并没有）；压在 548 以下，球就只是"陷在泥里"。
 */
function drawMudMound(g, gr) {
  const y = GROUND_Y, h = 12;

  /* ① 泥面：顶边四个缓包，**包要够高**（3~5px 的起伏读作"边缘抖了一下"）。
     直线顶边读作"贴了一条纸"；缓包读作"泥堆起来了"。 */
  g.beginPath();
  g.moveTo(gr.x, y + 5);
  const n = 4, step = gr.w / n;
  for (let i = 0; i < n; i++) {
    const x0 = gr.x + i * step;
    g.quadraticCurveTo(x0 + step * 0.5, y - h - (i % 2 ? 2 : 6),
                       x0 + step, y - 3);
  }
  g.lineTo(gr.x + gr.w, y + 5);
  g.closePath();
  /* 泥要**比草亮**。第一版用 #7A5735→#3A2716，在深绿草地上是"一块更深的暗影"，
     4 倍放大才看得出那是泥。泥是湿的，湿的东西顶面反光，明度该高于草地。 */
  const grd = g.createLinearGradient(0, y - h, 0, y + 5);
  grd.addColorStop(0, "#9A7550");
  grd.addColorStop(0.55, "#6B4C2E");
  grd.addColorStop(1, "#3E2A18");
  g.fillStyle = grd;
  g.fill();
  g.strokeStyle = "#2A1B10";
  g.lineWidth = 2.4;
  g.lineJoin = "round";
  g.stroke();

  /* ② 顶面反光：一小段亮弧。没有它，这块泥和"地面上的阴影"分不开 */
  g.globalAlpha = 0.85;
  g.strokeStyle = "#C4A176";
  g.lineWidth = 2.4;
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(gr.x + gr.w * 0.14, y - h + 4);
  g.quadraticCurveTo(gr.x + gr.w * 0.30, y - h + 1, gr.x + gr.w * 0.46, y - h + 3);
  g.stroke();
  g.globalAlpha = 1;

  /* ③ 冒泡：**这是它和地形泥唯一分得开的地方**。
     相位错开（+i*0.37），同步冒的四个点看起来像一条虚线。 */
  for (let i = 0; i < 4; i++) {
    const bx = gr.x + gr.w * (0.14 + i * 0.24);
    const ph = (S.t * 0.9 + i * 0.37) % 1;
    const by = y - 2 - ph * (h + 4);
    g.globalAlpha = 0.85 * (1 - ph);
    g.fillStyle = "#C9A277";
    g.beginPath();
    g.arc(bx, by, 3.2 + (i % 2) * 1.4, 0, 6.283);
    g.fill();
    g.strokeStyle = "#2A1B10";
    g.lineWidth = 1.2;
    g.stroke();
  }
  g.globalAlpha = 1;
}

function drawGroundMat(g, gr) {
  const m = MAT[gr.kind];
  if (!m || !m.tint) return;
  /* BOSS 现铺的泥走另一套画法（会冒泡的活泥）。物理还是 MAT.mud 那一套。 */
  if (gr.kind === "mud" && gr.boss) { drawMudMound(g, gr); return; }
  const y = GROUND_Y, h = 9;
  g.save();
  g.beginPath();
  rr(g, gr.x, y - 3, gr.w, h, 3);
  g.clip();

  g.fillStyle = m.tint;
  g.globalAlpha = gr.kind === "ice" ? 0.92 : 0.85;
  g.fillRect(gr.x, y - 3, gr.w, h);

  if (gr.kind === "ice") {
    // 横向高光断点：每 46px 一段，长度错开，读作"结晶体"
    g.globalAlpha = 0.95;
    g.fillStyle = "#F2FBFF";
    for (let x = gr.x + 6; x < gr.x + gr.w - 10; x += 46) {
      // hash 返回 0..1 的小数，先放大成 0..40 再取模 —— 直接用 % 永远落在 0..1
      const hx = hash(x | 0) * 40;
      g.fillRect(x, y - 2, 10 + hx % 14, 2);
      g.fillRect(x + 14, y + 2, 6 + (hx * 0.7) % 9, 1.6);
    }
  } else {
    g.globalAlpha = 0.8;
    g.fillStyle = "#5A4028";
    for (let x = gr.x + 4; x < gr.x + gr.w - 8; x += 21) {
      const hx = hash(x | 0) * 40;
      g.beginPath();
      g.ellipse(x + hx % 7, y + 1 + hx % 5, 4 + hx % 5, 2.2 + hx % 2, 0, 0, 6.283);
      g.fill();
    }
  }
  g.restore();

  // 两端各一道竖接线，说明"这一段到这儿为止"
  g.strokeStyle = "rgba(24,40,32,.35)";
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(gr.x + 1, y - 4); g.lineTo(gr.x + 1, y + 6);
  g.moveTo(gr.x + gr.w - 1, y - 4); g.lineTo(gr.x + gr.w - 1, y + 6);
  g.stroke();
}

/* ---------- 反射板（N2）----------
   一块悬空的金属斜板。**它必须看起来像"能用"的东西**，不能像装饰 ——
   所以给它：深色投影（说明悬空）、厚板身、上下两条高光（说明金属）、
   两端各一颗螺栓（说明是被人钉上去的、可靠）。

   高光沿板身画，所以在任何角度下都能读出"这是一块有厚度的板"而不是一条线。 */
/* 赛道段（TOUR）：铺在台面顶上的发光跑道。
 *
 * 画法上有一条硬要求：**它必须读成"地面的一部分"**，不能读成摆在台上的道具。
 * 因为球是真的要从上面滚过去的，画一个立体的框/门会让玩家下意识绕开。
 * 所以只用「贴地色带 + 顶面高光 + 两端虚线」，全部压在台面厚度以内。
 *
 * 序号不能省。赛道是**有顺序**的，没有序号玩家只会看见三段发光地板，
 * 不知道先踩哪段 —— 而顺序恰恰是这一屏唯一的谜题。 */
function drawTour(g, t, i) {
  const x1 = Math.min(t.x1, t.x2), x2 = Math.max(t.x1, t.x2);
  const w = x2 - x1;
  const y = t.y;
  if (w < 8) return;
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 2.2 - i * 1.9);

  /* 带宽 12，但**不靠颜色浓淡区分**：第一版用 alpha 0.16，截图里
     整条带子融进木台面，读起来像"这层木板被染色了"，不像跑道。
     现在靠三样东西立起来：实边 + 斜纹 + 端头箭头。 */
  g.fillStyle = "rgba(126,240,200,0.30)";
  g.fillRect(x1, y - 12, w, 12);

  // 斜纹：跑道的地面纹理。间距 18、斜 45°，比纯色带更"是条路"
  g.strokeStyle = "rgba(196,255,236," + (0.26 + 0.12 * pulse).toFixed(3) + ")";
  g.lineWidth = 2;
  g.beginPath();
  for (let x = x1 + 6; x < x2 - 2; x += 18) {
    g.moveTo(x, y);
    g.lineTo(x + 9, y - 12);
  }
  g.stroke();

  // 顶面亮边：贴地那一条，位置压在 y-12..y-9
  g.fillStyle = "rgba(206,255,240," + (0.70 + 0.28 * pulse).toFixed(3) + ")";
  g.fillRect(x1, y - 12, w, 3);

  // 两端竖线：实线，读作"这段到这为止"
  g.strokeStyle = "rgba(224,255,246,0.9)";
  g.lineWidth = 2.5;
  for (const x of [x1 + 1, x2 - 1]) {
    g.beginPath();
    g.moveTo(x, y - 13); g.lineTo(x, y);
    g.stroke();
  }

  // 方向箭头：每 96px 一个
  const dir = t.x2 >= t.x1 ? 1 : -1;
  g.strokeStyle = "rgba(180,255,232," + (0.50 + 0.30 * pulse).toFixed(3) + ")";
  g.lineWidth = 2.6;
  for (let x = x1 + 34; x < x2 - 26; x += 96) {
    g.beginPath();
    g.moveTo(x - 6 * dir, y - 9);
    g.lineTo(x + 2 * dir, y - 5.5);
    g.lineTo(x - 6 * dir, y - 2);
    g.stroke();
  }

  /* **出口**：段右端往下一道光柱 + 箭头。
     没有它，两段发光地板读起来是两个不相干的标记 ——
     "从这里滚出去、掉到下面那段"才是这条路线的全部含义。
     第一版用 1.5px 淡绿虚线，缩到 50% 直接消失；
     现在改成光柱（宽 10、越往下越淡）+ 实心箭头，缩略图里也读得出。
     最后一段不画（下面没东西了）。 */
  if (i + 1 < TOUR.length) {
    const ny = TOUR[i + 1].y;
    if (ny > y) {
      const h = Math.min(ny - y - 8, 96);
      const grad = g.createLinearGradient(0, y, 0, y + h);
      grad.addColorStop(0, "rgba(170,250,224," + (0.55 + 0.25 * pulse).toFixed(3) + ")");
      grad.addColorStop(1, "rgba(170,250,224,0.04)");
      g.fillStyle = grad;
      g.fillRect(x2 - 5, y, 10, h);
      // 箭头：实心，压在光柱下缘
      g.fillStyle = "rgba(206,255,240," + (0.80 + 0.20 * pulse).toFixed(3) + ")";
      g.beginPath();
      g.moveTo(x2 - 8, y + h - 4);
      g.lineTo(x2 + 8, y + h - 4);
      g.lineTo(x2, y + h + 8);
      g.closePath();
      g.fill();
    }
  }

  /* 序号：浮在跑道上方 30px。第一段前面加一个"入"字，
     因为它就是整条路线的起点，光有个「1」不知道从哪头开始。 */
  const cx = (x1 + x2) / 2, cy = y - 30;
  g.fillStyle = "rgba(14,34,30,0.78)";
  g.beginPath(); g.arc(cx, cy, 13, 0, 6.283); g.fill();
  g.strokeStyle = "rgba(206,255,240," + (0.75 + 0.25 * pulse).toFixed(3) + ")";
  g.lineWidth = 2.2;
  g.beginPath(); g.arc(cx, cy, 13, 0, 6.283); g.stroke();
  g.fillStyle = "#E4FFF6";
  g.font = "bold 15px 'Microsoft YaHei','PingFang SC',system-ui,sans-serif";
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillText(String(i + 1), cx, cy + 0.5);
  if (i === 0) {
    g.font = "11px 'Microsoft YaHei','PingFang SC',system-ui,sans-serif";
    g.fillStyle = "rgba(206,255,240,0.85)";
    g.fillText("起点", cx, cy - 21);
  }
  g.textAlign = "left";
  g.textBaseline = "alphabetic";
}


function drawReflect(g, d) {
  const dx = d.x2 - d.x1, dy = d.y2 - d.y1;
  const len = Math.hypot(dx, dy) || 1;
  const ux = dx / len, uy = dy / len;
  // 板法线（朝上那一侧）
  let nx = -uy, ny = ux;
  if (ny > 0) { nx = -nx; ny = -ny; }

  /* 板是「从地里长出来」的，**只画地面线以上那一截**。
     整条线段一半埋在画布外（y1=600 比画布还高），不切这一刀，
     板会画在地面带上面，读起来像"地上躺着一根蓝棍子"，不像机关。 */
  const GY = GROUND_Y + 2;
  let bx = d.x1, by = d.y1;
  if (by > GY) {
    const t = (GY - d.y1) / dy;             // dy < 0（往上走），t 落在 0..1
    bx = d.x1 + dx * t; by = GY;
  }

  g.lineCap = "round";

  // 底座：一小段梯形，说明板是插在地上的。纯装饰，不参与判定 ——
  // 判定永远是 d.x1..d.x2 那一条线段，视觉不许比判定大一圈。
  g.fillStyle = "#2A4450";
  g.globalAlpha = 0.9;
  g.beginPath();
  g.moveTo(bx - 14, GROUND_Y + 10);
  g.lineTo(bx + 14, GROUND_Y + 10);
  g.lineTo(bx + 8, GROUND_Y - 7);
  g.lineTo(bx - 8, GROUND_Y - 7);
  g.closePath();
  g.fill();
  g.globalAlpha = 1;

  // 投影：往右下偏 5px，说明板是悬空的
  g.strokeStyle = "rgba(16,30,38,.30)";
  g.lineWidth = 12;
  g.beginPath();
  g.moveTo(bx + 5, by + 5); g.lineTo(d.x2 + 5, d.y2 + 5);
  g.stroke();

  // 板身：比球（直径 44）细一点，但不能细到像根线 —— 它是这一屏的机关本体
  g.strokeStyle = "#6FA8C0";
  g.lineWidth = 16;
  g.beginPath(); g.moveTo(bx, by); g.lineTo(d.x2, d.y2); g.stroke();

  // 板面的亮面：往法线方向偏 1.6px，读作"上面受光"
  g.strokeStyle = "#D8F4FF";
  g.lineWidth = 6;
  g.beginPath();
  g.moveTo(bx + nx * 1.6, by + ny * 1.6);
  g.lineTo(d.x2 + nx * 1.6, d.y2 + ny * 1.6);
  g.stroke();

  /* 两枚箭头沿法线往外指 —— 这是这一屏唯一「必须看出来」的信息：
     板不是墙，它把你往那个方向送。没有这两个箭头，玩家只看见一块金属片。 */
  const pulse = 0.5 + 0.5 * Math.sin(S.t * 2.6);
  g.strokeStyle = "rgba(196,242,255," + (0.35 + 0.4 * pulse).toFixed(3) + ")";
  g.lineWidth = 2.6;
  for (const f of [0.3, 0.78]) {
    const px = bx + (d.x2 - bx) * f + nx * 15;
    const py = by + (d.y2 - by) * f + ny * 15;
    const L = 12 + 5 * pulse;
    g.beginPath();
    g.moveTo(px - ux * 5, py - uy * 5);
    g.lineTo(px + nx * L, py + ny * L);
    g.lineTo(px + ux * 5, py + uy * 5);
    g.stroke();
  }

  // 反光扫过（每 2.6 秒一次）—— 静止的金属板会被误读成木头
  const ph = (S.t * 0.38) % 1;
  if (ph < 0.34) {
    const t = ph / 0.34;
    const mx = bx + (d.x2 - bx) * t, my = by + (d.y2 - by) * t;
    g.strokeStyle = "rgba(255,255,255,.55)";
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(mx - ux * 5 + nx * 2, my - uy * 5 + ny * 2);
    g.lineTo(mx + ux * 5 + nx * 2, my + uy * 5 + ny * 2);
    g.stroke();
  }

  // 螺栓：只画两端露出来的那两处
  for (const q of [{ x: bx, y: by }, { x: d.x2, y: d.y2 }]) {
    g.fillStyle = "#24414F";
    g.beginPath(); g.arc(q.x, q.y, 5, 0, 6.283); g.fill();
    g.fillStyle = "#CFEFFA";
    g.beginPath(); g.arc(q.x - 0.8, q.y - 0.8, 2.2, 0, 6.283); g.fill();
  }
}


/* ---------- 传送洞 ---------- */
function drawPortal(g, pt) {
  const cy = pt.y - 16;
  // 洞
  g.fillStyle = "#101C26";
  g.beginPath();
  g.ellipse(pt.x, pt.y - 6, 28, 11, 0, 0, 6.283);
  g.fill();
  const pg = g.createRadialGradient(pt.x, pt.y - 6, 2, pt.x, pt.y - 6, 30);
  pg.addColorStop(0, "rgba(120,236,255,.95)");
  pg.addColorStop(0.55, "rgba(46,150,196,.55)");
  pg.addColorStop(1, "rgba(20,60,90,0)");
  g.fillStyle = pg;
  g.beginPath();
  g.ellipse(pt.x, pt.y - 6, 30, 13, 0, 0, 6.283);
  g.fill();

  // 三圈旋转的光环：静止的洞会被当成装饰
  for (let i = 0; i < 3; i++) {
    const k = ((S.t * 0.8 + i / 3) % 1);
    g.globalAlpha = 0.55 * (1 - k);
    g.strokeStyle = i % 2 ? "#9FE4FF" : "#D8F8FF";
    g.lineWidth = 2;
    g.beginPath();
    g.ellipse(pt.x, pt.y - 6, 10 + k * 22, (10 + k * 22) * 0.42, 0, 0, 6.283);
    g.stroke();
    g.globalAlpha = 1;
  }

  // 洞里飘起来的小火星
  for (let i = 0; i < 3; i++) {
    const k = ((S.t * 0.5 + i / 3) % 1);
    g.globalAlpha = 0.8 * (1 - k);
    g.fillStyle = "#BFF0FF";
    g.beginPath();
    g.arc(pt.x + Math.sin(S.t * 2 + i) * 12, cy - k * 26, 2.2, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
  }
}

/** 深巢的裂缝 —— **这个玩法的送走点，也是"往下"这个动词唯一的实物**。
 *
 * 主线那边送走点是营地：暖黄、箱子落地、兽"回家"。深巢没有"家"，
 * 送走是"把它踹进地缝，它掉到下一层"。所以画面上必须是一道**真的口子**：
 *
 *   · 地面在这里断掉（上沿参差，不是一条直线）
 *   · 断面有厚度（左右两侧各露一截被撕开的土层，亮一档）
 *   · 里面是黑的，但**底下有光**（光在脚下，这是深巢整套场景的规则）
 *
 * **为什么必须画，不能省**：上一版深巢压根没有营地视觉 —— 送走点是一个
 * 看不见的矩形，球滚到那儿就消失。玩家读到的不是"我把它送走了"，
 * 而是"我的球滚到右边不见了"。加上裂缝之后同一段判定就有了因果。
 *
 * 只用 `S.nest` 守门：主线还是营地（不画），一行主线的观感都不动。
 */
function drawChasms(g) {
  if (!S.nest || !CHASMS.length) return;
  const d = (S.nest.depth || 1) | 0;
  for (let i = 0; i < CHASMS.length; i++) {
    const c = CHASMS[i];
    /* 每道缝的参差由**深度 + 序号**定死，不用 S.rng：
       画面每帧重算一次，用玩法随机流会把整局的敌人 AI 打乱
       （这个项目在 addDust 上踩过一次，代价是"150 秒清场"变超时）。 */
    const R = nestRand((d * 6151 + i * 977 + 13) >>> 0);
    /* ---- 可用空间只有 `GROUND_Y(556) → H(600)` 这 44px ----
     *
     * 第一版把缝画成"从 553 往下 104~150"的深梯形，画面上什么都没有：
     * 只有 44px 落在屏幕内，剩下全被裁掉，读出来是"地面下面一块暗影"。
     * 第二版给了对称梯形 + 矩形亮边，出来是**一个木槽**——因为轮廓太规整，
     * 规整的几何在地表上只可能是人造物。
     *
     * 所以缝口必须是**参差折线**（每 13~24px 一个折点），并且左右不对称。
     * 地表裂开这件事，形状本身就是语义，靠渐变和光都补不回来。 */
    const topY = GROUND_Y - 2;
    const botY = H + 40;

    /* 上沿折线：左端固定在 c.x、右端固定在 c.x+c.w，
       中间随机起伏 ±5 —— 两端必须落在缝的边界上，否则缝会"长出去"。 */
    const lip = [{ x: c.x, y: topY }];
    let lx = c.x + 13 + R() * 11;
    while (lx < c.x + c.w - 16) {
      lip.push({ x: lx, y: topY + (R() - 0.46) * 9 });
      lx += 13 + R() * 11;
    }
    lip.push({ x: c.x + c.w, y: topY });

    /* ① 缝体：沿折线下延，底口收窄且**左右不等**（对称的开口像箱子）。 */
    const inL = c.x + c.w * (0.06 + R() * 0.10);
    const inR = c.x + c.w * (0.84 + R() * 0.10);
    g.fillStyle = "#000000";
    g.beginPath();
    g.moveTo(lip[0].x, lip[0].y);
    for (let k = 1; k < lip.length; k++) g.lineTo(lip[k].x, lip[k].y);
    g.lineTo(inR, botY);
    g.lineTo(inL, botY);
    g.closePath();
    g.fill();

    /* ② 内壁受光：光在脚下，越往下越亮。44px 里唯一能表达纵深的手段。 */
    for (const side of [-1, 1]) {
      const ox = side < 0 ? c.x : c.x + c.w;
      const wallG = g.createLinearGradient(0, topY, 0, H);
      wallG.addColorStop(0, rgbaOf(TH.accent, 0));
      wallG.addColorStop(0.6, rgbaOf(TH.accent, 0.18));
      wallG.addColorStop(1, rgbaOf(TH.accent, 0.36));
      g.fillStyle = wallG;
      g.beginPath();
      g.moveTo(ox, topY);
      g.lineTo(ox + side * -8, topY + 2);
      g.lineTo(ox + side * -4, H);
      g.lineTo(ox + side * -14, H);
      g.closePath();
      g.fill();
    }

    /* ③ 两侧地面**翘起来**。地表被顶开的直接证据 ——
       一块斜掀的土板比任何"参差边缘"都强。 */
    for (const side of [-1, 1]) {
      const ox = side < 0 ? c.x : c.x + c.w;
      const dirx = side < 0 ? -1 : 1;
      const lift = 18 + R() * 9;
      const wid = 26 + R() * 12;
      g.fillStyle = "rgba(0,0,0,.40)";
      g.beginPath();
      g.moveTo(ox, topY);
      g.lineTo(ox + dirx * wid * 0.70, topY + 6);
      g.lineTo(ox + dirx * wid * 0.52, topY + 14);
      g.lineTo(ox, topY + 8);
      g.closePath();
      g.fill();
      const slab = g.createLinearGradient(0, topY - lift, 0, topY + 7);
      slab.addColorStop(0, hexDim(TH.grassLight, 1.20));
      slab.addColorStop(0.60, TH.grass);
      slab.addColorStop(1, hexDim(TH.grass, 0.55));
      g.fillStyle = slab;
      g.beginPath();
      g.moveTo(ox, topY + 6);
      g.lineTo(ox + dirx * wid * 0.78, topY - lift * 0.58);
      g.lineTo(ox + dirx * wid, topY - lift);
      g.lineTo(ox + dirx * wid * 0.88, topY - lift + 6);
      g.lineTo(ox + dirx * wid * 0.26, topY + 4);
      g.closePath();
      g.fill();
      g.strokeStyle = rgbaOf(TH.accent, 0.50);
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(ox, topY + 6);
      g.lineTo(ox + dirx * wid * 0.78, topY - lift * 0.58);
      g.lineTo(ox + dirx * wid, topY - lift);
      g.stroke();
    }

    /* ④ 缝口亮边：**沿参差折线描**，不是画矩形。
       这条线是"口子"和"黑影"的分界，但描成直线就会把参差变成"槽的边框"。 */
    g.strokeStyle = rgbaOf(TH.accent, 0.44);
    g.lineWidth = 1.7;
    g.beginPath();
    g.moveTo(lip[0].x, lip[0].y);
    for (let k = 1; k < lip.length; k++) g.lineTo(lip[k].x, lip[k].y);
    g.stroke();

    /* ⑤ 崩出来的碎石：落在口沿上，不落进缝里（缝里是空的）。 */
    for (let k = 0; k < 6; k++) {
      const sx = c.x + 5 + R() * (c.w - 10);
      const sy = topY - 3 - R() * 8;
      const sr = 2 + R() * 3.6;
      g.fillStyle = hexDim(TH.grass, 0.64 + R() * 0.22);
      g.beginPath();
      g.ellipse(sx, sy, sr, sr * 0.72, R() * 3.14, 0, 6.283);
      g.fill();
    }

    /* ⑥ 缝底的光：圆心压在地面底边（H-6），缝延伸出画面、光留在能看见的一侧。 */
    const gl = g.createRadialGradient(
      c.x + c.w * 0.5, H - 6, 5,
      c.x + c.w * 0.5, H - 6, c.w * 1.05);
    gl.addColorStop(0, rgbaOf(TH.accent, 0.44));
    gl.addColorStop(0.40, rgbaOf(TH.accent, 0.17));
    gl.addColorStop(1, rgbaOf(TH.accent, 0));
    g.fillStyle = gl;
    g.globalCompositeOperation = "lighter";
    g.fillRect(c.x - 26, H - 62, c.w + 52, 62);
    g.globalCompositeOperation = "source-over";

    /* ⑦ 缝里飘起来的尘光，"下面有空气在动"。 */
    for (let k = 0; k < 4; k++) {
      const px = c.x + c.w * (0.20 + R() * 0.58);
      const py = topY + 9 + R() * 28;
      g.fillStyle = rgbaOf(TH.accent, 0.24 + R() * 0.18);
      g.beginPath();
      g.arc(px, py, 0.9 + R() * 1.5, 0, 6.283);
      g.fill();
    }
  }
}

function drawStump(g, s) {
  if (s.hp <= 0) {
    // 只剩个桩子印
    g.fillStyle = "rgba(70,50,32,.5)";
    g.beginPath();
    g.ellipse(s.x, s.y - 2, s.w * 0.55, 6, 0, 0, 6.283);
    g.fill();
    return;
  }
  const sx = s.x + (s.shake > 0 ? Math.sin(S.t * 60) * 3 : 0);
  const top = s.y - s.h;

  // 木桩用主题木色。原来写死 #6B4A2E / #4A3220 / #9A7048 ——
  // 第八关是紫夜关，插一根棕色柱子在紫色草地上，是全场最刺眼的一处"外来物"。
  g.fillStyle = TH.wood2;
  rr(g, sx - s.w / 2, top + 5, s.w, s.h - 5, 8);
  g.fill();
  g.strokeStyle = COL.ink;
  g.lineWidth = 3.2;
  g.stroke();

  // 树皮竖纹
  g.strokeStyle = "rgba(44,28,16,.32)";
  g.lineWidth = 1.4;
  for (let i = -1; i <= 1; i++) {
    g.beginPath();
    g.moveTo(sx + i * 12, top + 12);
    g.lineTo(sx + i * 12, s.y - 4);
    g.stroke();
  }

  // 顶面切口：有它才读得出"这是被锯断的树"，没它就只是根棕色柱子
  g.fillStyle = TH.wood3;
  g.beginPath();
  g.ellipse(sx, top + 5, s.w / 2, 8, 0, 0, 6.283);
  g.fill();
  g.strokeStyle = COL.ink;
  g.lineWidth = 2.6;
  g.stroke();
  g.strokeStyle = rgbaOf(TH.wood2, 0.55);
  g.lineWidth = 1.3;
  for (let i = 1; i <= 3; i++) {
    g.beginPath();
    g.ellipse(sx, top + 5, s.w * 0.14 * i, 2.6 * i, 0, 0, 6.283);
    g.stroke();
  }

  // 裂纹：hp 掉一层就裂一道，玩家能看出"再来一下就碎"
  if (s.hp <= 1) {
    g.strokeStyle = "rgba(30,18,10,.85)";
    g.lineWidth = 2;
    g.beginPath();
    g.moveTo(sx - 6, top + 14);
    g.lineTo(sx + 2, top + 34);
    g.lineTo(sx - 4, top + 52);
    g.stroke();
  }
}

/* 脚印的绘制。雪被踩下去 = 比脚下的雪**暗**一点、偏冷一点。
 *
 * 不用纯白高光：雪面本来就是白的，再叠白什么都看不见。
 * 用 #8FA6C4（冷蓝灰）+ alpha 0.3 —— 这是"雪下面的阴影"的颜色，
 * 不是"雪上的脏"，所以不会看起来像泥。
 *
 * 12 秒后消失（雪会慢慢把它填上）。最后 4 秒淡出，
 * 不然会看到脚印"啪"地一下集体不见。 */
function drawPrints(g) {
  if (!TH.snow || S.footprints.length === 0) return;
  for (const f of S.footprints) {
    const age = S.t - f.t;
    if (age > 12) continue;
    const k = age > 8 ? (12 - age) / 4 : 1;
    /* 雪坑的颜色是**雪下面的阴影**，不是"雪上的脏"。
       取 #A8BED8（冷蓝）+ alpha 0.55：和雪面 #F4F8FF 混出来约 (202,216,234)，
       比雪暗 40 级 —— 够看清一串，又不至于看起来像泥点。
       第一版给的是 0.42 / #7E96B8，混出来只暗 26 级，出图上完全找不到；
       更早一版 0.30 更是等于没画。**这是"量出来"而不是"估出来"的**。 */
    g.globalAlpha = 0.55 * k;
    g.fillStyle = "#A8BED8";
    g.beginPath();
    g.ellipse(f.x, f.y - 1, f.w * 0.5, f.h * 0.5, 0, 0, 6.283);
    g.fill();
  }
  g.globalAlpha = 1;
  /* 过期项在这里清，不在 leavePrints 里：两处都清会互相踩，
     而且绘制侧才知道"看不见了"这件事。 */
  for (let i = S.footprints.length - 1; i >= 0; i--) {
    if (S.t - S.footprints[i].t > 12) S.footprints.splice(i, 1);
  }
}

/** 这只敌人此刻正穿在**哪一块**浮空台里（没有就返回 null）。
 *
 *  **为什么需要这个判定**（2026-10-27 用户指出"敌方和横木都叠加了"）：
 *  浮空台是**单向**的 —— `stepBody` 里 `prevY <= p.y + 2 && y >= p.y`，
 *  从下面跳上去能穿过板。板厚 20px，刺毛虫高 28px，所以穿过去的那几帧
 *  必然是"半截身子在板上、半截在板下"。
 *  而敌人统一画在所有地形**之后**，于是那几帧读作"虫子嵌在木头里"。
 *  这不是谁画错了，是**单向平台必须有的那一层遮挡没做**。
 *
 *  但只做遮挡还不够：虫高 28 > 板厚 20，压在板后面会被**整只吃掉**
 *  （出图实测：只剩 4px 黄边 + 一个悬空的箭头），读作"虫凭空消失"，
 *  比嵌在木头里更糟。所以配套要在板顶画一道跟着它走的暗影
 *  （见 drawLevel 里那段），那才是"下面有东西顶着"的线索。
 *
 *  判据用**视觉框**（vw/vh）而不是碰撞盒（w/h）：穿模是眼睛的问题，
