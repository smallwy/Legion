                return "第 " + nx + " 层 · 新词条 " + fresh.map(function (m) { return m.name; }).join("、");
              }
              return "第 " + nx + " 层 · ×" + nextMulti.toFixed(2) + " · " + nextBellyHint();
            })()
          : LEVELS[S.stage + 1].name + " · ×" + nextMulti.toFixed(2) + " · " + nextBellyHint();
        drawBtn(B.cont, hiCont, "继续深入", sub, true);
      } else if (ok && last) {
        /* 最后一屏通了 —— **主按钮不再是"收工"**。
         * 原来这里写"全部通关 / 点这里收工"，按下去 = 存档归零 = 没得玩了。
         * 现在主按钮去挑一屏：27 格全亮、每格带评级，想刷 S 就去刷。
         * 收工还在（右边那个），但它是**选择**，不是唯一出口。 */
        drawBtn(B.cont, hiCont, "挑一屏再走", "27 屏全通了 · 刷评级", true);
      } else {
        drawBtn(B.cont, hiCont, "重打本关", "R 也行", true);
      }
      drawBtn(B.home, hov === 1, "收工回家",
              "+" + Math.round(S.trip.loot * S.trip.multi) + " 果 · 吃完回满", false);

      /* ---- 提示行 ----
         它是"整个画面"的热键，不是卡片内容 —— 所以放卡片**外面**。
         塞在卡里会骑在下边框的圆角上，读起来像"卡片裂了一条缝"。
         颜色也不能沿用卡内的深棕：现在是压在压暗层上，深棕等于没写。 */
      g.textAlign = "center";
      g.fillStyle = "rgba(255,248,232,.66)";
      g.font = "bold 12px " + FONT;
      g.fillText(!ok ? "回车 / 点击  重打   ·   E  收工回家   ·   ESC 回选人"
               : last ? "回车 / 点击  挑一屏   ·   E  收工回家   ·   ESC 回选人"
                      : "回车 / 点击  继续   ·   E  收工（回满力气）   ·   ESC 回选人",
                 cx, cardY + cardH + 22);
    }
  } else if (S.phase === "portals") {
    /* 出征页是**独立一屏**，不叠在门口上：这里要回答的是"去哪儿"，
       还没到"带谁出门"那一步。叠在门口会让人以为已经出门了。 */
    drawGates(g);
    /* 词条看板叠在门之上（模态）。**必须画在 drawGates 之后**：
       它是"下潜前的最后一道确认"，被门压在下面就读成装饰。 */
    drawModBoard(g);
  } else {
    /* 其余阶段（select / play / clear / fail / jump）全部叠在门口场景上。
     * 挑一屏 2026-10-26 删除：它原本是叠在这里的第二层。 */
    drawSelect(g);
  }

  /* 后期合成：泛光 / 分离色调 / 颗粒 / 暗角。
     它必须在 **所有东西之后**（包括 HUD 和结算卡）——
     它盖的是"整帧画面"，不是"场景"。见 drawPost 上方那段说明。 */
  drawPost(g);

  g.restore();
}

/* ---------- 鼠标悬停 / 点击 ---------- */
function hitSelect(mx, my) {
  // 判定和绘制共用 DOOR_SLOTS。上一版卡片布局是两边各算一套坐标，
  // 改布局时一定会错开 —— 这次只留一个来源。
  let best = -1, bestD = 1e9;
  for (let i = 0; i < HEROES.length; i++) {
    const sl = DOOR_SLOTS[i];
    const hw = 48, top = sl.y - 104;
    if (mx >= sl.x - hw && mx <= sl.x + hw && my >= top && my <= sl.y + 12) {
      const dd = Math.abs(mx - sl.x);
      if (dd < bestD) { bestD = dd; best = i; }
    }
  }
  return best;
}

/* 选中一只 → 进入出门演出（不是立刻 beginRun）。
 *
 * **为什么要插这 1.6 秒。** 这段的全部内容是"其余五只的反应"，
 * 也是六只第一次显露出性格的地方。一按就进关，这段就白做了，
 * 玩家永远只知道"我选了猫"，不知道"狗想跟来、兔子耳朵垂下去了"。
 *
 * 1.6 秒是一次性的成本，换来的是一个能被截图、被发群的瞬间 ——
 * 这正是 CR-028 §7.3 里"我们一个都没有"的那个东西。
 */
function pickHero(i) {
  if (S.door.pick >= 0) return;      // 演出中，不重入
  if (i < 0 || i >= HEROES.length) return;
  S.door.pick = i;
  S.door.leaveT = 0;
}

function toLocal(ev) {
  const r = cv.getBoundingClientRect();
  return {
    x: (ev.clientX - r.left) * (W / r.width),
    y: (ev.clientY - r.top) * (H / r.height),
  };
}

cv.addEventListener("mousemove", (ev) => {
  const loc = toLocal(ev);
  // 测试跳关面板是模态的：它在的时候别让下面的 select / 结算按钮跟着亮
  if (S.phase === "jump") { S.jumpHover = jumpHit(loc.x, loc.y); return; }
  if (S.phase === "select") S.hover = hitSelect(loc.x, loc.y);
  if (S.phase === "portals") {
    if (modBoardOpen()) {
      const h = modBoardHit(loc.x, loc.y);
      S.modBoard.hover = h.kind === "skip" ? h.i : -1;
      return;
    }
    S.hoverGate = gateHit(loc.x, loc.y);
  }
  // 结算面板：指着按钮时不推进倒计时 —— 他正在读，别替他做决定
  if (S.phase === "clear" || S.phase === "fail") {
    const B = settleBtns();
    S.hoverBtn = inRect(loc, B.home) ? 1 : inRect(loc, B.cont) ? 0 : -1;
  }
});

cv.addEventListener("mousedown", (ev) => {
  const loc = toLocal(ev);
  if (S.phase === "jump") {
    const i = jumpHit(loc.x, loc.y);
    if (i >= 0) jumpTo(i);
    return;
  }
  if (S.phase === "select") {
    const i = hitSelect(loc.x, loc.y);
    if (i >= 0) pickHero(i);
    return;
  }
  if (S.phase === "portals") {
    /* 看板开着时，它吃掉所有点击 —— 否则会穿透到下面的门，
       出现"点跳过结果进去了"这种最坏的错。 */
    if (modBoardOpen()) {
      const h = modBoardHit(loc.x, loc.y);
      if (h.kind === "close") closeModBoard();
      else if (h.kind === "go") { closeModBoard(); enterNest(); }
      else if (h.kind === "skip") skipModAt(h.i);
      return;
    }
    gateTap(loc.x, loc.y);
    return;
  }
  // 结算界面：只有真的点在按钮上才算数。
  // 上一版是"命中 home 就收工，否则一律 nextLevel" —— 点在卡片外的草地上
  // 也会直接进下一关，玩家会以为"这面板自己跳走了"。
  if (S.phase === "clear" || S.phase === "fail") {
    const B = settleBtns();
    if (inRect(loc, B.home)) { goHome(false); return; }
    if (inRect(loc, B.cont)) { nextLevel(); return; }
  }
});

/* 触屏：接管**出征页**。
 *
 * 为什么必须显式接：这一页的交互全靠 mousedown / mousemove，手机上
 * tap 是靠浏览器合成一对 mousedown + mouseup 才生效的（有延迟，而且
 * hover 那条路根本不存在 —— 出征页的 hover 高亮在手机上从来没显示过）。
 * 出征页是主界面的下一站，连"点一下"都走合成事件等于给触屏修了一半。
 *
 * 为什么只在这个阶段 preventDefault：一旦无条件挡掉默认行为，
 * 其他阶段（选人 / 打斗 / 结算）就连合成的 mousedown 都收不到，
 * 整个游戏在手机上会彻底点不动 —— 本轮不扩大范围，只修坏掉的那一段。
 * （挑一屏与其触屏条件卡 2026-10-26 删除，三星条件原文搬进了预览卡，
 *   触屏在预览卡上直接能读到，不再需要"点一下弹卡"这套中间层。）
 */
cv.addEventListener("touchstart", (ev) => {
  if (S.phase !== "portals") return;
  if (!ev.touches || !ev.touches.length) return;
  ev.preventDefault();
  const t = ev.touches[0];
  const r = cv.getBoundingClientRect();
  const mx = (t.clientX - r.left) * (W / r.width);
  const my = (t.clientY - r.top) * (H / r.height);
  gateTap(mx, my);
}, { passive: false });

/* ---------- 启动 ---------- */
let lastT = 0;
function frame(now) {
  const dt = Math.min(0.034, (now - lastT) / 1000 || 0.016);
  lastT = now;
  tick(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================================
   主界面接入（game.html → grove.html）
   ----------------------------------------------------------------------------
   主界面取代了「门口选人」这一站：从家园点「出门」直接带着人开打，
   打完回主界面播「新伙伴加入」。所以这里只需要三条小钩子：

     ① ?from=home&hero=N&stage=K  → 跳过 select，直接 beginRun(K)
     ② 通关时把关卡索引记到 'pawpack.save'.cleared（去重，主界面按它解锁）
     ③ ESC / 收工 / 全清 → 跳回 game.html

   不带 ?from=home 时行为完全不变，旧的门口流程照旧可用。
   ========================================================================== */
/* 无头沙箱里既没有 location 也没有 URLSearchParams —— 降级成"没有参数"，
   那样 from=home 恒为 false，行为跟改造前一模一样。 */
const URLP = (() => {
  try {
    const q = (typeof location !== "undefined" && location.search) ? location.search : "";
    return new URLSearchParams(q);
  } catch (e) {
    return { get() { return null; } };
  }
})();
const FROM_HOME = URLP.get("from") === "home";

/* 解锁表：通关数 ≥ at 时，这只到家。必须和 Roster.ts 的 PETS[].at 一致。
 *
 * **这张表是按 27 屏重排的，不是按 8 关。** 原来是 0/1/3/5/7/8 —— 打满第 8 屏
 * 就把 6 只全送完，后 19 屏一只都不给，"养成"在第 1 个产地就结束了。
 *
 * 现在的节奏是「每个产地送出 2~3 只，产地收尾前一定有一只」：
 *   苔原 1-9    → 尖耳猫(0) 短尾犬(2) 胖仓鼠(5) 长耳兔(9)
 *   枯木坡 10-18 → 老实牛(14) 影狐(18)
 *   泥沼 19-27  → 已全齐，这里负责把它们练熟
 *
 * rab=9 / fox=18 精确落在两个产地的收尾屏上 —— 那是难度最高的一屏，
 * 通关即到家，奖励和成就同一时刻到账。
 */
const UNLOCK_AT = { cat: 0, dog: 2, ham: 5, rab: 9, ox: 14, fox: 18 };
/* 名字必须和 `HEROES[].name` 逐字一致。
 * 上一版这里写的是「砂糖/年糕/团子…」（家园旧昵称），而场上叫「尖耳猫/短尾犬…」，
 * 于是解锁提示说"年糕到家了"，玩家在院子里找不到"年糕" —— 一个名字两套叫法。 */
const HERO_CN = { cat: "尖耳猫", dog: "短尾犬", ham: "胖仓鼠", rab: "长耳兔", ox: "老实牛", fox: "影狐" };
const HOME_SAVE_KEY = "pawpack.save";
/* 主界面的存档 key。**两边必须互相能看见** —— 见 syncHomeMirror 的说明。 */
const HOME_MIRROR_KEY = "pawpack.save.v1";

function readHomeSave() {
  try { return JSON.parse(localStorage.getItem(HOME_SAVE_KEY) || "{}") || {}; }
  catch (e) { return {}; }
}

/* ---------------------------------------------------------------------------
   把通关数镜像给主界面（`pawpack.save.v1`）
   ---------------------------------------------------------------------------
   病根：**同一份成绩存了两个 key，而且没有任何一方会主动去读对方。**
     · 推球（这里）      `pawpack.save`     cleared 是**数组**（通过了哪几屏）
     · 主界面（SaveData） `pawpack.save.v1`  cleared 是**数字**（通了几屏）
   跨过去原本只有一条通道：`GroveBattle._syncProgressToHome()`，
   而它跑在 **Cocos 战斗里**。于是在浏览器直接打开 grove.html 玩的时候，
   主界面读到的 cleared 恒为 0 —— 玩家打了 10 屏，家里还是只有一只。

   修法不是"再记得调一次同步"，是**让写入点自己带上镜像**：
   凡是改 cleared 的地方都走这里，主界面永远是通的。
   反方向（主界面 → 这里）由 `adoptHomeMirror()` 在启动时补一次。
   --------------------------------------------------------------------------- */
function syncHomeMirror(count) {
  try {
    const raw = localStorage.getItem(HOME_MIRROR_KEY);
    let home = {};
    try { home = raw ? (JSON.parse(raw) || {}) : {}; } catch (e) { home = {}; }
    /* 只增不减：重打老屏不该把主界面的进度拍回去 */
    const prev = typeof home.cleared === "number" ? home.cleared : 0;
    home.cleared = Math.max(prev, count);
    home.v = home.v || 1;
    localStorage.setItem(HOME_MIRROR_KEY, JSON.stringify(home));
  } catch (e) {}
}

/** 主界面的进度比本档新时，把它补进来（老存档 / 只玩过 Cocos 侧的机器）。 */
function adoptHomeMirror() {
  try {
    const raw = localStorage.getItem(HOME_MIRROR_KEY);
    if (!raw) return;
    const home = JSON.parse(raw) || {};
    const n = typeof home.cleared === "number" ? Math.floor(home.cleared) : 0;
    if (n <= 0) return;
    const s = readHomeSave();
    const c = Array.isArray(s.cleared) ? s.cleared.filter(Number.isInteger) : [];
    if (new Set(c).size >= n) return;           // 本档更全，不动它
    /* 主界面只知道"通了几屏"、不知道是哪几屏。按顺序补前 n 屏 ——
       这是唯一能做的假设，而它和"一条线推到黑"的实际路径一致。 */
    for (let i = 0; i < n && i < LEVELS.length; i++) if (!c.includes(i)) c.push(i);
    s.cleared = c; s.v = 1;
    localStorage.setItem(HOME_SAVE_KEY, JSON.stringify(s));
  } catch (e) {}
}

/** 通关记账 + 顺手报一句"谁到家了" */
function recordClear(idx) {
  const s = readHomeSave();
  const before = new Set(Array.isArray(s.cleared) ? s.cleared : []).size;
  const c = Array.isArray(s.cleared) ? s.cleared.filter(Number.isInteger) : [];
  if (!c.includes(idx)) c.push(idx);
  const after = new Set(c).size;
  s.cleared = c; s.v = 1;
  try { localStorage.setItem(HOME_SAVE_KEY, JSON.stringify(s)); } catch (e) {}
  /* 同一刻把数字口径镜像过去。**必须在写盘之后** —— 先镜像后写盘的话，
     中途抛错会留下"主界面说 9 关、推球存档还是 3 屏"的分叉。 */
  syncHomeMirror(after);

  // 只在"这一关刚好跨过阈值"时报，重打老关卡不会重复弹
  const fresh = Object.keys(UNLOCK_AT)
    .filter(id => UNLOCK_AT[id] > before && UNLOCK_AT[id] <= after);
  if (fresh.length && FROM_HOME) {
    showUnlockTip(fresh.map(id => HERO_CN[id]));
  }
  return fresh;   // 返回这次刚好跨过阈值的那几只（测试与外部复查用）
}

/* ---------------------------------------------------------------------------
   本关通关会解锁谁 —— 给 HUD 画"这一关的奖励"用。

   判定口径必须和 recordClear 逐字一致，差一格就会"预告了但没给"：
     recordClear 里  after = 去重后 cleared 的长度 + 1（且只在这一关是新的时才 +1）
     UNLOCK_AT[id] === after  →  这只就是这一关送的

   所以这里用 `done.size + 1`，**不是** `S.progress + 1`。
   后者会把"重打老关"也算成解锁点 —— 玩家重打第 1 关，HUD 挂着
   "通这关 · 年糕到家"，打完什么也没有。挂着不兑现比不挂更伤。

   重打已通关的关直接返回 null：那一只早就到家了。
   --------------------------------------------------------------------------- */
function stageUnlockReward(idx) {
  const s = readHomeSave();
  const done = Array.isArray(s.cleared) ? s.cleared.filter(Number.isInteger) : [];
  if (done.indexOf(idx) >= 0) return null;         // 这关打过了
  const will = new Set(done).size + 1;             // 通关后一共几关
  for (const id in UNLOCK_AT) {
    if (UNLOCK_AT[id] === will) return { id: id, name: HERO_CN[id] || id };
  }
  return null;
}

let unlockTipTimer = 0;
function showUnlockTip(names) {
  const el = document.getElementById("unlockTip");
  if (!el) return;
  el.innerHTML = "<b>✦ 新伙伴到家： " + names.join(" · ") + "</b>" +
                 "<span>回主界面见它</span>";
  el.classList.add("on");
  clearTimeout(unlockTipTimer);
  unlockTipTimer = setTimeout(() => el.classList.remove("on"), 3600);
}

if (FROM_HOME) {
  const btn = document.getElementById("toHome");
  if (btn) btn.style.display = "block";
}

loadProgress();
loadBest();
/* 主界面那边的通关数更全时补进来（老存档 / 只在 Cocos 里玩过的机器）。
 * 必须排在 loadProgress 之后、任何读 cleared 之前 —— recordClear 的
 * "this 关是不是新的"判定依赖它。 */
adoptHomeMirror();
resetRun();

/* 从家园进来：带着指定的人直接开打，不走门口选人 */
if (FROM_HOME) {
  const h = parseInt(URLP.get("hero"), 10);
  if (Number.isInteger(h) && h >= 0 && h < HEROES.length) S.heroIdx = h;

  /* 起始关跟着主界面的"第一个没通的关"走 —— 两边用同一份 cleared，不会打架。
   *
   * **全通是必须单独处理的第三种情况。** 原来的写法是
   *   `let st = 0; for (...) if (!done.has(i)) { st = i; break; }`
   * 全通时循环一次都不命中，`st` 保持初值 0 —— 于是"27 屏打完"和
   * "一关没打"在代码里是同一个状态，玩家每次进战斗都被塞回第一屏。
   * 这不是漏了一句提示，是**那个数字表达不了"没有下一关"**。
   *
   * 现在的三分支：带 ?stage=K → 打 K；还有没通的 → 打第一个没通的；
   * 全通 → 不自动开局，落到出征页（2026-10-26：原为挑一屏，已删）。 */
  const s = readHomeSave();
  const done = new Set(Array.isArray(s.cleared) ? s.cleared : []);
  let st = -1;
  for (let i = 0; i < LEVELS.length; i++) { if (!done.has(i)) { st = i; break; } }

  const q = parseInt(URLP.get("stage"), 10);
  if (Number.isInteger(q) && q >= 0 && q < LEVELS.length) { S.progress = st; beginRun(q); }
  /* 从家园进来：**先到出征页**，由玩家自己挑门。
     原来这里是 beginRun(st)，一键进战斗 —— 快捷，但代价是玩家
     从来不知道"外面不止一条路"。多两次点击换一个选择权，值。 */
  else if (FROM_HOME) { S.progress = st >= 0 ? st : LEVELS.length; openGates(); }
  else if (st >= 0) { S.progress = st; beginRun(st); }
  /* 全新档（无存档、无 URL、非家园）：从第 1 屏开始。
     原来这里是 `progress = LEVELS.length + openPick()` —— 那是为了
     测试时直接拿到全亮的 27 格。挑一屏删了，这个便利项随之取消。 */
  else { S.progress = 0; beginRun(0); }
}

if (typeof requestAnimationFrame === "function") {
  requestAnimationFrame(frame);
} else {
  // 无头环境（冒烟测试 / 离屏渲染）：手动推进
  window.__step = (n, dt) => {
    for (let i = 0; i < (n || 1); i++) { tick(dt || 1 / 60); }
    return render();
  };
}

/* ---------- 调试导出 ---------- */
window.GROVE = {
  S, HEROES, FOES, GOALS, LEVELS, THEMES,
  /* 地面高度是深巢层表（`NEST.LAYERS`）与跳跃可达性断言的共同基准，
     导出它是为了让 `nest-check` 能量"层距 110 vs 跳高 145 余量够不够"，
     而不是在测试里抄一个 556 当常量（抄一次，改 GROUND_Y 时两边就漂了）。 */
  GROUND_Y,
  resetRun, beginRun, tick, render,
  setupLevel, updatePlayer, updateFoe, updateShots, updateBalls,
  /* `pounceLands` 必须导出：它是"跳虫这一跳到底上不上得去"的唯一判据，
     而这件事**截图看不出来** —— 图里只能看到它蹲了或者没蹲，
     看不出"蹲了是不是真能上去"。冒烟要用它逐层对账（预演 vs 实跑）。 */
  pounceLands, foeUnderPlat,
  coatFoe, makeBallFrom, burstBall, spawnShot,
  /* 石球：`hardenBall` 是唯一写入点，两个常量是玩法参数。
     导出是为了让冒烟能验"停 0.7 秒真的硬、超上限真的吐人"——
     这两件截图都看不出来（图里只能看到一块灰的圆）。 */
  hardenBall, STONE_HOLD, STONE_MAX,
  spawnWave, foeFromSpec, updateShocks, hurtPlayer, leavePrints,
  dropChest, dropFrom, DROP_KINDS,
  predictBall, aimFor, ballBudget, checkGoal, rate, goalProgress,
  /* 「加注」的两个真值。导出是为了让冒烟逐个钉死这条曲线的**形状**
     （1~2 只不变、3 只以上爆发）—— 光测"火坑给 7 份"只验了一个点，
     改平方项的起点它照样绿。 */
  holdBonus, bankGain,
  /* 空间语法（N1 地脉 / N2 反射板）。导出这三样是为了让冒烟能验真身：
     "冰真的更快、泥真的更慢、45° 板真的把水平速度转成垂直速度、
     预瞄线和实跑是不是同一条轨迹" —— 这四条截图全都看不出来。 */
  MAT, matAt, reflectStep, pushPowerNow,
  curStage, curGoal, loadLevel, rampAt, nextLevel, saveProgress,
  hitSelect, pickHero, MOODS, DOOR_SLOTS, VOICE,
  goHome, bellyTier, bellyPower, bellyWord, sayLine, finishSay, settleBtns, inRect,
  /* 饱食的两个真值：每屏掉多少、下一屏的力气变化怎么说。
     导出是为了让冒烟验真身，不是验副本。 */
  BELLY_PER_CLEAR, nextBellyHint, bellyCost,
  /* 改造件。真值在主界面存档（`pawpack.save.v1`），这里是只读副本。
     **别在这里再列一遍 `PERK_IDS` / `perkOn`** —— 对象字面量里同名的键
     只有最后一个生效，多写一遍不报错，只会让人以为"这里也导出了"。
     层数那套（PERK_MAX_LV / perkLv）和它们一起在下面那块。 */
  loadPerks,
  /* 调试/测试注入改造件。**两种写法都收**：
       { hotpit: true }  → 1 层（2026-10-27 之前所有测试和截图脚本都这么写，
                            不收的话几十条断言会一起红，而它们验的是别的事）
       { hotpit: 2 }     → 2 层（新的层数口径） */
  _setPerks: (o) => {
    PERKS = Object.create(null);
    for (const k in o) {
      const v = o[k];
      if (v === true) { PERKS[k] = 1; continue; }
      const n = Math.floor(Number(v));
      if (isFinite(n) && n > 0) PERKS[k] = Math.min(n, PERK_MAX_LV);
    }
  },
  recordClear, readHomeSave, FROM_HOME,
  /* 星靶：判定 / 配靶表 / 落盘全导出。冒烟要能直接问
     "第 5 屏挂的是哪三个靶""recordStar 是不是只增不减""集满给多少"——
     这些问不出来的话，81 个靶只能靠截图目测，那不算检查。 */
  judgeStar, recordStar, STAR_CN, STAR_OF_STAGE, STAR_JUDGE,
  STAR_FULL_SHARDS, STAR_FULL_LOGS, STAR_CHAPTER_SHARDS, STAR_CHAPTER_LOGS,
  /* 解锁节奏与分章几何：冒烟要能直接问"第 20 屏属于哪个产地""这屏送谁"。
     问不出来的话，只能靠截图目测，而截图看不出边界到底在 9 还是 10。 */
  stageUnlockReward, chapterOfStage, syncHomeMirror, adoptHomeMirror, UNLOCK_AT, HERO_CN,
  /* 出征页：drawGates 给截图器，gateHit/gateTap/enterGate/openGates
     给冒烟验"点开着的门进当前进度那一屏、点没开的门不静默吞" */
  drawGates, gateHit, gateRect, gateZoomRect, gateTap, enterGate, openGates, GATES,
  /* GATE 是网格/预览的布局常量：冒烟要用它验"槽位 = 玩法数（无空槽）"和
     "预览区不与网格重叠"，写死数字的断言迟早和界面漂移。 */
  GATE,
  /* 深巢地形生成器。**必须导出** —— C1~C6 是纯几何题，截图一张都验不出来；
     设计文档 §6 要求「depth 1..60 × 10 个种子 100% 过校验」，
     这条只能靠 tools/nest-check.js 直接问生成器。 */
  NEST, NEST_LIB, nestRand, nestThemeOf, nestBuildRaw, nestCheck, nestSimpleLevel, nestLevel,
  /* 雾巢（2026-10-27）：断言要读**同一个**雾档/净距常量，不能在测试里抄数字 ——
     抄一次，改雾的档位时两边就漂（POD_CHASM 已经踩过一次）。 */
  NEST_FOG, NEST_BROODS, nestFogTier, nestBroodPool, nestBroodsAt,
  nestFogInit, nestFogTick, updatePods, nestPodBurst, fogSample,
  /* 深巢入口三件：截图脚本要走**真实入口**（enterNest）而不是手工拼关卡 ——
     手工拼能拍出图，真机那条路却可能一直坏着。 */
  enterNest, exitNest, readNestDepth, writeNestDepth,
  /* 词条 + 巢币（2026-10-27）。冒烟要能直接验：
     "第 N 层生效哪几条""关掉之后还剩几条""币按新纪录差额发" ——
     这三条截图完全看不出来，只能拿代码问。 */
  NEST_MODS, nestModsAt, modOn, nestCoinAt,
  /* 词条看板。冒烟要验：列出来的行数 = 已解锁条数、点"跳过"真的扣钱、
     钱不够时**不落账**（这条只能拿代码问，截图上看起来一模一样）。
     截图脚本还要 openModBoard + drawModBoard 才能把面板拍出来。 */
  MOD_BOARD, openModBoard, closeModBoard, modBoardOpen, modBoardRows,
  modBoardHit, skipModAt, drawModBoard, readNestCoins, spendNestCoins,
  /* 改造件层数。`PERK_IDS` 只说明"有哪四件"，层数上限和读法必须一起导出，
     否则冒烟只能验"名字对不对"，验不了"买到第 2 层真的变强了"。 */
  PERK_IDS, PERK_MAX_LV, perkLv, perkOn,
  /* 球寿命的出口。「空心」挂在它上面，而 PUSH_LIFE 有两处读 ——
     不导出的话，冒烟只能验"词条在表里"，验不了"球真的散得更早"。 */
  ballLife,
  FACTIONS,
  /* 测试跳关（F2）。导出是为了**能自动验证**："27 格都点得到、
     点第 N 格真的进第 N 屏、跳关不写存档"这三条只能靠代码问，截图看不出来。
     顺手也给截图脚本用：grove-shot3 可以直接 jumpTo(22) 拍芦苇荡。 */
  openJump, closeJump, jumpTo, jumpCell, jumpHit, drawJump, JUMP,
  /* 右上目标卡的矩形与内部基线。**冒烟必须能读到它** ——
     "卡片不许压住任何落脚面"这条要拿真实几何去量，写死 672/182 的那一次
     就是断言在验旧位置、界面已经压住台子。 */
  GOAL_CARD: Object.assign({}, GOAL_CARD, { rows: GOAL_ROW }),
  // 注入美术图。**只在调试/截图里用**：正片由 GroveBattle 走 resources.load
  // 拿 ImageAsset 再注进来。导出它，截图脚本才能拍出"有 UI 图"的样子 ——
  // 不导出的话 file:// 打开的 grove.html 永远是代码回退图形，截图和真机对不上。
  setArt: groveSetArt,
  /* 外部按键入口 —— 给 Cocos 转发用。
     **不复制任何判断逻辑**，直接把事件喂回 onKeyDown：跳关面板、R 重开、
     Esc 收工、挑一屏的方向键导航全部只有一份实现。在这儿再写一张
     KEY_MAP 就是第二份真值，迟早漂移（这个项目最贵的教训之一）。
     和 DOM 那条路的重复由 onKeyDown 里的 40ms 守卫挡掉。 */
  _key(code, repeat) {
    onKeyDown({ code: code, repeat: !!repeat, preventDefault() {} });
  },

  // 模拟按键：既要置"按住"状态，也要置"本帧按下"的边沿。
  // 只置 keys 的话，atk / dash / jump 这三个读边沿的动作全部不触发 ——
  // 表现是"按了没反应"，但按住方向走是正常的，很容易误判成动作逻辑坏了。
  _press(k, v) {
    if (v === false) { S.keys[k] = false; return; }
    if (!S.keys[k]) S.press[k] = true;
    S.keys[k] = true;
  },
  /** _start(角色, 关卡) —— 省略关卡就用当前这一关 */
  _start(hero, stage) {
    S.heroIdx = hero === undefined ? 0 : hero;
    beginRun(stage === undefined ? S.stage : stage);
  },
};

// PLATS / PITS / STUMPS / CAMP 是 let（换屏会整个替换），
// 导出时必须用 getter，否则外面拿到的是第一屏的旧数组 —— 测试会假通过。
Object.defineProperty(window.GROVE, "PLATS", { get: () => PLATS });
Object.defineProperty(window.GROVE, "PITS",  { get: () => PITS });
Object.defineProperty(window.GROVE, "STUMPS", { get: () => STUMPS });
Object.defineProperty(window.GROVE, "CAMP",  { get: () => CAMP });
/* 送走点：主线是 `[CAMP]` 一项，深巢是多道裂缝。
   **必须导出** —— "球滚进缝里到底算不算送走"只能靠代码问，
   而这条错了的表现是"清场目标永远差几只"，截图上看不出来。 */
Object.defineProperty(window.GROVE, "CHASMS", { get: () => CHASMS });
Object.defineProperty(window.GROVE, "WAVES", { get: () => WAVES });
Object.defineProperty(window.GROVE, "PLAYER_SPAWN", { get: () => PLAYER_SPAWN });
Object.defineProperty(window.GROVE, "RAMPS", { get: () => RAMPS });
Object.defineProperty(window.GROVE, "BOUNCERS", { get: () => BOUNCERS });
Object.defineProperty(window.GROVE, "PORTALS", { get: () => PORTALS });
Object.defineProperty(window.GROVE, "GROUNDS", { get: () => GROUNDS });
Object.defineProperty(window.GROVE, "REFLECTS", { get: () => REFLECTS });
Object.defineProperty(window.GROVE, "TOUR", { get: () => TOUR });
/* 场景族必须导出：冒烟要断言"27 屏分成了几族、每族几屏"，
   以及"没有一族是空的"。不导出就只能靠截图目视，那不算检查。 */
Object.defineProperty(window.GROVE, "SCAPE", { get: () => SCAPE });
/* ★ 这里**必须**用 Object.defineProperty，不能用 `window.GROVE.X = ...`。
   extract_grove_runtime.py 只改写 `Object.defineProperty(window.GROVE, ...)`
   这一种模式；普通的属性赋值改写成 `GROVE.X`，而 TS 模块里没有 window ——
   运行时体检当场报 "Cannot set properties of undefined"。
   （2026-10-24 踩过一次：冒烟全绿、体检红，因为冒烟跑的是原始 html。） */
Object.defineProperty(window.GROVE, "SCAPE_OF_THEME", { get: () => SCAPE_OF_THEME });
Object.defineProperty(window.GROVE, "FG_SIDE", { get: () => FG_SIDE });
Object.defineProperty(window.GROVE, "loadStats", { get: () => loadStats });
Object.defineProperty(window.GROVE, "rankAward", { get: () => rankAward });
Object.defineProperty(window.GROVE, "recordStats", { get: () => recordStats });
Object.defineProperty(window.GROVE, "STATS_KEY", { get: () => STATS_KEY });
Object.defineProperty(window.GROVE, "FG_TOP", { get: () => 504 });
/* 场景族的绘制入口也要导出：冒烟要断言"三族真的各有自己的函数"，
   而不是"三个名字指向同一张画"。 */
Object.defineProperty(window.GROVE, "fgBlocked", { get: () => fgBlocked });
Object.defineProperty(window.GROVE, "render", { get: () => render });
/* 测试入口：**只画前景层**，返回这一屏真正落下去的每个高元素的 [种类, 顶端 y, x]。
   为什么不走 render：render 还要跑尘土/角色/粒子，桩里容易崩在无关的地方，
   崩了就只能 try/catch 吞掉 —— 而吞掉的测试等于没测。
   drawForeground 就是渲染管线里画前景的那个函数本身，不是复制品。 */
Object.defineProperty(window.GROVE, "fgProbe", {
  get: () => () => { S._fgAudit = []; drawForeground(ctx); return S._fgAudit.slice(); },
});
Object.defineProperty(window.GROVE, "drawCliffs", { get: () => drawCliffs });
Object.defineProperty(window.GROVE, "drawReeds", { get: () => drawReeds });
Object.defineProperty(window.GROVE, "drawDeadTree", { get: () => drawDeadTree });
Object.defineProperty(window.GROVE, "drawBgTree", { get: () => drawBgTree });
Object.defineProperty(window.GROVE, "bgTreeRow", { get: () => bgTreeRow });
Object.defineProperty(window.GROVE, "drawFgRocks", { get: () => drawFgRocks });
Object.defineProperty(window.GROVE, "drawFgReeds", { get: () => drawFgReeds });
Object.defineProperty(window.GROVE, "drawFgPebble", { get: () => drawFgPebble });
/* BOSS 流派：冒烟要断言"三个产地的动作表不一样"、"断台真能碎"、
   "泥潮真的改了材质"。这些不导出就只能截图目视。 */
Object.defineProperty(window.GROVE, "BOSS_STYLE", { get: () => BOSS_STYLE });
Object.defineProperty(window.GROVE, "BROKEN", { get: () => BROKEN });
Object.defineProperty(window.GROVE, "isBroken", { get: () => isBroken });
Object.defineProperty(window.GROVE, "crackPlat", { get: () => crackPlat });
Object.defineProperty(window.GROVE, "mudRise", { get: () => mudRise });
/* 选目标要和"落手"分开导出：冒烟要证明**画的就是砸的**
   （预览锁定同一块），就必须能单独调到"只选不打"的那一半。 */
Object.defineProperty(window.GROVE, "crackTarget", { get: () => crackTarget });
/* 造一只怪出来。截图器要拍 BOSS 的预告，而 BOSS 只在最后一波才刷 ——
   靠机器人打到最后一波去拍照，拍出来的是什么全看运气。
   **能直接造，就不要靠"跑到那一步"**。 */
Object.defineProperty(window.GROVE, "foeFromSpec", { get: () => foeFromSpec });
/* 糊敌人是"造球"唯一的入口。额度到底拦不拦得住，只能从这里打进去验 ——
   看 `ballBudget()` 的返回值证明不了任何事，它只是个数字。 */
Object.defineProperty(window.GROVE, "coatFoe", { get: () => coatFoe });
Object.defineProperty(window.GROVE, "mudSpot", { get: () => mudSpot });
Object.defineProperty(window.GROVE, "drawCrackMark", { get: () => drawCrackMark });
Object.defineProperty(window.GROVE, "drawMudWarn", { get: () => drawMudWarn });
Object.defineProperty(window.GROVE, "drawMudMound", { get: () => drawMudMound });
Object.defineProperty(window.GROVE, "drawBossMarks", { get: () => drawBossMarks });
/* PUSH_BASE / PUSH_RUN 必须导出：冒烟要按"满助跑 = 基准 ×1.95"算力度，
   而探针/测试里手写 1209 就是硬编码 —— 哪天基准一调，测试量的还是旧数。 */
Object.defineProperty(window.GROVE, "PUSH_BASE", { get: () => PUSH_BASE });
Object.defineProperty(window.GROVE, "PUSH_RUN", { get: () => PUSH_RUN });
/* 跳虫的四个数。导出是为了让冒烟能验"跳得够不够高、横移够不够远"这两件事 ——
   它们全都是**算出来才能知道对不对**的，截图只能看出"它在跳"。
   跳高由 vy 和 GRAV 共同决定，而 GRAV 又同时被玩家、球、所有敌人共用，
   所以在测试里抄一个 123 是危险的：GRAV 一改，那个数就悄悄错了。 */
Object.defineProperty(window.GROVE, "JUMPER_VY", { get: () => JUMPER_VY });
Object.defineProperty(window.GROVE, "JUMPER_PUSH", { get: () => JUMPER_PUSH });
Object.defineProperty(window.GROVE, "JUMPER_CD", { get: () => JUMPER_CD });
Object.defineProperty(window.GROVE, "JUMPER_LAND", { get: () => JUMPER_LAND });
Object.defineProperty(window.GROVE, "GRAV", { get: () => GRAV });
// 结算卡的几何：按钮/文字都按它排，冒烟断言要拿它判"按钮有没有掉出卡片"，
// 写死 544 那种事干过一次 —— 卡片一加高，断言就变成在验一个不存在的尺寸。
window.GROVE.CARD = { w: CARD_W, y: CARD_Y, h: CARD_H, btnY: BTN_Y, btnH: BTN_H, btnW: BTN_W };
window.GROVE.GROUND_Y = GROUND_Y;
/* **必须是 getter**：WALL_L / WALL_R 现在是变量（深巢 640 井会改它们），
   写成 `window.GROVE.WALL_L = WALL_L` 记的是加载那一刻的快照 ——
   测试里读到的永远是 26/934，深巢相关断言等于在验一个不存在的东西。 */
Object.defineProperty(window.GROVE, "WALL_L", { get: () => WALL_L });
Object.defineProperty(window.GROVE, "WALL_R", { get: () => WALL_R });
</script>
