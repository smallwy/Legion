  g.stroke();

  // 拱门营地：终点
  const cx2 = x + w * 0.82, cyc = gy - 16;
  g.fillStyle = "rgba(240,200,90,.14)";
  g.beginPath(); g.arc(cx2, cyc, 24, 0, 6.283); g.fill();
  g.strokeStyle = "#E8C878";
  g.lineWidth = 3;
  g.beginPath();
  g.moveTo(cx2 - 10, cyc + 13);
  g.lineTo(cx2 - 10, cyc - 2);
  g.quadraticCurveTo(cx2, cyc - 14, cx2 + 10, cyc - 2);
  g.lineTo(cx2 + 10, cyc + 13);
  g.stroke();
}

/** 深巢的概念图：**简笔版**。只留三个符号：井口 → 逐层变暗 → 向下箭头。
 *  「越往下越深」用三层渐暗的横线表达（这一条比画多少细节都值钱，
 *  第一版精细图里它也是唯一被保下来的特征）。 */
function drawNestArt(g, x, y, w, h) {
  const bg = g.createLinearGradient(x, y, x, y + h);
  bg.addColorStop(0, "#241E2E");
  bg.addColorStop(0.6, "#171221");
  bg.addColorStop(1, "#0A0812");
  g.fillStyle = bg;
  g.fillRect(x, y, w, h);

  // 井口：一道椭圆就是「往下钻的洞」
  g.fillStyle = "rgba(10,8,18,.85)";
  g.beginPath(); g.ellipse(x + w * 0.5, y + 26, w * 0.30, 13, 0, 0, 6.283); g.fill();
  g.strokeStyle = "rgba(180,160,210,.45)";
  g.lineWidth = 2;
  g.beginPath(); g.ellipse(x + w * 0.5, y + 26, w * 0.30, 13, 0, 0, 6.283); g.stroke();

  /* 三层横线，每层比上一层暗 —— 深度感全靠它 */
  for (let i = 0; i < 3; i++) {
    const ly = y + 58 + i * 17;
    const dim = 1 - i * 0.18;
    g.fillStyle = "rgba(120,100,150," + (0.50 * dim).toFixed(3) + ")";
    g.fillRect(x + 40 + i * 14, ly, w - 80 - i * 28, 2);
  }

  // 向下箭头
  g.strokeStyle = "rgba(240,200,90,.55)";
  g.lineWidth = 2.4;
  g.beginPath();
  g.moveTo(x + w * 0.5, y + 48);
  g.lineTo(x + w * 0.5, y + h - 22);
  g.stroke();
  g.beginPath();
  g.moveTo(x + w * 0.5 - 7, y + h - 29);
  g.lineTo(x + w * 0.5, y + h - 21);
  g.lineTo(x + w * 0.5 + 7, y + h - 29);
  g.stroke();
}

/** 出征界面 */
/** 立绘 cover 绘制：按比例铺满目标框，多出的从中心裁掉。
 *  两张立绘都是 16:9、目标框几乎 16:9，实际裁切不到 1%，
 *  所以不必给每个用途单独切一张图。 */
function drawArtCover(g, img, x, y, w, h) {
  const iw = img.width || 1, ih = img.height || 1;
  const ir = iw / ih, br = w / h;
  let sw = iw, sh = ih, sx = 0, sy = 0;
  if (ir > br) { sw = ih * br; sx = (iw - sw) / 2; }
  else { sh = iw / br; sy = (ih - sh) / 2; }
  g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

/** 一格玩法卡的底图：有立绘用立绘，没有就回退简笔。
 *  **回退必须看得见** —— 静默变空白是这个项目反复栽的坑（美术没解包 /
 *  路径错位时，玩家只会看到一块黑，而没人知道是资源问题）。 */
function drawGateArt(g, p, x, y, w, h) {
  const img = p.art ? ART[p.art] : null;
  g.save();
  rr(g, x, y, w, h, 12);
  g.clip();
  if (img) drawArtCover(g, img, x, y, w, h);
  else if (p.id === "trail") drawTrailArt(g, x, y, w, h);
  else if (p.id === "nest") drawNestArt(g, x, y, w, h);
  else { g.fillStyle = "#1A2E2A"; g.fillRect(x, y, w, h); }
  /* 没开放的玩法只**在图上**盖一层薄纱，不整张卡压暗 ——
     整卡压暗后立绘变成一团黑，这张画就白出了；而文字压暗会让
     "深巢无尽"四个字都读不出来，玩家不知道这条路后面是什么。
     纱只给 16%：深巢那张立绘本就是暗紫，30% 时在 208 宽的小卡里
     只剩几颗蘑菇点，等于没画。 */
  if (!p.open) {
    g.fillStyle = "rgba(8,14,20,.16)";
    g.fillRect(x, y, w, h);
  }
  g.restore();
}

/** 出征页每扇门的副行。一个函数管两扇门 —— 写在绘制里就会变成
 *  "古道报第 N 屏、深巢也报第 N 屏"这种两条轴混用一个数字的错。 */
/** 一行"这张卡现在是什么状态"。
 *  主线报「第 N 屏 · 产地」—— 产地名帮玩家建立方位（"我在枯木坡"比
 *  "我在第 15 屏"更像人话），且不报总数（不暴露最大关卡）。
 *  深巢报「最深 N 层」—— 它的"我在哪"是深度，不是屏序。
 *  一个函数管两扇门：散在绘制里就会变成"深巢也报第 N 屏"这种两轴混用。 */
function gateSubLine(p) {
  if (p.id === "nest") {
    const d = readNestDepth();
    return d > 0 ? "最深 " + d + " 层" : "没下潜过";
  }
  if (!(S.progress > 0)) return "还没出发";
  const cur = clamp(S.progress, 0, LEVELS.length - 1);
  return "第 " + (cur + 1) + " 屏 · " + chapterOfStage(cur).name;
}

/** 卡内第三行。主线 = 三颗星的**条件原文**，深巢 = 两条规则。
 *  挑一屏（2026-10-26 整页删除）之后，出征页是出门前**唯一**能读到
 *  "这一屏三颗星怎么拿"的地方 —— 删预览卡不能把这条信息一起删掉，
 *  所以随卡一起搬进来，而不是跟着预览卡一起消失。 */
function gateDetailLine(p) {
  if (!p.open) return "";
  if (p.id === "nest") return "每层都不一样 · 打不过只丢这一层";
  const cur = clamp(S.progress, 0, LEVELS.length - 1);
  const row = STAR_OF_STAGE[cur] || [];
  if (!row.length) return "";
  const bits = (S.starBits && S.starBits[cur]) || [];
  return row.map(function (k, i) {
    return (bits[i] === 1 ? "\u2713" : "\u25cb") + (STAR_CN[k] || k);
  }).join("  ");
}

/** 画一张玩法卡。focused = 悬停/选中（已放大），withDetail = 卡高够不够放第三行。
 *  抽成函数是因为现在要画两遍（先画非焦点、再画焦点），两处各写一份必然漂移。 */
function drawGateCard(g, p, r, focused, withDetail, FONT) {
  drawGateArt(g, p, r.x, r.y, r.w, r.h);

  /* 字号跟卡宽分两档：195 宽的卡用 20px 名字（4 字 80px，内宽 155 其实放得下），
     但配 13.5 的副行会挤成一片；降到 16/11.5 之后三行的呼吸才一致。 */
  const small = r.w < 240;
  /* 第三档：120 高的卡（4 个以上玩法）文字块必须再压一档，否则
     15+14+11 的行高会把立绘挤到不足 40px。 */
  const tiny = r.h < 135;
  const nameSize = tiny ? 15 : (small ? 16 : 20);
  const subSize = tiny ? 11 : (small ? 11.5 : 13.5);
  const detSize = 11.5;
  const padX = small ? 14 : 20;

  /* 文字块**从底往上排**，再按排出来的实际高度反推压暗带到哪儿为止。
     之前的写法是"先画固定 96 高的渐变，再把字放在 h-58 / h-34 / h-14"——
     第一版就这么栽的：h-58 落在渐变 alpha 只有 0.5 的地方，第三行直接压在
     苔原那张的亮草地和小熊身上，"—不碰火坑"根本读不出来。
     自下而上排 + 实心带，任何背景都是 0.88，不靠蒙。 */
  let by = r.y + r.h - 14;                                  // 最后一行基线
  const detY = withDetail ? by : 0;
  if (withDetail) by -= Math.round(detSize + 13);           // 第三行 → 副行
  const subY = by;
  const nameY = by - Math.round(nameSize * 0.95);
  const bandTop = nameY - Math.round(nameSize * 0.92) - 12;

  /* 上过渡 16px + 实心带：直上直下的一道分界看着像贴上去的字幕条，
     16px 足够把这条界线化掉，又不会让亮图重新透出来。 */
  const bg = "rgba(10,20,18,.88)";
  const fade = g.createLinearGradient(0, bandTop - 16, 0, bandTop);
  fade.addColorStop(0, "rgba(10,20,18,0)");
  fade.addColorStop(1, bg);
  g.fillStyle = fade;
  g.fillRect(r.x, bandTop - 16, r.w, 16);
  g.fillStyle = bg;
  g.fillRect(r.x, bandTop, r.w, r.y + r.h - bandTop);

  g.textAlign = "left";

  if (withDetail) {
    const det = gateDetailLine(p);
    if (det) {
      g.fillStyle = p.open ? "rgba(196,216,196,.78)" : "rgba(240,200,120,.78)";
      g.font = detSize + "px " + FONT;
      g.fillText(fitText(g, det, r.w - padX * 2), r.x + padX, detY);
    }
  }

  g.fillStyle = "#F2F7EE";
  g.font = "bold " + nameSize + "px " + FONT;
  g.fillText(fitText(g, p.name, r.w - padX * 2), r.x + padX, nameY);

  g.fillStyle = p.open ? "rgba(200,222,200,.82)" : "rgba(240,200,120,.88)";
  g.font = "bold " + subSize + "px " + FONT;
  g.fillText(p.open ? gateSubLine(p) : "即将开放", r.x + padX, subY);

  // 描边最后画：压在图上，放大那张一眼看得出来
  g.strokeStyle = focused ? "#F0A81E" : "rgba(160,200,180,.30)";
  g.lineWidth = focused ? 2.4 : 1.4;
  rr(g, r.x, r.y, r.w, r.h, 12);
  g.stroke();
}

/* ---------------------------------------------------------------------------
   词条看板（出征页，2026-10-27）

   它是深巢**唯一的决策点**。没有它，词条就只是"越深越难"的另一种说法 ——
   而"有选择"正是这个项目五个入口最缺的东西（审计原话）。
   打开时机：点深巢门时，如果已经解锁了词条，先弹这个，不直接下潜。

   为什么跳过是"这一趟"而不是永久：永久关掉等于把深层买回浅层的难度，
   词条就不再是"贪的代价"，深巢又变回"一路往下没有变化"。
   --------------------------------------------------------------------------- */

/* 版面是**按"最多 6 行"反推的**，不是拍脑袋：6 × 50 = 300 的行区，
   上下再各留标题/底栏 70 —— 所以面板高 486。
   第一版给的是 h = 428，6 行排到 478，而底栏的"巢币"和「出发」按钮
   正好落在 452~496 —— **压在第 5、6 行上**（截图里"巢币 240"叠在
   "空心"那一行上）。行区高度必须由词条表的最大条数决定，
   以后加第 7 条词条，这里要跟着加 50。 */
const MOD_BOARD = {
  x: 148, y: 56, w: 664, h: 486,
  listTop: 152, rowH: 50,
  btnW: 112, btnH: 34,
};

function modBoardOpen() { return !!(S.modBoard && S.modBoard.open); }

/** 下一次下潜的起点深度 = 历史最深 + 1。
 *  用 `readNestDepth()` 而不是"当前层"：看板开在出征页，那时没有当前层。 */
function modBoardNextDepth() {
  return Math.max(1, readNestDepth() + 1);
}

/** 看板上的行（只列**已解锁**的词条；没到深度不占版面）。
 *  几何只有这一份 —— 绘制和命中共用，两处各算一套必然错开。 */
function modBoardRows() {
  const next = modBoardNextDepth();
  const skip = S.nestSkip || [];
  const B = MOD_BOARD;
  const rows = [];
  let y = B.listTop;
  for (const m of NEST_MODS) {
    if (next < m.depth) continue;
    rows.push({
      mod: m,
      off: skip.indexOf(m.id) >= 0,
      y: y,
      btn: { x: B.x + B.w - 26 - B.btnW, y: y + 6, w: B.btnW, h: B.btnH },
    });
    y += B.rowH;
  }
  const go = { x: W / 2 - 92, y: B.y + B.h - 62, w: 184, h: 44 };
  const close = { x: B.x + B.w - 44, y: B.y + 16, w: 28, h: 28 };
  return { next: next, rows: rows, go: go, close: close, bottom: y };
}

function openModBoard() {
  S.modBoard = { open: true, hover: -1, say: "", sayT: 0 };
}

function closeModBoard() {
  if (S.modBoard) S.modBoard.open = false;
}

/** 花巢币让某条词条这一趟不生效。
 *  **先扣钱再落账**：反过来的话，扣款失败（存档写不进去）会留下
 *  "钱没扣、词条却跳过了"的记录，玩家等于白捡一次。 */
function skipModAt(i) {
  const R = modBoardRows();
  const row = R.rows[i];
  if (!row || row.off) return;
  const m = row.mod;
  if (!spendNestCoins(m.skip)) {
    /* 文案里**不再重复"巢币"**：它紧挨着左下的"巢币 12"，
       写成"巢币 12  巢币不够 · 还差 28"看着像两笔钱。
       **也不带"怎么赚"那半句**（2026-10-27 截图救回）：底栏从"巢币"
       到"出发"按钮之间只有 124px，「还差 28 枚 · 再往下潜就能赚到」
       的后半截正好钻到黄按钮底下，读作"再往下潜就[出发]"。
       怎么赚这件事改成写在面板副标题里 —— 那行是常驻的，
       比一个 2.2 秒就消失的提示更适合放规则。 */
    S.modBoard.say = "还差 " + Math.max(0, m.skip - readNestCoins()) + " 枚";
    S.modBoard.sayT = 2.2;
    return;
  }
  if (!Array.isArray(S.nestSkip)) S.nestSkip = [];
  S.nestSkip.push(m.id);
  S.modBoard.say = "「" + m.name + "」这一趟不生效";
  S.modBoard.sayT = 2.0;
}

function drawModBoard(g) {
  if (!modBoardOpen()) return;
  const FONT = "'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  const B = MOD_BOARD;
  const R = modBoardRows();

  g.save();
  g.fillStyle = "rgba(10,14,20,.74)";
  g.fillRect(0, 0, W, H);

  rr(g, B.x, B.y, B.w, B.h, 20);
  g.fillStyle = "rgba(26,32,42,.98)";
  g.fill();
  g.strokeStyle = "rgba(255,255,255,.12)";
  g.lineWidth = 1;
  rr(g, B.x, B.y, B.w, B.h, 20);
  g.stroke();

  g.textAlign = "left";
  g.textBaseline = "alphabetic";
  g.fillStyle = "#F2F6EA";
  g.font = "bold 20px " + FONT;
  g.fillText("下潜之前 · 词条", B.x + 30, B.y + 44);

  /* 副标题要同时说清三件事：什么时候开始生效 / 巢币从哪来 / 巢币能干什么。
     "怎么赚"必须留在这里 —— 底栏那句"还差 N 枚"只有 124px 宽，
     塞不下解释，而规则放在 2.2 秒的提示里等于没写。 */
  g.fillStyle = "rgba(176,192,208,.82)";
  g.font = "13px " + FONT;
  g.fillText("从第 " + R.next + " 层起一直生效，越深越多。巢币只按新潜到的深度发放，花它跳过一条。",
             B.x + 30, B.y + 70);

  /* 关闭叉：右上角一个 ×。**必须有显式的出口** —— 只靠"点遮罩关闭"
     在触屏上等于关不掉（触屏那条路不会派发遮罩点击）。 */
  const c = R.close;
  g.strokeStyle = "rgba(200,212,224,.55)";
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(c.x + 8, c.y + 8); g.lineTo(c.x + c.w - 8, c.y + c.h - 8);
  g.moveTo(c.x + c.w - 8, c.y + 8); g.lineTo(c.x + 8, c.y + c.h - 8);
  g.stroke();

  if (!R.rows.length) {
    g.fillStyle = "rgba(180,196,212,.7)";
    g.font = "14px " + FONT;
    g.fillText("还没下到第 5 层，暂时没有词条。", B.x + 30, B.listTop + 26);
  }

  for (let i = 0; i < R.rows.length; i++) {
    const row = R.rows[i];
    const m = row.mod;
    const hot = S.modBoard.hover === i;
    const cy = row.y + MOD_BOARD.rowH / 2;

    if (hot && !row.off) {
      rr(g, B.x + 18, row.y + 2, B.w - 36, MOD_BOARD.rowH - 6, 10);
      g.fillStyle = "rgba(255,255,255,.05)";
      g.fill();
    }

    g.textAlign = "left";
    g.fillStyle = row.off ? "rgba(150,164,178,.45)" : (hot ? "#FFE9B0" : "#E8EFF6");
    g.font = "bold 16px " + FONT;
    g.fillText(m.name, B.x + 34, cy + 6);

    g.fillStyle = row.off ? "rgba(140,154,168,.38)" : "rgba(176,192,208,.78)";
    g.font = "13px " + FONT;
    g.fillText(m.desc, B.x + 110, cy + 6);

    /* 深度角标：告诉他"这条是什么时候开始跟着你的" */
    g.textAlign = "right";
    g.fillStyle = row.off ? "rgba(140,154,168,.32)" : "rgba(150,168,186,.55)";
    g.font = "12px " + FONT;
    g.fillText("第 " + m.depth + " 层", row.btn.x - 16, cy + 5);

    const b = row.btn;
    if (row.off) {
      rr(g, b.x, b.y, b.w, b.h, b.h / 2);
      g.strokeStyle = "rgba(150,164,178,.28)";
      g.lineWidth = 1;
      rr(g, b.x, b.y, b.w, b.h, b.h / 2);
      g.stroke();
      g.textAlign = "center";
      g.fillStyle = "rgba(150,164,178,.55)";
      g.font = "13px " + FONT;
      g.fillText("这一趟已关", b.x + b.w / 2, b.y + b.h / 2 + 5);
    } else {
      rr(g, b.x, b.y, b.w, b.h, b.h / 2);
      g.fillStyle = hot ? "rgba(255,206,86,.20)" : "rgba(255,255,255,.07)";
      g.fill();
      g.strokeStyle = hot ? "rgba(255,206,86,.85)" : "rgba(255,255,255,.22)";
      g.lineWidth = 1.4;
      rr(g, b.x, b.y, b.w, b.h, b.h / 2);
      g.stroke();
      g.textAlign = "center";
      g.fillStyle = hot ? "#FFCE56" : "rgba(232,239,246,.86)";
      g.font = "bold 13px " + FONT;
      g.fillText("跳过 · " + m.skip, b.x + b.w / 2, b.y + b.h / 2 + 5);
    }
  }

  /* 底部：余额 + 出发 */
  const coins = readNestCoins();
  g.textAlign = "left";
  g.fillStyle = "rgba(255,206,86,.9)";
  g.font = "bold 14px " + FONT;
  g.fillText("巢币 " + coins, B.x + 30, R.go.y + 28);

  if (S.modBoard.say && S.modBoard.sayT > 0) {
    /* 兜底测宽：底栏这一行从「巢币 xxx」到「出发」按钮只剩百来像素，
       文案一长就被黄按钮吃掉半截（"再往下潜就"那种）。放不下就整体
       缩到 12px（用户定的字号下限），还放不下就不画 —— 画一条读不全的
       字比不画更糟，它会让人以为按钮文字串了行。 */
    const x0 = B.x + 104;
    const maxW = R.go.x - 12 - x0;
    if (maxW > 40) {
      let txt = S.modBoard.say;
      g.font = "13px " + FONT;
      let w = g.measureText(txt).width;
      if (w > maxW) { g.font = "12px " + FONT; w = g.measureText(txt).width; }
      if (w <= maxW) {
        g.fillStyle = "rgba(255,233,176,.92)";
        g.fillText(txt, x0, R.go.y + 28);
      }
    }
  }

  const go = R.go;
  rr(g, go.x, go.y, go.w, go.h, go.h / 2);
  g.fillStyle = "#FFCE56";
  g.fill();
  g.textAlign = "center";
  g.fillStyle = "#4A2E06";
  g.font = "bold 16px " + FONT;
  g.fillText("出发", go.x + go.w / 2, go.y + go.h / 2 + 6);

  g.restore();
}

/** 看板命中。**返回** 'skip' / 'go' / 'close' / ''。 */
function modBoardHit(mx, my) {
  if (!modBoardOpen()) return { kind: "", i: -1 };
  const R = modBoardRows();
  const inB = (b) => mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h;
  if (inB(R.close)) return { kind: "close", i: -1 };
  if (inB(R.go)) return { kind: "go", i: -1 };
  for (let i = 0; i < R.rows.length; i++) {
    if (inB(R.rows[i].btn)) return { kind: "skip", i: i };
  }
  return { kind: "", i: -1 };
}

function drawGates(g) {
  const FONT = "'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  const HZ = 470;
  /* 第四参 false = 不画月亮。月亮 + 光晕占 y 20–168，之前卡要跟它抢顶边
     才只能卡在 176；现在卡是垂直居中的，"让开月亮"这个理由已经不成立，
     但出征页保留不画 —— 没有月亮的夜空更接近"出发前一晚"，选人页仍画。 */
  drawNightSky(g, S.t, HZ, false);
  g.fillStyle = "#0C1F1A";
  g.fillRect(0, HZ, W, H - HZ);

  /* 「出征」大标题已删（2026-10-26 第四次，用户：「出征去掉啊」）。
     标题只是给这一页起名，而这件事底部操作提示已经做了。 */

  /* 焦点 = **只有指针真的停在某张卡上**（`hoverGate`，-1 = 没停在任何卡）。
     2026-10-26 第七次（用户：「一进去不放大呀 鼠标放上去才放大 你怎么擅作
     主张呢」）：之前这里写了 `hoverGate >= 0 ? hoverGate : gateCur` 的兜底，
     意思是"指针不在，就当你选中 gateCur 那张"，结果一进出征页第一张就是
     放大态 —— 还没动鼠标画面就已经"替你选好了"。
     放大是个**反馈**，不是状态展示：它回答"我现在指着的这张是什么"。
     没有指针就没有问题，也就不该有答案。键盘 ←→ 是主动操作，所以那边
     自己把 hoverGate 写上（见 bindKeys），不靠这里兜底。 */
  const focus = S.hoverGate;
  const withDetail = GATE.h >= GATE.detailMinH;

  /* 画两遍：先所有非焦点，再焦点。悬停放大会盖住邻居，绘制顺序决定谁在上 ——
     一遍画完再补焦点，会让焦点那张被后画的邻居切掉一条边。 */
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < GATE.slots; i++) {
      const on = i === focus;
      if ((pass === 0) === on) continue;
      const p = GATES[i];
      if (!p) continue;
      drawGateCard(g, p, on ? gateZoomRect(i) : gateRect(i), on, withDetail, FONT);
    }
  }

  /* 提示条（点没开放的门时）。位置在**底部操作提示正上方**中央 ——
     卡的底最多到 400（悬停放大后的 2 张卡），496 谁也不挨。 */
  if (S.gateTip.life > 0) {
    const a = clamp(S.gateTip.life / 0.4, 0, 1) * clamp((2.4 - S.gateTip.life) / 0.14, 0, 1);
    g.globalAlpha = a;
    g.font = "bold 14px " + FONT;
    const tw2 = g.measureText(S.gateTip.txt).width;
    const bw2 = tw2 + 44;
    g.fillStyle = "rgba(240,200,90,.14)";
    rr(g, W / 2 - bw2 / 2, 496, bw2, 32, 16);
    g.fill();
    g.textAlign = "center";
    g.fillStyle = "#F0C060";
    g.fillText(S.gateTip.txt, W / 2, 512);
    g.globalAlpha = 1;
  }

  g.textAlign = "center";
  g.fillStyle = "rgba(200,222,200,.46)";
  g.font = "11.5px " + FONT;
  g.fillText("鼠标放上去看这张卡   ·   点一张进去   ·   方向键挑   ·   Enter 进", W / 2, H - 42);
}

/* ============================================================================
   挑一屏（phase === "pick"）—— 2026-10-26 整页删除
   ----------------------------------------------------------------------------
   用户原话：「这个界面也不需要吧 显示当前进度就可以了」。
   27 格选择页是"重打旧屏"的入口，但出门链路被简化成
   **家 → 出征页 → 当前进度那一屏**之后，这一页的正向入口只剩
   "通关后想刷 S"一条 —— 而刷 S 的理由（三星条件原文）已经搬到
   出征页右侧预览卡。整页删除，不留死代码：
     · PICK / ASK 常量、pickCell / pickHit / pickTap / pickStage / openPick
     · drawPick / drawAsk、askRect / askBtns / askHit
     · allDone / maxOpen（唯一用户就是这一页）
     · S.pickCur / pickAsk / hoverAsk / hoverStage 字段
     · 键盘 L 键、pick 方向键段、mousedown / touchstart / mousemove 的 pick 分支
     · smoke §27 / §40 两组断言、shot3 的 pick / ask 场景
   测试跳关（F2 / JUMP 面板）保留 —— 它不是玩法功能，是测试工具，
   而且它自己的注释里就写着"正式版要删就删 keydown 那三段 + 这个块"。
   ========================================================================== */

function drawSelect(g) {
  const d = S.door;
  const T = d.t;
  const lv = d.leaveT;
  const picked = d.pick;

  const HZ = 442;                                   // 地平线
  // **门要在人跑到一半时就开。** 0.70 才开的话，跑到门口那一刻门还是关的，
  // 读起来是"它站在门口发呆"。0.45 起开 → 撞上跑动中段，画面里"门为它让开"。
  const doorOpen = picked >= 0 ? Math.min(1, Math.max(0, (lv - 0.45) / 0.42)) : 0;

  /* 夜空 / 星 / 月 / 远树：与出征页共用 drawNightSky 一份 */
  drawNightSky(g, T, HZ);

  // ---------- 地面 ----------
  const gr = g.createLinearGradient(0, HZ, 0, H);
  gr.addColorStop(0, "#274230");
  gr.addColorStop(0.34, "#1C3124");
  gr.addColorStop(1, "#111A14");
  g.fillStyle = gr;
  g.fillRect(0, HZ, W, H - HZ);

  // 草尖：轻微摆动，六只站着的地方才有"风"
  g.strokeStyle = "rgba(122,182,122,.15)";
  g.lineWidth = 1.4;
  for (let i = 0; i < 120; i++) {
    const x = hash(i * 5 + 2) * W;
    const y = HZ + 8 + hash(i * 9 + 7) * (H - HZ - 12);
    const sw = Math.sin(T * 1.1 + i) * 2.4;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(x + sw * 0.5, y - 5, x + sw, y - 9);
    g.stroke();
  }

  // ---------- 萤火虫 ----------
  // 上半屏原本 40% 是空天（CR-028 记过的老问题）。不放远山 —— 那会把视线拉远；
  // 放几只慢飘的萤火，视线留在门口，同时画面有了"晚上"的温度。
  for (let i = 0; i < 9; i++) {
    const bx = 240 + hash(i * 23 + 7) * 680;
    const by = 170 + hash(i * 31 + 3) * 220;
    const ph = T * 0.55 + i * 2.1;
    const fx = bx + Math.sin(ph) * 24;
    const fy = by + Math.cos(ph * 0.8) * 13;
    const a = 0.30 + 0.70 * Math.abs(Math.sin(ph * 1.5));
    const r = 8 + Math.sin(ph * 2.6) * 1.6;
    const fgl = g.createRadialGradient(fx, fy, 0, fx, fy, r);
    fgl.addColorStop(0, "rgba(216,255,152," + (0.50 * a).toFixed(3) + ")");
    fgl.addColorStop(0.45, "rgba(196,246,120," + (0.16 * a).toFixed(3) + ")");
    fgl.addColorStop(1, "rgba(196,246,120,0)");
    g.fillStyle = fgl;
    g.beginPath(); g.arc(fx, fy, r, 0, 6.283); g.fill();
  }

  // ---------- 小屋 ----------
  drawHut(g, T, doorOpen);

  // ---------- 门光：门开了会更亮。这是"要出门了"的唯一提示 ----------
  const glow = 0.5 + 0.5 * doorOpen;
  const lg = g.createRadialGradient(DOOR.x, HZ - 12, 6, DOOR.x, HZ + 18, 250);
  lg.addColorStop(0, "rgba(255,206,120," + (0.44 * glow).toFixed(3) + ")");
  lg.addColorStop(0.44, "rgba(255,186,96," + (0.16 * glow).toFixed(3) + ")");
  lg.addColorStop(1, "rgba(255,170,80,0)");
  g.fillStyle = lg;
  g.fillRect(0, HZ - 180, 660, 350);

  // ---------- 带回来的果子 ----------
  // 这是"出门有产出"的唯一视觉证据。家园还没做，所以先堆在屋前 ——
  // 一堆会变多的东西，比一个数字更能让人想"再来一趟"。
  // 分四档而不是按数量逐颗画：60 个的时候画 60 颗就是一片红点。
  // 底下必须有个筐：散在地上的果子读作"掉的"，装进筐才读作"攒的"。
  {
    const n = S.home.loot;
    const cnt = [0, 3, 5, 7][n <= 0 ? 0 : n < 20 ? 1 : n < 60 ? 2 : 3];
    if (cnt > 0) {
      const bx = 202, by = 516;
      // 筐身（上宽下窄）
      g.fillStyle = "#6E4926";
      g.beginPath();
      g.moveTo(bx - 24, by - 12);
      g.lineTo(bx + 24, by - 12);
      g.lineTo(bx + 18, by + 2);
      g.lineTo(bx - 18, by + 2);
      g.closePath();
      g.fill();
      g.strokeStyle = "#3E2814";
      g.lineWidth = 1.8;
      g.stroke();
      // 两道编织纹
      g.strokeStyle = "rgba(180,130,74,.55)";
      g.lineWidth = 1.4;
      for (const ox of [-11, 11]) {
        g.beginPath();
        g.moveTo(bx + ox, by - 10);
        g.lineTo(bx + ox * 0.82, by);
        g.stroke();
      }
      // 筐口
      g.fillStyle = "#8E6038";
      rr(g, bx - 26, by - 16, 52, 7, 3.5);
      g.fill();
      g.strokeStyle = "#3E2814";
      g.lineWidth = 1.6;
      rr(g, bx - 26, by - 16, 52, 7, 3.5);
      g.stroke();

      // 果子：hash 散布而不是均分圆周。
      // 均分排成一个环，8 颗红的挤在一起读成一朵花 —— 筐里的东西应该是乱的。
      for (let i = 0; i < cnt; i++) {
        const rx = bx + (hash(i * 7 + 3) - 0.5) * 46;
        const ry = by - 16 - hash(i * 11 + 5) * 13 - (i > 3 ? 7 : 0);
        const rr2 = 5.6 + hash(i * 13 + 1) * 2.0;
        g.fillStyle = hash(i * 5 + 9) > 0.45 ? "#E4694C" : "#D9553F";
        g.beginPath(); g.arc(rx, ry, rr2, 0, 6.283); g.fill();
        g.strokeStyle = "#8E3A2A";
        g.lineWidth = 1.4;
        g.beginPath(); g.arc(rx, ry, rr2, 0, 6.283); g.stroke();
        g.fillStyle = "rgba(255,235,200,.85)";
        g.beginPath(); g.arc(rx - rr2 * 0.32, ry - rr2 * 0.38, rr2 * 0.28, 0, 6.283); g.fill();
        g.fillStyle = "#6FAE5A";
        g.beginPath(); g.ellipse(rx + rr2 * 0.5, ry - rr2 * 0.85, 2.6, 1.4, -0.6, 0, 6.283); g.fill();
      }
    }
  }

  // ---------- 六只 ----------
  // 按 y 排序：靠前的后画，才不会出现"后面那只压住前面那只的脚"
  const order = HEROES.map((H, i) => i).sort((a, b) => DOOR_SLOTS[a].y - DOOR_SLOTS[b].y);
  const react = Math.min(1, Math.max(0, (lv - 0.48) / 0.42));   // 落选反应强度

  for (const i of order) {
    const H = HEROES[i];
    const M = MOODS[H.id] || MOODS.cat;
    const slot = DOOR_SLOTS[i];
    const hov = S.hover === i && picked < 0;
    const isPick = picked === i;
    const isIdle = picked >= 0 && picked !== i;

    let x = slot.x, y = slot.y;
    let sc = 1, alpha = 1, sq = 0, face = -1;
    let wMul = 1, hMul = 1;      // 牛"趴下"不是压扁，是摊开

    // 待机呼吸（六只相位错开，不同步浮动才像活物）
    y -= Math.sin(T * 1.7 + i * 1.3) * 1.5;
    if (hov) { sc = 1.06; y -= 2; }

    if (isPick) {
      if (lv < 0.22) {
        // 蓄力
        sq = Math.sin((lv / 0.22) * Math.PI) * 0.55;
      } else if (lv < 0.84) {
        // 跑向门口
        const k = (lv - 0.22) / 0.62;
        // **跑动末段就开始淡出。** 它最后会停在门洞正中（x=282，门 244..320），
        // 全不透明的话正好把门糊死 —— 画面上是"一只兔子贴在门上"。
        // 0.62 起淡出，跑到门口时已经半只身子在门里。
        alpha = 1 - Math.max(0, (k - 0.62) / 0.38) * 0.55;
        const e = k * k * (3 - 2 * k);
        const hop = M.leave === "hop" ? Math.abs(Math.sin(k * 12)) * 16
                  : M.leave === "plod" ? 0
                  : Math.abs(Math.sin(k * 15)) * 8;
        x = slot.x + (DOOR.x - slot.x) * e;
        y = slot.y + (DOOR.y - slot.y) * e - hop;
        face = 1;                                   // 门在左边？不，门在 x=282，六只在 392 起 → 往左跑
        face = -1;
        sq = Math.abs(Math.sin(k * 15)) * 0.10;
        // 跑法就是性格：plod 走得慢（用非线性位置）
        if (M.leave === "plod") {
          const slow = k * k;                       // 慢起，越走越急
          x = slot.x + (DOOR.x - slot.x) * slow;
          y = slot.y + (DOOR.y - slot.y) * slow;
        }
      } else {
        // 进门
        const k = Math.min(1, (lv - 0.84) / 0.20);
        x = DOOR.x + 14; y = DOOR.y;      // 偏右 14px：门洞左半边才露得出来
        alpha = 1 - k;
        sc = 1 - k * 0.30;
        face = -1;
      }
    }

    if (isIdle) {
      sc = 1 - 0.06 * react;
      alpha = 1 - 0.10 * react;
      if (M.stayAct === "follow") {
        x = slot.x - 42 * react;                    // 追到门口
        y = slot.y + 4 * react;
      } else if (M.stayAct === "turn") {
        face = react > 0.45 ? 1 : -1;               // 扭头背对
      } else if (M.stayAct === "lie") {
        // **趴下不是压扁。** squash 只压 14%，读起来是"蹲了一下"。
        // 真正趴下是横向摊开、纵向塌掉 —— 用 w/h 比值，不用 squash。
        wMul = 1 + 0.20 * react;
        hMul = 1 - 0.46 * react;
      } else if (M.stayAct === "eat") {
        sq = Math.sin(T * 6) * 0.05;                // 还在吃
      } else if (M.stayAct === "droop") {
        y += 5 * react;                             // 缩下去
      } else if (M.stayAct === "hide") {
        // 影狐：**真的退半步**（says one thing and does it）。
        // 只调 alpha 的话，台词写着"往后退了半步"，画面上它一寸没动。
        x = slot.x + 34 * react;
        alpha = 1 - 0.66 * react;
      }
    }

    // 脚下的高亮圈
    if (hov) {
      g.strokeStyle = "rgba(185,240,106,.50)";
      g.lineWidth = 2;
      g.beginPath(); g.ellipse(x, y + 2, 42, 9, 0, 0, 6.283); g.stroke();
    }

    const dw = H.w * 1.82 * sc * wMul;
    const dh = H.h * 1.82 * sc * hMul;
    // alpha 必须走 o.alpha —— drawPet 内部会反复改 globalAlpha，外面设的会被清掉
    // 门口的肚子跟着 S.belly 走：中途 ESC 回来会看到它们饿着，收工回来是圆的
    drawPet(g, x, y, dw, dh, H, face, {
      squash: sq, alpha: alpha,
      belly: 0.18 + 0.82 * clamp(S.belly / 100, 0, 1),
      mood: bellyTier() === 0 ? 1 : bellyTier() === 1 ? 0.2 : 0,
    });

    // 名字（脚下）。不是卡片标题 —— 名字放在脚边，读作"它站在那"。
    // **落选的也要留名字**：上一版一到 0.6 就藏名，结果画面变成"四只无名怪"
    if (true) {
      g.globalAlpha = alpha * (hov ? 1 : 0.72);
      g.fillStyle = hov ? "#D8F98C" : "#CFE6CE";
      g.font = (hov ? "bold " : "") + "14px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(H.name, x, y + 24);
      g.globalAlpha = 1;
    }

    // 台词。**相邻两只必须错开高度**：狗追到门口时会挤在猫旁边，
    // 两条气泡同高就是一团糊字。按 i 的奇偶分两条道。
    const bubY = y - dh - 16 - (i % 2) * 36;
    if (hov) {
      drawBubble(g, x, bubY, M.pick, 1);
    } else if (isPick) {
      const ba = lv < 0.70 ? 1 : Math.max(0, 1 - (lv - 0.70) / 0.18);
      drawBubble(g, x, bubY, M.pick, ba);
    } else if (isIdle && react > 0.55 && M.stay !== "") {
      drawBubble(g, x, bubY, M.stay, Math.min(1, (react - 0.55) / 0.3) * 0.92);
    }
  }

  // ---------- 标题 ----------
  g.textAlign = "center"; g.textBaseline = "middle";

  // 顶部压一层暗，标题才不糊在星上
  const tg = g.createLinearGradient(0, 0, 0, 130);
  tg.addColorStop(0, "rgba(8,16,22,.62)");
  tg.addColorStop(1, "rgba(8,16,22,0)");
  g.fillStyle = tg;
  g.fillRect(0, 0, W, 130);

  g.fillStyle = "#F2FBEC";
  g.font = "bold 30px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  g.fillText("今天带谁出门？", W / 2, 52);

  g.fillStyle = "rgba(198,226,198,.62)";
  g.font = "13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
  /* 三分支，别写成 `progress > 0 ? ... : ...`。
   * progress 的上界是 LEVELS.length（闭区间），全通时 `progress + 1` 会印出
   * "走到第 28 关" —— 所以全通单独一个分支，且**不报总屏数**
   * （2026-10-26 用户：「我不想暴露最大关卡 只显示当前进度即可」）。 */
  g.fillText(S.progress >= LEVELS.length
    ? ("古道走透了 · 一只出门，五只看家")
    : S.progress > 0
      ? ("走到第 " + (S.progress + 1) + " 关 · 一只出门，五只看家")
      : "六只都在等 · 一只出门，五只看家", W / 2, 84);

  if (S.home.loot > 0) {
    g.fillStyle = "rgba(255,216,107,.70)";
    g.font = "12px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.fillText("屋里攒了 " + S.home.loot + " 个果子" +
              (S.home.runs > 1 ? "  ·  第 " + (S.home.runs + 1) + " 趟" : ""), W / 2, 106);
  }

  /* ---------- 底部提示 ----------
   * 挑一屏面板自己有底部提示（它盖住了这一行），这里必须收手 ——
   * 两边都画的话，574 处的"1–6 或点一只"会从面板底下露出一截，
   * 看起来像面板没盖严。 */
  if (S.phase !== "pick") {
    g.fillStyle = "rgba(206,232,206,.44)";
    g.font = "13px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
    g.fillText(picked >= 0 ? "门在身后合上了。"
                          : "1–6 或点一只 · L 挑一屏重打 · 出门前想清楚带谁", W / 2, H - 26);
  }
}

/* ============================================================================
   17. 主循环
   ========================================================================== */

function checkGoal() {
  const st = curStage();
  if (S.killed < S.total) return false;
  if (TOUR.length && S.stat.toured < (st.tourNeed || 1)) return false;
  if (st.goal === "limit") return S.stat.made <= st.ballLimit;
  if (st.goal === "chain") return S.stat.maxHolds >= st.chain;
  if (st.goal === "bank")  return S.stat.bankHolds >= st.bank;
  if (st.goal === "collect") return S.food >= st.collect;
  if (st.goal === "tour")    return S.stat.toured >= (st.tourNeed || 1);
  if (st.goal === "intact")  return S.stat.burst === 0;
  if (st.goal === "nohit")   return S.stat.hits === 0;
  return true;
}

function goalFailWhy() {
  const st = curStage();
  /* ---- 最优先：还有人没送走 ----
   * 这条原来缺着，于是 `checkGoal` 因为 `killed < total` 返回 false 时，
   * 面板照样去解释"收成/额度"那一层 —— 实测报出过
   * 「收成只有 10（要 8）」这种自相矛盾的句子：10 明明 ≥ 8。
   * 玩家会照它去攒早就不缺的东西，永远修不好真正的问题。 */
  if (S.killed < S.total) {
    return "还有人没送走：场上剩 " + (S.total - S.killed) + " 只（这一趟只送走 " + S.killed + " 只）";
  }
  /* 赛道排最前：其他原因（球用超了、挨打了）玩家自己能看到，
     而"球没走完那条路"是看不见的 —— 球确实进了营地，只是没走完整条线。 */
  if (TOUR.length && S.stat.toured < (st.tourNeed || 1)) {
    return "人都送走了，但走完赛道的只有 " + S.stat.toured + " 颗（要 " + (st.tourNeed || 1) + " 颗）—— 那几段跑道要一层一层接着掉下去，不是随便滚";
  }
  if (st.goal === "chain") return "人都送走了，但没有一颗球装够 " + st.chain + " 只（最大 x" + S.stat.maxHolds + "）";
  if (st.goal === "bank")  return "人都送走了，但从营地过的只有 " + S.stat.bankHolds + " 只（要 " + st.bank + " 只）";
  if (st.goal === "collect") {
    /* "火坑 ×2 才是正路" 只在本层真有火坑时成立。深巢的坑是随机抽的，
       有的层一个火坑都没有 —— 那时这句话是在指路指向一块空地。 */
    const hasFire = (st.pits || []).some(p => p.kind === "fire");
    return "人都送走了，但收成只有 " + S.food + "（要 " + st.collect + "）—— " +
           (hasFire ? "火坑 ×2 才是正路" : "一颗球多装几只再进营地");
  }
  if (st.goal === "tour")    return "人都送走了，但走完赛道的只有 " + S.stat.toured + " 颗（要 " + (st.tourNeed || 1) + " 颗）—— 那三段跑道是一层一层接着掉下去的，不是随便滚";
  if (st.goal === "intact")  return "人都送走了，但崩了 " + S.stat.burst + " 颗球（一次都不许）";
  if (st.goal === "nohit")   return "人都送走了，但挨了 " + S.stat.hits + " 下（一次都不许）";
  return "人都送走了，但用了 " + S.stat.made + " 颗球（只给 " + st.ballLimit + " 颗）";
}

function tick(dt) {
  S.t += dt;

  /* 结算入场钟。放在 tick 最前面、和 S.t 一起走 —— 它必须在
     hitStop 的 dt 折算之前累加，否则最后一击的顿帧会把评级弹入拖慢半拍。 */
  if (S.phase === "clear" || S.phase === "fail") S.settleT += dt;
  else S.settleT = 0;

  /* 出征页提示条自己衰减。**独立于 S.say** —— 那句台词是画在玩家头顶的
     气泡，只在 play 阶段走钟；出征页没有玩家对象，用 S.say 写进去
     既看不见、也永远不会消失。 */
  if (S.phase === "portals" && S.gateTip.life > 0) S.gateTip.life -= dt;
  if (S.modBoard && S.modBoard.sayT > 0) S.modBoard.sayT -= dt;

  if (S.hitStop > 0) {
    S.hitStop = Math.max(0, S.hitStop - dt);
    dt *= 0.28;   // 命中顿帧：只在撞击那一瞬慢下来，不用全局慢放
  }

  // ---------- 门口动画 ----------
  // 只在 select 阶段走。leaveT 到 1.62 才真正 beginRun ——
  // 这 1.62 秒是"其余五只的反应"唯一的存在时间。
  if (S.phase === "select") {
    S.door.t += dt;
    if (S.door.pick >= 0) {
      S.door.leaveT += dt;
      if (S.door.leaveT >= 1.62) {
        S.heroIdx = S.door.pick;
        S.door.pick = -1;
        S.door.leaveT = 0;
        /* 全通了也是 beginRun(S.progress)：beginRun 内部 clamp 到最后一屏，
         * 重打最后一屏。挑一屏删掉后没有"27 格全亮让你挑"这个出口了
         * （2026-10-26 用户：「这个界面也不需要吧」）。 */
        beginRun(S.progress);
      }
    }
  }

  if (S.phase === "play") {
    S.playT += dt;

    /* ---- 雪：越下越厚 ----
     *
     * 90 秒长满，而第 2 关 par 是 60 秒 —— 多数人在它最厚之前就打完了。
     * 这是有意的：**雪是一趟比一趟更难的变量，不是固定皮肤**。
     * 第一次打是薄雪（好看），重打刷 S 的人才会撞上"整片白 + 敌人冻僵"，
     * 于是同一关的第二遍是真的第二遍，不是把第一遍再走一次。
     *
     * 只在 play 阶段涨：结算面板停着的时候雪还在下会让人以为时间在走。 */
    if (TH.snow) {
      S.snowDepth = Math.min(1, S.snowDepth + dt / SNOW_BUILD_SEC);
    }

    updatePlayer(dt);
    for (const f of S.foes) updateFoe(f, dt);
    updateShots(dt);
    updateBalls(dt);
    /* 雾与囊在球之后：球的位置这一帧才算完，雾照着旧位置算会差一帧，
       表现是"球的亮圈永远比球慢半拍"—— 单看不明显，连续看很脏。 */
    updatePods(dt);
    nestFogTick(dt);
    updateShocks(dt);
    updateFoeShots(dt);
    leavePrints();

    // ---- 台词 ----
    // 三个触发点各自只响一次/关。挑的都是"玩家会停一下"的瞬间：
    // 第一颗球滚出去、一球卷走三个、挨了一下。
    if (!S.say.fired.first && S.stat.made >= 1) { S.say.fired.first = true; sayLine("first"); }
    if (!S.say.fired.big && S.stat.maxHolds >= 3) { S.say.fired.big = true; sayLine("big"); }
    if (S.say.life > 0) { S.say.t += dt; S.say.life -= dt; }

    // 清掉死亡的敌人
    let w = 0;
    for (let i = 0; i < S.foes.length; i++) if (!S.foes[i].dead) S.foes[w++] = S.foes[i];
    S.foes.length = w;

    /* ---- 波次推进 ----
       不是"清完才刷"，是"剩 1 只就刷"。理由：最后一只常常站在高台上，
       玩家得爬两层、糊三下、再推一趟 —— 那 20 秒里没有任何决策，
       只有赶路。推球游戏最不该有的就是赶路。

       BOSS 波是例外，必须**清干净**才开场：BOSS 和残兵一起上是夹击，
       玩家两边都要防，那时候他想的就不是"这球怎么推"了。 */
    S.waveT += dt;
    const lastWave = S.wave >= WAVES.length - 1;
    if (!lastWave && S.waveGap <= 0) {
      const nextWv = WAVES[S.wave + 1] || [];
      const nextBoss = nextWv.some(sp => sp.foe === "boss");
      const alive = S.foes.length;
      const trigger = nextBoss ? alive === 0 : alive <= 1;
      // 3.5 秒的呼吸：一球卷三只会瞬间清场，不缓一下的话玩家还没看清
      // 数字就进下一波了，节奏上是"被推着走"，不是"自己在推"。
      if (trigger && S.waveT > 3.5) S.waveGap = nextBoss ? WAVE_GAP_BOSS : WAVE_GAP;
    }
    if (S.waveGap > 0) {
      S.waveGap -= dt;
      if (S.waveGap <= 0) spawnWave(S.wave + 1);
    }

    // 收工判定：最后一波也刷完了、场上没人、也没有还在滚的球（球里装着人）
    const allSpawned = S.wave >= WAVES.length - 1 && S.waveGap <= 0;
    if (allSpawned && S.foes.length === 0 && S.balls.length === 0 && S.phase === "play") {
      if (checkGoal()) {
        S.phase = "clear";
        /* ---- 星靶：算 + 落盘 + 记下新的（结算卡画三颗靶用） ----
           放在 phase 赋值后面、奖励前面：judgeStar 读的是 S.stat，
           而 clear 分支下面才开始改 S.food / S.belly，顺序反了不会错，
           但放这儿读代码的人一眼能看出"判定发生在改动发生之前"。 */
        /* 深巢不挂星靶：81 个靶是 27 屏的，深巢的层没有靶表 ——
           不挡的话 STAR_OF_STAGE[0] 会让「第 7 层」点亮主线第 1 屏的星。 */
        if (S.nest) {
          S.starMet = [];
          S.starFresh = [];
        } else {
          S.starMet = judgeStar(S.stage, S.stat);
          S.starFresh = recordStar(S.stage, S.starMet);
        }
        /* 清场奖励 3 → 3+25（`bounty`）。
           3 这个数太小了：一屏收成实测 31~64，3 分等于 5%，
           玩家根本感觉不到"把场上清干净"有额外好处。 */
        /* 悬赏清场：3 → 28 → 36 → 44。第 1 层是**跳变**不是等差
           （清场本来就是"全清才有奖励"，给 4 分没人会为它改打法）。 */
        S.food += [3, 28, 36, 44][perkLv("bounty")] || 3;
        /* 记账顺手把"谁刚到家"接住。**返回值不能丢** ——
         * 丢了的话，解锁这件事就只剩 recordClear 内部那条 3.6 秒的 DOM 提示
         * （而且还只在 ?from=home 时才弹）。结算卡要靠这份数据画横幅。 */
        /* 深巢不写主线存档：recordClear 会写"通过哪一屏"（cleared 数组 +
         * 主界面镜像 + 解锁宠物），下潜 20 层等于谎报主线通了 20 屏。 */
        S.unlocked = S.nest ? [] : recordClear(S.stage);
        // ---- 一趟的账 ----
        // loot 累加、倍率涨一档、肚子掉一档。**重打同一关不会重复计**，
        // 因为只有 checkGoal 通过（真的过关）才走到这里，失败重打时 S.food 是 0。
        S.trip.loot += S.food;
        S.trip.stages += 1;
        S.trip.multi = Math.min(2, 1 + 0.15 * S.trip.stages);
        /* 肚子掉一档。**16 → 20（2026-10-24）** ——
           16 的时候要过 5 屏才见底，一趟太长（≈7 分钟），
           中途那段"火力没变化"的日子会让人麻木。
           20 之后：过 1 屏满饱、2-3 屏半饿、4 屏全饿，
           一趟自然收到 4-5 屏（≈6 分钟）—— 短到能重开，长到有弧线。 */
        S.belly = Math.max(0, S.belly - bellyCost());
        const rk = rate();
        const ORD2 = { B: 1, A: 2, S: 3 };
        const idx = S.stage;
        /* 评级只升不降：拿过一次 S，之后打 A 不会把 S 抹掉 ——
           否则玩家不敢重打（"万一打差了纪录没了"）。
           先存下"打之前"的最佳，结算面板拿它判断是不是新纪录。 */
        S.rankPrev = S.nest ? "" : (S.best[idx] || "");
        /* 深巢不参与 27 屏的评级体系：`S.best[0]` 是主线第 1 屏的成绩，
           深巢写进去就污染它，而"第 7 层打了 S"也不该记到第 1 屏头上。
           结算卡照样显示这一层的评级（rk），只是不落盘、不发材料。 */
        const aw = S.nest ? { better: false, best: "", gain: 0 } : rankAward(S.best[idx], rk);
        if (aw.better) {
          S.best[idx] = aw.best;
          saveBest();
        }
        /* ★ 2026-10-25：**评级第一次真的给东西。**
         *
         * 审计原文：「评级 S/A/B 只落盘，不给任何东西 → 玩家没有理由为
         * 『打得更好』付出，刷 S 是纯自嗨」。
         *
         * 给**材料**而不是果子：果子实测通胀 6.5×（单屏收 47.3、喂饭只花 7.3），
         * 再加只会更废；材料是真稀缺 —— 改造件要 180 果 + 4 材，而一趟最多 5 材。
         *
         * **只在首次达成或刷新纪录时给**（判据在 `rankAward` 里，纯函数，
         * 冒烟能直接测）。无条件给的话，重打第 1 屏能无限刷材料。
         *
         * 落点选 `S.trip.rankLogs` 而不是直接写存档：这一趟的账只有一个出口
         * （`_bankRun` → `payoutFromRun`），和果子/材料现有口径完全一致。 */
        S.rankGain = aw.gain;
        if (aw.gain > 0) S.trip.rankLogs = (S.trip.rankLogs || 0) + aw.gain;
        /* 主线的三本账（统计 / 进度 / 全通奖励）深巢一律不碰：
           它们的语义都是"27 屏走到哪了"，深巢的层号在另一条轴上。 */
        if (!S.nest) {
          recordStats(idx);
          S.progress = Math.max(S.progress, S.stage + 1);
        }
        /* ---- 走完全部 27 屏 ----
         *
         * 奖励必须在这一刻发。挂在「收工」上是错的 —— 收工有两条路
         * （结算面板自动跳走 / 点「收工回家」），挂一处就漏一处，
         * 而玩家只会撞上少给的那条，然后觉得"说好的奖励呢"。
         *
         * 顺带把 progress 顶到 LEVELS.length：这才是"全通"在存档里的写法。
         * 不写的话，第 27 屏通完 progress 是 27（= length），刚好也是全通 ——
         * 但那是碰巧对，不是设计对。显式写一次，读代码的人不用反推。 */
        if (!S.nest && S.stage + 1 >= LEVELS.length) {
          S.progress = LEVELS.length;
          S.trip.loot += 12;
          addText(W / 2, 292, "27 屏全走完了 · +12 份口粮", "#FFD86B", 22, 3.2);
        }
        if (!S.nest) saveProgress();
        addText(W / 2, 250, S.nest ? ("沉到第 " + S.nest.depth + " 层") : "这一屏清干净了",
                "#FFE9B0", 32, 2.2);
      } else {
        S.phase = "fail";
        S.failWhy = goalFailWhy();
        /* 失败也判星靶：「这趟没白打」要有证据。完不成不惩罚（红线 3），
           但打出来的靶照样算 —— 和本趟目标同一个口径。
           深巢没有靶表，一律置空（同通关分支的理由）。 */
        if (S.nest) {
          S.starMet = [];
          S.starFresh = [];
        } else {
          S.starMet = judgeStar(S.stage, S.stat);
          S.starFresh = recordStar(S.stage, S.starMet);
        }
      }
    }

    // 死局：限球关额度用完、场上没球、还有人没送走 —— 这局没救了。
    // 直接判负比让人干等着好，留一个"还能翻"的假象最伤。
    if (S.phase === "play" && curStage().ballLimit != null) {
      const st = curStage();
      const alive = S.foes.length;
      if (st.ballLimit - S.stat.made <= 0 && S.balls.length === 0 && alive > 0) {
        S.phase = "fail";
        S.failWhy = "球用完了，还有 " + alive + " 只没送走";
      }
    }
  }

  // 通关面板自动推进。**从 3 秒放长到 5.5 秒**：多出来的时间是为了让人看清
  // "这一趟攒了多少 × 多少倍"——不读那个数字，"贪一关"就没分量。
  // 鼠标停在按钮上时暂停：他正在读，别替他做决定。
  if (S.phase === "clear" && !S.aim && S.hoverBtn < 0) {
    S.clearT += dt;
    if (S.clearT > 5.5) nextLevel();
  }

  tickFx(dt);

  // 边沿输入在这一帧已经被所有人消费过了，清掉。
  // 不清的话，一个 keydown 会在后续每一帧都触发一次。
  S.press = {};
}

/* 结算卡片与两个按钮的几何。**绘制和点击判定共用这一份** ——
 * 门口那六只踩过一次"画一遍算一遍坐标、判定再算一遍"的坑，改布局必错开。
 *
 * 2026-10-25：CARD_H 412 → 496、BTN_Y 348 → 424 —— 数据列和按钮之间
 * 插进了「三颗星靶」行（+352，高 30）和一条奖励回执（+400）。
 * 卡片长高但不改原有任何一行的坐标：评级、星星、它说、数据列全在原位，
 * 只有按钮整组下移。这样截图对比时"老东西没动"是肉眼可验的。 */
const CARD_W = 570, CARD_H = 496, CARD_Y = 64;
const BTN_Y = CARD_Y + 424, BTN_W = 196, BTN_H = 42, BTN_GAP = 26;
function settleBtns() {
  const cx = W / 2;
  return {
    cont: { x: cx - BTN_W - BTN_GAP / 2, y: BTN_Y, w: BTN_W, h: BTN_H },
    home: { x: cx + BTN_GAP / 2, y: BTN_Y, w: BTN_W, h: BTN_H },
  };
}
function inRect(p, r) {
  return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

/* ============================================================================
   16.5 后期合成（Post Pass）
   ============================================================================
   起因是一句话："整体偏静态贴图、层次感弱、美术感觉很弱"。

   先说清楚病在哪 —— 不是单个物件画得糙。天空有太阳光晕和斜光柱，远山有三档
   混色，地面有三档明度加草纹理，平台是两根圆木带受光弧，角色有接地影子。
   每一件单独看都在及格线以上。

   问题是它们**没有被同一个镜头拍下来**：

     ① 亮的东西不发光。太阳是一块纯白圆、火坑是一团橙、法球是一圈绿 ——
        每一样都"是那个颜色"，但没有一样在**溢出**。真实画面里高光的能量
        会糊到周围去，这是"光"和"涂了一块亮色"的唯一区别。
     ② 明暗没有全局方向。每件东西的明暗都是自己写死的（平台的上亮下暗、
        角色高光在左上），彼此不构成一个统一的光场。看的人读不出"光从哪来"，
        就会把每个物件读成一张独立的贴纸。
     ③ 暗部不冷、亮部不暖。八套主题只管了"这一关的主色"，没人管**同一张图内
        的色彩关系** —— 于是白云、绿草、棕木、橙猫全停在一个色温上，
        画面读作"一盒蜡笔"。
     ④ 每个像素都太干净。程序化图形的边缘是数学精确的，没有噪点。
        真实镜头一定带颗粒（感光噪声）；干净到零噪声 = 一眼矢量。

   这四条都是**整幅画**的性质。靠在 drawXxx 里继续补细节完全无解 ——
   补得越多，越像"一张细节很足的贴纸"。唯一的办法是：等所有东西画完，
   把这一帧当成一张已经拍下来的照片，再走一遍显影。

   顺序不能换，换了互相打架：
      泛光 → 提对比 → 分离色调 → 颗粒 → 暗角
   ① 泛光必须在调色之前：调色会压暗部，先泛光才有"光本身亮"的读数。
   ② 颗粒必须在暗角之前：暗角是全屏乘法。先压暗再撒颗粒，四角的颗粒会
      一起被压没；反过来才是"四角颗粒更明显"的真实分布。
   ③ 暗角必须最后：它是唯一一层盖住 HUD 的层，也必须是最后盖上去的那层。
   ========================================================================== */

/* 噪点图的边长。256 是权衡：128 平铺在 960 宽上会看出 7 次重复的接缝，
   512 要生成 26 万像素、每帧首帧明显卡一下。 */
const GR_N = 256;

/* 离屏画布**惰性创建**。
   不放模块顶层：Cocos 里要等 groveAttachCanvas 才有 cv，而且 359 项冒烟断言
   绝大多数不渲染，顶层分配三张位图纯属浪费。 */
let _post = null;
function postGet(g) {
  if (_post) return _post;
  const mk = (w, h) => {
    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;
    return c;
  };
  /* 泛光用 1/4 分辨率。全分辨率的泛光没人看得出区别，
     但每帧多搬 3 倍的像素 —— 手机上是直接掉帧的量级。 */
  const bloom = mk(W >> 2, H >> 2);
  /* 调色用的全屏缓存。只为了给 contrast/saturate 一个作用对象 ——
     canvas 的 filter 只能作用在 **drawImage 的源**上，不能对现有像素施加。
     所以想给"整个画面"提对比，只能整体搬一次。960×600 是一次全屏位块传输，
     比多画十棵树的代价还低。 */
  const grade = mk(W, H);
  _post = {
    bloom: bloom, bc: bloom.getContext("2d"),
    grade: grade, gc: grade.getContext("2d"),
    pat: null,
  };
  return _post;
}

/* 生成三张噪声图案。三张而不是一张：一张固定不动的噪声读作
   "屏幕上落了一层灰"，会跟着镜头一起静止 —— 那是脏，不是颗粒。
   每 2 帧轮换一张，观感上就是"每格胶片各自的感光噪声"。 */
function postBuildGrain(P, g) {
  P.pat = [];
  for (let k = 0; k < 3; k++) {
    const c = document.createElement("canvas");
    c.width = c.height = GR_N;
    const gc = c.getContext("2d");
    const img = gc.createImageData(GR_N, GR_N);
    const d = img.data;
    for (let i = 0, n = GR_N * GR_N; i < n; i++) {
      /* 两个 hash 相加再减 1 = 三角分布，不是均匀分布。
         均匀白噪的观感是"电视雪花"；三角分布大部分像素贴近中灰、
         少数才明显偏亮/偏暗，这才是胶片颗粒的分布。 */
      const v = 128 + (hash(i * 1.37 + k * 311.7) + hash(i * 2.71 + k * 97.3) - 1) * 54;
      d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = v;
      d[i * 4 + 3] = 255;
    }
    gc.putImageData(img, 0, 0);
    P.pat.push(g.createPattern(c, "repeat"));
  }
}

/**
 * 把一帧当成照片显影一遍。**在 render() 的最后、g.restore() 之前调**。
 *
 * 全程用 setTransform(1,0,0,1,0,0) 重置变换：render() 开头有震屏的 translate，
 * 这一层如果跟着抖，泛光和暗角会露出画面外的黑边 —— 那是"镜头在抖"变成
 * "屏幕在抖"，两回事。
 */
function drawPost(g) {
  const P = postGet(g);
  if (!P.pat) postBuildGrain(P, g);

  g.save();
  g.setTransform(1, 0, 0, 1, 0, 0);

  /* ---- ① 泛光：抽亮部 → 模糊 → screen 叠回 ----
   *
   * 阈值走 brightness(0.55) + contrast(4.6)，不是"提亮后模糊"：
   *   草地亮度 ≈ 0.70 → 压到 0.39 → contrast 后 ≈ 0（完全不进泛光）
   *   天空 0.92 → 0.51 → 0.55（进一半，天空本来就该在发光）
   *   太阳 / 白高光 1.00 → 0.55 → 0.73（大半个进来，糊开就是光晕）
   * 只用 contrast（比如 3.0）不压 brightness 的话，草地会被整片推亮，
   * 全屏起一层雾 —— 那不是泛光，是"镜头脏了"。
   *
   * blur 半径 5px 建在 1/4 分辨率上，等价全屏 20px。
   * 这个尺度才读作"光晕"；3px 读作"边缘发虚"，8px 读作"整块糊了"。
   */
  if (S.post !== false) {
    const BW = P.bloom.width, BH = P.bloom.height;
    const bc = P.bc;
    bc.setTransform(1, 0, 0, 1, 0, 0);
    bc.globalCompositeOperation = "source-over";
    bc.clearRect(0, 0, BW, BH);
    bc.filter = "brightness(0.55) contrast(4.6) blur(5px)";
    bc.drawImage(cv, 0, 0, BW, BH);
    bc.filter = "none";

    g.globalCompositeOperation = "screen";
    /* 强度分主题给，不是一个常数：
     *   普通关 0.38 / 雪原 0.28 / 夜关 0.20
     *
     * 为什么必须分开：泛光的强度实际取决于"画面里有多少接近白的东西"。
     * 雪原的雪面和夜关的月光都是大面积高光，用 0.38 会把整片雪 / 整个夜空
     * 一起推亮 —— 雪地失去起伏读成"一块白"，夜关被提亮成"傍晚"，两个都不是
     * 这张图想要的。给得低一点，只让最亮的那一小块溢出。
     *
     * 普通关反而可以给足：草地亮度只有 0.65，离阈值远，0.38 才能在太阳、
     * 火苗、法球上看出光晕。
     */
    g.globalAlpha = TH.night ? 0.20 : TH.snow ? 0.28 : 0.38;
    g.drawImage(P.bloom, 0, 0, W, H);
    g.globalAlpha = 1;

    /* ---- ② 对比与饱和：把"每一件都刚刚好"拉开成"有明有暗" ----
     *
     * 这是最关键的一步，也最容易漏掉。
     *
     * 程序化画出来的东西有个共同病：每一件都合理地取了一个中间调 ——
     * 草地 0.65、树冠 0.55、木头 0.58、云 0.92。单看每个都"对"，
     * 摆在一起就**没有一处是暗的**，画面于是读作"平"，读作"贴纸"。
     * 真实照片里一定有被压到 0.15 以下的暗部（背光的树根、平台底面、
     * 石头缝），正是这些暗部把亮部衬出来。
     *
     * 所以这一步不是"调色"，是**补上缺失的明暗跨度**：
     * contrast 1.14 让暗的下去、亮的上来，saturate 1.10 让推开的颜色不发灰
     * （提对比一定掉饱和，这两个必须一起动；只动一个，画面要么发灰要么发艳）。
     */
    const gc = P.gc;
    gc.setTransform(1, 0, 0, 1, 0, 0);
    gc.globalCompositeOperation = "copy";
    gc.filter = "contrast(1.14) saturate(1.10)";
    gc.drawImage(cv, 0, 0);
    gc.filter = "none";
    g.globalCompositeOperation = "copy";
    g.drawImage(P.grade, 0, 0);
    g.globalCompositeOperation = "source-over";

    /* ---- ③ 分离色调：亮部往暖、暗部往冷 ----
     *
     * 这是"电影感"最便宜也最有效的一条：它不改任何物体的形状，
     * 只规定"这张图里的暗部属于哪个色温、亮部属于哪个色温"。
     * 两个色温一旦分开，整张图就有统一的"光"，物件之间自动粘住。
     *
     * 冷的那层也用 soft-light，**不用 multiply**。
     * 第一版按"压暗部"的思路用了 multiply 铺蓝：蓝 × 绿 = 灰橄榄，
     * 整个下半屏的草地直接脏掉。multiply 只适合"压暗"，不适合"染色"——
     * 它改的是每个通道的乘积，绿色通道高的地方乘蓝必然掉饱和。
     * soft-light 的性质是"暗部推色、亮部几乎不动、中灰不变"，
     * 这才是分离色调要的东西：它不改变明度结构，只标注色温归属。
     *
     * 暖的那层同样 soft-light，只给受光面加温。
     * 位置和天空的太阳同一个坐标，否则"光"和"光源"对不上，
     * 观感上会变成"右上角被染黄了"而不是"光从右上来"。
     */
    const cool = g.createLinearGradient(0, 0, 0, H);
    cool.addColorStop(0, "rgba(48,76,148,0)");
    cool.addColorStop(0.52, "rgba(48,76,148,.16)");
    cool.addColorStop(1, "rgba(38,62,130,.42)");
    g.globalCompositeOperation = "soft-light";
    g.fillStyle = cool;
    g.fillRect(0, 0, W, H);

    const sx = TH.night ? 858 : 700, sy = TH.night ? 214 : 74;
    const warm = g.createRadialGradient(sx, sy, 40, sx, sy, 620);
    /* 夜关的"暖"换成冷月光，且只给一半强度 ——
       紫夜上叠橙光会把整片天染成脏粉，那是第 8 关的老毛病。 */
    if (TH.night) {
      warm.addColorStop(0, "rgba(176,196,255,.30)");
      warm.addColorStop(0.55, "rgba(150,170,240,.10)");
      warm.addColorStop(1, "rgba(140,160,230,0)");
    } else {
      /* 0.34 / 0.11 而不是 0.52 / 0.17。
         第一版把暖光铺到全屏（半径 780），苔原关本身就是黄昏金天空，
         再叠一层橙 = 整幅画只剩一个色相，云和远山全糊在一起。
         暖光的职责是"在受光面加温"，不是"给画面套一个橙色滤镜"——
         半径收到 620、强度减半之后，它才只在太阳那一圈和受光边缘可见。 */
      warm.addColorStop(0, "rgba(255,186,96,.34)");
      warm.addColorStop(0.55, "rgba(255,172,82,.11)");
      warm.addColorStop(1, "rgba(255,150,60,0)");
    }
    g.globalCompositeOperation = "soft-light";
    g.fillStyle = warm;
    g.fillRect(0, 0, W, H);

    /* ---- ④ 颗粒 ----
     *
     * overlay + 中灰 128 = 不变；偏亮的像素提亮、偏暗的压暗。
     * alpha 0.075 是"看得见但说不出"的量级 ——
     * 0.03 完全看不见（白做），0.15 就开始像加了滤镜的噪点照片。
     *
     * 用 S.t 决定用哪张图，不用 Math.random：截图工具要能复现同一帧。
     * 每 2 帧换一张，配 60fps 就是 30Hz，接近胶片的 24Hz 观感。
     */
    g.globalCompositeOperation = "overlay";
    g.globalAlpha = 0.075;
    g.fillStyle = P.pat[Math.floor(S.t * 30) % 3];
    g.fillRect(0, 0, W, H);
    g.globalAlpha = 1;

    /* ---- ④b 镜头光斑 ----
     *
     * 画面上飘着几个大而虚的亮斑。它们**不是**粒子特效 ——
     * 是镜头前空气里被阳光照亮的浮尘，虚焦之后就是一个亮斑。
     *
     * 有它和没它的区别，是"这张图被拍下来"和"这张图被画出来"的区别：
     * 前面四层都在处理"颜色和明暗"，只有这一层在画面里放进了
     * **镜头本身**这个物体 —— 观众看不到镜头，但能通过散景知道它在那儿。
     *
     * 必须虚：半径 14~50、中心 alpha 只有 0.05~0.11、边缘完全透明。
     * 画实了就变成"天上飘着几个白点"，是雪花特效，不是散景。
     * 用 screen 而不是 source-over：光斑是**加光**，不是盖一层白。
     */
    g.globalCompositeOperation = "screen";
    for (let i = 0; i < 7; i++) {
      const sp = 0.05 + hash(i * 3.1) * 0.045;
      const ph = S.t * sp + hash(i * 7.7) * 6.283;
      const bx = (hash(i * 1.3) * W + Math.sin(ph) * 96 + W) % W;
      const by = 40 + hash(i * 5.9) * 400 + Math.cos(ph * 0.8) * 46;
      const br = 14 + hash(i * 9.1) * 36;
      const ba = (0.055 + hash(i * 2.3) * 0.055) * (0.62 + 0.38 * Math.sin(S.t * 0.6 + i * 1.7));
      const rg = g.createRadialGradient(bx, by, br * 0.15, bx, by, br);
      const tint = TH.night ? "190,206,255" : "255,246,214";
      rg.addColorStop(0, "rgba(" + tint + "," + ba.toFixed(3) + ")");
      rg.addColorStop(0.62, "rgba(" + tint + "," + (ba * 0.45).toFixed(3) + ")");
      rg.addColorStop(1, "rgba(" + tint + ",0)");
      g.fillStyle = rg;
      g.beginPath();
      g.arc(bx, by, br, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  /* ---- ⑤ 暗角 ----
   * 椭圆而不是正圆：960×600 是 16:10，正圆暗角在上下两边会切得比左右狠，
   * 读作"画面上下被裁了"。椭圆按宽高比拉，四角的衰减才是均匀的。
   *
   * 中心半径 0.46H、外沿 1.0W：外沿收到屏幕宽的一半之外，
   * 四角才是"完全压到底"，而不是中途就截断成一条硬边。
   * 颜色偏冷绿（#101C16 而不是纯黑）：纯黑暗角会吸掉草地原本的色相，
   * 读作"镜头上加了个黑框"。
   */
  if (S.vignette !== false) {
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.translate(W / 2, H / 2);
    g.scale(1, H / W);            // 把正圆压成椭圆（按宽高比）
    const R = W * 0.52;
    const vg = g.createRadialGradient(0, 0, R * 0.52, 0, 0, R);
    vg.addColorStop(0, "rgba(16,28,22,0)");
    vg.addColorStop(0.62, "rgba(16,28,22,.10)");
    vg.addColorStop(1, "rgba(10,20,15,.46)");
    g.fillStyle = vg;
    g.fillRect(-W, -W, W * 2, W * 2);
    g.restore();
  }

  g.restore();
}

/* ---- 前景景深：把最前面那层灌木模糊掉 ----
 *
 * 为什么这一条比"再加细节"重要得多：
 * 真实镜头只有一个焦平面。这一关的焦平面在中景（平台和角色所在的那一档），
 * 最前面那丛灌木离镜头不到一米，物理上必然糊。现在它和角色一样锐利 ——
 * 这等于告诉观众"这里没有镜头，只是一堆图叠在一起"。
 *
 * 半径只给 2.4px。5px 读作"背景虚化"（前景会跑到远处去），1px 看不出来。
 * 2~3px 恰好是"我知道我在看一个很近的东西"。
 *
 * 遮罩层里的每一件都还是 drawForeground 原样画出来的，
 * 这一层只改**清晰度**，不改造型和配色 —— 所以它不会和玩法可读性打架。
 */
let _fg = null;
function drawForegroundSoft(g) {
  if (S.dof === false) { drawForeground(g); return; }
  if (!_fg) {
    const c = document.createElement("canvas");
    c.width = W;
    c.height = H;
    _fg = { cv: c, ctx: c.getContext("2d") };
  }
  const fc = _fg.ctx;
  fc.setTransform(1, 0, 0, 1, 0, 0);
  fc.globalCompositeOperation = "source-over";
  fc.clearRect(0, 0, W, H);
  drawForeground(fc);

  g.save();
  /* 先垫一份清晰的，再叠一份模糊的。
     只画模糊版的话，blur 会把画布外的透明一起采样进来，
     灌木轮廓会整体向内缩一圈并且变淡 —— 前景层薄了一层，看起来像"褪色"。
     垫底之后轮廓位置和浓度都对，模糊只作用在边缘。 */
  g.drawImage(_fg.cv, 0, 0);
  g.globalAlpha = 0.80;
  g.filter = "blur(2.4px)";
  g.drawImage(_fg.cv, 0, 0);
  g.filter = "none";
  g.globalAlpha = 1;
  g.restore();
}

function render() {
  const g = ctx;
  g.save();

  // 震屏
  if (S.shake > 0.4) {
    g.translate(rand(-S.shake, S.shake) * 0.4, rand(-S.shake, S.shake) * 0.4);
  }

  drawForest(false);
  drawLevel();
  /* 脚印紧跟平台：它属于**地面**，不属于角色 ——
     画在角色之后会盖住脚，画在平台之前会被平台盖掉。 */
  drawPrints(g);
  // 前景压在地面之后（它吃掉草皮下沿）、单位之前（绝不挡角色和球）。
  // 顺序错了会直接毁掉玩法可读性：草挡住球，玩家就不知道球落没落地。
  drawForegroundSoft(g);

  // 尘土：属于地面，必须在单位之前。画在球后面 = 球压着尘土滚过去，
  // 画在球前面 = 烟雾糊脸 —— 后者看起来像特效坏了。
  drawDust(g);

  /* 深巢的暗罩：盖住所有**世界**（背景 / 地面 / 平台 / 前景 / 尘土），
     但不盖角色和球 —— 它们在这之后画，所以永远亮着。
     这一步的顺序就是设计本身：球是火，人是火把，其余地方是黑的。 */
  drawNestDark(g);
  /* 底光在雾**之前**（2026-10-27 调过）。第一版放在雾之后，理由是
     "光能穿过雾"—— 实测那等于整条屏宽的地缝光把雾从下面照亮，
     没去过的地面也在发亮，雾只剩上半屏成立。
     现在光被雾衰减，真正穿透雾的只有菌光囊（`drawPodGlow` 在雾之后）——
     而它才是那个该被看见的诱饵。 */
  drawNestGlow(g);
  /* 雾：暗罩管"离你多远"，雾管"你去没去过"（含记忆）。 */
  drawNestFog(g);
  drawPodGlow(g);

  if (S.phase === "jump") {
    /* 面板第一行就把整屏铺满了（见 drawJump），所以不用管下面画过什么。
       位置必须在场景之后、drawPost 之前 —— 挪到 drawPost 后面会被
       颗粒和暗角糊一层，27 个格子的描边全部发虚。 */
    drawJump(g);
  } else if (S.phase === "play" || S.phase === "clear" || S.phase === "fail") {
    // 预测线画在关卡之上、单位之下：它属于"地形信息"，不属于"角色"
    drawShocks(g);
    if (S.phase === "play") drawAim(g);

    // 按 y 排序：后面的先画，前面的盖住后面的
    const units = [];
    /* 和台面重叠的敌人在 drawLevel 里已经画过了（要压在板后面），这里跳过，
       不然一只虫会被画两遍 —— 板后一份、板前一份，读作残影。 */
    for (const f of S.foes) {
      if (foeUnderPlat(f)) continue;
      units.push({ y: f.y, d: () => drawFoe(g, f) });
    }
    for (const b of S.balls) units.push({ y: b.y, d: () => drawBall(g, b) });
    if (S.p && !S.p.dead) units.push({ y: S.p.y, d: () => {
      const p = S.p, H = HEROES[p.hero];
      if (p.invT > 0 && Math.floor(S.t * 20) % 2 === 0) {
        // 无敌闪烁：半透明，不是消失 —— 消失会让人以为死了
        g.globalAlpha = 0.45;
      }

      /* ---- 施法动作 ----
         立绘是静态站姿。脚钉在地上，上身只轻轻前倾，出手靠手上的光来读。
         整个人朝前甩出去会像被弹了一下，和"放个技能"对不上。

         切变比旋转好：旋转会把脚也转走。系数留得很小，只让肩膀动。 */
      const ck = p.castAnim > 0 ? 1 - p.castAnim / CAST_T : -1;
      let lean = 0;
      if (ck >= 0) {
        lean = ck < 0.28 ? -(ck / 0.28) : Math.pow(1 - (ck - 0.28) / 0.72, 1.5);
      }
      // 推球后坐：和施法方向相反的小幅平移
      const pb = p.pushBack > 0 ? Math.sin((p.pushBack / 0.16) * Math.PI) : 0;
      const dir = p.castAnim > 0 ? (p.castDir || p.face) : p.face;

      g.save();
      g.translate(-p.face * pb * 7, 0);

      /* 不做残影。试过一版"身后留半透明影子"，截图里读起来就是两只宠物，
         玩家第一反应是"出 bug 了"，不是"它在冲"。动效宁缺勿滥。 */
      if (lean !== 0) {
        /* 位移 + 切变都以脚为轴：脚钉在地上，只有上身朝 dir 甩出去。
         *
         * **切变系数必须乘 dir。** 上一版的 -lean*0.52 是常量 ——
         * 向右施法时上半身往右压（对），向左施法时身体虽然整体左移了，
         * 上半身却还是被往右推：读起来就是"人往左冲、脸朝右看"。
         */
        g.translate(p.x + dir * lean * p.w * 0.12, p.y);
        g.transform(1, 0, -lean * 0.18 * dir, 1, 0, 0);
        g.translate(-p.x, -p.y);
      }
      // 朝向也走 dir：施法这 0.26 秒里，脸的朝向和身体的倾斜必须是同一个数，
      // 分开取（一个 p.face 一个 castDir）就会出现"往左打、转过来看右边"。
      const stepping = p.onGround && p.dashT <= 0 && Math.abs(p.vx) > 40;
      drawPet(g, p.x, p.y, p.w, p.h, H, dir, {
        // 前冲段再压一点：形变比位移更容易读成"发力"，而且不用改立绘
        squash: (p.onGround ? 0 : (p.vy < 0 ? -0.16 : 0.12)) + Math.max(0, lean) * 0.06,
        flash: p.castAnim > 0 && ck > 0.24 && ck < 0.6 ? 0.42 : 0,
        belly: 0.15 + 0.85 * clamp(S.belly / 100, 0, 1),
        mood: bellyTier() === 0 ? 1 : bellyTier() === 1 ? 0.22 : 0,
        stepping: stepping,
        gait: stepping ? p.walkPhase : 0,
      });
      g.restore();
      g.globalAlpha = 1;

      // 出手光：手的位置炸一圈十字光。**画在身前** ——
      // 它同时也是朝向的读数，正脸立绘翻面看不出来，光的方向一眼就看得出来。
      if (ck >= 0.16 && ck < 0.72) {
        const k = (ck - 0.16) / 0.56;
        const hx = p.x + dir * (p.w * 0.5 + k * 16);
        const hy = p.y - p.h * 0.60;
        const rr2 = 8 + k * 15;
        g.globalAlpha = (1 - k) * 0.9;
        // 先画一圈暖色外描边再画白十字：纯白十字在浅绿草地上读不出来
        for (const [col, lw] of [["#FFB43C", 5.4 * (1 - k * 0.5)], ["#FFFFFF", 2.4 * (1 - k * 0.5)]]) {
          g.strokeStyle = col;
          g.lineWidth = lw;
          g.lineCap = "round";
          for (let i = 0; i < 4; i++) {
            const a = i * Math.PI / 2 + 0.78;
            g.beginPath();
            g.moveTo(hx + Math.cos(a) * rr2 * 0.42, hy + Math.sin(a) * rr2 * 0.42);
            g.lineTo(hx + Math.cos(a) * rr2, hy + Math.sin(a) * rr2);
            g.stroke();
          }
        }
        g.fillStyle = "#FFFFFF";
        g.beginPath();
        g.arc(hx, hy, 4 * (1 - k * 0.45), 0, 6.283);
        g.fill();
        g.globalAlpha = 1;
      }

      // 冲撞的方向指示
      if (p.dashT > 0) {
        g.strokeStyle = "rgba(200,245,180,.5)";
        g.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
          g.beginPath();
          g.moveTo(p.x - p.face * (18 + i * 12), p.y - p.h * 0.5 - 4 + i * 5);
          g.lineTo(p.x - p.face * (28 + i * 12), p.y - p.h * 0.5 - 4 + i * 5);
          g.stroke();
        }
      }
    }});

    units.sort((a, b) => a.y - b.y);
    for (const u of units) u.d();

    /* ---- 它说的话，和它的饿 ----
       都画在单位之上、跟着玩家走。挂在 HUD 上就变成"一条状态"，跟着人走才是"它在说"。 */
    if (S.p && !S.p.dead) {
      const p = S.p;

      // 台词气泡。开头 0.14s 弹入、结尾 0.35s 淡出 —— 直接出现/消失像 UI 弹窗
      if (S.say.life > 0) {
        const a = clamp(S.say.life / 0.35, 0, 1) * clamp(S.say.t / 0.14, 0, 1);
        drawBubble(g, p.x, p.y - p.h - 32, S.say.txt, a);
      }

      if (bellyTier() === 0) {
        // 肚子叫：每 4 秒一圈从肚子上扩散出去。纯视觉的"咕"，不用写一个字
        const ph = (S.t % 4) / 4;
        if (ph < 0.26) {
          const k = ph / 0.26;
          g.globalAlpha = (1 - k) * 0.34;
          g.strokeStyle = "#FFCFA8";
          g.lineWidth = 2;
          g.beginPath();
          g.ellipse(p.x, p.y - p.h * 0.34, 12 + k * 28, 8 + k * 19, 0, 0, 6.283);
          g.stroke();
          g.globalAlpha = 1;
        }
        // 饿牌挂在**肚子旁边**，不挂头顶 —— 头顶是台词气泡的地盘，
        // 两样都在上面必然叠成一坨。挂在肚子上语义也对：它表达的是"肚子饿"。
        const bx = p.x - p.face * (p.w * 0.5 + 14);
        const by = p.y - p.h * 0.34 + Math.sin(S.t * 2.2) * 2.5;
        g.globalAlpha = 0.58 + 0.24 * Math.sin(S.t * 3.1);
        g.fillStyle = "rgba(14,26,20,.92)";
        g.beginPath(); g.arc(bx, by, 10, 0, 6.283); g.fill();
        g.strokeStyle = "rgba(255,170,140,.72)";
        g.lineWidth = 1.4;
        g.beginPath(); g.arc(bx, by, 10, 0, 6.283); g.stroke();
        g.fillStyle = "#FFC7A8";
        g.font = "bold 11px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
        g.textAlign = "center";
        g.textBaseline = "middle";
        g.fillText("饿", bx, by + 0.5);
        g.globalAlpha = 1;
      }
    }

    for (const s of S.shots) drawShot(g, s);
    // 敌方弹幕画在单位之上：它比角色快得多，压在角色下面会"从身体里冒出来"
    drawFoeShots(g);

    // 地上的掉落物。每一种长得不一样 —— "惊喜感"的一半来自"一眼认出这是什么"
    for (const d of S.drops) {
      if (d.taken) continue;
      const K = DROP_KINDS[d.kind] || DROP_KINDS.fruit;
      const bob = Math.sin((d.t || 0) * 4 + (d.spin || 0)) * 1.6;
      const dy = d.y + bob;

      // 落地一圈微光，草丛里也能看见
      const glow = g.createRadialGradient(d.x, dy, 1, d.x, dy, 16);
      glow.addColorStop(0, K.ring);
      glow.addColorStop(1, "rgba(255,255,255,0)");
      g.globalAlpha = 0.42;
      g.fillStyle = glow;
      g.beginPath();
      g.arc(d.x, dy, 16, 0, 6.283);
      g.fill();
      g.globalAlpha = 1;

      // 宝箱：金色箱子 + 深色包边 + 中间的锁扣，比其它掉落大一圈。
      // 大一圈是必要的 —— 它需要"被一眼看见"，而不是"被捡到的时候才发现"。
      if (d.kind === "chest") {
        const bw = 30, bh = 18;
        const lid = 3 + Math.sin((d.t || 0) * 3.2) * 1.6;
        g.fillStyle = "rgba(58, 36, 18, .28)";
        g.beginPath();
        g.ellipse(d.x, dy + 16, 16, 4, 0, 0, 6.283);
        g.fill();
        g.fillStyle = "#C4843A";
        rr(g, d.x - bw / 2, dy - 2, bw, bh, 4);
        g.fill();
        g.strokeStyle = "#5C3A16";
        g.lineWidth = 2.2;
        g.stroke();
        g.fillStyle = "#E8B45A";
        g.beginPath();
        g.moveTo(d.x - bw / 2 + 1, dy - 1);
        g.quadraticCurveTo(d.x, dy - 16 - lid, d.x + bw / 2 - 1, dy - 1);
        g.closePath();
        g.fill();
        g.stroke();
        g.strokeStyle = "#8A5A20";
        g.lineWidth = 2;
        g.beginPath();
        g.moveTo(d.x, dy - 12 - lid * 0.4);
        g.lineTo(d.x, dy + bh - 6);
        g.stroke();
        g.fillStyle = "#FFE9A0";
        rr(g, d.x - 4, dy + 2, 8, 8, 2);
        g.fill();
        g.strokeStyle = "#5C3A16";
        g.lineWidth = 1.4;
        g.stroke();
        g.fillStyle = "#FFF6C8";
        g.beginPath();
        g.arc(d.x - 8, dy - 8 - lid, 3.2, 0, 6.283);
        g.arc(d.x + 7, dy - 6 - lid, 2.4, 0, 6.283);
        g.fill();
        continue;
      }

      if (d.kind === "gem") {
        g.fillStyle = K.color;
        g.beginPath();
        g.moveTo(d.x, dy - 11); g.lineTo(d.x + 8, dy); g.lineTo(d.x, dy + 11); g.lineTo(d.x - 8, dy);
        g.closePath(); g.fill();
        g.fillStyle = "rgba(255,255,255,.75)";
        g.beginPath();
        g.moveTo(d.x, dy - 8); g.lineTo(d.x + 4, dy - 1); g.lineTo(d.x, dy + 2); g.lineTo(d.x - 4, dy - 1);
        g.closePath(); g.fill();
      } else if (d.kind === "air") {
        g.fillStyle = K.color;
        rr(g, d.x - 7, dy - 10, 14, 20, 5);
        g.fill();
        g.fillStyle = "rgba(255,255,255,.8)";
        rr(g, d.x - 3, dy - 6, 4, 10, 2);
        g.fill();
      } else if (d.kind === "heart") {
        g.fillStyle = K.color;
        g.beginPath();
        g.arc(d.x - 5, dy - 3, 5.4, 0, 6.283);
        g.arc(d.x + 5, dy - 3, 5.4, 0, 6.283);
        g.fill();
        g.beginPath();
        g.moveTo(d.x - 10, dy - 1); g.lineTo(d.x, dy + 10); g.lineTo(d.x + 10, dy - 1);
        g.closePath(); g.fill();
      } else if (d.kind === "berry") {
        g.fillStyle = K.color;
        for (const [ox, oy] of [[-5, 2], [5, 2], [0, -5]]) {
          g.beginPath(); g.arc(d.x + ox, dy + oy, 6, 0, 6.283); g.fill();
        }
        g.fillStyle = "rgba(255,255,255,.6)";
        g.beginPath(); g.arc(d.x - 6, dy - 6, 1.8, 0, 6.283); g.fill();
      } else {
        g.fillStyle = K.color;
        g.beginPath(); g.arc(d.x, dy, 7.5, 0, 6.283); g.fill();
        g.fillStyle = "#5DA84E";
        g.beginPath(); g.ellipse(d.x + 3, dy - 7, 5, 2.6, -0.5, 0, 6.283); g.fill();
      }
    }

    // 粒子
    for (const f of S.frags) {
      g.globalAlpha = clamp(f.life / f.max, 0, 1);
      g.fillStyle = f.color;
      g.beginPath();
      g.arc(f.x, f.y, f.r, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;

    /* 落雪画在"所有场景元素之后、飘字和 HUD 之前"。
       放这一层的理由：雪是**空气**，它该盖住地形和角色；
       但飘字和 HUD 是**信息**，雪盖上去就是拿可读性换氛围 —— 不接受。
       非雪地主题在函数第一行就 return，零开销。 */
    drawSnowfall(g);

    // 飘字只在战斗阶段画。结算面板有自己的大字，
    // 两者叠在一起会糊成一团（"空地清干净了"压在"满载而归"上）。
    g.textAlign = "center";
    g.textBaseline = "middle";
    for (const t of (S.phase === "play" ? S.texts : [])) {
      const k = clamp(t.life / t.max, 0, 1);
      g.globalAlpha = k < 0.3 ? k / 0.3 : 1;
      g.font = "bold " + t.size + "px 'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
      /* 浮字不许出屏。锚点是敌人/事件位置，靠边的敌人（BOSS 站在左上角、
         营地里的小怪）会把整句推出屏幕外 —— 长文案直接少半句。
         `幼虫钻出 · 回巢给 BOSS 补壳` 这种 13 字的尤其明显：
         BOSS 在 x=150 时字头已经贴到 x=40，在 x=100 时就出界了。
         字比屏幕还宽时退化成居中，否则 clamp 的 lo>hi 会算出负数。 */
      const halfW = g.measureText(t.txt).width / 2;
      const lo = halfW + 10, hi = W - halfW - 10;
      const tx = lo > hi ? W / 2 : clamp(t.x, lo, hi);
      g.lineWidth = 4;
      g.strokeStyle = "rgba(18,26,20,.82)";
      g.strokeText(t.txt, tx, t.y);
      g.fillStyle = t.color;
      g.fillText(t.txt, tx, t.y);
    }
    g.globalAlpha = 1;

    // HUD 只在战斗阶段画。结算时压暗层会把它压成两块灰面板，
    // 和中间那张亮白卡片并排，读起来像"两个坏掉的控件"。
    if (S.phase === "play") drawHUD(g);

    // 受伤闪红
    if (S.flash > 0) {
      g.fillStyle = "rgba(255,80,70," + (S.flash * 0.5).toFixed(3) + ")";
      g.fillRect(0, 0, W, H);
    }

    // 结算
    if (S.phase === "clear" || S.phase === "fail") {
      const ok = S.phase === "clear";
      const cx = W / 2;
      const st = curStage();

      // 先整体压暗，再盖一张实心卡片。
      // 只压暗不盖卡片的话，平台木条和敌人会直接穿过结算文字 ——
      // 截图里"造球 4 · 崩开 0"那行正好压在木条上，读不出来。
      //
      // 奶油面板自带奶白底 + 棕描边 + 投影，压暗不用那么重：
      // 压到 0.9 的话，后面那片森林全黑，一张奶白卡片浮在纯黑上，
      // 和主界面那套奶油风断成两个游戏。压到 0.62 还看得见"我在哪一关"。
      const K = hudSkin();
      /* 压暗必须是**两段**：先纯黑压明度，再冷调压色相。
       *
       * 单段半透明色压不掉色相 —— 这是这一版踩到的坑：`rgba(9,12,11,.52)`
       * 单看是中性的，压在第四关的橙黄天空上算出来是 (86,76,61)，一片暖棕，
       * 奶油卡（奶白）浮在上面，整块读成"棕色相框"，和主界面断成两个游戏。
       *
       * 顺序也不能倒：先冷调后黑，橙色被黑白 .35 一提亮，再叠冷色只会更灰；
       * 先黑后冷，黑先把橙压到 (130,97,71)，冷调 .45 一盖，三通道收敛到 ≈(80,71,66)，
       * 才是真的"中性暗"。 */
      g.fillStyle = ok ? "rgba(0,0,0,.35)" : "rgba(14,0,0,.37)";
      g.fillRect(0, 0, W, H);
      g.fillStyle = ok ? "rgba(20,40,60,.45)" : "rgba(60,20,34,.45)";
      g.fillRect(0, 0, W, H);

      /* ---------------- 结算卡 ----------------
       *
       * 版式只有一条原则：**评级是主角，其余全是配角。**
       *
       * 上一版是"十几行平铺"：关卡名 25px、评级字母 22px、其余 13~15px，
       * 字号差不到 2 倍，眼睛没有落点 —— 得从上往下逐行读完，才知道自己打了多少。
       * 结算页的职责是**在一秒内让人知道"这局什么水平"**，不是信息汇总。
       *
       * 这一版三件事：
       *   ① 评级放到卡片正中（y=+136），92px 字母 + 徽章 + 外发光，独占一层；
       *   ② 信息从 11 块砍到 6 块：删「过关」（有评级就是过关了）、
       *      删下一关预告（马上就会玩到，不构成决策）、
       *      删肚子进度条（继续按钮的副标题已经会说"它又饿了"，重复）、
       *      「这一趟走了几关」压成右上角一个角标；
       *   ③ 数据行换成 **S 的两个条件并排**（用时 / 用球）。
       *      原来写"送走 10 / 10 只" —— 过关时它恒等于满分，等于没写；
       *      换成两个条件之后，"A 为什么不是 S"一眼可解，这才是"再打一次"的理由。
       */
      const cardY = CARD_Y, cardH = CARD_H;
      const cardX = cx - CARD_W / 2;
      const FONT = "'Microsoft YaHei','PingFang SC','Hiragino Sans GB',system-ui,sans-serif";
      creamCard(g, cardX, cardY, CARD_W, cardH, 26);

      g.textAlign = "center";
      g.textBaseline = "middle";

      /* ---------------- 新伙伴到家（挂在卡片上方） ----------------
       *
       * **为什么在卡片外面。** 卡里 570×412 已经排满了：
       *   24 角标 / 50 关卡名 / 70 分隔线 / 140 评级 / 214 三星 /
       *   252 它说 / 276 分隔线 / 302+326 数据 / 350+ 按钮
       * 硬挤一行进去只能压评级区，而评级是这一页的主角。
       * 挂在卡片上方不动任何已有元素，而且那里全屏最靠上 ——
       * 底下是压暗层（深色），金底贴纸的对比度天然够。
       *
       * 这是整局游戏里**唯一会主动说"你刚多了一个伙伴"的地方**。
       * recordClear 那条 DOM 提示只在 ?from=home 弹、3.6 秒消失，
       * 而推关模式（nextLevel 直接进下一关）根本不回主界面 ——
       * 玩家通了第 8 关、星屑到家，屏幕上却什么都没发生。
       *
       * 贴纸语言和「新纪录」一致（斜贴），但角度只有 -0.055 rad：
       * 那是标签的角度，不是横幅的角度，歪太多读起来像贴歪了。
       */
      if (ok && S.unlocked && S.unlocked.length) {
        const nm = S.unlocked.map(id => HERO_CN[id] || id).join(" · ");
        const txt = "新伙伴到家 · " + nm;
        g.font = "bold 15px " + FONT;
        const tw = g.measureText(txt).width;
        const bw = tw + 78, bh = 34;              // 78 = 头位 + 左右内边距
        const by = cardY - 42;

        g.save();
        g.translate(cx, by + bh / 2);
        g.rotate(-0.055);

        // 投影 → 金底 → 深棕描边 → 顶部高光
        g.fillStyle = "rgba(56,32,8,.34)";
        rr(g, -bw / 2, -bh / 2 + 4, bw, bh, bh / 2);
        g.fill();
        g.fillStyle = "#FFCE56";
        rr(g, -bw / 2, -bh / 2, bw, bh, bh / 2);
        g.fill();
        g.strokeStyle = "#8A5208";
        g.lineWidth = 2.4;
        rr(g, -bw / 2, -bh / 2, bw, bh, bh / 2);
        g.stroke();
        g.fillStyle = "rgba(255,248,200,.60)";
        rr(g, -bw / 2 + 6, -bh / 2 + 3, bw - 12, bh * 0.40, bh * 0.20);
        g.fill();

        // 头像：只放第一只。一次通关最多跨过一个阈值（UNLOCK_AT 里没有相邻数），
        // 所以这里实际上恒为 1 只，写 "第一只" 是做兜底。
        const hd = artOf("head-" + S.unlocked[0]);
        const hx = -bw / 2 + 17;
        if (hd) {
          g.save();
          g.beginPath();
          g.arc(hx, 1, 11, 0, 6.283);
          g.clip();
          g.drawImage(hd, hx - 11, -10, 22, 22);
          g.restore();
          g.strokeStyle = "#8A5208";
          g.lineWidth = 1.8;
          g.beginPath();
          g.arc(hx, 1, 11, 0, 6.283);
          g.stroke();
        }

        g.textAlign = "left";
        g.fillStyle = "#5A3407";
        g.font = "bold 15px " + FONT;
        g.fillText(txt, hx + 18, 1);
        g.restore();
        g.textAlign = "center";
        g.textBaseline = "middle";
      }

      // ---- 顶部两个角标：产地屏序 / 这一趟连走了几屏 ----
      // 角标同样走章节口径，理由见 drawHUD 顶部那段。
      g.fillStyle = K.ink3;
      g.font = "12px " + FONT;
      g.textAlign = "left";
      {
        /* 角标只报「产地 第 N 屏」，不报「N / 本章屏数」——
           2026-10-26 用户：「我不想暴露最大关卡 只显示当前进度即可」。
           深巢报「深巢 · 深度 N」：层号是另一条轴，混进屏序会读成主线进度。 */
        if (S.nest) {
          g.fillText("深巢 · 深度 " + S.nest.depth, cardX + 30, cardY + 24);
        } else {
          const ch = chapterOfStage(S.stage);
          g.fillText(ch.name + " · 第 " + (S.stage - ch.from + 1) + " 屏",
                     cardX + 30, cardY + 24);
        }
      }
      if (S.trip.stages > 1) {
        g.textAlign = "right";
        g.fillText((S.nest ? "连沉 " + S.trip.stages + " 层" : "连走 " + S.trip.stages + " 屏"),
                   cardX + CARD_W - 30, cardY + 24);
      }

      // ---- 关卡 · 目标 ----
      g.textAlign = "center";
      g.fillStyle = K.ink;
      g.font = "bold 21px " + FONT;
      g.fillText(st.name + "　·　" + (curGoal().title || curGoal().name), cx, cardY + 50);

      g.strokeStyle = K.cream ? "rgba(120,92,64,.22)" : "rgba(255,255,255,.10)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(cardX + 40, cardY + 70);
      g.lineTo(cardX + CARD_W - 40, cardY + 70);
      g.stroke();

      /* ---- 评级：整个画面最大的东西 ----
       * 弹入靠 S.settleT：0.3 秒内 0.55 → 1.0，中途过冲到 ≈1.06。
       * 静止的大字只是"大"，弹一下才是"刚刚发生了一件事"。
       * 过冲必须有但只能一点点 —— 弹成橡皮球就变成玩具，不是成绩。 */
      const et = clamp((S.settleT || 0) / 0.30, 0, 1);
      const punch = et >= 1 ? 1 : 0.55 + 0.45 * et + Math.sin(et * Math.PI) * 0.10;
      const rankY = cardY + 140;

      if (ok) {
        const rk = rate();
        /* 三档配色：S 金 / A 绿 / B 青灰。
         *
         * **不能用灰褐。** 第一版 B 给的是 #E0D0B6→#5E4A34（米褐），
         * 在奶白卡上整颗徽章读起来像"没上色的 S"，第一反应是渲染坏了，
         * 而不是"这局只拿了 B"。评级必须一眼能认出"这是个评级"。
         * 也不能用红 —— 红是失败色，B 是过了，只是没过好。
         *
         * 同理**不能靠压暗区分档次**：B 也必须是能读的颜色，
         * 它只代表"这局没打好"，不代表"你不配拿评级"。 */
        const skin = rk === "S" ? ["#FFE487", "#F0A81E", "#8A5208"]
                   : rk === "A" ? ["#BCEB80", "#5EA82E", "#2F5E14"]
                                : ["#BFDCEA", "#6FA8C4", "#2E5468"];

        g.save();
        g.translate(cx, rankY);
        g.scale(punch, punch);

        // 外发光：比徽章大一圈的径向渐变。
        // 没有它，徽章只是"一个黄圆"；有了它，评级才像在发光。
        const glow = g.createRadialGradient(0, 0, 38, 0, 0, 130);
        glow.addColorStop(0, rk === "S" ? "rgba(255,206,84,.36)" : "rgba(255,236,190,.26)");
        glow.addColorStop(1, "rgba(255,220,140,0)");
        g.fillStyle = glow;
        g.beginPath();
        g.arc(0, 0, 126, 0, Math.PI * 2);
        g.fill();

        // 徽章：投影 → 渐变圆 → 深棕描边 → 顶部高光弧（让圆"鼓"起来）
        g.fillStyle = "rgba(56,32,8,.30)";
        g.beginPath();
        g.arc(0, 5, 50, 0, Math.PI * 2);
        g.fill();

        const bg = g.createRadialGradient(0, -18, 4, 0, 0, 52);
        bg.addColorStop(0, skin[0]);
        bg.addColorStop(0.70, skin[1]);
        bg.addColorStop(1, skin[2]);
        g.fillStyle = bg;
        g.beginPath();
        g.arc(0, 0, 50, 0, Math.PI * 2);
        g.fill();

        g.strokeStyle = skin[2];
        g.lineWidth = 3.6;
        g.beginPath();
        g.arc(0, 0, 50, 0, Math.PI * 2);
        g.stroke();

        g.strokeStyle = "rgba(255,255,255,.50)";
        g.lineWidth = 3.4;
        g.beginPath();
        g.arc(0, -1, 40, Math.PI * 1.12, Math.PI * 1.70);
        g.stroke();

        // 字母：白字 + 深棕粗描边。和按钮、面板同一套"贴纸"语言 ——
        // 只填白色的话，它在金色底上是一块没有轮廓的白斑。
        g.lineJoin = "round";
        g.strokeStyle = skin[2];
        g.lineWidth = 5;
        g.font = "bold 86px " + FONT;
        g.strokeText(rk, 0, 4);
        g.fillStyle = "#FFFDF4";
        g.fillText(rk, 0, 4);
        g.restore();

        // ---- 三星：S 三颗 / A 两颗 / B 一颗，够不着的压到 0.18 ----
        // 星是"做到多少"的读数，比字母直觉 —— 字母要靠记住 S/A/B 的顺序。
        const starArt = artOf("ui-star");
        const nStar = rk === "S" ? 3 : rk === "A" ? 2 : 1;
        const sy = cardY + 214;
        for (let i = 0; i < 3; i++) {
          const it = clamp(((S.settleT || 0) - 0.22 - i * 0.07) / 0.16, 0, 1);
          const sc = it >= 1 ? 1 : 0.4 + 0.6 * it + Math.sin(it * Math.PI) * 0.22;
          const sx = cx + (i - 1) * 34;
          g.globalAlpha = i < nStar ? 1 : 0.22;
          if (starArt) {
            const s = 28 * sc;
            g.drawImage(starArt, sx - s / 2, sy - s / 2, s, s);
          } else {
            g.fillStyle = i < nStar ? skin[1] : "rgba(0,0,0,.14)";
            g.beginPath();
            g.arc(sx, sy, 10 * sc, 0, Math.PI * 2);
            g.fill();
          }
        }
        g.globalAlpha = 1;

        /* ---- 新纪录：贴在徽章右上角，转 -9 度 ----
         * 斜贴是为了**不占垂直空间** —— 放正下方的话，没有新纪录时那一行会留个洞，
         * 布局随纪录有无而跳动。贴纸式的好处是"有没有都不影响其它东西在哪"。
         *
         * 文案只给"新纪录/首次记录"两种：比上次好才叫纪录，
         * 打平不叫（打平就没人想继续刷了）。 */
        /* 深巢不贴这张纸。它没有"这一屏的最佳纪录"——`S.rankPrev` 在深巢恒为
           `""`，于是 `!== rk` 恒真，每层都贴一张"首次记录"，读起来像系统坏了。
           深巢的成绩是**深度**，不是评级纪录。 */
        if (!S.nest && S.rankPrev !== rk) {
          g.save();
          g.translate(cx + 58, rankY - 46);
          g.rotate(-0.16);
          const tag = S.rankPrev ? "新纪录" : "首次记录";
          g.font = "bold 13px " + FONT;
          const tw = g.measureText(tag).width + 20;
          g.fillStyle = "rgba(56,32,8,.24)";
          rr(g, -tw / 2, -9, tw, 20, 10);
          g.fill();
          g.fillStyle = "#FFC93C";
          rr(g, -tw / 2, -11, tw, 20, 10);
          g.fill();
          g.strokeStyle = "#8A5208";
          g.lineWidth = 2;
          rr(g, -tw / 2, -11, tw, 20, 10);
          g.stroke();
          g.fillStyle = "#5A3407";
          g.fillText(tag, 0, 0);
          g.restore();
        }

        /* ---- 评级奖励回执 ----
         * 「机制做了 ≠ 玩家看得见」是这个项目反复栽的坑（机制没画 / HUD 没读 pr.text）。
         * 材料已经在 `S.trip.rankLogs` 里累加了，但玩家在结算卡上不看见，
         * 就等于没给 —— 所以这一行不是装饰，是这件事的**唯一可见出口**。
         * 只在新纪录 / 首次记录时出现：没刷新纪录不给，也就不显示。 */
        if (S.rankGain > 0) {
          g.save();
          g.font = "bold 13px " + FONT;
          g.fillStyle = K.cream ? "#3F6B2A" : "#BFE8A8";
          g.fillText("材料 +" + S.rankGain, cx, rankY + 46);
          g.restore();
        }
      } else {
        /* ---- 失败：没有评级可给，但也不能只写两字 ----
         * 「没做到」+ 一句为什么。评级是奖励不是羞辱，所以失败态
         * 一个字都不提 S/A/B —— 提了就是在往伤口上写分数。 */
        /* 失败态没有徽章撑着，字必须自己扛住那个位置：
           44px 落在 90~190 的评级区里会显得"上面空一截、下面挤一句"。
           用 60px + 把重心压到评级区中线（+152），视觉重量才对得上成功态的徽章。 */
        g.fillStyle = K.cream ? "#B0453A" : "#FF9E8E";
        g.font = "bold 60px " + FONT;
        g.fillText("没做到", cx, rankY + 12);
        g.fillStyle = K.ink2;
        g.font = "15px " + FONT;
        g.fillText(S.failWhy || "饿晕了…", cx, rankY + 66);
      }

      /* ---- 它说 ----
         性格不能只活在门口那 1.6 秒。这里是玩家**一定会看**的地方，
         所以那句"邀功 / 求饶"放这儿，比在战斗中冒泡更管用。
         新版把它当**评语**用：紧贴在星星下面，读起来就是"它对这局的反应"。 */
      const said = finishSay(ok);
      g.fillStyle = K.cream ? "#8A5716" : "rgba(255,233,176,.92)";
      g.font = "bold 15px " + FONT;
      g.fillText(HEROES[S.heroIdx].name + "：「" + said + "」", cx, cardY + 252);

      g.strokeStyle = K.cream ? "rgba(120,92,64,.26)" : "rgba(255,255,255,.10)";
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(cardX + 70, cardY + 276);
      g.lineTo(cardX + CARD_W - 70, cardY + 276);
      g.stroke();

      /* ---- 数据：S 的两个条件并排 ----
       *
       * 左边用时、右边用球，各自"实测值"在上、"S 线"在下。
       * **达标染绿、没过染红** —— 这一格颜色就是"为什么不是 S"的答案。
       *
       * 差值只写在**够得着**的时候（超 S 线 20% 以上不显示）。
       * 阈值用比例不用绝对值：各关 par 从 60 到 135 秒不等，
       * 写死 12 秒的话第 1 关很宽容、最后一关永远不显示。
       * 差 5 倍的局说"差 18 秒"不是激励，是提醒他这局打得很烂。 */
      const colA = cx - 128, colB = cx + 128;
      const pT = st.par.time, pM = st.par.made;

      if (ok) {
        const tOK = S.playT <= pT;
        const mOK = S.stat.made <= pM;
        const dT = S.playT - pT;
        const nearMiss = dT > 0.05 && dT <= pT * 0.2;

        g.fillStyle = tOK ? K.good : K.ink;
        g.font = "bold 22px " + FONT;
        g.fillText(S.playT.toFixed(1) + "s", colA, cardY + 302);
        g.fillStyle = K.cream ? "rgba(74,53,36,.52)" : "rgba(200,230,200,.55)";
        g.font = "12px " + FONT;
        g.fillText("用时　S 线 " + pT.toFixed(1) + "s" +
                   (nearMiss ? "（差 " + dT.toFixed(1) + "s）" : ""), colA, cardY + 326);

        g.fillStyle = mOK ? K.good : (K.cream ? "#B0453A" : "#FF9E8E");
        g.font = "bold 22px " + FONT;
        g.fillText(S.stat.made + " 颗", colB, cardY + 302);
        g.fillStyle = K.cream ? "rgba(74,53,36,.52)" : "rgba(200,230,200,.55)";
        g.font = "12px " + FONT;
        g.fillText("用球　S 线 " + pM + " 颗", colB, cardY + 326);
      } else {
        // 失败态没有"S 线"可言：没打完，比线没有意义。
        g.fillStyle = K.ink;
        g.font = "bold 22px " + FONT;
        g.fillText(S.killed + " / " + S.total + " 只", colA, cardY + 302);
        g.fillStyle = K.cream ? "rgba(74,53,36,.52)" : "rgba(200,230,200,.55)";
        g.font = "12px " + FONT;
        g.fillText("送走", colA, cardY + 326);

        g.fillStyle = K.ink;
        g.font = "bold 22px " + FONT;
        g.fillText(S.playT.toFixed(1) + "s", colB, cardY + 302);
        g.fillStyle = K.cream ? "rgba(74,53,36,.52)" : "rgba(200,230,200,.55)";
        g.font = "12px " + FONT;
        g.fillText("用时", colB, cardY + 326);
      }

      /* ---- 三颗星靶 ----
       * 「机制做了 ≠ 玩家看得见」在这个项目栽过五次。靶的判定、落盘、
       * 奖励全在 recordStar 里跑完了，但结算卡上不画，玩家就以为
       * 「那三个东西跟我没关系」。所以这一行不是装饰，是星靶的
       * **唯一可见出口**（图鉴是回看，这里是当场）。
       *
       * 三态分色，不是两态：
       *   金底 ✓ = 这一趟**新**打出来的（fresh）
       *   绿底 ✓ = 早就有了（这趟又满足一次）
       *   灰底 — = 没做到
       * 只有两态（✓/✗）的话，"早就有了"和"刚拿到"长得一样，
       * 而这两个对玩家的意义完全相反。 */
      {
        const srow = S.nest ? [] : (STAR_OF_STAGE[S.stage] || []);
        if (srow.length) {
          const PW = 156, PH = 30, PG = 11;
          const py = cardY + 352;
          const totalW = srow.length * PW + (srow.length - 1) * PG;
          let px = cx - totalW / 2;
          for (const id of srow) {
            const nm = STAR_CN[id] || id;
            const met = S.starMet.indexOf(id) >= 0;
            const fresh = S.starFresh.indexOf(id) >= 0;
            g.save();
            g.translate(px + PW / 2, py + PH / 2);
            // 底：投影 → 填充 → 描边。三态各自一套颜色，深浅都读得出来。
            g.fillStyle = "rgba(56,32,8,.16)";
            rr(g, -PW / 2, -PH / 2 + 3, PW, PH, PH / 2);
            g.fill();
            g.fillStyle = fresh ? "#FFD86B"
                       : met ? (K.cream ? "#D9E9B4" : "rgba(150,196,116,.30)")
                             : (K.cream ? "rgba(120,92,64,.10)" : "rgba(255,255,255,.08)");
            rr(g, -PW / 2, -PH / 2, PW, PH, PH / 2);
            g.fill();
            g.strokeStyle = fresh ? "#8A5208"
                       : met ? (K.cream ? "#5E7E33" : "rgba(178,222,140,.55)")
                             : (K.cream ? "rgba(120,92,64,.34)" : "rgba(255,255,255,.20)");
            g.lineWidth = fresh ? 2.2 : 1.6;
            rr(g, -PW / 2, -PH / 2, PW, PH, PH / 2);
            g.stroke();
            // 标记：✓ / —。画在名字左边，不占名字的居中位。
            g.textAlign = "center";
            g.textBaseline = "middle";
            g.font = "bold 14px " + FONT;
            g.fillStyle = fresh ? "#5A3407"
                       : met ? (K.cream ? "#3F6B2A" : "#BFE8A8")
                             : (K.cream ? "rgba(74,53,36,.42)" : "rgba(255,255,255,.36)");
            g.fillText(fresh || met ? "✓" : "—", -PW / 2 + 18, 1);
            g.font = "bold 13px " + FONT;
            g.fillText(nm, 10, 1);
            g.restore();
            px += PW + PG;
          }
          g.textBaseline = "alphabetic";

          /* ---- 奖励回执 ----
             只有**新**达成才出现。没拿到东西的时候写一行"碎片 +0"
             是噪音；而拿到了不写，玩家收工时看到材料涨了却不知道是哪来的。
             和评级那行「材料 +N」同一条原则。 */
          if (S.starFresh.length) {
            g.textAlign = "center";
            g.fillStyle = K.cream ? "#3F6B2A" : "#BFE8A8";
            g.font = "bold 13px " + FONT;
            const gg = S.starGain || { shards: 0, logs: 0 };
            g.fillText("新摘到 " + S.starFresh.length + " 颗星星 · 碎片 +" +
                       gg.shards + " · 材料 +" + gg.logs, cx, cardY + 400);
          }
        } else if (S.nest) {
          /* ---- 深巢没有星靶 —— 但这一行不能空着 ----
           * 直接跳过的话卡面会在 352~400 之间空出 48px，和按钮之间多一道白沟，
           * 读起来像"图没加载完"，而不是"这里本来就没内容"。
           *
           * 换成「这一趟的账」：送走几只 / 带回多少 / 历史最深。
           * 三件都是**出了这一层就再也看不到**的数 —— 深巢没有星靶可刷、
           * 没有纪录可比，账单就是它的成绩单。这比硬塞三颗主线星靶诚实得多。 */
          g.textAlign = "center";
          g.textBaseline = "alphabetic";
          g.fillStyle = K.cream ? "rgba(74,53,36,.62)" : "rgba(255,255,255,.62)";
          g.font = "bold 13px " + FONT;
          /* 第三件从「最深第 N 层」换成「巢币 +K」（2026-10-27）。
             理由：最深层在出征页的门上已经报过，而巢币是**这一趟才挣到的**，
             出了这张卡就没有第二处能看见它 —— 玩家会不知道那 30 枚哪来的。
             宽度也刚好：原来那一串是最长的，「巢币 +K」比它短。 */
          const coinGain = Math.max(0, Math.round(S.trip.nestCoins || 0));
          g.fillText("送走 " + S.killed + " 只　·　收成 " +
                     Math.round(S.trip.loot) + " 果　·　巢币 +" + coinGain,
                     cx, cardY + 367);
        }
      }

      /* ---- 两个按钮：继续（贪） / 收工（稳） ----
         默认高亮"继续"，因为默认应该是贪 —— 玩家没选的时候，让游戏推着他往前走。
         但两个都得看得见、都得好按，不然"贪"就不是选择，是唯一路径。

         按钮用**代码画**，不贴 ui-btn：那张源图（615×96）是"出门"专用稿，
         右端带 ▶、左段有竖分隔线，缩到 196×42 后箭头被压成小三角、
         分隔线变成一道划痕 —— 看着像图没切好。通用按钮要的是"形状 + 描边"。 */
      const hov = S.hoverBtn === undefined ? -1 : S.hoverBtn;
      const drawBtn = (r, hi, main, sub, solid) => {
        const rad = r.h / 2;
        g.fillStyle = "rgba(92,58,28,.22)";
        rr(g, r.x, r.y + 3, r.w, r.h, rad);
        g.fill();

        g.fillStyle = solid ? (hi ? "#F0BC4E" : "#E5C98C") : (hi ? "#FFFBF0" : "#F2E9D6");
        rr(g, r.x, r.y, r.w, r.h, rad);
        g.fill();

        g.fillStyle = solid ? "rgba(255,236,168,.55)" : "rgba(255,255,255,.75)";
        rr(g, r.x + 5, r.y + 3, r.w - 10, r.h * 0.38, rad * 0.7);
        g.fill();

        g.strokeStyle = hi ? "#6B4A24" : "rgba(107,74,36,.62)";
        g.lineWidth = hi ? 2.6 : 2;
        rr(g, r.x, r.y, r.w, r.h, rad);
        g.stroke();

        g.textAlign = "center";
        g.fillStyle = hi ? "#4A2F10" : "rgba(74,47,16,.78)";
        g.font = "bold 16px " + FONT;
        g.fillText(main, r.x + r.w / 2, r.y + 16);
        g.fillStyle = hi ? "rgba(74,47,16,.72)" : "rgba(74,47,16,.52)";
        g.font = "10.5px " + FONT;
        g.fillText(sub, r.x + r.w / 2, r.y + 31);
      };

      const last = S.stage + 1 >= LEVELS.length;
      const B = settleBtns();
      const hiCont = hov === 0 || (hov !== 1);
      const nextMulti = Math.min(2, 1 + 0.15 * (S.trip.stages + 1));

      /* 下一关的事全塞进"继续"的副标题。
         原来卡里有一整行"2. 雪原 · 三池 · 中间一条长坡" —— 占了 24px，
         但玩家按下去就会看到那一关，它不构成任何决策。

         ---- 2026-10-24 加"力气" ----
         这一步是把一个**已经存在的代价**从隐形变成可见。
         以前按"继续"其实在掉火力（每屏 −20 饱食），但卡面只报倍率，
         玩家算的账是"继续 = 白赚 ×1.15"，于是永远继续。
         现在两个按钮的副标题一对读就是取舍：
             继续 → ×1.60 · 力气降一档
             收工 → +28 果 · 吃完回满
         这比再写一行说明文字有效 —— 说明文字没人读，按钮副标题一定被读。 */
      if (ok && !last) {
        /* 深巢的"下一关"是**下一层**。这里读 `LEVELS[S.stage + 1]` 会取到
           主线第 2 屏的屏名 —— 深巢的 `S.stage` 永远是 0，于是每层都写着
           "雪原 · …"。两条轴不能混进同一句话。 */
        /* 下一层如果有**新词条**，这一行优先报它。
           倍率和掉饱回答的是"变难多少"，词条回答的是"规矩变了" ——
           玩家按下去立刻要面对后者，而它只在这一屏说一次。 */
        const sub = S.nest
          ? (function () {
              const nx = S.nest.depth + 1;
              const prevIds = nestModsAt(nx - 1).map(function (m) { return m.id; });
              const fresh = nestModsAt(nx).filter(function (m) { return prevIds.indexOf(m.id) < 0; });
              if (fresh.length) {
