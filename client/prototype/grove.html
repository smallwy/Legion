 *  不是碰撞的问题 —— 野猪碰撞 56 宽、画 76 宽，按碰撞盒判会漏掉 10px 的边缘。
 *  BOSS 排除：天降（skyDrop）是"砸穿"不是"钻过"，被板子遮住反而说不清。
 */
function platOverFoe(f) {
  if (f.isBoss) return null;
  const fw = f.def.vw || f.def.w || 34;
  const fy = f.y - (f.def.vh || f.def.h || 28);   // 视觉框顶端
  const fb = f.y;                                 // 脚
  for (const p of PLATS) {
    if (p.kind === "ground" || isBroken(p)) continue;
    const pt = p.y, pb = p.y + (p.h || 22);
    /* 站在板顶（或者已经跳到板上面）时**不算**重叠 ——
       脚正好等于 p.y 是"站在上面"，这时候必须画在前面。 */
    if (fb <= pt || fy >= pb) continue;
    if (f.x + fw / 2 < p.x || f.x - fw / 2 > p.x + p.w) continue;
    return p;
  }
  return null;
}

function foeUnderPlat(f) { return platOverFoe(f) !== null; }

function drawLevel() {
  const g = ctx;
  // 顺序有讲究，三层各管一件事：
  //   ① 坡先画 → ② 地面盖上去（坡脚正好被草皮吃掉，不留一个"悬空的断头"）
  //   → ③ 浮空台最后画（坡顶那 26px 伸进台面里，被台面盖住 = 读成"路从台面延伸下来"）
  // 上一版是"地面 → 坡 → 台面"：坡脚压在草上，露出一截朝下的方头，
  // 看上去就是"木头架完没收拾"。把地面挪到坡后面就干净了。
  for (const r of RAMPS) drawRamp(g, r);
  for (const p of PLATS) if (p.kind === "ground") drawPlat(g, p);
  /* 碎掉的浮台**不画**。但两端要留断茬 —— 整块凭空消失读作"贴图丢了"，
     留两截参差的桩脚才读作"这块板塌了"。断茬在台面之后、材质带之前画。 */
  for (const p of BROKEN) drawBrokenPlat(g, p);
  // 材质带必须在地面之后、坑之前：坑是"地面被挖开"，理应盖住色带
  for (const gr of GROUNDS) drawGroundMat(g, gr);
  for (const pit of PITS) drawPit(g, pit);
  /* 裂缝必须在**地面之后、台面之前**：它撕开的是地面本身，
     先画会被地面盖住，后画会盖住落在缝上方的台面边缘。 */
  drawChasms(g);
  /* 正穿过台面的敌人：画在**浮空台之前**，让板子盖住它（见 foeUnderPlat 注释）。
     位置卡在"裂缝之后、台面之前"：裂缝撕的是地面、台面盖的是敌人，
     两者各管一层，挪哪边都会有一层错位。 */
  for (const f of S.foes) if (foeUnderPlat(f)) drawFoe(g, f);
  for (const p of PLATS) if (p.kind !== "ground" && !isBroken(p)) drawPlat(g, p);
  /* 板底下有东西正往上顶时，在板**顶面**画一道跟着它走的暗影。
   *
   *  **没有这一层，虫会被板整只吃掉**：虫高 28、板厚 20，压到板后面只剩
   *  几像素的边，出图读作"虫凭空消失"，等它冒出来就是"突然出现在脸上"。
   *  有了暗影，那几帧读作"下面有东西顶着" —— 它同时是**出来的预告**，
   *  和蹲身、滞空是同一套语言（都是"要来了"，只是这次从板底下）。
   *
   *  暗影画在板顶而不是板下，因为它要回答的问题是"它从哪儿出来"；
   *  画在板下就被板自己挡住了，等于没画。 */
  for (const f of S.foes) {
    const p = platOverFoe(f);
    if (!p) continue;
    const ph = p.h || 22;
    const fy = f.y - (f.def.vh || f.def.h || 28);
    const k = clamp((p.y + ph - fy) / ph, 0, 1);   // 0 = 刚进板底，1 = 顶到板面
    const cx = clamp(f.x, p.x + 12, p.x + p.w - 12);
    g.globalAlpha = 0.12 + 0.20 * k;
    g.fillStyle = "#241A10";
    g.beginPath();
    g.ellipse(cx, p.y + 2, 15 + 7 * k, 3.2 + 1.8 * k, 0, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
  }
  /* 预告层必须在**所有台面之后**：它要压在台面顶上。
     放在角色之前，免得盖住 BOSS 抬手的手臂。 */
  drawBossMarks(g);
  /* 跑道在**所有台面之后**画：它是铺在台面顶上的，先画会被台面盖住。
     又必须在坑之前……不，坑在地面上、跑道在台面上，两者不重叠，
     但跑道的序号会飘到台面上方 30px，被后画的件盖住就看不见了，
     所以放在坑之后、弹菇之前。 */
  for (let i = 0; i < TOUR.length; i++) drawTour(g, TOUR[i], i);
  for (const b of BOUNCERS) drawBouncer(g, b);
  for (const d of REFLECTS) drawReflect(g, d);
  for (const pt of PORTALS) drawPortal(g, pt);
  for (const s of S.stumps) drawStump(g, s);
  /* 菌光囊站在地面/台面上，属于**地形层** ——
     必须在角色之前，否则人会从囊的柄后面穿过去。 */
  drawPods(g);
  drawNestWalls(g);
}

/** 深巢的井壁。
 *
 *  **为什么必须有这一层**：活动区砍到 640 之后，地面只有 160..800，
 *  两侧各 134 是空的。物理没错（球被 `clamp(x, WALL_L, WALL_R)` 夹住），
 *  但第一版截图是这样的：草地浮在湖中间，一个地面块的两端凭空断掉、
 *  下面直接是背景水面 —— 玩家不会读作"这是井"，只会读作"这游戏画错了"。
 *  **物理正确 + 视觉不解释 = 看起来像 bug**，这类亏在项目里吃过很多次。
 *
 *  内缘不是直线：直线读作"贴了一张遮罩"，参差才读作岩层。
 *  轮廓用两个正弦叠加（周期 170 / 580），零状态、每帧同一结果，
 *  不需要缓存进 S，也不会在两帧之间跳。
 *
 *  基准往井内收 10px（`L-10` / `R+10`）：内缘 ±9 的抖动被这 10px 吃掉，
 *  所以永远是岩壁压住地面边缘 —— 反过来就是地面边缘露出一条 9px 的缝。
 */
function drawNestWalls(g) {
  if (!S.nest) return;
  const d = S.nest.depth || 1;
  const L = NEST.L, R = NEST.R;

  for (const side of [-1, 1]) {
    const outX = side < 0 ? 0 : W;
    const baseX = side < 0 ? L - 14 : R + 14;
    const dir = side < 0 ? 1 : -1;          // 往井内的方向
    const rnd = nestRand((d * 313 + (side < 0 ? 7 : 7177)) >>> 0);

    /* 轮廓：**每 34~80px 一段、每段一个水平偏移，段与段之间直线连接**。
     *
     * 上一版是 `sin(y*0.026)*9 + sin(y*0.069)*5` —— 两个正弦叠加，
     * 数学上"参差"，视觉上是一条**平滑的波浪**。截图里读作两根竖立的
     * 肠子：平滑曲线不会出现在岩石边缘，岩石只有折角。
     * 所以这里换成分段折线，偏移量由深度种子决定（同一层每次一样）。
     *
     * 偏移范围 [-6, +14]：正值往井内伸，最多伸到 baseX+14 = L / R，
     * 也就是**恰好压住地面边缘**、不会盖住地面本身。 */
    const pts = [];
    let yy = -12;
    while (yy < H + 12) {
      pts.push({ y: yy, off: -6 + rnd() * 20 });
      yy += 34 + rnd() * 46;
    }
    const ix = (k) => baseX + dir * pts[k].off;
    const ixAt = (y) => {
      let k = 0;
      while (k < pts.length - 1 && pts[k + 1].y < y) k++;
      return ix(k);
    };

    /* ① 岩体：近黑。暗环境里近处的东西是剪影 —— 用 TH.dirt2 原色时
       它和背景 sky1 只差 3% 明度，截图上一片糊，岩壁整个"消失"。 */
    g.beginPath();
    g.moveTo(outX, -12);
    for (let k = 0; k < pts.length; k++) g.lineTo(ix(k), pts[k].y);
    g.lineTo(outX, H + 12);
    g.closePath();
    g.fillStyle = hexDim(TH.dirt2, 0.40);
    g.fill();

    /* ② 块面：岩体内部 5 块大小不一的暗/亮多边形。
       一整块纯黑读作"屏幕被切掉一条"，有块面才读作"石头堆下来的"。 */
    for (let k = 0; k < 5; k++) {
      const cy = 40 + rnd() * 470;
      const mid = (outX + ixAt(cy)) / 2;
      const rw = 26 + rnd() * 46;
      const rh = 22 + rnd() * 44;
      /* **暗块在暗背景上是隐形的**：第一版三分之二用 rgba(0,0,0,.14~.32)，
         截图里完全看不见（黑上加黑），于是上半屏仍然是一块平涂。
         现在反过来：多数用 rockLit 的受光面 —— 洞窟里能看见的石头
         都是"被光照到的那一面"，看不见的是背光面，不是"更黑的石头"。 */
      const bright = rnd() < 0.68;
      g.fillStyle = bright
        ? rgbaOf(TH.hill2, 0.30 + rnd() * 0.30)
        : "rgba(0,0,0," + (0.16 + rnd() * 0.20).toFixed(3) + ")";
      g.beginPath();
      const n = 5;
      for (let q = 0; q < n; q++) {
        const a = (q / n) * 6.283 + rnd() * 0.5;
        const e = 0.6 + rnd() * 0.5;
        const px = mid + Math.cos(a) * rw * e;
        const py = cy + Math.sin(a) * rh * e;
        if (q === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath();
      g.fill();
    }

    /* ③ 受光**面**：一条 18~34px 宽的竖直渐变带贴着内缘。
     *
     * **这里是这一版最关键的一次改动，也是前两版都栽在同一个地方。**
     * 前两版都在内缘描一条线（先是 9px 实心 `TH.dirt`，后来是断续的 4~6px 线）。
     * 线的问题是：它给整条轮廓**描了个边**，于是岩壁读作"一个被勾了边的形状"
     * —— 在画面上就是两根竖立的肠子/柱子，而不是"一面朝我这边收进来的岩壁"。
     * 真实岩石没有边线，只有**朝向不同的面**：靠井内那 20 多 px 被底光扫到，
     * 往外立刻没入黑暗。
     *
     * 做法：一条横向渐变（内缘亮 → 外侧全透明），沿轮廓逐段画短带。
     * 竖向再乘一个 0.35→1 的权重 —— 光在地面，越往上越照不到。 */
    for (let k = 0; k < pts.length - 1; k++) {
      const a = pts[k], b = pts[k + 1];
      const kk = clamp((a.y - 40) / 480, 0, 1);
      if (kk < 0.04) continue;
      const w = 18 + kk * 16;
      const x0 = ix(k), x1 = ix(k + 1);
      const lit2 = g.createLinearGradient(x0, 0, x0 - dir * w, 0);
      lit2.addColorStop(0, rgbaOf(TH.dirt, 0.30 * kk + 0.06));
      lit2.addColorStop(1, rgbaOf(TH.dirt, 0));
      g.fillStyle = lit2;
      g.beginPath();
      g.moveTo(x0, a.y);
      g.lineTo(x1, b.y);
      g.lineTo(x1 - dir * w, b.y);
      g.lineTo(x0 - dir * w, a.y);
      g.closePath();
      g.fill();
    }

    /* ④ 层理：每 68px 一道水平的短暗线，从内缘往画面外走。
       石头的"层"是水平的、树的年轮是圆的 —— 这道线一加上，
       竖井的第一眼就成立，比任何高光都省。 */
    for (let y = 46; y < H; y += 68) {
      const x = ixAt(y);
      const len = 22 + ((y * 37) % 30);
      g.strokeStyle = "rgba(0,0,0,.30)";
      g.lineWidth = 2;
      g.beginPath();
      g.moveTo(x - dir * 3, y);
      g.lineTo(x - dir * len, y + ((y % 3) - 1) * 3);
      g.stroke();
    }

    /* ⑤ 矿脉：三道斜向短线，位置由**深度**决定 ——
       同一层每次进去都长在同一个地方（跟地形一样可记忆），
       换一层就换位置。这是"深度"这件事唯一的视觉刻度。 */
    for (let k = 0; k < 3; k++) {
      const y = 120 + rnd() * 340;
      const x = ixAt(y);
      g.strokeStyle = rgbaOf(TH.accent, 0.34);
      g.lineWidth = 2.2;
      g.beginPath();
      g.moveTo(x - dir * 18, y);
      g.lineTo(x - dir * 4, y + 26);
      g.stroke();
    }
  }

  /* ⑥ 井底碎石：地面与岩壁的交接处堆几块石头。
     没有这一层时，地面块的两端是"切平"的，读作被裁掉；
     堆两块碎石就有了"地面是被岩壁压住"的因果。 */
  for (const side of [-1, 1]) {
    const bx = side < 0 ? L : R;
    for (let i = 0; i < 3; i++) {
      const x = bx + side * (2 + i * 13);
      const r = 9 + ((i * 7 + 3) % 6);
      g.fillStyle = i % 2 ? TH.dirt : hexDim(TH.dirt2, 0.62);
      g.beginPath();
      g.ellipse(x, GROUND_Y - r * 0.45, r, r * 0.8, 0, 0, 6.283);
      g.fill();
    }
  }
}

/** 深巢的"暗"。
 *
 *  **为什么这一步是必须的，不是美化**：活动区砍到 640、加上井壁之后，
 *  画面变成了"白天的森林中间立着两根石柱"。井壁只解决了**结构**上的
 *  地下，光还是主线的右上斜阳 —— 玩家第一眼仍然判定"这是同一款游戏"。
 *  同一个台子，白天是路，烛光下是未知。**光从哪来，比地形怎么长
 *  更能定义一个空间的性质。**
 *
 *  **为什么要挖一个洞而不是整体调暗**：整体调暗只是把画面拍灰，
 *  玩家反而更难读地形。挖洞（玩家周围不压）同时办了三件事：
 *  ① 世界变暗，读作地下；② 视野有半径，读作"继续往下会看不见"；
 *  ③ 球和角色画在遮罩之后，所以永远是亮的 —— 顺手把
 *  "球是火、人是火把"这条讲清楚了，不需要任何教学文案。
 *
 *  **半径随深度收**：1~5 层 470（跟白天差不多，先熟悉这套地形），
 *  6~15 层 380（开始靠记忆走），16+ 层 300（看不清的地方不敢扔球）。
 *  上限受画面限制：屏幕对角线的一半是 566，超过它整屏就是亮的，等于没画。
 *
 *  **压暗值刻意保守（0.06 → 0.52）**。这不是恐怖游戏，玩家要读地形
 *  才能推球；压到 0.7 以上时地面材质带（冰 / 泥）就分不出来了，
 *  而那是 N1 的物理机制，不是装饰。
 */
/* ============================================================================
   雾巢 · 一：光照栅格与迷雾（2026-10-27）
   ----------------------------------------------------------------------------
   为什么不是"再加一层暗罩"：`drawNestDark` 是以玩家为圆心的**一个圆**，
   它只管"离你多远"，不管"你去过哪"。所以它永远不会让玩家产生
   "那边我还没看过"的念头 —— 每次转头，那片黑都还是那片黑，形状一模一样。

   雾要成立，必须有**记忆**：
     · `lit`  这一帧被照到多少（玩家灯 / 球火 / 菌光囊 / 裂缝 / 蛾的微光）
     · `seen` 这一层到现在为止照到过多少（只增不减）
   两者分开，才画得出三种地方：看得清（lit 高）、走过记得（seen 高、lit 低）、
   完全没去过（两个都 0）。三档而不是两档，是"探索"这件事能被读出来的前提。

   为什么整块雾只画一次而不是逐格填：逐格 1160 个 fillRect 每帧都在变，
   而且方块边缘会把岩洞读成"马赛克"。现在把掩码算进一张 40×29 的位图，
   再放大 16 倍铺上去 —— 双线性插值顺手把边缘糊成了雾的过渡，
   一共一次 drawImage。
   ========================================================================== */
function nestFogInit() {
  const cell = NEST_FOG.cell;
  const cols = Math.ceil(NEST.W / cell);
  /* 盖到**画面底边**而不是地面顶（GROUND_Y）。地面那 44px 原来是露在外面的，
     跟着地缝光一起在整条屏宽上发亮 —— 于是"没去过的地方"在脚下永远是亮的，
     雾只有上半屏成立。 */
  const rows = Math.ceil((H - NEST_FOG.Y0) / cell);
  const n = cols * rows;
  return {
    cell: cell, x0: NEST.L, y0: NEST_FOG.Y0,
    cols: cols, rows: rows,
    lit: new Float32Array(n),
    seen: new Float32Array(n),
    /* 雾的纹理：每格一个固定的 0..1 值。
       **必须固定**（按格号 + 深度算，不用随机数）—— 雾要是每帧抖，
       读作"画面有噪点"；固定下来才读作"这团雾一直长这样"。 */
    nz: (function () {
      const a = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const v = Math.sin((i * 12.9898 + 4.1) * 0.7) * 43758.5453;
        a[i] = v - Math.floor(v);
      }
      return a;
    })(),
    seenPct: 0,
    /* 离屏位图惰性创建：359 项冒烟断言绝大多数不渲染，
       顶层分配三张位图纯属浪费（和 postGet 同一条规矩）。 */
    cv: null, cg: null, img: null,
  };
}

/** 往光照场里加一个圆形光源。`k` 是强度（1 = 满亮，蛾那种只给 0.9）。 */
function fogAddLight(F, x, y, r, k) {
  if (!(r > 0)) return;
  const c = F.cell;
  const i0 = Math.max(0, Math.floor((x - r - F.x0) / c));
  const i1 = Math.min(F.cols - 1, Math.floor((x + r - F.x0) / c));
  const j0 = Math.max(0, Math.floor((y - r - F.y0) / c));
  const j1 = Math.min(F.rows - 1, Math.floor((y + r - F.y0) / c));
  if (i1 < i0 || j1 < j0) return;
  const r2 = r * r;
  for (let j = j0; j <= j1; j++) {
    const dy = F.y0 + (j + 0.5) * c - y;
    const row = j * F.cols;
    for (let i = i0; i <= i1; i++) {
      const dx = F.x0 + (i + 0.5) * c - x;
      const d2 = dx * dx + dy * dy;
      if (d2 >= r2) continue;
      /* 线性衰减在边缘还剩 30% 亮度就断了（看得见一个硬边圆），
         取 1.6 次幂：中心很快到顶、边缘拖得很长 —— 那才是光晕。 */
      const v = Math.pow(1 - Math.sqrt(d2) / r, 1.6) * 1.35 * k;
      const idx = row + i;
      if (v > F.lit[idx]) F.lit[idx] = v > 1 ? 1 : v;
    }
  }
}

/** 某个世界坐标被照到多少（0..1）。井外恒为 1（岩壁不盖雾）。 */
function fogSample(F, x, y) {
  if (!F) return 1;
  const i = Math.floor((x - F.x0) / F.cell);
  const j = Math.floor((y - F.y0) / F.cell);
  if (i < 0 || j < 0 || i >= F.cols || j >= F.rows) return 1;
  return F.lit[j * F.cols + i];
}

/** 每帧重建光照场。**每帧清零重算**而不是做衰减累加：
 *  累加会让"走过去又走回来"的光永久留在场上（记忆和光照混成一份），
 *  而这两件事必须分开 —— `seen` 才是记忆。 */
function nestFogTick(dt) {
  const F = S.fog;
  if (!S.nest || !F) return;
  const tier = nestFogTier(S.nest.depth);
  F.lit.fill(0);

  /* ① 随身灯。半径带一点呼吸（±3%）：完全恒定的光圈读作"贴在屏幕上的蒙版"，
     微微呼吸才像火。 */
  if (S.p && !S.p.dead) {
    const fl = 1 + Math.sin(S.t * 3.1) * 0.03;
    fogAddLight(F, S.p.x, S.p.y - 34, tier.lamp * fl, 1);
  }
  /* ② 球。**球就是火把** —— 这是整套设计的支点：推一颗球出去，
     照亮一条路，代价是这颗球（和装在里面的兽）滚远了。
     `air` 越低光越弱，玩家读得到"这颗快瘪了"。 */
  for (const b of S.balls) {
    if (b.dead) continue;
    const k = 0.55 + 0.45 * Math.min(1, b.air / 0.7);
    fogAddLight(F, b.x, b.y - 10, tier.ball * k, 1);
  }
  /* ③ 菌光囊（已炸开的）。永久光源 —— 探索的回报就是这个：
     你炸开过的角落，这一层剩下的时间永远亮着。 */
  for (const p of S.pods) {
    if (!p.lit) continue;
    fogAddLight(F, p.x + p.w / 2, p.y - 18, NEST_FOG.POD_R, 0.95);
  }
  /* ④ 裂缝透上来的光。压得很低（90 / 0.8）—— 它的作用是"雾里有个
     暖色的地方"，不能亮到让玩家从远处就看清整条缝的位置。 */
  for (const c of CHASMS) {
    if (c.w == null) continue;
    fogAddLight(F, c.x + c.w / 2, GROUND_Y - 12, 90, 0.8);
  }
  /* ⑤ 会自己发光的东西：蛾（它本来就是"用光打"的怪，在雾里先亮起来
     等于自己报了位置）、BOSS（不给它开个光，玩家会在雾里被砸而看不见）。 */
  for (const f of S.foes) {
    if (f.isBoss) fogAddLight(F, f.x, f.y - f.h / 2, 118, 0.85);
    else if (f.def && f.def.kind === "moth") fogAddLight(F, f.x, f.y - f.h / 2, 88, 0.9);
  }

  /* 记忆只增不减。**层内不清零** —— 转身就忘掉地形的话，
     玩家没法"记住这一层往哪走"，而记住地形正是无尽模式的乐趣。 */
  let seenN = 0;
  const lit = F.lit, seen = F.seen;
  for (let i = 0; i < lit.length; i++) {
    if (lit[i] > seen[i]) seen[i] = lit[i];
    if (seen[i] > 0.18) seenN++;
  }
  F.seenPct = seenN / lit.length;

  /* 雾里的怪只给眼睛（见 drawFoe）。这里一次性把每只怪所在位置的光照
     算好存到 `f.fogLit` —— 绘制期每帧再算 60 次插值没必要。 */
  for (const f of S.foes) {
    f.fogLit = fogSample(F, f.x, f.y - f.h * 0.55);
  }
}

/** 离屏位图（40×29）。只在深巢、只在第一次渲染时创建。 */
function fogCanvas(F) {
  if (F.cv) return F;
  const c = document.createElement("canvas");
  c.width = F.cols;
  c.height = F.rows;
  F.cv = c;
  F.cg = c.getContext("2d");
  F.img = F.cg.createImageData(F.cols, F.rows);
  return F;
}

/** 把雾画上去。位置：`drawNestDark` 之后、`drawNestGlow` 之前。
 *  顺序即语义：暗罩决定"离你多远"，雾决定"你去没去过"，
 *  而底光最后画 —— 光能穿过雾，所以雾里仍然看得见脚下那一线暖色。 */
function drawNestFog(g) {
  const F = S.fog;
  if (!S.nest || !F) return;
  const tier = nestFogTier(S.nest.depth);
  fogCanvas(F);
  const d = F.img.data;
  const lit = F.lit, seen = F.seen;
  const n = F.cols * F.rows;
  /* 雾色比岩壁更冷一点（5,7,15）。用 TH.soilDeep 的话，
     熔岩洞那套暖色系会把雾画成"尘土"，而不是"没看见的地方"。 */
  for (let i = 0; i < n; i++) {
    let a = Math.max(tier.unseen * (1 - seen[i]), tier.seen * seen[i]) * (1 - lit[i]);
    /* 纹理只**减**不加（0.70~1.00）。加上去的话有些格会比 base 更不透明，
       而 base 已经是"几乎全黑"，加不动 —— 减出来的是薄处，读作雾的团块。 */
    a *= 0.86 + 0.14 * F.nz[i];
    d[i * 4] = 5; d[i * 4 + 1] = 7; d[i * 4 + 2] = 15;
    d[i * 4 + 3] = (a * 255) | 0;
  }
  F.cg.putImageData(F.img, 0, 0);
  const fh = H - F.y0;
  g.save();
  g.imageSmoothingEnabled = true;
  g.drawImage(F.cv, F.x0, F.y0, NEST.W, fh);
  /* 雾在动。三层很淡的椭圆亮雾横着飘（速度不同、相位不同），
     不加这一层的话整片雾是死的 —— 静止的雾读作"画面蒙了块脏玻璃"。 */
  g.globalCompositeOperation = "lighter";
  for (let k = 0; k < 3; k++) {
    const sp = 0.055 + k * 0.022;
    const x = F.x0 - 160 + ((S.t * sp * 320 + k * 260) % (NEST.W + 320));
    const y = 210 + Math.sin(S.t * 0.24 + k * 2.1) * 130 + k * 42;
    const r = 170 + k * 30;
    const rg = g.createRadialGradient(x, y, 4, x, y, r);
    rg.addColorStop(0, "rgba(150,182,215,0.042)");
    rg.addColorStop(1, "rgba(150,182,215,0)");
    g.fillStyle = rg;
    g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  g.restore();
}

/** 雾里的怪：只给一双眼睛。
 *
 *  这是"探索"真正的钩子 —— 你在雾边上看见两点冷光，但**不知道对面是什么**。
 *  三条路都试过：
 *    ① 干脆不画 → 那只怪像凭空冒出来一样扑你，等于偷袭
 *    ② 画剪影 → 剪影就是答案，雾立刻失去意义
 *    ③ 只给眼睛 → 既说"那儿有东西"，又不说"是什么"
 *  所以颜色统一成青白：雾里连毛色都看不见，"颜色是线索"这件事在这里不成立。 */
function drawFogEyes(g, f) {
  const cx = f.x, cy = f.y - f.h * 0.62;
  const t = S.t + (f.ph || 0);
  /* 眨眼：每 3 秒左右闭一次。会闭的东西才是"活的" —— 一对恒亮的点
     在暗底上读作两只发光蘑菇。 */
  const blink = (Math.sin(t * 2.1) > 0.97) ? 0.12 : 1;
  const gap = Math.max(7, (f.w || 30) * 0.26);
  g.save();
  /* 极淡的一团比周围更黑的身体记忆。**不是轮廓，是"那里有点东西"** ——
     用怪的 c1 上色会让玩家从色相猜出种族。 */
  g.globalAlpha = 0.13;
  g.fillStyle = "#05070F";
  g.beginPath();
  g.ellipse(cx, f.y - f.h * 0.42, f.w * 0.46, f.h * 0.52, 0, 0, 6.283);
  g.fill();
  g.globalAlpha = 1;
  for (const s of [-1, 1]) {
    const ex = cx + s * gap, ey = cy + Math.sin(t * 0.9 + s) * 1.2;
    const rg = g.createRadialGradient(ex, ey, 0.5, ex, ey, 8);
    rg.addColorStop(0, "rgba(140,210,255," + (0.42 * blink).toFixed(3) + ")");
    rg.addColorStop(1, "rgba(140,210,255,0)");
    g.fillStyle = rg;
    g.beginPath(); g.arc(ex, ey, 8, 0, 6.283); g.fill();
    g.fillStyle = "rgba(206,240,255," + (0.90 * blink).toFixed(3) + ")";
    g.beginPath(); g.ellipse(ex, ey, 2.0, 2.6, 0, 0, 6.283); g.fill();
  }
  g.restore();
}

/* ============================================================================
   雾巢 · 二：菌光囊（探索的落点）
   ----------------------------------------------------------------------------
   雾如果只收成本不给东西，玩家会沿灯能照到的地方走最短路线 —— 雾退化成滤镜。
   菌光囊是雾里的**目的地**：一团在暗处发着微光的囊，走过去（或把球推过去）
   就炸开，这片永久亮起，还掉孢子（收成 +2）。

   为什么用"走上去"而不是"按什么键"：这游戏没有交互键（只有跳/推/攻），
   新增一个键就是新增一条教学。走上去是**已经存在的动作**。
   ========================================================================== */
function drawPods(g) {
  if (!S.nest || !S.pods.length) return;
  for (const p of S.pods) {
    const cx = p.x + p.w / 2, by = p.y;
    const alive = !p.lit;
    /* 炸开的囊留一根断柄 + 几粒飘着的孢子。整株消失的话，
       "这里我来过"这件事在画面上就没有证据了。 */
    const glow = TH.accent;
    g.save();
    if (!alive) {
      g.globalAlpha = 0.55;
      g.strokeStyle = hexDim(TH.wood2, 0.85);   // 深巢主题的字段是 wood/wood2/wood3，没有 woodDeep
      g.lineWidth = 4.2;
      g.beginPath();
      g.moveTo(cx - 2, by);
      g.quadraticCurveTo(cx - 4, by - 14, cx + 2, by - 20);
      g.stroke();
      g.globalAlpha = 0.8;
      for (let k = 0; k < 5; k++) {
        const t = S.t * 0.7 + k * 1.9;
        const sx = cx + Math.sin(t + k) * 16;
        const sy = by - 22 - ((t * 12) % 40);
        g.fillStyle = rgbaOf(glow, 0.20 + 0.18 * Math.sin(t * 2.2));
        g.beginPath(); g.arc(sx, sy, 1.7, 0, 6.283); g.fill();
      }
      g.restore();
      continue;
    }
    /* 柄：从地面长出来，上粗下细（菌柄的现实形状） */
    g.fillStyle = hexDim(TH.wood2, 0.92);
    g.beginPath();
    g.moveTo(cx - 7, by);
    g.quadraticCurveTo(cx - 4, by - 16, cx - 2, by - 26);
    g.lineTo(cx + 2, by - 26);
    g.quadraticCurveTo(cx + 4, by - 16, cx + 7, by);
    g.closePath();
    g.fill();
    /* 三颗囊：一大两小，高的那颗最亮 —— 一坨同高的球读作"一束气球" */
    const bulbs = [
      { dx: 0, dy: -34, r: 13, k: 1 },
      { dx: -13, dy: -22, r: 8.5, k: 0.82 },
      { dx: 12, dy: -25, r: 9.5, k: 0.88 },
    ];
    const breathe = 0.86 + 0.14 * Math.sin(S.t * 1.9);
    for (const b of bulbs) {
      const bx = cx + b.dx, byy = by + b.dy, r = b.r * b.k;
      const rg = g.createRadialGradient(bx - r * 0.3, byy - r * 0.35, r * 0.15, bx, byy, r);
      rg.addColorStop(0, rgbaOf("#F2FFE8", 0.92 * breathe));
      rg.addColorStop(0.42, rgbaOf(glow, 0.78 * breathe));
      rg.addColorStop(1, hexDim(glow, 0.42));
      g.fillStyle = rg;
      g.beginPath(); g.arc(bx, byy, r, 0, 6.283); g.fill();
      /* 囊里那几点孢子：让它读作"活的"，不是"三个球" */
      g.fillStyle = "rgba(12,18,26,.52)";
      for (let k = 0; k < 3; k++) {
        const a = S.t * 0.6 + k * 2.1 + b.dx;
        g.beginPath();
        g.arc(bx + Math.cos(a) * r * 0.34, byy + Math.sin(a) * r * 0.30, 1.3, 0, 6.283);
        g.fill();
      }
    }
    g.restore();
  }
}

/** 穿过雾的那一点光。**画在雾之后** —— 画在雾前面会被雾盖掉，
 *  没人看得见，探索也就没有诱饵。
 *
 *  两类东西走这条通道：
 *    · 菌光囊（未炸的 = 诱饵，已炸的 = 回报）
 *    · **裂缝**（2026-10-27 补）。裂缝是这一层的目标，"看不见目标"不是探索，
 *      是折磨 —— 玩家会站在雾里推着兽到处问"往哪推"。
 *      给它的量刻意只有 0.09：够在雾里认出"那边有个暖色的地方"，
 *      不够看清缝有多宽、在哪一站。
 */
function drawPodGlow(g) {
  if (!S.nest) return;
  g.save();
  g.globalCompositeOperation = "lighter";
  for (const c of CHASMS) {
    if (c.w == null) continue;
    const cx = c.x + c.w / 2, cy = GROUND_Y - 6;
    const r = 78 + Math.sin(S.t * 1.3 + cx * 0.05) * 4;
    const rg = g.createRadialGradient(cx, cy, 2, cx, cy, r);
    rg.addColorStop(0, rgbaOf(TH.accent, 0.09));
    rg.addColorStop(1, rgbaOf(TH.accent, 0));
    g.fillStyle = rg;
    g.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  if (!S.pods.length) { g.restore(); return; }
  for (const p of S.pods) {
    const cx = p.x + p.w / 2, cy = p.y - 22;
    /* 炸开之后**光晕要收**（0.30 → 0.16）：它的职责是把这片"点亮"，
       不是"在这里烧一堆火"。给 0.30 时整片地面被橙色糊住，
       读作"地上着火了"，而地形反被冲淡 —— 而"地形被看清"才是回报。 */
    const r = p.lit ? NEST_FOG.POD_R * 0.52 : 74;
    const a = p.lit ? 0.16 : 0.19 + 0.05 * Math.sin(S.t * 2.3);
    const rg = g.createRadialGradient(cx, cy, 2, cx, cy, r);
    rg.addColorStop(0, rgbaOf(TH.accent, a));
    rg.addColorStop(1, rgbaOf(TH.accent, 0));
    g.fillStyle = rg;
    g.fillRect(cx - r, cy - r, r * 2, r * 2);
  }
  g.restore();
}

/** 囊的碰撞：球撞上来或者人走上去。 */
function updatePods(dt) {
  if (!S.nest || !S.pods.length) return;
  for (const p of S.pods) {
    if (p.burstT > 0) p.burstT = Math.max(0, p.burstT - dt);
    if (p.lit) continue;
    const cx = p.x + p.w / 2, by = p.y;
    let hit = false;
    for (const b of S.balls) {
      if (b.dead) continue;
      if (Math.abs(b.x - cx) < p.w * 0.5 + 18 &&
          b.y > by - p.h - 12 && b.y - 48 < by + 4) { hit = true; break; }
    }
    /* 人走过去就破：`p.y - p.h` 是囊顶，人的碰撞盒以脚为 y。 */
    if (!hit && S.p && !S.p.dead) {
      if (Math.abs(S.p.x - cx) < p.w * 0.5 + S.p.w * 0.4 &&
          S.p.y > by - p.h - 4 && S.p.y - S.p.h < by + 4) hit = true;
    }
    if (hit) nestPodBurst(p);
  }
}

function nestPodBurst(p) {
  if (p.lit) return;
  p.lit = true;
  p.burstT = 0.6;
  S.food += NEST_FOG.POD_FOOD;
  S.stat.pods = (S.stat.pods || 0) + 1;
  const cx = p.x + p.w / 2;
  addText(cx, p.y - p.h - 8, "孢子 +" + NEST_FOG.POD_FOOD, "#C8F5DA", 15, 1.0);
  addFrag(cx, p.y - 26, 12, TH.accent);
  /* 轻微闪一下，不要用大闪 —— 那是 BOSS 砸地的语义。 */
  S.flash = Math.max(S.flash, 0.10);
}

function drawNestDark(g) {
  if (!S.nest) return;
  const d = S.nest.depth || 1;
  const R = d <= 5 ? 470 : d <= 15 ? 380 : 300;
  /* 有雾的时候暗罩让开一档（2026-10-27）。两者是**乘法**叠加：
     0.56 的暗罩 × 0.88 的雾 = 0.95，那不是"看不清"，是全黑。
     分工要说清楚：暗罩管"离你多远"，雾管"你去没去过" ——
     既然雾已经接了后半句，暗罩就该退回它原本的那点氛围压暗。 */
  const kEdge = S.fog
    ? (d <= 5 ? 0.14 : d <= 15 ? 0.18 : 0.22)
    : (d <= 5 ? 0.42 : d <= 15 ? 0.50 : 0.56);
  const cx = S.p && !S.p.dead ? S.p.x : W / 2;
  const cy = S.p && !S.p.dead ? S.p.y - 30 : H / 2 + 40;

  /* 亮圈的半径先按 0.30R 起（圆心附近几乎不压），到 1.25R 收敛到 kEdge。
     1.25 而不是 1.0：四角距离圆心 566，若只铺到 R=470 就停，
     四角会是一块**纯色**（渐变越界后按末端色填充），读作"画面被切了"。
     铺到 1.25R 让四角自然衰减，看不出边界。 */
  const grd = g.createRadialGradient(cx, cy, R * 0.30, cx, cy, R * 1.25);
  grd.addColorStop(0, "rgba(5,7,18,0.06)");
  grd.addColorStop(0.55, "rgba(5,7,18," + (kEdge * 0.42).toFixed(3) + ")");
  grd.addColorStop(1, "rgba(5,7,18," + kEdge + ")");
  g.fillStyle = grd;
  g.fillRect(0, 0, W, H);
}

/** 深巢的**底光**：光源在脚下，不在天上。
 *
 *  这一层的职责不是照明（看不清的地方是该看不清的，那是暗罩的活），
 *  是**告诉玩家光从哪来**。主线从头到尾一束右上方的斜阳，
 *  深巢从头到尾一片从地面升起来的冷光/暖光 —— 同一个台子，
 *  光一换方向，观感就从"山道"变成"地缝"。
 *
 *  **为什么用 `lighter` 而不是普通叠加**：普通叠加只是"盖一层半透明色"，
 *  盖出来的地方会变白、变灰，读作"起雾"。光必须是**加法**：
 *  亮的更亮，暗的保持不变。这是"发光"和"蒙版"的分界线。
 *
 *  位置由深度种子决定 —— 同一层的灯永远在同一个地方（可记忆），
 *  换一层就换位置。同时要避开坑（坑里本来就有自己的光，叠两层会过曝）
 *  和营地（营地门口的暖光是主线就有的语义，别混）。
 */
function drawNestGlow(g) {
  if (!S.nest) return;
  const d = S.nest.depth || 1;
  const rnd = nestRand(d * 9173 + 41);
  const st = curStage();

  g.save();
  g.globalCompositeOperation = "lighter";

  /* ① 地面横向光带：整条地面往上 150px 的弥散。
     有了它，下面那些亮缝才不是"地上的几块贴纸"，而是同一片光晕里的几处亮核。 */
  const band = g.createLinearGradient(0, GROUND_Y - 150, 0, GROUND_Y + 4);
  band.addColorStop(0, rgbaOf(TH.accent, 0));
  band.addColorStop(0.55, rgbaOf(TH.accent, 0.055));
  band.addColorStop(1, rgbaOf(TH.accent, 0.15));
  g.fillStyle = band;
  g.fillRect(0, GROUND_Y - 150, W, 156);

  /* ② 地缝：地面上一排短横缝在发光。
     **第一版是 3 个大椭圆光斑（r 96~150），截图上是"地上铺了两块橙色地毯"** ——
     圆形光斑读作"某个东西在发光"，只有**线状**才读作"地裂开了、光从缝里上来"。
     而且 3 个必然摆不均：它们要么挤在一起，要么两边各一个、中间空着。
     改成一排（间距 78~120），整条地面都在微微透光 —— 数量解决均匀，
     形状解决语义。 */
  let x = NEST.L + 24;
  let guard = 0;
  while (x < NEST.R - 24 && guard++ < 40) {
    const w = 22 + rnd() * 30;
    const gap = 78 + rnd() * 42;
    const onPit = (st.pits || []).some(q => x + w > q.x - 30 && x < q.x + q.w + 30);
    const nearCamp = Math.abs(x + w / 2 - (st.camp.x + st.camp.w / 2)) < 70;
    if (!onPit && !nearCamp) {
      const cy = GROUND_Y - 2;
      /* 缝本身：一条淡色短线 */
      g.fillStyle = rgbaOf(TH.accent, 0.52);
      g.beginPath();
      g.ellipse(x + w / 2, cy, w * 0.5, 2.6, 0, 0, 6.283);
      g.fill();
      /* 缝上的光晕：小、扁、向上扬（贴地的光不会是一个正圆） */
      const r = 30 + rnd() * 26;
      const gr = g.createRadialGradient(x + w / 2, cy, 2, x + w / 2, cy, r);
      gr.addColorStop(0, rgbaOf(TH.accent, 0.24));
      gr.addColorStop(1, rgbaOf(TH.accent, 0));
      g.fillStyle = gr;
      g.beginPath();
      g.ellipse(x + w / 2, cy - 2, r * 0.92, r * 0.58, 0, 0, 6.283);
      g.fill();
    }
    x += w + gap;
  }
  g.restore();
}

/* 前景灌木：画面最底边一排压暗的剪影。
 *
 * 为什么需要这一层：现在天空、远山、树、草地、平台、角色全挂在同一个对比度上，
 * 排在一起读作"一张插画上面摆了角色"。真实镜头里最近处一定有一层被压暗、
 * 只留剪影的东西挡着画面下缘 —— 纵深就是靠"远淡 / 中实 / 近暗"这三档拉开的。
 *
 * 高度死线：顶端不得高于 GROUND_Y + 14（= 570）。
 * 地面行走的视觉带一点都不能占，否则玩家分不清"球是落地了还是被草挡住了"。
 * 这条死线写进算式（cy 按 r 反推），不靠调参运气。
 */
/**
 * 前景高元素的允许区：只有画面最外侧 `FG_SIDE` 像素内可以立杆 / 立石堆。
 *
 * ★ 2026-10-25 从「归一化阈值 0.30」改成「绝对像素 96」。
 *
 * 上一版叫 `FG_EDGE_MIN = 0.30`，注释写的是"中段留空、两侧立高杆"。
 * 但判据是 `edge > 0.30`，其中 `edge = |px/W - 0.5| × 2`，
 * 换算过来是 **`px < 336 || px > 624`** —— 覆盖 652/960 = **68% 屏宽**。
 * 配合杆高 116~234（顶端 366~484），结果是从球道到 462 层台面全被前景竖杆穿过。
 * 玩家的原话是"战斗内的很乱""越做越乱"。
 *
 * **教训：任何"留空 / 避让"类阈值，必须把覆盖率算出来再写进注释。**
 * 只写一个 0.30 就以为中间空了，是把意图当成了实现。
 * 现在两侧各 140px（合计 29%），且杆顶另有 `FG_TOP = 504` 的绝对封顶。
 * 140 而不是更窄：收到 96 时实测 27 屏**前景高元素全部归零** ——
 * 出生点 ±46 和营地 ±30 把最外那一条吃干净了，前景层等于被删掉。
 * 封顶 504 之后宽度已经不影响可读性：杆顶比球顶（534）还低 30px。
 */
const FG_SIDE = 140;

/**
 * 前景的硬约束（三族共用）：**不许盖住坑和营地**。
 * 前景是"压在镜头前面的东西"，它盖住什么，什么就真的看不见；
 * 而坑和门口是玩家必须看见的玩法目标。
 */
function fgBlocked(x, r) {
  /* 边距**必须收窄**（40/60/70 → 22/30/46）。
     实测：27 屏里有 8 屏的"坑 + 营地 + 出生点"在宽边距下占满全场，
     点数直接归零 —— 第 20 屏一根芦苇都没有，第 12 屏一块石头都没有。
     前景"挡得太狠"和"完全不来"是同一个 bug 的两头：
     它挡的是**玩意的中心**，不是它的安全气囊。 */
  for (const pt of PITS) {
    if (x + r * 0.45 > pt.x - 22 && x - r * 0.45 < pt.x + pt.w + 22) return true;
  }
  if (x + r * 0.45 > CAMP.x - 30 && x - r * 0.45 < CAMP.x + CAMP.w + 30) return true;
  /* **出生点也要让开。** 实测第 20 屏：一根 210px 的前景芦苇正好长在
     出生点上，开局第一帧玩家的小动物就被自己面前的一根杆子挡住半个身子 ——
     不是"氛围好"，是"我以为角色卡住了"。 */
  const sp = PLAYER_SPAWN && PLAYER_SPAWN.x;
  if (sp && x + r * 0.45 > sp - 46 && x - r * 0.45 < sp + 46) return true;
  return false;
}

/**
 * 前景岩石（cliffs 族）。
 *
 * 为什么这一族不能继续用灌木：**灌木的轮廓是"一团"，岩石的轮廓是"一条锯齿"**。
 * 断崖的画面下沿如果还是六丛圆叶，玩家读到的仍然是草地，
 * 上面那些岩柱就成了"贴在天上的山"。
 *
 * 高度规则和灌木完全一致（这是可读性，不是美术）：
 *   中段（|t-0.5| < 0.28）**必须贴地**，只到 548 —— 球在 y≈534 滚，
 *   中段的前景一旦高过它，球就被自己的前景吃掉，玩家会以为球消失了。
 *   两侧可以高到 420 —— 那里球不常走，而且"两侧高"本身就框住了视线。
 */
/**
 * 底边碎屑：**被避让掉的候选点改画这个**。
 *
 * 为什么必须有：27 屏里坑+营地+出生点把底边切得很碎，实测第 12 屏只剩 4 个可用点、
 * 第 20 屏只剩 5 个。如果被避让的地方就"什么都不画"，画面下沿会是一段段空白，
 * 读作"这一屏没画完"，不是"这一屏很干净"。
 *
 * 高度 7~15px，**贴地，什么也不挡**：它够不着球（球底 556、球顶 534），
 * 也够不着坑（坑从地面往下挖）。它的唯一职责是"底边不是一条硬直线"。
 */
function drawFgPebble(g, x, i, col) {
  const n = 1 + Math.floor(hash(i * 2.3) * 3);
  for (let k = 0; k < n; k++) {
    const px = x + (hash(i * 3.7 + k * 1.9) - 0.5) * 26;
    const w = 5 + hash(i * 5.1 + k * 2.7) * 12;
    const h = 4 + hash(i * 7.3 + k * 3.3) * 9;
    g.fillStyle = col;
    g.beginPath();
    g.ellipse(px, H - h * 0.4, w, h, 0, 0, 6.283);
    g.fill();
  }
}

function drawFgRocks(g) {
  /* 颜色：**不能直接用 TH.shrub**。那是灌木的墨绿，在紫夜/灰岩主题下几乎是纯黑，
     一排锯齿黑块读作"画面被撕了几道口子"，不读作石头。
     也不能往 hillNear 混（第二版）：枯木产地的 hillNear 偏绿灰，
     混出来是**绿色石头** —— 比黑色更难读。
     石头只认木色/土色：往 trunkNear 混 0.34，再压一档明度。 */
  const col = hexDim(hexMix(TH.shrub || hexDim(TH.hillNear, 0.62), TH.trunkNear, 0.34), 0.92);
  const lit = hexMix(col, "#FFE9B8", 0.34);
  const dark = hexDim(col, 0.78);

  /* **扫描式布局，间距 26~46。**
     固定点位表（第一、二版）的问题是：点位只有 6~10 个，三道避让一排除就归零。
     扫描式之后密度跟着地形走。采样间隔从 42~70 收到 26~46：
     实测第 12 屏（三个坑把底边切碎）在 42 起步长下只剩 4 个可用点，
     收到 26 之后变成 9 个 —— 前景才成"层"而不是"几个孤零零的块"。 */
  for (let x = 16, i = 0; x < W - 16; x += 26 + hash(i * 7.1) * 20, i++) {
    /* **尺寸差异要拉大**（半宽 22~56）。第一版 30~54 出来是一排等高的方碑 ——
       等高等宽 = 人造物，那是栏栅不是石头。 */
    const r = 22 + hash(i * 3.9) * 34;
    const px = x + (hash(i * 9.3) - 0.5) * 12;
    if (fgBlocked(px, r)) { drawFgPebble(g, px, i, col); continue; }

    /* 中段（球道）直接交给碎屑 —— 判据从 `edge <= FG_EDGE_MIN(0.30)` 改成
       **绝对像素**：0.30 那条算下来覆盖 68% 屏宽（px<336 || px>624），
       和"中段留空"的意图差了十万八千里。这是 2026-10-25 那次"画面很乱"的同一条病根，
       见 drawFgReeds 上面的说明。 */
    if (px > FG_SIDE && px < W - FG_SIDE) { drawFgPebble(g, px, i, col); continue; }
    /* 顶端封顶 504（球顶 534 之下 30px）。上一版 `466 + hash*52` = 466~518，
       最高的石堆已经顶到 462 层台面上了。 */
    const hi = 504 + hash(i * 6.1) * 20;
    if (S._fgAudit) S._fgAudit.push(["fgrock", hi, px]);
    /* 石头块数也按 hash 变（1~3 块）：每堆都是"三块叠一起"，
       规模一致就成了"预制件"。 */
    /* **三块石头合成一个轮廓（路径并集），不是三块分开画。**
       分开画（上一版）出来是"一排小方碑" —— 因为每块都有独立的左右边和顶棱，
       眼睛把它们读成三个物体。canvas 对同一条路径里的多个闭合子路径按非零环绕
       填充，出来就是并集，内部不会出现接缝。见 blobPath 的同一段注释。 */
    g.beginPath();
    for (let k = 0; k < 3; k++) {
      const ox = (hash(i * 2.9 + k * 4.1) - 0.5) * r * 1.5;
      const w = r * (0.58 + hash(i * 4.3 + k * 2.2) * 0.52);
      const top = hi + hash(i * 6.7 + k * 3.1) * 44;
      const hh = r * (0.34 + hash(i * 8.1 + k * 1.3) * 0.28);
      const cx = px + ox;
      const hw = w / 2;
      /* 上小下大的**梯形 + 圆角顶**：岩石坐在地上是被埋住的，
         下沿必须比上沿宽。上宽下窄读作"碑"。 */
      const tw = hw * 0.70;
      g.moveTo(cx - tw, top);
      g.quadraticCurveTo(cx - tw * 0.5, top - hh * 0.26, cx, top - hh * 0.19);
      g.quadraticCurveTo(cx + tw * 0.5, top - hh * 0.26, cx + tw, top);
      g.lineTo(cx + hw, H);
      g.lineTo(cx - hw, H);
      g.closePath();
    }
    g.fillStyle = col;
    g.fill();

    /* 顶面受光：最靠前那块（k=2）的顶棱。
       整堆只有这一条亮边 —— 并集之后没有内部边界了，
       亮边是**唯一**能说明"这块石头有厚度"的东西。 */
    {
      const ox = (hash(i * 2.9 + 2 * 4.1) - 0.5) * r * 1.5;
      const w = r * (0.58 + hash(i * 4.3 + 2 * 2.2) * 0.52);
      const top = hi + hash(i * 6.7 + 2 * 3.1) * 44;
      const hh = r * (0.34 + hash(i * 8.1 + 2 * 1.3) * 0.28);
      const cx = px + ox;
      const tw = (w / 2) * 0.70;
      g.strokeStyle = lit;
      g.lineWidth = 2.4;
      g.beginPath();
      g.moveTo(cx - tw, top + 1);
      g.quadraticCurveTo(cx - tw * 0.5, top - hh * 0.26 + 1, cx, top - hh * 0.19 + 1);
      g.quadraticCurveTo(cx + tw * 0.5, top - hh * 0.26 + 1, cx + tw, top + 1);
      g.stroke();
    }
  }
}




/**
 * 前景芦苇（marsh 族）。
 *
 * 前景这一层是"镜头贴着的东西"——**但"贴着镜头"不等于"拦在玩法前面"。**
 *
 * ★ 2026-10-25 重做（用户："战斗内的很乱……之前做的还好点"）：
 *   上一版的立杆判据是 `edge > FG_EDGE_MIN(0.30)`，看起来"中段留空"，
 *   实际上 edge>0.3 等价于 `px < 336 || px > 624` —— **覆盖 652/960 = 68% 屏宽**。
 *   杆高 116~234、从 y=604 往上 → 顶端 366~484，
 *   **比 462 层台面还高 96px**：左右两侧的平台和敌人被自己的前景吃掉。
 *
 *   现在三道硬约束，全部写成算式而不是靠调参：
 *     ① 立杆区只有最外 `FG_SIDE = 140`px（两侧合计 29%）—— 高杆只做框景；
 *     ② 杆顶封顶 `FG_TOP = 504`（球顶 534 之下 30px，462 台面底 482 之下 22px）
 *        → 高杆永远碰不到球道和任何一块能站的台面；
 *     ③ 粗细 3.2（球半径 11 的 29%）、alpha .55 —— 前景该"压暗"，不是"变黑"。
 *   中段（96~864）全部交给 7~15px 的碎屑，它够不着任何玩法元素。
 */
function drawFgReeds(g) {
  const col = hexMix(TH.shrub || hexDim(TH.hillNear, 0.60), TH.hillNear, 0.28);
  const lit = hexMix(col, "#E8FFD8", 0.26);

  const FG_TOP = 504;
  const HMAX = H - FG_TOP;          // 96：杆高上限

  /* 扫描式，间距 26~46（同岩石）。 */
  let k = 0;
  for (let x = 10; x < W - 10; x += 26 + hash(k * 5.9) * 20, k++) {
    const px = x + (hash(k * 8.7) - 0.5) * 10;
    if (fgBlocked(px, 18)) { drawFgPebble(g, px, k, col); continue; }
    /* 中段一律碎屑。判据是**绝对像素**，不是归一化的 edge ——
       edge 那个 0.30 就是上一版"以为留空了其实没有"的来源。 */
    if (px > FG_SIDE && px < W - FG_SIDE) { drawFgPebble(g, px, k, col); continue; }
    const h = Math.min(62 + hash(k * 5.3) * 34, HMAX);
    const lean = (hash(k * 7.1) - 0.5) * 0.42;
    const tipX = px + lean * h * 0.5;
    const tipY = H - h;
    if (S._fgAudit) S._fgAudit.push(["fgreed", tipY, px]);

    g.save();
    g.globalAlpha = 0.55;
    g.strokeStyle = col;
    g.lineWidth = 3.2;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(px, H + 4);
    g.quadraticCurveTo(px + lean * 16, H - h * 0.55, tipX, tipY);
    g.stroke();
    // 受光的一侧：往右偏一点再描一条细的
    g.strokeStyle = lit;
    g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(px + 1.4, H + 2);
    g.quadraticCurveTo(px + lean * 16 + 1.2, H - h * 0.55, tipX + 1.0, tipY + 2);
    g.stroke();
    // 穗：杆矮了，穗跟着收，否则读作"杆上顶了个球"
    g.translate(tipX, tipY - 6);
    g.rotate(lean * 1.1);
    g.fillStyle = col;
    g.beginPath();
    g.ellipse(0, 0, 3.6, 10, 0, 0, 6.283);
    g.fill();
    g.restore();
  }
}



function drawForeground(g) {
  /* 三族的前景语言：
       hills  —— 灌木丛（底座团 + 12 片宽叶）
       cliffs —— 锯齿岩石块（没有叶子）
       marsh  —— 高杆芦苇（线条，几乎没有体积）
     这一层是"镜头前"：它一变，整屏的**空间感**就变了 ——
     同一条地平线，前面是灌木 = 草地，前面是岩块 = 峡谷，前面是苇杆 = 湿地。 */
  /* 深巢的前景是岩石，不是灌木。
     SCAPE 由 L.theme 决定，而深巢的 L.theme 是 "nest-xxx"（查不到）→ 落 hills →
     画出一排绿灌木。洞窟镜头前长灌木，比画错颜色更伤"这是地底"这件事。 */
  if (S.nest) { drawFgRocks(g); return; }
  if (SCAPE === "cliffs") { drawFgRocks(g); return; }
  if (SCAPE === "marsh") { drawFgReeds(g); return; }

  const base = TH.shrub || TH.grass;
  const lit = TH.shrubLit || base;
  const DEAD = GROUND_Y - 4;       // 552：盖住草皮鼓包，只淹掉球底 4px
  /* 9 丛。上一版 11 丛 × 5 根细叶，每丛体量比球还小 —— 用户原话是
     "灌木大点 自然很多"。剪影层的说服力靠**体量**，不靠丛数：
     9 丛做得大，下沿才是"几丛灌木挡着镜头"，不是"地上插了一排草"。 */
  /* 丛的位置**写死，不均分**。
     均分（i/(N-1)）会让每一丛落在等距位置上，中段必然压住火坑 / 营地 ——
     那是玩法目标，被前景吃掉之后玩家找不到该往哪儿推（实测第 1 关火坑被盖掉一半）。
     所以丛集中在两侧，中段 0.30~0.70 留空，视线和球道从中间穿过。 */
  const SPOTS = [0.065, 0.185, 0.305, 0.695, 0.815, 0.935];
  const N = SPOTS.length;

  /* ---------------------------------------------------------------------
     结构性避开坑和门口 —— 这一条不是调概率，是**硬约束**。
     ---------------------------------------------------------------------
     前景是"压在镜头前面的东西"：它盖住什么，什么就真的看不见。
     而坑和门口是玩家必须看见的玩法目标。

     原来的做法是"把丛集中在两侧、中段留空"，但那只管住了画面正中；
     第 1 关的火坑在 x = 500~600（t = 0.52~0.63），右缘和 0.695 那一丛
     （中心 667、半径 78）刚好重叠 —— **整个坑的下半截被草吃掉**，
     站在场上的火只剩三簇火苗尖。

     所以改成按当前关卡的 PITS / CAMP 实时构图：
     任何一丛的**主体**（底座团，按 ±0.45r 算，叶子尖不算）
     和某个坑（两边各留 24px）或门口重叠，整丛跳过。
     少一丛灌木不影响画面；盖掉一个火坑等于这一关没法玩。
   --------------------------------------------------------------------- */
  const KEEP_OUT = [];
  for (const pt of PITS) KEEP_OUT.push([pt.x - 40, pt.x + pt.w + 40]);
  KEEP_OUT.push([CAMP.x - 60, CAMP.x + CAMP.w + 60]);
  const blocked = (x, r) => KEEP_OUT.some(([a, b]) => x + r * 0.45 > a && x - r * 0.45 < b);

  for (let i = 0; i < N; i++) {
    const t = SPOTS[i];

    /* 两侧抬高的上限是 **40**（原 62）。
       62 是按"不碰 462 台面底 482"定的，但更硬的约束是**球顶 534**：
       `top_min = DEAD(552) - lift - 8`，lift=62 时算出 482 —— 比球顶高 52px，
       也就是说最外那几丛的顶会在球上方 52px 处横着，读作"球被草压住了"。
       收到 40 之后 `top_min = 504`，和芦苇/石堆同一个天花板。
       幂次 2.2（不是 1.5）：抬高只发生在最外侧那几丛，靠里的保持贴地，
       否则六丛连成一条等高齿条。 */
    const edge = Math.abs(t - 0.5) * 2;
    const lift = Math.pow(edge, 2.2) * 40;

    const r = 50 + hash(i * 3.7) * 28 + edge * 24;          // 50 ~ 102：一丛的半宽
    /* x 用 t × W 直接取，**不加外扩**。
       上一版是 -56 + t×(W+112)：最外那丛的中心落在 -23，整个人在屏幕外，
       只剩几片叶子伸进来 —— 拍出来底部"只有几根草"，看不出有一丛灌木。 */
    const x = t * W + (hash(i * 4.7) - 0.5) * 34;
    // 主体压到坑/门口就整丛跳过（判据只看底座团，叶子尖允许擦边）
    if (blocked(x, r)) continue;
    /* 顶端**故意不等高**：随机幅度放到 30px。
       原来所有丛都贴 552 线，拍出来是一排锯齿齿条；
       真实的一排灌木是错落的，高的挡住矮的。 */
    const top = DEAD - lift + hash(i * 5.3) * 30 - 8;
    if (S._fgAudit) S._fgAudit.push(["shrub", top, x]);
    const cy = top + r * 0.86;                              // 团心

    /* ① 底座 —— 低矮的暗团，只负责"这块地方是实心的"，不负责造型。
       上一版让团占满整个轮廓（0.82r 半径），拍出来是"一个绿色圆丘上面插了几根尖"，
       读作石头或土包。**造型交给叶子，团只垫底。** */
    g.fillStyle = base;
    blobPath(g, x, cy + r * 0.76, r * 0.86, i * 1.7 + 0.4);
    g.fill();
    blobPath(g, x - r * 0.68, cy + r * 0.60, r * 0.60, i * 3.1 + 1.6);
    g.fill();
    blobPath(g, x + r * 0.72, cy + r * 0.56, r * 0.56, i * 4.9 + 2.8);
    g.fill();

    /* ② 叶子 —— **一丛的主体是 12 片宽叶，不是那个团。**
       叶宽按长度算（bw = len × 0.34），长叶细一点、短叶宽一点。
       试过三档都不对：写死宽度 + 长度差 0.5 倍 → 灰绿色的铲子；
       bw = len×0.20 的细长叶 → "几根草"；只有 7 片 → 叶间漏出地面，
       读作"几片叶子插在地上"，不读作一丛灌木。密到 12 片，缝才被填上。
       叶根也不许在同一水平线上：从同一点放射出去就是海胆，
       根部高度按 hash 错开 0.4r，才是"从团里长出来"。 */
    for (let k = 0; k < 12; k++) {
      const spread = ((k + 0.5) / 12 - 0.5) * 1.86;         // -0.93 ~ 0.93
      const ang = spread * 1.05 - 0.10;                     // 整体略偏左，跟着光源
      const len = r * (0.48 + hash(i * 7.3 + k * 3.1) * 0.62);
      const rootX = x + spread * r * 0.70;
      const rootY = cy + r * (0.04 + hash(i * 5.9 + k * 1.7) * 0.38);
      const tipX = rootX + Math.sin(ang) * len * 1.35;
      /* 夹到 top 上：叶尖越线就戳到球道，玩家会读成"球卡在草里了"。 */
      const tipY = Math.max(top - 1, rootY - len * Math.cos(ang));
      const cosA = Math.cos(ang), sinA = Math.sin(ang);
      const bw = len * 0.34;
      const midX = (rootX + tipX) / 2, midY = (rootY + tipY) / 2;
      g.fillStyle = hash(i * 4.1 + k * 1.9) > 0.42 ? lit : base;
      g.beginPath();
      g.moveTo(rootX, rootY);
      g.quadraticCurveTo(midX - cosA * bw, midY + sinA * bw, tipX, tipY);
      g.quadraticCurveTo(midX + cosA * bw, midY - sinA * bw, rootX, rootY);
      g.closePath();
      g.fill();
    }
  }

  // 再压一道从底边往上 34px 的暗角，把"镜头下沿"收住。
  const vg = g.createLinearGradient(0, H - 40, 0, H);
  vg.addColorStop(0, "rgba(10,24,18,0)");
  vg.addColorStop(1, "rgba(10,24,18,.34)");
  g.fillStyle = vg;
  g.fillRect(0, H - 40, W, 40);
}

/* ============================================================================
   15. 绘制：单位
   ========================================================================== */

/**
 * 眼睛。
 * mouth: true = 笑 / "flat" = 一条直嘴 / "down" = 撇下去
 * droop: 0..1，眼皮下垂。**用"眼睛变扁 + 下压"来表达，不用皮肤色去盖** ——
 *        盖眼皮需要知道身体色，而这个函数在 HUD 头像里也被调（那里没有身体色参数）。
 */
function drawEyes(g, x, y, gap, r, face, mouth, droop) {
  const dr = droop || 0;
  const eh = r * (1 - dr * 0.52);
  const ey = y + dr * r * 0.22;
  g.fillStyle = COL.ink;
  g.beginPath();
  g.ellipse(x - gap, ey, r, eh, 0, 0, 6.283);
  g.ellipse(x + gap, ey, r, eh, 0, 0, 6.283);
  g.fill();
  g.fillStyle = "#FFFFFF";
  g.beginPath();
  g.ellipse(x - gap + face * 1.2, ey - eh * 0.4, r * 0.38, eh * 0.40, 0, 0, 6.283);
  g.ellipse(x + gap + face * 1.2, ey - eh * 0.4, r * 0.38, eh * 0.40, 0, 0, 6.283);
  g.fill();
  if (mouth) {
    g.strokeStyle = COL.ink;
    g.lineWidth = 1.6;
    g.beginPath();
    if (mouth === "down") {
      g.arc(x, y + r * 2.9, r * 1.0, Math.PI + 0.5, -0.5);
    } else if (mouth === "flat") {
      g.moveTo(x - r * 1.1, y + r * 2.3);
      g.lineTo(x + r * 1.1, y + r * 2.3);
    } else {
      g.arc(x, y + r * 1.9, r * 0.9, 0.2, Math.PI - 0.2);
    }
    g.stroke();
  }
}

/** 宠物：一个通用体 + 耳朵/尾巴变体。形状圆、描边厚，卡通第一原则 */
function drawPet(g, x, footY, w, h, H, face, o) {
  o = o || {};
  // 整体透明度。**必须由画的人传进来**：这个函数据内部会反复改 globalAlpha
  // （影子 0.18、受击闪白、眼睛高光），外面设一次 globalAlpha 会被它清掉。
  // 门口"影狐隐进阴影"就是踩过这个坑 —— 设了 0.2，画出来还是全不透明。
  const A = o.alpha === undefined ? 1 : o.alpha;

  // 有美术立绘就贴图（只有进 Cocos 才有），否则走下面这一整套代码图形。
  // 碰撞体始终是 w×h，贴图只改绘制，手感不变。
  const art = artOf("pet-" + H.id);
  if (art) { drawPetSprite(g, art, x, footY, w, h, face, A, o, H.id); return; }

  const sq = o.squash || 0;
  const bw = w * (1 + sq * 0.16);
  const bh = h * (1 - sq * 0.14);
  const cy = footY - bh * 0.5;

  // 影子
  g.globalAlpha = 0.18 * A;
  g.fillStyle = "#16261C";
  g.beginPath();
  g.ellipse(x, footY + 2, bw * 0.44, 5, 0, 0, 6.283);
  g.fill();
  g.globalAlpha = 1 * A;

  // 尾巴（画在身体后）
  g.fillStyle = H.c3;
  if (H.ears === "cat") {
    g.strokeStyle = H.c3;
    g.lineWidth = 6;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(x - face * bw * 0.38, cy + bh * 0.12);
    g.quadraticCurveTo(x - face * bw * 0.78, cy + bh * 0.02, x - face * bw * 0.66, cy - bh * 0.26);
    g.stroke();
  } else if (H.ears === "fox") {
    g.beginPath();
    g.moveTo(x - face * bw * 0.3, cy + bh * 0.16);
    g.quadraticCurveTo(x - face * bw * 0.9, cy + bh * 0.2, x - face * bw * 0.86, cy - bh * 0.16);
    g.quadraticCurveTo(x - face * bw * 0.6, cy + bh * 0.02, x - face * bw * 0.3, cy + bh * 0.16);
    g.fill();
  } else if (H.ears === "dog") {
    g.strokeStyle = H.c3;
    g.lineWidth = 5;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(x - face * bw * 0.4, cy + bh * 0.1);
    g.quadraticCurveTo(x - face * bw * 0.66, cy - bh * 0.1, x - face * bw * 0.5, cy - bh * 0.22);
    g.stroke();
  }

  // 身体
  g.fillStyle = H.c1;
  rr(g, x - bw / 2, footY - bh, bw, bh, Math.min(bw, bh) * 0.42);
  g.fill();
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.4;
  g.stroke();

  // 肚皮。belly 1 = 吃饱（撑出来）/ 0 = 饿扁。
  // 这是"饿"唯一不靠 UI 的表达：一只猫瘦了，玩家不需要读那个数字。
  const belly = o.belly === undefined ? 1 : o.belly;
  g.fillStyle = H.c2;
  g.beginPath();
  g.ellipse(x + face * bw * 0.05, footY - bh * 0.34,
            bw * (0.18 + 0.08 * belly), bh * (0.12 + 0.10 * belly), 0, 0, 6.283);
  g.fill();
  // 饿扁时补两道瘪纹。只把肚皮改小，在 40px 的角色上根本读不出来
  if (belly < 0.55) {
    g.strokeStyle = H.c3;
    g.lineWidth = 1.7;
    g.globalAlpha = 0.62 * A;
    for (let i = 0; i < 2; i++) {
      const yy = footY - bh * (0.24 + i * 0.12);
      g.beginPath();
      g.moveTo(x - bw * 0.15, yy);
      g.quadraticCurveTo(x, yy + 2.6, x + bw * 0.15, yy);
      g.stroke();
    }
    g.globalAlpha = 1 * A;
  }

  // 耳朵
  g.fillStyle = H.c1;
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.2;
  const ey = footY - bh;
  if (H.ears === "cat") {
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(x + s * bw * 0.30, ey + 4);
      g.lineTo(x + s * bw * 0.40, ey - 15);
      g.lineTo(x + s * bw * 0.10, ey - 2);
      g.closePath();
      g.fill();
      g.stroke();
    }
  } else if (H.ears === "rab") {
    for (const s of [-1, 1]) {
      g.beginPath();
      g.ellipse(x + s * bw * 0.22, ey - 16, 6, 18, s * 0.16, 0, 6.283);
      g.fill();
      g.stroke();
    }
  } else if (H.ears === "dog") {
    for (const s of [-1, 1]) {
      g.beginPath();
      g.ellipse(x + s * bw * 0.38, ey + 6, 7, 12, s * 0.5, 0, 6.283);
      g.fill();
      g.stroke();
    }
  } else if (H.ears === "ox") {
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(x + s * bw * 0.34, ey + 6);
      g.quadraticCurveTo(x + s * bw * 0.62, ey - 4, x + s * bw * 0.56, ey - 12);
      g.lineWidth = 5;
      g.strokeStyle = "#E8EEF4";
      g.stroke();
      g.lineWidth = 2.2;
      g.strokeStyle = COL.outline;
    }
  } else if (H.ears === "ham") {
    for (const s of [-1, 1]) {
      g.beginPath();
      g.arc(x + s * bw * 0.32, ey + 5, 8, 0, 6.283);
      g.fill();
      g.stroke();
    }
  } else if (H.ears === "fox") {
    for (const s of [-1, 1]) {
      g.beginPath();
      g.moveTo(x + s * bw * 0.32, ey + 3);
      g.lineTo(x + s * bw * 0.44, ey - 17);
      g.lineTo(x + s * bw * 0.06, ey - 1);
      g.closePath();
      g.fill();
      g.stroke();
    }
  }

  // 脸。mood 0 = 正常 / 1 = 丧。眼睛压扁 + 嘴撇下去，两处一起改才读得出来
  const mood = o.mood || 0;
  drawEyes(g, x + face * 2, footY - bh * 0.62, bw * 0.17, 3.2, face,
           mood > 0.5 ? "down" : (belly < 0.35 ? "flat" : true), mood * 0.85);

  // 鼻子
  g.fillStyle = "#E0708A";
  g.beginPath();
  g.ellipse(x + face * bw * 0.04, footY - bh * 0.50, 3, 2.2, 0, 0, 6.283);
  g.fill();

  // 没有立绘时的迈步：身体还是那个圆角矩形，两条腿从髋部对摆。
  // 腿画在身体之后，脚才会伸到轮廓外面 —— 缩在身体里等于没画。
  if (o.stepping) {
    const s = Math.sin(o.gait || 0) * bw * 0.62;
    g.strokeStyle = H.c3;
    g.lineWidth = Math.max(2.4, bw * 0.09);
    g.lineCap = "round";
    const hip = footY - bh * 0.28;
    g.beginPath();
    g.moveTo(x - face * bw * 0.10, hip);
    g.lineTo(x - face * bw * 0.10 + s, footY + 1);
    g.moveTo(x + face * bw * 0.18, hip);
    g.lineTo(x + face * bw * 0.18 - s, footY + 1);
    g.stroke();
  }

  // 出手瞬间的挤压
  if (o.flash > 0) {
    g.globalAlpha = o.flash * 0.7 * A;
    g.fillStyle = "#FFFFFF";
    rr(g, x - bw / 2, footY - bh, bw, bh, Math.min(bw, bh) * 0.42);
    g.fill();
    g.globalAlpha = 1 * A;
  }
}

/* ----------------------------------------------------------------------------
   贴美术立绘（只有进 Cocos 注入了图才会走到这里，见文件顶部的 ART）

   三件事和代码图形不一样，必须按图处理：
     ① 宽高比：立绘是 409×640 这种竖长的，硬按 w 画会把猫压成方的 ——
        所以按**高度**等比，宽度反推。
     ② 落脚点：立绘的脚在图片底边，所以底边对齐 footY。
     ③ 朝向：美术只画了一张（正面偏右），往左走靠 scale(-1,1) 镜像。

   画出来多高只看 PET_VIS_K（见下方）：立绘按体高缩放，不是按碰撞盒原样贴。
   -------------------------------------------------------------------------- */
/** 立绘的"体高 / 图高"。
 *
 *  美术管道（tools/prep_pets.py）出的六张是**统一体高**的：图高 640，
 *  脚底到头顶（不含耳朵）占 420，其余是耳朵和留白。420 / 640 = 0.656。
 *
 *  这个数只在两个地方出现：prep_pets.py 的 BODY_H / PET_H，和这里。
 *  改美术管道就要同步改 —— 不然六只的角色会集体变大或变小，
 *  而且因为六只一起变，单看画面很难发现，只有跟小怪并排才露馅。 */
const PET_BODY_K = 0.656;

/** 视觉体高 / 碰撞高。
 *
 *  **这个数是场景比例的唯一旋钮，改它等于改"宠物在画面里多大"。**
 *  画出来的图高 = 碰撞高 × PET_VIS_K / PET_BODY_K。
 *
 *  硬约束不是概念图，是两层平台之间的空：
 *    地面脚底 556，上一层台面 462，中间 94px；
 *    木板从台面往下画 33px（PLAT_TK），真正能站人的空气只剩 61px。
 *    立绘比 61px 高，头顶就插进上一层木板里。
 *
 *  走过的值，别再按"球直径 88"调回去 —— 那是量错的。
 *  普通球半径 22、直径 44（88 是 BOSS 球的直径）。
 *    1.82 / 1.60 → 猫的图高 107px，比空气缝还高 46px，头在木板里面。
 *    0.78 → 猫的图高 53px，身体和 44px 的球同一量级，头顶离木板还有空。
 *           老实牛碰撞最高（52），图高约 62px，刚好贴着缝的上沿。 */
const PET_VIS_K = 0.78;

/** 站立图上前后腿的切法。原图都朝左，split 左侧是前腿。
 *  hip 是髋在图高上的位置（0 = 图顶，1 = 脚底）。数字是对着六张立绘的
 *  不透明像素量的：再往上切会把肚子切进腿里，再往下切只剩脚尖。 */
const WALK_CUT = {
  cat: { hip: 0.87, split: 0.54 },
  dog: { hip: 0.90, split: 0.55 },
  fox: { hip: 0.87, split: 0.48 },
  ham: { hip: 0.93, split: 0.55 },
  ox:  { hip: 0.84, split: 0.55 },
  rab: { hip: 0.88, split: 0.52 },
};

function drawPetSprite(g, img, x, footY, w, h, face, A, o, id) {
  /* 影子：**径向渐变 + 朝左下偏移**，不是一块纯色椭圆。
   *
   * 两个问题一次修掉：
   * ① 纯色椭圆是硬边的。真实影子从接触点往外是渐隐的 ——
   *    硬边影子贴在任何背景上都读作"贴纸下面垫了个灰椭圆"。
   * ② 原来影子在正下方。但这一套背景的太阳固定右上 (700,74)，
   *    光从右上来，影子必然偏左下。正下方的影子等于宣告
   *    "这个角色身上的光和背景的光不是同一个光"—— 这一条比任何细节
   *    都更让角色像"抠图贴上去的"。
   *
   * 偏移量只给 w*0.15：再大，玩家会读不准"它的脚在哪"，
   * 而脚的位置直接关系到推球时的站位判断。视觉服从玩法。 */
  const shx = x - w * 0.15;
  g.save();
  g.translate(shx, footY + 2);
  g.scale(1, 0.20);
  const shg = g.createRadialGradient(0, 0, 1, 0, 0, w * 0.54);
  shg.addColorStop(0, "rgba(14,34,24,.30)");
  shg.addColorStop(0.52, "rgba(14,34,24,.15)");
  shg.addColorStop(1, "rgba(14,34,24,0)");
  g.globalAlpha = A;
  g.fillStyle = shg;
  g.beginPath();
  g.arc(0, 0, w * 0.54, 0, 6.283);
  g.fill();
  g.restore();
  g.globalAlpha = 1;

  const sq = o.squash || 0;
  /* dh 按**体高**算，不是按图高。
   *
   * 六张立绘是美术管道统一出来的：图高 640，其中体高（脚底到头顶）只占 420，
   * 顶上那 220 是耳朵和留给耳朵的留白。直接 `h * 1.35` 等于按图高缩，
   * 画出来身体只有该有的 65.6% —— 换图那天六只集体缩水三分之一，
   * 站在小怪旁边像只幼崽。 */
  const dh = h * PET_VIS_K / PET_BODY_K * (1 - sq * 0.14);
  const dw = dh * ((img.width || img.naturalWidth) / (img.height || img.naturalHeight)) * (1 + sq * 0.16);

  g.globalAlpha = 1 * A;
  g.save();
  g.translate(x, footY);
  /* 翻转判据是 **face > 0**，不是 face < 0。
   *
   * 立绘原图（pet-*.png）是朝**左**的：尾巴在画面左侧、身体朝左前侧。
   * 上一版写 `face < 0` 翻转，于是向右走/向右施法时贴的是原图 = 朝左，
   * 向左时反而被翻成朝右 —— 正好全反。玩家看到的就是"右施法、脸朝左"。
   *
   * 这条约束的前提是**六张立绘都朝左**。以后美术换图，先确认朝向再动这里，
   * 混着来会出现"猫朝右、狗朝左"这种一队人方向不一致的情况。 */
  if (face > 0) g.scale(-1, 1);
  // 出手闪白：代码图形是盖一层白矩形；贴图改提亮度，只作用于不透明像素，
  // 不会在角色周围留一个白框。浏览器不支持 filter 时赋值被忽略，不报错。
  //
  // 系数 0.8 不是 1.8。1.8 的时候 brightness 到 1.72，橙色猫直接被提成白猫 ——
  // 截图里看就是"换了只宠物"。闪白只该让人注意到"它在出手"，不该改颜色。
  if (o.flash > 0) g.filter = "brightness(" + (1 + o.flash * 0.8).toFixed(2) + ")";

  const cut = o.stepping && WALK_CUT[id];
  if (!cut) {
    g.drawImage(img, -dw / 2, -dh, dw, dh);
    g.restore();
    g.globalAlpha = 1;
    return;
  }

  /* 走路姿势：同一张站立图切三块。
   *   后腿、身体、前腿，绕髋关节对摆。身体反方向轻轻前倾。
   * 不做整只上下蹦 —— 那读成跳。脚离地是腿在转，身子的脚点不动。
   * 裁切发生在旋转之后的同一套坐标里，转出去的脚不会被切掉。 */
  const hipY = -dh * (1 - cut.hip);
  const xL = -dw / 2;
  const xR = dw / 2;
  const split = xL + dw * cut.split;
  const swing = Math.sin(o.gait || 0) * 0.95;
  const rock = Math.sin(o.gait || 0) * 0.10;
  const yTop = hipY - 2;
  const legH = 8 - yTop;

  function part(x0, y0, rw, rh, rot, px, py) {
    g.save();
    g.translate(px, py);
    g.rotate(rot);
    g.translate(-px, -py);
    g.beginPath();
    g.rect(x0, y0, rw, rh);
    g.clip();
    g.drawImage(img, xL, -dh, dw, dh);
    g.restore();
  }

  part(split - 3, yTop, xR - split + 8, legH, swing, (split + xR) / 2, hipY);
  // 身体只压过髋线 3px。再往下会把站立的脚也画出来，和摆出去的腿叠成两双脚。
  part(xL - 4, -dh - 8, dw + 8, hipY + 3 - (-dh - 8), -rock, 0, hipY);
  part(xL - 6, yTop, split - xL + 8, legH, -swing, (xL + split) / 2, hipY);

  g.restore();
  g.globalAlpha = 1;
}

/* ----------------------------------------------------------------------------
   BOSS 的外形：紫身体 + 两只角 + 白描边。要一眼看出"这是这关最大的东西"，
   靠的是尺寸和角，不是颜色 —— 颜色在八套主题里都会变。
   -------------------------------------------------------------------------- */
function drawBoss(g, f) {
  const cx = f.x, cy = f.y - f.h / 2;
  const bw = f.w, bh = f.h;
  const squash = f.hitT > 0 ? f.hitT / 0.20 : 0;
  const br = 1 + Math.sin(f.bob * 1.6) * 0.018;
  // 砸地抬手：整个身体先往上抬一点，再砸下来
  let lift = f.slamming > 0.35 ? -22 * Math.sin((1.15 - f.slamming) * 2.0) : 0;
  // 产卵：肚子鼓；吸气：整个身子缩一下。两个动作方向相反，玩家一眼分得清
  const breed = f.breeding > 0 ? Math.sin((0.9 - f.breeding) * 3.6) : 0;
  const suck = f.spitting > 0 ? Math.sin((0.72 - f.spitting) * 4.4) : 0;
  /* 断台 / 泥潮的抬手：**一起一伏**，不是"发着光站着"。
     静止的高亮读作"它中了状态"；有节奏的起伏才读作"它在蓄力"。
     断台往上顶（举拳砸高处），泥潮往下沉（往地里压）。 */
  const rais = f.cracking > 0 ? Math.sin((0.85 - f.cracking) * 5.2) * 11 : 0;
  const sink = f.mucking > 0 ? Math.sin((0.95 - f.mucking) * 4.6) * 7 : 0;
  lift -= rais;
  lift += sink;
  const OUT = COL.outline;

  g.globalAlpha = 0.22;
  g.fillStyle = "#1A1224";
  g.beginPath(); g.ellipse(cx, f.y + 3, bw * 0.44, 8, 0, 0, 6.283); g.fill();
  g.globalAlpha = 1;

  /* 蓄力圈：脚下往外扩的一圈光。
     为什么画在脚下而不是身上：**身上加亮会和"被打中"的闪白撞**，
     玩家分不出"它要出招"和"我打中了"。脚下画圈两件事不会混。 */
  if (f.cracking > 0 || f.mucking > 0) {
    const k = f.cracking > 0 ? 1 - f.cracking / 0.85 : 1 - f.mucking / 0.95;
    g.globalAlpha = 0.26 + 0.36 * (0.5 + 0.5 * Math.sin(S.t * 18));
    g.strokeStyle = f.cracking > 0 ? "#FF8A5C" : "#C9A277";
    g.lineWidth = 3;
    g.beginPath();
    g.ellipse(cx, f.y + 2, bw * (0.44 + 0.34 * k), 9 + 6 * k, 0, 0, 6.283);
    g.stroke();
    g.globalAlpha = 1;
  }

  g.save();
  g.translate(cx, cy + lift);
  g.scale((1 + squash * 0.14 + breed * 0.07) * br, (1 - squash * 0.12 - suck * 0.05) * br);
  g.save();
  // 只画朝右的版本，靠镜像翻面
  g.scale(f.face, 1);

  /* ---- 六条腿：先粗深色当描边，再细亮色当腿本身 ----
     单画一条线的话，在红棕身体上会糊成"一坨影子" */
  // 腿必须**伸到身体轮廓外面**才看得见。缩在身下的话，
  // 无论画多粗都会被鞘翅整个盖住 —— 那就变成了"一个没有腿的球"。
  const gait = Math.sin(f.bob * 4.2) * 4;
  const legs = [];
  for (let i = 0; i < 3; i++) {
    const lx = -bw * 0.26 + i * bw * 0.23;
    const ph = i % 2 ? gait : -gait;
    for (const sd of [-1, 1]) {
      legs.push([lx, bh * 0.12, lx + sd * 30 + ph, bh * 0.30, lx + sd * 34 + ph, bh * 0.50]);
    }
  }
  for (const [x0, y0, qx, qy, x2, y2] of legs) {
    g.strokeStyle = "#3A1A12"; g.lineWidth = 10; g.lineCap = "round";
    g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(qx, qy, x2, y2); g.stroke();
  }
  for (const [x0, y0, qx, qy, x2, y2] of legs) {
    g.strokeStyle = "#8E3A2A"; g.lineWidth = 4.5;
    g.beginPath(); g.moveTo(x0, y0); g.quadraticCurveTo(qx, qy, x2, y2); g.stroke();
  }

  /* ---- 触角：两根带球的须，虫子的第一识别特征 ---- */
  g.strokeStyle = "#3A1A12";
  g.lineWidth = 5;
  g.lineCap = "round";
  for (const sd of [-1, 1]) {
    const ex = bw * 0.42 + sd * 16, ey = -bh * 0.54;
    g.beginPath();
    g.moveTo(bw * 0.16 + sd * 6, -bh * 0.34);
    g.quadraticCurveTo(bw * 0.28 + sd * 14, -bh * 0.60, ex, ey);
    g.stroke();
    g.fillStyle = "#F2DFA8";
    g.beginPath(); g.arc(ex, ey, 5.5, 0, 6.283); g.fill();
    g.strokeStyle = OUT; g.lineWidth = 2; g.stroke();
    g.lineWidth = 5;
  }

  /* ---- 鞘翅（身体） ---- */
  const body = g.createLinearGradient(0, -bh * 0.50, 0, bh * 0.46);
  body.addColorStop(0, "#F0906A");
  body.addColorStop(0.42, "#D4664A");
  body.addColorStop(1, "#8E3A2A");
  g.fillStyle = body;
  g.beginPath(); g.ellipse(0, -bh * 0.02, bw * 0.48, bh * 0.44, 0, 0, 6.283); g.fill();
  g.strokeStyle = OUT; g.lineWidth = 3.6; g.stroke();

  // 背脊中缝：一块圆的红身体和"甲虫"的区别就在这条线
  g.strokeStyle = "rgba(64,22,14,.50)";
  g.lineWidth = 3;
  g.beginPath();
  g.moveTo(bw * 0.04, -bh * 0.42);
  g.quadraticCurveTo(bw * 0.10, -bh * 0.02, bw * 0.03, bh * 0.40);
  g.stroke();

  // 鞘翅上的斑点
  g.fillStyle = "#7A2A1E";
  for (const [sx, sy, r] of [[-bw * 0.22, -bh * 0.24, 0.095],
                             [-bw * 0.34, -bh * 0.10, 0.062],
                             [-bw * 0.10, bh * 0.02, 0.055]]) {
    g.beginPath();
    g.ellipse(sx, sy, bw * r, bw * r * 0.86, 0, 0, 6.283);
    g.fill();
  }
  // 背部高光：一个亮弧，读起来是"壳"，不是"皮"
  g.strokeStyle = "rgba(255,224,200,.42)";
  g.lineWidth = 5;
  g.lineCap = "round";
  g.beginPath();
  g.arc(0, -bh * 0.06, bw * 0.34, -2.5, -1.1);
  g.stroke();

  /* ---- 头 ---- */
  const hx = bw * 0.36, hy = bh * 0.10;
  g.fillStyle = "#C2563E";
  g.beginPath(); g.ellipse(hx, hy, bw * 0.20, bh * 0.19, 0, 0, 6.283); g.fill();
  g.strokeStyle = OUT; g.lineWidth = 3.2; g.stroke();

  // 嘴：吐弹时张开（配合 f.spitting）
  const jaw = f.spitting > 0 ? 1 : 0;
  g.fillStyle = "#3A1410";
  g.beginPath();
  g.ellipse(hx + bw * 0.10, hy + bh * 0.05, bw * 0.06, bh * (0.03 + jaw * 0.05), 0, 0, 6.283);
  g.fill();

  // 大颚：两片象牙色的钩子
  // 大颚：两片象牙色的钳子。要粗、要外张 —— 它是这张脸上唯一的"凶"信号，
  // 画细了就成了两根牙签。
  g.fillStyle = "#F7EAC0";
  g.strokeStyle = OUT;
  g.lineWidth = 3.4;
  g.lineJoin = "round";
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.moveTo(hx + bw * 0.06, hy + sd * 6);
    g.quadraticCurveTo(hx + bw * 0.34, hy + sd * 10, hx + bw * 0.30, hy + sd * 26);
    g.quadraticCurveTo(hx + bw * 0.22, hy + sd * 14, hx + bw * 0.02, hy + sd * 13);
    g.closePath();
    g.fill();
    g.stroke();
  }

  drawCuteEyes(g, hx - bw * 0.02, hy - bh * 0.03, 7.5, 8.5, false);

  /* ---- 苔藓层：糊了几层就贴几块，颜色递进 —— 这是唯一的"进度"反馈。
     只贴下半身：贴到脸上会把眼睛和嘴糊住，玩家就读不出"它举起来了"，
     砸地那一下的抬手是他唯一需要读的动作。 ---- */
  const cm = f.cm || 3;
  for (let i = 0; i < f.coat; i++) {
    const tt = f.coat === 1 ? 0.5 : i / (f.coat - 1);
    // 只贴**后半身**（左下 → 左上）。原来从 0.14π 开始贴，第一块正落在头的下面，
    // 读起来像"嘴里吐出来的绿球"，而且把大颚挡住了。
    // 打散：整齐排成一列会变成"背上一串葡萄"，看不出是"壳被糊住了"
    const ang = Math.PI * (0.56 + 0.68 * tt) + Math.sin(i * 3.7) * 0.22;
    const ring = 0.56 + ((i * 7) % 3) * 0.15;
    const mx = Math.cos(ang) * bw * 0.46 * ring;
    const my = bh * 0.02 + Math.sin(ang) * bh * 0.44 * ring;
    const sr = 12 + ((i * 5) % 3) * 3;
    g.globalAlpha = 0.85;
    g.fillStyle = i % 2 ? "#8FD35A" : "#6FBF46";
    g.beginPath(); g.ellipse(mx, my, sr + 3, sr, ang, 0, 6.283); g.fill();
    g.strokeStyle = OUT; g.lineWidth = 1.6; g.stroke();
    g.globalAlpha = 1;
  }

  g.restore();
  g.restore();
}

/** BOSS 的粘液弹：拖尾 + 高光。飞得快，没有拖尾就是"飘着的绿点" */
function drawFoeShots(g) {
  for (const s of S.foeShots) {
    const k = clamp(s.life / 2.4, 0, 1);
    g.globalAlpha = 0.30 * k;
    g.fillStyle = "#9BD24E";
    for (let i = 1; i <= 3; i++) {
      g.beginPath();
      g.arc(s.x - s.vx * 0.010 * i, s.y - s.vy * 0.010 * i, s.r * (1 - i * 0.24), 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;
    g.fillStyle = "#C7E86B";
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, 6.283); g.fill();
    g.strokeStyle = COL.outline; g.lineWidth = 2.2; g.stroke();
    g.fillStyle = "rgba(255,255,255,.85)";
    g.beginPath(); g.arc(s.x - s.r * 0.3, s.y - s.r * 0.34, s.r * 0.30, 0, 6.283); g.fill();
  }
}

/** 尘土画在前景之后、单位之前：它属于地面 —— 盖住角色的脚就成烟雾了。
 *  用 addColorStop 式的透明度串而不是 globalAlpha 累乘：颜色里带 alpha，
 *  一条 fill 就完事，省掉 save/restore。 */
function drawDust(g) {
  for (const d of S.dust) {
    const k = clamp(1 - d.life / d.max, 0, 1);
    g.fillStyle = d.col + (0.42 * (1 - k)).toFixed(3) + ")";
    g.beginPath();
    g.arc(d.x, d.y, d.r * (1 + k * 1.5), 0, 6.283);
    g.fill();
  }
}

function drawShocks(g) {
  for (const s of S.shocks) {
    const k = clamp(s.t / s.life, 0, 1);
    const h = 44 * (1 - k * 0.2);
    g.globalAlpha = 0.72 * (1 - k);
    g.strokeStyle = "#FFC46A";
    g.lineWidth = 8;
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(s.x - 20, s.y - 3);
    g.quadraticCurveTo(s.x, s.y - h, s.x + 20, s.y - 3);
    g.stroke();

    g.globalAlpha = 0.92 * (1 - k);
    g.strokeStyle = "#FFF6DC";
    g.lineWidth = 2.4;
    g.beginPath();
    g.moveTo(s.x - 11, s.y - 3);
    g.quadraticCurveTo(s.x, s.y - h * 0.72, s.x + 11, s.y - 3);
    g.stroke();
  }
  g.globalAlpha = 1;
}

/** Q 版脸。卡通和"小圆脸"的分界线就是有没有眼白 —— 没有眼白的敌人
 *  只是"带眼睛的圆"，看不出它在看哪儿，也读不出情绪。 */
function drawCuteEyes(g, x, y, r, gap, blink) {
  for (const s of [-1, 1]) {
    if (blink) {
      g.strokeStyle = COL.ink;
      g.lineWidth = 2.0;
      g.lineCap = "round";
      g.beginPath();
      g.arc(x + s * gap, y, r * 0.9, 0.34, Math.PI - 0.34);
      g.stroke();
      continue;
    }
    g.fillStyle = "#FFFFFF";
    g.beginPath(); g.ellipse(x + s * gap, y, r, r * 1.12, 0, 0, 6.283); g.fill();
    g.strokeStyle = COL.outline; g.lineWidth = 1.5; g.stroke();
    g.fillStyle = COL.ink;
    g.beginPath(); g.arc(x + s * gap + r * 0.26, y + r * 0.10, r * 0.54, 0, 6.283); g.fill();
    g.fillStyle = "rgba(255,255,255,.96)";
    g.beginPath(); g.arc(x + s * gap + r * 0.12, y - r * 0.36, r * 0.21, 0, 6.283); g.fill();
  }
  // 腮红：这两个点一加，整张脸就从"玩具"变成"活的"
  g.globalAlpha = 0.42;
  g.fillStyle = "#FF8FA0";
  for (const s of [-1, 1]) {
    g.beginPath();
    g.ellipse(x + s * (gap + r * 1.3), y + r * 1.5, r * 0.62, r * 0.4, 0, 0, 6.283);
    g.fill();
  }
  g.globalAlpha = 1;
}

/** 刺毛虫：三节身体 + 触角 + 六条小短腿。毛虫的读法是"分节"，不是"绿圆球" */
function drawWorm(g, f, bw, bh, t) {
  const d = f.def;
  // 三节要**都露出来**：头节画大了会把中节整个盖住，看起来就是"两个球"。
  // 所以头节只比中节大一点，节间距留够。
  const seg = [
    { x: -bw * 0.36, rx: 0.17, ry: 0.30, c: d.c3 },
    { x: -bw * 0.06, rx: 0.21, ry: 0.38, c: d.c1 },
    { x: bw * 0.27,  rx: 0.28, ry: 0.46, c: d.c1 },
  ];

  // 腿：左右各三条，交替摆 —— 没有腿的毛虫读起来像一坨面团
  g.strokeStyle = d.c3;
  g.lineWidth = 3.0;
  g.lineCap = "round";
  for (let i = 0; i < 3; i++) {
    for (const sd of [-1, 1]) {
      const sw = Math.sin(t * 9 + i * 1.5 + (sd > 0 ? 1.7 : 0)) * 2.6;
      g.beginPath();
      g.moveTo(seg[i].x + sd * 2, bh * 0.18);
      g.lineTo(seg[i].x + sd * 2 + sw, bh * 0.50);
      g.stroke();
    }
  }

  // 身体：尾 → 头，一节比一节大
  for (let i = 0; i < seg.length; i++) {
    const q = seg[i];
    g.fillStyle = q.c;
    g.beginPath();
    g.ellipse(q.x, 0, bw * q.rx, bh * q.ry, 0, 0, 6.283);
    g.fill();
    g.strokeStyle = COL.outline;
    g.lineWidth = 2.4;
    g.stroke();
    // 背上的斑点
    g.globalAlpha = 0.5;
    g.fillStyle = "#2F6B2A";
    g.beginPath();
    g.ellipse(q.x - bw * 0.06, -bh * 0.16 * q.ry * 2, bw * 0.045, bh * 0.05, 0, 0, 6.283);
    g.ellipse(q.x + bw * 0.06, -bh * 0.10 * q.ry * 2, bw * 0.035, bh * 0.04, 0, 0, 6.283);
    g.fill();
    g.globalAlpha = 1;
  }

  // 触角：两根带小球的触须，虫子的第一识别特征
  const hx = bw * 0.30, hy = -bh * 0.44;
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.0;
  g.lineCap = "round";
  for (const sd of [-1, 1]) {
    const ex = hx + sd * 9, ey = hy - bh * 0.34;
    g.beginPath();
    g.moveTo(hx + sd * 3, hy + 3);
    g.quadraticCurveTo(hx + sd * 12, hy - bh * 0.16, ex, ey);
    g.stroke();
    g.fillStyle = "#FFD34E";
    g.beginPath(); g.arc(ex, ey, 3.4, 0, 6.283); g.fill();
    g.strokeStyle = COL.outline; g.lineWidth = 1.2; g.stroke();
    g.lineWidth = 2.0;
  }

  drawCuteEyes(g, hx + 1, -bh * 0.02, 4.5, 4.7, false);
  g.strokeStyle = COL.outline;
  g.lineWidth = 1.6;
  g.lineCap = "round";
  g.beginPath();
  g.arc(hx + 2, bh * 0.16, 3.2, 0.25, Math.PI - 0.35);
  g.stroke();
}

/** 幼虫：两节小胖虫，只会往 BOSS 身边爬。它得比刺毛虫更小更傻，
 *  否则玩家会把它当成"又一波怪"，而不是"Boss 的口粮" */
function drawLarva(g, f, bw, bh, t) {
  const d = f.def;
  const wig = Math.sin(t * 15);

  g.strokeStyle = d.c3;
  g.lineWidth = 2.6;
  g.lineCap = "round";
  for (const bx of [-bw * 0.10, bw * 0.14]) {
    for (const sd of [-1, 1]) {
      const sw = Math.sin(t * 15 + bx) * 2;
      g.beginPath();
      g.moveTo(bx, bh * 0.16);
      g.lineTo(bx + sw, bh * 0.50);
      g.stroke();
    }
  }

  // 尾节（左）+ 头节（右）
  for (const [bx, r, col] of [[-bw * 0.20, 0.32, d.c3], [bw * 0.16, 0.44, d.c1]]) {
    g.fillStyle = col;
    g.beginPath();
    g.ellipse(bx, wig * (bx > 0 ? 1.4 : -1.4), bw * r, bh * 0.44, 0, 0, 6.283);
    g.fill();
    g.strokeStyle = COL.outline;
    g.lineWidth = 2.2;
    g.stroke();
  }
  // 一根小触角：和刺毛虫的两根区分开
  g.strokeStyle = COL.outline;
  g.lineWidth = 1.8;
  g.beginPath();
  g.moveTo(bw * 0.22, -bh * 0.36);
  g.quadraticCurveTo(bw * 0.30, -bh * 0.62, bw * 0.40, -bh * 0.56);
  g.stroke();

  drawCuteEyes(g, bw * 0.20, -bh * 0.02, 3.4, 3.6, false);
}

/** 乌鸦：圆胖身子 + 扇翅膀 + 呆毛。飞行敌人要"看得出来在飞"，靠翅膀和尾羽 */
function drawCrow(g, f, bw, bh, t) {
  const d = f.def;
  const flap = Math.sin(t * 12);

  // 尾羽
  g.fillStyle = d.c3;
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.0;
  for (const i of [-1, 0, 1]) {
    g.beginPath();
    g.moveTo(-bw * 0.24, 0);
    g.lineTo(-bw * 0.64, i * 7 - 3 + flap * 2);
    g.lineTo(-bw * 0.26, bh * 0.20);
    g.closePath();
    g.fill();
    g.stroke();
  }

  // 身体
  g.fillStyle = d.c1;
  g.beginPath(); g.ellipse(0, bh * 0.04, bw * 0.40, bh * 0.40, 0, 0, 6.283); g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 2.4; g.stroke();
  // 肚皮
  g.fillStyle = d.c2;
  g.beginPath(); g.ellipse(bw * 0.04, bh * 0.16, bw * 0.26, bh * 0.22, 0, 0, 6.283); g.fill();

  // 头
  const hx = bw * 0.20, hy = -bh * 0.30;
  g.fillStyle = d.c1;
  g.beginPath(); g.ellipse(hx, hy, bw * 0.27, bh * 0.27, 0, 0, 6.283); g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 2.4; g.stroke();

  // 呆毛
  g.strokeStyle = COL.outline; g.lineWidth = 2.2; g.lineCap = "round";
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.moveTo(hx - sd * 3, hy - bh * 0.22);
    g.quadraticCurveTo(hx - sd * 6, hy - bh * 0.48, hx - sd * 1, hy - bh * 0.52);
    g.stroke();
  }

  // 喙
  g.fillStyle = "#FFB443";
  g.beginPath();
  g.moveTo(hx + bw * 0.20, hy + 1);
  g.lineTo(hx + bw * 0.44, hy + 5);
  g.lineTo(hx + bw * 0.20, hy + 9);
  g.closePath();
  g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 1.8; g.stroke();

  // 翅膀：贴着身体两侧扇，扇的是"扁椭圆"，不是圆
  const wf = 0.55 + flap * 0.45;
  for (const sd of [-1, 1]) {
    g.fillStyle = sd > 0 ? d.c2 : d.c3;
    g.beginPath();
    g.ellipse(-bw * 0.06, bh * 0.02 + sd * 2, bw * 0.24 * wf, bh * 0.34, sd * 0.5, 0, 6.283);
    g.fill();
    g.strokeStyle = COL.outline; g.lineWidth = 2.0; g.stroke();
  }

  drawCuteEyes(g, hx + 1, hy - 1, 4.4, 4.8, false);
}

/** 小野猪：圆身子 + 大猪鼻 + 獠牙 + 卷尾巴。猪鼻是唯一识别点，画小了就认不出 */
function drawBoar(g, f, bw, bh, t) {
  const d = f.def;

  // 腿
  g.strokeStyle = d.c3;
  g.lineWidth = 5.4;
  g.lineCap = "round";
  for (const [bx, ph] of [[-bw * 0.26, 0], [-bw * 0.06, 1.6], [bw * 0.14, 0], [bw * 0.32, 1.6]]) {
    const sw = Math.sin(t * 10 + ph) * 3.2;
    g.beginPath();
    g.moveTo(bx, bh * 0.22);
    g.lineTo(bx + sw, bh * 0.50);
    g.stroke();
  }

  // 卷尾巴
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.2;
  g.beginPath();
  g.arc(-bw * 0.44, -bh * 0.06, 5.5, 0.9, 5.0);
  g.stroke();

  // 耳朵
  g.fillStyle = d.c3;
  g.strokeStyle = COL.outline;
  g.lineWidth = 2.0;
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.moveTo(bw * 0.12 + sd * 6, -bh * 0.32);
    g.lineTo(bw * 0.20 + sd * 10, -bh * 0.58);
    g.lineTo(bw * 0.30 + sd * 6, -bh * 0.26);
    g.closePath();
    g.fill();
    g.stroke();
  }

  // 身体
  g.fillStyle = d.c1;
  g.beginPath(); g.ellipse(0, bh * 0.02, bw * 0.48, bh * 0.44, 0, 0, 6.283); g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 2.6; g.stroke();
  // 浅色肚皮
  g.fillStyle = d.c2;
  g.beginPath(); g.ellipse(bw * 0.02, bh * 0.18, bw * 0.30, bh * 0.20, 0, 0, 6.283); g.fill();

  // 猪鼻：粉色大椭圆 + 两个鼻孔
  const nx = bw * 0.40, ny = bh * 0.08;
  g.fillStyle = "#F8A0B0";
  g.beginPath(); g.ellipse(nx, ny, bw * 0.13, bh * 0.14, 0, 0, 6.283); g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 1.8; g.stroke();
  g.fillStyle = "#8E4658";
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.ellipse(nx + sd * bw * 0.045, ny, bw * 0.020, bh * 0.045, 0, 0, 6.283);
    g.fill();
  }

  // 獠牙：两颗小白牙从鼻子下面翘出来
  g.fillStyle = "#FFF8EA";
  g.strokeStyle = COL.outline;
  g.lineWidth = 1.4;
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.moveTo(bw * 0.30 + sd * 5, bh * 0.22);
    g.quadraticCurveTo(bw * 0.36 + sd * 7, bh * 0.30, bw * 0.30 + sd * 3, bh * 0.36);
    g.lineTo(bw * 0.26 + sd * 5, bh * 0.24);
    g.closePath();
    g.fill();
    g.stroke();
  }

  drawCuteEyes(g, bw * 0.20, -bh * 0.16, 5.0, 5.6, false);
}

/* ============================================================================
   深巢四怪的代码图形（2026-10-26）
   ----------------------------------------------------------------------------
   四只都走"没有立绘就回退到代码图形"这条路，和主线四只同一套规矩。
   造型上刻意共用三条规则，目的不是画得好看，是**涂黑也能分辨**：

     · 线宽 3px（主线 2.5）—— 暗底上 2.5 会糊成一根毛
     · 圆角 0 —— 岩质生物没有柔角，和主线虫子的圆润形成对立
     · **底沿亮边**：光在脚下，每只的最下缘都有一条 accent 亮线

   **尺寸一律读 `def.vw / vh`，不读碰撞盒 bw/bh。**
   这是贴图那条路已经定死的规矩（见 drawFoe 里"画多大用 def.vw/vh"那段），
   代码图形没理由例外。第一版全按碰撞盒画，结果巢蛾只有设计尺寸的 62%、
   地脉虫 70% —— 并排图上一只直接看不见，两只读成了"锚"和"梯子"。
   碰撞盒是机制，视觉尺寸是观感，两个数不能互相冒充。

   剪影差异（涂黑也要能分开，这是这四只唯一的存在理由）：
     盲蛛   横宽 76 / 高 32 —— 八条折腿，全场最宽最扁
     石壳   正圆 52 —— 不规则岩块，没有任何一处同心圆弧
     巢蛾   上窄下宽的不对称翅 —— 唯一有眼斑的，悬空
     地脉虫 竖柱 + 大头 —— 唯一"顶端一个大团、下面是柱"的
   ========================================================================== */

/** 盲蛛：身体极小、八条腿外张。腿是两段折线（髋 → 膝 → 足），
 *  膝盖朝上 —— 蜘蛛的腿就是这么长的，画成单段斜线会读成"八根毛"。 */
function drawSpider(g, f, bw0, bh0, t) {
  const d = f.def;
  const bw = d.vw || bw0, bh = d.vh || bh0;
  /* 腿要伸到视觉宽的两端，所以按 `bw*0.5` 是**脚的位置**，不是起点偏移 */
  const legR = bw * 0.50;

  g.strokeStyle = COL.outline;
  g.lineWidth = 3;
  g.lineCap = "round";
  g.lineJoin = "round";
  for (let i = 0; i < 4; i++) {
    const k = i / 3;                                  // 0..1：从前到后
    const baseX = bw * (0.13 - k * 0.26);
    const spread = 0.55 + k * 0.45;                   // 后面的腿张得更开
    /* 摆动相位错开：四条腿同相位会读成"整只在抖"，错开才读成"在爬" */
    const sw = Math.sin(t * 7.5 + i * 1.7) * bh * 0.14;
    for (const sd of [-1, 1]) {
      const hipX = baseX, hipY = -bh * 0.08;
      const kneeX = baseX + sd * legR * 0.62 * spread;
      const kneeY = -bh * 0.60 - sw * sd;             // 膝在身体上方
      const footX = baseX + sd * legR * spread;
      const footY = bh * 0.42 + sw * sd;
      g.beginPath();
      g.moveTo(hipX, hipY);
      g.lineTo(kneeX, kneeY);
      g.lineTo(footX, footY);
      g.stroke();
      /* 关节：一个实心小圆点。**必须有** —— 没有关节点的两段折线
         在 32px 尺寸下读不出"折"，只剩一条弯线。 */
      g.fillStyle = d.c3;
      g.beginPath(); g.arc(kneeX, kneeY, 2.2, 0, 6.283); g.fill();
    }
  }

  /* 身体：后腹大、前头小，两个椭圆。整只最宽的地方是腿，不是身体。 */
  g.fillStyle = d.c1;
  g.beginPath(); g.ellipse(-bw * 0.06, bh * 0.08, bw * 0.20, bh * 0.40, 0, 0, 6.283); g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 3; g.stroke();
  g.fillStyle = d.c2;
  g.beginPath(); g.ellipse(-bw * 0.06, bh * 0.02, bw * 0.11, bh * 0.18, 0, 0, 6.283); g.fill();

  g.fillStyle = d.c1;
  g.beginPath(); g.ellipse(bw * 0.12, -bh * 0.04, bw * 0.13, bh * 0.28, 0, 0, 6.283); g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 3; g.stroke();

  /* "盲"：四个浅浅的凹点，没有瞳孔、没有高光。
     这是这只怪唯一的表情 —— 有眼睛就变成可爱，没有眼睛才读作"靠震动的"。
     四个点是蜘蛛的八眼简化，位置固定（颜色比身体暗两档，压到刚好能看见）。 */
  g.fillStyle = d.c3;
  for (const [ex, ey] of [[0.10, -0.18], [0.19, -0.18], [0.09, -0.08], [0.20, -0.08]]) {
    g.beginPath();
    g.arc(bw * ex, bh * ey, 1.7, 0, 6.283);
    g.fill();
  }

  /* 底沿亮边：光在脚下。**只在中段画**，两端各让 8% ——
     满宽的一条线在每个敌人的脚下都有，读起来是"贴了一条胶带"。 */
  g.strokeStyle = rgbaOf(d.c2, 0.7);
  g.lineWidth = 2;
  g.beginPath();
  g.moveTo(-bw * 0.24, bh * 0.42);
  g.lineTo(bw * 0.22, bh * 0.42);
  g.stroke();
}

/** 石壳：一块被磨圆的**不规则**岩块，靠起伏的轮廓和断面读"石头"。
 *
 *  第一版是三段同心圆弧 + 螺旋裂纹 + 底部弧形高光 —— 三个都是圆的规律特征，
 *  叠起来读作**钟表**（放大图上整个盘面连同指针都在）。
 *  石头的视觉特征是"没有一条规则的线"，所以这一版：
 *   · 轮廓用**固定表**给出 9 个半径系数（不许用 R()，会位移主线随机流）；
 *   · 表面画**断面**（一块块的面，不是弧），像被敲掉几层；
 *   · 裂纹是**分叉的折线**，不绕圆心；
 *   · 底部高光拆成**两小段断点**，不是一条压满的弧。
 *  滚动仍然靠整体 `rotate(spin)` —— 不规则轮廓转起来才看得见在滚，
 *  正圆转起来本来就什么都看不出来（这是第一版靠裂纹补的原因）。
 */
function drawShell(g, f, bw0, bh0, t) {
  const d = f.def;
  const bw = d.vw || bw0, bh = d.vh || bh0;
  const r = Math.min(bw, bh) * 0.5;
  /* 转动相位取它滚过的距离 `f.x`：滚动和位移永远同步，不需要额外计时器。
     `*0.028` 是"滚一圈 = 224px"，和半径 26 的周长 163px 同量级，
     看起来刚好不打滑。 */
  const spin = f.x * 0.028;

  /* 9 个顶点的半径系数 —— 常量表。写死是为了**同一块石头每帧同一个形状**，
     用随机数会让轮廓每帧抖一次，读成"在沸腾"。 */
  const RF = [0.98, 1.04, 0.95, 1.00, 1.06, 0.96, 1.02, 0.93, 1.01];
  const path = () => {
    g.beginPath();
    for (let i = 0; i < RF.length; i++) {
      const a = -Math.PI / 2 + (i / RF.length) * 6.283;
      const rr = r * RF[i];
      const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
      if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath();
  };

  g.save();
  g.rotate(spin);

  /* 石体：先铺底色，再用**断面**分亮暗。
     断面用三角形而不是圆弧 —— 三角形是"敲下来的"，圆弧是"车出来的"。 */
  g.fillStyle = d.c1;
  path(); g.fill();
  g.save();
  path(); g.clip();
  g.fillStyle = rgbaOf(d.c2, 0.22);
  g.beginPath();
  g.moveTo(-r * 0.10, -r * 1.1);
  g.lineTo(r * 0.72, -r * 0.55);
  g.lineTo(r * 0.30, r * 0.05);
  g.lineTo(-r * 0.55, -r * 0.30);
  g.closePath(); g.fill();
  g.fillStyle = rgbaOf(d.c3, 0.30);
  g.beginPath();
  g.moveTo(r * 0.98, r * 0.30);
  g.lineTo(r * 0.20, r * 1.12);
  g.lineTo(-r * 0.22, r * 0.62);
  g.lineTo(r * 0.30, r * 0.10);
  g.closePath(); g.fill();
  /* 底部压暗：它是踩在地上的，下缘必须沉，否则整块"飘" */
  const dg = g.createLinearGradient(0, r * 0.20, 0, r);
  dg.addColorStop(0, rgbaOf(d.c3, 0));
  dg.addColorStop(1, rgbaOf(d.c3, 0.55));
  g.fillStyle = dg;
  g.fillRect(-r, r * 0.20, r * 2, r * 0.85);
  g.restore();

  /* 裂纹：一条分叉的主缝 + 一条短缝。**折线不是弧** ——
     弧是表针，折线是裂缝。 */
  g.strokeStyle = rgbaOf(d.c3, 0.92);
  g.lineWidth = 1.9;
  g.lineJoin = "miter";
  g.beginPath();
  g.moveTo(-r * 0.86, -r * 0.30);
  g.lineTo(-r * 0.30, -r * 0.06);
  g.lineTo(r * 0.02, -r * 0.34);
  g.lineTo(r * 0.34, -r * 0.10);
  g.stroke();
  g.beginPath();
  g.moveTo(-r * 0.30, -r * 0.06);
  g.lineTo(-r * 0.16, r * 0.44);
  g.stroke();
  g.restore();

  /* 轮廓：线宽 3.4、圆角连接 —— 岩块的边是钝的，但绝不能没有棱 */
  g.strokeStyle = COL.outline;
  g.lineWidth = 3.4;
  g.lineJoin = "round";
  path(); g.stroke();

  /* 底沿亮边：**两小段断点**，不是一条压满的弧。
     满弧 = 抛光表壳反光；断点 = 粗石面被脚下光擦到。 */
  g.strokeStyle = rgbaOf(d.c2, 0.80);
  g.lineWidth = 2.6;
  g.lineCap = "round";
  for (const off of [-0.20, 0.22]) {
    g.beginPath();
    g.arc(0, 0, r * 0.93, Math.PI * (0.5 + off) - 0.16, Math.PI * (0.5 + off) + 0.16);
    g.stroke();
  }
}

/** 巢蛾：**剪影上下不对称** —— 上翅短而尖，下翅长而宽圆。
 *  对称的蝴蝶剪影和乌鸦分不开，不对称才一眼是"另一只"。
 *
 *  第一版读作"紫色小锚"：翅膀展幅只有 37px、下翅是细长条、没有花纹。
 *  这一版补三样，每一样都是"蛾"这个词的视觉词根：
 *   · 下翅**宽**（展到 bw*0.72）且后缘**扇贝形**（三个凸起）；
 *   · 下翅上一枚**眼斑** —— 蝶蛾最独有的花纹，乌鸦和虫都没有；
 *   · 触角**羽状**（主线一根曲线，这里带三根短羽枝）。
 */
function drawMoth(g, f, bw0, bh0, t) {
  const d = f.def;
  const bw = d.vw || bw0, bh = d.vh || bh0;
  const flap = Math.sin(t * 9);
  /* 被照亮时翅膀边缘发亮（`f.glowK` 由 updateFoe 每帧平滑写入）——
     玩家能看出"光在起作用、撞没用"。这是蛾子唯一的教学手段。
     用平滑量而不是 `f.litOn` 布尔：布尔在 150px 边界每帧翻转，光会闪。 */
  const glow = (f.glowK == null ? (f.litOn ? 1 : 0) : f.glowK) * 0.85;
  const burned = !!f.dazzled;
  const wingC = burned ? "#5A4A6A" : d.c3;
  const upC = burned ? "#6E5C80" : d.c1;
  /* 拍翅：展幅在 0.86~1.0 之间呼吸（不是 0.6~1.0 —— 蛾的翅本来就不合拢） */
  const span = 1 - Math.abs(flap) * 0.10;

  /* ---- 下翅（长、宽、圆，后缘扇贝形）：先画，压在身体后面 ---- */
  for (const sd of [-1, 1]) {
    const tipX = sd * bw * 0.72 * span;
    const botY = bh * (0.66 + flap * 0.07);
    g.fillStyle = wingC;
    g.beginPath();
    g.moveTo(sd * bw * 0.06, -bh * 0.06);
    g.quadraticCurveTo(tipX, -bh * 0.10, tipX * 0.94, bh * 0.24);
    /* 后缘三个凸起：两个内凹的接缝，读作"翅缘是软的" */
    g.quadraticCurveTo(sd * bw * 0.56, botY * 0.92, sd * bw * 0.44, botY * 0.80);
    g.quadraticCurveTo(sd * bw * 0.40, botY * 1.02, sd * bw * 0.28, botY * 0.86);
    g.quadraticCurveTo(sd * bw * 0.22, botY * 1.00, sd * bw * 0.10, botY * 0.62);
    g.closePath();
    g.fill();
    g.strokeStyle = COL.outline; g.lineWidth = 2.8; g.stroke();

    /* 眼斑：蛾的身份证。一个深色环 + 一个浅色心。 */
    const ox = sd * bw * 0.40, oy = bh * 0.26;
    g.fillStyle = rgbaOf(burned ? "#3A2E48" : d.c3, 0.95);
    g.beginPath(); g.ellipse(ox, oy, bw * 0.10, bh * 0.14, 0, 0, 6.283); g.fill();
    g.fillStyle = burned ? "#C8A050" : "#FFE9A8";
    g.beginPath(); g.ellipse(ox, oy, bw * 0.045, bh * 0.065, 0, 0, 6.283); g.fill();
  }

  /* ---- 上翅（短、尖）：比下翅短一半以上，不对称是这只怪的剪影身份 ----
     第一版展到 bw*0.60 却只有 bh*0.50 高，压在下翅上面几乎被吃掉；
     加大到 bw*0.68 / bh*0.62，让"上窄下宽"这条剪影在 46px 宽时还立得住。 */
  for (const sd of [-1, 1]) {
    g.fillStyle = upC;
    g.beginPath();
    g.moveTo(sd * bw * 0.05, -bh * 0.10);
    g.quadraticCurveTo(sd * bw * 0.68 * span, -bh * 0.62 - flap * bh * 0.10,
                       sd * bw * 0.38 * span, -bh * 0.30);
    g.quadraticCurveTo(sd * bw * 0.26, -bh * 0.30, sd * bw * 0.04, bh * 0.00);
    g.closePath();
    g.fill();
    g.strokeStyle = COL.outline; g.lineWidth = 2.6; g.stroke();
  }

  /* 被照亮：翅缘光 + 一圈**渐变**光晕。
     第一版是 `arc + rgbaOf(yellow, 0.10)` 的实心平涂 —— 硬边圆盘压在暗底上
     读作"身后挂了一块脏抹布"，完全不像光。光必须往外衰减，
     所以只留 `createRadialGradient`，从翅根 0.30 淡到边缘 0。 */
  if (glow > 0) {
    const hr = bw * 0.86;
    const hg = g.createRadialGradient(0, bh * 0.06, hr * 0.10, 0, bh * 0.06, hr);
    hg.addColorStop(0, rgbaOf("#FFE08A", 0.30));
    hg.addColorStop(0.55, rgbaOf("#FFE08A", 0.10));
    hg.addColorStop(1, rgbaOf("#FFE08A", 0));
    g.fillStyle = hg;
    g.beginPath(); g.arc(0, bh * 0.06, hr, 0, 6.283); g.fill();
    g.strokeStyle = rgbaOf("#FFE08A", glow * 0.75);
    g.lineWidth = 2.4;
    g.lineCap = "round";
    for (const sd of [-1, 1]) {
      g.beginPath();
      g.moveTo(sd * bw * 0.10, -bh * 0.02);
      g.quadraticCurveTo(sd * bw * 0.76 * span, -bh * 0.08, sd * bw * 0.70 * span, bh * 0.26);
      g.stroke();
    }
  }

  /* ---- 身体：三节重叠，读"毛绒"（一根柱子读作"针"） ---- */
  const bodyC = burned ? "#8A7A6A" : d.c2;
  g.fillStyle = bodyC;
  for (const [by, rx, ry] of [[-bh * 0.20, 0.11, 0.16], [bh * 0.04, 0.13, 0.18], [bh * 0.28, 0.10, 0.15]]) {
    g.beginPath(); g.ellipse(0, by, bw * rx, bh * ry, 0, 0, 6.283); g.fill();
  }
  g.strokeStyle = COL.outline; g.lineWidth = 2.4;
  g.beginPath(); g.ellipse(0, bh * 0.02, bw * 0.13, bh * 0.34, 0, 0, 6.283); g.stroke();

  /* ---- 触角：羽状。羽枝是"蛾"和"蝶"的分界，也是和乌鸦呆毛的分界 ---- */
  g.strokeStyle = COL.outline; g.lineWidth = 2;
  g.lineCap = "round";
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.moveTo(sd * bw * 0.04, -bh * 0.30);
    g.quadraticCurveTo(sd * bw * 0.26, -bh * 0.66, sd * bw * 0.52, -bh * 0.62);
    g.stroke();
    for (let i = 1; i <= 3; i++) {
      const u = i / 4;
      const ax = sd * (bw * 0.04 + (bw * 0.48) * u);
      const ay = -bh * (0.30 + 0.32 * u + 0.04 * Math.sin(u * 3.1));
      g.beginPath();
      g.moveTo(ax, ay);
      g.lineTo(ax - sd * bw * 0.06, ay - bh * 0.07);
      g.stroke();
    }
  }
  /* 眼睛：两个亮点。它是四只里唯一"有眼睛"的 ——
     因为它不靠眼睛干活（靠光），所以眼睛可以是装饰。 */
  g.fillStyle = burned ? "#FFB443" : "#FFF6D0";
  for (const sd of [-1, 1]) {
    g.beginPath(); g.arc(sd * bw * 0.07, -bh * 0.22, 2.0, 0, 6.283); g.fill();
  }
}

/** 地脉虫：住在岩壁/地里，**只露一个头**。
 *  `f.boreUp` 每帧由 updateFoe 写（1 = 探头 / 0 = 缩回）。
 *  缩回时身体退到地面线以下 —— 画面上"消失了"，而物理上它还在原地无敌。
 *
 *  第一版读作**木梯**：等距的 5 道横纹 + 一根直上直下的窄柱 + 顶上六根细线。
 *  "等距横纹"是梯子的定义，不是体节的定义。这一版：
 *   · 体节减到 3 道，**向下弯的弧**，间距不均（越往上越密，像被挤）；
 *   · 柱子**下粗上细且中间鼓**（虫子的体腔），不是等宽直筒；
 *   · 头做成**一个大团**：横宽 0.46bw，配两枚**厚弯颚**（张合），
 *     不再是六根放射细线 —— 六根细线读作"花瓣"，两枚厚颚读作"嘴"。
 */
function drawVein(g, f, bw0, bh0, t) {
  const d = f.def;
  const bw = d.vw || bw0, bh = d.vh || bh0;
  /* 探头动画：用 boreT 做个平滑过渡，直接切 0/1 会"闪"。
     `boreUp` 立刻生效（判定必须立刻），绘制用 0.18 秒滑过去。 */
  f._veinK = f._veinK == null ? (f.boreUp ? 1 : 0) : f._veinK;
  f._veinK += ((f.boreUp ? 1 : 0) - f._veinK) * 0.22;
  const k = f._veinK;
  /* 伸出的高度：1 = 全露，0 = 只剩地平线上一小截。
     上限从 `0.85bh` 收到 `0.64bh`：它的设定是"只露一个头"，
     身体露 47px 就不再是"从地里探头"，而是一根立着的柱子。
     露得短、头占比大，才读得出"钻出来"。 */
  const outH = bh * (0.24 + k * 0.50);

  const botY = bh * 0.62;                     // 埋进地里（正数 = 地面线以下）
  /* 头顶。露出的总高 = 头 + 一小截颈，**身体不许露出太长** ——
     它的设定是"只露一个头"，柱子露 45px 读作"立着的水管"。 */
  const topY = botY - outH - bh * 0.22;
  const headR = bw * 0.30;                    // 头半径（宽 0.60bw，比柱底 0.68bw 略窄）
  const headCY = topY + headR;
  const neckY = headCY + headR * 0.85;        // 头与身体的交界高度

  /* ---- 一体轮廓：地面 → 上收成颈 → 鼓成头 → 顶上收圆 ----
     三次迭代都错在同一处：**头和身体画成两个形状**。
     第一版两块硬接 → 读作"木梯 + 花"；第二版扁板悬在柱子上 → "蘑菇/图钉"；
     第三版收窄后还是"壶盖压柱子"，因为中间那条描边就是"盖子和柱子的分界"。
     这一版把头和身体走**同一条路径、一次 fill 一次 stroke**：
     中间没有任何线，头就是身体的顶端鼓起来的一块。
     脖子收窄到 0.16bw，头再张开到 0.26bw —— 沙虫钻出地面的那个形状。 */
  const wBot = bw * 0.34, wNeck = bw * 0.16;
  g.fillStyle = d.c1;
  g.beginPath();
  g.moveTo(-wBot, botY);
  g.quadraticCurveTo(-bw * 0.38, neckY + bh * 0.12, -wNeck, neckY);
  g.quadraticCurveTo(-headR * 1.06, neckY - headR * 0.20, -headR * 0.70, headCY - headR * 0.58);
  g.quadraticCurveTo(0, headCY - headR * 1.34, headR * 0.70, headCY - headR * 0.58);
  g.quadraticCurveTo(headR * 1.06, neckY - headR * 0.20, wNeck, neckY);
  g.quadraticCurveTo(bw * 0.38, neckY + bh * 0.12, wBot, botY);
  g.closePath();
  g.fill();
  g.strokeStyle = COL.outline; g.lineWidth = 3; g.stroke();

  /* 体节：3 道**向下弯**的弧，间距不均（0.18 / 0.46 / 0.70，越往上越密）。
     直横线是梯子，下弯弧是"一圈圈肉"。只画在颈以下，不许爬到头上去。 */
  g.strokeStyle = rgbaOf(d.c3, 0.60);
  g.lineWidth = 1.8;
  g.lineCap = "round";
  for (const u of [0.18, 0.46, 0.70]) {
    const yy = botY - (botY - neckY) * u;
    const hw = wBot + (wNeck - wBot) * u + bw * 0.02;
    g.beginPath();
    g.moveTo(-hw, yy + bh * 0.02);
    g.quadraticCurveTo(0, yy - bh * 0.09, hw, yy + bh * 0.02);
    g.stroke();
  }

  /* 头顶亮弧：光从上擦过。**只在上缘一小段**，铺满就变成"伞盖受光面"。 */
  g.strokeStyle = rgbaOf(d.c2, 0.85);
  g.lineWidth = 2.2;
  g.lineCap = "round";
  g.beginPath();
  g.moveTo(-headR * 0.62, headCY - headR * 0.66);
  g.quadraticCurveTo(0, headCY - headR * 1.12, headR * 0.62, headCY - headR * 0.66);
  g.stroke();

  /* 两枚厚弯颚：从头**下缘**向外下方张开（像钳子撑开），不是向内合拢。
     向内合的两条弧会在头的下缘拼成一个向上的月牙 —— 人眼一定读成**微笑**，
     整只就变成一张笑脸。起点靠中、终点甩到头的左右外侧，才是"钳"。 */
  g.strokeStyle = COL.outline;
  g.lineWidth = 4.0;
  g.lineCap = "round";
  const open = 0.10 + k * 0.26;
  const jy = headCY + headR * 0.42;
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.moveTo(sd * headR * 0.28, jy);
    g.quadraticCurveTo(sd * headR * 1.02, jy + bh * (0.12 + open * 0.35),
                       sd * headR * 1.45, jy + bh * (0.02 + open));
    g.stroke();
  }
  /* 口：两颚之间的深色小楔形，**偏下**。放正中会被两颚夹出"上弯的嘴"。 */
  g.fillStyle = "rgba(0,0,0,0.66)";
  g.beginPath();
  g.moveTo(-headR * 0.26, jy - bh * 0.02);
  g.lineTo(headR * 0.26, jy - bh * 0.02);
  g.lineTo(0, jy + bh * (0.08 + open * 0.5));
  g.closePath();
  g.fill();

  /* **不给眼睛**。四只里只有巢蛾有眼睛（它是装饰，因为它靠光不靠看）。
     地脉虫一加眼睛就变成表情包 —— 试过，整只读成"番茄脸"。
     盲蛛没眼睛也一眼是蜘蛛，虫子不需要眼。 */

  /* 缩回时：露出的那一小截上方压一道暗边，读作"缩回洞里了" */
  if (k < 0.55) {
    g.fillStyle = "rgba(0,0,0," + (0.60 * (1 - k / 0.55)).toFixed(3) + ")";
    g.beginPath();
    g.ellipse(0, botY - bh * 0.06, bw * 0.40, bh * 0.16, 0, 0, 6.283);
    g.fill();
  }

  /* 底沿亮边（光在脚下）：两小段断点，理由同石壳 */
  g.strokeStyle = rgbaOf(d.c2, 0.60);
  g.lineWidth = 2.4;
  g.lineCap = "round";
  for (const sd of [-1, 1]) {
    g.beginPath();
    g.moveTo(sd * bw * 0.08, botY - 2);
    g.lineTo(sd * bw * 0.28, botY - 2);
    g.stroke();
  }
}

function drawFoe(g, f) {
  if (f.isBoss) { drawBoss(g, f); return; }
  const d = f.def;
  const cx = f.x, cy = f.y - f.h / 2;
  const bw = f.w, bh = f.h;
  const squash = f.hitT > 0 ? f.hitT / 0.20 : 0;
  /* 雾里的怪：只给一双眼睛（雾巢，2026-10-27）。
     `f.fogLit` 由 `nestFogTick` 每帧写进来；没写过（主线、或者波的第一个
     渲染帧在 tick 之前）一律当"亮着"处理 —— 反过来判的话，主线第 1 帧
     会有一批怪只露眼睛，而主线根本没有雾。 */
  if (S.nest && f.fogLit != null && f.fogLit < 0.14) { drawFogEyes(g, f); return; }
  /* 步态相位用 `f.ph`（出生定死的偏移），**不是 `f.bob`**。
     `f.bob` 会被 updateFoe 每秒 +3.2，写成 `S.t + f.bob` 之后整条曲线被提速
     4.2 倍 —— 野猪从设计的 2.2 步/秒变成 9.3 步/秒，人眼读作"在原地抽"。
     `f.bob` 只留给乌鸦悬停（下面 Math.sin(f.bob)*2.5）和 BOSS 呼吸。 */
  const t = S.t + (f.ph || 0);

  /* 巢蛾也是悬空的（`def.kind === "moth"`，不是 "fly"）——
     它跟乌鸦一样不该有地面影子、也该有同款悬停起伏。
     这两个判定原来只认 `f.fly`，蛾子就在空中挂了条地面阴影，
     而且一动不动地"贴"在那条线上。 */
  const hovering = f.fly || d.kind === "moth";

  // 影子
  if (!hovering) {
    g.globalAlpha = 0.16;
