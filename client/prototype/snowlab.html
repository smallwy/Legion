        if (i >= 0) boxes.splice(i, 1);
      }
      const plat = { x: x0, y: py, w: PERCH_W, h: 34 };
      layers[k].terrain.push(plat);
      plats.push(plat);
      /* 金箱搬到台面上。**先把别处的 loot 摘掉** —— `lootTotal` 是按
         带 loot 的箱子数算的，留两口的话"挖到一个就算通关"，
         台子上那口就成了可选，这一关的意义当场消失。 */
      for (const b of boxes) if (b.loot) b.loot = false;
      const lb = { x: x0 + PERCH_W / 2 - 24, y: py - 48, w: 48, h: 48, mat: 'wood', loot: true };
      boxes.push(lb);
      perch = { x: x0, y: py, w: PERCH_W, h: 34, loot: { x: lb.x, y: lb.y }, cleared: best.n };
    }
  }

  /* ================= ⑨ 裂壳：终局的铺垫 =================
     只在第 12 / 24 / 36 / 44 关（四个场景各一块，见 RELIC_STAGES）。

     **换材质，不新建对象。** 一口木箱就地变成裂壳 —— 位置、尺寸、
     承重关系全部不变，于是"它会不会把路堵死""它会不会掉下来"
     这些问题全都不用重算（生成器已经算过了）。

     三条挑选规矩，每条挡掉一种"看起来像 bug"的情况：
       ① **不放在门厅层**：`validateLevel` 要求门厅有 3 口喂球木箱，
          换掉一口就可能把校验打红（而红的是生成器，不是我）；
       ② **顶上不许压箱子**：壳片是嵌在墙上的；摞在箱堆中间的话，
          玩家读作"这堵墙有一块是坏的"，而不是"这里能砸出东西"；
       ③ **不拿金箱 / 霜箱 / 木桶**：那三样各有各的用途，抢了就变了。 */
  let husk = null;
  if (relicOf(stage) >= 0) {
    const cand = [];
    for (const b of boxes) {
      if (b.loot || b.frost || b.mat !== 'wood' || b.barrel) continue;
      /* 门厅层（最后一层）跳过 —— 判据用"底边在门厅地板附近"，
         而不是"离哪层地板最近"：箱子可能摞在两格高，底边离地板 96，
         按最近层算会算到上一层去（而它其实就在门厅里）。 */
      if (b.y + b.h > floors[nF - 1] - 110) continue;
      /* 顶上压着箱子就跳过 */
      if (boxes.some(o => o !== b && Math.abs(o.y + o.h - b.y) < 4 &&
          o.x < b.x + b.w && o.x + o.w > b.x)) continue;
      cand.push({ b, d: Math.abs(b.x + b.w / 2 - 480) });
    }
    /* 取最靠中间的那口：壳片是"路上会撞见"的东西，不该藏在最边上。 */
    if (cand.length) {
      cand.sort((a, b2) => a.d - b2.d);
      const pick = cand[0];
      pick.b.mat = 'husk';
      husk = { x: pick.b.x, y: pick.b.y, w: pick.b.w, h: pick.b.h };
    }
  }

  return {
    seed, nFloors: nF, stage: (stage == null ? null : stage), skel,
    floors, layers, plats, boxes, deco, door, spawns, nests, boss, husk, perch,
    start: { x: startX, y: GEN.topY - PLAYER_H },
    worldH: WORLD_H, groundY: GROUND_Y,
  };
}

/** **每层的"走不走得通"，用脚量，不用眼看。**

    用户 2026-10-29：「空间设计要合理 不要有死胡同路」。

    生成器里已经有"主通道"（②-1.5）保证走廊列恒为 0、相邻列 ≤2 格，
    但那是**局部**的：它保证"从走廊上得去任何一座箱山"，不保证
    "任何一座箱山都连得上走廊"。地形（平台/雪包）会把走廊切断，
    洞会把楼板切成几段，箱子塌下来又会改列顶 —— 这些组合起来
    只能靠一遍 BFS 量。

    **移动能力就是判据，不是拍脑袋的阈值：**
      · 相邻列高差 ≤ 2 格（96）→ 直接走过去（跳高 123）
      · 中间隔着洞、洞宽 ≤ 144 → 跳过去（水平 300 × 滞空 0.686 = 205px，
        留 60px 给"落点没对准"；192 宽的洞理论上也够，但太紧，不认）
      · 地形（平台 96/114 高）不算阻挡：净空 214 − 114 = 100 > 身高 42，
        人从台子底下直接走过去，BFS 按地板算正好。

    返回没走到的列号。空数组 = 这一层是连通的。 */
function unreachableCols(L, k) {
  const COLS = 20;
  const l = L.layers[k];
  const stand = new Array(COLS).fill(false);
  for (let i = 0; i < COLS; i++) {
    const x = i * 48;
    stand[i] = l.segs.some(s => x >= s.x && x + 48 <= s.x + s.w);
  }
  const top = l.colTop || new Array(COLS).fill(l.floorY);
  const seen = new Array(COLS).fill(false);
  const q = [];
  if (k === 0) q.push(clamp(Math.floor(L.start.x / 48), 0, COLS - 1));
  else for (const h of L.layers[k - 1].holes) {
    for (let i = 0; i < COLS; i++) {
      const x = i * 48;
      if (x + 48 > h.x && x < h.x + h.w) q.push(i);
    }
  }
  /* **没有入口的层不算"走不到"，直接放行。**
     上一层如果没开出洞（生成残缺），这一层的起点集合就是空的，
     全 20 列都会被报成"走不到" —— 那是另一件事，由校验第 3 条
     「每层都得有洞」负责报。两条一起红会把失败原因指错地方
     （实测 seed 119 报的是"20 列走不到"，真因是上一层没出口）。 */
  if (!q.length) return [];
  while (q.length) {
    const i = q.pop();
    if (i < 0 || i >= COLS || seen[i] || !stand[i]) continue;
    seen[i] = true;
    /* ① 走到隔壁 */
    for (const j of [i - 1, i + 1]) {
      if (j < 0 || j >= COLS || seen[j] || !stand[j]) continue;
      /* **只限上坡，不限下坡。** 从 3 格箱顶走到地面是"走下去"（会掉下来），
         不是"跳上去" —— 判据必须是"j 最多比 i 高 96"。

         **原来的写法 `top[j] <= top[i] + 96` 是反的**（2026-10-29 发现）：
         y 向下增大，`top` 小 = 高，于是这条式子限制的是"j 最多比 i 低 96"，
         也就是**下坡限 96、上坡不限** —— 正好和注释相反。
         它一直没暴露，是因为削坡保证了 |高差| ≤ 2，两个方向都在 96 内；
         这一版"井梯 3 格 + 邻列 0 格"的组合（削坡动不了井梯，它被 LOCK 锁死）
         让它现形：地表层整段 8~19 列被判成"走不到"。 */
      if (top[j] >= top[i] - 96) q.push(j);
    }
    /* ② 跳过洞 */
    for (const d of [-1, 1]) {
      let j = i + d, gap = 0;
      while (j >= 0 && j < COLS && !stand[j]) { gap += 48; j += d; }
      if (j < 0 || j >= COLS || seen[j] || gap <= 0) continue;
      if (gap <= 144 && top[j] >= top[i] - 96) q.push(j);
    }
  }
  const miss = [];
  for (let i = 0; i < COLS; i++) if (stand[i] && !seen[i]) miss.push(i);
  return miss;
}

/* ================= 球有没有"死胡同" =================
   用户 2026-10-29：「空间设计要合理 不要有死胡同路 …… 主要是球进入了死胡同
   　比如上坡 完全推不上去了」。

   **这和 `unreachableCols` 是两个问题。** 那个问的是"人走不走得到"（人有二段跳、
   能翻 2 格），这个问的是"球推不推得出来" —— 球不会跳，只能被水平推，
   被推进一个四周都比它高一格以上的坑里就永久卡死（冰墙、铁箱、石台都砸不动）。

   判据只看列高：**左右相邻列都比本列高 ≥2 格** = 一格宽、两格深的窄沟。
   为什么是 2 格而不是 1 格：1 格的台阶球能翻过去（见 `ballHitBox` 里的
   "翻越"分支），2 格翻不过。这一条的实物形态就是"两座三格箱山夹一条缝"，
   一眼就能在结构图上认出来。

   **多列宽的坑不在这里管。** 它们靠 `colTop` 之外的通用约束兜（堆间至少留一列、
   走廊两侧限高 2 格），而且宽坑里球能横向滚，玩家也进得去推。 */
function ballPits(H) {
  const out = [];
  for (let i = 1; i + 1 < H.length; i++) {
    if (H[i - 1] - H[i] >= 2 && H[i + 1] - H[i] >= 2) out.push(i);
  }
  return out;
}

/** 一层里"球推不出来"的列。洞口列（脚下没地板）不算 —— 球掉下去是设计好的。 */
function ballStuckCols(L, k) {
  const COLS = 20;
  const l = L.layers[k];
  const stand = new Array(COLS).fill(false);
  for (let i = 0; i < COLS; i++) {
    const x = i * 48;
    stand[i] = l.segs.some(s => x >= s.x && x + 48 <= s.x + s.w);
  }
  return ballPits(l.colHgt || new Array(COLS).fill(0)).filter(i => stand[i]);
}

/** 生成后的自检。**这些不是"最好有"，是"没有就得死局"。** */
function validateLevel(L, verbose) {
  const bad = [];
  const F = L.floors, N = F.length;

  // 1. 相邻两层的洞不能重叠 —— 重叠就能一穿两层，中间那层等于不存在
  for (let k = 0; k + 1 < N; k++) {
    for (const p of L.layers[k].holes) {
      for (const q of L.layers[k + 1].holes) {
        if (p.x < q.x + q.w + 24 && q.x < p.x + p.w + 24) bad.push('洞第' + k + '/' + (k + 1) + '层重叠');
      }
    }
  }

  // 2. 每个洞正下方必须接得住（玩家宽 30，取洞内两端各内缩 20 验两次）
  for (let k = 0; k + 1 < N; k++) {
    const next = L.layers[k + 1].segs;
    for (const h of L.layers[k].holes) {
      for (const px of [h.x + 20, h.x + h.w - 20]) {
        if (!next.some(s => px >= s.x && px <= s.x + s.w)) bad.push('洞第' + k + '层没接住');
      }
    }
  }

  // 2a. 地形不能压在本层洞口上（会把唯一的出口盖住）
  for (let k = 0; k < N; k++) {
    for (const t of L.layers[k].terrain) {
      for (const h of L.layers[k].holes) {
        if (t.x < h.x + h.w + 16 && h.x < t.x + t.w + 16) bad.push('第' + k + '层地形盖住洞口');
      }
    }
  }

  // 2b. 落点带上不能有地形件（否则掉下去被平台接在半空，等于没掉）
  for (let k = 1; k < N; k++) {
    const dz = L.layers[k - 1].holes.map(h => [h.x - 24, h.x + h.w + 24]);
    for (const t of L.layers[k].terrain) {
      if (dz.some(z => t.x < z[1] && t.x + t.w > z[0])) bad.push('第' + k + '层地形接住了落点');
    }
  }

  // 3. 每层都得有洞（最后一层除外），且不能全被别的东西盖住
  for (let k = 0; k + 1 < N; k++) if (!L.layers[k].holes.length) bad.push('第' + k + '层没有出口');

  // 4. 出生点脚下是实心
  if (!L.layers[0].segs.some(s => L.start.x + 15 >= s.x && L.start.x + 15 <= s.x + s.w)) bad.push('出生点悬空');

  // 5. 门厅怪数 >= killTarget（单向关卡，一路不杀也得凑得够）
  /* **按 layer 判层，不能按 y 阈值。**
     箱子变成地形之后，门厅的怪会站在 2 格箱顶（y 比地板高 96），
     用 `y >= 地板 - 100` 判的话它会被算成"不在门厅"，于是校验报
     "门厅怪 1 < 3"、其实场上有 3 只 —— 白重掷了几十个种子。 */
  const hallFoes = L.spawns.filter(s => s.layer === N - 1).length;
  if (hallFoes < NUM.killTarget) bad.push('门厅怪 ' + hallFoes + ' < 门槛 ' + NUM.killTarget);

  // 6. 门厅必须有喂球木箱（清光怪之后的唯一活路）
  const feed = L.boxes.filter(b => b.mat === 'wood' && !b.frost && b.y >= F[N - 1] - 60 && b.y <= F[N - 1]).length;
  if (feed < 3) bad.push('门厅喂球箱 ' + feed + ' < 3');

  // 7. 每层至少一只怪
  for (let k = 0; k < N; k++) {
    if (!L.spawns.some(s => s.layer === k)) bad.push('第' + k + '层没有怪');
  }

  /* 7b. **第 43 关的悬台必须在场。**
     "没有悬台"和"悬台坏了"在图上看起来一模一样（都是一张普通关），
     而这一关的全部意义就是那块台子 —— 所以缺了要让 `buildLevel`
     换种子重掷，而不是悄悄退化成一张普通图。 */
  if (L.stage === PERCH_STAGE) {
    if (!L.perch) bad.push('第 43 关没有悬台');
    else {
      const pb = L.perch;
      if (Math.abs((F[N - 1] - pb.y) - PERCH_H) > 1) bad.push('悬台高度不对');
      if (!L.boxes.some(b => b.loot && Math.abs(b.x + b.w / 2 - (pb.x + pb.w / 2)) < 2)) {
        bad.push('悬台上没有金箱');
      }
    }
  }

  // 8. 怪不能生在斜坡/雪包里（脚的 y 停在坡底、坡面却高出一截 → 永远贴在坡体内）
  for (const sp of L.spawns) {
    const k = sp.layer;
    for (const t of L.layers[k].terrain) {
      if (t.kind !== 'ramp') continue;
      if (t.x - 12 < sp.x + 34 && t.x + t.w + 12 > sp.x) bad.push('第' + k + '层怪生在地形里');
    }
  }

  /* 9~12：箱子结构。**这是"箱子当路"能不能成立的四个硬条件** ——
     少一条，箱子就退化成墙、或者退化成纯装饰。 */
  for (let k = 0; k < N; k++) {
    const l = L.layers[k];
    const H = l.colHgt || [];
    /* 9. 本层箱子够多。这是"探索材料"的底线 ——
       用户抱怨的就是"箱子很少，这点内容怎么探索"。门厅要留给门和通道，标准低一档。 */
    const cnt = L.boxes.filter(b => b.y < F[k] - 1 && b.y + b.h > F[k] - 200).length;
    /* 14 口是下限，不是目标 —— 生成侧的实际中位数在 20 上下走。
       **门槛设太高会让 buildLevel 反复重掷**，而重掷只会换种子，
       不会让某一层突然多出箱子（地形占的列是固定的）。
       **门槛还要和"这一层几何上摞得下几口"取小**（和生成侧 `topUp` 同一条公式）：
       地形 / 洞口缘 / 走廊 / 楼板断口会把地表层的可摞列吃到只剩两三列，
       这时 8 口是物理上达不到的，红在这条上只会让 buildLevel 白重掷几十次。 */
    const cap = (l.colCap && l.colCap.length) ? l.colCap.reduce((a, b) => a + b, 0) : Infinity;
    const need = Math.min((k === 0 || k === N - 1) ? 8 : 10, cap);
    if (cnt < need) bad.push('第' + k + '层箱子只有 ' + cnt + '（要 ≥' + need + '）');
    /* 10. 相邻列高差 ≤ 2 格（96 < 跳高 123）—— 再高就爬不上去，箱山变墙 */
    for (let i = 0; i + 1 < H.length; i++) {
      if (Math.abs(H[i] - H[i + 1]) > 2) bad.push('第' + k + '层第' + i + '列高差 ' + Math.abs(H[i] - H[i + 1]));
    }
    /* 11. 至少 1 列低点（高度 ≤1）。
       **原来要求"≥2 列完全空"，被削坡打回来了** —— 削坡优先抬高低的那边，
       会把 0 抬成 1。其实"低点"就够：一层里总要有个落脚处，不必是光地面。 */
    let flats = 0;
    for (let i = 0; i < H.length; i++) if (H[i] <= 1) flats++;
    if (flats < 1) bad.push('第' + k + '层一个低点都没有');
  }
  /* 12. 全关至少一口金箱（探索的奖励落点，没有它就只剩"搬箱子"） */
  if (!L.boxes.some(b => b.loot)) bad.push('没有金箱');

  /* 13. **每层都走通，不许有走不到的列。**（2026-10-29）
     "走不到"在这个玩法里不是小事：那一列的箱子/怪玩家永远够不着，
     钱箱可能就埋在里面；如果是怪，**杀不够数门就不开** —— 那是硬死局。
     判据见 unreachableCols，按真实移动能力（2 格高差 / 144 宽的洞）。 */
  for (let k = 0; k < N; k++) {
    const miss = unreachableCols(L, k);
    if (miss.length) bad.push('第' + k + '层有 ' + miss.length + ' 列走不到（列 ' + miss.slice(0, 4).join(',') + '）');
  }

  /* 14. **球不会跳，所以"人能走到"不等于"球推得出来"。**（2026-10-29）
     判据见 ballPits：左右都比本列高 2 格 = 一条 1 列宽的深沟，
     球滚进去之后怎么推都出不来（只能等它 16 秒后自己化掉）。
     这一条和 13 是互补的：13 管人、14 管球，缺一个都会在实机上出现
     "我在上面看着球，推不到它" —— 那不是难度，是关卡的错。 */
  for (let k = 0; k < N; k++) {
    const pits = ballStuckCols(L, k);
    if (pits.length) bad.push('第' + k + '层有 ' + pits.length + ' 个球坑（列 ' + pits.slice(0, 4).join(',') + '）');
  }

  if (verbose && bad.length) console.log('  ✗ 校验未过：' + bad.join(' / '));
  return bad.length === 0;
}

/** 换种子重掷，直到过校验。80 次都不过就返回最后一个 —— 宁可跑起来，
    让断言把它抓出来，也不要卡在初始化里。 */
function buildLevel(seed, stage) {
  const base = (seed == null ? 1 : seed) >>> 0;
  let last = null;
  for (let t = 0; t < 80; t++) {
    const s = (base + t * 7919) >>> 0;
    const L = genLevel(s, stage == null ? null : stage);
    last = L;
    if (validateLevel(L)) { L.seed = s; return L; }
  }
  return last;
}

/* ---------------------------------------------------------------- 初始化
   **`reset()` 不带参数是"重开这一关"，`reset(seed)` 是"换一张图"。**
   两者的区别很重要：断言里到处调 reset() 期望回到同一个状态，
   如果 reset() 每次重新掷骰子，所有"前后对比"的断言都会随机红。
   所以种子存在模块级的 LEVEL_SEED 里，只有 newLevel() 会换掉它。 */
function newLevel(seed) {
  LEVEL_SEED = (seed == null ? (Math.random() * 1e9) : seed) >>> 0;
  reset();
}

/* ---------------------------------------------------------------- 主线关号
   **出征页 → 第 N 关 → 通关 → 第 N+1 关。** 这一条链路是 CR-031 落地时
   漏掉的最后一环：STAGES 表和 48 关骨架都在，但玩家手里没有"关号"，
   通关只是停在结算卡片上按 R 换一张随机图 —— 那不是 48 关，那是无尽模式。

   **种子由关号派生，不随机。** 第 7 关在谁的机器上都是同一张图 ——
   否则"我卡在第 7 关"没法复现，也没法把种子发给别人试。
   （深潜正好相反：那边一命往下，图必须换，所以走 seed + depth 的混合。） */
const SNOW_SAVE_KEY = 'pawpack.snow';
const STAGE_MAX = 48;

/* ---------------------------------------------------------------- 关卡目标
   CR-032 第 2 步：「48 关现在通关只有『进门』一种」。三星解决了"重打理由"，
   但没解决**关与关不同** —— 第 7 关就见过全部 6 种骨架，剩下 41 关是
   同一批走法配更多箱子（`_shape-probe.js` 的洞 x 集合几乎逐关重复）。

   加目标不是加内容量，是加**问题类型**。三种目标对应三个不同的解法方向：

     破门 door    杀够 N 只 → 门开。基线，也是教学段唯一的一种。
     寻宝 collect 挖出本关那口金箱 → 门开。**不要求击杀**，但要横穿全图砸箱。
     省球 limit   杀够 N 只 → 门开，但本关只有 3 颗满球，之后裹出来的是残球。

   分配规则**必须确定性**（同关号 → 同目标）：否则"我卡在第 13 关"没法复现，
   也没法分享。用 `floor((n-1)/6) % 3` 而不是 `n % 3`，是为了让它和骨架
   **正交**：骨架 = `(n-1) % 6`，每 6 关一轮；目标按轮次换。
   于是第 7 关 = 熟悉的空间 + 新的问题，正好接上"第 7 关就见过全部骨架"那个坑。

   **为什么不用 nohit 当第三种**（CR-032 原文写的是 collect / limit / nohit）：
   nohit 已经是三星里的第一颗（"一毛不拔"）。目标和星不能同一个判据 ——
   那等于把同一件事数两遍，玩家打通关就白拿两颗。
   目标和星的分工：**目标是准入条件（门开不开），星是评价（打得好不好）**。 */
const GOAL_LIST = ['door', 'collect', 'limit'];
const GOAL_CN = { door: '破门', collect: '寻宝', limit: '省球' };
const GOAL_SAY = {
  door: '破门：清够怪，门就开',
  collect: '寻宝：挖出藏起来的金箱，门就开',
  limit: '省球：只有 3 颗满球，之后裹出来的是残球',
};
/** 省球关里"满球"的颗数。之后裹出来的球寿命 ×0.45 */
const GOAL_STRONG_BALLS = 3;

/**
 * 关号 → 目标。**纯函数，不读 S** —— 断言要能直接问"第 N 关是什么目标"，
 * 而 reset 之前 S.stage 还是上一关的值。
 *
 * `stage` 为 null（旧行为/出图工具）或负数（深潜）时一律回基线：
 * 深潜是"一命到底"，它的张力来自资源一路消耗，再加目标会两头打架。
 */
function goalOf(stage) {
  const n = Math.floor(stage == null ? 0 : stage);
  if (!(n > 0)) return 'door';
  if (n <= 6) return 'door';      // 教学段：推球 / 下洞 / 井梯，只教推门
  return GOAL_LIST[Math.floor((n - 1) / 6) % GOAL_LIST.length];
}

/* **三星（CR-032 迁移第一步）。** 口径从 grove 的 `STAR_JUDGE` 搬过来 ——
   那边 27 屏每屏 3 颗、共 81 颗，靠"防守 / 效率 / 彻底"三个互不重叠的维度
   给同一张图三种打法。snowlab 的 48 关原来通关只有「进门了」，
   零反馈、零重打理由；三星是这个成本最低的补丁（**不动任何玩法代码**）。

   为什么不用「限时」这颗星：grove 的 `par.time` 是**每屏手调**的（60→100），
   而 snowlab 是生成器关卡，一关时长从 20 秒到 3 分钟不等（3 层 30 口箱子
   vs 5 层 104 口），拍一个统一秒数要么全白送、要么全卡死。
   等跑出真实通关时长分布再补，不猜。 */
const STAR_LIST = ['nohit', 'bigchain', 'clearout'];
const STAR_CN = {
  nohit: '一毛不拔',
  bigchain: '大打卷',
  clearout: '一只不留',
};
const STAR_HINT = {
  nohit: '一次都没挨打',
  bigchain: '一颗球连碎 4 口',
  clearout: '本关的怪全部清掉',
};
const STAR_JUDGE = {
  nohit: () => S.stat.hits === 0,
  bigchain: () => S.stat.ballChainMax >= 4,
  /* `killedTarget > 0` 是防御：有些关（教学关）怪是 0，
     不挡的话"0 只全清掉"会白送一颗。 */
  clearout: () => S.killedTarget > 0 && S.killed >= S.killedTarget,
};
/** 本关拿到的星（id 数组）。 */
function judgeStars() {
  const out = [];
  for (const id of STAR_LIST) if (STAR_JUDGE[id]()) out.push(id);
  return out;
}
/** id 数组 → 位掩码（bit i = STAR_LIST[i]）。
 *  **存位不存数组**：`writeSnowProgress` 是 `Object.assign` 浅合并，
 *  数组每次都整体替换，重打一关会把别的关的星冲掉。 */
function starBits(ids) {
  let b = 0;
  for (const id of ids) {
    const i = STAR_LIST.indexOf(id);
    if (i >= 0) b |= (1 << i);
  }
  return b;
}
/** 某一关已经拿到过的位掩码。0 = 没拿过。 */
function readSnowStar(stage) {
  const s = (readSnowProgress().stars || {})[String(stage)];
  return typeof s === 'number' ? s : 0;
}
function writeSnowStar(stage, bits) {
  const o = readSnowProgress();
  const stars = Object.assign({}, o.stars || {});
  const k = String(stage);
  /* **只增不减。** 重打一次只拿 1 颗不能把之前的 3 颗冲掉 ——
     星数是"我做到过"，不是"我这一次做到"。 */
  stars[k] = Math.max(stars[k] || 0, bits);
  writeSnowProgress({ stars: stars });
}

/* ---------------------------------------------------------------- 雪晶 / 图鉴
   CR-032 第 4 步。**通关之后没有目标**，是这个游戏最实的一条短板：
   48 关打完，存档里只有 `{stage, stars}`，玩家手上没有任何"还差什么"。

   补齐的方式**不是加数值成长**（那会让关卡难度变成一张假表：老玩家靠
   属性碾，新玩家卡死在同一关，同一份关卡要伺候两种人），而是三件不碰数值的事：

     ① **雪晶**（coins）—— 只进不出的货币是装饰。所以它有一个**真出口**：
        出门前买补给（见 BUY_LIST）。买来的东西只作用于**这一关**，不进
        永久属性。它的作用是"我卡在第 31 关，我愿意花 30 雪晶换一条命"，
        而不是"我刷够钱就能变强"。
     ② **图鉴**（codex）—— 记录"我见过什么"。四套场景的介质规则、三种怪的
        动法、终局的壳。它不给数值，给的是**玩家自己发现"这东西还有另一种"**。
     ③ **裂壳**（relic）—— 前 47 关里散落的 BOSS 壳碎片。它既是图鉴的
        解锁钥匙，也是"终局不是凭空冒出来的"那一条铺垫（见 RELIC_STAGES）。

   **存档是浅合并**（`writeSnowProgress` 是 Object.assign），所以 coins 这类
   标量可以直接写，codex 这类嵌套对象必须整块读-改-写回去 ——
   和 stars 同一个坑：整体替换会冲掉别的场景的记录。 */
function snowCoins() {
  const v = readSnowProgress().coins;
  return typeof v === 'number' && isFinite(v) ? v : 0;
}
function addSnowCoins(n) {
  const v = Math.max(0, Math.round(snowCoins() + n));
  writeSnowProgress({ coins: v });
  return v;
}
/** 扣钱。**不够就返回 false，不扣成负数** —— 负数存档会让下一次"我明明有 30"
 *  变成"怎么买不了"，而余额显示是截断的，玩家查不出来。 */
function spendSnowCoins(n) {
  const cur = snowCoins();
  if (n > cur) return false;
  writeSnowProgress({ coins: Math.round(cur - n) });
  return true;
}

/** 图鉴：见过的场景 / 见过的怪。键是 id，值是 1（见过）。
 *  **只记"见过"，不记次数** —— 次数没有信息量，而"哪几个还没见过"才是
 *  玩家会去凑的东西。 */
function codexSeen(kind) {
  const c = readSnowProgress().codex;
  const m = (c && typeof c === 'object' && c[kind] && typeof c[kind] === 'object') ? c[kind] : {};
  return m;
}
function codexMark(kind, id) {
  if (!id) return false;
  const c = Object.assign({}, readSnowProgress().codex || {});
  const m = Object.assign({}, (c[kind] && typeof c[kind] === 'object') ? c[kind] : {});
  if (m[id]) return false;
  m[id] = 1;
  c[kind] = m;
  writeSnowProgress({ codex: c });
  return true;
}
/** 裂壳收集进度（0~4）。**和 codex 分开存**：它是"数了几个"，不是"见过没有"，
 *  混进 codex 的话"集齐"这件事就得遍历一遍对象去数。 */
function relicCount() {
  const v = readSnowProgress().relic;
  return typeof v === 'number' && isFinite(v) ? clamp(v, 0, 99) : 0;
}
function addRelic() { return addSnowProgressNum('relic', 1, 99); }
/** 通用的"存档里某个计数器 +n"。夹在 [0, cap] 里，避免一份坏存档把 UI 撑爆。 */
function addSnowProgressNum(key, n, cap) {
  const cur = readSnowProgress()[key];
  const v = clamp((typeof cur === 'number' && isFinite(cur) ? cur : 0) + n, 0, cap == null ? 1e9 : cap);
  writeSnowProgress({ [key]: v });
  return v;
}

/* ---- 裂壳：终局的铺垫（CR-032 遗留第 5 条）--------------------------------
   **问题不是"BOSS 太少"，是"第 48 关凭空冒出个东西"。** 前 47 关没有任何
   一处提到它，玩家推开门看见三层壳的巨物，第一反应是"这是另一个游戏的怪"，
   而不是"我终于走到它面前了"。

   补法**不是**加怪（再加一只怪只是让 BOSS 更突然）。是在四个场景各留一块
   **它撞碎时掉下来的壳片**，嵌在墙里、砸开能抠出来：

     第 12 关（霜原末）  壳片边缘还是湿的 —— 它从这儿开始往上撞
     第 24 关（熔炉末）  壳片烧黑了 —— 它穿过了火
     第 36 关（菌窟末）  壳片长满苔 —— 它在这儿躺了很久
     第 44 关（沙塚前）  壳片是新裂的 —— 它就在下面

   四片凑齐，图鉴里那一条「终局」才从"？"变成一段话。**它不影响任何
   通关条件**（不是金箱、不进 `lootTotal`），所以拿不拿得到都能过关 ——
   这是"给愿意看的人留的东西"，不是第 49 个任务。 */
const RELIC_STAGES = [12, 24, 36, 44];
const RELIC_TOTAL = RELIC_STAGES.length;
const RELIC_SAY = [
  '这块壳片边缘还是湿的。它不是从这儿掉下去的 —— 是往上撞的时候蹭掉的。',
  '壳片被烧黑了，裂缝里嵌着炉灰。它穿过火，没停。',
  '壳片上长满了苔。它在这里躺了很久，久到菌把它的伤口当成了地。',
  '这是新裂的。断口还是白的 —— 它就在下面。',
];
function relicOf(stage) {
  const i = RELIC_STAGES.indexOf(Math.floor(stage == null ? 0 : stage));
  return i < 0 ? -1 : i;
}

/* ---- 第 43 关「悬台」----------------------------------------------------
   **踩实（C）在 48 关里没有一处非用不可**，而"能力存在但没被使用"
   等于没做。取舍是"45 关都别管它，把第 43 关做成它的一关"（CR-032
   遗留第 1 条）。

   数字是算出来的，不是拍的：
     · 单跳 720 → 123；二段跳 790 → 再 148，合计 272
     · 台面放到 **140**：单跳差 17px（差得看得见，不是"差一点"),
       二段跳够（余 132）
     · 踩实一颗球 → 墩高 r×1.55，小球 34、大球 71。**从墩顶单跳**：
       71 + 123 = 194 > 140，余量 54 —— 一次单跳就上去了
   `PERCH_W` 96 是两格：再窄一点落点要靠运气，再宽就一点也不难。 */
const PERCH_STAGE = 43;
const PERCH_H = 140;
const PERCH_W = 96;

/* ---- 出门补给（雪晶的唯一出口）------------------------------------------
   **为什么是"每关一次性购买"而不是"买永久升级"**：永久升级会让 48 关的难度
   变成一张假表（见上面 ①）。一次性补给不改变关卡的"能力上限"，只改变
   "这一次失误的代价" —— 玩家用它买的是**再来一次**，不是变强。

   三条都必须是"已经存在的东西"，不新开系统：加血、加球、加弹。
   **不加"加星"** —— 星是评价，能买就不是评价了。 */
const BUY_LIST = [
  { id: 'hp',   key: '1', cn: '+1 血',   cost: 30, say: '补一口血' },
  { id: 'ball', key: '2', cn: '+1 颗球', cost: 45, say: '门口多一颗球' },
  { id: 'ammo', key: '3', cn: '+30 弹',  cost: 20, say: '弹药 +30' },
];
function buySupply(id) {
  const it = BUY_LIST.find(x => x.id === id);
  if (!it) return false;
  if (S.phase !== 'play' || S.dive) {
    /* 深潜不给买：那一局的全部张力就是"资源带着走、越走越少"，
       能补的话深度纪录变成"谁雪晶多"，和模式立意正好相反。 */
    once('buynodive', S.p.x + S.p.w / 2, S.p.y - 26, S.dive ? '深潜里买不了' : '结算之后买不了', '#FFC08A');
    return false;
  }
  if (S.bought && S.bought[id]) {
    once('buydone', S.p.x + S.p.w / 2, S.p.y - 26, '这关已经买过了', '#9FB4C4');
    return false;
  }
  if (!spendSnowCoins(it.cost)) {
    once('buyno', S.p.x + S.p.w / 2, S.p.y - 26, '雪晶不够（要 ' + it.cost + '）', '#FFC08A');
    return false;
  }
  S.bought = S.bought || {};
  S.bought[id] = 1;
  if (id === 'hp') S.hp = Math.min(NUM.hpStart, S.hp + 1);
  if (id === 'ammo') S.ammo += 30;
  if (id === 'ball') {
    /* 球直接落在脚边。**用 `spawnBallAt`，不调 `makeBallFrom`** ——
       后者要一只怪、还会掉饱食度、还要算"省球关第几颗"，
       买来的球不该吃这些规则（它是"买"的，不是"裹"的）。 */
    const p = S.p;
    S.balls.push({
      x: p.x + p.w / 2, y: p.y + p.h - 26, vx: 0, vy: 0,
      r: ballR(1), absorbed: 1, life: NUM.ball.life, weak: false,
      onGround: false, chain: 0, hitCd: 0, dead: false,
    });
  }
  addText(S.p.x + S.p.w / 2, S.p.y - 34, '买到 · ' + it.cn, '#9BE86E', 18, 1.2);
  sfx('pick');
  return true;
}

/* 从出征页进来的入参。**和 grove.html 的 URLP 同款防御写法** ——
   无头沙箱里既没有 location 也可能没有 URLSearchParams，
   降级成"没有参数"，那样 from=grove 恒为 false，行为和改造前一模一样。 */
const SNOW_URLP = (() => {
  try {
    const q = (typeof location !== 'undefined' && location.search) ? location.search : '';
    return new URLSearchParams(q);
  } catch (e) { return { get() { return null; } }; }
})();
const FROM_GROVE = SNOW_URLP.get('from') === 'grove';

/** 回出征页。**带 ?from=home** —— grove 只有见到这个参数才直接落到出征页，
 *  不带的话它按"老门口流程"开打，玩家会发现自己回到了战斗里而不是门前。 */
function leaveToGrove() {
  try {
    if (typeof location !== 'undefined' && location.href) location.href = 'grove.html?from=home';
  } catch (e) { /* 沙箱里没有 location，静默 */ }
}

function readSnowProgress() {
  try {
    const o = JSON.parse((typeof localStorage !== 'undefined' && localStorage.getItem(SNOW_SAVE_KEY)) || '{}');
    return o && typeof o === 'object' ? o : {};
  } catch (e) { return {}; }
}
function writeSnowProgress(o) {
  try {
    if (typeof localStorage === 'undefined') return;
    localStorage.setItem(SNOW_SAVE_KEY, JSON.stringify(Object.assign(readSnowProgress(), o)));
  } catch (e) { /* 无痕模式 / 沙箱 —— 存不下就不存，不能因此崩掉 */ }
}

/** 关号 → 种子。过 `mix32` 的理由和深潜一样：`n * 7919` 这种线性递增
 *  首输出区分度不够，相邻关会撞出连续好几关同一骨架的箱子分布。 */
function stageSeed(n) {
  return mix32((Math.max(1, n | 0) * 0x9E3779B1) >>> 0);
}

/** 进第 n 关（主线）。这是**唯一**的主线换关出口 ——
 *  散着调 `reset(stageSeed(k), k)` 一定会漏掉存档那一步。 */
function startStage(n) {
  const k = clamp(Math.max(1, n | 0), 1, STAGE_MAX);
  /* **回主线必须把深潜状态清掉。** `reset()` 不看 `S.dive`（它只负责
     造这一关），所以从深潜里退回第 N 关时 `S.dive` 会留着 ——
     后果是"主线里过门不进下一关、而是进深潜下一层"，而且 HUD 一直报深度。
     这个坑在 `_snowlab-check` 里露过一次头（补给被当成"深潜里买不了"）。 */
  S.dive = null;
  reset(stageSeed(k), k);
  writeSnowProgress({ stage: k });
  /* 飘字带上骨架名。**进关那一瞬间是唯一"玩家会读这一行"的时刻** ——
     芯片里那行 12px 要一直挂着、只能报个名字，飘字可以多说一句
     "这关要走哪种路"，正好把六种骨架从"内部实现"变成"玩家认得出的东西"。 */
  const sk = S.level && S.level.skel;
  const cn = (sk && SKELETONS[sk]) ? (' · ' + SKELETONS[sk].cn) : '';
  addText(W / 2, 200, '第 ' + k + ' 关' + cn, '#EAF8FF', 26, 1.2);
  /* 第 43 关单独给一句提示。**不教"按 C 能踩实"这条通用操作**（那在开局
     提示里），教的是"这一关要用它" —— 后者才是这一关成立的原因。 */
  if (k === PERCH_STAGE) {
    addText(W / 2, 240, '金箱在悬台上 · 球可以踩实（C）当台阶', '#FFE08A', 17, 3.2);
  }
}

function reset(seed, stage) {
  if (seed != null) LEVEL_SEED = seed >>> 0;
  if (LEVEL_SEED == null) LEVEL_SEED = (Math.random() * 1e9) >>> 0;
  /* `stage` 不传 = 保持上一关的（换种子重跑同一关时要保住进度）；
     显式传 null = 回到"层数掷骰子"的旧行为（断言/出图用）。 */
  if (stage !== undefined) S.stage = stage;
  /* **换关 = 换地方。** 放在这里而不是渲染时算：`THEME` 要在本关第一帧
     就已经是对的（`drawSky` / 文案 / 弹速都读它），而且帧内不该再查表。 */
  applyTheme(themeOf(S.stage));
  const L = buildLevel(LEVEL_SEED, S.stage == null ? null : S.stage);
  /* **FR 必须在造怪之前重置。** 它原来在函数末尾才赋值，
     而 `S.foes = L.spawns.map(makeFoe)` 在中间就调用了 makeFoe ——
     于是每张新关卡的第一批怪吃的是**上一张关**的随机流。
     后果不是"怪长错了"这种小事：同一个种子跑两遍，宠物的种类和初始朝向都不一样，
     "出图和断言可复现"这条直接作废（_snowlab-feel2.js 的⑤就是这么抓到的）。 */
  FR = rngFrom((LEVEL_SEED ^ 0x51ED) >>> 0);
  /* 换关 → 静态层作废。**只在这里作废，别在别处** ——
     箱子碎了不需要重建（箱子不在缓存里），地板也不会被破坏。 */
  STATIC = null;
  STATIC_TRIED = false;
  BOX_TEX.clear();
  S.level = L;
  S.t = 0; S.phase = 'play'; S.clearT = 0;
  S.plats = L.plats;
  S.deco = L.deco || [];
  S.boxes = L.boxes.map(b => ({ ...b }));
  S.door = { ...L.door };
  /* **不要在这里覆盖 `shell`。** 六只 BOSS 的壳层数来自档位表（1/2/3），
     以前这行写死 `NUM.boss.shell` —— 加了档位之后它会把所有 BOSS 都变三层，
     而症状是"第 8 关的 BOSS 要打三下才碎"，读起来像难度没调好。 */
  S.boss = L.boss
    ? { ...L.boss, hitT: 0, spitT: NUM.boss.spitCd, dead: false, flash: 0 }
    : null;
  S.foes = L.spawns.map(sp => makeFoe(sp.x, sp.y, sp.kind));
  /* ---- 图鉴：见过的东西自动记 ----
     **记在 reset 里，不记在"打开图鉴"的时候。** 玩家可能一次都不开图鉴，
     而"我见过菌窟了"这件事不该取决于他有没有按 B。四条 breed 里
     只有这三只会真的出现在 `spawns` 里，所以遍历敌人就够，不用查表。 */
  codexMark('biome', THEME.id);
  for (const f of S.foes) codexMark('breed', f.breed);
  /* 这一关有没有抠出裂壳。见 breakBox 里的 husk 分支。 */
  S.relicFound = 0;
  /* **壳里的杂兵往旁边挪一格，不是删掉。** 站在 BOSS 脚下的怪在画面上
     读作"BOSS 身上长了个东西"（它会盖住基座），可它本身是正常的怪。
     挪开而不是删：删了会让"每层至少一只怪"那条判据失效，而且这会
     变成"打 BOSS 时少一只"，难度和刷怪曲线都跟着变。 */
  if (S.boss) {
    const B = S.boss;
    for (const f of S.foes) {
      if (f.x + f.w <= B.x - 10 || f.x >= B.x + B.w + 10) continue;
      if (f.y + f.h <= B.y - 40 || f.y >= B.y + B.h) continue;
      f.x = B.x - f.w - 20;
      if (f.x < 12) f.x = Math.min(948 - f.w - 12, B.x + B.w + 20);
    }
  }
  S.nests = (L.nests || []).map(n => ({ ...n, born: 0, t: 0 }));
  /* **巢也要挪出壳外。** 上面只挪了 `S.foes`（一次性生成的杂兵），可
     `S.nests` 是**持续刷怪**的 —— 它落在 BOSS 体内时，玩家看到的是
     "这只 BOSS 一直在吐怪"，而设计上它明确不吐怪（压力来自球有寿命、
     撞完被弹开）。而且新刷的怪一出生就在壳里，会被位置解算顶出去或者卡住。

     这个 bug 在第 48 关一直存在（那关的巢正好落在 678..810 里），
     只是扩到六只之后，`_boss6-shot` 一眼就看出来了 —— 出图能抓到
     断言抓不到的东西，这是第 N 次了。

     挪到两侧 132px；两侧都放不下就**关掉这个巢**（`left = 0`），
     比让它从壳里吐怪强：少一窝怪只是这层安静一点，从壳里吐怪是设计事故。 */
  if (S.boss && S.nests.length) {
    const B = S.boss;
    for (const n of S.nests) {
      if (n.y < B.y - 40 || n.y > B.y + B.h + 40) continue;   // 不同层
      if (n.x + 24 <= B.x - 12 || n.x >= B.x + B.w + 12) continue;
      /* 落点必须在地板上，否则巢会悬空吐怪（掉下去、看着像 bug）。 */
      const grounded = x => (S.plats || []).some(p =>
        Math.abs(p.y - n.y) < 4 && x >= p.x + 8 && x + 24 <= p.x + p.w);
      let moved = false;
      for (const x of [B.x - 132, B.x + B.w + 132]) {
        if (x < 16 || x > W - 32) continue;
        if (!grounded(x)) continue;
        n.x = x; moved = true; break;
      }
      if (!moved) n.left = 0;
    }
  }
  S.shots = []; S.balls = []; S.frags = []; S.texts = []; S.shards = []; S.rings = [];
  /* 踩实的球属于**这一关的地形**，换关必须一起清。忘记清的症状是
     "上一关的冰墩留在了下一关的半空中"—— 而它照样能站人，所以
     玩家会以为是关卡设计。 */
  S.pins = [];
  S.ebullets = [];
  S.ammo = NUM.ammoStart;
  S.belly = NUM.bellyStart;
  S.hp = NUM.hpStart;
  S.invuln = 0;
  S.killed = 0;
  S.killedTarget = NUM.killTarget;
  /* **本关目标。** 必须在 `S.lootTotal` 之前定下来 —— `goalMet()` 在
     collect 关要读 lootTotal，而它下面几行才赋值；顺序反了的话，
     第一帧的 checkDoor 会拿 undefined 判 `loot >= undefined`（NaN 比较恒假），
     症状是"寻宝关的门永远不开"，而改之前完全看不出来。
     深潜（S.stage < 0）拿到的是 'door'，见 goalOf 的注释。 */
  S.goal = goalOf(S.stage);
  /* 这一关买过的补给（每个 id 一次）。**按关清空** —— 它买的是"这一局"，
     带进下一关就变成永久属性了（见 BUY_LIST 的注释）。 */
  S.bought = {};
  /* 省球关已造球数。**按关重置**，不跟着 S.belly 走 —— 饱食度会因为
     吃碎片回满，用饱食反推"造了几颗"会在吃一口碎片之后清零。 */
  S.ballUsed = 0;
  /* 金箱计数。总数来自关卡，玩家能看出"这关还有几个没找到" ——
     **这是"探索"唯一的量化反馈**，没有它玩家不知道自己漏了东西。 */
  S.loot = 0;
  S.lootTotal = L.boxes.filter(b => b.loot).length;
  S.shake = 0; S.flash = 0; S.hitStop = 0; S.kick = {};
  S._taught = {};
  S.stat = {
    shots: 0, hitFoe: 0, hitBox: 0,
    coats: 0, shotsPerCoat: [],
    boxByShot: 0, boxByBall: 0,
    ballChain: 0, ballChainMax: 0,
    kills: 0, killByBall: 0, hardHint: 0, hits: 0,
  };
  S.starGot = [];
  S.cam = { y: 0, k: 0 };
  S.p = {
    x: L.start.x, y: L.start.y, vx: 0, vy: 0,
    w: PLAYER_W, h: PLAYER_H, onGround: true, face: 1,
    runD: 0, lockT: 0, shotCd: 0, anim: 0, shotAnim: 0,
    jumps: NUM.hero.airJump, jumpHeld: false, onBall: null,
    /* 攀爬中的位移插值（见 startClimb）。null = 没在爬。 */
    climb: null,
    /* 从楼板上下跳的窗口（见 stepPlayer 里的"下跳"）。
       0 = 没在下跳；> 0 时 stepBody 会跳过楼板的碰撞。 */
    dropT: 0, downHeld: false,
  };

  /* **进关说一句这关要干嘛。**
   *
   * 玩家分清"这一关和上一关不一样"靠的是**目标句**，不是"箱子多了两口"——
   * 后者要打完才发现。破门是基线，不必解释（教学段 6 关全是它）；
   * 另外两种第一次出现时一定要说，否则玩家会把金箱当成普通装饰。
   *
   * 放在 reset 的**最末尾**：上面 `S.texts = []` 清过一遍，早调用等于没写。 */
  if (S.goal !== 'door') {
    addText(W / 2, 214, GOAL_SAY[S.goal], '#FFE08A', 22, 2.4);
  }
}

/* ---------------------------------------------------------------- 敌人 */
/* **breed 由 kind 决定，不是随机的。**
   kind 是行为（crawler 巡逻 / runner 追人），breed 是外观和投掷物。
   两者分开是为了让断言能继续用 `spawnFoe(x, y, 'crawler')` 指"一只会巡逻的怪"，
   不用关心它长什么样；同时场上又能有三种不同的剪影。
   追人的那个是尖牙兽 —— 跑得快、甩牙甩得直，行为和外形的说法是一致的。

   **别再用 bunny/doggy/hoggy。** 那是"我方宠物"的形象，2026-10-28 用户
   明确问过「敌方为什么用我方的宠物」—— 敌人得有敌人的样子。 */
function breedOf(kind) {
  if (kind === 'runner') return 'fang';
  const r = FR();
  return r < 0.52 ? 'moss' : 'grub';
}

function makeFoe(x, y, kind, breed) {
  const br = breed || breedOf(kind);
  const cfg = NUM.breed[br] || NUM.breed.moss;
  const speed = cfg.speed;
  /* **vx 和 face 必须一开始就一致。** 原来 face 写死 1、vx 随机左右，
     第一帧就成了"面朝右往左走"，再被换向锁一锁，怪就永远倒着走。 */
  const dir = FR() < 0.5 ? -1 : 1;
  return {
    x, y, kind, breed: br,
    w: FOE_W, h: FOE_H,
    vx: dir * speed,
    turnLock: 0,             // 刚折返时的锁，见 stepFoes
    vy: 0,
    hits: 0,                 // 已吃雪点数
    needAt: 0,               // 开始挨第一发时的 need 快照（量具用）
    hitT: 0,
    dead: false,
    face: dir,
    onGround: false,
    homeX: x,
    homeY: y,
    patrolT: 0,
    speed,
    /* ---- 行为状态 ----
       idleT > 0 就是"站着待机"。**待机不是省事，是让它看起来活着** ——
       一直匀速横移的单位读起来像巡逻机器人，停一下、耸一下背，才像个活物。 */
    idleT: 0,
    walkT: 0.8 + FR() * 1.6,
    aim: 0,                  // 蓄力进度，到 windup 就发射
    fireCd: 0.8 + FR() * 1.4,
    jumpCd: 0,
    hopT: 0,                 // 纯表演性的小跳（原地），不影响碰撞
    /* ---- 卡住检测 ----
       `jumpCd` 只能挡住 0.75 秒，挡不住"这个坎根本过不去"。
       字段配合见 stepFoes 里的"撞不过去就掉头"：
         tryN        —— 自上次结算以来尝试过几次跳 / 蹭坎；
         stuckT      —— 结算窗口计时；
         stuckXMin/Max —— 窗口内横向走过的最左 / 最右（判据只看横向，
                          见那段注释：纵向会被自己的跳跃污染）。 */
    tryN: 0,
    stuckT: 0, stuckXMin: x, stuckXMax: x,
    jumpBan: 0,              // 判定"跳不过去"之后的禁跳时间
    banX: -9999,             // 禁跳的**地点**：得走开 24px 才允许再试
    /* ---- 态度（见 NUM.breed 的 role）----
       `chargeT`  > 0 = 正在冲（一次限时冲刺，速度由 breed.charge.spd 给）
       `windT`    > 0 = 鼓身预警中（还没动，但玩家该看见了）
       `lungeCd`  = 下一次能冲的冷却
       三个都为 0 就是"没在冲"，走的还是老路 —— 所以 guard 以外的品种
       永远不碰这三个字段。 */
    /* 开局就可以冲，但不要一落地就冲。**初值 1.2~2.6 太长**：
       玩家刚走进它的圈时通常已经过去十几秒，这里给的只是"刚出生那一小会儿
       别偷袭"——0.5~1.4 够用。 */
    chargeT: 0, windT: 0, lungeCd: 0.5 + FR() * 0.9, chargeDir: 1,
    kiting: false,
  };
}

/* ---------------------------------------------------------------- 饱食 */
function bellyTier() {
  if (S.belly >= NUM.bellyFull) return 'full';
  if (S.belly >= NUM.bellyHalf) return 'half';
  return 'hungry';
}
/* 裹住一只怪要几发。**场景系数乘在这里，不乘在 `NUM.snowShots` 上** ——
   那张表是"饱食度三档"的底数，被场景改写的话，换一次场景就把基准值永久改了，
   再换回来还是错的（同一份 `NUM` 被所有关卡共用）。
   取整要 `>= 1`：needK 小于 1 时 4×0.8=3.2 → 3，但 1×0.8 会变 0，
   0 发就能裹住 = 一按吐弹直接变球。 */
function snowNeed() {
  const base = NUM.snowShots[bellyTier()];
  return Math.max(1, Math.round(base * THEME.medium.needK * (diveHas('thick') ? 1.3 : 1)));
}
const TIER_CN = { full: '满饱', half: '半饱', hungry: '全饿' };

/* ---------------------------------------------------------------- 球档位 */
function ballTier(n) {
  if (n >= 6) return 3;
  if (n >= 4) return 2;
  if (n >= 2) return 1;
  return 0;
}
const BALL_TIER_CN = ['小', '中', '大', '特大'];
function ballR(n) { return Math.min(NUM.ball.maxR, NUM.ball.baseR + NUM.ball.perAbsorb * Math.min(n, NUM.ball.maxAbsorb)); }
/** 动量。**破冰墙的判据必须是球径 × 速度，不是单看体积** ——
    否则玩家把怪清光就永远攒不出特大球，而冰墙后面是门，直接死局。 */
/** 球的横向动量（速度 × 体径比）。**只用于"横向撞箱"**；
    落砸看的是 vy，见 `ballHitBox` 的第四个参数 —— 别拿这个函数去量落球。 */
function ballPow(b) { return Math.abs(b.vx) * (b.r / NUM.ball.baseR); }

/* ---------------------------------------------------------------- 飘字 */
function addText(x, y, s, color, size, lifeT) {
  S.texts.push({ x, y, s, color: color || '#fff', size: size || 16, t: 0, life: lifeT || 0.9 });
}
/** 碎片。`shape` 决定"碎成了什么样" —— 这是打击感的一半：
    木箱碎成**板条**（长条、会转），石箱碎成**棱角块**，雪/血碎成点。
    **全一样的方点会让所有材质碎得一样**，玩家就读不出"这是什么做的"。 */
function addFrag(x, y, n, color, spd, shape, bias) {
  const bx = (bias && bias.x) || 0, by = (bias && bias.y) || 0;
  /* **有方向时把角度收进扇形，而不是"全向撒 + 整体漂移"。**
     后者只改变碎片整体的重心，不改变扩散形状 —— 出图上看还是一次爆炸。
     收进 ±66° 之后，木片才会朝球飞去的方向扑出去，读作"被撞开"。 */
  const hasDir = bx !== 0 || by !== 0;
  const baseA = hasDir ? Math.atan2(by, bx) : 0;
  for (let i = 0; i < n; i++) {
    const a = hasDir ? baseA + rnd(-1.15, 1.15) : rnd(0, Math.PI * 2);
    const v = rnd(60, spd || 260);
    const f = {
      x, y,
      vx: Math.cos(a) * v + bx, vy: Math.sin(a) * v - 80 + by,
      t: 0, life: rnd(0.35, 0.8), color,
      r: rnd(2, 4.5), rot: rnd(0, Math.PI * 2), vr: rnd(-11, 11),
      w: 0, h: 0,
      /* **碎片带着自己的形状名。** 「木碎成板条 / 石碎成棱角块」这条
         只能查形状，不能查 `w > h*1.6` —— 后者会把随机撞出来的一块瘦长
         棱角也算成板条（实测石箱 156 片里 22 片被判成板条，全是几何巧合，
         看起来像"石箱也碎出木板了"）。 */
      shape: shape || 'dot',
    };
    if (shape === 'plank') { f.w = rnd(7, 15); f.h = rnd(2.4, 4.2); }
    else if (shape === 'slab') {
      /* **大块残骸。** 只有小块的时候，箱子碎完读作"箱子消失了"；
         大块是它的"尸体"，玩家看得见它被撞到哪去了。飞得慢、活得久，
         所以撞击后一两秒画面里还留着几块斜插的木板 —— 这才是"碎了"，
         而不是"被删了"。 */
      f.w = rnd(16, 26); f.h = rnd(7, 12);
      f.life = rnd(0.85, 1.25);
      f.vr = rnd(-6, 6);
    }
    else if (shape === 'chunk') { f.w = rnd(3.4, 7.5); f.h = f.w * rnd(0.55, 1.15); }
    else { f.w = f.r; f.h = f.r; f.vr = 0; }
    if (f.w) f.r = Math.max(f.w, f.h);
    S.frags.push(f);
  }
}
function hitStop(t) { S.hitStop = Math.max(S.hitStop, t); }
/** 一次性提示。**「太硬了」只在首次弹一次**，之后靠火花 + 无裂痕表达。
    常驻文字会把屏幕变成一个一直在喊的提示板。 */
function once(key, x, y, s, color) {
  if (S._taught[key]) return;
  S._taught[key] = 1;
  addText(x, y, s, color || '#FFD08A', 16, 1.3);
}

/* ---------------------------------------------------------------- 实体碰撞 */
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
/** 场景里所有实心块：平台 + 没碎的箱子。
    **箱子必须参与碰撞** —— 它要能挡人、站人、挡子弹。
    只当贴图的话，「箱墙」这个设计就无从谈起。 */
function solids() {
  const out = S.plats.slice();
  for (const b of S.boxes) if (!b.dead) out.push(b);
  /* 踩实的球是实心的。**放最后、且不带任何 `kind` 专属字段** ——
     `stepBody` / `surfY` 里所有 `s.kind === 'xxx'` 的分支因此全部不匹配，
     它就走"普通方块"那条路：能站、能挡、能被撞。加进这个函数的收益是
     一次性的：地形查询、镜头吸附、碎片落地、敌人贴地全都自动认它。 */
  for (const p of S.pins) out.push(p);
  return out;
}

/** 某个 x 处、y 下方最近的可站立面。碎片落地、找回掉出世界的敌人要用。
    直接拿 GROUND_Y 当"地面"在单屏时代是对的，三层之后不对了 ——
    底层掉下来的碎片会一路穿过 L2、L3 的地面落到底。 */
/* `noRamp` = 只找"台阶"，不找斜坡。（2026-10-29 第十一轮，用户第 2 条反馈）
   爬行类的"蹭坎"是靠 `groundAt` 探前方 8px 的落差来决定要不要抬脚的。
   而 `surfY` 对斜坡返回的是**坡面**，于是"前面那段坡比我脚下高 19px"
   被读成"一道 19px 的坎"，一帧把整只怪抬上去 —— 用户原话
   「现在按左右 就跳了一个敌方 感觉很奇怪 是在设定如此 还是有 bug 很突兀」。
   斜坡有它自己的贴地分支（`stepBody` 里 `s.kind === 'ramp'` 那段），
   会顺着坡面一帧一两像素地爬，根本不需要蹭坎帮忙。 */
function groundAt(x, y, noRamp) {
  let best = WORLD_H;
  for (const s of solids()) {
    if (noRamp && s.kind === 'ramp') continue;
    if (x < s.x || x > s.x + s.w) continue;
    const top = surfY(s, x);
    if (top < y - 6) continue;          // 只找脚底下的
    if (top < best) best = top;
  }
  return best;
}

/** 把 `w×h` 摆到 (x, y) 会不会插进什么实体里。`ignore` 是"算它托着我"的那块。
    **给瞬移类修正用（扒边）。** 只判 > 2px 的重叠：贴着台面站时包围盒和台面
    正好相切，相切不算"插进去"。 */
function blockedAt(x, y, w, h, ignore) {
  for (const s of solids()) {
    if (s === ignore) continue;
    if (s.kind === 'ramp') continue;
    const ox = Math.min(x + w, s.x + s.w) - Math.max(x, s.x);
    const oy = Math.min(y + h, s.y + s.h) - Math.max(y, s.y);
    if (ox > 2 && oy > 2) return true;
  }
  return false;
}

/* ---------------------------------------------------------------- 移动体物理
   **顺序必须是「先垂直分离、再水平分离」，而且水平那一轮要跳过"站在上面"的块。**
   反过来做会出一个非常隐蔽的致命 bug：站在地面上的身体，包围盒和地面平台
   永远是重叠的（y+h 比平台顶低一丁点），水平轮会把它当成撞墙，按 vx 的符号
   推到 `s.x + s.w` 或 `s.x - o.w` —— 也就是**场地最左边或最右边**。
   第一版就是这样：所有怪在第一帧瞬移到 x=902 挤成一堆。 */
function stepBody(o, dt) {
  o.vy = Math.min(o.vy + 2100 * dt, 1250);

  // ---- 垂直
  const prevBottom = o.y + o.h;
  const prevTop = o.y;
  /* **上一帧是不是站在地上。** 下坡贴地要用它 —— 见垂直段落末尾。
     必须在 `o.onGround = false` 之前取，之后这个值就没了。 */
  const wasGround = o.onGround;
  o.y += o.vy * dt;
  o.onGround = false;
  for (const s of solids()) {
    /* ================= 楼板是"半透层"（只对玩家，2026-10-28 第四轮）=================
       用户原话：「这个横梁我方是可以跳上去的　也可以下来　只要没箱子
       　不需要在空档里才能跳」。

       也就是：楼板**只挡落下、不挡上跳**。判据放在这里而不是给楼板换一种
       实体类型，是因为所有碰撞、地面查询、镜头吸附都在认 `solids()`，
       换类型要改十几处；这里加一条 skip，其余系统一行都不用动。

       三条限定，缺一条就出事：
         ① **只给玩家**（`o === S.p`）。怪一旦也能穿过楼板，它们会跳进上一层，
            而它们的巡逻走廊是按本层量出来的，上去就再也回不来 —— 满屏怪
            挤在上一层，玩家那一层一只都没有。
         ② **只在上升（vy < 0）或主动下跳（dropT）时 skip。** 下落时照旧接住，
            否则人站在楼板上每一帧都在"穿过再被接住"之间闪。
         ③ 箱子的碰撞一行没改 —— 楼板上摞着箱子的那一格，人跳上去会**撞到
            箱底**（箱底正好在楼板顶面），于是"有箱子的地方上不去"这条
            不需要单独写判据：它就是箱子本身。 */
    if (s.floor && o === S.p && (o.vy < 0 || o.dropT > 0)) continue;
    if (s.kind === 'ramp') {
      /* 斜坡：**只认顶面，不参与侧面阻挡。**
         横向不挡是故意的 —— 玩家走过来时脚底被下方地板托着，每一帧的
         垂直落地再把他贴回斜面，看上去就是"顺着坡走上去"，不会像台阶
         那样一格一格卡住。反过来，如果让斜坡参与水平阻挡，人会在坡脚
         撞一下停住，斜坡就退化成一堵墙。 */
      if (o.x + o.w <= s.x || o.x >= s.x + s.w) continue;
      const top = surfY(s, o.x + o.w / 2);
      /* **三个条件缺一不可：往下走 + 上一帧在坡面之上 + 这一帧确实穿过了坡面。**
         少了最后一条，人从上层往下掉、x 正好落在某个坡的区间里时，
         `prevBottom <= top + 14` 一样成立（人家在上面几十米呢），
         于是被判成"落地"，一发瞬移到那个坡顶上 —— 掉五层变成掉半层。 */
      if (o.vy >= 0 && prevBottom <= top + 14 && o.y + o.h >= top) {
        o.y = top - o.h; o.vy = 0; o.onGround = true;
      }
      continue;
    }
    /* **垂直方向允许 0.5px 的"相切"。**
       `aabb` 用的是严格 `>`，而"站在某块上"在数值上恰恰是
       `o.y + o.h === s.y` —— 正好相切，判成不相交。平时无所谓（落地时总是
       先穿过去一点），但 `step-up` 和斜坡贴地是把 y **精确设成** `s.y - o.h`：
       于是下一帧判定不落地 → 被重力拉下去 → 水平段又被 step-up 抬回来。
       自反馈循环，3px 的上下抖，`_jitter-probe.js` 量到一只 moss
       以 40 次/秒、2px 幅抖了整整 19 秒。
       放开的量取 0.5px（一帧重力的十分之一），不会把"悬空站着"吸下来。 */
    if (!(o.x < s.x + s.w && o.x + o.w > s.x &&
          o.y < s.y + s.h && o.y + o.h >= s.y - 0.5)) continue;
    // 只认"从上方落下来"和"从下方顶上去"，侧面的事交给下一轮
    if (o.vy >= 0 && prevBottom <= s.y + 8) {
      /* **落地要"真的踩在上面"，不能靠一像素的箱角。**（2026-10-29）
         上面那道门只判 `o.x < s.x + s.w`，等于"重叠一丝就算站住" ——
         怪从箱顶往外走，走到只剩 0.3px 角重叠时仍被托着，`vy` 被清零、
         也不掉下去，出图就是**一只怪吊在两口箱子的缝里**。
         `_snowlab-check.js`「没有怪吊在半空」守的就是这条（seed 6，
         x≈47.7、脚底 1012，左右两口箱子的缝正好 48 宽）。

         2px 是"脚掌有实际接触"的下限：再小就只是数值相切。
         **只加在落地这一支**，顶天花板那一支不动 —— 头顶擦到箱底
         被弹开是另一回事，那里放宽反而会插进箱体。 */
      if (o.x >= s.x + s.w - 2 || o.x + o.w <= s.x + 2) continue;
      o.y = s.y - o.h; o.vy = 0; o.onGround = true;
    } else if (o.vy < 0 && o.y < s.y + s.h) {
      /* **顶天花板也要判"上一帧在下面"。**
         少了 prevTop 这一条，斜着往上跳、身体从侧面啃进箱子/平台边缘时，
         这一帧会被当成"头顶撞到"，把人**按到块的底面**去 —— 也就是
         一脚踩进下一格箱子里面。实测贴着箱墙起跳，48 次里有 46 次
         身体插进箱体 26~30px，玩起来就是"往上跳反而掉进箱子"。
         判据：上一帧的头顶还在块的底边以下，才算是从下面顶上来。 */
      if (prevTop >= s.y + s.h - 2) { o.y = s.y + s.h; o.vy = 0; }
    }
  }

  /* ---- 下坡贴地（只在"上一帧还站在地上"时生效）----
     **这是"移动发抖"的真正原因，不在镜头。**
     斜坡的承托是"这一帧脚底穿过了坡面才贴上去"，上坡时坡面往上升，
     每帧都穿得过，所以顺；下坡时坡面在往下跑，而人只靠重力往下掉
     （一帧 0.6px），坡面一帧却能掉 4px —— 于是人和坡面越离越远、
     腾空、再砸下来。60 帧里 onGround 翻转 4 次，肉眼看就是一路抖。

     修法：上一帧站在地上、这一帧正在下落、脚下 16px 内有坡面 → 直接贴上去。
     16px 是"一帧最多能漏掉的距离"的两倍多，再宽就会把"从平台边缘走下去"
     也吸住。往上跳（vy < 0）不吸，起跳不受影响。 */
  if (!o.onGround && wasGround && o.vy >= 0) {
    for (const s of solids()) {
      if (s.kind !== 'ramp') continue;
      if (o.x + o.w <= s.x || o.x >= s.x + s.w) continue;
      const top = surfY(s, o.x + o.w / 2);
      /* **符号：`top − 脚底`，正值才是"坡面在脚下面"。**
         第一版写成 `脚底 − top`，于是所有该吸的情况都算成了负值被跳过 ——
         探针数字一动不动，还以为是公差不够。y 向下增大，记住方向。 */
      const gap = top - (o.y + o.h);
      if (gap < -1 || gap > 16) continue;
      o.y = top - o.h; o.vy = 0; o.onGround = true; break;
    }
  }

  // ---- 水平
  o.x += o.vx * dt;
  for (const s of solids()) {
    if (s.kind === 'ramp') continue;      // 斜坡不挡横移，见上
    /* **楼板对玩家不参与水平阻挡。** 穿过楼板的那些帧，身体和楼板在 y 上
       是重叠的 —— 如果这里照旧按撞墙处理，人会被横向"推"到最近的一段楼板
       边缘上（多半就是那个洞口），表现为"跳起来人被甩到一边"。
       站在楼板顶上时本来就会被下面那条 `脚底 ≤ 顶面 + 2` 跳过，所以
       这条 skip 对"在楼上走路"没有任何影响。 */
    if (s.floor && o === S.p) continue;
    if (!aabb(o, s)) continue;
    // 站在这块上面（脚底贴着顶面）就不算撞墙
    if (o.y + o.h <= s.y + 2) continue;
    /* ---- 台阶助步（step-up）----
       坡顶和台面接头处有一个 `半身宽 × 坡度` ≈ 18px 的垂直落差：
       贴坡面用的是**身体中心**那一点的高度（斜坡要这样才不抖，
       见上面那段注释），所以走到坡顶时脚底还差 18px 才到台面，
       于是被台面的侧面摁住 —— **永远走不到坡顶**，球也就跟着推不上去
       （用户 2026-10-29：「比如上坡 完全推不上去了」）。

       给"站着"的身体一次 ≤20px 的抬腿，和 2D 平台游戏里的台阶助步一样。
       只抬 20px：箱子是 48 一格、平台离地 96/114，都跨不过去，
       所以这条只对"坡与台面的缝"生效，不会变成"人能直接上箱子"。 */
    if (o.onGround) {
      const stepUp = (o.y + o.h) - s.y;
      /* **抬上去必须踩得实，踩空就不收。**
         台阶助步本来只服务"坡顶 → 台面"那 18px 的缝。但它只按包围盒判：
         只要身体边框蹭到某块高台的侧面，就把人抬到那块顶上 ——
         哪怕重心还留在原来那一块上。抬起来站不住，同一帧的重力又把人
         送回去，下一帧再抬：**10Hz、18px 的上下抖**，读起来就是"一直弹弹弹"。

         （2026-10-29 用户两次反馈「一直弹弹弹」，第一次我把它全算成"跳不上去
         还在跳"，修的是跳跃上限 —— 那只是三种成因里的一种。这个才是画面里
         真正看到的那个抖动：`_jitter-probe.js` 量到 x 一动不动、y 在
         931↔949 之间以 10Hz 往返，`tryN` 全程为 0，一秒都没起跳过。）

         判据用重心那一列的地面：抬到 `s.y` 之后，重心处必须真的托在 `s.y`。
         坡顶那一次重心本来就在台面上，所以原用途一点不受影响。 */
      /* 门槛从 0.5 提到 2.2：0.5~2px 的"落差"是浮点和箱子对齐的毛刺，
         抬上去只是每帧上下抖 1px。真台阶（坡顶接台面）是 18px 那个量级，
         门槛抬到 2.2 一点不影响它。`_jitter-probe.js` 量到一只 moss
         因此以 40 次/秒、2px 幅抖了整整 19 秒。 */
      if (stepUp > 2.2 && stepUp <= 20 &&
          Math.abs(groundAt(o.x + o.w / 2, s.y) - s.y) < 6) {
        o.y = s.y - o.h; o.vy = 0; o.onGround = true; continue;
      }
    }
    if (o.vx > 0) { o.x = s.x - o.w; }
    else if (o.vx < 0) { o.x = s.x + s.w; }
    else {
      /* 静止时被挤进块里（典型场景：箱子塌下来砸在玩家头上）。
         只按 vx 的符号推开的话，vx=0 两条分支都不进，人就永远卡在箱子里动不了。
         这里按"最近的一条边"顶出去。 */
      const outTop = Math.abs(o.y + o.h - s.y);
      const outL = Math.abs(s.x + s.w - o.x);
      const outR = Math.abs(o.x + o.w - s.x);
      /* **顶到上面也要看能不能站住。** 重心悬在块外时（贴着箱沿站、重心整个
         在箱子外面），顶上去下一帧就掉、掉了再被顶回来 —— 跟 step-up 那条
         是同一个循环，只是入口不同。

         两个出口都要判"这一下有没有真的改变位置"：
           · 重心在块上 → 从顶上顶出去；
           · 重心在块外、横向还推得动 → 从侧面推出去；
           · **重心在块外、横推也动不了**（它正好贴着那条边，推出去等于原地）
             → 什么都不做，**放它掉下去**。这里"掉下去"本来就是对的：
             踩着 0px 的边缘站住才是假的。
         `_jitter-probe.js` 量到种子 18 的一只 moss 在 x=576（箱子右边界）
         以 40 次/秒、2px 幅抖了整整 19 秒，走的就是第三条。 */
      const topOk = outTop < Math.min(outL, outR) &&
                    Math.abs(groundAt(o.x + o.w / 2, s.y) - s.y) < 6;
      if (topOk) { o.y = s.y - o.h; o.vy = 0; o.onGround = true; }
      else if (outL < outR) {
        if (Math.abs((s.x + s.w) - o.x) > 0.5) o.x = s.x + s.w;
      } else {
        if (Math.abs((s.x - o.w) - o.x) > 0.5) o.x = s.x - o.w;
      }
    }
    o.vx = 0;
  }
  o.x = clamp(o.x, WALL_L, WALL_R - o.w);

  /* ---- 扒边（只给玩家）----
     **没有这一条，玩家就永远回不到上一层。**
     上行通道是上一层地板上的那个洞，而洞是**镂空**的：玩家从井梯箱顶
     跳起来，脚确实越过了上一层地板（144 + 123 = 267 > 240），但落点正好
     在洞里，于是又原样掉回去 —— 实测"跳起来再按方向键"的窗口只有三四帧，
     81 次里成功 7 次。那不是难度，是动作根本没做出来。

     判据收得很窄，只在"脚已经够到台面、横向还差一口气"时扶一把：
       ① 台面比脚高不超过 30px（跳得起来才给，矮处不给）
       ② **必须在上升或最高点（vy ≤ 0）。** 这里差点写成 vy ≤ 60 ——
          那样玩家刚踏进洞口往下掉的第一帧（vy 只有 35）也会被判定成
          "上升中"，于是被扶回地板，永远掉不下去（逐层挖穿的断言直接红）。
       ③ 和台子边缘的横向距离 < 40px（就在边上）
       ④ **人站住了就别扒。** onGround 的 vy 也是 0，不排掉的话，
          贴着箱子走路会被一路"扶"上箱顶。
       ⑤ **落点必须是空的。** 这一条是后补的，代价是踩了一次大坑：
          "贴墙起跳会被塞进箱子里"（48 次里 46 次，最深 30px）。
          原因是扒边会把人横向瞬移 26px 挪到台面上，却没问过台面上方
          有没有东西 —— 冰墙上面摞着箱子时，那 26px 正好把人推进上一格
          箱体内部。**瞬移类的修正必须验落点，不能只验出发点。**
     普通平台跳上去本来就会正常落地，走不到这里。 */
  if (o === S.p && o.vy <= 0 && !o.onGround) {
    const foot = o.y + o.h;
    for (const s of solids()) {
      if (s.kind === 'ramp') continue;
      const dy = s.y - foot;
      if (dy < -1 || dy > 30) continue;
      /* 玩家在台子的右边（往左扒） */
      /* 40px 的吸附范围：洞口 96~144 宽，梯子列在洞内、离边缘还能有
         三十来像素 —— 收太紧就成了"必须像素级对位"，手感等于没做。 */
      let nx = null;
      if (o.x >= s.x + s.w && o.x < s.x + s.w + 40) nx = s.x + s.w - o.w + 4;
      else if (o.x + o.w <= s.x && o.x + o.w > s.x - 40) nx = s.x - 4;
      if (nx == null) continue;
      /* ---- 2026-10-28 第三轮：两条闸，修「跳起来一起往后走」 ----
         用户原话：「现在跳起来 一起往后走　跳起来有问题」。

         这段扒边是"把人整段横移一个身位"（玩家 45 宽、台面 48 宽，
         从台子外侧挪到台面上正好 ≈ 44px）。方向还**不看玩家想往哪走** ——
         往右跑跳、脚一接近某个台面，人可以被挪到左边 44px。
         那就是"跳一下人往后闪一截"，而且一帧完成，看不出发生了什么。

         ① **不往运动的反方向扒。** 有水平速度时，只有"往台面那个方向"
            才允许扒；vx = 0（原地起跳）不限制，否则不按方向键就上不去。
         ② **一帧最多挪 20px。** 差得更远就说明人还在台子外面老远，
            那不是"差一口气"，是自己的走位还没到 —— 这一帧不扒，
            下一帧再看。20px 够救"脚已经悬在台沿外"的所有情况。 */
      const dx = nx - o.x;
      if (o.vx !== 0 && Math.sign(o.vx) !== Math.sign(dx)) continue;
      if (Math.abs(dx) > 20) continue;
      const ny = s.y - o.h;
      if (blockedAt(nx, ny, o.w, o.h, s)) continue;
      o.x = nx; o.y = ny; o.vy = 0; o.onGround = true; break;
    }
  }

  /* 兜底：真的掉出世界了才拉回来。**不能写 GROUND_Y** ——
     GROUND_Y 现在是世界最底（1500），写它等于把中层掉下去的东西
     全部瞬移到洞窟底，玩家会看到怪物凭空出现在脚边。 */
  /* **掉出世界要送回最下面那一层，不是最上面。**（2026-10-29 用户第 2 条）
     `groundAt(x, 0)` 的语义是"从 y=0 往下扫，第一个能站的面" —— 也就是
     **最上层**。于是任何掉出世界的东西都会被一发传送到地表：
     门厅按 ↓ 穿下去的人如此（现在门厅地板不带 `floor` 标记了，穿不下去，
     这里是第二道防线），被挤出楼层底边的怪、球也一样。
     找"该 x 处最低的那块可站面"，才是"掉到底了"的正确落点。 */
  if (o.y + o.h > WORLD_H + 80) {
    const cx = o.x + o.w / 2;
    let low = -Infinity;
    for (const s of solids()) {
      if (cx < s.x || cx > s.x + s.w) continue;
      const top = surfY(s, cx);
      if (top > low) low = top;
    }
    o.y = (isFinite(low) ? low : WORLD_H) - o.h;
    o.vy = 0; o.onGround = true;
  }
}

/* ---------------------------------------------------------------- 吐雪 */
function shoot() {
  const p = S.p;
  if (p.shotCd > 0 || S.phase !== 'play') return;
  if (S.ammo <= 0) {
    once('noammo', p.x, p.y - 40, THEME.words.noammo, '#FF9E8E');
    return;
  }
  S.ammo--;
  S.stat.shots++;
  sfx('shoot');
  const cfg = NUM.shot.pets[HERO_ID] || NUM.shot.pets.cat;
  p.shotCd = NUM.shot.cd;
  p.lockT = NUM.shot.lock;      // 喷时不能移动：这是「喷的代价」第 ②条
  p.shotAnim = 0.18;
  S.shots.push({
    x: p.x + p.w / 2 + p.face * 16,
    y: p.y + p.h * 0.42,
    /* **只乘速度，不乘 `life`。** 乘了 life 射程 = 速度×寿命 会乘两次，
       熔炉的射程直接变成 1.39 倍 —— 那不是"火种飞得快"，是"火种能打
       到屏幕外面"，两侧高台的取舍全部作废。 */
    vx: p.face * cfg.speed * THEME.medium.speedK,
    /* **横向丢出去，但要掉下来。** vy0 轻微上扬让弹道先平后坠 ——
       没有这一下，子弹读起来是"射出去的激光"；有了它才是"扔出去的东西"。
       重力 520 是角色重力（2100）的四分之一：子弹比人轻，但不该飘。 */
    vy: cfg.vy0, grav: cfg.grav, kind: cfg.kind,
    t: 0, life: cfg.life, r: cfg.r, dead: false,
  });
  /* 碎粒跟着介质换色：雪的碎粒是白的，火种是橙的。**别漏这一处** ——
     弹药名改了、飞出去的粒子还是白的，一眼就看出是半成品。 */
  for (let i = 0; i < 3; i++) addFrag(p.x + p.w / 2 + p.face * 14, p.y + p.h * 0.42, 1, THEME.medium.mote, 120);
}

function stepShots(dt) {
  for (const s of S.shots) {
    if (s.dead) continue;
    s.t += dt;
    s.x += s.vx * dt;
    /* 抛物线：**先加速度、再动位置**。顺序反了的话同一帧里下落晚半拍，
       连射三发能看出来高低不一，像是三颗不同重量的子弹。 */
    if (s.grav) { s.vy += s.grav * dt; s.y += s.vy * dt; }
    if (s.t >= s.life) { s.dead = true; continue; }

    /* **命中判定必须取"最近的那个"，不能分两轮先怪后箱。**
       先怪后箱的话，怪站在箱子后面照样被打中 —— 箱子就等于没挡住子弹，
       「先清怪再推球」永远比「冻住一箭双雕」省事，整条取舍线断掉。
       雪弹一帧只走 10px，所以"最近"用一个简单比较就够。 */
    let best = null, bestD = Infinity, bestKind = null;
    for (const f of S.foes) {
      if (f.dead) continue;
      if (s.x + s.r < f.x || s.x - s.r > f.x + f.w) continue;
      if (s.y + s.r < f.y || s.y - s.r > f.y + f.h) continue;
      const d = Math.abs((f.x + f.w / 2) - s.x);
      if (d < bestD) { bestD = d; best = f; bestKind = 'foe'; }
    }
    for (const b of S.boxes) {
      if (b.dead) continue;
      if (s.x + s.r < b.x || s.x - s.r > b.x + b.w) continue;
      if (s.y + s.r < b.y || s.y - s.r > b.y + b.h) continue;
      const d = Math.abs((b.x + b.w / 2) - s.x);
      if (d < bestD) { bestD = d; best = b; bestKind = 'box'; }
    }
    /* 平台挡子弹。原来没有这一条 —— 子弹只会被 enemies / boxes 吃掉，
       于是站在台上往下喷，雪弹直接穿地板打到下面的怪。 */
    for (const pl of S.plats) {
      if (pl.kind === 'ramp') continue;        // 斜坡不挡子弹：它是地板，不是墙
      if (s.x + s.r < pl.x || s.x - s.r > pl.x + pl.w) continue;
      if (s.y + s.r < pl.y || s.y - s.r > pl.y + pl.h) continue;
      s.dead = true;
      break;
    }
    if (s.dead) continue;

    if (!best) continue;

    if (bestKind === 'foe') {
      coatFoe(best, 1);
      S.stat.hitFoe++;
    } else {
      shotBox(best, s);
    }
    s.dead = true;
  }
  S.shots = S.shots.filter(s => !s.dead);
}

function shotBox(b, s) {
  const def = NUM.box[b.mat];
  S.stat.hitBox++;
  if (def.hp === Infinity) {
    // 免疫：冒火花、一点裂痕都没有。玩家两次就懂，不需要常驻文字
    addFrag(s.x, s.y, 6, '#FFE0A0', 200);
    b.hitT = 0.12;
    S.stat.hardHint++;
    once('hard_' + b.mat, b.x + b.w / 2, b.y - 14, '太硬了', '#FFD08A');
    return;
  }
  b.hp--;
  b.hitT = 0.12;
  addFrag(s.x, s.y, 4, '#E8DCC8', 160);
  if (b.hp <= 0) breakBox(b, 'shot');
}

/* ---------------------------------------------------------------- 裹雪 */
function coatFoe(f, n) {
  if (f.dead) return;
  if (f.hits === 0) f.needAt = snowNeed();
  f.hits += n;
  f.hitT = 0.16;
  for (let i = 0; i < 4; i++) addFrag(f.x + f.w / 2, f.y + f.h / 2, 1, '#DCF0FF', 150);

  const need = f.needAt || snowNeed();
  if (f.hits >= need) {
    S.stat.shotsPerCoat.push(need);
    S.stat.coats++;
    makeBallFrom(f);
  }
}

/** 雪点满 → 变球。**这一步之后敌人就不存在了，球是唯一的击杀通道。** */
function makeBallFrom(f) {
  f.dead = true;
  S.belly = Math.max(0, S.belly - NUM.bellyPerBall);
  const n = 1;

  /* **省球关：前 3 颗是满球，之后裹出来的是残球。**
   *
   * 为什么不直接"第 4 颗造不出来"：那会**死局**。球是唯一的击杀通道，
   * 禁造 = 球用光之后既打不动也过不了门，玩家只能重开。硬红线上写着
   * "不许倒退"，那这种"卡死"比"变弱"更糟。
   * 所以改成"越用越没用"：残球寿命 ×0.45，滚半屏就散。玩家自己会算
   * "这颗现在推还是等两只凑一堆再推" —— 这就是"规划"，而不是被拦住。
   *
   * 计数按**造了几颗**，不按 `S.belly` 反推：吃一口碎片回 20 饱食，
   * 用饱食度反推会在吃碎片之后把额度清零，玩家会发现"吃一口就有满球了"。 */
  const weak = S.goal === 'limit' && (S.ballUsed || 0) >= GOAL_STRONG_BALLS;
  S.ballUsed = (S.ballUsed || 0) + 1;

  S.balls.push({
    x: f.x + f.w / 2, y: f.y + f.h / 2,
    vx: 0, vy: 0, r: ballR(n), absorbed: n,
    life: NUM.ball.life * (weak ? 0.45 : 1) * (diveHas('cold') ? 0.70 : 1),
    weak: weak,
    onGround: false, chain: 0, hitCd: 0, dead: false,
  });
  addText(f.x + f.w / 2, f.y - 18, weak ? THEME.words.weak : THEME.words.wrapped,
    weak ? '#FFD08A' : '#9BE86E', 18, 1.1);
  kickShake(3.5, 'wrap');
  hitStop(0.04);
}

/* ---------------------------------------------------------------- 推球 */
/* **推得动才推。**
   2026-10-29 用户截图：「这个球会出现乱弹的情况」—— 一颗大球贴在右上角。
   抓轨迹抓到的现场（种子 2，贴着右墙）：

     f947  x 900.0  vx -534     撞墙（936 − r36）弹回
     f952  x 885.0  vx +1205    玩家一推，顶到助跑满速
     f953  x 900.0  vx -538     又撞墙
     f955  x 900.0  vx -540     每帧在 891 / 900 之间反复跳 9px

   **推球是无条件给速度的**（`b.vx = dir * pow`，满速 1209），所以球一旦
   抵住墙，就是"顶满 → 撞墙 → 弹回 → 再顶满"，60Hz 无限循环。
   画面上球在原地剧烈抖动，玩家完全推不动它。

   判据分三类，只有**真的推不动**才算挡：
     · 墙 —— 挡（但**不是"什么都不做"**，见 pushBalls 里的"挤出来"）；
     · 木箱 / 陶罐 —— 放行（会被撞碎，碎完继续滚）；
     · 砸不动的箱子 —— 球底比箱顶高 ≤56（能翻上去）放行，否则挡。
       这一条和 `ballHitBox` 里"翻一格台阶"用的是同一把尺子，
       两处必须一致，否则球要么在硬边前自己弹、要么翻不上去。

   **返回值带上"被谁挡的"（2026-10-29）。** 墙和箱子要区别对待：
   箱子挡是"这条路真的堵死了"，墙挡是"这个方向推不过去、但球可以从
   墙角挤出来"。只返回 true 的话，两种情况都只能原地不动。 */
function pushBlocked(b, dir, pow) {
  /* **探测距离要按"推起来之后一帧走多远"算，不是固定的 5px。**
     助跑推是 1209 px/s，一帧 20px。只探测 5px 的话，球在离墙 44px 处
     仍然判"推得动"，于是每帧给一次满速：推 → 撞墙 → 弹回 44px → 再推，
     7 帧一个来回（8Hz）。看起来就是球在墙边反复冲撞。 */
  const reach = Math.max(b.r + 5, b.r + (pow || 0) / 60 + 3);
  const nx = b.x + dir * reach;
  if (nx - b.r < WALL_L + 1 || nx + b.r > WALL_R - 1) return 'wall';
  for (const bx of S.boxes) {
    if (bx.dead) continue;
    if (nx + b.r <= bx.x || nx - b.r >= bx.x + bx.w) continue;
    if (b.y - b.r >= bx.y + bx.h || b.y + b.r <= bx.y) continue;
    const def = NUM.box[bx.mat];
    if (!def || def.hp !== Infinity) continue;     // 木箱：撞得碎
    if ((b.y + b.r) - bx.y <= 56) continue;        // 一格硬边：翻得上去
    return 'box';
  }
  return '';
}

function pushBalls(dt) {
  const p = S.p;
  const runUp = clamp((p.runD || 0) / NUM.push.runFull, 0, 1);
  /* 深潜词条「重石」：推球力度 ×0.85。**乘在这里，不改 NUM** ——
     `NUM` 是全模式共用的，改它会在深潜结束之后继续生效（同一份表）。 */
  const pow = NUM.push.base * (1 + NUM.push.runGain * runUp) * (diveHas('heavy') ? 0.85 : 1);

  for (const b of S.balls) {
    if (b.dead) continue;
    /* **踩在脚下的球不推。** 站在球顶时脚底与球顶只差浮点误差，
       `aabb` 偶尔会重叠 0.1px —— 那一帧就会把球推出去，人立刻掉下来。
       用户反馈的"站不住"里，除了"球不在碰撞世界"这一条，还有这个。 */
    if (p.onBall === b) continue;
    /* ================= 推球判"够不够近"，不判"包围盒相不相交" =================
       （2026-10-28 第四轮）用户：「这种1级平面 球很难撞击到　最好想想机制上
       去规避」。

       用包围盒判有两个死角，恰好都是"1 级平面"上最常见的两种站位：
         ① **人站在一格矮箱顶上、球在脚下的地面上。** 玩家脚底（-48）比球顶
            （-44）还高 4px，包围盒**不相交** —— 明明挨着，推不动。
            一层全是矮箱的平地，人几乎一直在箱顶上走，于是"球推不动"。
         ② **球卡在一格宽的缝里。** 人 45 宽、球 44 宽，缝只有 48 ——
            人根本挤不进去，也就永远挨不到球。
       改成"圆心到圆心"的判定，两个方向各留 12px 余量就够了：
         · 垂直：站一格箱顶差 57.5，阈值 31.5+22+12 = 65.5 ✓
           站两格箱顶差 105.5 —— 依旧推不动（往上不该顺手推球）
         · 水平：贴着缝边就差不到 12px ✓

       **方向判据没变**：必须朝球的方向跑（`sign(p.vx) === dir`），
       所以站着不动、从球旁边走过都不会误推。 */
    const REACH = 12;
    const dx0 = b.x - (p.x + p.w / 2), dy0 = b.y - (p.y + p.h / 2);
    if (Math.abs(dx0) > p.w / 2 + b.r + REACH) continue;
    if (Math.abs(dy0) > p.h / 2 + b.r + REACH) continue;
    // 只在玩家朝球方向推时才给速度，站着碰不推
    const dir = b.x > p.x + p.w / 2 ? 1 : -1;
    if (Math.abs(p.vx) < 10) continue;
    if (sign(p.vx) !== dir) continue;
    if (Math.abs(b.vx) >= pow) continue;
    const blk = pushBlocked(b, dir, pow);
    /* ================= 顶在墙角 → 挤出来 =================
       用户 2026-10-29：「现在球在最左右 没办法推动」。

       原来这里是 `if (pushBlocked(...)) continue`：墙挡和箱挡一个待遇，
       都是"什么都不做"。箱子挡没问题 —— 路真的堵死了；**墙挡有问题**：
       球贴着墙时，玩家永远站不到它的另一侧（墙和球之间只有 0 身位，
       人 45 宽），于是这颗球在这个位置**永久废掉**，只能等 16 秒自己化掉。
       而球滚到墙角是极常见的结局（墙会把它弹回来再停住）。

       雪球是软的：顶不住就往外挤。给一个反向速度（0.62 倍力度）加一点上抛，
       球从墙角弹回场内，玩家接着就能正常推 —— 不需要新机制、不需要新 UI，
       只是把"推不动"改成"推得动，但方向由墙决定"。 */
    if (blk === 'wall') {
      /* **力度要收着给。** 直接 `-dir * pow`（助跑时 1209）会把这颗球
         一发打到对面的墙上 —— 实测从右墙弹出去 800px、穿了大半个场地，
         读起来是"球被抽走了"，不是"挤出来"。0.45 倍、上限 460，
         滚出去约 300px 停住，正好是"退回场内、还够得着"。 */
      b.vx = -dir * Math.min(460, pow * 0.45);
      b.vy = Math.min(b.vy, -150);
      b.pushT = 0.16;
      b.life = NUM.ball.life;
      kickShake(1.8, 'push');
      continue;
    }
    if (blk) continue;               // 箱子挡：真的堵死了
    b.vx = dir * pow;
    /* **留一个"正在被推"的印记给撞墙用。**
       被玩家压着撞墙不该回弹 45% —— 那是"撞上去"的力度。被压住的时候
       球应该抵在墙上停住，否则就是"推 → 撞 → 弹回 → 再推"的循环。 */
    b.pushT = 0.14;
    /* **推一次回满，不是回 60%。**
       "正在用的球不该中途蒸发" —— 回满之后，融化只清理被丢下的球。 */
    b.life = NUM.ball.life;
    if (runUp > 0.85) {
      addText(b.x, b.y - b.r - 12, '助跑推!', '#FFE9A8', 16, 0.7);
      kickShake(3, 'push');
    }
  }
}

/* ---------------------------------------------------------------- 球 */
/* ---------------------------------------------------------------- 球与球 */
/* **两颗球现在会撞、会合成一颗。**（2026-10-30）

   为什么加这个：球是全场唯一的攻击手段，而它此前是一个**孤立**的物理体 ——
   能滚、能砸箱、能反弹，但球与球之间既不碰也不让，可以完全重叠着滚。
   于是"推球"这个动词只有一种用法：挑一颗，推过去，看它撞死几只。
   48 关都是这一件事，只是地形不同 —— 这就是"关与关没区别"的物理层原因。

   加了两件事，都是**玩家自己布置出来的**：
     · **撞**：快球撞慢球，动量按质量分过去。一颗球可以把另一颗打到场地
       另一头 —— "先把一颗推到左边、再从右边撞它"变成一条能扫一整排的线路。
     · **合**：两颗都慢下来、贴住 0.28 秒，合成一颗（absorbed 相加）。
       这是"放弃两条线路、换一颗特大球去破冰墙"的代价选择。
       必须慢才合 —— 跑着的球撞一下就吞掉，那就不叫布置。

   为什么不写在 pushBalls 里：推球是"玩家 → 球"的单向操作，
   而球球关系跟玩家在不在场无关（两颗球自己滚到一起也该撞）。 */
function stepBallPairs(dt) {
  const B = S.balls;
  for (let i = 0; i < B.length; i++) {
    const a = B[i];
    if (a.dead) continue;
    /* **这里不做衰减。** 第一版写的是"每帧先乘 0.66 再累加"，本意是让
       松开手后进度条回落 —— 但"没贴住"这件事已经由下面的 aTouch 分支
       直接清零了，衰减只剩下一个作用：把 0.28 秒的实际阈值拖成 0.42 秒，
       和常量上写的时间对不上。断言按 0.28 秒写就会红，而看代码很像
       是断言算错了。 */
    let aTouch = false;
    for (let j = i + 1; j < B.length; j++) {
      const c = B[j];
      if (c.dead) continue;
      const dx = c.x - a.x, dy = c.y - a.y;
      const d = Math.hypot(dx, dy);
      const minD = a.r + c.r;

      /* ============ "挨着"比"重叠"宽 3px —— 这条决定合体能不能发生 ============
         位置分离会把两颗球推到**正好相切**（d == minD），下一帧 `d < minD`
         就不成立了。如果合体判定挂在"重叠"上，计时会被逐帧清零：
         画面上两颗球安安静静地挨在一起，永远合不上。
         第一版就是这么写的，而且 ⑤⑥ 两条断言还是绿的 ——
         因为那两条只验了"合出来那颗的 absorbed"，没验"合出了几颗"。
         所以：**碰撞按重叠算，合体按挨着算**。 */
      if (d >= minD + 3) continue;
      aTouch = true;

      /* **完全重叠也要处理。** 原写法在 d < 0.001 时直接跳过，两颗球
         正好同心时永远分不开，之后每一帧都跳过 —— 画面上是一颗"双色球"
         粘在一起滚，而且再也拆不开。同一只怪在两格之间被连续裹两次就会
         生成在同一点。方向给确定的 +x 而不是随机：随机的话每次跑出来的
         轨迹都不一样，断言没法复现。 */
      let nx, ny;
      if (d < 0.001) { nx = 1; ny = 0; }
      else { nx = dx / d; ny = dy / d; }

      /* 质量按**半径三次方**。用半径平方（面积）的话，一颗差一档的球
         撞起来像两个一样重的东西 —— 大球推小球该像推保龄球。 */
      const ma = a.r * a.r * a.r, mc = c.r * c.r * c.r;

      if (d < minD) {
        /* **先分离位置。** 不分离的话重叠会逐帧累积，最后两颗球叠在一起滚，
           画面上是"一颗双色球"，而不是"两颗撞了一下"。 */
        const push = (minD - d) * 0.5;
        const ka = mc / (ma + mc), kc = ma / (ma + mc);
        a.x -= nx * push * ka * 2; a.y -= ny * push * ka * 2;
        c.x += nx * push * kc * 2; c.y += ny * push * kc * 2;

        const rvn = (c.vx - a.vx) * nx + (c.vy - a.vy) * ny;
        /* rvn > 0 = 两者已经在分开，不能再给冲量（否则会自己加速）。
           这一条漏了的话，两颗贴住的球会"弹开 → 追上 → 再弹开"地抖个不停。 */
        if (rvn < 0) {
          const imp = -(1 + NUM.ball.pairBounce) * rvn / (1 / ma + 1 / mc);
          a.vx -= imp * nx / ma; a.vy -= imp * ny / ma;
          c.vx += imp * nx / mc; c.vy += imp * ny / mc;
          /* 至少给一点横向位移：正上方垂直叠住时法线是纯竖直的，
             冲量全在 y 上，两颗球会在原地上下弹而不分开。 */
          if (Math.abs(nx) < 0.12) {
            const side = (a.x + c.x) / 2 < (WALL_L + WALL_R) / 2 ? 1 : -1;
            a.vx += side * 90 * ka; c.vx += side * 90 * kc;
          }
        }
      }

      const slow = Math.abs(a.vx) < NUM.ball.fuseSpeed
                && Math.abs(c.vx) < NUM.ball.fuseSpeed;
      if (slow && a.onGround && c.onGround) {
        const t = Math.max(a.fuseT || 0, c.fuseT || 0) + dt;
        a.fuseT = c.fuseT = t;
        if (t >= NUM.ball.fuseHold) { fuseBalls(a, c); break; }
      } else {
        a.fuseT = 0; c.fuseT = 0;
      }
    }
    if (!aTouch) a.fuseT = 0;
  }
}

/** 两颗球合成一颗。
 *  位置取**面积加权**（大球的位置更有分量）—— 取中点会让结果看着
 *  "往小球那边偏了一下"，因为大球本来就该主导。
 *  速度取平均**再乘 0.5**：两个慢球的动量加起来也没多少，直接相加的话
 *  一次合体会把球弹出去撞墙，玩家反而控制不住它去哪。 */
function fuseBalls(a, c) {
  const n = Math.min(NUM.ball.maxAbsorb, a.absorbed + c.absorbed);
  const ma = a.r * a.r, mc = c.r * c.r, m = ma + mc;
  const x = (a.x * ma + c.x * mc) / m;
  const y = (a.y * ma + c.y * mc) / m;
  const weak = !!(a.weak || c.weak);
  a.dead = true; c.dead = true;
  /* **当场从数组里移走，不等下一帧的 filter。**
     合体是一帧内死两颗、加一颗，如果只标 dead：
       · 本帧绘制会多画两颗旧球（画面上"合完了还站着原来的"）；
       · 出图工具不跑 stepBalls，那两颗会**永远**留在图上。
     先取索引再 splice，第二次用 indexOf 重取 —— 删掉第一颗之后索引会移。 */
  const ia = S.balls.indexOf(a);
  if (ia >= 0) S.balls.splice(ia, 1);
  const ic = S.balls.indexOf(c);
  if (ic >= 0) S.balls.splice(ic, 1);
  const b = {
    x, y, vx: (a.vx + c.vx) * 0.5, vy: Math.min(a.vy, c.vy),
    r: ballR(n), absorbed: n, weak,
    life: NUM.ball.life, onGround: true, chain: 0, hitCd: 0,
    dead: false, fuseT: 0, pushT: 0,
  };
  S.balls.push(b);
  addText(x, y - b.r - 14, '合成大球', '#9EE0FF', 17, 1.0);
  addFrag(x, y, 10, '#CFE9F7', 200);
  kickShake(2.6, 'fuse');
  hitStop(0.05);
  return b;
}

/* ---------------------------------------------------------------- 踩实（C）
   到这里为止，一颗球只有**一个去处**：拿去砸门 / 砸箱子 / 砸 BOSS。
   也就是说"球"在玩家手里是弹药，每一颗的用法都注定了 —— 攒大、推过去。
   48 关里这个决定重复了几百次，所以再多的机制也只是换皮。

   **踩实把球变成地形。** 它长在场上、能站、能挡、能垫高、能堵洞，但从此
   不能推也不能砸。于是同一颗球有了两个都不能反悔的出口：
     · 当弹药：砸开这一层要砸的东西；
     · 当建材：把这一层变成"能上去"的形状。
   两个出口抢同一份资源（球只来自怪，怪是有限的），这才是取舍 —— 不是
   多一个按钮，而是"这个决定等下会疼"。

   三条限制，每条都去掉过一个更省事的写法：
     ① **必须贴地。** 不贴地就能在空中造平台，等于给玩家一副梯子，
        生成器辛苦维持的"每层 24 的夹层约束"当场作废。
     ② **不可逆。** 能敲碎取回的话它就不是取舍了，是免费开关。
     ③ **整颗消耗。** 不保留体积 —— 保留的话玩家会先压实再合体，
        "踩实"变成"攒球的中间步骤"，跟设计意图正好相反。 */
/* **墩要够高才有用。** 第一版按"体积守恒"压成 r*1.15（小球只有 25px），
   出图之后几乎看不见 —— 和雪地同色、比箱子还矮，"这里能站"完全读不出来。
   现在按 r*1.55：压下去的材料从四周挤出，变成一根窄而实的冰柱。
   小球 34px、特大球 71px，玩家跳 123，都上得去。 */
const PIN = { reachX: 78, reachY: 86, hK: 1.55, wK: 0.925 };

/** 玩家身边最近的那颗球（只看横向距离，纵向放宽 —— 球常在人脚边）。 */
function pinCandidate() {
  const p = S.p;
  if (!p) return null;
  const px = p.x + p.w / 2, py = p.y + p.h * 0.6;
  let best = null, bestD = 1e9;
  for (const b of S.balls) {
    if (b.dead) continue;
    if (Math.abs(b.x - px) > PIN.reachX + b.r) continue;
    if (Math.abs(b.y - py) > PIN.reachY + b.r) continue;
    const d = Math.abs(b.x - px);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}

/** 贴地才让踩实。判据用 `groundAt` 查球心左右两点 —— 单查球心的话，
    球卡在箱子边缘时"脚下有面无面"会随一像素抖动，玩家看到的是
    "有时候能踩有时候不能"，而那种不确定性比禁止更难受。 */
function canPin(b) {
  if (!b) return false;
  const bottom = b.y + b.r;
  const gl = groundAt(b.x - b.r * 0.5, bottom + 2);
  const gr = groundAt(b.x + b.r * 0.5, bottom + 2);
  return Math.abs(gl - bottom) <= 9 && Math.abs(gr - bottom) <= 9;
}

function pinBall(b) {
  const r = b.r;
  const h = r * PIN.hK, w = r * 2 * PIN.wK;
  const bottom = b.y + r;
  S.pins.push({
    x: b.x - w / 2, y: bottom - h, w, h,
    /* 存下档位和残球标记，只为了画得像"那颗球压扁了" ——
       画成一模一样的灰方块的话，玩家读不出"这是我刚才踩的那颗"。 */
    r, tier: ballTier(b.absorbed), weak: !!b.weak,
    sd: ((b.x * 7 + b.y * 13) | 0) & 0xffff,
  });
  b.dead = true;
  const i = S.balls.indexOf(b);
  if (i >= 0) S.balls.splice(i, 1);
  addText(b.x, bottom - h - 16, '踩实了 · 不能再推', '#CFE9FF', 16, 1.1);
  for (let k = 0; k < 10; k++) {
    addFrag(b.x + ((k % 5) - 2) * (r * 0.3), bottom - 3, 5, THEME.cap[0], 150);
  }
  kickShake(4.4, 'pin');
  hitStop(0.03);
}

/** C = 把身边那颗球踩实。**只在 play 阶段**：结算画面上按 C 会白白
    改掉已经算完的关卡状态，而玩家看不出发生了什么。 */
function tryPin() {
  const b = pinCandidate();
  if (!b) {
    once('pinnone', S.p.x + S.p.w / 2, S.p.y - 24, '身边没有球', '#9FB4C4');
    return false;
  }
  if (!canPin(b)) {
    /* 提示必须说**为什么**。"不行"玩家会以为按键坏了；
       "要贴地"他才知道自己该把球推下来。 */
    once('pinair', b.x, b.y - b.r - 14, '球要贴地才能踩实', '#FFC08A');
    return false;
  }
  pinBall(b);
  return true;
}

/* ---------------------------------------------------------------- BOSS
   第 48 关的终局。三层壳，每层吃一次**够重的撞击**。

   **它不还手、不移动、不吐怪。** 一开始想给它"破一层吐两只"，
   想清楚之后删了：吐怪 = 补给，而这一关缺的从来不是怪，是**大球**。
   压力应该来自"球只有 16 秒寿命、撞完会被弹开、弹开的地方可能是洞"，
   而不是"又要打怪了"—— 后者前面 47 关已经打过两百次。

   判据用**圆形距离**，不用 AABB：BOSS 是三圈壳，画出来是圆的，
   用方形盒会让"擦着角飞过去"也算撞上，玩家读作"判定太松"。
   代价是要自己做位置解算（把球推到壳外），但那也只有三行。 */
/* BOSS 的**只是状态**（被打之后的闪光衰减、破壳停顿）。撞击本身在
   `bossTakeHit` 里 —— 那里是被球触发的，这里是被时间触发的，别混。 */
function stepBoss(dt) {
  const B = S.boss;
  if (!B) return;
  B.flash = Math.max(0, (B.flash || 0) - dt * 3.4);
  B.hitT += dt;
}

function bossTakeHit(b) {
  const B = S.boss;
  if (!B || B.dead || b.dead) return;
  const cx = B.x + B.w / 2;
  /* 特效用的视觉中心（碎屑、冲击环都从这儿散）。**和判定无关** ——
     判定走 AABB 的穿透轴，见下。 */
  const cy = B.y + B.h * 0.52;
  /* ---- 判定：AABB + **最小穿透轴**，不是圆心距 ----
     第一版用圆形（reach = 半径 + 球半径），两个问题：
       ① 球从下方进来（BOSS 站在地上，球贴着地滚过来）会被推到
          `cy + reach`，那已经在地板下面了 —— 球直接掉出世界；
       ② 圆形判定比它画出来的样子大一圈，玩家读作"还没碰到就弹了"。
     按最小穿透轴推出去，球从侧面来就水平弹、从上面来就顶在上表面，
     和它画出来的方块剪影一致。 */
  const ox = Math.min(b.x + b.r - B.x, B.x + B.w - (b.x - b.r));
  const oy = Math.min(b.y + b.r - B.y, B.y + B.h - (b.y - b.r));
  if (ox <= 0 || oy <= 0) return;
  const outX = (b.x < cx) ? -1 : 1;
  if (ox < oy) {
    b.x = outX < 0 ? B.x - b.r : B.x + B.w + b.r;
  } else {
    const outY = (b.y < B.y + B.h / 2) ? -1 : 1;
    b.y = outY < 0 ? B.y - b.r : B.y + B.h + b.r;
    /* 从这里出去的球本来就在下落，别再给一次向上弹 ——
       BOSS 顶上会变成"球在头顶原地跳"的永动机。 */
  }

  if (b.hitCd > 0) return;
  const pow = Math.max(Math.abs(b.vx), b.vy) * (b.r / NUM.ball.baseR);

  /* **门槛读 BOSS 自己的档位，不读全局 `NUM.boss`。** 六只 BOSS 的
     破壳阈值是 1100→1700 递进的；读全局的话后五关都是同一个手感。 */
  if (pow >= B.breakPow) {
    B.shell--;
    B.flash = 1;
    B.hitT = 0;
    kickShake(9, 'boss');
    hitStop(0.085);
    S.flash = Math.max(S.flash, 0.2);
    for (let i = 0; i < 16; i++) addFrag(cx + ((i % 8) - 3.5) * 7, cy - 10, 1, THEME.cap[2], 320);
    S.rings.push({ x: cx, y: cy, r: 6, r0: 6, r1: B.w * 0.9, t: 0, life: 0.34, color: '#FFD8A8' });
    addText(cx, B.y - 30,
      B.shell > 0 ? ('壳裂了 · 还剩 ' + B.shell + ' 层') : '壳碎了',
      B.shell > 0 ? '#FFD08A' : '#9BE86E', 22, 1.8);
    /* **球不消失，只被弹开。** 球是这一关唯一的通道：
       弄丢一颗就少一颗，而"球掉进洞里"在这套地形里太容易发生了。
       弹开 55% 速度，玩家能立刻追上去再推一次。 */
    b.vx = -outX * Math.min(Math.abs(b.vx) * B.bounce, 780);
    b.vy = -320;
    b.hitCd = 0.3;
    if (B.shell <= 0) B.dead = true;
  } else {
    b.vx = -outX * Math.min(Math.abs(b.vx) * B.weak, 520);
    b.vy = -180;
    b.hitCd = 0.3;
    kickShake(3, 'bossweak');
    /* 提示要给**怎么才算够**，不能只说"太小" ——
       玩家手里那颗球看着不小，他没法自己算出 1700 这个数。 */
    once('bossweak', cx, B.y - 26, '壳太厚 · 裹大一点再撞', '#FF9E8E');
  }
}

function stepBalls(dt) {
  for (const b of S.balls) {
    if (b.dead) continue;
    b.life -= dt;
    b.pushT = Math.max(0, (b.pushT || 0) - dt);
    if (b.life <= 0) { burstBall(b); continue; }

    // 重力 + 水平移动
    b.vy = Math.min(b.vy + 2100 * dt, 1250);
    const prevX = b.x, prevBottom = b.y + b.r;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // --- 撞箱子。**必须先分清"从上面来"和"从侧面来"** ——
    //     只看包围盒重叠的话，球在箱顶滚也会被当成侧撞，把脚下的箱子砸了。
    for (const box of S.boxes) {
      if (box.dead) continue;
      const overlapX = b.x + b.r > box.x && b.x - b.r < box.x + box.w;
      /* **`box.y + 6` → `box.y`（2026-10-28 第三轮）。**
         那 6px 是当年为"别把箱顶滚动的球判成侧撞"留的余量，可它同时
         让**停在箱顶的球每帧漏检**：球底贴住箱顶时 `球底 > 箱顶 + 6`
         不成立 → 这一帧不算落地 → 球继续掉 0.58px，要掉满 6px 才重新
         被接住。于是球静止时以 5 帧为周期上下抖 6.2px，玩家踩上去
         整个人跟着抖 —— 这是"站不住"体感的一半来源。
         "从上方来"这件事已经由下面的 `prevBottom <= box.y + 10` 判得很准，
         这里不需要再垫 6px。 */
      const overlapY = b.y + b.r > box.y && b.y - b.r < box.y + box.h;
      if (!overlapX || !overlapY) continue;

      // 从上方落下 / 在箱顶滚：当作地板 —— **但"落下"和"滚"不是一回事**
      if (prevBottom <= box.y + 10) {
        /* **落下来的球会砸碎脚下的箱子（2026-10-28 第四轮）。**
           用户：「球掉下去 是可以杂碎箱子」。

           以前这一分支一律"接住"，于是球从洞口掉进箱堆只是安静地停在最上面，
           "把球推下洞"完全没有收益 —— 而它本该是这颗游戏里最爽的一下。

           判据是**落地那一帧的 vy**（见 NUM.ball.crushVy）：滚上来的球 vy=0，
           一次真下落 vy ≥ 320。砸碎之后 vy 只乘 `keepSpeed`（木箱 0.82），
           所以一颗球能从三格箱堆里一路犁到底 —— 这就是"落球"的回报，
           砸一颗就停的球没有意义。 */
        if (b.vy >= NUM.ball.crushVy) {
          ballHitBox(b, box, 0, b.vy);
          if (b.dead) break;
          if (box.dead) continue;       // 碎了就继续往下掉，不要贴到箱顶
        }
        b.y = box.y - b.r; b.vy = 0; b.onGround = true;
        continue;
      }
      // 侧面撞击
      /* **慢速贴住：不碎箱，但绝不许留在箱体里。**
         旧版这一行是 `continue`，于是被轻轻碰一下的球会钻进箱子里停住 ——
         画面上就是"球明明撞到箱子了，什么都没发生"，而且球从此卡在箱体
         内部，看起来像穿模。用户说的「球很难撞击到」有一半是它。
         慢球只做位置解算：推到箱面上停住，读起来是"球抵着箱子"。 */
      if (Math.abs(b.vx) < 40) {
        b.x = (b.x < box.x + box.w / 2) ? box.x - b.r : box.x + box.w + b.r;
        b.vx = 0;
        continue;
      }
      const dir = sign(b.vx);
      ballHitBox(b, box, dir);
      if (b.dead) break;
    }
    if (b.dead) continue;

    // --- 撞平台（左右墙 + 落地）
    /* **球贴坡时，坡顶那一步的助步量要按坡度算。**（2026-10-29 用户第 3 条）
       球的贴面用**球心**那一列的高度，所以滚到坡顶时球底比台面低
       `半径 × 坡度`：r=25 时是 17px，r=46 时是 **36px**。
       而助步门槛写死 24 —— 于是同一个坡，小球上得去、大球永远卡在坡顶。
       用户说的「这个坡始终推不上去」就是这个：他的球吸过大，半径 30+。

       先量一下"球现在压在哪条坡上"，门槛 = 24 + 半径 × 斜率。
       球不在坡附近时斜率是 0，门槛还是 24，不会把球抬上别的台子
       （平台离地 96/114，平地上的球离台面差 96 以上，够不着）。 */
    let rampSlope = 0;
    for (const pl of S.plats) {
      if (pl.kind !== 'ramp') continue;
      if (b.x + b.r <= pl.x || b.x - b.r >= pl.x + pl.w) continue;
      rampSlope = Math.max(rampSlope, Math.abs(pl.rise) / pl.w);
    }
    for (const pl of S.plats) {
      if (pl.kind === 'ramp') {
        /* 球走坡：贴顶面，并**顺着坡自己往下滚**。
           这是全场唯一给球加的外力 —— 不加的话球能停在一段 30° 的坡上不动，
           一眼就假。顺带它把斜坡变成一条"加速跑道"：从坡顶滚下来撞箱，
           动量比平地推大得多，斜坡因此有了战术价值，不只是过路地形。 */
        if (b.x + b.r <= pl.x || b.x - b.r >= pl.x + pl.w) continue;
        const top = surfY(pl, b.x);
        /* **必须判"从上方来"（prevBottom 在坡面附近），只看 x 重叠会出事：**
           球在下面几层往右滚，只要 x 恰好落在某个上层斜坡的区间里，
           `b.y + b.r > top - 4` 就成立（球底当然在坡面以下），
           球会被一发瞬移到那个坡顶上 —— 看起来像"球凭空飞上去了"。
           加 prevBottom 之后，只有真的从坡上方落下来才贴面。 */
        /* ---- 接触是"连续的"，不是"每帧重新判"（2026-10-29）----
           用户原话：「球进入了死胡同　比如上坡　完全推不上去」。
           斜坡上坡时球没有任何东西把它抬起来 —— 它靠的是
           "这一帧水平走了 dx，坡面高了 dx×坡度，落差 ≤16 就当接住"。
           dx 一大就接不住：助跑推 1209 px/s 在 60fps 一帧走 20px，
           0.79 的坡度抬 15.9px（擦线），30fps 走 40px 抬 31.7px（必穿）。
           **一旦穿下去，坡面从此再也接不到它** —— 球在坡体内部，
           看不见、推不动，这就是"完全推不上去"。

           修法：上一帧球底就贴着坡面（`wasOn`）时，不论这一帧坡面抬多少
           都直接贴过去。接触本来就是连续的，不该每帧重新证明一次。
           `wasOn` 用的是 prevX 那一点的坡面，所以"从坡脚平地上坡"也成立
           （低端坡面高度 == 地面高度）；而在下面一层滚的球，
           prevTop 在几十米之上，`wasOn` 为假 —— 不会误吸。 */
        const prevTop = surfY(pl, prevX);
        const wasOn = prevBottom <= prevTop + 6;
        if (b.vy >= 0 && (wasOn || prevBottom <= top + 16) && b.y + b.r > top - 4) {
          b.y = top - b.r; b.vy = 0; b.onGround = true;
          b.vx += (pl.rise > 0 ? -1 : 1) * 420 * dt;
        }
        continue;
      }
      const overlapX = b.x + b.r > pl.x && b.x - b.r < pl.x + pl.w;
      const overlapY = b.y + b.r > pl.y && b.y - b.r < pl.y + pl.h;
      if (!overlapX || !overlapY) continue;
      if (b.vy > 0 && prevBottom <= pl.y + 12) {
        b.y = pl.y - b.r; b.vy = 0; b.onGround = true;
      } else if ((b.y + b.r) - pl.y <= 24 + b.r * rampSlope) {
        /* **台阶助步：坡顶与台面之间有 ≈18px 的缝。**
           球的贴面用圆心高度（和玩家同一套理由：斜坡要这样才不抖），
           滚到坡顶时球底比台面低 `半径 × 坡度` ≈ 17px，于是侧面把它
           原样弹回去 —— 这就是"推到坡顶再也不动"。
           和 stepBody 一样给一次 ≤24px 的抬腿（球比人宽，给宽 4px）。 */
        b.y = pl.y - b.r; b.vy = 0; b.onGround = true;
      } else {
        b.x = prevX; b.vx *= -0.35;
      }
    }

    // --- 撞墙
    /* **被玩家压着撞墙 ≠ 自己撞上去。**
       自己滚过去撞墙，弹回 45% 是对的（"撞了一下"）；被推着顶在墙上，
       回弹 45% 就变成了永动机：推 → 撞 → 弹回 44px → 玩家还在推 → 再撞。
       实测就是 8Hz 的反复冲撞（用户说的"乱弹"）。压着的时候只留 8%，
       球抵住墙停住，玩家一看就知道"这面墙推不过去"。 */
    const wallDamp = b.pushT > 0 ? 0.08 : 0.45;
    if (b.x - b.r < WALL_L) { b.x = WALL_L + b.r; b.vx = Math.abs(b.vx) * wallDamp; }
    if (b.x + b.r > WALL_R) { b.x = WALL_R - b.r; b.vx = -Math.abs(b.vx) * wallDamp; }

    // --- 地面摩擦
    if (b.onGround) {
      const d = NUM.ball.fric * dt;
      if (Math.abs(b.vx) <= d) b.vx = 0; else b.vx -= sign(b.vx) * d;
      b.onGround = false;
    }

    // --- 碾敌。**球是唯一的击杀通道**，这里就是那条通道的收口。
    if (Math.abs(b.vx) > 60) {
      for (const f of S.foes) {
        if (f.dead) continue;
        if (b.x + b.r < f.x || b.x - b.r > f.x + f.w) continue;
        if (b.y + b.r < f.y || b.y - b.r > f.y + f.h) continue;
        killFoe(f, b);
      }
    }

    /* BOSS 放在**所有其它碰撞之后**：球先被箱子和墙解算到合法位置，
       再拿这个位置去和壳比距离 —— 顺序反过来的话，球可能被"推出 BOSS"
       推到箱子里面，下一帧又被箱子推回来，两边打架。 */
    bossTakeHit(b);
  }
  S.balls = S.balls.filter(b => !b.dead);
}

/* **撞击动量只有一个数（`pow`），横向和垂直各取各的。**
   横向撞看 vx、落下砸看 vy —— 箱子表里的 `minPow` 因此只需要一列，
   不用维护"横撞阈值 / 垂直阈值"两套（两套表的第一个后果就是有人只改一套）。
   量纲是一致的：`速度 × 体径比`，所以"多大球 + 多快"这层关系没变。
   `vDown` 非空即"这是落砸"，返回时的处理不同：横向要穿透继续滚，
   垂直要保留一部分下落速度继续往下掉。 */
function ballHitBox(b, box, dir, vDown) {
  const def = NUM.box[box.mat];
  const pow = Math.max(Math.abs(b.vx), vDown || 0) * (b.r / NUM.ball.baseR);
  const tier = ballTier(b.absorbed);

  if (pow >= def.minPow && tier >= def.minTier) {
    /* 冲击方向：横向撞 = 球的速度符号；落砸 = 自上而下。
       碎片、震屏、冲击环都吃这一个向量，三者才是一件事。 */
    const ddx = vDown ? 0 : (b.vx >= 0 ? 1 : -1);
    const ddy = vDown ? 1 : 0;
    breakBox(box, 'ball', pow, ddx, ddy);
    if (vDown) b.vy = vDown * def.keepSpeed;   // 落砸：继续往下犁
    else b.vx *= def.keepSpeed;                // 穿透：撞碎之后继续滚，这是爽感的来源
    b.chain++;

    /* **撞碎箱子不给体积。**
       即时回报已经够了：`keepSpeed` 让球继续滚、`chain` 记连碎数、
       震屏 + 45ms 顿帧。体积只认"吞掉敌人"这一条来源，
       否则裹怪这个核心操作会被"随便砸三口箱"替代掉。 */
    S.stat.ballChain = b.chain;
    S.stat.ballChainMax = Math.max(S.stat.ballChainMax, b.chain);
    /* **这里原本还有一行 `S.shake = Math.max(S.shake, 9)`，已删。**
       它是重复点火：`breakBox` 内部刚按动量点过一次（当时上限 14），
       出来又被 9 强行抬一次 —— 等于不管怎么调 breakBox 里的公式，
       实际峰值永远 ≥9，那行参数根本管不到真正的画面。
       震屏只该有一个出口（`kickShake`），否则"调了半天没变化"。

       下面这行 `hitStop(0.045)` 同理，也是**永远不生效的死代码**：
       `breakBox` 内部（`byBall` 分支）已经调过 `hitStop(0.046~0.071)`，
       而 `hitStop` 是 `Math.max` 语义 —— 0.045 更小，抬不动。
       删掉，免得以后有人以为"球碎箱是 45ms"，去改一个不起作用的数字。 */
  } else {
    // 砸不动：反弹 + 冒火花。**「太硬」这件事必须让玩家在物理上感到**
    /* ---- 但"砸不动的一格台阶"不该是一堵墙（2026-10-29）----
       用户原话：「球进入了死胡同　比如上坡　完全推不上去了」。
       球没有跳跃，被推进一个四周都比它高一格的坑里就永远出不来 ——
       只要那个坑壁是砸不动的（铁箱 / 冰墙 / 地形石台），推一百下也是弹回来。

       规则改成：**球能翻过它砸不动的一格台阶。** 判据用"箱顶比球底高多少"：
         ≤ 56（一格 + 一点余量）→ 起跳翻上去；
         ≥ 96（两格）→ 仍然是墙，得绕、或者换更大的球。
       这样"铁箱 = 墙"这条没被破坏（墙都是两格起的），而
       "一格高的硬边 = 死胡同"这条被消掉了。起跳高度按 60px 反算，
       刚好让球落到箱顶而不是飞过去。
       这一跳只在**被推着撞上去**时发生（|vx| ≥ 200）：轻轻蹭一下还是弹回来，
       否则球会在硬墙前面自己弹弹跳跳，看起来很傻。 */
    const stepH = (b.y + b.r) - box.y;
    if (!vDown && stepH > 4 && stepH <= 56 && Math.abs(b.vx) >= 200) {
      b.y = box.y - b.r - 1;
      b.vy = -Math.sqrt(2 * 2100 * 60);
      b.vx *= 0.86;
      addFrag(b.x, b.y + b.r, 6, '#EAF6FF', 180);
      /* **这里故意不震。** 翻上一格台阶是"顺滑通过"的动作 ——
         球在箱山上一路滚会连翻好几次，每次抖 3px 读起来就是
         "画面在自己抽搐"。碎片已经说清"磕了一下"。 */
      return;
    }
    if (vDown) {
      b.y = box.y - b.r; b.vy = 0; b.onGround = true;   // 落在箱顶，不动
    } else {
      /* **反弹永远不许比入射快。**
         原来写的是 `Math.max(140, |vx| * 0.4)` —— 那个 140 的下限在
         慢速时是**加速**：100 px/s 撞上去，回来 140。球在两块硬箱之间
         来回撞，速度就锁在 140 不衰减，永远停不下来。
         `Math.min(..., |vx| * 0.92)` 保证每次都掉一点，最多 8%。 */
      b.x = dir > 0 ? box.x - b.r : box.x + box.w + b.r;
      const back = Math.max(140, Math.abs(b.vx) * 0.4);
      const boxDamp = b.pushT > 0 ? 0.1 : 0.92;
      b.vx = -dir * Math.min(back, Math.abs(b.vx) * boxDamp);
    }
    addFrag(b.x, b.y, 8, '#FFE0A0', 220);
    /* 撞上去但没碎 = 最轻的一档，2px 只够让人觉得"有接触" */
    kickShake(2, 'bonk');
    if (box.mat === 'ice' && tier < def.minTier) {
      once('ice_tier', box.x + box.w / 2, box.y - 14, '球再大点才行', '#9AD8F5');
    } else {
      once('hard_ball_' + box.mat, box.x + box.w / 2, box.y - 14, '太硬了 · 换球砸', '#FFD08A');
    }
  }
}

function burstBall(b) {
  b.dead = true;
  addFrag(b.x, b.y, 14, '#DCF0FF', 300);
  addText(b.x, b.y - b.r - 6, '散了', '#9FB4C4', 14, 0.7);
}

/* **打击感的三件套，缺一件就"软"：**
     ① 碎片要有材质形状（木 = 板条、石 = 棱角块）—— 碎成一样的方点，
        所有东西就都一样了；
     ② 球砸要有**顿帧 + 冲击环**。顿帧让"力"有时间落地，环给出方向；
     ③ 震屏按"撞的动量"分级，不是一律 10 —— 小球轻轻蹭一下和特大球
        正面撞，手感该是不一样的。
   2026-10-29 补第四条：
     ④ **碎片和震屏都要有方向。** 全向均匀炸开读作"爆了"，
        沿撞击方向喷出去才叫"被撞碎"。`dirX/dirY` 是冲击的单位向量。 */
/* ---------------------------------------------------------------- 震屏点火
   **为什么需要这个函数，而不是到处写 `S.shake = Math.max(S.shake, n)`：**

   实测（`tools/_shake-who.js`，40 秒一局）——碎箱占全部震屏点火量的 **2/3**，
   而且球推过箱堆时能连着点 4~5 次，画面**连续抖 2.2 秒不停止**。
   玩家读到的是"满屏在震"，而不是"撞碎了一口箱子"。

   根因不在单次幅度，在**频率**：每一次碎箱都重新把衰减到一半的震动抬回峰值。
   所以这里做两件事：

     ① 幅度降一档（碎箱 8+5k/上限 14 → 3.2+2.2k/上限 6.5）。
        960 宽的屏幕上 6.5px 已经"看得出来被撞了"，14px 是"整屏在跳"。
     ② **同源连击递减**：0.35 秒内同一来源再点火，强度 ×0.6 逐次衰减到约 1/8。
        第一口按满力（力度还在），后面几口只剩余震 —— 一个动作只有一次"顶"。

   0.35 秒的窗口是量出来的：碎箱两口的间隔中位数约 0.1~0.2 秒，
   而"打完一口、走两步、再打下一口"通常 >0.5 秒。窗口取在两者之间，
   连续碾碎会被吞、独立两次冲击仍是两次满力。

   `key` 分开记（碎箱 / 打怪 / 受伤各算各的），免得打怪时碎箱被连带衰减。
   ------------------------------------------------------------------------- */
const SHAKE_WINDOW = 0.35;
const SHAKE_FALLOFF = 0.6;
/* ---------------------------------------------------------------- 音效
   **全部现场合成，不加载任何音频文件。** 两个理由：
     · 一是不用为十个动作攒素材；
     · 二是这个原型的定位是"双击就能玩"—— 外链音频在 preview 的静态服务里
       404 之后是**静默**的，玩家只会觉得"这游戏没声音"，而这类失败没有任何
       报错可查。
   WebAudio 的振荡器就够用了：这套动作全是短促的"打击/上扬"，本来就适合合成音。

   **必须容忍"没有 AudioContext"。** 断言和出图工具跑在 jsdom 里，那里没有
   这个类；不判一下，`_snowlab-check` 会从第一帧就抛。 */

/* 每个音一条：`f` 起止频率、`d` 时长、`w` 波形、`v` 音量、`n` 噪声层强弱。
   音高的关系是有意的 —— 好事上扬（裹住/合体/进门），坏事下坠（撞墙/受伤/死）。 */
const SFX_LIB = {
  wrap:     { f: [300, 660], d: 0.16, w: 'triangle', v: 0.50 },
  fuse:     { f: [400, 880], d: 0.20, w: 'sine',     v: 0.52 },
  push:     { f: [150,  92], d: 0.09, w: 'sawtooth', v: 0.30, n: 0.20 },
  /* 撞上去但没砸碎（2px 震屏那一档）。**音量必须比 box 明显小** ——
     它是"够不着"的反馈，不是"砸开了"，两者响度一样的话玩家会分不清
     自己在推进还是在白推。 */
  bonk:     { f: [190, 128], d: 0.07, w: 'sine',     v: 0.20 },
  box:      { f: [230,  62], d: 0.13, w: 'square',   v: 0.40, n: 0.55 },
  foe:      { f: [280, 110], d: 0.10, w: 'square',   v: 0.32, n: 0.30 },
  pin:      { f: [180,  60], d: 0.19, w: 'triangle', v: 0.56, n: 0.40 },
  door:     { f: [520, 780], d: 0.22, w: 'triangle', v: 0.42 },
  hurt:     { f: [340,  90], d: 0.22, w: 'sawtooth', v: 0.45 },
  boss:     { f: [300,  46], d: 0.36, w: 'sawtooth', v: 0.72, n: 0.85 },
  bossweak: { f: [120,  78], d: 0.12, w: 'square',   v: 0.28 },
  shoot:    { f: [620, 320], d: 0.07, w: 'square',   v: 0.16 },
  clear:    { f: [523, 784], d: 0.34, w: 'triangle', v: 0.44 },
  dead:     { f: [420,  80], d: 0.55, w: 'sawtooth', v: 0.50 },
  /* 拣到东西（雪晶 / 裂壳 / 买补给）。**上扬、短、亮** —— 全场所有声音里
     只有它和 door / clear 是往上走的，所以"好的事"这个语义是独立的一档。 */
  pick:     { f: [700, 980], d: 0.10, w: 'sine',     v: 0.34 },
  /* 裂壳裂开：低频起、高频收，带噪 —— 石头壳剥落，不是木头箱子碎裂。 */
  husk:     { f: [160, 620], d: 0.30, w: 'triangle', v: 0.60, n: 0.35 },
  /* 裂壳那一击的震屏（`kickShake(7,'relic')`）。**和 husk 分开两条**：
     一条是"东西碎了"，一条是"画面被撞了一下"。共用一条会变成
     音量一样、方向感丢失 —— 而这一下是全局里最"重"的一次。 */
  relic:    { f: [210,  72], d: 0.26, w: 'square',   v: 0.46, n: 0.50 },
  /* 深潜词条生效。**上扬 + 短**，和 clear 的语义拉开：
     它不是"完成了"，是"规则变了"。 */
  diveMod:  { f: [420, 300], d: 0.22, w: 'sawtooth', v: 0.34 },
};

/* `on` 在**定义时**就从存档取，不能等到第一次发声音。
   等到那时候的话，静音玩家进游戏的第一声还是会响（判断已经过了）。
   也不能写在启动段里 —— 抽取脚本用"首行紧邻"锚那段，多一行就命中 0 次，
   而命中 0 次的症状是**生成物停在上版、下游全绿**（栽过两次）。 */
const SFX = {
  on: (function () { try { return readSnowProgress().mute !== true; } catch (e) { return true; } })(),
  ctx: null, master: null, last: Object.create(null),
};
/** 静音状态跟着存档走：玩家关掉之后重开还得是关的，
    否则他每进一次关都要再按一次 M。 */
function sfxInit() {
  if (SFX.ctx) return;
  if (typeof window === 'undefined') return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    SFX.ctx = new AC();
    SFX.master = SFX.ctx.createGain();
    SFX.master.gain.value = 0.26;
    SFX.master.connect(SFX.ctx.destination);
  } catch (e) { SFX.ctx = null; }
}
function sfxNoise(c, dur, vol) {
  const n = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, n, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = c.createBufferSource();
  src.buffer = buf;
  const g = c.createGain();
  g.gain.value = vol;
  const bp = c.createBiquadFilter();
  bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = 0.8;
  src.connect(bp); bp.connect(g); g.connect(SFX.master);
  src.start();
}
function sfx(key) {
  if (!SFX.on) return;
  const t = SFX_LIB[key];
  if (!t) return;
  sfxInit();
  const c = SFX.ctx;
  if (!c) return;
  /* **同一种音 45ms 内只响一次。** 一帧里连撞三口箱子会发三次，
     叠起来是一声糊掉的爆音；而玩家听到的应该是一声"重"。
     这也顺便替 `kickShake` 的重复点火兜了底。 */
  const now0 = c.currentTime;
  if (SFX.last[key] != null && now0 - SFX.last[key] < 0.045) return;
  SFX.last[key] = now0;
  if (c.state === 'suspended') { try { c.resume(); } catch (e) { } }
  const o = c.createOscillator(), g = c.createGain();
  o.type = t.w;
  o.frequency.setValueAtTime(t.f[0], now0);
  o.frequency.exponentialRampToValueAtTime(Math.max(24, t.f[1]), now0 + t.d);
  g.gain.setValueAtTime(0.0001, now0);
  g.gain.linearRampToValueAtTime(t.v, now0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0004, now0 + t.d);
  o.connect(g); g.connect(SFX.master);
  o.start(now0); o.stop(now0 + t.d + 0.02);
  if (t.n) sfxNoise(c, Math.min(0.2, t.d), t.v * t.n);
}

function kickShake(px, key) {
  const k = key || '_';
  const rec = S.kick[k];
  let f = 1;
  if (rec && S.t - rec.t < SHAKE_WINDOW) {
    rec.n = Math.min(rec.n + 1, 6);        // 封顶：第 7 次之后不再继续衰减到 0
    f = Math.pow(SHAKE_FALLOFF, rec.n);
  } else {
