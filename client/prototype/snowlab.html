  g.beginPath();
  g.moveTo(mx - 1.7, hy + 5.2);
  g.lineTo(mx + 1.7, hy + 5.2);
  g.lineTo(mx, hy + 7.0);
  g.closePath(); g.fill();

  if (p.shotAnim > 0) {
    g.fillStyle = '#8A3B2E';
    g.beginPath(); g.ellipse(mx, hy + 10.2, 3.9, 3.5, 0, 0, Math.PI * 2); g.fill();
  } else {
    g.strokeStyle = '#8A3B2E';
    g.lineWidth = 1.7;
    g.lineCap = 'round';
    g.beginPath();
    g.moveTo(mx, hy + 7.0);
    g.lineTo(mx, hy + 8.2);
    g.moveTo(mx, hy + 8.2);
    g.quadraticCurveTo(mx - 1.5, hy + 10.8, mx - 3.5, hy + 8.9);
    g.moveTo(mx, hy + 8.2);
    g.quadraticCurveTo(mx + 1.5, hy + 10.8, mx + 3.5, hy + 8.9);
    g.stroke();
  }

  g.restore();      // 撤掉 bob
  g.globalAlpha = 1;
  g.restore();      // 撤掉 ART_K
}

/* **HUD 芯片的矩形集中在这一张表里。**（2026-10-29 第十轮，出图才发现）
   深潜的「深度」芯片原本在 806..944 × 74..108，而「试验台」面板是
   704..944 × 82..170 —— 整块盖住，「最佳」那行还正好落在面板第三行字上。
   这种 bug **断言抓不到也读代码看不出来**（两边都是硬编码数字，
   改一处不会提醒另一处），只有出图才会看见。
   现在两边都从这里取，断言只做一件简单的事：任两个矩形不许相交。 */
/* 顶栏之外的常驻 HUD 矩形。**集中成一张表**，断言才能直接量"任两个不相交",
   而不是靠人肉对数字。加一项就必须过一遍"任两矩形不许相交"那条断言。

   `progChip` = **进度芯片（一整块，两行）**：主线报关号 + 骨架名，
   深潜报深度 + 最佳。早先拆成 `diveChip`(34 高) + `diveBest`(14 高)
   上下相接的两块，结果第二行**没有底板、直接压在亮雪地上** ——
   12px 灰黄字在雪地背景上基本读不出来（出图才看见）。
   合并成 48 高的一块，两个模式共用：它们本来就互斥。 */
const HUD_RECTS = {
  meter:    { x: W - 256, y: 82,  w: 240, h: 88 },   // 试验台面板
  /* 138 宽太窄：第二行（骨架名 / 最佳）只有 114px 可用，13px 的中文
     两个字就要 26px，加上"最佳 1234"这种五位数会贴边。164 宽之后
     左边距到 780，和试验台面板（704 起）仍然上下错开，不相交。 */
  progChip: { x: W - 180, y: 178, w: 164, h: 48 },   // 第 N 关 / 深度 + 骨架 / 最佳
  /* 雪晶余额。**必须常驻** —— 货币是"我攒了多少、能花多少"，
     只在图鉴面板里能看到的话，玩家在关卡里做题时根本不会想到它。
     放在 progChip 正下方：右侧自上而下是「试验台 → 进度 → 雪晶」一列，
     和顶部那条 52 高的主栏不挨着（178+48=226 → 232）。 */
  coinChip: { x: W - 180, y: 232, w: 164, h: 30 },
  /* 深潜词条（只在深潜里画）。**必须常驻** —— 词条改的是"你早就学会的
     那条规则"，不常驻的话玩家会在第 12 关推球推不动时以为手滑了，
     而不是"厚甲生效了"。放雪晶下面，右侧一列自上而下读得通。 */
  modChip:  { x: W - 180, y: 270, w: 164, h: 26 },
};
function drawHud(g) {
  if (S.showHud === false) return;
  g.save();

  /* **深潜的深度读数。** 它是这个模式唯一的进度量 ——
     主线有 48 关和产地，深潜只有"我走到第几关"。
     **放「试验台」面板正下方，不放右上、也不放左上。**（2026-10-29 第十轮，出图才发现）
     右上 y=74 那块是「试验台」面板（704..944 × 82..170），深度芯片原在
     806..944 × 74..108 —— 整块被面板盖住，「最佳」那行还正好落在面板第三行字上。
     改到左上（16..154 × 74..108）又撞操作提示条（y=96）。
     最后落在**同一列的 y=178**：右侧自上而下读作「试验台 → 深度 → 最佳」，不挤任何人。 */
  /* **进度芯片**：深潜报深度，主线报关号。两者互斥，**共用一块矩形** ——
     写成两个 key 会让「任两矩形不许相交」的断言直接红（同坐标必然相交），
     那就变成断言在管一件根本不存在的冲突。
     第二行：深潜是「最佳」，主线是**这一关的骨架名** ——
     六种骨架的意义是"这关要走哪种路"，不报名字玩家只会觉得
     "怎么这次洞在左边"，而不是"这是螺旋骨架"。
     主线关号在这里出现，也是"48 次出门"这条链路唯一对玩家可见的进度。 */
  const dr = HUD_RECTS.progChip;
  const chipMain = S.dive ? ('深度 ' + S.dive.depth)
    : (S.stage != null && S.stage > 0 ? ('第 ' + S.stage + ' 关') : null);
  if (chipMain) {
    g.textAlign = 'right';
    g.font = '800 22px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle = 'rgba(14,22,28,.62)';
    rr(g, dr.x, dr.y, dr.w, dr.h, 10); g.fill();
    g.fillStyle = '#FFE08A';
    g.fillText(chipMain, dr.x + dr.w - 12, dr.y + 23);
    /* 13px 而不是 12px。12px 在 960×600 的画布上只有 12 个设备像素，
       中文的横画直接糊成一条 —— 出图量出来的是"有字但读不清"，
       而断言量不出这个（它只验矩形不相交）。 */
    g.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle = 'rgba(255,224,138,.8)';
    const skelCn = (S.level && S.level.skel && SKELETONS[S.level.skel])
      ? SKELETONS[S.level.skel].cn : '';
    const chipSub = S.dive ? ('最佳 ' + (S.dive.best || 0)) : skelCn;
    if (chipSub) g.fillText(chipSub, dr.x + dr.w - 12, dr.y + 42);
  }

  /* 雪晶。**深潜里也显示**（虽然深潜不能买）—— 它是"我这一趟攒到了什么"，
     而深潜结束时的那点成就感全在数字上。 */
  {
    const cr = HUD_RECTS.coinChip;
    g.textAlign = 'right';
    g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle = 'rgba(14,22,28,.62)';
    rr(g, cr.x, cr.y, cr.w, cr.h, 9); g.fill();
    g.fillStyle = '#FFD75E';
    g.fillText('雪晶 ' + snowCoins(), cr.x + cr.w - 12, cr.y + 21);
  }

  /* 深潜词条。四条会一直堆到 20 层，所以用空格连排、字号压到 13 ——
     比"每行一条"省 3 行，而玩家只需要认得出有几个字，不需要读全名。
     **13 而不是 12.5**（出图量的）：12px 级的中文在 960×600 上横画会糊成一条；
     上面进度芯片那段注释里已经为同一个原因把 12 抬到 13 了。
     **底衬必须和别的芯片同一块深色，不能用淡粉色蒙一层**（2026-10-30 出图）：
     原来这里是 `rgba(255,158,142,.16)` —— 在霜原的雪地上还行，
     到了沙塲的亮黄背景上四个字直接消失（截图里是"有字但读不出来"）。
     HUD 的一致性比"让词条显得特别"重要；"特别"靠那圈红描边和红字来说。 */
  if (S.dive) {
    const mods = diveMods(S.dive.depth);
    if (mods.length) {
      const mr = HUD_RECTS.modChip;
      const names = DIVE_MODS.filter(m => mods.indexOf(m.id) >= 0).map(m => m.cn).join(' ');
      g.textAlign = 'right';
      g.fillStyle = 'rgba(14,22,28,.62)';
      rr(g, mr.x, mr.y, mr.w, mr.h, 8); g.fill();
      g.strokeStyle = 'rgba(255,158,142,.55)'; g.lineWidth = 1.5;
      rr(g, mr.x, mr.y, mr.w, mr.h, 8); g.stroke();
      g.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillStyle = '#FF9E8E';
      g.fillText(names, mr.x + mr.w - 10, mr.y + 18);
    }
  }
  const inClear = S.phase === 'clear';

  // 顶栏
  g.fillStyle = 'rgba(14,22,28,.62)';
  rr(g, 16, 14, W - 32, 52, 12); g.fill();

  g.textAlign = 'left';
  g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';

  // 弹药
  g.fillStyle = S.ammo <= 15 ? '#FF9E8E' : '#DFF2FF';
  g.fillText('弹药', 34, 47);
  g.font = '800 26px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(String(S.ammo), 78, 49);

  // 饱食度
  const bx = 160;
  g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#C8DCE6';
  g.fillText('饱食', bx, 47);
  g.fillStyle = 'rgba(255,255,255,.16)';
  rr(g, bx + 44, 33, 84, 14, 7); g.fill();
  g.fillStyle = S.belly >= NUM.bellyFull ? '#9BE86E' : S.belly >= NUM.bellyHalf ? '#FFD08A' : '#FF9E8E';
  rr(g, bx + 44, 33, 84 * clamp(S.belly / 100, 0, 1), 14, 7); g.fill();
  /* 只写「N发/只」，**不写档位词**。档位已经由条的颜色和三档数字表达，
     写成「满饱 · 每只要 3 发」有 104px 宽，正好压死右边的「体力」和圆点
     （体力在 344、圆点从 396 起）—— 上一版就是这么把两串字叠在一起的。 */
  g.fillStyle = '#EAF4F8';
  g.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(snowNeed() + '发/只', bx + 136, 45);

  // 血
  const hx = 344;
  g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#C8DCE6';
  g.fillText('体力', hx, 47);
  for (let i = 0; i < NUM.hpStart; i++) {
    g.fillStyle = i < S.hp ? '#FF8B7A' : 'rgba(255,255,255,.18)';
    g.beginPath(); g.arc(hx + 52 + i * 17, 41, 6, 0, Math.PI * 2); g.fill();
  }

  /* **这一格读的是"本关目标的进度"，不是"击杀数"。**
     标签跟着**门开条件**换（破门 / 寻宝），数字的含义跟着换。
     这是"这一关和上一关不一样"**唯一常驻的可见证据** ——
     不换这一格的话，三种目标在画面上长得完全一样，玩家只能靠"门为什么不开"
     去猜，那是最坏的告知方式。

     **标签取的是门开条件，不是 `GOAL_CN[S.goal]`。** 省球关的门开条件和破门
     一模一样（杀够），差别在资源 —— 标签写「省球」会让这一格变成
     「省球 0 / 3」，而右边还有一个「满球 0 / 3」，两个 0/3 撞在一起，
     读者分不清哪个是"还要打几只"、哪个是"还能造几颗"。（出图才发现）

     位置沿用原来的 490 / 528：**不新增面板**。加一块新板就要重新算
     HUD_RECTS 的不相交断言，而这里本来就有一块地方在显示同一类东西。 */
  const collectGoal = S.goal === 'collect';
  const goalTxt = collectGoal
    ? ((S.loot || 0) + ' / ' + (S.lootTotal || 0))
    : (S.killed + ' / ' + S.killedTarget);
  g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#C8DCE6';
  g.fillText(collectGoal ? '寻宝' : '破门', 490, 47);
  g.fillStyle = goalMet() ? '#9BE86E' : '#EAF4F8';
  g.font = '800 22px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(goalTxt, 528, 48);

  /* 宝物。**这是"探索"唯一的量化反馈** ——
     只写"击杀"的话，玩家拆箱子的收益是看不见的，自然就不会去拆。
     **省球关这一格换成球额度**（同一个位置，不新增面板）：
     那关的稀缺资源就是球，"还能造几颗满的"比"砸了几个金箱"重要得多。
     宝物在那边仍然有反馈（砸开金箱会飘「宝物 +1」），只是不常驻。
     原来试过两个都放（宝物在 638、满球在 700），出图一看 "0 / 3" 撞在一起
     读成「宝物 0/3 满球#球」—— 22px 的数字加空格比预估宽 20px。 */
  if (S.goal === 'limit') {
    const left = Math.max(0, GOAL_STRONG_BALLS - (S.ballUsed || 0));
    g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle = '#C8DCE6';
    g.fillText('满球', 600, 47);
    g.fillStyle = left > 0 ? '#CFE8F5' : '#FF9E8E';
    g.font = '800 22px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(left + ' / ' + GOAL_STRONG_BALLS, 638, 48);
  } else {
    g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillStyle = '#C8DCE6';
    g.fillText(THEME.words.shard, 600, 47);
    g.fillStyle = S.loot > 0 ? '#FFD45E' : '#8FA8B8';
    g.font = '800 22px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(S.loot + ' / ' + S.lootTotal, 638, 48);
  }

  /* 当前层。**有纵深的关卡必须告诉玩家"我在第几层"** ——
     迷路不等于探索，玩家不知道自己在哪只会烦躁。
     判定用头顶 y 落到哪两个地板之间，别写死边界。 */
  let layerIdx = FLOORS.length - 1;
  for (let i = 0; i < FLOORS.length; i++) if (S.p.y < FLOORS[i]) { layerIdx = i; break; }
  const LAYER_COL = ['#DFF2FF', '#CFE8F5', '#B9DCF0', '#9FCBE8', '#8FC4E4', '#9BE86E'];
  g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#C8DCE6';
  g.fillText('所在', 806, 47);
  /* 层数现在是随机的（4~8），所以这里必须写 `第几/共几` ——
     只写名字的话，玩家没法知道自己还剩多深，而这一关唯一的进度感就是深度。 */
  g.fillStyle = LAYER_COL[Math.min(layerIdx, LAYER_COL.length - 1)];
  g.fillText((layerIdx + 1) + '/' + FLOORS.length + ' ' + LAYER_CN[layerIdx], 846, 47);

  // 门的状态（和"所在"拉开 50px，不然两串字会读成一串）
  g.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
  const dHidden = doorBlocked();
  g.fillStyle = S.door && S.door.open ? '#9BE86E' : dHidden ? '#8FA8B8' : '#FF9E8E';
  g.fillText(dHidden ? '门·未找到' : (S.door.open ? '门·开着' : '门·锁着'), 712, 46);

  if (inClear) { g.restore(); return; }

  /* 试验台面板（量具，不是玩家 HUD）。
     **必须放右上角。** 原来放左下角，正好压住玩家出生点（x=60）——
     开局第一眼看到的是一块统计面板，不是自己的角色。 */
  /* 试验台面板（量具）。**压到 4 行、高 88** —— 6 行 / 120 高的版本
     在 L2 会盖住右上那块浮台上的箱子和怪，玩家以为那层是空的。
     量具只留三个真正要看的数：裹一只几发、碎箱分布、一球连碎几口。 */
  const st = S.stat;
  const panelX = HUD_RECTS.meter.x, panelY = HUD_RECTS.meter.y;
  if (S.showMeter) {
    g.fillStyle = 'rgba(14,22,28,.46)';
    rr(g, panelX, panelY, HUD_RECTS.meter.w, HUD_RECTS.meter.h, 10); g.fill();
    const avg = st.shotsPerCoat.length
      ? (st.shotsPerCoat.reduce((a, b) => a + b, 0) / st.shotsPerCoat.length).toFixed(1)
      : '—';
    const lines = [
      '试验台 · 裹一只 ' + avg + ' 发（' + st.coats + ' 只）',
      '碎箱 子弹 ' + st.boxByShot + ' · 球 ' + st.boxByBall,
      '一球最多连碎 ' + st.ballChainMax + ' 口 · 球杀 ' + st.killByBall,
    ];
    g.font = '600 12.5px "PingFang SC","Microsoft YaHei",sans-serif';
    g.textAlign = 'left';
    for (let i = 0; i < lines.length; i++) {
      g.fillStyle = i === 0 ? '#8FB0C0' : '#D6E6EF';
      g.fillText(lines[i], panelX + 13, panelY + 23 + i * 22);
    }
  }

  /* 帧率（F 键）。**放右下角**：左上和顶部被 HUD 占着，
     放那儿会压住弹药/体力。

     显示三段：`58 fps · 17.2ms · 峰 320ms`。
     **第三段才是"一卡一卡"的证据** —— 前两段是平均值，一帧停 300ms
     也能被平均成 58fps。颜色按"最难受的那个"来定，不是只按 fps。 */
  if (S.perf.on && S.perf.fps > 0) {
    const P = S.perf;
    const txt = P.fps.toFixed(0) + ' fps · ' + P.ms.toFixed(1) + 'ms · 峰 ' + P.worst.toFixed(0) + 'ms';
    /* 等宽栈必须带一个中文字族。只写 `monospace` 时，"峰" 会渲成豆腐块 ——
       Chromium 会按字形回退，但离屏渲染（@napi-rs/canvas）不会。
       数字仍然吃 Consolas，中文落到雅黑，混排宽度也还算齐。 */
    g.font = '700 14px ui-monospace,Menlo,Consolas,"Microsoft YaHei",monospace';
    g.textAlign = 'left';
    const tw = g.measureText(txt).width;
    g.fillStyle = 'rgba(10,16,22,.62)';
    rr(g, W - tw - 34, H - 42, tw + 22, 28, 7); g.fill();
    /* 绿 / 黄 / 红三档。判据取两者中更差的一档：
         fps  ≥55 好 / ≥40 黄 / 否则红
         峰   <45 好 / <100 黄 / 否则红（45ms ≈ 掉了 2~3 帧，已经能看出来） */
    const fpsLv = P.fps >= 55 ? 0 : (P.fps >= 40 ? 1 : 2);
    const pkLv  = P.worst < 45 ? 0 : (P.worst < 100 ? 1 : 2);
    const lv = Math.max(fpsLv, pkLv);
    g.fillStyle = lv === 0 ? '#9BE86E' : (lv === 1 ? '#FFE08A' : '#FF8E7A');
    g.fillText(txt, W - tw - 23, H - 22);
    g.textAlign = 'left';
  }

  /* 操作提示。**开局 9 秒后淡出** —— 常驻的话它会一直压在地面层，
     左下那条路是玩家反复要走的。 */
  const tipA = clamp(9 - S.t, 0, 1);
  if (tipA > 0) {
    g.globalAlpha = tipA;
    g.fillStyle = 'rgba(14,22,28,.5)';
    /* 30 → 48 高、两行。**第二行只放"这一次更新新加的东西"**（踩实 / 图鉴 /
       补给）—— 第一行是"每一关都要用的手"，第二行是"还没形成肌肉记忆的动作"，
       混成一行的话它会超过 430px，压到中间那条雪地上读不出来。 */
    rr(g, 16, 76, 430, 48, 8); g.fill();
    g.fillStyle = '#C8DCE6';
    g.font = '600 13px "PingFang SC","Microsoft YaHei",sans-serif';
    /* 主线有关号之后 R 不再是"换一关"（换一关就是换一张随机图，
       那会让"第 7 关永远是同一张图"这条不成立），所以文案跟着改成"重打"。 */
    const tipR = (S.stage != null && S.stage > 0) ? 'R 重打' : 'R 换一关';
    g.fillText('A/D 移动 · W 跳 · J 吐雪 · 走过去顶球 = 推 · ' + tipR, 30, 94);
    g.fillStyle = 'rgba(200,220,230,.82)';
    g.fillText('C 踩实身边的球 · B 图鉴 · 1/2/3 花雪晶买补给', 30, 114);
    g.globalAlpha = 1;
  }

  // 全饿提示
  if (bellyTier() === 'hungry') {
    g.textAlign = 'center';
    g.fillStyle = 'rgba(255,158,142,.95)';
    g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('全饿：每只要 ' + NUM.snowShots.hungry + ' 发 —— 去砸箱子吃碎片', W / 2, 124);
  }

  g.restore();
}

/* 深潜结算。**刻意不做"通关"那套统计表** ——
   深潜里玩家关心的只有两个数：走了多深、这一局多少分。
   主线那张表（裹一只平均 / 球碎箱 / 一发几碎）是给设计看量具的，
   放在深潜结束页上会稀释"我还能不能再深一层"这个念头。 */
/* =========================================================================
   图鉴（B）
   =========================================================================
   **它不是菜单，是一面墙。** 没有返回按钮、没有分页、没有"领取奖励"——
   打开来看一眼，按 B 关掉。所以它不暂停游戏（见 onKey）。

   四块内容，每块回答一个玩家真的会问的问题：
     场景 —— "换了个地方，到底变了什么？"（答案是**介质**：几发裹一只、弹速）
     怪   —— "这三种有什么不一样？"（答案是**态度**：守 / 追 / 拉扯）
     裂壳 —— "这些都是什么？"（四块碎片 → 终局）
     终局 —— 集齐才有正文，否则是四个问号

   **没解锁的条目不是空的，是「？」+ 一句提示。** 空白格子只会让人以为
   游戏没做完；给一句"还没到过这里"，玩家知道那是自己没走到。
   ------------------------------------------------------------------------- */
const BREED_LIST = ['moss', 'fang', 'grub'];
const BREED_CN = { moss: '苔泥团', fang: '尖牙兽', grub: '霜甲虫' };
/* 每只一句：**说的是"怎么对付它"，不是"它长什么样"** ——
   外形在场上看得见，打法看不见。 */
const BREED_SAY = {
  moss: '守 · 你踏进它的圈，它鼓一下身就撞过来；撞完要喘两秒',
  fang: '追 · 一路跟着你跑，跑到够得着就甩牙，不守任何东西',
  grub: '拉扯 · 你一靠近它就退，边退边扔冰锥；退到台边才硬顶',
};

function drawCodex(g) {
  g.save();
  g.fillStyle = 'rgba(6,12,18,.82)';
  g.fillRect(0, 0, W, H);
  const PX = 120, PY = 58, PW = 720, PH = 484;
  g.fillStyle = '#131F27';
  rr(g, PX, PY, PW, PH, 16); g.fill();
  g.strokeStyle = 'rgba(155,232,110,.26)'; g.lineWidth = 2;
  rr(g, PX, PY, PW, PH, 16); g.stroke();

  /* 标题 + 雪晶余额（右上）。**余额放在图鉴里，因为买补给就在这附近按** */
  g.textAlign = 'left';
  g.fillStyle = '#EAF8FF';
  g.font = '800 28px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('图 鉴', PX + 30, PY + 44);
  g.textAlign = 'right';
  g.fillStyle = '#FFD75E';
  g.font = '800 18px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('雪晶 ' + snowCoins(), PX + PW - 30, PY + 42);

  const seenBiome = codexSeen('biome');
  const seenBreed = codexSeen('breed');
  const relics = relicCount();

  /* ---- 场景：2 列 × 2 行 ----
     每张卡两行：`霜原 · 雪` / `裹 6 发 · 弹速 ×1.00`。
     **裹几发是玩家最需要的那一个数** —— 换场景之后"这只怪要打几发"
     整个变了，而他只能靠猜。 */
  let yy = PY + 74;
  g.textAlign = 'left';
  g.fillStyle = 'rgba(200,220,230,.55)';
  g.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('场景 · 介质决定了裹几发、弹多快', PX + 30, yy);
  yy += 10;
  const CW = 330, CH = 50;
  for (let i = 0; i < THEMES.length; i++) {
    const t = THEMES[i];
    const cx = PX + 30 + (i % 2) * (CW + 16);
    const cy = yy + Math.floor(i / 2) * (CH + 8);
    const has = !!seenBiome[t.id];
    g.fillStyle = has ? 'rgba(255,255,255,.05)' : 'rgba(255,255,255,.02)';
    rr(g, cx, cy, CW, CH, 10); g.fill();
    g.textAlign = 'left';
    if (!has) {
      g.fillStyle = 'rgba(200,220,230,.34)';
      g.font = '700 16px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText('？ ？ ？', cx + 16, cy + 24);
      g.font = '600 12px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText('还没到过这里（第 ' + (i * 12 + 1) + ' 关起）', cx + 16, cy + 44);
    } else {
      g.fillStyle = '#EAF8FF';
      g.font = '700 16px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText(t.cn + ' · ' + t.medium.cn, cx + 16, cy + 24);
      const need = Math.max(1, Math.round(NUM.snowShots.full * t.medium.needK));
      g.fillStyle = t.medium.mote;
      g.font = '600 12.5px "PingFang SC","Microsoft YaHei",sans-serif';
      g.fillText('满饱裹一只 ' + need + ' 发 · 弹速 ×' + t.medium.speedK.toFixed(2)
        + ' · 第 ' + (t.to - 11) + '~' + t.to + ' 关', cx + 16, cy + 44);
    }
  }
  yy += (CH + 8) * 2 + 14;

  /* ---- 怪：三行 ----
     `苔泥团 · 守` 然后一句话。**名字和态度同一行**，因为玩家在场上
     认出来的是"那只蹲着的"，而决定他怎么打的是"守"这个字。 */
  g.fillStyle = 'rgba(200,220,230,.55)';
  g.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('敌人 · 三种体态，三套打法', PX + 30, yy);
  yy += 8;
  for (const id of BREED_LIST) {
    const has = !!seenBreed[id];
    const b = NUM.breed[id];
    g.fillStyle = has ? 'rgba(255,255,255,.04)' : 'rgba(255,255,255,.015)';
    rr(g, PX + 30, yy, PW - 60, 32, 8); g.fill();
    g.textAlign = 'left';
    g.fillStyle = has ? '#EAF8FF' : 'rgba(200,220,230,.30)';
    g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(has ? (BREED_CN[id] + ' · ' + (b.role === 'guard' ? '守' : b.role === 'hunt' ? '追' : '拉扯'))
      : '？ ？ ？', PX + 46, yy + 22);
    g.fillStyle = has ? 'rgba(214,230,239,.86)' : 'rgba(200,220,230,.22)';
    g.font = '600 12.5px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText(has ? BREED_SAY[id] : '还没见过', PX + 190, yy + 22);
    yy += 36;
  }
  yy += 10;

  /* ---- 裂壳（左） + 终局（右）----
     两件事放在同一行，因为它们本来就是一件事的两半：
     左边是"我找到了几块"，右边是"找到之后知道什么"。
     原来上下排，484 高的面板根本装不下（页脚会压在最后一张卡上）。 */
  g.fillStyle = 'rgba(200,220,230,.55)';
  g.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign = 'left';
  g.fillText('裂壳 · 终局怪撞碎时掉下来的，四块', PX + 30, yy);
  yy += 10;
  for (let i = 0; i < RELIC_TOTAL; i++) {
    const on = i < relics;
    const bx2 = PX + 30 + i * 46;
    /* 一格小裂壳：**和箱子本体同一套画法**（石箱体 + 浅色壳板 + 一层层理），
       缩到 38×30 只留得住这三笔。
       这里原来画的是一道**圆弧** —— 那是箱子第一版（同心圆靶心）的缩写。
       箱子改成壳板之后，图鉴里的小图标就成了"和它长得不一样的东西"，
       而给玩家的暗示是"你找到的是这个东西" —— 图标必须跟着本体走。 */
    g.fillStyle = on ? '#6A7078' : 'rgba(255,255,255,.07)';
    rr(g, bx2, yy, 38, 30, 6); g.fill();
    /* 空格子的描边不能太淡：`rgba(255,255,255,.10)` 在深色面板上约等于看不见，
       于是"四格还剩三格"这件事只能靠右边那个 "1 / 4" 的数字说 ——
       而这一排格子的作用本来就是"让你看见还空着几格"。 */
    g.strokeStyle = on ? '#2E3540' : 'rgba(214,230,239,.26)';
    g.lineWidth = 1.6;
    rr(g, bx2, yy, 38, 30, 6); g.stroke();
    if (on) {
      g.fillStyle = '#E9E7DE';
      rr(g, bx2 + 6, yy + 6, 26, 18, 4); g.fill();
      g.strokeStyle = 'rgba(120,128,142,.6)'; g.lineWidth = 1.2;
      rr(g, bx2 + 9.5, yy + 9.5, 19, 11, 3); g.stroke();
    }
  }
  g.fillStyle = relics > 0 ? '#E9E7DE' : 'rgba(200,220,230,.4)';
  g.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(relics + ' / ' + RELIC_TOTAL, PX + 30 + RELIC_TOTAL * 46 + 8, yy + 21);

  /* 终局：右侧。集齐之前是问号，集齐之后是这段 ——
     **它是这个游戏里唯一一段"有结局"的文字**，所以写得像一句人话。 */
  const tx = PX + 30 + RELIC_TOTAL * 46 + 92;
  g.fillStyle = 'rgba(200,220,230,.55)';
  g.font = '700 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('终局', tx, yy - 10);
  if (relics >= RELIC_TOTAL) {
    g.fillStyle = '#FFE08A';
    g.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('三层壳 · 第 48 关', tx, yy + 10);
    g.fillStyle = 'rgba(214,230,239,.86)';
    g.font = '600 12px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('够重的球才砸得开它的壳', tx, yy + 28);
  } else {
    g.fillStyle = 'rgba(200,220,230,.34)';
    g.font = '700 14px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('？ ？ ？', tx, yy + 10);
    g.fillStyle = 'rgba(200,220,230,.34)';
    g.font = '600 12px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('集齐四块才看得见', tx, yy + 28);
  }
  g.fillStyle = 'rgba(200,220,230,.5)';
  g.font = '600 12.5px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(relics >= RELIC_TOTAL ? '四块都在了。第 48 关，它在等你。'
    : '分别在第 12 / 24 / 36 / 44 关，被球砸开才会裂', PX + 30, yy + 54);

  /* 页脚：关掉 + 买补给的键位。**补给的键位写在这里**，因为
     "我有多少雪晶"和"能拿它买什么"是同一个念头的两半。 */
  g.textAlign = 'center';
  g.fillStyle = 'rgba(200,220,230,.5)';
  g.font = '600 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('B 关闭　·　1 +1血 30　2 +1球 45　3 +30弹 20　·　每关各一次',
    W / 2, PY + PH - 18);
  g.restore();
}

function drawDiveOver(g) {
  g.fillStyle = 'rgba(10,18,24,.78)';
  g.fillRect(0, 0, W, H);
  const cw = 420, ch = 300, cx = (W - cw) / 2, cy = 120;
  g.fillStyle = '#16232B';
  rr(g, cx, cy, cw, ch, 18); g.fill();
  g.strokeStyle = 'rgba(255,224,138,.34)'; g.lineWidth = 2;
  rr(g, cx, cy, cw, ch, 18); g.stroke();

  const d = S.dive || { depth: 1, score: 0, best: 0, kills: 0 };
  g.textAlign = 'center';
  g.fillStyle = '#FFE08A';
  g.font = '800 34px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText('深 潜 结 束', W / 2, cy + 62);

  g.fillStyle = '#EAF8FF';
  g.font = '800 56px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillText(String(d.depth), W / 2, cy + 132);
  g.font = '600 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(200,220,230,.7)';
  g.fillText('深度', W / 2, cy + 154);

  g.font = '700 18px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = '#9BE86E';
  g.fillText('本局 ' + d.score + '　·　最佳 ' + d.best, W / 2, cy + 200);
  g.font = '600 13px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = 'rgba(200,220,230,.6)';
  g.fillText('累计击杀 ' + d.kills + ' 只', W / 2, cy + 226);

  g.font = '700 15px "PingFang SC","Microsoft YaHei",sans-serif';
  g.fillStyle = S.deadT > 0.6 ? '#EAF8FF' : 'rgba(234,248,255,.45)';
  g.fillText('按 R 再来一局', W / 2, cy + 268);
}

function drawClear(g) {
  g.fillStyle = 'rgba(10,18,24,.72)';
  g.fillRect(0, 0, W, H);

  /* 实体卡片。**不能只把字浮在暗化的画面上** ——
     背景里还有箱子、平台、敌人，"子弹碎箱 / 球碎箱"那一行正好压在
     箱子上，白字和木色糊在一起，数字读不出来。 */
  const cw = 460, ch = 424, cx = (W - cw) / 2, cy = 88;
  g.fillStyle = '#16232B';
  rr(g, cx, cy, cw, ch, 18); g.fill();
  g.strokeStyle = 'rgba(155,232,110,.32)'; g.lineWidth = 2;
  rr(g, cx, cy, cw, ch, 18); g.stroke();

  g.textAlign = 'center';
  g.fillStyle = '#EAF8FF';
  g.font = '800 38px "PingFang SC","Microsoft YaHei",sans-serif';
  /* 有主线关号时标题报关号 —— 「进门了」是"这一张图过了"，
     「第 7 关」才是"我往前走了"；48 次出门全靠这一句给进度感。 */
  const clampedStage = (S.stage != null && S.stage > 0) ? clamp(S.stage, 1, STAGE_MAX) : 0;
  g.fillText(clampedStage ? ('第 ' + clampedStage + ' 关') : '进 门 了', W / 2, cy + 68);

  /* **三颗星。** 这一行原来是「这一关的量具数据」—— 一个标签，
     玩家看完不知道该干什么。同样一行高度，从"说明"换成"成绩"：
     达成了是实心金星，没达成是空心灰星，三个槽位一眼看得出还差几颗。
     星名（一毛不拔 / 大打卷 / 一只不留）不进卡片：460 宽的卡里塞
     三行中文会把量具表挤掉，而星位本身已经说明"有三件事可做"。 */
  const gotStars = S.starGot || [];
  g.font = '700 24px "PingFang SC","Microsoft YaHei",sans-serif';
  for (let i = 0; i < STAR_LIST.length; i++) {
    const on = gotStars.indexOf(STAR_LIST[i]) >= 0;
    g.fillStyle = on ? '#FFD75E' : 'rgba(255,255,255,.13)';
    g.fillText(on ? '★' : '☆', W / 2 - 46 + i * 46, cy + 100);
  }

  const st = S.stat;
  const avg = st.shotsPerCoat.length
    ? (st.shotsPerCoat.reduce((a, b) => a + b, 0) / st.shotsPerCoat.length).toFixed(2) + ' 发'
    : '—';
  const rows = [
    ['裹一只平均', avg],
    ['子弹碎箱 / 球碎箱', st.boxByShot + ' / ' + st.boxByBall],
    ['一球最多连碎', st.ballChainMax + ' 口'],
    ['剩余弹药', S.ammo + ' 发'],
    ['剩余饱食', Math.round(S.belly) + '（' + TIER_CN[bellyTier()] + '）'],
    ['总发弹数', st.shots + ' 发'],
  ];
  g.font = '600 17px "PingFang SC","Microsoft YaHei",sans-serif';
  for (let i = 0; i < rows.length; i++) {
    const y = cy + 138 + i * 36;
    if (i % 2 === 0) {
      g.fillStyle = 'rgba(255,255,255,.04)';
      rr(g, cx + 26, y - 21, cw - 52, 30, 6); g.fill();
    }
    g.textAlign = 'right'; g.fillStyle = '#8FA8B8';
    g.fillText(rows[i][0], W / 2 - 16, y);
    g.textAlign = 'left'; g.fillStyle = '#DFF2FF';
    g.fillText(rows[i][1], W / 2 + 16, y);
  }

  g.textAlign = 'center';
  /* 雪晶结算。**放在这里而不是塞进上面那张表** —— 表里的六行是"这一关
     怎么打的"，雪晶是"这关给了我什么"，两件事不在一个层次上。
     首次通关的 +20 是最大的一笔，所以这一行值得单独占一条。 */
  if (S.coinGain > 0) {
    g.fillStyle = '#FFD75E';
    g.font = '700 16px "PingFang SC","Microsoft YaHei",sans-serif';
    g.fillText('雪晶 +' + S.coinGain + '　（现在 ' + snowCoins() + '）', W / 2, cy + ch - 50);
  }
  g.fillStyle = '#7FA3B5';
  g.font = '600 15px "PingFang SC","Microsoft YaHei",sans-serif';
  /* **两个动作两个键**：Enter = 往前走，R = 这一关再来一次。
     以前只有 R（换一张随机图），因为那时候没有关号，
     "下一关"和"换一关"在玩家眼里是同一件事。 */
  if (clampedStage >= STAGE_MAX) {
    g.fillText('主线到这里 · 按 D 下深潜', W / 2, cy + ch - 24);
  } else if (clampedStage > 0) {
    g.fillText('Enter 进第 ' + (clampedStage + 1) + ' 关   ·   R 重打本关', W / 2, cy + ch - 24);
  } else {
    g.fillText('按 R 换一关（布局每局随机）', W / 2, cy + ch - 24);
  }
}

/* =========================================================================
   循环 + 测试出口
   ========================================================================= */
let last = 0;
function loop(ts) {
  if (!last) last = ts;
  const dt = Math.min(0.05, (ts - last) / 1000);
  last = ts;
  step(dt);
  draw();
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(loop);
}

if (typeof window !== 'undefined' && typeof document !== 'undefined') {
  window.addEventListener('keydown', e => onKey(e, true));
  window.addEventListener('keyup', e => onKey(e, false));
  window.addEventListener('blur', () => { S.keys = {}; });
  /* **开哪一关**：URL 显式给的 > 存档里那一关 > 第 1 关。
     只有从出征页进来才读存档 —— 直接打开这个文件是"看原型"，
     应该从第 1 关开始，而不是莫名其妙接着上次跑到第 30 关。 */
  const qStage = parseInt(SNOW_URLP.get('stage'), 10);
  if (Number.isInteger(qStage) && qStage > 0) startStage(qStage);
  else if (FROM_GROVE) startStage(readSnowProgress().stage || 1);
  else reset();
  /* 出征页进来的返回口。和 grove.html 的「← 家园」同一个套路：
     DOM 按钮而不是画布里的热区 —— 画布里的按钮要跟 HUD 抢位置，
     而这一条只在特定入口出现，画在画布上纯属浪费一个矩形。 */
  if (FROM_GROVE) {
    const a = document.createElement('a');
    a.id = 'toGrove';
    a.href = 'grove.html?from=home';
    a.textContent = '← 出征';
    a.style.cssText = 'position:fixed;left:18px;bottom:16px;z-index:9;' +
      'font:600 13px "PingFang SC","Microsoft YaHei",sans-serif;' +
      'color:#CFE8F5;background:rgba(14,22,28,.72);border:1px solid rgba(160,200,180,.34);' +
      'border-radius:16px;padding:6px 14px;text-decoration:none;letter-spacing:.5px;';
    document.body.appendChild(a);
  }
  if (typeof requestAnimationFrame === 'function' && ctx) requestAnimationFrame(loop);
  else draw();
}

/* **测试出口**。headless 断言全走这里 —— 逻辑不依赖 rAF，也不依赖 canvas。
   `WORLD_H / GROUND_Y / FLOORS / HOLES` 现在是**每关重新生成**的，
   所以必须用 getter 导出：写成字面量的属性会把第一关的值焊死在里面，
   断言在第二关就会拿到上一次的层高。 */
const API = {
  NUM, S, W, H,
  reset, newLevel, step, shoot, draw,
  /* 深潜三件套。导出是为了断言能走完整的"过门 → 下一关 → 死"链路，
     而不是只验 genLevel(-n) 的形状。 */
  startDive, diveNext, endDive,
  /* 三星（CR-032 第 1 步）。断言要知道"判定口径是哪三条"，
     不能只测"能拿到星" —— 那样改判定阈值也不会红。 */
  judgeStars, starBits, STAR_LIST, STAR_CN, STAR_HINT, STAR_JUDGE,
  readSnowStar, writeSnowStar,
  /* 关卡目标（CR-032 第 2 步：破门 / 寻宝 / 省球）。
     **`goalOf` 必须导出**：它的分配规则是纯函数，"第 N 关是什么目标"
     只能拿代码问 —— 出图只能看到某一关长什么样，看不出分配有没有周期、
     有没有漏掉某一种、教学段是不是被误塞了目标。
     `goalMet` 同理：门开判据是两条完全不同的分支，只测"门能开"验不出
     "寻宝关的门是不是被击杀数顺带撞开的"。 */
  goalOf, goalMet, GOAL_LIST, GOAL_CN, GOAL_SAY, GOAL_STRONG_BALLS,
  /* BOSS 档位（第 3 步：每 8 关一只）。
     **`bossTierOf` 必须导出**，理由和 `goalOf` 一样：壳数/门槛是纯函数，
     断言要能直接问"第 16 关的 BOSS 要裹几只球" —— 出图只能看出"它长得
     比上一个大"，量不出门槛有没有真的递进。 */
  bossTierOf, diveBossTier, BOSS_STAGES, BOSS_TIERS, DIVE_BOSS_EVERY,
  /* 主线关号链路（出征页 → 第 N 关 → 通关 → 第 N+1 关）。
     导出是为了断言能验"关号派生种子可复现 / 不同关不同图 / 通关推进 /
     48 关封顶"，这四条里只有第一条在图上看得见。 */
  startStage, stageSeed, readSnowProgress, writeSnowProgress, STAGE_MAX,
  /* 雪晶 / 图鉴 / 裂壳 / 悬台（CR-032 第 4、5 条 + 踩实专属关）。
     这批全是"状态在存档里、规则是纯函数"的东西，**只能靠断言验** ——
     出图看得到面板长什么样，看不出"集齐四块裂壳才解锁终局"这条判据
     有没有写反。 */
  snowCoins, addSnowCoins, spendSnowCoins, BUY_LIST, buySupply,
  codexSeen, codexMark, relicCount, addRelic, RELIC_STAGES, RELIC_TOTAL, relicOf,
  DIVE_MODS, diveMods, diveHas, PERCH_STAGE, PERCH_H, PERCH_W,
  HUD_RECTS, SKELETONS,
  genLevel, validateLevel, buildLevel, surfY, unreachableCols, ballPits, ballStuckCols,
  bellyTier, snowNeed, ballTier, ballR, ballPow,
  coatFoe, makeBallFrom, ballHitBox, shotBox, breakBox, hurtPlayer,
  checkDoor, doorBlocked, groundAt, stepDoor,
  /* 球与球（2026-10-30）。**三个都必须导出** —— 球球碰撞是纯几何 + 动量，
     只有把两颗球摆到指定坐标、调一次 stepBallPairs 才能问
     "动量传没传过去""该不该合体"。出图只能看到结果，看不到
     "两颗慢球贴住 0.2 秒时还没合、0.3 秒才合"这条边界。 */
  stepBalls, stepBallPairs, fuseBalls,
  /* 踩实（C）。断言要验"贴地才让踩 / 踩完能站人 / 球真的从弹药里没了"，
     这三件事全在函数内部，只能导出来测。 */
  tryPin, pinCandidate, canPin, pinBall,
  /* 音效。断言验的是"表全不全"和"没有 AudioContext 时会不会抛"——
     jsdom 里没有这个类，出图/断言全都要能跑。 */
  SFX_LIB, SFX, sfx,
  /* 井梯攀爬。**导出是为了量"爬上去有没有瞬移"** ——
     这条路径历史上是 `p.x = cw.x; p.y = cw.y` 一帧到位，
     光看代码能看出"没有过渡"，看不出多大的跳变。 */
  wellClimb, startClimb,
  /* 离屏画布工厂。**测试工具必须覆盖它** —— 那些工具把
     `HTMLCanvasElement.prototype.getContext` 整个换成同一个 ctx，
     不覆盖的话 buildStatic 会把静态层直接画到主画布上。
     传 null 恢复默认（document.createElement('canvas')）。 */
  setOffscreen: f => { OFFSCREEN = f; STATIC = null; },
  /* 出图工具用：把单个箱子/门画到任意画布上（**只为评审，不参与游戏逻辑**）。
     道具（箱/桶/门）是这一版重画的重点，靠整关截图看不出"这一笔对不对" ——
     放大到 3~4 倍单独看才判得了。 */
  drawBox, drawDoor,
  /* `pet` 可选：测试要能点名"给我一只兔子 / 一只狗"。
     不传就按 kind 自动挑（见 breedOf），和生成器走同一条路。 */
  spawnFoe: (x, y, kind, breed) => {
    const f = makeFoe(x, y, kind, breed);
    S.foes.push(f);
    return f;
  },
  /** 直接造一颗球（绕过"先冻怪"），用来单独量"球砸箱"的数值 */
  spawnBall: (x, y, vx, absorbed) => {
    const n = absorbed == null ? 1 : absorbed;
    const b = { x, y, vx: vx || 0, vy: 0, r: ballR(n), absorbed: n, life: NUM.ball.life, onGround: false, chain: 0, hitCd: 0, dead: false };
    S.balls.push(b); return b;
  },
  /** 把玩家放到指定位置（测试站位用） */
  placePlayer: (x, y) => { S.p.x = x; S.p.y = y; S.p.vx = 0; S.p.vy = 0; },
  /* 出手后坐力（屏幕像素）。断言靠它守"出手有反馈"这件事。 */
  recoilOffset: (p) => recoilOffset(p || S.p),
  /** 每只敌人贴图在当前尺寸下的世界尺寸（宽 × 高）。给断言与出图工具用。
      **不能用眼睛量**：「敌方体态超过了箱子」这条是用户提的，
      而图上"看着差不多"和实际超没超，差 6px 就看不出。 */
  foeArtSize: (breed) => {
    const A = FOE_ART[breed];
    const im = A ? artOf(A.key) : null;
    if (!im) return null;
    const h = A.h;
    return { h, w: h * ((im.width || im.naturalWidth) / (im.height || im.naturalHeight)) };
  },
  /** 打 N 发雪弹到指定敌人（跳过物理飞行，直接命中） */
  hitFoeN: (f, n) => { for (let i = 0; i < n; i++) coatFoe(f, 1); },
  /** 出图工具用：把已解码的立绘塞进来（jsdom 没有 <img> 解码） */
  /* **两种调用都认**：传一张 Image = 给霜原换图（现存二十多个出图工具全是
     这么调的，一条都不改）；传 `{ snow: img, ember: img }` = 按场景挂图。
     传 null 清掉**当前场景**那张 —— 老工具清的是霜原，行为不变。 */
  /* 挂背景图。三种用法：
       `setBackdrop(img, 'ember')`  → 只挂熔炉那张（出图 / 断言按场景验）
       `setBackdrop({ snow: img })` → 一次挂多张
       `setBackdrop(null)`          → 清掉（默认清霜原，保持老工具的行为）
     **第二个参数默认 `snow` 而不是 `THEME.id`**：老工具都是
     `loadImage(失败) → setBackdrop(null)`，那时还没 applyTheme，
     按当前场景清会清错地方，而"清错了"和"清了"看不出区别。 */
  setBackdrop: (arg, id) => {
    if (!arg) { BG_IMGS[id || 'snow'] = null; return; }
    if (typeof arg === 'object' && !('width' in arg) && !('naturalWidth' in arg)) {
      for (const k of Object.keys(arg)) BG_IMGS[k] = arg[k] || null;
      return;
    }
    BG_IMGS[id || 'snow'] = arg || null;
  },
  themes: () => THEMES.map(t => t.id),
  themeOf,
  /* **背景图必须能按场景单独查**：断言要验"给熔炉挂图不影响霜原"，
     而 BG_IMGS 是模块内的，外部读不到 —— 只验"不抛"等于没验。 */
  bgFor: (id) => BG_IMGS[id] || null,
  /* 出图 / 断言要能直接指定场景（不经过 startStage 造一关）。
     **必须放在这个字面量里**，不能塞进下面 defineProperties —— 那里只收
     `{get:...}` 这种描述符，直接写函数名会被当成描述符对象静默丢掉，
     `L.applyTheme` 就是 undefined。 */
  applyTheme: (id) => applyTheme(typeof id === 'string' ? THEMES.find(t => t.id === id) : id),
  /* 岩层调色板是**按场景算出来的**（`ROOM_RAMP` + 混色），不是手写常量。
     断言要验"四个场景的地下确实不同"就只能读这个，读 `THEME` 不够 ——
     那只能验地表。 */
  roomsOf,
  roomOf,
  /** 出图工具用：注入宠物贴图。键名沿用 `GroveBattle.ts` 的 ART_MANIFEST
      （`pet-cat` / `pet-dog` …），两份清单用同一套名字，换角色时不会对不上。 */
  setArt: (map) => { for (const k in map) ART[k] = map[k]; },
};

/* 关卡结构走 getter：每关重新生成，导出时必须实时取。 */
Object.defineProperties(API, {
  /* 角色尺度走 getter：断言要能核对"形象和碰撞是同一个尺度" */
  ART_K: { get: () => ART_K },
  FOE_K: { get: () => FOE_K },
  GEN: { get: () => GEN },
  FOE_W: { get: () => FOE_W },
  FOE_H: { get: () => FOE_H },
  PLAYER_W: { get: () => PLAYER_W },
  PLAYER_H: { get: () => PLAYER_H },
  /* 敌人贴图的尺寸表。断言要靠它核「形象宽度 ≤ 0.85 × 箱子」——
     这条用眼睛量不出来（图上"看着差不多"就够了），只能算。 */
  FOE_ART: { get: () => FOE_ART },
  GROUND_Y: { get: () => GROUND_Y },
  WORLD_H: { get: () => WORLD_H },
  FLOORS: { get: () => FLOORS },
  HOLES: { get: () => HOLES },
  LAYERS: { get: () => LAYERS },
  LAYER_CN: { get: () => LAYER_CN },
  SEED: { get: () => LEVEL_SEED },
  /* 地面查询。**导出是为了让断言能直接验"斜坡不算坎"**（2026-10-29）：
     两条闸（`noRamp` / 站着不爬）的症状完全一样，只看"有没有原地跳"
     分不出是哪一条被改回去了。 */
  groundAt: (x, y, noRamp) => groundAt(x, y, noRamp),
  /* HUD 芯片矩形表（度量与断言共用）。深潜的「深度」芯片曾经整块
     压在「试验台」面板下面，只有出图才看得出来 —— 现在断言直接量。 */
  HUD_RECTS: { get: () => HUD_RECTS },
  /* 当前场景。**必须是 getter**：写成字面量会焊死"导出那一刻是霜原"，
     断言在第 13 关读到 snow 就会误判"换场景没生效"。 */
  THEME: { get: () => THEME },
  THEMES: { get: () => THEMES },
});

if (typeof window !== 'undefined') window.SNOWLAB = API;
if (typeof module !== 'undefined' && module.exports) module.exports = API;
})();
</script>
