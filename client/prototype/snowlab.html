<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>PAWPACK · 随机雪洞试验台</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #0B1014;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #wrap { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; border-radius: 8px; box-shadow: 0 24px 70px rgba(0,0,0,.65); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
/* ===========================================================================
   PAWPACK · 随机雪洞试验台
   ---------------------------------------------------------------------------
   **这个文件不是游戏，是量具。**

   任务只有一件：把「吐雪 → 裹成球 → 推球砸箱 → 砸开箱墙见到门」这一条闭环
   跑起来，并且把三个数当场量出来：

     ① 裹一只怪平均几发   ② 碎一口箱几发   ③ 一颗球撞碎几个箱

   为什么单开一个文件、不直接改 grove.html：主线 21599 行、27 屏、1463 项冒烟
   断言，而这一版动的是**输入通道**（近身糊 → 远程吐）和**资源模型**（球额度 →
   弹药），两处都在主线最底层。先在试验台把数值跑顺，再决定要不要搬。

   数值全部集中在下方的 NUM 表里，改表就能重跑，不用翻代码。
   =========================================================================== */
(function () {
'use strict';

/* ---------------------------------------------------------------- 画布 */
const W = 960, H = 600;
const cv = document.getElementById('cv');
/* jsdom 里没有 canvas 实现。测试只要逻辑，所以拿不到 ctx 就降级成 null，
   draw() 第一行 return —— 逻辑和渲染因此可以分开验。 */
let ctx = null;
try { ctx = cv.getContext('2d'); } catch (e) { ctx = null; }
if (ctx) {
  const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

/* ---------------------------------------------------------------- 数值表
   全部可调。改这里，不碰逻辑。 */
const NUM = {
  /* 弹药。用户 2026-10-28 拍板：单关初始 100 发。
     这个数看着宽裕，其实是**刚好卡住**的：
     6 只怪 × 6 发（满饱）+ 16 口木箱 × 3 发 = 84 发，只剩 16。
     也就是说「全用子弹开路」这条路走不到头，必须靠球省。 */
  ammoStart: 100,

  /* 裹成球要几发。三档饱食度。
     ** 6 / 4 的倒挂是待验证的疑点 **：饱的时候反而更费，说不过去。
     先按用户拍的值跑，跑完看手感再定。HUD 会实时显示当前档位的发数。 */
  snowShots: { full: 6, half: 4, hungry: 10 },

  bellyStart: 100,
  bellyFull: 70,          // ≥70 = 满饱
  bellyHalf: 35,          // ≥35 = 半饱，以下 = 全饿
  bellyPerBall: 14,       // 造一颗球掉多少
  bellyPerShard: 20,      // 吃一片雪之碎片回多少

  /* 吐雪。**「喷的代价」在这里**，两条都用：
     ① 射程短 —— life 0.24s × 620 = 149px，必须靠近
     ② 喷时锁移动 —— 0.14s，比射速 0.16s 短一点，所以连喷 = 站桩
     没有这两条，100 发会让玩家站在角落喷满全场再统一推球，
     「喷」和「推」就变成两个不相干的阶段了。 */
  shot: { speed: 620, life: 0.24, cd: 0.16, lock: 0.14, r: 7 },

  /* 球。半径沿用 grove 的 22 + 2.8/点，上限提到 +24。
     两点 = 一只怪的量；**砸碎一口箱子算 2.0 点，也就是大半只怪** ——
     用户 2026-10-28：「球砸箱子 球是不能变大的」，他要的是砸箱有即时回报。
     每档之间必须拉开肉眼能分辨的差距（冰墙只认特大球，读不出档位就无从计划）。 */
  ball: { baseR: 22, perAbsorb: 2.8, maxAbsorb: 24, life: 4.6, fric: 260, maxR: 46,
          absorbFoe: 1.0, absorbBox: 2.0 },

  /* 推球力度。沿用 grove 的 620 → 1209（助跑满格约 380px）。 */
  push: { base: 620, runGain: 0.95, runFull: 380 },

  /* 箱子。**这里是整套材质系统的核心表**：
     hp        = 子弹要几发才碎（Infinity = 子弹完全无效）
     minPow    = 球要多大的动量才能砸碎（0 = 随便推都碎）
     keepSpeed = 砸碎后球保留多少速度（穿透感就靠这一列）
     minTier   = 球至少要几档（0小 1中 2大 3特大） */
  box: {
    wood:  { hp: 3,        minPow: 0,    keepSpeed: 0.82, minTier: 0, name: '木箱' },
    stone: { hp: Infinity, minPow: 560,  keepSpeed: 0.46, minTier: 0, name: '石箱' },
    iron:  { hp: Infinity, minPow: 1150, keepSpeed: 0.30, minTier: 0, name: '铁箱' },
    ice:   { hp: Infinity, minPow: 1550, keepSpeed: 0.36, minTier: 2, name: '冰墙' },
  },

  /* 掉弹。**这一列是「用球才回本」的唯一实现**：
     木箱被子弹砸碎几乎不回本（10%），被球砸碎才值钱（40%）。
     不靠 HP 磨，靠掉率拉价值差 —— 玩家自己会算出来，不用教。 */
  drop: {
    shardByBall: 0.40,
    shardByShot: 0.10,
    shardAmmoMin: 3,
    shardAmmoMax: 5,
  },

  /* **3 只，不是杀光。** 两件事同时成立才行：
     ① 怪分布在三层，要求杀光会逼玩家返回上层找漏网的 —— 那是「返程」不是「探索」；
     ② **必须 <= 底层怪数**。这关是单向往下的（掉下去就上不来），
        玩家一路不杀直接挖到底，手上就只剩底层的怪。如果底层只有 2 只
        而目标是 4，门永远开不了 = 死局。底层放 3 只，门槛写 3，卡不住。 */
  killTarget: 3,
  hpStart: 3,
  hpInvuln: 1.2,

  /* 贴脸保底：跑动中撞上敌人，自己掉 1 血、敌人吃 2 点雪。
     零弹时的唯一出路，代价是血 —— 保底是**机制**，不是系统施舍。 */
  bodyCoat: 2,
};

/* ---------------------------------------------------------------- 工具 */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sign = v => v < 0 ? -1 : 1;
const rnd = (a, b) => a + Math.random() * (b - a);
function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* ---------------------------------------------------------------- 关卡
   **随机生成的纵向下行关，层数 4~8，每层一个箱室。**

   用户 2026-10-28 的三次反馈连起来看是一条线：
     ① 「箱子明显不够，空间设计感太简陋，只能体会到一颗球在砸一个箱子」
     ② 「层与层太远了，你可以设置很多层，有很多木箱」
     ③ 「L1 到 L6 应该是随机布局吧，首先不一定是 6 层，其次也有可能有斜坡，
        而且每层不一定只有一个出口去下一层，可以灵活空间设计」

   ①的答案是纵深，②的答案是很多层 × 240，③的答案是**别再手写坐标**。
   手写坐标只能手写出一张图；要"灵活"，就得让关卡是算出来的：

     · 层数 4~8 随机，层高锁死 240
     · 每层 1~2 个下行口（34% 的层给两个），位置在三个槽位里随机
     · 下行口三种封法：覆霜木箱 / 冰墙 / 敞开（敞开的要自己看出来）
     · 每层地形 1~2 组：平台 + 配套坡（能直接走上去，不用跳），
       或者一段孤立的雪包（上坡 + 下坡，两端都落地）
     · 箱子 9~13 口一层，越深越硬；每层 1~3 只怪
     · 门厅的门位置也随机，外面裹两列冰

   **层高必须锁死 240，这是全关唯一不能随机的数。**
   净空 = 240 − 板厚 40 = 200；玩家高 42、跳高 123。站在 h 高的箱子上
   想上到上一层，起跳空间 (200−h−42)，需要上升 (240−h)，两者**恒差 82** ——
   与层高取值无关。所以任何箱堆都送不回上一层，这一关是单向下行的，
   箱子只做空间材料和高台台阶。反过来看这也是好事：层高固定，
   跳跃/坠落/镜头这一套参数只需要对一种高度调好。

   **随机和可解是两件平行的事。** 生成器出图之后必须过 `validateLevel()`：
   相邻两层的洞不能重叠（否则一穿两层）、每个洞正下方必须接得住（否则
   掉进下一层的洞里连环坠）、地形不能盖住本层的出口、地表出生点不能悬空、
   门厅怪数必须够 killTarget、怪不能生在雪包里（会永久卡在坡体内）。
   不过就换种子重掷，最多 80 次。随机负责新鲜，校验负责不死局。

   **"放之前先验，别放完再筛"** —— 地形按"平台 + 配套坡"整段验，箱子给坡让位，
   怪先枚举整层的可站点再抽。这三条都是同一个教训：事后过滤会把能用的东西
   一起扔掉，数量直接塌（坡从 2.4 条/关掉到 1.3 条就是这么来的）。
   ---------------------------------------------------------------- */

const WALL_L = 24, WALL_R = 936;

const GEN = {
  topY: 340,          // 地表地板高度
  floorH: 240,        // 层高（不可随机，见上）
  thick: 40,          // 地板厚度
  minFloors: 4,
  maxFloors: 8,
  /* 三个下行口槽位，48 对齐，**槽与槽之间留 72px 空档**。
     相邻两层不能共用槽位 —— 共用就有概率让上下两个洞的 x 重叠，
     人从上面掉下来直接穿过下面那个洞，一次掉两层。
     空档是第二道保险：槽紧挨着的话（比如 336 结束、336 开始），
     两层的洞会正好贴边，加上"玩家宽 30"的安全余量照样算重叠。 */
  slots: [[48, 288], [360, 600], [672, 912]],
};

let WORLD_H = 1580, GROUND_Y = 1540;
let FLOORS = [], LAYER_CN = [], HOLES = [], LAYERS = [];
let LEVEL_SEED = null;

/* mulberry32。**不能用 Math.random**：出图和断言都要能复现同一张关卡，
   否则"随机布局"等于"不可测"。 */
function rngFrom(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** 一块实心体在 x 处的顶面高度。**斜坡是全场唯一的非矩形件**，
    其余（地板、平台、箱子）都直接返回 s.y。 */
function surfY(s, x) {
  if (!s || s.kind !== 'ramp') return s ? s.y : WORLD_H;
  const t = clamp((x - s.x) / s.w, 0, 1);
  return s.y - s.rise * t;
}

function genLevel(seed) {
  const R = rngFrom(seed);
  const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const chance = p => R() < p;
  const pickOne = a => a[Math.floor(R() * a.length)];

  const nF = ri(GEN.minFloors, GEN.maxFloors);
  const floors = [];
  for (let i = 0; i < nF; i++) floors.push(GEN.topY + i * GEN.floorH);

  const NAME_POOL = ['地表', '浅井', '箱室', '冰廊', '深窟', '暗廊', '裂谷'];
  const layerCN = floors.map((_, k) => (k === nF - 1 ? '门厅' : NAME_POOL[Math.min(k, NAME_POOL.length - 1)]));

  /* ================= ① 下行口 =================
     槽位轮转保证相邻两层不同槽，同层两个口天然不重叠。 */
  const layers = [];
  let prevSlots = [];
  for (let k = 0; k < nF - 1; k++) {
    let free = [0, 1, 2].filter(s => prevSlots.indexOf(s) < 0);
    for (let i = free.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); const t = free[i]; free[i] = free[j]; free[j] = t; }
    if (!free.length) free = [0, 1, 2];

    const want = (free.length >= 2 && chance(0.34)) ? 2 : 1;
    const depth = nF > 2 ? k / (nF - 2) : 0;
    const holes = [];
    for (let i = 0; i < want; i++) {
      const slot = free[i];
      const s0 = GEN.slots[slot][0], s1 = GEN.slots[slot][1];
      const w = chance(0.30) ? 144 : 96;
      const x = s0 + 48 * ri(0, Math.max(0, Math.floor((s1 - s0 - w) / 48)));
      const r = R();
      /* **冰封的洞只从第 3 层开始。** 前面几层玩家还没有大球，
         拿冰封口等于直接关死这条路；而且冰墙这个语言要先在别处教过。 */
      let cover = 'frost';
      if (k >= 2 && r < 0.14 + depth * 0.22) cover = 'ice';
      else if (r < 0.42 + depth * 0.12) cover = 'none';
      holes.push({ slot, x, w, cover, floorY: floors[k] });
    }
    holes.sort((a, b) => a.x - b.x);
    layers.push({ floorY: floors[k], holes });
    prevSlots = holes.map(h => h.slot);
  }
  layers.push({ floorY: floors[nF - 1], holes: [] });      // 门厅：没有下行口

  /* ================= ② 地板段 =================
     被洞切开。段宽决定了这一层能不能放平台/怪。 */
  function segsOf(floorY, holes) {
    const out = [];
    let cx = 0;
    for (const h of holes) {
      if (h.x > cx) out.push({ x: cx, y: floorY, w: h.x - cx, h: GEN.thick });
      cx = h.x + h.w;
    }
    if (cx < 960) out.push({ x: cx, y: floorY, w: 960 - cx, h: GEN.thick });
    return out;
  }
  layers.forEach(l => { l.segs = segsOf(l.floorY, l.holes); });

  /* **出生点 x 在这里就得定下来。**
     原来是最后一步才算的，于是 ⑥ 放怪时根本不知道出生点在哪 ——
     结果开局有一只怪站在玩家 30px 旁边，一进关就掉血（出图放大才看见）。
     它只依赖第一层的地板段，所以能提前算。 */
  const startSeg = layers[0].segs.filter(s => s.w >= 120)[0] || layers[0].segs[0];
  const startX = Math.round(clamp(startSeg.x + 36, 40, Math.max(40, startSeg.x + startSeg.w - 44)));

  /* ================= ③ 地形 =================
     平台（跳得上，高差 114 < 跳高 123）和斜坡（**走上去，不用跳**）。
     斜坡只在"接平台"时出现得最多：它把"上台"这件事拆成两种解法，
     跳跃之外多一条路。偶尔也放一条孤坡当起伏。 */
  layers.forEach((l, k) => {
    const out = [];
    if (k < nF - 1) {
      /* **两处都要避开：上一层的落点带（会被接在半空）、本层的洞口（会把路盖住）。**
         只避开落点带的话，平台或斜坡会正好架在洞口上 ——
         尤其"敞开"型洞口，本来就是让玩家靠眼睛找的，被一块平台压住之后
         这一层根本没有出口可用了。 */
      const dz0 = (k > 0 ? layers[k - 1].holes.map(h => [h.x - 24, h.x + h.w + 24]) : [])
        .concat(l.holes.map(h => [h.x - 24, h.x + h.w + 24]));
      /* **一个 [x, x+w) 是否两道带都躲开了。**
         所有地形（平台、配套坡、孤坡）都必须先过这一关再落位 ——
         第一版只有平台本体过了，坡是"延伸出去"的（`px + w` 往右、`px - rw`
         往左），那一段压根没验；孤坡更是一路裸奔，`rx` 直接 48..912 随便取。
         结果就是坡横跨在洞口上，把唯一的出口盖掉。 */
      const freeOf = (x, w) => !dz0.some(z => x < z[1] && x + w > z[0]);

      const wide = l.segs.filter(s => s.w >= 240);
      const wantRamp = chance(0.55);
      const RAMP_W = 144;
      let placed = false;
      if (wide.length && chance(0.62)) {
        /* **候选段池按"平台 + 坡"的总宽挑。**
           只要平台的话 240 就够，可一旦带坡，平台 144~192 + 坡 144
           就是 288~336 —— 从 240 宽的段里随机取位，坡**必然**跨到段尾外面，
           而段尾外面就是洞口，`freeOf` 一路否掉，重试 12 次也全白跑。
           这正是"平均每关只有 1.3 条坡、四分之一的关一条坡都没有"的原因。 */
        const pool0 = wantRamp ? wide.filter(s => s.w >= 192 + RAMP_W) : wide;
        const pool = pool0.length ? pool0 : wide;
        /* **位置重试，不是"撞上就整块丢掉"。**
           落点带上不能有地形（会把人接在半空），但直接丢弃的话，
           一半以上的层会连一台平台都没有 —— 地形多样性直接没了。 */
        for (let t = 0; t < 12 && !placed; t++) {
          const cand = pickOne(pool);
          const cw = 48 * ri(3, 4);
          const room = Math.max(0, Math.floor((cand.w - cw) / 48));
          const cx = cand.x + 48 * ri(0, room);
          if (!freeOf(cx, cw)) continue;
          const py = l.floorY - 114;
          /* **坡和平台是一个整体，要么整段放得下，要么这个坡不要。**
             先随机排左右顺序，再挑第一个"整段都在本层地板里、且不压洞口"
             的一边 —— 不能先定边再验，否则随机选中的那一边正好压洞口时，
             只能把整台平台一起扔掉。 */
          let ramp = null;
          if (wantRamp) {
            const sides = chance(0.5) ? ['R', 'L'] : ['L', 'R'];
            for (const sd of sides) {
              if (sd === 'R' && cx + cw + RAMP_W <= cand.x + cand.w && cx + cw + RAMP_W <= 912 && freeOf(cx + cw, RAMP_W)) {
                /* 坡在平台右侧：左端接台面（高），右端接地面（低）→ rise 为负 */
                ramp = { x: cx + cw, y: py, w: RAMP_W, h: GEN.thick, base: l.floorY, rise: py - l.floorY, kind: 'ramp' };
                break;
              }
              if (sd === 'L' && cx - RAMP_W >= cand.x && cx - RAMP_W >= 48 && freeOf(cx - RAMP_W, RAMP_W)) {
                /* 坡在平台左侧：左端接地，右端接台面 → rise 为正 */
                ramp = { x: cx - RAMP_W, y: l.floorY, w: RAMP_W, h: GEN.thick, base: l.floorY, rise: l.floorY - py, kind: 'ramp' };
                break;
              }
            }
            /* 带坡的这次没谈成就不算数，换位置重来 —— 否则会出现
               "平台摆在段中间、两边都是空地却没有坡"的怪形状。 */
            if (!ramp) continue;
          }
          out.push({ x: cx, y: py, w: cw, h: 18 });
          if (ramp) out.push(ramp);
          placed = true;
        }
      }
      if (!placed && chance(0.30)) {
        /* **孤坡必须是"上坡 + 下坡"两段,不能是一条单边楔子。**
           单边楔子的高端悬空:一堵 76px 的垂直墙(斜坡不做水平阻挡,
           因为整块包围盒会造成"坡变成墙"),玩家从高端那头走进来会直接
           穿进坡里;雪线的圆头还会从墙角探出来一截,像长了个嘴。
           拆成两段之后两个低端都落回本层地面,坡度也对称 ——
           球顺着滚会先减速再加速,正好是"起伏"该有的手感。 */
        const MOUND_W = 96, MOUND_RISE = 64;
        for (let t = 0; t < 8; t++) {
          const rx = 48 * ri(1, Math.floor((912 - MOUND_W * 2) / 48));
          if (!freeOf(rx, MOUND_W * 2)) continue;
          out.push({ x: rx, y: l.floorY, w: MOUND_W, h: GEN.thick, base: l.floorY, rise: MOUND_RISE, kind: 'ramp' });
          out.push({ x: rx + MOUND_W, y: l.floorY - MOUND_RISE, w: MOUND_W, h: GEN.thick, base: l.floorY, rise: -MOUND_RISE, kind: 'ramp' });
          break;
        }
      }
    }
    /* **地形不能压在落点带上。**
       平台上如果还放着一口箱子，从上一层掉下来的人会被它接在半空 ——
       砸开洞口只掉一个箱子的高度（48px），玩家就卡在那儿了。
       校验只查了"洞正下方是下一层地板"，管不到"中途有没有东西接着"。 */
    const dz = k > 0 ? layers[k - 1].holes.map(h => [h.x - 24, h.x + h.w + 24]) : [];
    l.terrain = out.filter(t => !dz.some(z => t.x < z[1] && t.x + t.w > z[0]));
  });

  /* ================= ④ 箱子 ================= */
  const boxes = [];
  const B = (x, y, mat, opt) => boxes.push({
    x, y, w: 48, h: 48, mat,
    hp: NUM.box[mat].hp, dead: false, hitT: 0, taught: false,
    frost: !!(opt && opt.frost),
  });

  /** 这一层的落点带：上一层洞口正下方。**不能摆箱子** ——
      砸开上层，剩下那口盖板会顺着洞塌下来，跟这里的箱子叠在同一格就穿模了。 */
  function dropZones(k) {
    const out = [];
    if (k > 0) for (const h of layers[k - 1].holes) out.push([h.x - 24, h.x + h.w + 24]);
    return out;
  }

  /* ---- 门厅先摆：门壳 + 喂球箱 ----
     **必须先摆。** 先平铺再补喂球的话，两边会抢同一格：撞出"一格叠两口箱"
     的假象，而且一旦抢输就凑不够 3 口 —— 玩家把怪清光之后就是死局。
     顺序本身就是一条正确性约束，不是排版偏好。 */
  const lastY = floors[nF - 1];
  const doorX = 48 * ri(12, 17);
  const door = { x: doorX, y: lastY - 92, w: 48, h: 92, open: false, openT: 0 };
  const hallTaken = [];        // 门厅里已被占掉的 x，平铺要避开
  for (const cx of [doorX - 48, doorX]) {
    B(cx, lastY - 48, 'ice');
    B(cx, lastY - 96, 'ice');
    hallTaken.push(cx);
  }
  hallTaken.push(doorX - 96);  // 门前留一格空地，不然打不开的门等于墙
  /* 喂球木箱。**这是战斗力的兜底**：球砸箱会吸木屑长大，玩家把怪清光了
     也能靠拆这几口把球喂到破冰墙的档位。没有它们，清光怪 = 永久卡关。 */
  {
    const hallZones = layers[nF - 2].holes.map(h => [h.x - 24, h.x + h.w + 24]);
    const all = [];
    for (let x = 48; x + 48 <= doorX - 96; x += 48) all.push(x);
    const free = all.filter(x => !hallZones.some(z => x < z[1] && x + 48 > z[0]));
    /* 两轮：先避开落点带，不够 3 个就放宽。**落点带只是防"塌下来的盖板箱
       跟这里的箱子穿模"，是观感问题；喂球箱数量是死局问题。观感可以让一步。** */
    const src = free.length >= 3 ? free : all;
    /* 随机取 3 个，**彼此间隔 >= 96** —— 挨着摆会连成一堵墙，
       把"从左走到门"的路堵掉；而等距取值在候选数不是 3 的整数倍时
       会取重，凑不满 3 个（第一版就是这样漏了两关的死局线）。 */
    const picks = [];
    for (let t = 0; t < 40 && picks.length < 3 && src.length; t++) {
      const x = src[Math.floor(R() * src.length)];
      if (picks.some(p => Math.abs(p - x) < 96)) continue;
      picks.push(x);
    }
    // 兜底：门右侧
    for (let x = doorX + 96; picks.length < 3 && x + 48 <= 912; x += 48) {
      if (picks.some(p => Math.abs(p - x) < 96)) continue;
      picks.push(x);
    }
    for (const x of picks) { B(x, lastY - 48, 'wood'); hallTaken.push(x); }
    if (picks.length) B(picks[0], lastY - 96, 'wood');    // 叠一口，给"箱子能堆"一个样本
  }

  layers.forEach((l, k) => {
    const dz = dropZones(k);
    const isHall = k === nF - 1;
    let nBox = 0;
    const wantBox = 9 + ri(0, 4);        // 每层 9~13 口（不含本层洞口的盖板）
    const pWood = Math.max(0.30, 1 - k * 0.13);
    /* **普通箱子不出冰。**
       冰在这一关里只有两个意思：封住下行口的墙、包住门的外壳。
       让它也当普通材质之后，"这是一堵墙"和"这是一口能砸的箱子"
       长得一模一样，玩家每次看到冰都得先撞一下才知道 ——
       一种视觉语言一旦有两种解释，就等于没有。 */
    const matRoll = () => {
      const r = R();
      if (r < pWood) return 'wood';
      if (r < pWood + (1 - pWood) * 0.55) return 'stone';
      return k >= 3 ? 'iron' : 'stone';
    };

    /* 洞的盖板。frost = 盖板箱本身既是线索也是锁；ice = 冰墙（子弹无效）；
       none = 敞着，走过去直接掉 —— 这三句是这一关全部的关卡语言。 */
    for (const h of l.holes) {
      if (h.cover === 'frost') {
        for (let x = h.x; x < h.x + h.w; x += 48) B(x, l.floorY - 48, 'wood', { frost: true });
      } else if (h.cover === 'ice') {
        for (let x = h.x; x < h.x + h.w; x += 48) {
          B(x, l.floorY - 48, 'ice');
          B(x, l.floorY - 96, 'ice');
        }
      }
    }

    /* 本层"已经占掉的格子"。门厅的门壳/喂球箱、以及下面砌的箱阶都记在这里，
       随机平铺要绕开 —— 否则箱阶上会再摞出一列三格，直接变成墙。 */
    const blockedX = isHall ? hallTaken.slice() : [];

    /* ---- 箱阶：用箱子**砌**出一段路 ----
       用户原话「你甚至都可以用木箱子作为路况」。这话点到了要害：
       地形是"长出来的"，箱子是"砌出来的" —— 在一个箱子世界里，
       后者才像有生物住过的地方，也才有"可以拆"的空间玩法
       （想拆就拆、不想拆就踩着过，两条路都成立）。
       **高度封顶 2 格（96）**：跳高 123 吃得下，所以它永远是一段路，
       不会变成一道墙把这一层隔断。
       **必须排在随机平铺之前** —— 反过来的话，格子早被 58% 概率的
       随机箱子占掉，四连格同时空的概率只剩 3%，砌阶几乎永远落不下来。 */
    if (!isHall && chance(0.55)) {
      const pat = chance(0.5) ? [1, 2, 2, 1] : [1, 2, 1];
      const starts = [];
      for (const s of l.segs) {
        for (let x = Math.ceil(s.x / 48) * 48; x + 48 * pat.length <= s.x + s.w - 20; x += 48) starts.push(x);
      }
      for (let t = 0; t < 24 && starts.length; t++) {
        const bx0 = starts.splice(Math.floor(R() * starts.length), 1)[0];
        let ok = true;
        for (let i = 0; i < pat.length && ok; i++) {
          const cx = bx0 + i * 48;
          if (dz.some(d2 => cx < d2[1] && cx + 48 > d2[0])) ok = false;
          if (l.terrain.some(t2 => t2.kind === 'ramp' && t2.x - 12 < cx + 48 && t2.x + t2.w + 12 > cx)) ok = false;
        }
        if (!ok) continue;
        for (let i = 0; i < pat.length; i++) {
          const m = matRoll();
          for (let j = 0; j < pat[i]; j++) B(bx0 + i * 48, l.floorY - 48 * (j + 1), m);
          blockedX.push(bx0 + i * 48);
          nBox++;
        }
        break;
      }
    }

    // 平铺 + 偶尔叠一层。**叠层最多 2 格** —— 跳高 123、箱高 48，
    // 两格 96 跳得过去，三格 144 就是一道墙，会把路彻底堵死。
    /* **计数必须是"本层"的，不能用 boxes.length。**
       第一版拿全局长度当上限，第二层就把配额吃满了，
       后面几层只剩盖板箱 —— 层数越多越空，正好和"很多木箱"相反。 */
    /* **地板上的箱子要给斜坡让位。**
       坡是从斜面一直填充到地面的实心楔子，箱子铺在它的 x 区间里就会
       半截插进坡里（出图里能看到一口木箱横插在上坡面上）。
       平台不用让 —— 平台底面在 floorY-96，箱子顶在 floorY-48，本来就不碰。 */
    const rampRanges = l.terrain.filter(t => t.kind === 'ramp').map(t => [t.x, t.x + t.w]);

    for (const s of l.segs) {
      if (nBox >= wantBox) break;
      /* **起点必须 48 对齐。** 写成 `s.x + 24` 的话，格子落在 24/72/120…
         这些半格位置，门厅的 `hallTaken`（记的是 48 的倍数）就永远命中不了 ——
         于是有一口箱子正好盖在门框上，门壳砸光了门还是"被挡住"，
         玩家在门厅转半天也过不了关。 */
      const x0 = Math.ceil(s.x / 48) * 48;
      for (let x = x0; x + 48 <= s.x + s.w - 20; x += 48) {
        if (nBox >= wantBox) break;
        if (blockedX.indexOf(x) >= 0) continue;
        if (!chance(0.58)) continue;
        if (dz.some(d => x < d[1] && x + 48 > d[0])) continue;
        if (rampRanges.some(r => x < r[1] && x + 48 > r[0])) continue;
        const m = matRoll();
        B(x, l.floorY - 48, m);
        nBox++;
        if (chance(0.20)) { B(x, l.floorY - 96, m === 'ice' ? 'wood' : m); nBox++; }
      }
    }

    // 平台上顺手放一口
    for (const t of l.terrain) {
      if (t.kind === 'ramp') continue;
      if (chance(0.55)) B(t.x + 12, t.y - 48, matRoll());
    }

  });

  /* ================= ⑥ 怪 =================
     `y` 是**头顶**，站在 y=K 的地面上就写 K-30，写真 K 会埋进地里。 */
  const spawns = [];
  layers.forEach((l, k) => {
    const want = (k === nF - 1) ? 3 : (chance(0.26) ? 2 : 1);
    const segs = l.segs.filter(s => s.w >= 96);
    if (!segs.length) return;
    /* **先枚举这一层所有能站的位置，再从里面取。**
       原来是"随机试 12 次，试不到就用最后一次那个 x 硬塞"，于是怪会被塞进
       雪包里：脚的 y 停在坡底，坡面却高出一大截，垂直贴面判据
       （`prevBottom <= top + 14`）永远不成立，它一辈子站在坡体内部，
       画面上就是半个身子埋进雪山。"试 N 次就认"永远有这个尾巴。

       更要命的是那个箱子判据原来**没有 y 上界**：`b.y + b.h > l.floorY - 90`
       对**下面每一层**的箱子都成立，等于"本层地面被全场的箱子铺满"，
       12 次重试几乎次次失败 —— 这才是硬塞的真正原因。 */
    let cands = [];
    for (const s of segs) {
      for (let cx = s.x + 16; cx + 40 <= s.x + s.w; cx += 8) {
        if (k === 0 && Math.abs(cx - startX) < 130) continue;   // 开局别贴脸
        /* 箱子按"**允许蹭到边**"算（两边各让 8px）。
           按严格不接触算的话，48 宽的箱子会吃掉 82px 的 x，一层十来口
           就能把整段地板铺满 —— 结果一关会缺掉整层的怪（实测 200 关里
           有 2 关撞上）。箱子边缘蹭一下在画面上看不出来，缺怪是死局。 */
        const blocked = boxes.some(b => b.y + b.h > l.floorY - 150 && b.y + b.h <= l.floorY + 4 &&
          b.x + 8 < cx + 34 && b.x + b.w - 8 > cx);
        if (blocked) continue;
        if (l.terrain.some(t2 => t2.kind === 'ramp' && t2.x - 12 < cx + 34 && t2.x + t2.w + 12 > cx)) continue;
        cands.push(cx);
      }
    }
    if (!cands.length) return;          // 这一层真没地方，宁可少一只也不硬塞
    /* pick 用独立的池子，取完就扣掉 ±72 的范围；池子空了就退回全量。
       **门厅必须凑够 3 只**（killTarget 是硬门槛，少一只就是死局），
       所以宁可两只挨近一点，也不能少。 */
    const all = cands.slice();
    let pool = all.slice();
    for (let i = 0; i < want; i++) {
      if (!pool.length) pool = all.slice();
      const x = pool[Math.floor(R() * pool.length)];
      pool = pool.filter(c => Math.abs(c - x) >= 72);
      spawns.push({ x: Math.round(x), y: l.floorY - 30, kind: (k > 1 && chance(0.30 + k * 0.05)) ? 'runner' : 'crawler' });
    }
  });

  /* ================= ⑦ 装饰 =================
     钟乳石挂在天花板上。天花板 = 上一层地板底面 = floors[k-1] + 40。
     **必须避开所有洞** —— 洞里挂石头，正好挡住"下面是哪"那一眼。 */
  const deco = [];
  for (let k = 1; k < nF; k++) {
    const ceilY = floors[k - 1] + GEN.thick;
    /* **步长不能恒定。** 原来是每 58px 一根、粗细也差不多 ——
       排下来是一排等距锯齿，一眼就是程序画的。现在步长、粗细、长短
       都按坐标散开，还会挖掉 26% 的空位，长出来是"一簇一簇"的。 */
    for (let x = 12 + (k * 37) % 46; x < 936;) {
      const w = 10 + ((x * 7 + k * 13) % 26);
      const hh = 12 + ((x * 13 + k * 7) % 46);
      const skip = ((x * 17 + k * 29) % 100) < 46;
      if (!skip && !layers[k - 1].holes.some(o => x + w > o.x && x < o.x + o.w)) {
        deco.push({ x, y: ceilY, w, h: hh, kind: 'stalac' });
      }
      x += w + 10 + ((x * 11 + k * 19) % 56);
    }
  }
  /* 冰柱丛：灰岩里全是同一种灰，需要一点**冷青色**来分离层次。
     每层两三处，长短粗细都散开 —— 一排等长的那是栅栏。 */
  for (let k = 1; k < nF; k++) {
    const cy = floors[k - 1] + GEN.thick;
    for (let i = 0; i < 3; i++) {
      const bx = 40 + ((k * 211 + i * 307) % 840);
      if (layers[k - 1].holes.some(o => bx + 70 > o.x && bx < o.x + o.w)) continue;
      for (let j = 0; j < 5; j++) {
        const ix = bx + j * 9 + ((j * 13 + k) % 5);
        deco.push({ x: ix, y: cy, w: 5 + (j % 3), h: 14 + ((j * 17 + k * 7) % 32), kind: 'icicle' });
      }
    }
  }
  /* 地面雪堆：贴着地面堆在段尾。**画在地形之后**（见 draw），
     否则会被地板盖掉 —— 它本来就是"堆在地板上"的东西。 */
  for (let k = 1; k < nF; k++) {
    for (const s of layers[k].segs) {
      if (s.w < 90) continue;
      if (((s.x + k * 37) % 100) < 42) continue;
      deco.push({ x: s.x + 3, y: floors[k], w: 26 + ((s.x + k * 11) % 36), h: 8 + ((s.x * 7 + k) % 9), kind: 'drift' });
    }
  }
  for (let x = 90; x < 940; x += 137) {
    if (Math.abs(x - doorX) < 130) continue;
    deco.push({ x, y: lastY, w: 30 + ((x * 11) % 26), h: 10 + ((x * 5) % 12), kind: 'rubble' });
  }

  /* ================= ⑧ 出生点 =================
     地表第一段地板的左侧。**不能在洞口上**，也不能头顶压着箱子。 */
  /* startX 已在 ② 之后算好（见那里的注释）。这里只负责把占位的箱子清掉。 */
  /* 出生点周围清空。**用"删箱子"而不是"往右挪"** ——
     挪的写法要在"还在段内"和"不压箱子"之间反复试，试不出来就把人推到洞上；
     直接删掉占位的那口箱子，一步到位，而且玩家永远看不出区别。 */
  for (let i = boxes.length - 1; i >= 0; i--) {
    const b = boxes[i];
    /* **y 的上界不能省。** 第一版只写了"底边在地表以上 140 以内"，
       而这句话对深层恒真（门厅的箱子当然比地表低得多），
       结果地表清箱子时把整张图里 x 靠近出生点的箱子全删了 ——
       门厅的喂球箱就这样少了两口，直接踩死局线。 */
    if (b.x < startX + 44 && b.x + b.w > startX - 14 &&
        b.y + b.h > GEN.topY - 140 && b.y < GEN.topY + 20) boxes.splice(i, 1);
  }

  const plats = [];
  layers.forEach(l => {
    for (const s of l.segs) plats.push(s);
    for (const t of l.terrain) plats.push(t);
  });

  WORLD_H = lastY + GEN.thick + 40;
  GROUND_Y = lastY;
  FLOORS = floors;
  LAYER_CN = layerCN;
  LAYERS = layers;
  /* 所有洞的 x 区间，按层序扁平展开（只在断言里用）。
     **别拿它的下标当层号** —— 一层的洞可能有两个，下标和层号会错位；
     要"第 k 层的洞"请用 LAYERS[k].holes。 */
  HOLES = [];
  layers.forEach(l => l.holes.forEach(h => HOLES.push([h.x, h.x + h.w])));

  return {
    seed, nFloors: nF,
    floors, layers, plats, boxes, deco, door, spawns,
    start: { x: startX, y: GEN.topY - 42 },
    worldH: WORLD_H, groundY: GROUND_Y,
  };
}

/** 生成后的自检。**这些不是"最好有"，是"没有就得死局"。** */
function validateLevel(L, verbose) {
  const bad = [];
  const F = L.floors, N = F.length;

  // 1. 相邻两层的洞不能重叠 —— 重叠就能一穿两层，中间那层等于不存在
  for (let k = 0; k + 1 < N; k++) {
    for (const p of L.layers[k].holes) {
      for (const q of L.layers[k + 1].holes) {
        if (p.x < q.x + q.w + 24 && q.x < p.x + p.w + 24) bad.push('洞第' + k + '/' + (k + 1) + '层重叠');
      }
    }
  }

  // 2. 每个洞正下方必须接得住（玩家宽 30，取洞内两端各内缩 20 验两次）
  for (let k = 0; k + 1 < N; k++) {
    const next = L.layers[k + 1].segs;
    for (const h of L.layers[k].holes) {
      for (const px of [h.x + 20, h.x + h.w - 20]) {
        if (!next.some(s => px >= s.x && px <= s.x + s.w)) bad.push('洞第' + k + '层没接住');
      }
    }
  }

  // 2a. 地形不能压在本层洞口上（会把唯一的出口盖住）
  for (let k = 0; k < N; k++) {
    for (const t of L.layers[k].terrain) {
      for (const h of L.layers[k].holes) {
        if (t.x < h.x + h.w + 16 && h.x < t.x + t.w + 16) bad.push('第' + k + '层地形盖住洞口');
      }
    }
  }

  // 2b. 落点带上不能有地形件（否则掉下去被平台接在半空，等于没掉）
  for (let k = 1; k < N; k++) {
    const dz = L.layers[k - 1].holes.map(h => [h.x - 24, h.x + h.w + 24]);
    for (const t of L.layers[k].terrain) {
      if (dz.some(z => t.x < z[1] && t.x + t.w > z[0])) bad.push('第' + k + '层地形接住了落点');
    }
  }

  // 3. 每层都得有洞（最后一层除外），且不能全被别的东西盖住
  for (let k = 0; k + 1 < N; k++) if (!L.layers[k].holes.length) bad.push('第' + k + '层没有出口');

  // 4. 出生点脚下是实心
  if (!L.layers[0].segs.some(s => L.start.x + 15 >= s.x && L.start.x + 15 <= s.x + s.w)) bad.push('出生点悬空');

  // 5. 门厅怪数 >= killTarget（单向关卡，一路不杀也得凑得够）
  const hallFoes = L.spawns.filter(s => s.y >= F[N - 1] - 100).length;
  if (hallFoes < NUM.killTarget) bad.push('门厅怪 ' + hallFoes + ' < 门槛 ' + NUM.killTarget);

  // 6. 门厅必须有喂球木箱（清光怪之后的唯一活路）
  const feed = L.boxes.filter(b => b.mat === 'wood' && !b.frost && b.y >= F[N - 1] - 60 && b.y <= F[N - 1]).length;
  if (feed < 3) bad.push('门厅喂球箱 ' + feed + ' < 3');

  // 7. 每层至少一只怪
  for (let k = 0; k < N; k++) {
    if (!L.spawns.some(s => s.y > (k ? F[k - 1] : 0) && s.y <= F[k])) bad.push('第' + k + '层没有怪');
  }

  // 8. 怪不能生在斜坡/雪包里（脚的 y 停在坡底、坡面却高出一截 → 永远贴在坡体内）
  for (const sp of L.spawns) {
    let k = 0;
    for (let i = 0; i < N; i++) if (sp.y <= F[i]) { k = i; break; }
    for (const t of L.layers[k].terrain) {
      if (t.kind !== 'ramp') continue;
      if (t.x - 12 < sp.x + 34 && t.x + t.w + 12 > sp.x) bad.push('第' + k + '层怪生在地形里');
    }
  }

  if (verbose && bad.length) console.log('  ✗ 校验未过：' + bad.join(' / '));
  return bad.length === 0;
}

/** 换种子重掷，直到过校验。80 次都不过就返回最后一个 —— 宁可跑起来，
    让断言把它抓出来，也不要卡在初始化里。 */
function buildLevel(seed) {
  const base = (seed == null ? 1 : seed) >>> 0;
  let last = null;
  for (let t = 0; t < 80; t++) {
    const s = (base + t * 7919) >>> 0;
    const L = genLevel(s);
    last = L;
    if (validateLevel(L)) { L.seed = s; return L; }
  }
  return last;
}

/* ---------------------------------------------------------------- 状态 */
const S = {
  t: 0,
  phase: 'play',            // play | clear
  /* 镜头。世界高 1560，屏幕 600 —— 只有跟着人往下走，才谈得上"纵深"。
     只做纵向（横向世界正好一屏宽），这样玩家永远看得见整张地图的宽度，
     不会因为横向滚动而丧失方位感。 */
  cam: { y: 0 },
  clearT: 0,
  p: null,
  foes: [], shots: [], balls: [], frags: [], texts: [], shards: [],
  boxes: [], plats: [], deco: [], door: null,
  ammo: 0, belly: 0, hp: 0, invuln: 0,
  killed: 0, killedTarget: 0,
  shake: 0, flash: 0, hitStop: 0,
  keys: {},
  // 量具：这个面板是给"跑原型"看的，不是给玩家看的
  stat: {
    shots: 0, hitFoe: 0, hitBox: 0,
    coats: 0, shotsPerCoat: [],       // 每只怪用了多少发
    boxByShot: 0, boxByBall: 0,
    ballChain: 0, ballChainMax: 0,    // 一颗球最多连碎几个
    kills: 0, killByBall: 0,
    hardHint: 0,
  },
  _taught: {},              // 首次提示只弹一次
};

/* ---------------------------------------------------------------- 初始化
   **`reset()` 不带参数是"重开这一关"，`reset(seed)` 是"换一张图"。**
   两者的区别很重要：断言里到处调 reset() 期望回到同一个状态，
   如果 reset() 每次重新掷骰子，所有"前后对比"的断言都会随机红。
   所以种子存在模块级的 LEVEL_SEED 里，只有 newLevel() 会换掉它。 */
function newLevel(seed) {
  LEVEL_SEED = (seed == null ? (Math.random() * 1e9) : seed) >>> 0;
  reset();
}

function reset(seed) {
  if (seed != null) LEVEL_SEED = seed >>> 0;
  if (LEVEL_SEED == null) LEVEL_SEED = (Math.random() * 1e9) >>> 0;
  const L = buildLevel(LEVEL_SEED);
  S.level = L;
  S.t = 0; S.phase = 'play'; S.clearT = 0;
  S.plats = L.plats;
  S.deco = L.deco || [];
  S.boxes = L.boxes.map(b => ({ ...b }));
  S.door = { ...L.door };
  S.foes = L.spawns.map(sp => makeFoe(sp.x, sp.y, sp.kind));
  S.shots = []; S.balls = []; S.frags = []; S.texts = []; S.shards = [];
  S.ammo = NUM.ammoStart;
  S.belly = NUM.bellyStart;
  S.hp = NUM.hpStart;
  S.invuln = 0;
  S.killed = 0;
  S.killedTarget = NUM.killTarget;
  S.shake = 0; S.flash = 0; S.hitStop = 0;
  S._taught = {};
  S.stat = {
    shots: 0, hitFoe: 0, hitBox: 0,
    coats: 0, shotsPerCoat: [],
    boxByShot: 0, boxByBall: 0,
    ballChain: 0, ballChainMax: 0,
    kills: 0, killByBall: 0, hardHint: 0,
  };
  S.cam = { y: 0 };
  S.p = {
    x: L.start.x, y: L.start.y, vx: 0, vy: 0,
    w: 30, h: 42, onGround: true, face: 1,
    runD: 0, lockT: 0, shotCd: 0, anim: 0, shotAnim: 0,
  };
}

/* ---------------------------------------------------------------- 敌人 */
function makeFoe(x, y, kind) {
  const fast = kind === 'runner';
  return {
    x, y, kind,
    w: 34, h: 30,
    vx: fast ? 0 : (Math.random() < 0.5 ? -1 : 1) * 90,
    vy: 0,
    hits: 0,                 // 已吃雪点数
    needAt: 0,               // 开始挨第一发时的 need 快照（量具用）
    hitT: 0,
    dead: false,
    face: 1,
    onGround: false,
    homeX: x,
    homeY: y,
    patrolT: 0,
    speed: fast ? 190 : 92,
  };
}

/* ---------------------------------------------------------------- 饱食 */
function bellyTier() {
  if (S.belly >= NUM.bellyFull) return 'full';
  if (S.belly >= NUM.bellyHalf) return 'half';
  return 'hungry';
}
function snowNeed() { return NUM.snowShots[bellyTier()]; }
const TIER_CN = { full: '满饱', half: '半饱', hungry: '全饿' };

/* ---------------------------------------------------------------- 球档位 */
function ballTier(n) {
  if (n >= 6) return 3;
  if (n >= 4) return 2;
  if (n >= 2) return 1;
  return 0;
}
const BALL_TIER_CN = ['小', '中', '大', '特大'];
function ballR(n) { return Math.min(NUM.ball.maxR, NUM.ball.baseR + NUM.ball.perAbsorb * Math.min(n, NUM.ball.maxAbsorb)); }
/** 动量。**破冰墙的判据必须是球径 × 速度，不是单看体积** ——
    否则玩家把怪清光就永远攒不出特大球，而冰墙后面是门，直接死局。 */
function ballPow(b) { return Math.abs(b.vx) * (b.r / NUM.ball.baseR); }

/* ---------------------------------------------------------------- 飘字 */
function addText(x, y, s, color, size, lifeT) {
  S.texts.push({ x, y, s, color: color || '#fff', size: size || 16, t: 0, life: lifeT || 0.9 });
}
function addFrag(x, y, n, color, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, Math.PI * 2), v = rnd(60, spd || 260);
    S.frags.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, t: 0, life: rnd(0.35, 0.8), color, r: rnd(2, 4.5) });
  }
}
function hitStop(t) { S.hitStop = Math.max(S.hitStop, t); }
/** 一次性提示。**「太硬了」只在首次弹一次**，之后靠火花 + 无裂痕表达。
    常驻文字会把屏幕变成一个一直在喊的提示板。 */
function once(key, x, y, s, color) {
  if (S._taught[key]) return;
  S._taught[key] = 1;
  addText(x, y, s, color || '#FFD08A', 16, 1.3);
}

/* ---------------------------------------------------------------- 实体碰撞 */
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
/** 场景里所有实心块：平台 + 没碎的箱子。
    **箱子必须参与碰撞** —— 它要能挡人、站人、挡子弹。
    只当贴图的话，「箱墙」这个设计就无从谈起。 */
function solids() {
  const out = S.plats.slice();
  for (const b of S.boxes) if (!b.dead) out.push(b);
  return out;
}

/** 某个 x 处、y 下方最近的可站立面。碎片落地、找回掉出世界的敌人要用。
    直接拿 GROUND_Y 当"地面"在单屏时代是对的，三层之后不对了 ——
    底层掉下来的碎片会一路穿过 L2、L3 的地面落到底。 */
function groundAt(x, y) {
  let best = WORLD_H;
  for (const s of solids()) {
    if (x < s.x || x > s.x + s.w) continue;
    const top = surfY(s, x);
    if (top < y - 6) continue;          // 只找脚底下的
    if (top < best) best = top;
  }
  return best;
}

/* ---------------------------------------------------------------- 移动体物理
   **顺序必须是「先垂直分离、再水平分离」，而且水平那一轮要跳过"站在上面"的块。**
   反过来做会出一个非常隐蔽的致命 bug：站在地面上的身体，包围盒和地面平台
   永远是重叠的（y+h 比平台顶低一丁点），水平轮会把它当成撞墙，按 vx 的符号
   推到 `s.x + s.w` 或 `s.x - o.w` —— 也就是**场地最左边或最右边**。
   第一版就是这样：所有怪在第一帧瞬移到 x=902 挤成一堆。 */
function stepBody(o, dt) {
  o.vy = Math.min(o.vy + 2100 * dt, 1250);

  // ---- 垂直
  const prevBottom = o.y + o.h;
  o.y += o.vy * dt;
  o.onGround = false;
  for (const s of solids()) {
    if (s.kind === 'ramp') {
      /* 斜坡：**只认顶面，不参与侧面阻挡。**
         横向不挡是故意的 —— 玩家走过来时脚底被下方地板托着，每一帧的
         垂直落地再把他贴回斜面，看上去就是"顺着坡走上去"，不会像台阶
         那样一格一格卡住。反过来，如果让斜坡参与水平阻挡，人会在坡脚
         撞一下停住，斜坡就退化成一堵墙。 */
      if (o.x + o.w <= s.x || o.x >= s.x + s.w) continue;
      const top = surfY(s, o.x + o.w / 2);
      /* **三个条件缺一不可：往下走 + 上一帧在坡面之上 + 这一帧确实穿过了坡面。**
         少了最后一条，人从上层往下掉、x 正好落在某个坡的区间里时，
         `prevBottom <= top + 14` 一样成立（人家在上面几十米呢），
         于是被判成"落地"，一发瞬移到那个坡顶上 —— 掉五层变成掉半层。 */
      if (o.vy >= 0 && prevBottom <= top + 14 && o.y + o.h >= top) {
        o.y = top - o.h; o.vy = 0; o.onGround = true;
      }
      continue;
    }
    if (!aabb(o, s)) continue;
    // 只认"从上方落下来"和"从下方顶上去"，侧面的事交给下一轮
    if (o.vy >= 0 && prevBottom <= s.y + 8) {
      o.y = s.y - o.h; o.vy = 0; o.onGround = true;
    } else if (o.vy < 0 && o.y < s.y + s.h) {
      o.y = s.y + s.h; o.vy = 0;
    }
  }

  // ---- 水平
  o.x += o.vx * dt;
  for (const s of solids()) {
    if (s.kind === 'ramp') continue;      // 斜坡不挡横移，见上
    if (!aabb(o, s)) continue;
    // 站在这块上面（脚底贴着顶面）就不算撞墙
    if (o.y + o.h <= s.y + 2) continue;
    if (o.vx > 0) { o.x = s.x - o.w; }
    else if (o.vx < 0) { o.x = s.x + s.w; }
    else {
      /* 静止时被挤进块里（典型场景：箱子塌下来砸在玩家头上）。
         只按 vx 的符号推开的话，vx=0 两条分支都不进，人就永远卡在箱子里动不了。
         这里按"最近的一条边"顶出去。 */
      const outTop = Math.abs(o.y + o.h - s.y);
      const outL = Math.abs(s.x + s.w - o.x);
      const outR = Math.abs(o.x + o.w - s.x);
      if (outTop < Math.min(outL, outR)) { o.y = s.y - o.h; o.vy = 0; o.onGround = true; }
      else if (outL < outR) o.x = s.x + s.w;
      else o.x = s.x - o.w;
    }
    o.vx = 0;
  }
  o.x = clamp(o.x, WALL_L, WALL_R - o.w);

  /* 兜底：真的掉出世界了才拉回来。**不能写 GROUND_Y** ——
     GROUND_Y 现在是世界最底（1500），写它等于把中层掉下去的东西
     全部瞬移到洞窟底，玩家会看到怪物凭空出现在脚边。 */
  if (o.y + o.h > WORLD_H + 80) { o.y = groundAt(o.x + o.w / 2, 0) - o.h; o.vy = 0; o.onGround = true; }
}

/* ---------------------------------------------------------------- 吐雪 */
function shoot() {
  const p = S.p;
  if (p.shotCd > 0 || S.phase !== 'play') return;
  if (S.ammo <= 0) {
    once('noammo', p.x, p.y - 40, '没雪了 · 去砸箱子', '#FF9E8E');
    return;
  }
  S.ammo--;
  S.stat.shots++;
  p.shotCd = NUM.shot.cd;
  p.lockT = NUM.shot.lock;      // 喷时不能移动：这是「喷的代价」第 ②条
  p.shotAnim = 0.18;
  S.shots.push({
    x: p.x + p.w / 2 + p.face * 16,
    y: p.y + p.h * 0.42,
    vx: p.face * NUM.shot.speed,
    t: 0, life: NUM.shot.life, r: NUM.shot.r, dead: false,
  });
  for (let i = 0; i < 3; i++) addFrag(p.x + p.w / 2 + p.face * 14, p.y + p.h * 0.42, 1, '#EAF6FF', 120);
}

function stepShots(dt) {
  for (const s of S.shots) {
    if (s.dead) continue;
    s.t += dt;
    s.x += s.vx * dt;
    if (s.t >= s.life) { s.dead = true; continue; }

    /* **命中判定必须取"最近的那个"，不能分两轮先怪后箱。**
       先怪后箱的话，怪站在箱子后面照样被打中 —— 箱子就等于没挡住子弹，
       「先清怪再推球」永远比「冻住一箭双雕」省事，整条取舍线断掉。
       雪弹一帧只走 10px，所以"最近"用一个简单比较就够。 */
    let best = null, bestD = Infinity, bestKind = null;
    for (const f of S.foes) {
      if (f.dead) continue;
      if (s.x + s.r < f.x || s.x - s.r > f.x + f.w) continue;
      if (s.y + s.r < f.y || s.y - s.r > f.y + f.h) continue;
      const d = Math.abs((f.x + f.w / 2) - s.x);
      if (d < bestD) { bestD = d; best = f; bestKind = 'foe'; }
    }
    for (const b of S.boxes) {
      if (b.dead) continue;
      if (s.x + s.r < b.x || s.x - s.r > b.x + b.w) continue;
      if (s.y + s.r < b.y || s.y - s.r > b.y + b.h) continue;
      const d = Math.abs((b.x + b.w / 2) - s.x);
      if (d < bestD) { bestD = d; best = b; bestKind = 'box'; }
    }
    /* 平台挡子弹。原来没有这一条 —— 子弹只会被 enemies / boxes 吃掉，
       于是站在台上往下喷，雪弹直接穿地板打到下面的怪。 */
    for (const pl of S.plats) {
      if (pl.kind === 'ramp') continue;        // 斜坡不挡子弹：它是地板，不是墙
      if (s.x + s.r < pl.x || s.x - s.r > pl.x + pl.w) continue;
      if (s.y + s.r < pl.y || s.y - s.r > pl.y + pl.h) continue;
      s.dead = true;
      break;
    }
    if (s.dead) continue;

    if (!best) continue;

    if (bestKind === 'foe') {
      coatFoe(best, 1);
      S.stat.hitFoe++;
    } else {
      shotBox(best, s);
    }
    s.dead = true;
  }
  S.shots = S.shots.filter(s => !s.dead);
}

function shotBox(b, s) {
  const def = NUM.box[b.mat];
  S.stat.hitBox++;
  if (def.hp === Infinity) {
    // 免疫：冒火花、一点裂痕都没有。玩家两次就懂，不需要常驻文字
    addFrag(s.x, s.y, 6, '#FFE0A0', 200);
    b.hitT = 0.12;
    S.stat.hardHint++;
    once('hard_' + b.mat, b.x + b.w / 2, b.y - 14, '太硬了', '#FFD08A');
    return;
  }
  b.hp--;
  b.hitT = 0.12;
  addFrag(s.x, s.y, 4, '#E8DCC8', 160);
  if (b.hp <= 0) breakBox(b, 'shot');
}

/* ---------------------------------------------------------------- 裹雪 */
function coatFoe(f, n) {
  if (f.dead) return;
  if (f.hits === 0) f.needAt = snowNeed();
  f.hits += n;
  f.hitT = 0.16;
  for (let i = 0; i < 4; i++) addFrag(f.x + f.w / 2, f.y + f.h / 2, 1, '#DCF0FF', 150);

  const need = f.needAt || snowNeed();
  if (f.hits >= need) {
    S.stat.shotsPerCoat.push(need);
    S.stat.coats++;
    makeBallFrom(f);
  }
}

/** 雪点满 → 变球。**这一步之后敌人就不存在了，球是唯一的击杀通道。** */
function makeBallFrom(f) {
  f.dead = true;
  S.belly = Math.max(0, S.belly - NUM.bellyPerBall);
  const n = 1;
  S.balls.push({
    x: f.x + f.w / 2, y: f.y + f.h / 2,
    vx: 0, vy: 0, r: ballR(n), absorbed: n,
    life: NUM.ball.life, onGround: false, chain: 0, hitCd: 0, dead: false,
  });
  addText(f.x + f.w / 2, f.y - 18, '裹成球了', '#9BE86E', 18, 1.1);
  S.shake = Math.max(S.shake, 5);
  hitStop(0.04);
}

/* ---------------------------------------------------------------- 推球 */
function pushBalls(dt) {
  const p = S.p;
  const runUp = clamp((p.runD || 0) / NUM.push.runFull, 0, 1);
  const pow = NUM.push.base * (1 + NUM.push.runGain * runUp);

  for (const b of S.balls) {
    if (b.dead) continue;
    const bx = { x: b.x - b.r, y: b.y - b.r, w: b.r * 2, h: b.r * 2 };
    if (!aabb(p, bx)) continue;
    // 只在玩家朝球方向推时才给速度，站着碰不推
    const dir = b.x > p.x + p.w / 2 ? 1 : -1;
    if (Math.abs(p.vx) < 10) continue;
    if (sign(p.vx) !== dir) continue;
    if (Math.abs(b.vx) >= pow) continue;
    b.vx = dir * pow;
    b.life = Math.max(b.life, NUM.ball.life * 0.6);
    if (runUp > 0.85) {
      addText(b.x, b.y - b.r - 12, '助跑推!', '#FFE9A8', 16, 0.7);
      S.shake = Math.max(S.shake, 6);
    }
  }
}

/* ---------------------------------------------------------------- 球 */
function stepBalls(dt) {
  for (const b of S.balls) {
    if (b.dead) continue;
    b.life -= dt;
    if (b.life <= 0) { burstBall(b); continue; }

    // 重力 + 水平移动
    b.vy = Math.min(b.vy + 2100 * dt, 1250);
    const prevX = b.x, prevBottom = b.y + b.r;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // --- 撞箱子。**必须先分清"从上面来"和"从侧面来"** ——
    //     只看包围盒重叠的话，球在箱顶滚也会被当成侧撞，把脚下的箱子砸了。
    for (const box of S.boxes) {
      if (box.dead) continue;
      const overlapX = b.x + b.r > box.x && b.x - b.r < box.x + box.w;
      const overlapY = b.y + b.r > box.y + 6 && b.y - b.r < box.y + box.h;
      if (!overlapX || !overlapY) continue;

      // 从上方落下 / 在箱顶滚：当作地板，不破坏
      if (prevBottom <= box.y + 10) {
        b.y = box.y - b.r; b.vy = 0; b.onGround = true;
        continue;
      }
      // 侧面撞击
      if (Math.abs(b.vx) < 40) continue;
      const dir = sign(b.vx);
      ballHitBox(b, box, dir);
      if (b.dead) break;
    }
    if (b.dead) continue;

    // --- 撞平台（左右墙 + 落地）
    for (const pl of S.plats) {
      if (pl.kind === 'ramp') {
        /* 球走坡：贴顶面，并**顺着坡自己往下滚**。
           这是全场唯一给球加的外力 —— 不加的话球能停在一段 30° 的坡上不动，
           一眼就假。顺带它把斜坡变成一条"加速跑道"：从坡顶滚下来撞箱，
           动量比平地推大得多，斜坡因此有了战术价值，不只是过路地形。 */
        if (b.x + b.r <= pl.x || b.x - b.r >= pl.x + pl.w) continue;
        const top = surfY(pl, b.x);
        /* **必须判"从上方来"（prevBottom 在坡面附近），只看 x 重叠会出事：**
           球在下面几层往右滚，只要 x 恰好落在某个上层斜坡的区间里，
           `b.y + b.r > top - 4` 就成立（球底当然在坡面以下），
           球会被一发瞬移到那个坡顶上 —— 看起来像"球凭空飞上去了"。
           加 prevBottom 之后，只有真的从坡上方落下来才贴面。 */
        if (b.vy >= 0 && prevBottom <= top + 16 && b.y + b.r > top - 4) {
          b.y = top - b.r; b.vy = 0; b.onGround = true;
          b.vx += (pl.rise > 0 ? -1 : 1) * 420 * dt;
        }
        continue;
      }
      const overlapX = b.x + b.r > pl.x && b.x - b.r < pl.x + pl.w;
      const overlapY = b.y + b.r > pl.y && b.y - b.r < pl.y + pl.h;
      if (!overlapX || !overlapY) continue;
      if (b.vy > 0 && prevBottom <= pl.y + 12) {
        b.y = pl.y - b.r; b.vy = 0; b.onGround = true;
      } else {
        b.x = prevX; b.vx *= -0.35;
      }
    }

    // --- 撞墙
    if (b.x - b.r < WALL_L) { b.x = WALL_L + b.r; b.vx = Math.abs(b.vx) * 0.45; }
    if (b.x + b.r > WALL_R) { b.x = WALL_R - b.r; b.vx = -Math.abs(b.vx) * 0.45; }

    // --- 地面摩擦
    if (b.onGround) {
      const d = NUM.ball.fric * dt;
      if (Math.abs(b.vx) <= d) b.vx = 0; else b.vx -= sign(b.vx) * d;
      b.onGround = false;
    }

    // --- 碾敌。**球是唯一的击杀通道**，这里就是那条通道的收口。
    if (Math.abs(b.vx) > 60) {
      for (const f of S.foes) {
        if (f.dead) continue;
        if (b.x + b.r < f.x || b.x - b.r > f.x + f.w) continue;
        if (b.y + b.r < f.y || b.y - b.r > f.y + f.h) continue;
        killFoe(f, b);
      }
    }
  }
  S.balls = S.balls.filter(b => !b.dead);
}

function ballHitBox(b, box, dir) {
  const def = NUM.box[box.mat];
  const pow = ballPow(b);
  const tier = ballTier(b.absorbed);

  if (pow >= def.minPow && tier >= def.minTier) {
    breakBox(box, 'ball');
    b.vx *= def.keepSpeed;          // 穿透：撞碎之后继续滚，这是爽感的来源
    b.chain++;

    /* **砸碎箱子，球要把木屑吃进去长大。**
       这条不是装饰：① 它是砸箱唯一的即时回报（不然砸箱只剩"开路"这一个理由）；
       ② 它是「怪杀光了怎么办」的兜底 —— 底层那四口木箱就是专门用来喂球的，
          没有这条机制，清光怪的玩家会永久卡在冰墙前面。 */
    const before = b.r;
    b.absorbed = Math.min(NUM.ball.maxAbsorb, b.absorbed + NUM.ball.absorbBox);
    b.r = ballR(b.absorbed);
    if (b.r > before + 1.2) {
      addText(b.x, b.y - b.r - 8, '吸木屑 · 球变大', '#CFEFFF', 14, 0.75);
    }

    S.stat.ballChain = b.chain;
    S.stat.ballChainMax = Math.max(S.stat.ballChainMax, b.chain);
    S.shake = Math.max(S.shake, 9);
    hitStop(0.045);
  } else {
    // 砸不动：反弹 + 冒火花。**「太硬」这件事必须让玩家在物理上感到**
    b.x = dir > 0 ? box.x - b.r : box.x + box.w + b.r;
    b.vx = -dir * Math.max(140, Math.abs(b.vx) * 0.4);
    addFrag(b.x, b.y, 8, '#FFE0A0', 220);
    S.shake = Math.max(S.shake, 5);
    if (box.mat === 'ice' && tier < def.minTier) {
      once('ice_tier', box.x + box.w / 2, box.y - 14, '球再大点才行', '#9AD8F5');
    } else {
      once('hard_ball_' + box.mat, box.x + box.w / 2, box.y - 14, '太硬了 · 换球砸', '#FFD08A');
    }
  }
}

function burstBall(b) {
  b.dead = true;
  addFrag(b.x, b.y, 14, '#DCF0FF', 300);
  addText(b.x, b.y - b.r - 6, '散了', '#9FB4C4', 14, 0.7);
}

function breakBox(box, how) {
  box.dead = true;
  const cx = box.x + box.w / 2, cy = box.y + box.h / 2;
  addFrag(cx, cy, how === 'ball' ? 16 : 9, box.mat === 'wood' ? '#C9A273' : '#9AA6B0', how === 'ball' ? 340 : 200);
  S.shake = Math.max(S.shake, how === 'ball' ? 10 : 3);
  if (how === 'ball') hitStop(0.05);

  if (how === 'ball') S.stat.boxByBall++; else S.stat.boxByShot++;

  // 掉弹：价值差就写在这一行
  const rate = how === 'ball' ? NUM.drop.shardByBall : NUM.drop.shardByShot;
  if (Math.random() < rate) {
    S.shards.push({ x: cx, y: cy, vy: -220, t: 0 });
  }
}

/* ---------------------------------------------------------------- 敌人 AI */
function killFoe(f, byBall) {
  if (f.dead) return;
  f.dead = true;
  S.killed++;
  S.stat.kills++;
  if (byBall) S.stat.killByBall++;
  addFrag(f.x + f.w / 2, f.y + f.h / 2, 12, '#FFC8B0', 260);
  S.shake = Math.max(S.shake, 7);
  if (byBall) {
    byBall.absorbed = Math.min(NUM.ball.maxAbsorb, byBall.absorbed + NUM.ball.absorbFoe);
    byBall.r = ballR(byBall.absorbed);
  }
  checkDoor();
}

function stepFoes(dt) {
  const p = S.p;
  for (const f of S.foes) {
    if (f.dead) continue;
    f.hitT = Math.max(0, f.hitT - dt);

    if (f.kind === 'runner') {
      const dir = (p.x + p.w / 2) > (f.x + f.w / 2) ? 1 : -1;
      f.vx = dir * f.speed;
      f.face = dir;
    } else {
      f.patrolT -= dt;
      if (f.patrolT <= 0) { f.patrolT = rnd(1.4, 2.6); f.vx = (Math.random() < 0.5 ? -1 : 1) * f.speed; }
      if (Math.abs(f.x - f.homeX) > 120) f.vx = -sign(f.x - f.homeX) * f.speed;
      f.face = sign(f.vx);
    }
    /* **怪不许走下平台。**
       三层之后这是一个很隐蔽的塌方：一只巡逻怪顺着台边走下来、再走下来，
       最后整场的怪都聚在洞窟底，上面两层变成空台子 —— 玩家爬上去只看到
       空房间，会以为这关坏了。实测 crawler 从 (740,826) 一路走到 (801,826)
       然后掉层，就是这么发生的。
       所以在台边折返。runner 也照样折返：它该在台上等你，不是自己跳崖。 */
    if (f.onGround) {
      const fy = f.y + f.h;
      const ahead = f.vx > 0 ? f.x + f.w + 6 : f.x - 6;
      if (groundAt(ahead, fy + 2) - fy > 40) f.vx = -f.vx;
    }

    /* stepBody 里已经把「水平位移 + 水平碰撞 + 重力 + 垂直落地」全做完了。
       **这里不能再补位移或重力** —— 叠上去会让速度翻倍、一帧穿过地面
       （第一版就是这么写的：crawler 直接掉出画面）。 */
    stepBody(f, dt);
    /* 掉出世界就送回**自己原来那一层**，不是送回洞窟底。
       三层之后 H 已经不是世界高度了，用 H 会把 L2 掉下去的怪
       拉到底层（离玩家 1000px 外），看起来像凭空消失了。 */
    if (f.y > WORLD_H + 80) {
      f.y = (f.homeY !== undefined ? f.homeY : f.y);
      f.x = f.homeX;
      f.vy = 0; f.hits = 0; f.needAt = 0;
    }
    f.x = clamp(f.x, WALL_L, WALL_R - f.w);

    // 撞玩家
    if (S.invuln <= 0 && aabb(p, f)) {
      hurtPlayer();
      // 贴脸保底：自己掉血，敌人吃两点雪。零弹时唯一的出路
      coatFoe(f, NUM.bodyCoat);
    }
  }
  S.foes = S.foes.filter(f => !f.dead);
}

function hurtPlayer() {
  S.hp--;
  S.invuln = NUM.hpInvuln;
  S.shake = Math.max(S.shake, 12);
  S.flash = Math.max(S.flash, 0.10);
  const p = S.p;
  p.vx = -p.face * 260;
  p.vy = -320;
  addText(p.x, p.y - 24, '-1', '#FF7E6E', 20, 0.8);
  if (S.hp <= 0) {
    // 不做死亡惩罚。缓一缓，原地满血，补一点弹 —— 卡关比失败更难受
    S.hp = NUM.hpStart;
    S.ammo = Math.min(NUM.ammoStart, S.ammo + 20);
    addText(W / 2, 220, '缓一缓 · 弹药补 20', '#9BE86E', 22, 1.6);
    S.flash = Math.max(S.flash, 0.2);
  }
}

/* ---------------------------------------------------------------- 雪之碎片 */
function stepShards(dt) {
  const p = S.p;
  for (const s of S.shards) {
    s.t += dt;
    s.vy = Math.min(s.vy + 1600 * dt, 900);
    s.y += s.vy * dt;
    const gy = groundAt(s.x, s.y) - 12;
    if (s.y > gy) { s.y = gy; s.vy = 0; }
    // 吸附
    const dx = (p.x + p.w / 2) - s.x, dy = (p.y + p.h / 2) - s.y;
    const d = Math.hypot(dx, dy);
    if (d < 90) { s.x += dx / d * 340 * dt; s.y += dy / d * 340 * dt; }
    if (d < 26) {
      s.dead = true;
      const add = Math.round(rnd(NUM.drop.shardAmmoMin, NUM.drop.shardAmmoMax));
      S.ammo = Math.min(NUM.ammoStart + 40, S.ammo + add);
      S.belly = Math.min(100, S.belly + NUM.bellyPerShard);
      addText(s.x, s.y - 12, '+' + add + ' 发', '#BFE8FF', 16, 0.9);
    }
  }
  S.shards = S.shards.filter(s => !s.dead);
}

/* ---------------------------------------------------------------- 箱子承重
   **砸掉下面一格，上面的必须塌下来。**
   不做这件事的话，玩家只要拆掉箱墙最下面一格，就能从 48px 的缝里钻过去 ——
   「砸开整面墙」立刻降级成「拆一块砖」，箱墙就不再是关卡结构了。
   顺带这也是"破坏场景"最直接的一眼反馈：整摞往下沉。 */
function stepBoxFall(dt) {
  // 从下往上处理，让链式承重一帧内算对
  const live = S.boxes.filter(b => !b.dead).sort((a, b) => b.y - a.y);
  for (const b of live) {
    let supported = false;
    /* 站在平台上？
       **容差必须是 +2 而不是 -1。** 填洞的盖板箱正好从平台边缘那一格开始
       （L3 的洞在 300，左平台到 300 结束），数学上是"刚好接触、零重叠"，
       `b.x >= s.x + s.w - 1` 会把它判成不支撑 —— 三口盖板箱于是全掉到中层，
       地表看起来是个凭空多出来的大坑。这个 bug 机器断言全绿、只有出图能看出来。 */
    for (const s of S.plats) {
      if (b.x + b.w <= s.x || b.x >= s.x + s.w) continue;
      if (Math.abs((b.y + b.h) - s.y) < 2.5) { supported = true; break; }
    }
    /* 站在别的箱子上？
       **这里的水平判定必须是严格重叠，不能给容差。** 给 2px 容差的后果：
       792 那列和 840 那列是肩并肩的（792+48 = 840），容差一开，它们就
       互认"我在你上面"，于是砸掉 840 的底座、上面那口会赖在 792 上不动，
       箱子塌落整个失效。接触和重叠是两件事，只有"夹住"那条可以认接触。 */
    if (!supported) {
      for (const o of live) {
        if (o === b) continue;
        if (b.x + b.w <= o.x || b.x >= o.x + o.w) continue;
        if (Math.abs((b.y + b.h) - o.y) < 2.5) { supported = true; break; }
      }
    }
    /* 嵌在洞里：**左右都被实心块夹住**才算支撑。
       填洞的盖板箱是"嵌"进去的，不是"站"在平台上 —— 它的箱底（528）
       和平台顶（480）根本不在同一高度，靠的是被两边的洞壁夹住。
       所以上面那两条（站在平台上 / 站在箱子上）对盖板全部失效，
       第一版没有这一条，三口盖板箱一开局就整排掉到中层，
       地表凭空多出一个大坑（机器断言全绿，只有出图能看出来）。

       **必须是"左 && 右"。** 写成"贴着一个就算"的话，竖直叠着的两块
       也会互相认作支撑 —— 砸掉 840 那列底下的冰墙，上面那口会赖在
       792 那列上不掉，箱子塌落这个设计就废了。 */
    if (!supported) {
      let left = false, right = false;
      for (const o of solids()) {
        if (o === b) continue;
        const overlapY = Math.min(o.y + o.h, b.y + b.h) - Math.max(o.y, b.y);
        if (overlapY < -2) continue;                       // y 方向根本不挨着
        if (Math.abs(o.x + o.w - b.x) <= 2.5) left = true;
        if (Math.abs(b.x + b.w - o.x) <= 2.5) right = true;
      }
      if (left && right) supported = true;
    }
    if (!supported) b.y += 900 * dt;
  }
}

/* ---------------------------------------------------------------- 门 */
/** 门是不是还被箱子盖着。
    **这是「门藏在箱子里」的唯一实现**：不看任何标记位，直接问"门这块地方
    还有没有活着的箱子"。砸掉最后一口，函数自己就变 false，门露出来。
    比维护一个 hiddenBy 数组稳得多 —— 箱子会被塌落、会被连锁砸碎，
    引用很容易失效，坐标判定永远不会。 */
function doorBlocked() {
  const d = S.door;
  if (!d) return false;
  for (const b of S.boxes) {
    if (b.dead) continue;
    if (b.x + b.w <= d.x + 1 || b.x >= d.x + d.w - 1) continue;
    if (b.y + b.h <= d.y + 1 || b.y >= d.y + d.h - 1) continue;
    return true;
  }
  return false;
}

function checkDoor() {
  if (!S.door || S.door.open) return;
  if (S.killed >= S.killedTarget) {
    S.door.open = true;
    S.door.openT = 0;
    S.flash = Math.max(S.flash, 0.16);
    S.shake = Math.max(S.shake, 10);
    addText(S.door.x + S.door.w / 2, S.door.y - 20, '门开了', '#9BE86E', 24, 1.8);
  }
}

function stepDoor(dt) {
  const d = S.door;
  if (!d) return;

  /* 门刚露出来的那一帧，给一次闪光 + 飘字。
     「砸开最后一口箱、门出现在那里」这个瞬间就是这套设计要卖的惊喜，
     它必须有声音（这里是视觉）反馈，否则玩家会以为自己眼花了。 */
  const blocked = doorBlocked();
  if (d.wasBlocked === undefined) d.wasBlocked = blocked;
  if (d.wasBlocked && !blocked) {
    d.revealT = 0;
    S.flash = Math.max(S.flash, 0.18);
    S.shake = Math.max(S.shake, 8);
    addText(d.x + d.w / 2, d.y - 18, '找到门了', '#FFE08A', 24, 1.8);
    checkDoor();
  }
  d.wasBlocked = blocked;

  if (d.open) d.openT += dt;
  if (d.open && S.phase === 'play' && !blocked) {
    if (aabb(S.p, d)) {
      S.phase = 'clear';
      S.clearT = 0;
      S.flash = Math.max(S.flash, 0.3);
    }
  }
}

/* ---------------------------------------------------------------- 输入 */
function onKey(e, down) {
  const k = e.key;
  S.keys[k] = down;
  /* R 换一关（不是重开）。**布局是随机的，重开等于没有 R 键。** */
  if (down && (k === 'r' || k === 'R')) newLevel();
  if (down && (k === 'j' || k === 'J' || k === 'k' || k === 'K')) shoot();
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(k) >= 0) e.preventDefault();
}

/* ---------------------------------------------------------------- 主步进 */
function stepPlayer(dt) {
  const p = S.p;
  if (S.phase !== 'play') { p.vx = 0; return; }

  p.shotCd = Math.max(0, p.shotCd - dt);
  p.lockT = Math.max(0, p.lockT - dt);
  p.shotAnim = Math.max(0, p.shotAnim - dt);
  S.invuln = Math.max(0, S.invuln - dt);

  const K = S.keys;
  const left = K['a'] || K['A'] || K['ArrowLeft'];
  const right = K['d'] || K['D'] || K['ArrowRight'];

  /* 喷时锁移动。这一条让「喷」有成本 —— 没有它，玩家会站在原地
     把全场喷一遍再统一推球，两个动作就彻底脱钩了。 */
  if (p.lockT > 0) {
    p.vx = 0;
    p.runD = 0;
  } else {
    let ax = 0;
    if (left) ax -= 1;
    if (right) ax += 1;
    p.vx = ax * 300;
    if (ax !== 0) { p.face = ax; p.runD = Math.min(NUM.push.runFull, p.runD + 300 * dt); }
    else p.runD = Math.max(0, p.runD - 600 * dt);
  }

  if ((K['w'] || K['W'] || K['ArrowUp'] || K[' ']) && p.onGround && p.lockT <= 0) {
    p.vy = -720;
    p.onGround = false;
  }

  stepBody(p, dt);
  p.anim += dt;
}

function step(dt) {
  dt = Math.min(dt, 1 / 30);
  if (S.hitStop > 0) { S.hitStop = Math.max(0, S.hitStop - dt); S.t += dt * 0.25; return; }

  S.t += dt;
  S.shake = Math.max(0, S.shake - 60 * dt);
  S.flash = Math.max(0, S.flash - 2.4 * dt);

  stepPlayer(dt);
  stepFoes(dt);
  stepShots(dt);
  pushBalls(dt);
  stepBalls(dt);
  stepBoxFall(dt);
  stepShards(dt);
  stepDoor(dt);

  /* 镜头。只跟纵向，缓动 8/s —— 太快会晕，太慢会掉出画面。
     夹在世界范围内，L3 顶部不会露出天空以外的空白，L1 底部不会露出世界外。 */
  const camTarget = clamp(S.p.y + S.p.h / 2 - H / 2, 0, WORLD_H - H);
  S.cam.y += (camTarget - S.cam.y) * Math.min(1, 8 * dt);
  if (Math.abs(camTarget - S.cam.y) < 0.5) S.cam.y = camTarget;

  if (S.phase === 'clear') S.clearT += dt;

  // 粒子与飘字
  for (const f of S.frags) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 900 * dt; }
  S.frags = S.frags.filter(f => f.t < f.life).slice(-400);
  for (const t of S.texts) { t.t += dt; t.y -= 26 * dt; }
  S.texts = S.texts.filter(t => t.t < t.life);
}

/* =========================================================================
   渲染
   ========================================================================= */
const COL = {
  sky1: '#C4DBE6', sky2: '#EDF4F8',
  hill: '#A2BCC7', snow: '#F4F9FC', soil: '#6F7F8A', soilDark: '#55646E',
  wood: '#C0904F', woodDark: '#94703A', woodTop: '#E4EEF3',
  stone: '#8D99A3', stoneDark: '#6C7883',
  iron: '#6B7681', ironLit: '#8F9BA6',
  ice: 'rgba(150,215,240,.72)', iceEdge: 'rgba(210,242,255,.95)',
  cat: '#F5A65B', catDark: '#D07F38',
  snowball: '#F4FBFF', snowballEdge: '#BFE0F0',
  door: '#4E7D6B', doorLock: '#C9483F',
};

function draw() {
  if (!ctx) return;
  const g = ctx;

  /* 世界外的底色。**必须先铺满再画世界** —— 镜头一往下走，屏幕上方就是
     世界 y 之外的空白，不铺底会露出画布的黑。 */
  g.fillStyle = '#101A21';
  g.fillRect(0, 0, W, H);

  g.save();

  // 震屏
  const sh = S.shake;
  if (sh > 0) g.translate(rnd(-sh, sh), rnd(-sh, sh));

  // 镜头
  g.translate(0, -S.cam.y);

  /* ---- 地表：天空 + 两道远山 ----
     画在**世界坐标**里，不固定在屏幕上。这样它们只属于地表：
     下到浅井、箱室之后天自然看不见 —— 这才是"越来越深"该有的样子。
     固定在屏幕上会让地下也顶着一片晴空。
     **底边必须卡在 380（地表板底）** —— 多画一像素，浅井里就会露出蓝天。 */
  const sky = g.createLinearGradient(0, -60, 0, 380);
  sky.addColorStop(0, '#93BDD4'); sky.addColorStop(0.5, COL.sky1); sky.addColorStop(1, COL.sky2);
  g.fillStyle = sky; g.fillRect(-40, -60, W + 80, 440);

  /* 两道山：远的淡、近的深，中间各带一条积雪线。
     单道山是"一个剪影"，两道才有"这地方有纵深"。 */
  const ridge1 = x => 258 - Math.sin(x / 205) * 44 - Math.sin(x / 74) * 13;
  const ridge2 = x => 314 - Math.sin(x / 128) * 30 - Math.sin(x / 53) * 8;
  g.fillStyle = '#B7CDD9';
  g.beginPath(); g.moveTo(-40, 400);
  for (let x = -40; x <= W + 40; x += 24) g.lineTo(x, ridge1(x));
  g.lineTo(W + 40, 400); g.closePath(); g.fill();
  g.fillStyle = '#DCEAF1';
  g.beginPath();
  for (let x = -40; x <= W + 40; x += 24) g.lineTo(x, ridge1(x));
  for (let x = W + 40; x >= -40; x -= 24) g.lineTo(x, ridge1(x) + 7);
  g.closePath(); g.fill();

  g.fillStyle = COL.hill;
  g.beginPath(); g.moveTo(-40, 400);
  for (let x = -40; x <= W + 40; x += 24) g.lineTo(x, ridge2(x));
  g.lineTo(W + 40, 400); g.closePath(); g.fill();
  g.fillStyle = 'rgba(244,249,252,.62)';
  g.beginPath();
  for (let x = -40; x <= W + 40; x += 24) g.lineTo(x, ridge2(x));
  for (let x = W + 40; x >= -40; x -= 24) g.lineTo(x, ridge2(x) + 8);
  g.closePath(); g.fill();

  /* ================= 地下 =================
     **原来是"底色铺黑、层与层之间一片漆黑"。纯黑不读作洞窟，只读作没画。**
     现在分四层叠出来：
       ① 整块岩体渐变（浅灰蓝 → 近黑，越深越暗）
       ② 两层错动的岩影（慢 35% 滚动 = 视差，制造"岩壁在更远处"）
       ③ 每一层单独画成"一个岩室"：天花板压暗、地面附近被雪反光提亮
       ④ 左右侧壁（WALL_L / WALL_R 之外是实心岩）用雪线勾边
     全在世界坐标里跟着镜头走，否则就是一张贴纸。 */
  const caveTop = GEN.topY + GEN.thick;
  const cave = g.createLinearGradient(0, caveTop, 0, WORLD_H + 60);
  cave.addColorStop(0, '#263844');
  cave.addColorStop(0.30, '#1B2B35');
  cave.addColorStop(0.65, '#15212A');
  cave.addColorStop(1, '#0C1319');
  g.fillStyle = cave;
  g.fillRect(-60, caveTop, W + 120, WORLD_H - caveTop + 80);

  // ② 视差岩影
  g.save();
  g.translate(0, S.cam.y * 0.35);
  for (let i = 0; i < 18; i++) {
    const bx = ((i * 197) % 1080) - 60;
    const by = 440 + ((i * 331) % (WORLD_H - 300));
    const bw = 130 + ((i * 89) % 230);
    const bh = 80 + ((i * 47) % 160);
    g.fillStyle = 'rgba(96,128,148,.07)';
    g.beginPath(); g.ellipse(bx, by, bw / 2, bh / 2, 0, 0, Math.PI * 2); g.fill();
  }
  g.restore();

  // ③ 每层一个岩室
  for (let k = 1; k < FLOORS.length; k++) {
    const fY = FLOORS[k];
    const cY = FLOORS[k - 1] + GEN.thick;
    const room = g.createLinearGradient(0, cY, 0, fY);
    room.addColorStop(0, 'rgba(6,11,16,.62)');       // 天花板背光
    room.addColorStop(0.35, 'rgba(38,62,76,.10)');
    room.addColorStop(0.82, 'rgba(118,166,192,.09)'); // 雪反光
    room.addColorStop(1, 'rgba(168,208,228,.13)');
    g.fillStyle = room;
    g.fillRect(WALL_L, cY, WALL_R - WALL_L, fY - cY);

    /* 沉积岩层：几条大尺度、缓慢起伏的带子，明暗交替往下压。
       没有这个，岩室就是一块纯色 —— "洞"和"没画完"长一个样。 */
    for (let i = 0; i < 4; i++) {
      const yy = cY + (fY - cY) * (0.16 + i * 0.22) + ((k * 31 + i * 17) % 12);
      g.beginPath();
      g.moveTo(WALL_L, yy);
      for (let px = WALL_L; px <= WALL_R; px += 40) {
        g.lineTo(px, yy + Math.sin(px * 0.0061 + i * 2.1 + k * 1.7) * 9);
      }
      g.lineTo(WALL_R, fY + 2); g.lineTo(WALL_L, fY + 2); g.closePath();
      g.fillStyle = i % 2 ? 'rgba(8,16,22,.17)' : 'rgba(134,174,196,.045)';
      g.fill();
    }
    /* 远景岩块。**不能用 ellipse** —— 标准椭圆在画面上读作"污渍"，
       一眼就露馅（第一版就是五个大圆斑）。用一圈抖过的顶点连成
       不规则多边形，再靠低透明度压在背景里。 */
    for (let i = 0; i < 4; i++) {
      const bx = WALL_L + ((k * 137 + i * 211) % (WALL_R - WALL_L));
      const by = cY + 34 + ((k * 71 + i * 97) % Math.max(28, (fY - cY - 80)));
      const bw = 66 + ((k * 53 + i * 61) % 120);
      const bh = 30 + ((k * 29 + i * 43) % 62);
      g.fillStyle = i % 2 ? 'rgba(146,186,208,.055)' : 'rgba(6,12,17,.20)';
      g.beginPath();
      for (let v = 0; v < 9; v++) {
        const ang = v / 9 * Math.PI * 2;
        const wob = 0.62 + 0.38 * Math.abs(Math.sin(v * 2.7 + i * 1.3 + k));
        const px = bx + Math.cos(ang) * (bw / 2) * wob;
        const py = by + Math.sin(ang) * (bh / 2) * wob;
        if (v === 0) g.moveTo(px, py); else g.lineTo(px, py);
      }
      g.closePath(); g.fill();
    }

    // ④ 侧壁：岩 + 靠内的雪边（把"可走范围"框出来）
    for (const side of [0, 1]) {
      const wx = side ? WALL_R : -60;
      const ww = side ? (W + 60 - WALL_R) : (WALL_L + 60);
      const wall = g.createLinearGradient(side ? WALL_R : WALL_L, 0, side ? WALL_R + 40 : WALL_L - 40, 0);
      wall.addColorStop(0, 'rgba(120,154,174,.26)');
      wall.addColorStop(1, 'rgba(18,28,36,.05)');
      g.fillStyle = wall;
      g.fillRect(wx, cY, ww, fY - cY);
      g.fillStyle = 'rgba(226,242,250,.20)';
      g.fillRect(side ? WALL_R - 2 : WALL_L, cY, 2, fY - cY);
    }
    // 天花板底面的一道压暗，让"上下两层"有分界
    g.fillStyle = 'rgba(6,12,17,.35)';
    g.fillRect(WALL_L, cY, WALL_R - WALL_L, 10);
  }

  /* ================= 洞里的光 =================
     **敞开的下行口一定漏光。** 这一笔同时干两件事：
     一是给地下一个光源叙事（不然全是平光，画面没有戏剧性）；
     二是"这里能下去"的最高优先级提示 —— 那几种封法里，
     只有敞开是靠眼睛找的，光就是在替玩家找。
     光柱画在地形**之前**，让地板把它自然截断；落地的光斑另画在地形之后。 */
  for (let k = 0; k + 1 < FLOORS.length; k++) {
    for (const h of LAYERS[k].holes) {
      /* **不能只看 `h.cover`。** 那是生成时的初始封法，砸开之后它不会变
         —— 结果"挖穿了却一点光都不漏"，最该有光的时刻反而没有。
         按此刻洞口上还有没有箱子来定强弱：堵着只剩一线微光，通了就整束下来。 */
      const covered = S.boxes.some(b => !b.dead && b.x < h.x + h.w && b.x + b.w > h.x &&
        b.y < h.floorY + 4 && b.y + b.h > h.floorY - 100);
      /* 堵着只剩一线微光 0.055 —— 再高就成了一块淡蓝色的板子，
         比"洞里有光"更像"贴了张色纸"。 */
      const a0 = covered ? 0.055 : 0.30;
      const y1 = FLOORS[k + 1];
      /* **一整个梯形填上去，边是硬的** —— 看起来像贴了块半透明色板。
         改成 7 层由窄到宽的梯形叠加：中间叠得厚、边缘只有一两层，
         自然就有了"光越往外越淡"的软边。这是不依赖 blur 滤镜的做法。 */
      const cxh = h.x + h.w / 2;
      for (let j = 1; j <= 7; j++) {
        const sfx = 0.40 + 0.60 * (j / 7);
        const tw = h.w * sfx + 6;
        const bw = (h.w + 84) * sfx;
        const al = a0 * 0.16;
        const lg = g.createLinearGradient(0, h.floorY, 0, y1);
        lg.addColorStop(0, 'rgba(202,236,252,' + al.toFixed(3) + ')');
        lg.addColorStop(0.45, 'rgba(200,236,252,' + (al * 0.55).toFixed(3) + ')');
        lg.addColorStop(1, 'rgba(200,236,252,0)');
        g.fillStyle = lg;
        g.beginPath();
        g.moveTo(cxh - tw / 2, h.floorY);
        g.lineTo(cxh + tw / 2, h.floorY);
        g.lineTo(cxh + bw / 2, y1);
        g.lineTo(cxh - bw / 2, y1);
        g.closePath(); g.fill();
      }
    }
  }

  // 洞窟装饰（画在平台之前，被平台/箱子自然盖住）
  for (const d of S.deco) {
    if (d.kind === 'stalac') {
      // 两侧带一点弧度，尖端再收一下 —— 直边三角形是"图标"，不是石头
      g.beginPath();
      g.moveTo(d.x, d.y);
      g.quadraticCurveTo(d.x + d.w * 0.16, d.y + d.h * 0.62, d.x + d.w * 0.5, d.y + d.h);
      g.quadraticCurveTo(d.x + d.w * 0.84, d.y + d.h * 0.62, d.x + d.w, d.y);
      g.closePath();
      const sg = g.createLinearGradient(d.x, 0, d.x + d.w, 0);
      sg.addColorStop(0, '#2A3841');
      sg.addColorStop(0.55, '#3C4D58');
      sg.addColorStop(1, '#242F37');
      g.fillStyle = sg; g.fill();
      // 尖上挂的雪
      g.fillStyle = 'rgba(220,238,248,.45)';
      g.beginPath();
      g.moveTo(d.x + d.w * 0.34, d.y + d.h * 0.62);
      g.quadraticCurveTo(d.x + d.w * 0.5, d.y + d.h * 0.92, d.x + d.w * 0.5, d.y + d.h);
      g.quadraticCurveTo(d.x + d.w * 0.62, d.y + d.h * 0.84, d.x + d.w * 0.66, d.y + d.h * 0.6);
      g.closePath(); g.fill();
    } else if (d.kind === 'icicle') {
      // 冰柱：外圈半透明青，中间一道亮芯
      g.fillStyle = 'rgba(176,222,244,.42)';
      g.beginPath();
      g.moveTo(d.x, d.y);
      g.lineTo(d.x + d.w, d.y);
      g.lineTo(d.x + d.w / 2, d.y + d.h);
      g.closePath(); g.fill();
      g.fillStyle = 'rgba(238,251,255,.65)';
      g.beginPath();
      g.moveTo(d.x + d.w * 0.32, d.y);
      g.lineTo(d.x + d.w * 0.5, d.y);
      g.lineTo(d.x + d.w / 2, d.y + d.h * 0.86);
      g.closePath(); g.fill();
    } else if (d.kind === 'drift') {
      // 地面雪堆在主装饰循环里跳过（那时地板还没画）
    } else {
      g.fillStyle = 'rgba(58,74,86,.85)';
      g.beginPath();
      g.ellipse(d.x + d.w / 2, d.y, d.w / 2, d.h, 0, Math.PI, 0);
      g.fill();
    }
  }

  // 平台
  for (const pl of S.plats) drawPlat(g, pl);

  // 洞光落在地板上的光斑（地板之后、箱子之前：箱子会站上去遮住一块，对）
  for (let k = 0; k + 1 < FLOORS.length; k++) {
    for (const h of LAYERS[k].holes) {
      const covered = S.boxes.some(b => !b.dead && b.x < h.x + h.w && b.x + b.w > h.x &&
        b.y < h.floorY + 4 && b.y + b.h > h.floorY - 100);
      if (covered) continue;
      const y1 = FLOORS[k + 1];
      const rg = g.createRadialGradient(h.x + h.w / 2, y1, 2, h.x + h.w / 2, y1, h.w * 0.95);
      rg.addColorStop(0, 'rgba(216,242,255,.20)');
      rg.addColorStop(1, 'rgba(216,242,255,0)');
      g.fillStyle = rg;
      g.beginPath(); g.ellipse(h.x + h.w / 2, y1 - 1, h.w * 0.95, 10, 0, 0, Math.PI * 2); g.fill();
    }
  }

  // 地面雪堆：地板画完才轮到它们
  for (const d of S.deco) {
    if (d.kind !== 'drift') continue;
    g.fillStyle = 'rgba(244,250,253,.96)';
    g.beginPath(); g.ellipse(d.x + d.w / 2, d.y + 1, d.w / 2, d.h, 0, Math.PI, 0); g.fill();
    g.fillStyle = 'rgba(24,36,44,.10)';
    g.beginPath(); g.ellipse(d.x + d.w / 2, d.y + 2, d.w / 2 + 3, d.h * 0.35, 0, 0, Math.PI); g.fill();
  }

  // 箱子
  for (const b of S.boxes) if (!b.dead) drawBox(g, b);

  // 门
  drawDoor(g, S.door);

  // 雪之碎片
  for (const s of S.shards) {
    g.save(); g.translate(s.x, s.y); g.rotate(s.t * 3);
    g.fillStyle = '#CFEFFF';
    g.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = i / 6 * Math.PI * 2;
      g.lineTo(Math.cos(a) * 9, Math.sin(a) * 9);
      g.lineTo(Math.cos(a + 0.52) * 4, Math.sin(a + 0.52) * 4);
    }
    g.closePath(); g.fill();
    g.restore();
  }

  // 敌人
  for (const f of S.foes) drawFoe(g, f);

  // 球
  for (const b of S.balls) drawBall(g, b);

  // 雪弹
  for (const s of S.shots) {
    g.fillStyle = '#FFFFFF';
    g.globalAlpha = 0.9;
    g.beginPath(); g.arc(s.x, s.y, s.r, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 0.35;
    g.beginPath(); g.arc(s.x - s.vx * 0.012, s.y, s.r * 1.9, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 1;
  }

  // 玩家
  drawPlayer(g, S.p);

  // 粒子
  for (const f of S.frags) {
    g.globalAlpha = Math.max(0, 1 - f.t / f.life);
    g.fillStyle = f.color;
    g.fillRect(f.x - f.r / 2, f.y - f.r / 2, f.r, f.r);
  }
  g.globalAlpha = 1;

  // 飘字
  for (const t of S.texts) {
    g.globalAlpha = Math.max(0, Math.min(1, (t.life - t.t) * 3));
    g.font = '700 ' + t.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    g.textAlign = 'center';
    g.lineWidth = 4; g.strokeStyle = 'rgba(20,30,36,.55)';
    g.strokeText(t.s, t.x, t.y);
    g.fillStyle = t.color;
    g.fillText(t.s, t.x, t.y);
  }
  g.globalAlpha = 1;

  g.restore();

  /* ---- 纵向纵深：越往下越暗，光只跟着玩家走 ----
     不加这一层，三层看起来就是"同一张图上下拼了三段"，
     空格感有了、深度感还是没有。 */
  const depth = clamp(S.cam.y / (WORLD_H - H), 0, 1);
  if (depth > 0.03) {
    const px = S.p.x + S.p.w / 2;
    const py = S.p.y + S.p.h / 2 - S.cam.y;      // 已经是屏幕坐标
    /* 光圈半径 340 —— 再宽就等于没暗化（整屏都在圈里），
       再窄玩家就看不到自己要往哪走。340 大致是"能看清一跳的距离 + 一点余量"。
       **最深处的黑度上限是 0.54，不是 0.78。**
       层数从 6 变成 4~8 之后，8 层的门厅 depth 会顶到 1；
       原来那条曲线在 0.78 上，出来是一整屏黑，门和冰全糊在一起 ——
       出图才看出来。深度感靠"越往下越暗"就够，不需要真的看不见。 */
    const a = 0.10 + depth * 0.34;
    const grd = g.createRadialGradient(px, py, 90, px, py, 400);
    grd.addColorStop(0, 'rgba(8,14,20,0)');
    grd.addColorStop(0.45, 'rgba(8,14,20,' + (a * 0.3).toFixed(3) + ')');
    grd.addColorStop(1, 'rgba(8,14,20,' + a.toFixed(3) + ')');
    g.fillStyle = grd;
    g.fillRect(0, 0, W, H);
  }

  /* ---- 空气里的雪尘 ----
     屏幕坐标、纯公式驱动（不开随机），60 颗慢慢往下飘。
     这一层几乎没有性能成本，但"空气里有东西"和"空的"是完全两种画面。 */
  const T = S.t;
  for (let i = 0; i < 60; i++) {
    const sp = 12 + (i % 7) * 5;
    const px = (i * 97 + Math.sin(T * 0.5 + i) * 26 + T * 6) % (W + 40) - 20;
    const py = (i * 61 + T * sp) % (H + 40) - 20;
    const r = 0.8 + (i % 5) * 0.36;
    g.globalAlpha = 0.10 + (i % 4) * 0.05;
    g.fillStyle = '#EAF6FD';
    g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2); g.fill();
  }
  g.globalAlpha = 1;

  /* 屏幕四角的暗角。纵深暗化是**跟着玩家走的光圈**，
     这个是**固定的构图框** —— 两个都要，画面才"收得住"。 */
  const vg = g.createRadialGradient(W / 2, H * 0.46, H * 0.30, W / 2, H * 0.46, H * 0.92);
  vg.addColorStop(0, 'rgba(5,10,15,0)');
  vg.addColorStop(0.65, 'rgba(5,10,15,.14)');
  vg.addColorStop(1, 'rgba(5,10,15,.46)');
  g.fillStyle = vg;
  g.fillRect(0, 0, W, H);

  drawHud(g);

  if (S.flash > 0) {
    g.fillStyle = 'rgba(255,255,255,' + (S.flash * 0.8) + ')';
    g.fillRect(0, 0, W, H);
  }
  if (S.phase === 'clear') drawClear(g);
}

/* ---------------------------------------------------------------- 岩体
   **纹理必须每帧一模一样。** 用坐标当种子（不开 Math.random），
   否则石头会在屏幕上"沸腾"。 */
function rockFill(g, x, y, w, h, seed) {
  const grd = g.createLinearGradient(0, y, 0, y + h);
  grd.addColorStop(0, '#7E8D97');
  grd.addColorStop(0.15, '#65747E');
  grd.addColorStop(0.55, '#4A5862');
  grd.addColorStop(1, '#35424B');
  g.fillStyle = grd;
  g.fillRect(x, y, w, h);

  g.save();
  g.beginPath(); g.rect(x, y, w, h); g.clip();
  // 层理：横向的沉积带，深浅交替
  for (let i = 0, yy = y + 9; yy < y + h; i++, yy += 9) {
    g.fillStyle = i % 3 === 0 ? 'rgba(24,36,44,.20)' : 'rgba(220,236,244,.055)';
    g.fillRect(x, yy, w, i % 3 === 0 ? 2 : 1);
  }
  // 碎石点
  g.fillStyle = 'rgba(240,250,255,.10)';
  const n = Math.min(90, Math.round(w * h / 190));
  for (let i = 0; i < n; i++) {
    const px = x + ((seed * 37 + i * 131) % Math.max(1, Math.floor(w)));
    const py = y + 5 + ((seed * 53 + i * 79) % Math.max(1, Math.floor(h - 7)));
    g.fillRect(px, py, 2, 2);
  }
  g.fillStyle = 'rgba(10,18,24,.16)';
  for (let i = 0; i < n / 3; i++) {
    const px = x + ((seed * 71 + i * 197) % Math.max(1, Math.floor(w)));
    const py = y + 5 + ((seed * 29 + i * 113) % Math.max(1, Math.floor(h - 7)));
    g.fillRect(px, py, 3, 2);
  }
  g.restore();
}

/* 雪盖：顶面在碰撞面上（**不许高出去，高出去人就悬空**），
   靠左右圆角 + 起伏的边缘 + 底部的软阴影来脱掉"矩形"的机械感。 */
function snowCap(g, x, y, w, thick, seed) {
  const wob = px => Math.sin(px * 0.083 + seed) * 0.8 + Math.sin(px * 0.031) * 0.5;
  g.beginPath();
  g.moveTo(x - 2, y + thick);
  for (let px = x - 2; px <= x + w + 2; px += 8) g.lineTo(px, y + wob(px));
  g.lineTo(x + w + 2, y + thick);
  g.closePath();
  const sg = g.createLinearGradient(0, y, 0, y + thick);
  sg.addColorStop(0, '#FBFDFE');
  sg.addColorStop(0.55, '#E7F1F7');
  sg.addColorStop(1, '#CFE0EA');
  g.fillStyle = sg;
  g.fill();
  // 顶面高光
  g.beginPath();
  for (let px = x - 2; px <= x + w + 2; px += 8) {
    const py = y + wob(px);
    if (px === x - 2) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 2; g.stroke();
  // 雪盖压在岩体上的软阴影
  g.fillStyle = 'rgba(22,34,42,.16)';
  g.fillRect(x - 2, y + thick, w + 4, 4);
}

function drawRamp(g, pl) {
  const x0 = pl.x, x1 = pl.x + pl.w;
  const topL = pl.y, topR = pl.y - pl.rise;
  const base = pl.base;

  /* **上沿严格是那条直线** —— 它就是碰撞面，弧度一改人就浮空/陷进去。
     所以"自然"只能从别处来：岩体的层理、雪层的厚度变化、坡脚的积雪堆。 */
  g.save();
  g.beginPath();
  g.moveTo(x0, topL); g.lineTo(x1, topR);
  g.lineTo(x1, base + 3); g.lineTo(x0, base + 3);
  g.closePath(); g.clip();
  rockFill(g, Math.min(x0, x1), Math.min(topL, topR), pl.w, base - Math.min(topL, topR) + 4, Math.round(x0));
  g.restore();

  // 雪层：厚度沿坡起伏（坡面本来就不会厚薄均匀）
  const N = Math.max(8, Math.round(pl.w / 10));
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    pts.push([x0 + pl.w * t, topL + (topR - topL) * t]);
  }
  /* 端点顶不顶满，看那头接的是空处还是另一段坡：
     接空处就缩 2px（不然圆角会探出去像长了个嘴），
     接另一段坡就必须顶满，否则中间留一道缝。 */
  const joinsL = S.plats.some(o => o !== pl && o.kind === 'ramp' &&
    Math.abs(o.x + o.w - pl.x) < 0.5 && Math.abs(o.y - o.rise - pl.y) < 0.5);
  const joinsR = S.plats.some(o => o !== pl && o.kind === 'ramp' &&
    Math.abs(o.x - (pl.x + pl.w)) < 0.5 && Math.abs(o.y - (pl.y - pl.rise)) < 0.5);
  g.beginPath();
  for (let i = 0; i <= N; i++) {
    const [px, py] = pts[i];
    const inset = (i === 0 && !joinsL) || (i === N && !joinsR) ? 2 : 0;
    const sx = i === 0 ? px + inset : (i === N ? px - inset : px);
    if (i === 0) g.moveTo(sx, py - 1.5); else g.lineTo(sx, py - 1.5);
  }
  for (let i = N; i >= 0; i--) {
    const [px, py] = pts[i];
    const t = i / N;
    const th = 6.5 + Math.sin(t * 8.5 + pl.x * 0.05) * 2.2 + Math.sin(t * 21) * 1.1;
    g.lineTo(px, py + th);
  }
  g.closePath();
  const rsg = g.createLinearGradient(0, Math.min(topL, topR), 0, Math.max(topL, topR) + 16);
  rsg.addColorStop(0, '#FBFDFE');
  rsg.addColorStop(0.6, '#E4EFF6');
  rsg.addColorStop(1, '#CBDDE8');
  g.fillStyle = rsg;
  g.fill();
  // 上沿亮线 + 下沿投影
  g.beginPath();
  for (let i = 0; i <= N; i++) {
    const [px, py] = pts[i];
    if (i === 0) g.moveTo(px, py - 1.2); else g.lineTo(px, py - 1.2);
  }
  g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2; g.stroke();
  g.beginPath();
  for (let i = 0; i <= N; i++) {
    const [px, py] = pts[i];
    const t = i / N;
    const th = 6.5 + Math.sin(t * 8.5 + pl.x * 0.05) * 2.2 + Math.sin(t * 21) * 1.1;
    if (i === 0) g.moveTo(px, py + th); else g.lineTo(px, py + th);
  }
  g.strokeStyle = 'rgba(24,36,44,.14)'; g.lineWidth = 3; g.stroke();

  /* 坡脚：不管哪一头落地，都在那一头堆一小片雪 ——
     纯梯形是"插在地面上的几何体"，有积雪才像"雪堆出来的坡"。 */
  /* **`rise > 0` 是"右端更高"，所以低端在左（x0）。**
     这条写反过一次：两段雪包的积雪堆都跑去顶点，成了山坡正中间
     一道白色弧，看着像张嘴。 */
  const lowX = pl.rise > 0 ? x0 : x1;
  g.fillStyle = COL.snow;
  g.beginPath(); g.ellipse(lowX, base - 1, 26, 7, 0, Math.PI, 0); g.fill();
  g.fillStyle = 'rgba(24,36,44,.10)';
  g.beginPath(); g.ellipse(lowX, base + 1, 28, 4, 0, 0, Math.PI); g.fill();

  /* 坡面上再撒几处雪堆。**完美直线 + 完美三角 = 帐篷**，
     有了这几坨凸起，轮廓才不"像几何题"。凸起压在路面上 3px 左右，
     人踩上去正好是"陷进雪里"，不影响判定的观感。 */
  /* **位置和大小都要散。** 等距 + 等大的几坨连起来像一串珠子，
     比不加还假。这里用坐标算偏移，间隔 0.19~0.31 不等、半径 9~20 不等。 */
  const lumpN = pl.w >= 140 ? 4 : 3;
  for (let i = 0; i < lumpN; i++) {
    const h1 = Math.abs(Math.sin(i * 12.9898 + pl.x * 0.017)) % 1;
    const h2 = Math.abs(Math.sin(i * 78.233 + pl.x * 0.011)) % 1;
    const t = 0.10 + (i + h1 * 0.55) / (lumpN + 0.3);
    if (t > 0.94) continue;
    const px = x0 + pl.w * t;
    const py = topL + (topR - topL) * t;
    const rw = 9 + h2 * 11;
    g.fillStyle = h1 > 0.5 ? 'rgba(251,253,254,.95)' : 'rgba(238,247,252,.92)';
    g.beginPath(); g.ellipse(px, py + 1 + h2 * 3, rw, 5 + h1 * 4, 0, 0, Math.PI * 2); g.fill();
  }
}

function drawPlat(g, pl) {
  if (pl.kind === 'ramp') { drawRamp(g, pl); return; }
  const seed = Math.round(pl.x) + Math.round(pl.y);
  /* **不能用 destination-out 去"啃"底边** —— 那会把背景一起啃穿，
     露出最底层的底色，反而更像贴片。底边直接用路径画出来。 */
  g.save();
  g.beginPath();
  g.moveTo(pl.x - 1, pl.y + 9);
  g.quadraticCurveTo(pl.x - 1, pl.y + 3, pl.x + 5, pl.y + 3);
  g.lineTo(pl.x + pl.w - 5, pl.y + 3);
  g.quadraticCurveTo(pl.x + pl.w + 1, pl.y + 3, pl.x + pl.w + 1, pl.y + 9);
  g.lineTo(pl.x + pl.w + 1, pl.y + pl.h);
  for (let px = pl.x + pl.w + 1; px >= pl.x - 1; px -= 10) {
    g.lineTo(px, pl.y + pl.h - 2 + Math.sin(px * 0.07 + seed) * 3.2);
  }
  g.lineTo(pl.x - 1, pl.y + 9);
  g.closePath();
  g.clip();
  rockFill(g, pl.x - 1, pl.y + 3, pl.w + 2, pl.h + 4, seed);
  g.restore();
  snowCap(g, pl.x, pl.y, pl.w, 8, seed * 0.7);
}

function drawBox(g, b) {
  const def = NUM.box[b.mat];
  const hit = b.hitT > 0 ? 1 : 0;
  if (b.mat === 'wood') {
    g.fillStyle = hit ? '#E4C088' : COL.wood;
    rr(g, b.x, b.y, b.w, b.h, 7); g.fill();
    g.strokeStyle = COL.woodDark; g.lineWidth = 2;
    rr(g, b.x + 1, b.y + 1, b.w - 2, b.h - 2, 6); g.stroke();
    g.strokeStyle = 'rgba(140,105,55,.55)'; g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(b.x + 6, b.y + 16); g.lineTo(b.x + b.w - 6, b.y + 16);
    g.moveTo(b.x + 6, b.y + 32); g.lineTo(b.x + b.w - 6, b.y + 32);
    g.stroke();
    g.fillStyle = COL.woodTop;
    rr(g, b.x + 2, b.y - 3, b.w - 4, 8, 4); g.fill();
  } else if (b.mat === 'stone') {
    g.fillStyle = hit ? '#A8B4BE' : COL.stone;
    rr(g, b.x, b.y, b.w, b.h, 6); g.fill();
    g.strokeStyle = COL.stoneDark; g.lineWidth = 2;
    rr(g, b.x + 1, b.y + 1, b.w - 2, b.h - 2, 5); g.stroke();
    g.strokeStyle = 'rgba(80,92,102,.5)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(b.x + 12, b.y + 30); g.lineTo(b.x + 24, b.y + 22); g.lineTo(b.x + 36, b.y + 34);
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,.5)';
    g.fillRect(b.x + 8, b.y + 8, 8, 3);
  } else if (b.mat === 'iron') {
    g.fillStyle = hit ? COL.ironLit : COL.iron;
    rr(g, b.x, b.y, b.w, b.h, 5); g.fill();
    g.strokeStyle = '#4C5761'; g.lineWidth = 3;
    rr(g, b.x + 1.5, b.y + 1.5, b.w - 3, b.h - 3, 4); g.stroke();
    g.fillStyle = '#B9C4CE';
    for (const [dx, dy] of [[8, 8], [40, 8], [8, 40], [40, 40]]) {
      g.beginPath(); g.arc(b.x + dx, b.y + dy, 3, 0, Math.PI * 2); g.fill();
    }
    g.strokeStyle = 'rgba(180,196,208,.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(b.x + 12, b.y + 24); g.lineTo(b.x + 36, b.y + 24); g.stroke();
  } else if (b.mat === 'ice') {
    /* 冰墙。**它必须看起来像一整块冰，不能像瓷砖。**
       第一版是纯色填充 + 白边框 + 一条折线，四块叠在一起就是四片蓝瓷砖，
       玩家读不出"这是一堵挡路的墙"，只读到"这里贴了四块砖"。
       加渐变、气泡、斜面高光、顶面霜之后才有体积。 */
    const ig = g.createLinearGradient(b.x, b.y, b.x + b.w, b.y + b.h);
    ig.addColorStop(0, 'rgba(198,238,252,.94)');
    ig.addColorStop(0.55, 'rgba(122,196,232,.9)');
    ig.addColorStop(1, 'rgba(166,220,246,.94)');
    g.fillStyle = ig;
    rr(g, b.x, b.y, b.w, b.h, 4); g.fill();

    // 冻在里面的气泡
    g.fillStyle = 'rgba(255,255,255,.45)';
    for (const [dx, dy, r] of [[14, 13, 3], [31, 21, 2], [19, 35, 2.4], [37, 39, 1.7], [9, 27, 1.4]]) {
      g.beginPath(); g.arc(b.x + dx, b.y + dy, r, 0, Math.PI * 2); g.fill();
    }
    // 斜面高光：一道从右下贯到左上的反光
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 2.5;
    g.beginPath();
    g.moveTo(b.x + 7, b.y + b.h - 9);
    g.lineTo(b.x + 19, b.y + 15);
    g.lineTo(b.x + b.w - 7, b.y + 7);
    g.stroke();
    // 顶面霜
    g.fillStyle = 'rgba(243,253,255,.92)';
    rr(g, b.x + 2, b.y - 3, b.w - 4, 7, 3); g.fill();
    // 轮廓用深一点的冰蓝，不用白 —— 白边会把它切成独立的小块
    g.strokeStyle = 'rgba(84,164,204,.5)'; g.lineWidth = 1.5;
    rr(g, b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1, 4); g.stroke();
  }
  /* 覆霜木箱。**这是整关唯一的"能挖穿"线索** ——
     不是图标、不是箭头、不是文字，就是一层霜和几缕往上飘的寒气。
     L3 的地面为什么看起来是连续的？因为那三口箱子和地面严丝合缝，
     玩家能分出它们，靠的就是这层霜。 */
  if (b.frost) {
    g.globalAlpha = 0.5 + 0.14 * Math.sin(S.t * 2.2 + b.x * 0.03);
    g.fillStyle = '#E8F6FF';
    rr(g, b.x + 3, b.y + 2, b.w - 6, b.h - 6, 6); g.fill();
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(120,190,225,.9)'; g.lineWidth = 1.5;
    rr(g, b.x + 5, b.y + 4, b.w - 10, b.h - 10, 5); g.stroke();
    for (let i = 0; i < 3; i++) {
      const ph = (S.t * 0.5 + i * 0.34 + b.x * 0.01) % 1;
      g.globalAlpha = (1 - ph) * 0.6;
      g.fillStyle = '#DCF4FF';
      g.beginPath();
      g.arc(b.x + 11 + i * 13, b.y - 2 - ph * 22, Math.max(0.6, 2.8 - ph * 1.6), 0, Math.PI * 2);
      g.fill();
    }
    g.globalAlpha = 1;
  }

  // 拆到一半：裂痕密度跟着 HP 走，玩家能看出"还差几发"
  if (def.hp !== Infinity && b.hp < def.hp) {
    g.globalAlpha = 0.5;
    g.strokeStyle = '#5B4A32'; g.lineWidth = 1.5;
    const n = def.hp - b.hp;
    for (let i = 0; i < n; i++) {
      g.beginPath();
      g.moveTo(b.x + 8 + i * 13, b.y + 10);
      g.lineTo(b.x + 16 + i * 13, b.y + 28);
      g.lineTo(b.x + 10 + i * 13, b.y + 40);
      g.stroke();
    }
    g.globalAlpha = 1;
  }
}

function drawDoor(g, d) {
  if (!d) return;
  /* 被箱子盖着就不画。**不是画成"模糊的门"** —— 门只要露头，
     玩家就会去撞箱子试，那就又变成"逐箱砸过去"的扫图了。 */
  if (doorBlocked()) return;
  // 门框
  g.fillStyle = '#3E4A52';
  rr(g, d.x - 6, d.y - 6, d.w + 12, d.h + 6, 8); g.fill();
  g.fillStyle = d.open ? '#8FE3B4' : COL.door;
  rr(g, d.x, d.y, d.w, d.h, 6); g.fill();
  // 拱顶
  g.fillStyle = d.open ? '#B6F2CE' : '#5C8C78';
  g.beginPath(); g.arc(d.x + d.w / 2, d.y + 12, d.w / 2, Math.PI, 0); g.fill();

  if (d.open) {
    // 开锁特效：门口一团往上飘的光
    const k = Math.min(1, d.openT * 2.2);
    g.globalAlpha = 0.35 + 0.25 * Math.sin(S.t * 6);
    g.fillStyle = '#DFFFEE';
    rr(g, d.x + 4, d.y + 4, d.w - 8, d.h - 8, 5); g.fill();
    g.globalAlpha = 1;
    g.strokeStyle = '#9BE86E'; g.lineWidth = 3;
    rr(g, d.x - 3, d.y - 3, d.w + 6, d.h + 6, 8); g.stroke();
    if (k < 1) {
      g.globalAlpha = 1 - k;
      g.fillStyle = '#FFFFFF';
      g.beginPath(); g.arc(d.x + d.w / 2, d.y + d.h / 2, 30 + k * 90, 0, Math.PI * 2); g.fill();
      g.globalAlpha = 1;
    }
  } else {
    // 红锁：**未达成时门一定是锁着的**，而且锁要看得见
    g.fillStyle = COL.doorLock;
    g.beginPath(); g.arc(d.x + d.w / 2, d.y + d.h * 0.55, 9, 0, Math.PI * 2); g.fill();
    g.strokeStyle = COL.doorLock; g.lineWidth = 4;
    g.beginPath(); g.arc(d.x + d.w / 2, d.y + d.h * 0.55 - 9, 7, Math.PI, 0); g.stroke();
    g.fillStyle = '#8A2E27';
    g.fillRect(d.x + d.w / 2 - 2, d.y + d.h * 0.55, 4, 8);
  }
}

function drawFoe(g, f) {
  const cx = f.x + f.w / 2, cy = f.y + f.h / 2;
  const style = f.kind === 'runner'
    ? { body: '#C97F8C', dark: '#A05E6B' }
    : { body: '#7FA86B', dark: '#5F8450' };

  g.fillStyle = f.hitT > 0 ? '#FFFFFF' : style.body;
  rr(g, f.x, f.y, f.w, f.h, 9); g.fill();
  g.fillStyle = style.dark;
