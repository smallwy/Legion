<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>吧唧军团 · Day1 垂直切片（Web 原型）</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1b1622; color: #F4E4C1;
    font-family: "Courier New", monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #wrap { width: 960px; max-width: 98vw; }
  canvas {
    width: 100%; height: auto; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    border: 3px solid #8B5A2B; border-radius: 8px; background: #2d2438;
  }
  #hud {
    margin-top: 8px; font-size: 13px; line-height: 1.6; color: #F4E4C1;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  #hud b { color: #FFD700; }
  .key { background:#3FA34D; color:#1b1622; padding:1px 6px; border-radius:4px; font-weight:bold; }
  #note { margin-top: 6px; font-size: 11px; color: #b9a98a; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="540"></canvas>
  <div id="hud">
    <span>操作：<span class="key">W A S D</span> 移动中心点 · <span class="key">H</span> 切换「半饿最强」· 宠物自动开火</span>
    <span>击杀 <b id="kills">0</b> · 时间 <b id="time">0.0</b>s · 半饿 <b id="half">关</b></span>
  </div>
  <div id="note">Day1 垂直切片（Web 原型，CR-007/SC-001）：验证「2D + 昆虫敌人可移动 + 百炼英雄式移动中捕杀」手感与具象美术。占位精灵仅供内部试玩，发布前替换。</div>
</div>

<script>
"use strict";
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;

// ---------- 资源加载 + 洋红(#FF00FF)色键抠图 ----------
function loadImage(src){
  return new Promise((res, rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
}
function keyImage(img){
  const c = document.createElement("canvas"); c.width=img.width; c.height=img.height;
  const x = c.getContext("2d"); x.drawImage(img,0,0);
  const d = x.getImageData(0,0,c.width,c.height);
  const p = d.data;
  for(let i=0;i<p.length;i+=4){
    const r=p[i], g=p[i+1], b=p[i+2];
    if(r>200 && g<80 && b>200) p[i+3]=0; // 抠掉洋红背景
  }
  x.putImageData(d,0,0);
  return c;
}
function crop(srcCanvas, sx, sy, sw, sh){
  const c=document.createElement("canvas"); c.width=sw; c.height=sh;
  c.getContext("2d").drawImage(srcCanvas, sx,sy,sw,sh, 0,0,sw,sh);
  return c;
}

let PET=null, BUGS=[];
async function loadAssets(){
  const [petImg, bugImg] = await Promise.all([
    loadImage("assets/placeholder/sprite-pet.png"),
    loadImage("assets/placeholder/sprite-bug.png")
  ]);
  PET = keyImage(petImg);
  const sheet = keyImage(bugImg);
  const bw = Math.floor(sheet.width/3);
  BUGS = [0,1,2].map(i => crop(sheet, i*bw, 0, bw, sheet.height));
}

// ---------- 游戏状态 ----------
const player = { x: W/2, y: H/2, speed: 230, r: 10 };
const keys = {};
const pets = [];
const enemies = [];
const bullets = [];
let kills = 0, t0 = performance.now(), half = false;
let spawnTimer = 0, spawnInterval = 0.7;

function initPets(){
  // 首版 3 只环绕中心点（最多 6），各相差 120°
  for(let i=0;i<3;i++){
    pets.push({ ang: i*Math.PI*2/3, dist: 62, cd: 0, cdMax: 0.45 });
  }
}
function spawnEnemy(){
  const edge = Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){ x=-20; y=Math.random()*H; }
  else if(edge===1){ x=W+20; y=Math.random()*H; }
  else if(edge===2){ x=Math.random()*W; y=-20; }
  else { x=Math.random()*W; y=H+20; }
  const type = Math.floor(Math.random()*3); // 0步行虫 1飞虫 2甲虫
  const base = [
    { hp:2, sp:70,  r:14, dmg:0, color:"#6B8E23" },
    { hp:1, sp:120, r:12, dmg:0, color:"#C0392B" },
    { hp:6, sp:38,  r:18, dmg:0, color:"#34495E" }
  ][type];
  enemies.push({ x,y, type, hp:base.hp, sp:base.sp, r:base.r, color:base.color,
                 phase: Math.random()*Math.PI*2, t:0 });
}

function update(dt){
  // 玩家移动
  let dx=0, dy=0;
  if(keys["w"]||keys["arrowup"]) dy-=1;
  if(keys["s"]||keys["arrowdown"]) dy+=1;
  if(keys["a"]||keys["arrowleft"]) dx-=1;
  if(keys["d"]||keys["arrowright"]) dx+=1;
  if(dx||dy){ const l=Math.hypot(dx,dy); player.x+=dx/l*player.speed*dt; player.y+=dy/l*player.speed*dt; }
  player.x=Math.max(20,Math.min(W-20,player.x));
  player.y=Math.max(20,Math.min(H-20,player.y));

  // 宠物环绕 + 自动开火
  for(const p of pets){
    p.ang += dt*0.8;
    const px = player.x + Math.cos(p.ang)*p.dist;
    const py = player.y + Math.sin(p.ang)*p.dist;
    p.cx=px; p.cy=py;
    p.cd -= dt;
    if(p.cd<=0){
      // 找最近敌人
      let best=null, bd=1e9;
      for(const e of enemies){ const d=Math.hypot(e.x-px,e.y-py); if(d<bd){bd=d;best=e;} }
      if(best && bd<320){
        p.cd = p.cdMax;
        const a=Math.atan2(best.y-py, best.x-px);
        const dmg = half? 3: 2; // 半饿最强 ×1.5
        bullets.push({ x:px, y:py, vx:Math.cos(a)*420, vy:Math.sin(a)*420, r:5, dmg, life:1.2 });
      }
    }
  }

  // 敌人移动（朝中心点聚拢）
  for(const e of enemies){
    e.t+=dt;
    const a=Math.atan2(player.y-e.y, player.x-e.x);
    let mvx=Math.cos(a), mvy=Math.sin(a);
    if(e.type===1){ mvy += Math.sin(e.t*4+e.phase)*0.5; } // 飞虫蛇形
    const l=Math.hypot(mvx,mvy)||1;
    e.x += mvx/l*e.sp*dt; e.y += mvy/l*e.sp*dt;
  }

  // 子弹
  for(const b of bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    for(const e of enemies){
      if(e.hp>0 && Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){
        e.hp-=b.dmg; b.life=0;
        if(e.hp<=0){ kills++; }
        break;
      }
    }
  }
  // 清理
  for(let i=enemies.length-1;i>=0;i--){ const e=enemies[i]; if(e.hp<=0 || e.x<-40||e.x>W+40||e.y<-40||e.y>H+40) enemies.splice(i,1); }
  for(let i=bullets.length-1;i>=0;i--){ if(bullets[i].life<=0) bullets.splice(i,1); }

  // 生成
  spawnTimer+=dt;
  if(spawnTimer>=spawnInterval){ spawnTimer=0; spawnEnemy(); if(spawnInterval>0.32) spawnInterval-=0.004; }
}

function drawSprite(spr, x, y, w, h){
  if(!spr) return;
  ctx.drawImage(spr, x-w/2, y-h/2, w, h);
}

function render(){
  ctx.clearRect(0,0,W,H);
  // 草地底
  ctx.fillStyle="#2f5d33"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(63,163,77,0.25)";
  for(let i=0;i<40;i++){ const gx=(i*137)%W, gy=(i*89)%H; ctx.fillRect(gx,gy,6,6); }

  // 中心点（指挥官）标记
  ctx.strokeStyle="rgba(255,215,0,0.55)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(player.x,player.y,16,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle="#FFD700"; ctx.beginPath(); ctx.arc(player.x,player.y,4,0,Math.PI*2); ctx.fill();

  // 敌人
  for(const e of enemies){
    const sz = e.type===2? 40 : (e.type===1? 34 : 36);
    drawSprite(BUGS[e.type], e.x, e.y, sz, sz*0.5);
  }
  // 子弹
  ctx.fillStyle="#FFE9A8";
  for(const b of bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); }

  // 宠物（环绕）
  for(const p of pets){
    if(half){ ctx.strokeStyle="rgba(255,215,0,0.9)"; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.cx,p.cy,26,0,Math.PI*2); ctx.stroke(); }
    drawSprite(PET, p.cx, p.cy, 46, 46);
  }
}

function loop(){
  const now=performance.now();
  const dt=Math.min(0.033,(now-(loop.last||now))/1000); loop.last=now;
  if(PET){ update(dt); render(); }
  document.getElementById("kills").textContent=kills;
  document.getElementById("time").textContent=((now-t0)/1000).toFixed(1);
  document.getElementById("half").textContent=half?"开(×1.5)":"关";
  requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase(); keys[k]=true;
  if(k==="h"){ half=!half; }
});
window.addEventListener("keyup",e=>{ keys[e.key.toLowerCase()]=false; });

(async function(){
  try{ await loadAssets(); }catch(err){ console.error(err); }
  initPets();
  spawnEnemy(); spawnEnemy();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
